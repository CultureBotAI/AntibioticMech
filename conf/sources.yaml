# Upstream sources for the committed inventories in data/raw/.
#
# The inventories are the reproducible inputs to seeding: `just seed-apply`
# reads only data/raw/, never the network. Re-extraction is needed only when
# ChEBI or CARD publish a new release.

chebi:
  name: ChEBI
  description: >-
    Chemical Entities of Biological Interest. Compounds bearing an antimicrobial
    role, with the structures and computed properties ChEBI publishes for them.
  flat_files_base: https://ftp.ebi.ac.uk/pub/databases/chebi/flat_files/
  files:
    - compounds.tsv.gz
    - relation.tsv.gz
    - structures.tsv.gz
    - chemical_data.tsv.gz
    - database_accession.tsv.gz
    - source.tsv.gz
    - names.tsv.gz
  # 3-star entries are manually curated by the ChEBI team; 2-star entries are
  # automatically imported and are NOT seeded, because an automatic import is
  # exactly where a wrong role assertion enters unreviewed. Lowering this is a
  # curation decision, not a tuning knob.
  min_stars: 3
  # ChEBI stamps each RELATION row with its own status (1 CHECKED, 3 OK,
  # 9 SUBMITTED). `min_stars` above governs the compound ENTRY; this governs the
  # is_a and has_role edges, which is what actually decides whether a compound is
  # in scope and how it is classified. Admitting SUBMITTED edges put two
  # antiretrovirals into a corpus that excludes antivirals.
  relation_status_allowed: [1, 3]
  homepage: https://www.ebi.ac.uk/chebi/
  license: CC BY 4.0

aro:
  name: CARD Antibiotic Resistance Ontology
  description: >-
    The antibiotic molecule subtree of ARO, plus the resistance determinants and
    drug targets CARD links to those molecules.
  url: https://purl.obolibrary.org/obo/aro.obo
  molecule_root: ARO:1000003          # antibiotic molecule
  mechanism_root: ARO:1000002         # mechanism of antibiotic resistance
  # An ARO term carrying this property_value is a drug class, not an individual
  # molecule. Classes become `structural_class` / `parent_compounds`, never records.
  drug_class_marker: classified_as_drug_class
  homepage: https://card.mcmaster.ca/
  # The ONTOLOGY files (aro.obo, aro.owl) are CC BY 4.0 — verified against the
  # arpcard/aro LICENSE, GitHub's spdx_id, the OBO Foundry registry and CARD's
  # own download page. This is the only CARD file the pipeline reads.
  # card.json is NOT this licence: it carries restrictive McMaster terms that
  # prohibit reproduction by commercial organizations without written
  # permission and require the materials be used unmodified. Do not add it to
  # `files` without resolving that first (curation/source_queue.tsv, card-json).
  license: CC BY 4.0 (aro.obo; card.json is separately restricted)

pubchem:
  name: PubChem
  description: >-
    Structure fallback for ARO molecules that carry no ChEBI cross-reference.
    Network step; canary one CID before the batch (`just extract-pubchem-canary`).
  rest_base: https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/
  properties:
    - MolecularFormula
    - MolecularWeight
    - MonoisotopicMass
    - Charge
    - SMILES
    - InChI
    - InChIKey
  # PubChem asks for <=5 requests/second; we stay well under.
  requests_per_second: 3

mibig:
  name: Minimum Information about a Biosynthetic Gene Cluster
  description: >-
    Reviewed producer-organism and biosynthetic-gene-cluster assertions. The
    first import accepts only active entries with a non-placeholder changelog
    reviewer and joins compounds to the corpus by exact Standard InChIKey.
  homepage: https://mibig.secondarymetabolites.org/
  archive_url: https://zenodo.org/records/14835872/files/mibig_json_4.0.tar.gz?download=1
  archive_name: mibig_json_4.0.tar.gz
  version: 4.0.1
  license: CC BY 4.0
  # Used by MIBiG for automated migrations and legacy submissions. It is not
  # evidence that an expert reviewed the entry.
  reviewer_placeholder: AAAAAAAAAAAAAAAAAAAAAAAA

# ----------------------------------------------------------------------------
# Role scope — which ChEBI roles put a compound in this corpus.
#
# "Antimicrobial" in ChEBI spans viruses as well as cellular microbes, and this
# corpus follows it: bacteria, mycobacteria, fungi, protozoa, viruses, and the
# biocides used against them are all in scope.
#
# Antivirals do sit differently in the mechanism model — the target is a viral
# protein or a step in a replication cycle rather than a structure of a free-
# living cell, and CARD's resistance determinants do not apply to them. That is
# a reason for the mechanism vocabulary to cover both (see ModeOfActionEnum and
# TargetTypeEnum in the schema), not a reason to exclude the compounds.
#
# Antibiotic pesticides remain OUT: insecticides, acaricides and nematicides
# act on metazoa, which is a different kind of target altogether.
#
# Change scope by moving a root between the two lists and re-extracting.
# ----------------------------------------------------------------------------
role_scope:
  in_scope:
    - CHEBI:33281   # antimicrobial agent (generic)
    - CHEBI:36043   # antimicrobial drug
    - CHEBI:33282   # antibacterial agent
    - CHEBI:35718   # antifungal agent
    - CHEBI:35820   # antiprotozoal drug
    - CHEBI:48219   # disinfectant
    - CHEBI:65256   # antimicrobial food preservative
    - CHEBI:172949  # antimicrobial cosmetic preservative
    - CHEBI:22309   # alicyclic antibiotics
    - CHEBI:22311   # aliphatic antibiotics
    - CHEBI:22476   # amino acid derivative antibiotics
    - CHEBI:25605   # nucleoside antibiotic
    - CHEBI:26083   # phosphorus containing antibiotics
    - CHEBI:140190  # calcium-dependent antibiotics
    - CHEBI:22587   # antiviral agent — and its whole subtree (anti-HIV, anti-HBV, ...)
  out_of_scope:
    - CHEBI:39215   # antibiotic pesticide — insecticides/acaricides/nematicides act on metazoa

# Role CURIE -> AntimicrobialClassEnum, for the single class a record is filed
# under. Many compounds bear several roles (tetracycline is antibacterial,
# antifungal AND antiprotozoal in ChEBI); `activity_roles` keeps all of them
# unreduced, and this table only decides the filing.
#
# Lower `priority` wins. The order is not "most specific term" but "most
# specific TARGET GROUP, bacteria first": ANTIMYCOBACTERIAL is a narrower claim
# than ANTIBACTERIAL and beats it, and antibacterial activity outranks the
# others because a bacterial claim is the one this corpus is consumed for.
# Filing tetracycline under ANTIFUNGAL because "antifungal" sorted first would
# be a reporting artefact, not a fact about tetracycline.
role_to_class:
  CHEBI:33231: {class: ANTIMYCOBACTERIAL, priority: 1}   # antitubercular agent
  CHEBI:64912: {class: ANTIMYCOBACTERIAL, priority: 1}   # antimycobacterial drug
  CHEBI:35816: {class: ANTIMYCOBACTERIAL, priority: 1}   # leprostatic drug
  CHEBI:35718: {class: ANTIFUNGAL, priority: 3}          # antifungal agent
  CHEBI:86327: {class: ANTIFUNGAL, priority: 3}          # antifungal drug
  CHEBI:86328: {class: ANTIFUNGAL, priority: 3}          # antifungal agrochemical
  CHEBI:24127: {class: ANTIFUNGAL, priority: 3}          # fungicide
  CHEBI:136645: {class: ANTIFUNGAL, priority: 3}         # profungicide
  CHEBI:141153: {class: ANTIFUNGAL, priority: 3}         # quinone outside inhibitor
  CHEBI:83734: {class: ANTIFUNGAL, priority: 3}          # sterol demethylation inhibitor
  CHEBI:77884: {class: ANTIFUNGAL, priority: 3}          # sterol 14alpha-demethylase inhibitor
  CHEBI:35820: {class: ANTIPROTOZOAL, priority: 4}       # antiprotozoal drug
  CHEBI:38068: {class: ANTIPROTOZOAL, priority: 4}       # antimalarial
  CHEBI:64915: {class: ANTIPROTOZOAL, priority: 4}       # antiplasmodial drug
  CHEBI:70868: {class: ANTIPROTOZOAL, priority: 4}       # antileishmanial agent
  CHEBI:36335: {class: ANTIPROTOZOAL, priority: 4}       # trypanocidal drug
  CHEBI:35818: {class: ANTIPROTOZOAL, priority: 4}       # coccidiostat
  CHEBI:50685: {class: ANTIPROTOZOAL, priority: 4}       # antitrichomonal drug
  CHEBI:33282: {class: ANTIBACTERIAL, priority: 2}       # antibacterial agent
  CHEBI:36047: {class: ANTIBACTERIAL, priority: 2}       # antibacterial drug
  CHEBI:36050: {class: ANTIBACTERIAL, priority: 2}       # antitreponemal drug
  CHEBI:36051: {class: ANTIBACTERIAL, priority: 2}       # antisyphilitic drug
  CHEBI:73911: {class: ANTIBACTERIAL, priority: 2}       # vibriostatic agent
  # Antiviral roles, including the viral-enzyme-inhibitor terms ChEBI files
  # under the antiviral branch. Priority 5 puts them below the antibacterial,
  # antimycobacterial, antifungal and antiprotozoal claims — a compound asserted
  # against both a cellular microbe and a virus files under the cellular claim,
  # because that is what this corpus is primarily consumed for.
  #
  # It does NOT sit below BIOCIDE, which is now 6. A disinfectant role is a
  # cellular claim, so on the sentence above it should win; in practice a biocide
  # role is the least specific thing a source can say about a compound, and a
  # named antiviral target is more informative. Exactly one in-scope compound
  # carries both (CHEBI:31264 benzethonium chloride) and it is decided at
  # priority 2 by `antibacterial agent`, so nothing turns on this today.
  CHEBI:22587: {class: ANTIVIRAL, priority: 5}           # antiviral agent
  CHEBI:36044: {class: ANTIVIRAL, priority: 5}           # antiviral drug
  CHEBI:149553: {class: ANTIVIRAL, priority: 5}          # anticoronaviral agent
  CHEBI:64946: {class: ANTIVIRAL, priority: 5}           # anti-HIV agent
  CHEBI:64947: {class: ANTIVIRAL, priority: 5}           # anti-HIV-1 agent
  CHEBI:64949: {class: ANTIVIRAL, priority: 5}           # anti-HIV-2 agent
  CHEBI:64951: {class: ANTIVIRAL, priority: 5}           # anti-HBV agent
  CHEBI:64952: {class: ANTIVIRAL, priority: 5}           # anti-HSV agent
  CHEBI:64953: {class: ANTIVIRAL, priority: 5}           # anti-HSV-1 agent
  CHEBI:64954: {class: ANTIVIRAL, priority: 5}           # anti-HSV-2 agent
  CHEBI:35660: {class: ANTIVIRAL, priority: 5}           # HIV protease inhibitor
  CHEBI:53756: {class: ANTIVIRAL, priority: 5}           # HIV-1 reverse transcriptase inhibitor
  CHEBI:59886: {class: ANTIVIRAL, priority: 5}           # HIV fusion inhibitor
  CHEBI:67268: {class: ANTIVIRAL, priority: 5}           # HIV-1 integrase inhibitor
  CHEBI:71168: {class: ANTIVIRAL, priority: 5}           # HIV-1 maturation inhibitor
  CHEBI:83799: {class: ANTIVIRAL, priority: 5}           # nonstructural protein 5A inhibitor
  CHEBI:59897: {class: ANTIVIRAL, priority: 5}           # RNA-directed DNA polymerase inhibitor
  CHEBI:52629: {class: ANTIVIRAL, priority: 5}           # retroviral ribonuclease H inhibitor
  CHEBI:52425: {class: ANTIVIRAL, priority: 5}           # exo-alpha-sialidase inhibitor
  CHEBI:48219: {class: BIOCIDE, priority: 6}             # disinfectant
  CHEBI:65256: {class: BIOCIDE, priority: 6}             # antimicrobial food preservative
  CHEBI:172949: {class: BIOCIDE, priority: 6}            # antimicrobial cosmetic preservative

# ----------------------------------------------------------------------------
# ChEBI role -> ModeOfActionEnum.
#
# ChEBI asserts mechanism-shaped roles on compounds this corpus already reads,
# through the same reviewed edges everything else uses. This map turns the ones
# whose TARGET IS MICROBIAL into a mode of action.
#
# The discipline is what is NOT here. The same role space is full of
# host-directed mechanisms that say nothing about antimicrobial action, and a
# compound in this corpus can easily bear one: angiogenesis inhibitor (24
# records), acetylcholinesterase inhibitor (15), proteasome inhibitor (13),
# NF-kappaB inhibitor (12), apoptosis inhibitor (10), platelet aggregation
# inhibitor (10), P450 inhibitor (11), muscarinic and serotonergic antagonists,
# tyrosine kinase, COX-2, histone deacetylase, Hsp90. All are deliberately
# unmapped: a mode of action is a claim about how the compound kills or inhibits
# a MICROBE, and inheriting one from an unrelated pharmacology would be exactly
# the kind of confident wrongness the gates cannot see.
#
# Also unmapped on purpose, for narrower reasons:
#   CHEBI:35625 beta-lactamase inhibitor — an adjuvant mechanism against a
#     RESISTANCE enzyme, not the compound's own antimicrobial action.
#   CHEBI:83317 sterol biosynthesis inhibitor — the generic parent of the
#     ergosterol term; on its own it does not distinguish fungal ergosterol from
#     host cholesterol.
#   CHEBI:24853 intercalator, CHEBI:38161 chelator, CHEBI:37670 protease
#     inhibitor — too generic to name a target.
#   CHEBI:77402 trypanothione-disulfide reductase — trypanosomatid-exclusive and
#     a genuine antiprotozoal target, but ModeOfActionEnum has no bucket for it
#     and OTHER is not one: it carries no information, and because a distinct
#     value counts toward MULTIPLE it silently collapsed ebselen from
#     VIRAL_PROTEASE_INHIBITION to MULTIPLE. It also put a trypanosomatid
#     mechanism on clomipramine, an ANTIVIRAL record, with no caveat possible
#     since OTHER names no target group. Add a real enum value before mapping it.
#   CHEBI:71476 fatty acid synthase inhibitor — the EC refers to the human
#     FAS-I complex, not bacterial FAS-II.
#   (The three mitochondrial roles are not excluded outright — see
#     role_to_mode_of_action_eukaryotic below. A mitochondrion is a eukaryotic
#     organelle, so the claim is meaningless for a bacterium and correct for a
#     fungus, which is a conditional rather than an exclusion.)
#   CHEBI:50276 EC 5.99.1.2 (DNA topoisomerase) — ChEBI uses this EC for human
#     topo I/II poisons. CHEBI:50750 (mapped) was described here as "bacterial
#     gyrase"; it is not that narrow — see its role_target_scope entry, where its
#     own cohort of anthracyclines falsified the description.
#     and topoisomerase IV another (CHEBI:53559, mapped).
#   CHEBI:77103 dihydroorotate dehydrogenase — precursor supply rather than
#     polymer synthesis, which this schema models separately (see
#     FOLATE_PATHWAY_INHIBITION), and three of its five records are
#     host-directed: brequinar and brequinar sodium are human-DHODH
#     immunosuppressants whose antiviral effect is host pyrimidine depletion,
#     and tiratricol is a thyroid hormone analogue. Atovaquone, the fourth, has
#     its canonical mechanism elsewhere entirely (parasite cytochrome bc1).
# ----------------------------------------------------------------------------
role_to_mode_of_action:
  # --- bacterial and general cellular targets
  CHEBI:48001: PROTEIN_SYNTHESIS_INHIBITION            # protein synthesis inhibitor
  CHEBI:59517: NUCLEIC_ACID_SYNTHESIS_INHIBITION       # DNA synthesis inhibitor
  CHEBI:50750: NUCLEIC_ACID_SYNTHESIS_INHIBITION       # EC 5.99.1.3 DNA topoisomerase
                                                       # (ATP-hydrolysing) — covers the human
                                                       # enzyme as well; see role_target_scope
  CHEBI:53559: NUCLEIC_ACID_SYNTHESIS_INHIBITION       # topoisomerase IV inhibitor
  CHEBI:37416: NUCLEIC_ACID_SYNTHESIS_INHIBITION       # RNA polymerase inhibitor (rifamycins)
  CHEBI:50502: FOLATE_PATHWAY_INHIBITION               # dihydropteroate synthase (sulfonamides)
  CHEBI:50683: FOLATE_PATHWAY_INHIBITION               # dihydrofolate reductase (trimethoprim)
  CHEBI:24869: MEMBRANE_DISRUPTION                     # ionophore
  CHEBI:83741: CELL_MEMBRANE_SYNTHESIS_INHIBITION      # phospholipid biosynthesis inhibitor
  CHEBI:20854: ENERGY_METABOLISM_INHIBITION            # ATP synthase inhibitor (bedaquiline)
  CHEBI:73214: ENERGY_METABOLISM_INHIBITION            # EC 3.6.3.14 — covers the BACTERIAL F1Fo
                                                       # ATP synthase as well as the V-type, so it
                                                       # is not eukaryote-restricted
  CHEBI:83072: ENERGY_METABOLISM_INHIBITION            # succinate dehydrogenase — bacteria have
                                                       # sdhABCD, so this is not eukaryote-only
                                                       # either (3-nitropropanoic acid is the
                                                       # classic inhibitor, and antimycobacterial)
  # --- fungal targets
  CHEBI:75282: ERGOSTEROL_PATHWAY_INHIBITION           # ergosterol biosynthesis inhibitor
  CHEBI:77884: ERGOSTEROL_PATHWAY_INHIBITION           # sterol 14alpha-demethylase (azoles)
  CHEBI:59285: ERGOSTEROL_PATHWAY_INHIBITION           # squalene monooxygenase (allylamines)
  CHEBI:230471: CELL_WALL_SYNTHESIS_INHIBITION         # 1,3-beta-glucan synthase (echinocandins)
  CHEBI:59672: CELL_WALL_SYNTHESIS_INHIBITION          # chitin synthase (nikkomycins, polyoxins)
  # --- viral targets
  CHEBI:53756: VIRAL_POLYMERASE_INHIBITION             # HIV-1 reverse transcriptase
  CHEBI:59897: VIRAL_POLYMERASE_INHIBITION             # RNA-directed DNA polymerase
  CHEBI:170010: VIRAL_POLYMERASE_INHIBITION            # RNA-directed RNA polymerase
  CHEBI:52629: VIRAL_POLYMERASE_INHIBITION             # retroviral ribonuclease H (an RT domain)
  CHEBI:35660: VIRAL_PROTEASE_INHIBITION               # HIV protease
  CHEBI:147285: VIRAL_PROTEASE_INHIBITION              # SARS coronavirus main proteinase
  CHEBI:64924: VIRAL_PROTEASE_INHIBITION               # hepatitis C protease
  CHEBI:67268: VIRAL_INTEGRASE_INHIBITION              # HIV-1 integrase
  CHEBI:59886: VIRAL_ENTRY_INHIBITION                  # HIV fusion inhibitor
  CHEBI:52425: VIRAL_RELEASE_INHIBITION                # exo-alpha-sialidase (neuraminidase inhibitors)
  CHEBI:71168: VIRAL_ASSEMBLY_INHIBITION               # HIV-1 maturation inhibitor
  CHEBI:83799: VIRAL_ASSEMBLY_INHIBITION               # NS5A inhibitor (replication-complex assembly)

# Roles whose target exists only in EUKARYOTIC microbes. Applied when the record
# is filed ANTIFUNGAL or ANTIPROTOZOAL and ignored otherwise.
#
# Only the mitochondrial trio qualifies. Succinate dehydrogenase and the
# two-sector ATPase were briefly in here and should not have been: bacteria have
# sdhABCD, and EC 3.6.3.14 covers the bacterial F1Fo synthase that bedaquiline
# targets. That mistake cost 3-nitropropanoic acid, an antimycobacterial, its
# mechanism.
#
# A mitochondrion is a eukaryotic organelle. Mapping these unconditionally gave
# CORM 3, myxothiazole and sodium azide an energy-metabolism mechanism on
# ANTIBACTERIAL records, which is meaningless — bacteria have none. Removing
# them outright was the opposite error: it stripped the mechanism from 23
# antifungals where it is exactly right, because the strobilurin (QoI) and SDHI
# fungicides work by inhibiting FUNGAL mitochondrial respiration. The target
# group decides whether the claim is even coherent, so the map is conditional
# on it.
role_to_mode_of_action_eukaryotic:
  CHEBI:25355: ENERGY_METABOLISM_INHIBITION   # mitochondrial respiratory-chain inhibitor
  CHEBI:38499: ENERGY_METABOLISM_INHIBITION   # mitochondrial cytochrome-bc1 (QoI fungicides)
  CHEBI:141153: ENERGY_METABOLISM_INHIBITION  # quinone outside inhibitor

# ChEBI role -> whether the target it names belongs to the microbe or is shared
# with the host. Consumed alongside the two maps above; every role in either of
# them must appear here exactly once, and tests enforce that.
#
# WHY THIS EXISTS. `mode_of_action` means "the mechanism by which this compound
# exerts its ANTIMICROBIAL effect". That definition does NOT require a
# microbe-specific target: a host-directed antiviral inhibits host translation
# the virus depends on, and a virus has no ribosome of its own. Suppressing
# those would not be rigour, it would make the corpus unable to express a real
# drug class. But `PROTEIN_SYNTHESIS_INHIBITION` alone cannot tell linezolid's
# bacterial 50S from omacetaxine's host 80S, and that conflation is the actual
# defect #60 was pointing at. This flag separates them without dropping either.
#
# NOT A CONFIDENCE RATING. Both values mark true mechanisms. HOST_SHARED_TARGET
# covers microbe-SELECTIVE drugs acting on a conserved machine (linezolid) as
# well as genuinely host-directed ones (omacetaxine); it marks where the
# selectivity question exists, it does not answer it.
#
# THE RULE: does the human host have the target the role names? Assigned from
# each role's actual cohort in this corpus, not from taxonomy alone — and the
# cohorts overturned two assumptions made elsewhere in this file, both noted
# below.
role_target_scope:
  # --- host lacks the target
  CHEBI:53559: MICROBIAL_TARGET    # topoisomerase IV — bacterial; humans have no homologue
  CHEBI:50502: MICROBIAL_TARGET    # dihydropteroate synthase — humans take up folate
                                   # rather than synthesising it, which is why
                                   # sulfonamides are selective at all
  CHEBI:75282: HOST_SHARED_TARGET  # ergosterol biosynthesis — the PRODUCT is fungal, but
                                   # this field is about the TARGET, and an azole's target
                                   # is CYP51, which the host has. Every enzyme of this
                                   # pathway scoped in this file (CHEBI:77884 CYP51,
                                   # CHEBI:59285 SQLE) is host-shared, so calling the
                                   # pathway microbial split one drug class in two:
                                   # fluconazole and voriconazole read MICROBIAL_TARGET
                                   # while flutrimazole and triforine read
                                   # HOST_SHARED_TARGET — same enzyme, same mechanism
                                   # value, opposite selectivity claim, decided only by
                                   # which role tag ChEBI happened to attach. Keeping it
                                   # microbial was the outcome-preserving reasoning M3
                                   # was supposed to have removed.
  CHEBI:230471: MICROBIAL_TARGET   # 1,3-β-glucan synthase — fungal cell wall; host lacks
  CHEBI:59672: MICROBIAL_TARGET    # chitin synthase — fungal/insect; host lacks
  # --- virus-encoded targets
  CHEBI:53756: MICROBIAL_TARGET    # HIV-1 reverse transcriptase
  CHEBI:59886: HOST_SHARED_TARGET  # "HIV fusion inhibitor" names an EVENT, and its two
                                   # members target opposite sides of it: enfuvirtide
                                   # binds viral gp41, maraviroc binds HUMAN CCR5 and is
                                   # the textbook host-directed antiviral. One role, both
                                   # directions — the CHEBI:20854 pattern again. An
                                   # earlier comment here conceded the CCR5 problem and
                                   # then overrode the rule on the grounds that "the
                                   # inhibited event is viral"; the field is named for the
                                   # TARGET, so that was the rule being bent to fit.
  CHEBI:170010: MICROBIAL_TARGET   # RNA-directed RNA polymerase — hosts have none
  CHEBI:52629: MICROBIAL_TARGET    # retroviral ribonuclease H (an RT domain)
  CHEBI:35660: MICROBIAL_TARGET    # HIV protease
  CHEBI:147285: MICROBIAL_TARGET   # SARS coronavirus main proteinase
  CHEBI:64924: MICROBIAL_TARGET    # hepatitis C protease
  CHEBI:67268: MICROBIAL_TARGET    # HIV-1 integrase

  CHEBI:71168: MICROBIAL_TARGET    # HIV-1 maturation
  CHEBI:83799: MICROBIAL_TARGET    # NS5A — viral nonstructural protein

  # --- the host has the target too
  CHEBI:48001: HOST_SHARED_TARGET  # protein synthesis inhibitor — names a PROCESS, not a
                                   # target. Correct and canonical for the macrolides,
                                   # tetracyclines, aminoglycosides and oxazolidinones;
                                   # also correct, and host-directed, for omacetaxine
  CHEBI:59517: HOST_SHARED_TARGET  # DNA synthesis inhibitor — same: the fluoroquinolones
                                   # and gemcitabine both, honestly, belong here
  CHEBI:50750: HOST_SHARED_TARGET  # EC 5.99.1.3 — this file elsewhere calls it "bacterial
                                   # gyrase", distinguished from the human topo term
                                   # CHEBI:50276. The cohort says otherwise: it admits
                                   # aclacinomycin A and 4'-epidoxorubicin, anthracyclines
                                   # that poison the HUMAN topoisomerase, alongside the
                                   # gatifloxacins. The EC covers both.
  CHEBI:37416: HOST_SHARED_TARGET  # RNA polymerase — rifamycins hit the bacterial enzyme,
                                   # but the role name is generic and the cohort includes
                                   # mithramycin, which acts on host transcription
  CHEBI:50683: HOST_SHARED_TARGET  # dihydrofolate reductase — the host's DHFR is
                                   # methotrexate's target; selectivity is affinity, not
                                   # the presence or absence of the enzyme
  CHEBI:20854: HOST_SHARED_TARGET  # ATP synthase — bedaquiline is selective for the
                                   # mycobacterial enzyme, but the same role carries the
                                   # oligomycins, the textbook inhibitors of the HOST
                                   # mitochondrial F1Fo. One role, both directions.
  CHEBI:73214: HOST_SHARED_TARGET  # EC 3.6.3.14 — cohort is bafilomycin and concanamycin,
                                   # V-ATPase inhibitors, and the host has V-ATPases
  CHEBI:83072: HOST_SHARED_TARGET  # succinate dehydrogenase — respiratory complex II,
                                   # which the host has
  CHEBI:77884: HOST_SHARED_TARGET  # sterol 14α-demethylase — the host has CYP51A1.
                                   # These two were briefly MICROBIAL_TARGET on the
                                   # grounds that their cohorts are pure antifungals,
                                   # which quietly swapped the rule: PRESENCE decides
                                   # ("does the host have this target?"), and the cohort
                                   # is EVIDENCE about presence, not a second rule.
                                   # Reading it the other way made trimethoprim
                                   # host-shared for a host enzyme while terbinafine was
                                   # microbial for one — the same question, two answers.
                                   # The azoles keep MICROBIAL_TARGET anyway, via
                                   # CHEBI:75282: ergosterol biosynthesis as a PATHWAY
                                   # really is absent from the host, which is the honest
                                   # reason the class is selective.
  CHEBI:59285: HOST_SHARED_TARGET  # squalene monooxygenase — the host has SQLE. Costs
                                   # terbinafine and naftifine (allylamines) their
                                   # MICROBIAL_TARGET, correctly: their selectivity is
                                   # affinity, not absence. ChEBI also tags butenafine
                                   # (a benzylamine) and amorolfine (a morpholine acting
                                   # on ERG24/ERG2, not squalene epoxidase) with this
                                   # role; calling all four "the allylamines" was wrong,
                                   # and in a file whose decisions rest on cohorts a
                                   # misdescribed cohort is a defect in the record.
  CHEBI:24869: HOST_SHARED_TARGET  # ionophore — collapses gradients across any membrane
  CHEBI:83741: HOST_SHARED_TARGET  # phospholipid biosynthesis — universal
  CHEBI:59897: HOST_SHARED_TARGET  # EC 2.7.7.49 (RNA-directed DNA polymerase) — the host
                                   # has one: telomerase. And the cohort proves it is not
                                   # hypothetical — MST-312, whose own ChEBI definition
                                   # reads "It is telomerase inhibitor (IC50 = 0.67 μM in
                                   # a TRAP assay) and exhibits antineoplastic activity",
                                   # plus TMPyP4 and its tosylate, G-quadruplex ligands.
                                   # An earlier comment here asserted "nothing
                                   # host-directed" in the cohort, falsified by the
                                   # records' own definition field. The genuine RT drugs
                                   # that also carry CHEBI:53756 keep MICROBIAL_TARGET,
                                   # because a specific role outranks a generic one.
  CHEBI:52425: HOST_SHARED_TARGET  # exo-α-sialidase — humans have NEU1-4. The drugs of
                                   # record (oseltamivir) are selective for the viral
                                   # neuraminidase, but the EC does not say so.
  # --- mitochondrial: host-shared by definition, since the host is a eukaryote.
  # These are the conditional map's roles; the conditional decides whether the
  # claim is COHERENT for the target group, this decides whose target it is.
  CHEBI:25355: HOST_SHARED_TARGET  # mitochondrial respiratory-chain inhibitor
  CHEBI:38499: HOST_SHARED_TARGET  # mitochondrial cytochrome-bc1 (QoI fungicides)
  CHEBI:141153: HOST_SHARED_TARGET # quinone outside inhibitor

# ARO drug class -> AntimicrobialClassEnum, for the classes whose NAME states a
# target group. CARD models antifungal resistance as well as antibacterial, so
# "every ARO molecule is an antibacterial" is no longer true; a curated,
# compound-specific drug class is stronger evidence than ChEBI's generic role
# tags, and this map is consulted before them.
#
# Classes whose names do not state a group are deliberately absent.
# "imidazole antibiotic" and "nitroimidazole antibiotic" each cover both
# antibacterials and antifungals, and inferring the target group from the
# chemistry is exactly the guess this repository should not make; those
# compounds fall through to their ChEBI roles.
aro_class_to_class:
  ARO:3007497: ANTIFUNGAL   # polyene antifungal
  ARO:3007498: ANTIFUNGAL   # allylamine antifungal
  ARO:3007499: ANTIFUNGAL   # triazole antifungal
  ARO:3007560: ANTIFUNGAL   # pyrimidine antifungal
  ARO:3009305: ANTIFUNGAL   # strobilurin fungicide
  ARO:3009317: ANTIFUNGAL   # benzimidazole antifungal
  ARO:3009323: ANTIFUNGAL   # carbamate fungicides
  ARO:3009539: ANTIFUNGAL   # fungal succinate dehydrogenase inhibitor

# ----------------------------------------------------------------------------
# ChEBI structural class -> AntimicrobialClassEnum: TRIED, AND REMOVED.
#
# The idea was to recover a target group for the ~20 compounds whose only
# reviewed ChEBI role is the generic `antimicrobial agent`, by filing on a
# structural class whose NAME states a target group — `beta-lactam antibiotic`,
# `aminoglycoside antibiotic`. It re-filed 169 records and about 25 of them
# wrongly, because the premise is false: a ChEBI class that names a target group
# is still a CHEMICAL class, and its members are not all active on that target.
#
# It filed anthracycline chemotherapy drugs (daunorubicin, the carminomycins) as
# antibacterial through the aminoglycoside door; spinosyn A and D, the active
# ingredients of an insecticide this corpus explicitly excludes; aureobasidin A,
# an antifungal, through `peptide antibiotic`; trichlormethiazide, a diuretic,
# through `sulfonamide antibiotic`; a shelf of antitumour macrolides; and — most
# plainly — the bare ring scaffolds `penam`, `penem`, `cepham` and
# `azetidin-2-one`, which are ring systems with no activity to have.
#
# A veto on the antineoplastic role fixed one family and left the rest, which is
# the shape of a rule that cannot be patched into correctness. Corroborating
# against CARD would have excluded every wrong case — and also every right one:
# none of the 169 has an ARO concept.
#
# So those compounds keep ANTIMICROBIAL_UNSPECIFIED, which is what the reviewed
# sources actually say. "Weaker than what is knowable" is not the same as wrong,
# and this corpus would rather say less than assert more than its sources do.
# The principled fix is a source that states the target group directly — ATC
# codes, where J01 IS "antibacterials for systemic use" — which is already in
# curation/source_queue.tsv as `atc-aware`. See issue #38.
# ----------------------------------------------------------------------------

# ARO determinant lineage -> ResistanceMechanismEnum. CARD's aro.obo does not
# link a determinant to its mechanism category directly (that association lives
# in card.json), so the mechanism is read off the determinant's is_a lineage.
# A determinant whose lineage matches nothing here is seeded as UNKNOWN and
# lands on the curation worklist rather than being guessed.
aro_mechanism_map:
  ARO:0001001: ANTIBIOTIC_TARGET_ALTERATION
  ARO:0001002: ANTIBIOTIC_TARGET_REPLACEMENT
  ARO:0001003: ANTIBIOTIC_TARGET_PROTECTION
  ARO:0001004: ANTIBIOTIC_INACTIVATION
  ARO:0010000: ANTIBIOTIC_EFFLUX
  ARO:3000244: REDUCED_PERMEABILITY
  ARO:3007609: ANTIBIOTIC_TARGET_ALTERATION
  ARO:3000519: ANTIBIOTIC_TARGET_ALTERATION      # antibiotic target modifying enzyme
  ARO:3000557: ANTIBIOTIC_INACTIVATION           # antibiotic inactivation enzyme
  ARO:3000000: UNKNOWN                           # determinant of antibiotic resistance (root)
