  assay: Comparative laboratory growth assays
  mechanism_type: OTHER
  label: Context-dependent EfgA-associated formaldehyde resistance
  gene_families:
  - EfgA
  gene_id: Mext_4158
  note: 'Native PA1-derived laboratory comparisons link loss of EfgA function to growth
    with externally supplied formaldehyde. This is not universal protection: EfgA
    was beneficial under endogenous formaldehyde stress. The study baseline CM2730
    is already a laboratory derivative, not unmodified PA1. Reference-only UniProtKB:P0DX96
    does not identify the tested alleles. Growth and translation responses are not
    MIC or clinical resistance categories; phenotypic heterogeneity remains distinct
    from this genotype association.'
  evidence:
  - reference: PMID:34038406
    notes: DOI:10.1371/journal.pbio.3001208. Native functional comparisons in Results
      and Figure 3; endogenous-stress and tolerance limits in Figures 9-10; Figure
      13 and Discussion. Qualitative gene-level scope; no exact allele or genome assignment.
  - reference: UniProtKB:P0DX96
    notes: 'Reference identity only: efgA / Mext_4158; reviewed UniProtKB 2026_03,
      entry 8, sequence 1. PA1 NCBITaxon:419610 is reference context, not a tested-derivative
      TaxID. Species NCBITaxon:408 independently checked through UniProt taxonomy.'
