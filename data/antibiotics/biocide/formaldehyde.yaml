  taxon_label: Methylorubrum extorquens
  phenotype_label: Source-reported relative formaldehyde resistance in laboratory
    growth assays
  assay: Comparative laboratory growth assays
  mechanism_type: UNKNOWN
  label: Conditional EfgB-associated formaldehyde resistance
  gene_families:
  - EfgB
  gene_id: Mext_0606
  note: The primary study supports a conditional EfgB contribution in EfgA-altered
    PA1-derived laboratory backgrounds; EfgB changes alone did not confer growth in
    the sole-formaldehyde-carbon comparison. The adenylate/guanylate cyclase annotation
    is putative, not demonstrated biochemical activity. Two dated UniProt queries
    returned no reference candidate; this is not evidence that the gene or protein
    is absent. No MIC, clinical category, exact allele, protein accession or experimental
    genome is assigned.
  evidence:
  - reference: PMID:34038406
    notes: DOI:10.1371/journal.pbio.3001208. Results, EfgB plays a secondary role
      in formaldehyde resistance; negative comparison in Figure 3 and conditional
      comparison in Figure 5. Supplement-only claims are not curated.
  - reference: NCBITaxon:408
    notes: Species identity checked through UniProt taxonomy on 2026-10-14, release
      2026_03. The PA1 reference lineage does not resolve the tested laboratory derivatives
      as a single strain or genome.
