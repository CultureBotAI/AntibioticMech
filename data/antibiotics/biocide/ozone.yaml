definition: An elemental molecule with formula O3. An explosive, pale blue gas (b.p.
  −112°C) that has a characteristic, pungent odour, it is continuously produced in
  the upper atmosphere by the action of solar ultraviolet radiation on atmospheric
  oxygen. It is an antimicrobial agent used in the production of bottled water, as
  well as in the treatment of meat, poultry and other foodstuffs.
