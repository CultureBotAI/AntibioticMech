definition: A member of the class of phenols that is 3,5-xylenol which is substituted
  at position 4 by chlorine. It is bactericidal against most Gram-positive bacteria
  but less effective against Staphylococci and Gram-negative bacteria, and often inactive
  against Pseudomonas species. It is ineffective against bacterial spores.
