definition: An aromatic amide obtained by formal condensation of the carboxy group
  of 2-methyl-4-(trifluoromethyl)thiazole-5-carboxylic acid with the amino group of
  2,6-dibromo-4-(trifluoromethoxy)aniline. Used to control Rhizoctonia spp. diseases
  on rice, potatoes, maize, grass and other crops.
