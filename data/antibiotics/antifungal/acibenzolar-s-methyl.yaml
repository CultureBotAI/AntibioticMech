definition: A benzothiadiazole that is the S-methyl thioester derivative of acibenzolar.
  A profungicide (by hydrolysis of the thioester group to give the corresponding carboxylic
  acid), it is used as a fungicide and plant activator on a variety of crops, including
  cotton, chili peppers, lettuce, onions, spinach, tobacco, and tomatoes.
