definition: A member of the class of phthalimides that is phthalimide in which the
  hydrogen attached to the nitrogen is replaced by a trichloromethylthio group. An
  agricultural fungicide, it has been used to control mildew, leaf spot, and other
  diseases in crops sice the 1950s.
