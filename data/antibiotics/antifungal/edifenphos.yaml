definition: An organic thiophosphate that is the O-ethyl-S,S-diphenyl ester of phosphorodithioic
  acid. Used to control a variety of fungal diseases on rice including blast, ear
  blight and stem rot. Edifenphos is moderately toxic to mammals and fish but poses
  more of a risk to aquatic invertebrates.
