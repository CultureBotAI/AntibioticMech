definition: An organic thiophosphate that is 2,6-dichloro-4-methylphenol in which
  the hydrogen of the hydroxy group group has been replaced by a dimethoxyphosphorothioyl
  group. Tolclofos-methyl is a phospholipid biosynthesis inhibitor and fungicide that
  is used for controlling soil-borne diseases caused by Typhula incarnata, Corticium
  rolfsii, Typhula ishikariensis, and Rhizoctonia solani.
