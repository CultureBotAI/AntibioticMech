  evidence:
  - reference: DOI:10.1128/AAC.45.7.2151-2153.2001
    snippet: Carrillo and Guarro evaluated the novel quinazolinone triazole UR-9825
      (albaconazole) against Scedosporium apiospermum and Scedosporium prolificans
      isolates, reporting geometric mean MICs of 0.30 ug/mL against S. apiospermum
      (MIC90 = 1 ug/mL) and 1.18 ug/mL against S. prolificans (MIC90 = 2 ug/mL), the
      lowest values among all four triazoles tested.
    notes: Reported by Carrillo and Guarro 2001 (Antimicrob Agents Chemother 45:2151-2153;
      PMID:11408242) and Ramos et al. 1999 (Antimicrob Agents Chemother 43:2992-2994;
      DOI:10.1128/AAC.43.12.2992) as a broad-spectrum 7-chloroquinazolin-4(3H)-one
      triazole antifungal agent (UR-9825) inhibiting fungal lanosterol 14-alpha-demethylase
      (CYP51), with MIC90 <= 0.06 ug/mL against Candida albicans and Cryptococcus
      neoformans. PubChem CID 208952 supplies the standard InChI, InChIKey, formula,
      and isomeric SMILES for albaconazole.
