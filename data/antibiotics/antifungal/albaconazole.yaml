    snippet: UR-9825 (albaconazole) is a new triazole antifungal agent with potent
      broad-spectrum activity against Candida, Cryptococcus, and filamentous fungi
      through inhibition of fungal ergosterol biosynthesis at lanosterol 14-alpha-demethylase
      (CYP51).
