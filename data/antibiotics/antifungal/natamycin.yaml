mode_of_action: ERGOSTEROL_PATHWAY_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:18165687 established specific binding to ergosterol
  in model membranes and a sterol-dependent block of fungal growth. Under growth-inhibiting
  conditions natamycin did not permeabilize yeast or ergosterol-containing model membranes,
  so this record does not assign the pore-forming mechanism of other polyenes.'
