identifier: CHEBI:7488
label: natamycin
antimicrobial_class: ANTIFUNGAL
curation_status: REVIEWED
grounding_status: EXACT
definition: A macrolide antibiotic that has formula C33H47NO13, produced by several
  Streptomyces species including Streptomyces natalensis. It exhibits broad spectrum
  antifungal activity and used in eye drops, and as a food preservative, and also
  as a postharvest biofungicide for citrus and other fruit crops.
