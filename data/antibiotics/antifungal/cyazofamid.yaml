definition: A member of the class of imidazoles carrying dimethylsulfamyl, cyano,
  chloro and 4-tolyl substituents at positions 1, 2, 4 and 5 respectively. A fungicide
  used mainly for controlling Oomycete and Plasmodiophora diseases on potatoes and
  tomatoes. It is a skin and eye irritant and is moderately toxic to birds, most aquatic
  organisms, honeybees and earthworms.
