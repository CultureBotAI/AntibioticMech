definition: A polymeric complex of zinc with the propylene 1,2-bis(dithiocarbamate)
  anionic ligand. A fungicide, it is used to control a wide range of fungal diseases,
  including downy mildew, brown rot, black rot, red fire, leaf spot, and blight in
  crops such as grapes, tomatoes, potatoes, berries, citrus, rice and tea.
