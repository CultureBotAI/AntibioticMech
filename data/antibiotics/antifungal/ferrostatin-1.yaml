definition: An ethyl ester resulting from the formal condensation of the carboxy group
  of 3-amino-4-(cyclohexylamino)benzoic acid with ethanol. It is a potent inhibitor
  of ferroptosis, a distinct non-apoptotic form of cell death caused by lipid peroxidation.
  It is also a radical-trapping antioxidant and has the ability to reduce the accumulation
  of lipid peroxides and chain-carrying peroxyl radicals.
