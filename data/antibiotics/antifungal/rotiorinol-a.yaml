definition: An azaphilone that is 9,9a-dihydro-2H-furo[3,2-g]isochromen-2-one substituted
  by an acetyl group at position 3, a hydroxy group at position 9, a 3,5-dimethylhepta-1,3-dien-1-yl
  group at position 6 and a methyl group at position 9a. It has been isolated from
  Chaetomium cupreum and exhibits antifungal activity.
