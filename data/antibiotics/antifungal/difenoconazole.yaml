definition: A member of the class of dioxolanes that is 1,3-dioxolane substituted
  at position 2 by 2-chloro-4-(4-chlorophenoxy)phenyl and 1,2,4-triazol-1-ylmethyl
  groups. A broad spectrum fungicide with novel broad-range activity used as a spray
  or seed treatment. It is moderately toxic to humans, mammals, birds and most aquatic
  organisms.
