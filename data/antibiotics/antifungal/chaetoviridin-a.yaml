identifier: CHEBI:67610
label: chaetoviridin A
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: An azaphilone that is 6H-furo[2,3-h]isochromene-6,8(6aH)-dione substituted
  by a chloro group at position 5, a 3-hydroxy-2-methylbutanoyl group at position
  9, a methyl group at position 6a and a 3-methylpent-1-en-1yl group at position 3.
  Isolated from Chaetomium globosum, it exhibits natifungal activity against plant
  pathogenic fungi.
