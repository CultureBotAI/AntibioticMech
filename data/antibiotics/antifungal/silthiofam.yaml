definition: A monocarboxylic acid amide obtained by formal condensation of the carboxy
  group from 4,5-dimethyl-2-(trimethylsilyl)thiophene-3-carboxlic acid with the amino
  group of allylamine. A fungicide seed dressing for cereals used mainly to control
  'take-all'.
