definition: A carboxylic ester that is pravastatin that is lacking the allylic hydroxy
  group. A hydroxymethylglutaryl-CoA reductase inhibitor (statin) isolated from Penicillium
  citrinum and from Penicillium brevicompactum, its clinical use as a lipid-regulating
  drug ceased following reports of toxicity in animals.
