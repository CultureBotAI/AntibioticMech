definition: A member of the class of benzodioxoles that is 1,3-benzodioxole substituted
  by a carboxy group at position 5. It is a natural product isolated from several
  plant species. It is a selective mechanism-based inactivator of the trans-cinnamate
  4-hydroxylase enzyme and exhibits antifungal and skin wound healing properties.
