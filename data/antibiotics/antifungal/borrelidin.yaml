  note: 'The primary paper reports a functional result in a heterologous host derived
    from S. albus J1074, explicitly with data not shown. The proposed resistant threonyl-tRNA
    synthetase route is not directly demonstrated in this report, so mechanism_type
    remains UNKNOWN. Native donor Streptomyces parvulus Tu4055 is not the tested host.
    Donor reference UniProtKB:Q70HZ0 (EMBL:AJ580915 / CAE45679.1; entry version 112,
    sequence version 1) and NCBITaxon:146923 identify source/reference context, not
    the exact experimental allele. NCBITaxon:1888 is a species-name reference for
    S. albus; the J1074 taxonomy search returned multiple candidates, and no strain
    identifier was selected. Background, donor and derivative are not interchangeable.
    No exact allele, protein accession, strain TaxID, genome, quantitative AST or
    clinical category is assigned. Species-grounding update (2026-10-14): the source-reported
    J1074 host lineage is grounded to Streptomyces albidoflavus (NCBITaxon:1886),
    using the published J1074 background chromosome CP004370.1 and its ENA taxonomic
    metadata, with agreeing UniProt species rank and name. The preceding NCBITaxon:1888
    and J1074 name-search statements retain historical reference context, not the
    current species assignment. This is species-level lineage grounding, not resequencing
    or exact identity validation of the tested derivative. CP004370.1 and its associated
    sample and study remain background references only; no experimental genome, sample,
    strain TaxID or protein allele is assigned. Donor references and the original
    phenotype and mechanism limitations remain unchanged.'
