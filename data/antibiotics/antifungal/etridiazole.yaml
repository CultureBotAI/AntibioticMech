definition: A member of the class of thiadiazoles that is 1,2,4-thiadiazole which
  is substituted at positions 3 and 5 by trichloromethyl and ethoxy groups, respectively.
  A fungicide, it has been used particularly for the control of Phytophthora and Pythium
  species in soils.
