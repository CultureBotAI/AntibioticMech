definition: An anilide obtained by formal condensation of the amino group of aniline
  with the carboxy group of 2-methyl-5,6-dihydro-1,4-oxathiine-3-carboxylic acid.
  A fungicide for control of bunts and smuts that is normally used as a seed treatment.
