definition: A member of the class of tetrazoles that is 1-methyl-4-phenyltetrazole
  in which the phenyl group has been substituted at positions 2 and 3 by [1-(p-chlorophenyl)-1H-pyrazol-3-yl]oxy}methyl
  and methyl groups, respectively. A quinone outside inhibitor, it is a fungicide
  that can be used to control a broad range of diseases, including Septoria leaf blotch
  in wheat.
