definition: An aminopyrimidine that is 2-ethylaminopyrimidin-4-one carrying butyl
  and methyl substituents at positions 5 and 6 respectively. A fungicide first marketed
  in 1970 and used as a seed treatment for diseaases such as damping-off, it is not
  licensed for use within the European Union.
