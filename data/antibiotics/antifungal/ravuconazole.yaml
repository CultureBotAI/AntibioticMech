identifier: CHEBI:143825
label: ravuconazole
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of triazoles that is 1-butyl-1H-1,2,4-triazole in
  which the butyl group is substituted at positions 2, 2, and 3 by hydroxy, 2,4-difluorophenyl,
  and 4-(p-cyanophenyl)-1,3-thiazol-2-yl groups, respectively (the R,R stereoisomer).
  It exhibits antifungal activity by inhibition of 14α demethylase, an enzyme involved
  in sterol synthesis, resulting in lysis of the fungal cell wall and fungal cell
  death. (NCIO4)
