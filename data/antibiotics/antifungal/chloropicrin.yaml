definition: A C-nitro compound that is nitromethane in which all three hydrogens are
  replaced by chlorines. It is a severe irritant, and can cause immediate, severe
  inflammation of the eyes, nose and throat, and significant injuries to the upper
  and lower respiratory tract. Formerly stockpiled as a chemical warfare agent, it
  has been widely used in the US as a soil fumigant, particularly for strawberry crops.
  It is not approved for use within the European Union.
