definition: A member of the class of dioxolanes that is 1,3-dioxolane substituted
  at position 2 by 2,4-dichlorophenyl and 1,2,4-triazol-1-ylmethyl groups. A fungicide
  used mainly in ornamental crops to control canker and other diseases. Azaconazole
  is moderately toxic to mammals but is not expected to bioaccumulate. It is moderately
  toxic to birds, fish and aquatic invertebrates.
