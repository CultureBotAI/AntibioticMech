identifier: CHEBI:65556
label: callipeltin A
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A 10-membered cyclodepsipeptide containing four amino acids in the L-
  configuration, Ala, Leu, Thr (2 residues); one (Arg) in the D-configuration; two
  N-methyl amino acids, N-MeAla and N-MeGln; a methoxy tyrosine, a 3, 4-dimethyl-L-glutamine,
  and a 4-amino-7-guanidino-2,3 dihydroxypentanoic acid (AGDHE), formally derived
  from L-Arg. It is obtained from the shallow water sponge Callipelta and has been
  found to show activity against HIV virus.
