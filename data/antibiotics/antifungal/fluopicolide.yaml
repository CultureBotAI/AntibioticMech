definition: A member of the class of benzamides obtained by formal condensation of
  the carboxy group of 2,6-dichlorobenzoic acid with the amino group of [3-chloro-5-(trifluoromethyl)pyridin-2-yl]methylamine.
  A fungicide used for the control of a range of diseases including downy mildew and
  blight.
