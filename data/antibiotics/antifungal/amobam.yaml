definition: A dithiocarbamate salt resulting from the formal reaction of ethylenebis(dithiocarbamic
  acid) with 2 mol eq. of ammonia. A water-soluble crystalline solid, it is a fungicide
  used to protect fruit, vegetable, and field crops against a wide spectrum of fungal
  diseases. Mixing amobam with zinc sulfate affords the fungicide zineb.
