definition: A member of the class of sulfamides that is sulfamide in which the hydrogens
  attached to one of the nitrogens are replaced by methyl groups, while those attached
  to the other nitrogen are replaced by a phenyl and a [dichloro(fluoro)methyl]sulfanediyl
  group. A fungicide introduced in 1965 and used in the cultivation of fruit and vegetables,
  as well as in wood preservatives, it is no longer approved for use in the European
  Union.
