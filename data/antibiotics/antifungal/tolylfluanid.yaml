definition: A member of the class of sulfamides that is dichlofluanid in which the
  hydrogen at the para position of the phenyl group is replaced by a methyl group.
  A fungicide first marketed in 1971 and used in the cultivation of fruit and vegetables,
  as well as in wood preservatives, it is no longer approved for use in the European
  Union.
