definition: An aromatic amide obtained by formal condensation of the carboxy group
  of 3-(difluoromethyl)-1-methylpyrazole-4-carboxylic acid with the amino group of
  3',4'-dichloro-5-fluorobiphenyl-2-amine. A fungicide for use in cereals for key
  stem and leaf disease control including strobilurin-resistant septoria.
