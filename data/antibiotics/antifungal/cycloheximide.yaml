definition: A dicarboximide that is 4-(2-hydroxyethyl)piperidine-2,6-dione in which
  one of the hydrogens attached to the carbon bearing the hydroxy group is replaced
  by a 3,5-dimethyl-2-oxocyclohexyl group. It is an antibiotic produced by the bacterium
  Streptomyces griseus.
