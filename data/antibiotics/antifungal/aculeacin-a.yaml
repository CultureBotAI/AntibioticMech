mode_of_action: CELL_WALL_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:324960 showed reduced incorporation of glucose
  into Saccharomyces cerevisiae cell-wall glucan, and PMID:7042671 showed preferential
  inhibition of alkali-insoluble glucan and beta-1,3-glucan synthesis from UDP-glucose
  in Candida albicans and S. cerevisiae extracts. These experiments support fungal
  cell-wall synthesis inhibition without establishing direct binding to a defined
  synthase subunit.'
