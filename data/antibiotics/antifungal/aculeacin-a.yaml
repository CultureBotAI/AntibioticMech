  title: Aculeacin A inhibits the fungal beta-1,3-glucan synthase reaction and cell-wall
    glucan synthesis
  description: Aculeacin A inhibits UDP-glucose incorporation in the beta-1,3-glucan
    synthase reaction in Saccharomyces cerevisiae and Candida albicans, blocking synthesis
    of alkali-insoluble cell-wall beta-1,3-glucan.
  scope_status: MECHANISTIC
  nodes:
