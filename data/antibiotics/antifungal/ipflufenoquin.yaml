definition: A member of the class of quinolines that is quinoline substituted by a
  methyl group, 3-fluoro-2-(2-hydroxypropan-2-yl)phenoxy group, fluoro group and fluoro
  group at positions 2, 3, 7 and 8, respectively. It is a fungicide being developed
  by Nippon-Soda Co. Ltd (Japan) which has stable efficacy against a wide range of
  plant diseases, such as gray mold, scab and rice blast.
