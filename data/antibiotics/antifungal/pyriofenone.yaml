definition: An aromatic ketone that is metrafenone in which the 3-bromo-6-methoxy-2-methylphenyl
  group is replaced by a 5-chloro-2-methoxy-4-methylpyridin-3-yl group. It is a fungicide
  developed for the control of powdery mildew in cereals and grape vines.
