definition: A pyridinecarboxamide obtained by formal condensation of the carboxy group
  of 2-chloronicotinic acid with the amino group of 4'-chlorobiphenyl-2-amine. A fungicide
  active against a broad range of fungal pathogens including Botrytis spp., Alternaria
  spp. and Sclerotinia spp. for use on a wide range of crops including fruit, vegetables
  and ornamentals.
