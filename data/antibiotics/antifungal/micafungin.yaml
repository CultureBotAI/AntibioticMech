identifier: CHEBI:600520
label: micafungin
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cyclic hexapeptide echinocandin antibiotic which exerts its effect by
  inhibiting the synthesis of 1,3-β-D-glucan, an integral component of the fungal
  cell wall. It is used as the sodium salt for the treatment of invasive candidiasis,
  and of aspergillosis in patients who are intolerant of other therapy.
