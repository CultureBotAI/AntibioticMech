definition: A secondary carboxamide resulting from the formal condensation of the
  carboxy group of 3-(difluoromethyl)-1-methyl-1H-pyrazole-4-carboxylic acid with
  the amino group of 2-[2,4-bis(trifluoromethyl)phenoxy]aniline. It is a fungicide
  developed by Shandong United Pesticide Industry Co. that demonstrates effective
  control against soybean rust, corn rust, and wheat powdery mildew.
