definition: A member of the class of imidazolones that is 3,5-dihydroimidazol-4-one
  substituted at position 2 by a methylthiogroup, at position 3 by an anilino group
  and at position 5 by phenyl and methyl groups (the S-enantiomer). A fungicide effective
  against Oomycete diseases such as downy mildew and certain leaf spot diseases.
