causal_graphs:
- graph_id: soraphen_a_acc1_bc_domain_dimerization_fatty_acid_inhibition
  title: Soraphen A binds the eukaryotic acetyl-CoA carboxylase (Acc1) biotin carboxylase
    domain to block oligomerization and fungal fatty acid biosynthesis
  description: Soraphen A, a myxobacterial 18-membered polyketide macrolide antifungal,
    binds with nanomolar affinity to the allosteric pocket of the fungal acetyl-CoA
    carboxylase (Acc1) biotin carboxylase (BC) domain, disrupting BC domain dimerization,
    inhibiting acetyl-CoA carboxylation to malonyl-CoA, and arresting fungal de novo
    fatty acid biosynthesis.
  scope_status: MECHANISTIC
