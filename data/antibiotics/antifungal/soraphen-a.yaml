molecular_targets:
- target_id: GO:0003989
  target_label: eukaryotic acetyl-CoA carboxylase (Acc1)
  target_type: PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:4932
  taxon_label: Saccharomyces cerevisiae
  experimental_context: 2.1-Angstrom X-ray cocrystal structure of soraphen A bound
    to the biotin carboxylase (BC) domain of Saccharomyces cerevisiae acetyl-CoA carboxylase
    (Acc1; PDB:1W96; Kd ~ 1 nM), demonstrating allosteric prevention of BC domain
    dimerization and de novo fatty acid biosynthesis inhibition (Shen et al. 2004,
    DOI:10.1126/science.1103399, PMID:15550663; Gerth et al. 1994, DOI:10.7164/antibiotics.47.23,
    PMID:8119858).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2004-11
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.1126/science.1103399
    snippet: Shen et al. determined the crystal structure of the biotin carboxylase
      (BC) domain of yeast acetyl-CoA carboxylase (Acc1) in complex with soraphen
      A (PDB:1W96), showing that soraphen A binds allosterically at the dimer interface
      (Kd ~ 1 nM) and blocks BC domain dimerization.
    notes: Shen et al. 2004 (Science 306:1375-1379; PMID:15550663; PDB:1W96) resolved
      the Saccharomyces cerevisiae Acc1 biotin carboxylase domain cocrystal structure
      with soraphen A and confirmed that point mutations in the soraphen-binding pocket
      abolish binding and confer resistance.
  - reference: PMID:15550663
    notes: PubMed record for Shen et al. 2004 establishing allosteric inhibition of
      the yeast Acc1 biotin carboxylase domain by soraphen A (PDB:1W96).
  - reference: DOI:10.7164/antibiotics.47.23
    notes: Gerth et al. 1994 (J Antibiot 47:23-31; PMID:8119858) characterized soraphen
      A from Sorangium cellulosum So ce26 and its antifungal activity.
  - reference: PMID:8119858
    notes: PubMed record for Gerth et al. 1994 isolation and antifungal study of soraphen
      A.
