identifier: CHEBI:28909
label: iprodione
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: An imidazolidine-2,4-dione in which the nitrogen at position 1 is substituted
  by an N-(isopropyl)carboxamide group while that at position 3 is substituted by
  a 3,5-dichlorophenyl group. A contact fungicide, it blocks the growth of the fungal
  mycelium and inhibits the germination of fungal spores. It is used on fruit and
  vegetable crops affected by various fungal diseases. It is also used as a nematicide.
