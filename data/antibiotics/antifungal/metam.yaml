definition: A member of the class of dithiocarbamic acids that is dithiocarbamic acid
  in which a hydrogen attached to the amino group has been replaced by a methyl group.
  It is used (most widely as the corresponding sodium salt, metam-sodium) as an agricultural
  pesticide, mainly as a broad spectrum soil fumigant for the control of weeds, nematodes,
  soil-borne insects and fungi.
