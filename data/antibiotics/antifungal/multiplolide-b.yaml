identifier: CHEBI:66412
label: multiplolide B
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A 10-membered lactone obtained from 10-methyl-9,10-dihydro-2H-oxecin-2-one
  by the epoxidation of the double bond at position 3-4 and cis-dihydroxylation of
  the double bond at position 7-8, with further acylation of the hydroxy group at
  position 8 by a but-2-enoyl group. Multiplolide B was first isolated from the fungus
  Xylaria multiplex BCC 1111. It shows antifungal activity against Candida albicans.
  The epoxide group has cis-configuration, but its configuration relative to the other
  substituents was not established.
