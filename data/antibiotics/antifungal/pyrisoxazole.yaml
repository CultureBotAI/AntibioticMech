mode_of_action: ERGOSTEROL_PATHWAY_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:32714305 identified pyrisoxazole as a sterol
  14-alpha-demethylase inhibitor, found cross-resistance only with other demethylase
  inhibitors, and linked resistant Botrytis cinerea mutants to CYP51 substitutions
  and induced CYP51 expression. Direct enzyme binding was modeled rather than experimentally
  measured, so the target is represented as a resistance determinant.'
