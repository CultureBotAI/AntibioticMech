definition: A monothiocarbamic ester that is ethanethiol in which the hydrogen attached
  to the sulfur is replaced by a [3-(dimethylamino)propyl]carbamoyl group. Formerly
  used (generally as the hydrochloride salt) as an agricultural fungicide, it is not
  approved for use within the European Union.
