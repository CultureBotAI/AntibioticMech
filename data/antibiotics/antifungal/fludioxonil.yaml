definition: A member of the class of benzodioxoles that is 2,2-difluoro-1,3-benzodioxole
  substituted at position 4 by a 3-cyanopyrrol-4-yl group. A fungicide seed treatment
  for control of a range of diseases including Fusarium, Rhizoctonia and Alternaria
  .
