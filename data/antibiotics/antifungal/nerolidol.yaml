definition: A farnesane sesquiterpenoid that is dodeca-1,6,10-triene which carries
  methyl groups at positions 3, 7 and 11 and a hydroxy group at position 3. It is
  a natural product that is present in various flowers and plants with a floral odor.
  Chemically, it exists in two geometric isomers, trans and cis forms. It is widely
  used in cosmetics (e.g. shampoos and perfumes), in non-cosmetic products (e.g. detergents
  and cleansers) and also as a food flavoring agent.
