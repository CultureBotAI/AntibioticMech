definition: A member of the class of aminopyrimidines that is N-phenylpyrimidin-2-amine
  carrying additional methyl and 1-propynyl substituents at positions 4 and 6 respectively.
  A fungicide used to control a wide range of diseases including grey mould on strawberries,
  tomatoes and cucumabers, and scab on apples and pears.
