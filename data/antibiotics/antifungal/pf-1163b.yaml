definition: A macrolide antibiotic that is 4,10-dimethyl-1-oxa-4-azacyclotridecane-2,5-dione
  substituted by a 4-(2-hydroxyethoxy)benzyl group at position 3 and a pentyl group
  at position 13 (the 3S,10R,13S stereoisomer). It is isolated from Penicillium sp.PF1163
  and exhibits antifungal activity against the pathogenic fungal strain Candida albicans
  TIMM1768.
