definition: A methyl N-(2,6-dimethylphenyl)-N-(methoxyacetyl)alaninate that is the
  more active R-enantiomer of metalaxyl. A systemic fungicide, it is active against
  phytopathogens of the order Peronosporales and is used to conrtrol Pythium in a
  number of vegetable crops.
