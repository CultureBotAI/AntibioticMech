definition: A class I yanuthone that is 5,6-epoxy-cyclohex-2-en-1-one which is substituted
  at positions 3, 4, and 6 by methyl, acetoxy, and trans,trans-farnesyl groups, respectively
  (the R,R,R stereoisomer). Isolated from the filamentous fungus Aspergillus niger,
  it shows antifungal activity towards the pathogenic yeast Candida albicans (IC50
  = 17.5 ±3.9 μM).
