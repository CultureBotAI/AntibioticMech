definition: A 4-hydroxybenzoate ester resulting from the formal condensation of the
  carboxy group of 4-hydroxybenzoic acid with methanol. It is the most frequently
  used antimicrobial preservative in cosmetics. It occurs naturally in several fruits,
  particularly in blueberries.
