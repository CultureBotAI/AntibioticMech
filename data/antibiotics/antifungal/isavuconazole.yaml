definition: A 1,3-thiazole that is butan-2-ol which is substituted at positions 1,
  2, and 3 by 1,2,4-triazol-1-yl, 2,5-difluorophenyl, and 4-(p-cyanophenyl)-1,3-thiazol-2-yl
  groups, respectively. It is an antifungal drug used for the treatment of invasive
  aspergillosis and invasive mucormycosis.
