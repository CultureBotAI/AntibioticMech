definition: A class II yanuthone that is 5,6-epoxy-cyclohex-2-en-1-one which is substituted
  at positions 3, 4, and 6 by methoxy, hydroxy, and trans,trans-farnesyl groups, respectively
  (the 4S,5R,6R stereoisomer). Isolated from the filamentous fungus Aspergillus niger,
  it shows antifungal activity towards the pathogenic yeast Candida albicans (IC50
  = 51.7 ±4.7 μM).
