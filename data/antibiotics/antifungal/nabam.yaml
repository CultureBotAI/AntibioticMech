definition: A dithiocarbamate salt that is the disodium salt of ethylenebis(dithiocarbamic
  acid). A fungicide, algicide and bactericide used on various crops including on
  cotton, capsicums, onions and rice crops, it is considered to be a carcinogen, so
  is not licensed for use within the European Union. Mixing nabam with zinc sulfate
  affords the fungicide zineb.
