  - reference: DOI:10.1128/aac.00778-22
    snippet: Oteseconazole (VT-1161) is a novel fungal CYP51 inhibitor specifically
      designed to selectively target the fungal enzyme over human cytochrome P450
      enzymes. Against C. glabrata clinical isolates, VT-1161 MICs ranged from <=0.015
      to 2 ug/mL (MIC50, 0.06 ug/mL; MIC90, 0.5 ug/mL), and against C. krusei isolates,
      VT-1161 MICs ranged from 0.03 to 0.5 ug/mL (MIC50, 0.12 ug/mL; MIC90, 0.25 ug/mL).
    notes: Reported by Nishimoto et al. 2022 (Antimicrob Agents Chemother 66:e0077822;
      PMID:35969069) as a selective tetrazole inhibitor (VT-1161) of fungal lanosterol
      14-alpha-demethylase (CYP51), with MIC50/MIC90 of 0.06/0.5 ug/mL against Candida
      glabrata and 0.12/0.25 ug/mL against Candida krusei clinical isolates.
