definition: A carboxamide resulting from the formal condensation of the carboxy group
  of 3-[(isobutyryloxy)methoxy]-4-methoxypyridine-2-carboxylic acid with the amino
  group of (3S,6S,7R,8R)-3-amino-8-benzyl-6-methyl-4,9-dioxo-1,5-dioxonan-7-yl 2-methylpropanoate.
  Introduced by Dow AgroSciences, it is an antibiotic fungicide with a new target
  site for disease control in Septoria species.
