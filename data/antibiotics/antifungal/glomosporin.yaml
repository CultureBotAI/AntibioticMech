definition: A cyclodepsipeptide consisting of a 3,4-dihydroxy-4-methylhexadecanoyl
  group attached to the amino terminus of the linear heptapeptide Ser-D-Ala-Asp-Asn-Asn-Ser-D-allo-Thr
  which is cyclised head-to-tail via the 3-hydroxy group on the hexadecanoyl chain.
  It is an antifungal drug isolated from the barley solid culture of the fungus Glomospora
  sp.
