definition: A member of the class of (trifluoromethyl)benzenes that is 2,3-difluoro-6-(trifluoromethyl)benzenecarboxamidine
  in which the hydrogen attached to the imino nitrogen is replaced by a cyclopropylmethoxy
  group while one of the hydrogens attached to the other nitrogen is replaced by a
  phenylacetyl group. It is used as a fungicide for the control of powdery mildew
  in cereal crops as well as in apple and pear orchards.
