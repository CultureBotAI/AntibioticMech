definition: A monothiocarbamic ester that is carbamic acid in which the oxygen of
  the oxo group is replaced by sulfur, the hydrogens attached to the nitrogen are
  replaced by methyl and 6-methoxypyridin-2-yl groups, and the hydrogen of the hydroxy
  group is replaced by a p-tert-butylphenyl group. It has fungicidal and herbicidal
  activity and is used in paddy rice and turf production.
