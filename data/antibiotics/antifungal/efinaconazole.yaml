definition: A member of the class of triazoles that is butan-2-ol which is substituted
  at positions 1, 2, and 3 by 1,2,4-triazol-1-yl, 2,4-difluorophenyl, and 4-methylenepiperidin-1-yl
  groups, respectively (the 2R,3R stereoisomer). It is an antifungal drug used for
  the topical treatment of onychomycosis (a nail infection caused mainly by dermatophytes).
