mode_of_action_notes: 'CURATOR: PMID:23824292 determined a 3.4-A structure of blasticidin
  S bound to a 70S-tRNA ribosome complex and used biochemical and single-molecule
  FRET assays to show stabilization of a deformed P-site tRNA, strongly inhibiting
  release-factor hydrolysis and more weakly inhibiting peptide-bond formation. The
  HOST_SHARED_TARGET scope is retained because the paper reports inhibition in bacteria
  and eukaryotes.'
