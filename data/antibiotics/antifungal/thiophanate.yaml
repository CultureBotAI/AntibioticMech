definition: A member of the class of thioureas that is the diethyl ester of (1,2-phenylenedicarbamothioyl)biscarbamic
  acid. A fungicide effective against a broad spectrum of diseases in fruit, vegetables,
  turf and other crops including eyespot, scab, powdery mildew and grey mould.
