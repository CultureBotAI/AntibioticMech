  evidence:
  - reference: DOI:10.1128/aac.01723-25
    snippet: Fosmanogepix is a novel broad-spectrum antifungal agent currently in
      phase 3 clinical trials. Its active moiety, manogepix (MGX), inhibits the fungal
      enzyme Gwt1, a conserved glycosylphosphatidylinositol-anchored wall transfer
      protein essential for fungal cell wall integrity. MGX displayed uniform potent
      in vitro activity, with minimal effective concentration (MEC) values ranging
      from <=0.008 to 0.03 ug/mL (modal MEC, <=0.008 ug/mL; MEC50, <=0.008 ug/mL;
      MEC90, 0.015 ug/mL) for E. africanum.
    notes: Reported by Maphanga et al. 2026 (Antimicrob Agents Chemother; PMID:42206792)
      and Pfaller et al. 2023 (Antimicrob Agents Chemother 67:e0084923; DOI:10.1128/aac.00849-23)
      as the active antifungal moiety (APX001A, E1210) of fosmanogepix targeting fungal
      glycosylphosphatidylinositol-anchored wall transfer protein 1 (Gwt1), with MEC50/MEC90
      <=0.008/0.015 ug/mL against dimorphic fungi and MIC50/MIC90 0.008/0.06 mg/L
      across Candida species.
