    snippet: Fosmanogepix is a novel broad-spectrum antifungal agent currently in
      phase 3 clinical trials. Its active moiety, manogepix (MGX), inhibits the fungal
      enzyme Gwt1, a conserved glycosylphosphatidylinositol-anchored wall transfer
      protein essential for fungal cell wall integrity. MGX displayed uniform potent
