definition: Epoxiconazole was introduced in 1990 as a broad-spectrum fungicide with
  long-lasting activity. Even though epoxiconazole is produced and commercialized
  as a racemic compound, not surprisingly, a recent publication indicates that the
  optically pure (2S,3R) enantiomer of epoxiconazole is much more active against pathogenic
  fungi than its (2R,3S)-enantiomer, whereas the plant growth regulatory activity
  mainly rests in the (2R,3S)-enantiomer.
