mode_of_action_notes: 'CURATOR: PMID:20025846 measured ascochlorin inhibition of fungal,
  bacterial, and mammalian cytochrome bc1 complexes and resolved ascochlorin at both
  the Qi and Qo sites of chicken mitochondrial bc1. The combined kinetic, spectroscopic,
  and crystallographic evidence supports dual-site respiratory-chain inhibition and
  also shows that the target is host-shared.'
mode_of_action_target_scope: HOST_SHARED_TARGET
