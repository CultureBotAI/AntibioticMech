definition: Trimethylamine in which hydrogen atoms attached to different methyl groups
  are substituted by 1-naphthyl and 4-tert-butylphenyl groups. It is an inhibitor
  of squalene epoxidase, an enzyme responsible for the creation of sterols needed
  in fungal cell membranes, and is used as its hydrochloride salt for treatment of
  dermatological fungal infections.
