mode_of_action_notes: 'CURATOR: PMID:20202201 combined a Saccharomyces deletion screen,
  early transcriptomics, oxygen dependence, Yap1 nuclear accumulation, and mitochondrial
  MitoSOX oxidation. These results support intracellular superoxide production and
  oxidative stress as CTBT''s antifungal-sensitizing mechanism, while no direct molecular
  binding target was identified.'
