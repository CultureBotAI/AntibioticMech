definition: An organic heterotricyclic compound that is tetrazolo[5,1-c][1,2,4]benzotriazine
  substituted at position 7 by a chloro group. An antifungal and chemosensitising
  agent that induces oxidative stress in yeast and filamentous fungi and enhances
  the cytotoxic activity of 5-fluorocytosine and azole antimycotics.
