definition: An oligomycin with formula C45H74011. An inhibitor of mitochondrial F1FO
  ATP synthase that induces apoptosis in a variety of cell types and exhibits antifungal,
  antitumour, and nematicidal activities, but its clinical application has been limited
  by poor solubility in water and other biocompatible solvents.
