identifier: CHEBI:135281
label: neticonazole
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: An enamine that is ethene which is substituted at positions 1, 1, and
  2 by o-pentoxyphenyl, 1H-imidazol-1-yl, and methylthio groups, respectively (the
  E isomer). An inhibitor of P450-dependent C-14α-demethylation of lanosterol (preventing
  conversion to ergosterol and inhibiting cell wall synthesis in fungi), it is used
  in Japan (generally as the corresponding hydrochloride salt) as an antifungal drug
  for the treatment of superficial skin infections.
