definition: A member of the class of triazoles that is 3,3-dimethyl-1-(1,2,4-triazol-1-yl)butane-1,2-diol
  substituted at position O1 by a 4-chlorophenyl group. A fungicide for cereals, beet
  and brassicas used to control a range of diseases including powdery mildew, rusts,
  bunts and smuts.
