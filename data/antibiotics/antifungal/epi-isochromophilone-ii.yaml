definition: An azaphilone that is 7,8-dihydro-6H-isochromen-6-one substituted by a
  chloro group at position 5, a 3,5-dimethylhepta-1,3-dien-1-yl group at position
  3, a hydroxy group at position 7, a methyl group at position 7 and a 2-oxopropyl
  group at position 8. Isolated from Chaetomium cupreum, it exhibits antifungal activity.
