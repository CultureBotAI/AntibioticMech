definition: A member of the class of aminopyrimidines that is N-phenylpyrimidin-2-amine
  carrying two additional methyl substituents at positions 4 and 6. A fungicide used
  to control grey mould on fruit, vegetables and ornamentals as well as leaf scab
  on pome fruit. Also commonly employed to control Botrytis cinerea throughout the
  winemaking process in grapes, must, fermenting must and wine.
