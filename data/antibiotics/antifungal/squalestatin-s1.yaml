  target_type: PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  experimental_context: Fungal (Candida albicans and Saccharomyces cerevisiae) microsomal
    squalene synthase (Erg9, EC 2.5.1.21) inhibition assays (Candida albicans microsomal
    squalene synthase IC50 = 5 ng/mL; DOI:10.7164/antibiotics.45.639; PMID:1624366;
    DOI:10.1073/pnas.90.1.80; PMID:8419946).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 1992-05
  source_retrieved_on: '2026-10-31'
  evidence:
  - reference: DOI:10.7164/antibiotics.45.639
    notes: Dawson et al. 1992 (J Antibiot 45:639-647; PMID:1624366) characterized
      squalestatin S1 as a potent competitive inhibitor of Candida albicans microsomal
      squalene synthase (IC50 = 5 ng/mL) and fungal sterol biosynthesis with broad-spectrum
      antifungal activity.
  - reference: DOI:10.1073/pnas.90.1.80
    notes: Bergstrom et al. 1993 (Proc Natl Acad Sci U S A 90:80-84; PMID:8419946)
      demonstrated that zaragozic acid A (squalestatin S1) is a picomolar competitive
      inhibitor of fungal and mammalian squalene synthase (Erg9) that mimics the presqualene
      pyrophosphate reaction intermediate.
