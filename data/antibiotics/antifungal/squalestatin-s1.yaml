      as a 2,8-dioxabicyclo[3.2.1]octane-3,4,5-tricarboxylic acid fungal polyketide
      (zaragozic acid A) that potently inhibits fungal squalene synthase and ergosterol
      biosynthesis. MIBiG 4.0.1 entry BGC0001339, ChEBI CHEBI:220211, and PubChem
      CID 139586329 supply the stereo-complete SMILES, Standard InChI, and InChIKey.
