mode_of_action_notes: 'CURATOR: Fungal 2,8-dioxabicyclo[3.2.1]octane-3,4,5-tricarboxylic
  acid polyketide (zaragozic acid A) from Phoma sp. MF5453 that acts as a picomolar
  competitive inhibitor of squalene synthase, blocking farnesyl diphosphate condensation
  to squalene in fungal ergosterol and eukaryotic sterol biosynthesis (Dawson et al.
  1992, DOI:10.7164/antibiotics.45.639; Bonsch et al. 2016, DOI:10.1039/c6cc02130a,
  PMID:27032439).'
