definition: A member of the class of benzoxaboroles that is 1,3-dihydro-1-hydroxy-2,1-benzoxaborole
  substituted at position 5 by a fluoro group. A topical antifungal agent used for
  the treatment of onychomycosis (fungal infection of the toenails and fingernails).
