mode_of_action: PROTEIN_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:17588934 showed that tavaborole (AN2690) forms
  a stable covalent adduct with the terminal adenosine of tRNA(Leu) in the editing
  site of yeast cytoplasmic leucyl-tRNA synthetase. Trapping enzyme-bound tRNA prevents
  leucyl-tRNA synthesis and thereby blocks protein synthesis.'
