definition: A member of the class of triazolopyrimidines that is [1,2,4]triazolo[1,5-a]pyrimidin-7-amine
  carrying additional ethyl and octyl substituents at positions 5 and 6 respectively.
  A fungicide for the control of late blight and downey mildew on potatoes and other
  crops including vines.
