mode_of_action_notes: 'CURATOR: PMID:10917591 found that pentamidine inhibits mitochondrial,
  but not cytoplasmic, translation in Saccharomyces cerevisiae at concentrations that
  also inhibit mitochondrial intron splicing and respiratory growth. The study observed
  direct RNA-splicing effects in vitro but inferred a different, unresolved target
  for most in-vivo effects.'
