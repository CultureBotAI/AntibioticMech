mode_of_action_notes: 'CURATOR: Peptidyl nucleoside antifungal antibiotic from Streptomyces
  novoguineensis that belongs to the miharamycin/nikkomycin/polyoxin peptidyl-nucleoside
  class and inhibits fungal cell-wall chitin biosynthesis and hyphal morphogenesis
  in phytopathogenic fungi such as Pyricularia oryzae (Iwasa et al. 1977, DOI:10.7164/antibiotics.30.11,
  PMID:557042; Chen et al. 2019, DOI:10.1021/acschembio.8b01076, PMID:30698415).'
