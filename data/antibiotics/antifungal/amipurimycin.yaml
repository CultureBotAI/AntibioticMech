- target_label: fungal cell-wall chitin biosynthesis
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  experimental_context: Antifungal susceptibility and hyphal growth-inhibition assays
    against Pyricularia oryzae (Magnaporthe oryzae), Cochliobolus miyabeanus, and
    Alternaria kikuchiana alongside peptidyl-nucleoside biosynthesis and structure-activity
    characterization (Iwasa et al. 1977, DOI:10.7164/antibiotics.30.11, PMID:557042;
    Chen et al. 2019, DOI:10.1021/acschembio.8b01076, PMID:30698415).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2019-02
  source_retrieved_on: '2026-11-05'
  evidence:
  - reference: DOI:10.7164/antibiotics.30.11
    snippet: Iwasa et al. isolated the peptidyl nucleoside antibiotic amipurimycin
      from Streptomyces novoguineensis sp. nov. and demonstrated potent curative and
      protective antifungal activity against Pyricularia oryzae (rice blast) and phytopathogenic
      fungi.
    notes: Iwasa et al. 1977 (J Antibiot 30:1-10; PMID:557042) discovered amipurimycin
      from Streptomyces novoguineensis T-36496 and characterized its antifungal spectrum
      against Pyricularia oryzae, Cochliobolus miyabeanus, and Alternaria kikuchiana.
  - reference: DOI:10.1021/acschembio.8b01076
    notes: Chen et al. 2019 (ACS Chem Biol 14:150-155; PMID:30698415) established
      the revised cis-cyclopentane stereostructure and biosynthetic pathway of the
      peptidyl nucleoside antifungal amipurimycin.
