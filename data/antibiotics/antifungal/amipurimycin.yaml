      as a 2-aminopurine C9-pyranose peptidyl nucleoside antifungal antibiotic bearing
      a cis-2-aminocyclopentanecarboxylic acid moiety from Streptomyces novoguineensis.
      MIBiG 4.0.1 entry BGC0002054, ChEBI CHEBI:223870, and PubChem CID 139589160
