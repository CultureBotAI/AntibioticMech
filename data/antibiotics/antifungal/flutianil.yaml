definition: A member of the class of thiazolidines that is N-(o-methoxyphenyl)thiazolidine
  which is substituted at position 2 by a methylene group, the hydrogens of which
  are replaced by cyano and [2-fluoro-5-(trifluoromethyl)phenyl]sulfanediyl groups;
  the double bond conjugated to the cyano group has Z configuration. A fungicide intended
  for use on horticultural crops including strawberries and grapevines.
