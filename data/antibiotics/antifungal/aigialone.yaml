definition: A furopyran that is 5,6-dihydro-4H-furo[2,3-b]pyran-3(2H)-one which is
  substituted by hydroxy groups at positions 4 and 5, methyl groups at positions 2
  and 5, and a heptyl group at position 6 (the 2R,4R,5S,6R stereoisomer). Isolated
  from the mangrove fungus Aigialus parvus BCC 5311 and from <a href="https://en.wikipedia.org/wiki/Phaeoacremonium"
  target="_blank">Phaeoacremonium</a> sp., an endophytic fungus from <a href="https://en.wikipedia.org/wiki/Senna_spectabilis"
  target="_blank">Senna spectabilis</a>.
