definition: A member of the class of benzimidazoles that is 2-aminobenzimidazole in
  which the primary amino group is substituted by a methoxycarbonyl group. A fungicide,
  carbendazim controls Ascomycetes, Fungi Imperfecti, and Basidiomycetes on a wide
  variety of crops, including bananas, cereals, cotton, fruits, grapes, mushrooms,
  ornamentals, peanuts, sugarbeet, soybeans, tobacco, and vegetables.
