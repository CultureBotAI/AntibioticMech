definition: A naphthodithiin that is 5,10-dioxo-5,10-dihydronaphtho[2,3-b][1,4]dithiin
  which is substituted by nitrile groups at positions 2 and 3. It is a broad spectrum
  fungicide used to control scab, downy mildew, rust, and leaf spot in the commercial
  growing of grapes and other fruit, citrus, coffee, and vegetables.
