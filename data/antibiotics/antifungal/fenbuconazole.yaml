definition: Fenbuconazole is a triazole fungicide intended for use as an agricultural
  and horticultural fungicide spray. It is a systemic protectant and curative which
  acts by inhibiting sterol biosynthesis in fungi. Fenbuconazole is rapidly absorbed
  and eliminated, mainly in the faeces through significant biliary excretion; there
  was no evidence of significant retention in tissues. Fenbuconazole was of low acute
  toxicity when administered orally (LD50 > 2000 mg/kg bw), dermally (LD50 > 5000
  mg/kg bw), or by inhalation (LC50 > 2.1 mg/litre air). It was not irritating to
  the skin or eyes.
