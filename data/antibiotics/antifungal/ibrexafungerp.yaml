mode_of_action_notes: 'CURATOR: Semisynthetic triterpenoid (enfumafungin derivative,
  SCY-078) antifungal that noncompetitively inhibits fungal 1,3-beta-D-glucan synthase
  (Fks1/Fks2; GO:0003843) at a binding site distinct from but partially overlapping
  that of echinocandins, disrupting fungal cell-wall beta-1,3-D-glucan synthesis (DOI:10.1093/mmy/myac049).'
