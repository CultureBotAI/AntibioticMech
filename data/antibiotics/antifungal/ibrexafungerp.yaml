  evidence:
  - reference: DOI:10.1093/mmy/myac049
    snippet: Ibrexafungerp is a first-in-class oral triterpenoid glucan synthase inhibitor.
      Ibrexafungerp showed potent in vitro activity against Candida albicans (n =
      166; MIC50/90, 0.06/0.25 mg/L), Candida parapsilosis (n = 123; MIC50/90, 0.5/1
      mg/L), Candida glabrata (n = 68; MIC50/90, 0.25/1 mg/L), Candida tropicalis
      (n = 45; MIC50/90, 0.25/1 mg/L), and Candida krusei (n = 15; MIC50/90, 0.5/1
      mg/L), including fluconazole- and echinocandin-resistant isolates.
    notes: Reported by Mesquida et al. 2022 (Med Mycol 60:myac049; PMID:35816437)
      as a semisynthetic enfumafungin-derived triterpenoid 1,3-beta-D-glucan synthase
      inhibitor (SCY-078, MK-3118) with MIC50/MIC90 of 0.06/0.25 mg/L against Candida
      albicans and 0.25/1 mg/L against Candida glabrata bloodstream isolates.
