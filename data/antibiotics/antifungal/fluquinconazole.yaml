definition: A member of the class of quinazolines that is 6-fluoroquinazolin-4-one
  carrying additional 1,2,4-triazol-1-yl and 2,4-dichlorophenyl substituents at positions
  2 and 3 respectively. A fungicide used to control Ascomycetes, Deuteromycetes and
  Basidiomycetes spp. on cereals, beets and fruit.
