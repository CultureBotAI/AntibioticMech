definition: A methyl ketone that is benzamide in which one of the meta hydrogens has
  been replaced by an acetyl group. It is a bacterial secondary metabolite from actinomycete
  strain WA23-4-4 isolated from the intestinal tract of Periplaneta americana (American
  cockroach), it shows significant antifungal activity against Candida albicans ATCC
  10231 and Aspergillus niger ATCC 16404 but is less active against Trichophyton rubrum
  ATCC 60836 and Aspergillus fumigatus ATCC 96918.
