definition: A member of the class of benzotriazines that is 1,2,4-benzotriazine 1-oxide
  which is substituted by chlorine at position 7 and by a 1H-imidazol-1-yl group at
  position 3. A fungicide, it is used as a seed treatment for control of seed-borne
  Pyrenophora graminea and Pyrenophora teres in barley.
