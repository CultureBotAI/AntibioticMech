definition: A member of the class of benzamides, obtained by formal condensation of
  the carboxy group of 2-(trifluoromethyl)benzoic acid with the amino group of 3-(ispropyloxy)aniline.
  A fungicide used to control a range of pathogens especially Rhizoctonia spp. on
  rice, turf and other crops.
