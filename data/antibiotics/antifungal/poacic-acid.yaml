identifier: CHEBI:156511
label: poacic acid
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A hydroxycinnamic acid that is (2E)-3-phenylprop-2-enoic acid in which
  the hydrogens at positions 3, 4 and 5 are replaced by 2-(4-hydroxy-3-methoxyphenyl)ethenyl,
  hydroxy and methoxy groups, respectively. It is a natural product found in maize
  bran which exhibits antifungal activities against several fungal and oomycete pathogens
  including Sclerotinia sclerotiorum, Alternaria solani, and Phytophthora sojae. It
  inhibits β-1,3-glucan synthesis in cells walls resulting in rapid cell lysis.
