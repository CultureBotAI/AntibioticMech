identifier: CHEBI:131609
label: pneumocandin B0
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: An echinocandin initially isolated as a very minor bioactive fermentation
  product of Glarea lozoyensis (originally known as Zalerion arboricola). Subsequent
  random mutagenesis work and optimisation of the fermentation medium permitted the
  industrial production of pneumocandin B0, which is used as the starting point for
  the synthesis of the antifungal drug caspofungin.
