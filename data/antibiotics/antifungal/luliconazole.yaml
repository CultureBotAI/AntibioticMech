  evidence:
  - reference: DOI:10.1007/s10156-004-0327-1
    snippet: Luliconazole inhibited growth of all filamentous fungi except zygomycetes
      at low concentrations (MIC, < or =0.004-0.125 microg/ml), with dermatophytes
      being most susceptible (MIC, < or =0.004-0.008 microg/ml). yeastlike fungi were
      also susceptible to luliconazole (MIC, 0.125-4 microg/ml).
    notes: Reported by Uchida et al. 2004 (J Infect Chemother 10:216-219; PMID:15365862)
      as an optically active R-enantiomer ketene dithioacetal imidazole antifungal
      (NND-502) inhibiting fungal lanosterol 14-alpha-demethylase, with MICs of <=0.004-0.008
      ug/mL against Trichophyton dermatophytes and 0.125-4 ug/mL against Candida species.
