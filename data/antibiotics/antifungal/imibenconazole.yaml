definition: A member of the class of imidothioates that is the S-4-chlorobenzyl thioester
  of N-(2,4-dichlorophenyl)-2-(1H-1,2,4-triazol-1-yl)ethanimidothioic acid. Used to
  control a range of fungal diseases affecting fruit, vegetables, turf and ornamentals.
  It has a low mammalian toxicity and shows a moderate level of toxicity to fish,
  daphnia and earthworms but is relatively non-toxic to honey bees, birds and algae.
