definition: A member of the class of isoxazoles carrying hydroxy and methyl substituents
  at positions 3 and 5 respectively. It is used worldwide as a systemic soil and seed
  fungicide for the control of diseases caused by Fusarium, Aphanomyces, Pythium,
  and Corticium spp. in rice, sugarbeet, fodderbeet, vegetables, cucurbits, and ornamentals.
