definition: A lactone which is 9-methyl-1,5-dioxonane-2,6-dione substituted by a benzyl
  group at position 8, a [(3-hydroxy-pyridine-2-yl)carbonyl]amino group at position
  3 and an isobutyryloxy group at position 7. It is isolated from the mycelia cake
  of Streptomyces sp. 517-02 and exhibits potent antifungal activity.
