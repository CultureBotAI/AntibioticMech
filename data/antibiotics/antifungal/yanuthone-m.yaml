definition: A class I yanuthone that is yanuthone K in which the double bond at the
  terminal end of the farnesyl substituent has undergone hydration to afford the corresponding
  tertiary alcohol. Isolated from the filamentous fungus Aspergillus niger, it shows
  antifungal activity towards the pathogenic yeast Candida albicans (IC50 = 77.5 ±3.7
  μM).
