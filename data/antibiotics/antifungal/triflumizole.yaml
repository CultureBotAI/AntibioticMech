definition: A carboxamidine resulting from the formal condensation of the amino group
  of 4-chloro-2-(trifluoromethyl)aniline with the oxygen of the acetyl group of N-(propoxyacetyl)imidazole.
  A sterol demethylation inhibitor, it is used as a fungicide for the control of powdery
  mildew, scab and other diseases on a variety of crops.
