identifier: CHEBI:65459
label: australifungin
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A carbobicyclic compound that is 4a,5,6,7,8,8a-hexahydronaphthalen-1(4H)-one
  substituted by hydroxy groups at positions 2, 5 and 8, a (2Z)-3-hydroxyprop-2-enoyl
  group at position 4, methyl groups at positions 4 and 7 and a 2R-octan-2-yl group
  at position 3 (the 4S,4aR,5S,7R,8R,8aS stereoisomer). It is isolated from the fermentation
  extracts of Sporormiella australis and exhibits antifungal activity by interfering
  with the fungal lipid metabolism.
