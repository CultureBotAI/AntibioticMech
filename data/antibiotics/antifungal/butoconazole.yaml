definition: A member of the class of imidazoles that is 1H-imidazole in which the
  hydrogen attached to the nitrogen is substituted by a 4-(4-chlorophenyl)-2-[(2,6-dichlorophenyl)sulfanyl]butyl
  group. An antifungal agent, it is used as its nitrate salt in gynaecology for treatment
  of vulvovaginal infections caused by Candida species, particularly Candida albicans.
