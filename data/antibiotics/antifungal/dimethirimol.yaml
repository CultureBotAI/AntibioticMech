definition: A member of the class of aminopyrimidines that is 2-dimethylaminopyrimidine
  carrying methyl, butyl and hydroxy substituents at posiitons 4, 5 and 6 respectively.
  A fungicide first marketed in 1970, and used particularly in glasshouses to control
  powdery mildew, it is no longer approved for use within the European Union.
