definition: A cyclic hexapeptide echinocandin antibiotic isolated from Aspergillus
  spp. By inhibiting the conversion of lanosterol to ergosterol, it invades a fungus'
  ability to synthesize cell walls. A modified form of echinocandin B, it is an antimycotic
  agent against Candida albicans.
