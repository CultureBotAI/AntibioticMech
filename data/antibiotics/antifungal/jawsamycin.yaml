definition: A polyketide that is 5'-amino-5'-deoxy-3,4,5,6-tetrahydrouridine in which
  one of the hydrogens of the amino group is substituted by a (1E,3E)-1-[(1R,1'R,1''R,1'''R,2S,2'R,2''R,2'''S)-2'''-{(E)-2-[(1R,2R)-2-methylcyclopropyl]ethenyl}[1,1':2',1'':2'',1'''-quater(cyclopropan)]-2-yl]-5-oxopenta-1,3-dien-5-yl
  group. It is a metabolite isolated from the bacterium, Streptoverticillium fervens
  and targets the catalytic subunit of the fungal UDP-glycosyltransferase, the first
  step in the biosynthesis of glycosylphosphatidylinositol (GPI) anchors. It exhibits
  broad spectrum antifungal activity against several pathogenic fungi including Mucorales.
