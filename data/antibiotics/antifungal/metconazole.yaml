definition: A member of the class of cyclopentanols carrying 1,2,4-triazol-1-ylmethyl
  and 4-chlorobenzyl and geminal dimethyl substituents at positions 1, 2 and 5 respectively.
  Used to control a range of fungal infections including alternaria, rusts, fusarium
  and septoria diseases.
