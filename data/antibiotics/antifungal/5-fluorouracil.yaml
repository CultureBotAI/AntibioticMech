identifier: CHEBI:46345
label: 5-Fluorouracil
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: 5-Fluorouracil (5FU) is an antimetabolite typically used as a cancer treatment
  and is cytotoxic. It is a pyrimidine analogue inhibits thymidylate synthase which
  halts the DNA synthesis. Its cytotoxic effects on eukaryotic cells have also allowed
  the drug to be explored for fungal infection treatment as well.
