definition: A member of the class of guanidines that is tetrahydropyrimidin-2(1H)-imine
  in which the hydrogen of the imino group is replaced by a thiazol-2-yl group which
  in turn is substituted by a 2-(2,4-dimethylphenoxy)phenyl group at position 4. It
  has been used for the topical treatment of fungal nail infections.
