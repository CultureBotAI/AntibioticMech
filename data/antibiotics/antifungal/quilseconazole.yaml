  evidence:
  - reference: DOI:10.1128/AAC.02770-15
    snippet: Lockhart et al. evaluated the fungal-CYP51-specific tetrazole inhibitor
      VT-1129 (quilseconazole) against 180 Cryptococcus neoformans and 251 Cryptococcus
      gattii clinical isolates and reported MIC50 and MIC90 values of 0.015 and 0.06
      ug/mL against C. neoformans and 0.06 and 0.25 ug/mL against C. gattii, including
      fluconazole-resistant strains.
    notes: Reported by Lockhart et al. 2016 (Antimicrob Agents Chemother 60:2528-2531;
      PMID:26787697) and Warrilow et al. 2016 (Antimicrob Agents Chemother 60:4530-4538;
      DOI:10.1128/AAC.00349-16) as a selective 1-tetrazole antifungal agent (VT-1129)
      that tightly binds Cryptococcus neoformans and Cryptococcus gattii sterol 14-alpha-demethylase
      (CYP51, Kd = 11 to 14 nM). PubChem CID 91886002 supplies the standard InChI,
      InChIKey, formula, and isomeric SMILES for quilseconazole.
