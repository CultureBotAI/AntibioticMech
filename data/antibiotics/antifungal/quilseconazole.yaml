    snippet: VT-1129 is a novel oral fungal-specific CYP51 inhibitor that potently
      inhibits Cryptococcus neoformans and Cryptococcus gattii sterol 14-alpha-demethylase
      while exhibiting minimal activity against human cytochrome P450 enzymes.
    notes: Lockhart et al. 2016 (PMID:26787699) and Warrilow et al. 2016 (PMID:27161862)
      demonstrated tight type II binding of VT-1129 (quilseconazole) to fungal CYP51
      (Kd 11-14 nM) and potent inhibition of fungal sterol 14-alpha-demethylase activity.
