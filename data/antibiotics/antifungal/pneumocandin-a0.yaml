mode_of_action_notes: 'CURATOR: Echinocandin-class 10,12-dimethylmyristoyl cyclic
  lipohexapeptide (L-671,329) from Glarea lozoyensis that noncompetitively inhibits
  fungal 1,3-beta-D-glucan synthase, blocking fungal cell wall beta-glucan biosynthesis
  (Schmatz et al. 1992, DOI:10.7164/antibiotics.45.1886, PMID:1490879; Chen et al.
  2013, DOI:10.1186/1471-2164-14-339, PMID:23688303).'
molecular_targets:
- target_id: GO:0000148
