  target_type: PROTEIN_COMPLEX
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  experimental_context: Non-competitive inhibition of fungal membrane-bound 1,3-beta-D-glucan
    synthase activity across Candida albicans and Saccharomyces cerevisiae, with target
    identity confirmed by cloning of the echinocandin/pneumocandin target subunit
    FKS1 (ETG1) and paralog GSC2 (FKS2) (Schmatz et al. 1992, DOI:10.7164/antibiotics.45.1886,
    PMID:1490879; Douglas et al. 1994, DOI:10.1073/pnas.91.26.12907, PMID:7809096).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 1994-12
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.7164/antibiotics.45.1886
    snippet: Schmatz et al. demonstrated that pneumocandin A0 (L-671,329) potently
      inhibits fungal 1,3-beta-D-glucan synthase and cell-wall biosynthesis in Candida
      species and Pneumocystis carinii.
    notes: Schmatz et al. 1992 (J Antibiot 45:1886-1891; PMID:1490879) established
      inhibition of fungal 1,3-beta-D-glucan synthesis by pneumocandin A0.
  - reference: PMID:1490879
    notes: PubMed record for Schmatz et al. 1992 on pneumocandin A0 1,3-beta-D-glucan
      synthase inhibition.
  - reference: DOI:10.1073/pnas.91.26.12907
    notes: Douglas et al. 1994 (Proc Natl Acad Sci U S A 91:12907-12911; PMID:7809096)
      identified Saccharomyces cerevisiae FKS1 (ETG1) as the catalytic/target subunit
      of 1,3-beta-D-glucan synthase conferring echinocandin/pneumocandin resistance
      upon mutation.
  - reference: PMID:7809096
    notes: PubMed record for Douglas et al. 1994 identifying FKS1 (ETG1) as the 1,3-beta-D-glucan
      synthase target subunit.
