    snippet: Schmatz et al. characterized pneumocandin A0 (L-671,329), an echinocandin-like
      cyclic lipohexapeptide from Zalerion arboricola (Glarea lozoyensis) that inhibits
      fungal 1,3-beta-D-glucan synthesis and displays potent antifungal activity against
      pathogenic Candida species and Pneumocystis carinii.
    notes: Reported by Schmatz et al. 1992 (J Antibiot 45:1886-1891; PMID:1490879;
      DOI:10.7164/antibiotics.45.1886) and Chen et al. 2013 (BMC Genomics 14:339;
      PMID:23688303; DOI:10.1186/1471-2164-14-339) as a 10,12-dimethylmyristoyl echinocandin-class
      cyclic lipohexapeptide antifungal produced by Glarea lozoyensis. MIBiG 4.0.1
      entry BGC0001035, ChEBI CHEBI:198520, and PubChem CID 139583400 supply the stereo-complete
      SMILES, Standard InChI, and InChIKey.
