  evidence:
  - reference: DOI:10.1128/AAC.02280-16
    snippet: Colley et al. characterized PC945 (opelconazole) as a novel inhaled triazole
      inhibitor of Aspergillus fumigatus sterol 14-alpha-demethylase (CYP51A IC50
      = 0.23 uM; CYP51B IC50 = 0.22 uM) and reported an MIC50 of 0.032 ug/mL and MIC90
      of 0.064 ug/mL across 96 clinical A. fumigatus isolates.
    notes: Reported by Colley et al. 2017 (Antimicrob Agents Chemother 61:e02280-16;
      PMID:28264849) and Rudramurthy et al. 2019 (J Antimicrob Chemother 74:2943-2951;
      DOI:10.1093/jac/dkz280) as a lung-retention-optimized triazole antifungal (PC945)
      targeting fungal lanosterol 14-alpha-demethylase (CYP51A/CYP51B) across Aspergillus
      and Candida species. PubChem CID 121383526 supplies the standard InChI, InChIKey,
      formula, and isomeric SMILES for opelconazole.
