definition: An enamide resulting from the formal condensation of 3-(p-tert-butylphenyl)-3-(6-chloropyridin-2-yl)acrylic
  acid with the amino group of morpholine. A fungicide developed in China, it shows
  high antifungal activity against diseases caused by Phytophthora infestans, Phytophthora
  capsici, Rhizoctonia solani, Peronophythora litchi, and Pseudoperonospora cubensis.
