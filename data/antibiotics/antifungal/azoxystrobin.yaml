identifier: CHEBI:40909
label: azoxystrobin
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: An aryloxypyrimidine having a 4,6-diphenoxypyrimidine skeleton in which
  one of the phenyl rings is cyano-substituted at C-2 and the other carries a 2-methoxy-1-(methoxycarbonyl)vinyl
  substituent, also at C-2. An inhibitor of mitochondrial respiration by blocking
  electron transfer between cytochromes b and c1, it is used widely as a fungicide
  in agriculture.
