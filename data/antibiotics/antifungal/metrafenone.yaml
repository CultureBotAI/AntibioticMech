definition: A member of the class of benzophenones that is benzophenone in which one
  of the phenyl groups is substituted by methoxy groups at positions 2, 3, and 4 and
  by a methyl group at position 6, while the other is substituted at positions 2,
  3, and 6 by methyl, bromine, and methoxy groups, respectively. A fungicide with
  protectant and curative properties, it is used for the control of powdery mildew
  in cereals and grape vines.
