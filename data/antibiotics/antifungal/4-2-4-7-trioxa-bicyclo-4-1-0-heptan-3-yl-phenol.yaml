definition: A cyclic acetal resulting from the formal condensation of the aldehydic
  group of p-hydroxybenzaldehyde with the hydroxy groups of 1,2-epoxypropane-1,3-diol.
  Isolated from Pestalotiopsis mangiferae, an endophytic fungus associated with the
  mango (Mangifera indica), it shows potent antibacterial and antifungal activity
  against E. coli, Bacillus subtilis, Klebsiella pneumoniae, Micrococcus luteus, Pseudomonas
  aeruginosa and Candida albicans.
