definition: A member of the class of aminopyrimidine that is N-phenylpyrimidin-2-amine
  carrying additional cyclopropyl and methyl substituents at positions 4 and 6 respectively.
  A broad spectrum fungicide used to control a range of pathogens including Tapesia
  yallundae, Botrytis spp., Alternaria spp. and Rhynchospium secalis. Whilst it is
  a recognised irritant no serious human health concerns have been identified. It
  is moderately toxic to birds as well as most aquatic organisms and earthworms, but
  it is not considered toxic to honeybees.
