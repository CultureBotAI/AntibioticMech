definition: A member of the class of thiazolidinones that is 2-sulfanylidene-1,3-thiazolidin-4-one
  in which the hydrogens at positions 3 and 5 are replaced by carboxymethyl and 3-(1-phenylethoxy)-4-(2-phenylethoxy)benzylidene
  groups, respectively. It is an inhibitor of protein mannosyl transferase 1 (PMT1)
  and blocks protein O-mannosylation.
