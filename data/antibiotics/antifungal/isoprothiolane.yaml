definition: A malonate ester that is diisopropyl malonate in which the two methylene
  hydrogens at position 2 are replaced by a 1,3-dithiolan-2-ylidene group. An insecticide
  and fungicide used to control a range of diseases including Pyricularia oryzae,
  Helminthosporium sigmoideum and Fusarium nivale.
