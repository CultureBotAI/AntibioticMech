definition: An indolyl carboxylate ester that is 1H-indole substituted by methoxycarbonyl
  and (E)-(8-oxo-1,5,6,8-tetrahydro-2H-1,5-methanopyrido[1,2-a][1,5]diazocin-3(4H)-yl)diazenyl
  groups at positions 2 and 3, respectively. It targets the enoyl reductase domain
  of fungal fatty acid synthase, exhibits broad-spectrum antifungal activity, is bioactive
  against the filamentous mold, Aspergillus fumigatus and has minimal mammalian cytotoxicity.
