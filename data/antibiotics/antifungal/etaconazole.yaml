definition: A member of the class of dioxolanes that is 1,3-dioxolane substituted
  at position 2 by 2,4-dichlorophenyl and 1,2,4-triazol-1-ylmethyl groups and at position
  4 by an ethyl group. An obsolete fungicide that was used to control powdery mildew
  on fruit and other crops.
