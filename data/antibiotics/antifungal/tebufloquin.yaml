definition: A member of the class of quinolines that is quinoline which is substituted
  at positions 2 and 3 by methyl groups and at positions 4, 6, and 8 by acetoxy, tert-butyl,
  and fluorine, respectively. A fungicide developed mainly for the control of rice
  blast (Magnaporthe grisea), it has also been found to be effective against fungal
  diseases in soya beans and tomatoes.
