definition: A pyrazolone that is pyazol-3-one which is substituted at positions 2,
  4, and 5 by isopropyl, o-methylphenyl, and amino groups, respectively, and in which
  the hydrogen attached to the nitrogen at position 1 is replaced by an S-allyl carbothioate
  moiety. A fungicide, it is used for the control of Botrytis in the greenhouse cultivation
  of tomatoes, peppers, and cucumbers.
