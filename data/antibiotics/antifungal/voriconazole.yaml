identifier: CHEBI:10023
label: voriconazole
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A triazole-based antifungal agent used for the treatment of esophageal
  candidiasis, invasive pulmonary aspergillosis, and serious fungal infections caused
  by Scedosporium apiospermum and Fusarium spp. It is an inhibitor of cytochrome P450
  2C9 (CYP2C9) and CYP3A4.
