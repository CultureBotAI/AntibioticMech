definition: An agricultural fungicide that is a systemic conazole (imidazole) fungicide
  used for the control of many seed-borne and soil-borne diseases and fungi particularly
  Ascomycetes and Basidiomycetes. It has a broad spectrum of action, being systemic
  with protective and curative action, but is known to disrupt membrane function.
  It also has a role as a chelator. It is a tertiary alcohol, a member of triazoles
  and a dichlorobenzene. In FungAMR, it was listed as having effects against Aspergillus
  fumigatus. It is commonly used in the control of apple, coffee and peanut diseases,
  but is also used for various other fruits and vegetables. Major consumption is in
  Asian countries and it is used mainly for the control of rice sheath blight in China,
  India, Vietnam, and parts of East Asia. It was introduced in the 1980s, it is not
  approved for use within the European Union.
