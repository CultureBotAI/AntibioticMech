definition: An oxime O-ether that is the (Z)-oxime derivative of 1-methyl-1H-tetrazol-5-yl
  phenyl ketone in which the hydrogen of the hydroxy group has been replaced by the
  N-tert-butoxycarbonyl derivative of a [6-(Boc-amino)pyridin-2-yl]methyl group. It
  is a novel fungicide developed for use on cereals.
