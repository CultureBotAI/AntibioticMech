identifier: CHEBI:599440
label: amorolfine
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of morpholines that is cis-2,6-dimethylmorpholine
  in which the hydrogen attached to the nitrogen is replaced by a racemic 2-methyl-3-[p-(2-methylbutan-2-yl)phenyl]propyl
  group. An inhibitor of the action of squalene monooxygenase, Δ14 reductase and D7-D8
  isomerase and an antifungal agent, it is used (generally as its hydrochloride salt)
  for the topical treatment of fungal nail and skin infections.
