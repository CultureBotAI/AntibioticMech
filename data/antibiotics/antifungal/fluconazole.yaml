identifier: CHEBI:46081
label: fluconazole
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of triazoles that is propan-2-ol substituted at
  position 1 and 3 by 1H-1,2,4-triazol-1-yl groups and at position 2 by a 2,4-difluorophenyl
  group. It is an antifungal drug used for the treatment of mucosal candidiasis and
  for systemic infections including systemic candidiasis, coccidioidomycosis, and
  cryptococcosis.
