definition: A carbamate ester that is the propyl ester of 3-(dimethylamino)propylcarbamic
  acid. It is a systemic fungicide, used (normally as the hydrochloride salt) for
  the control of soil, root and leaf diseases caused by oomycetes, particularly Phytophthora
  and Pythium species.
