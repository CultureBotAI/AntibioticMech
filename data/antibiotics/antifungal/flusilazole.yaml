definition: An organosilicon compound that is dimethylsilane in which the hydrogens
  attached to the silicon are replaced by p-fluorophenyl groups and a hydrogen attached
  to one of the methyl groups is replaced by a 1H-1,2,4-triazol-1-yl group. It is
  a broad-sepctrum fungicide used to protect a variety of crops.
