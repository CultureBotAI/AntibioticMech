identifier: CHEBI:4031
label: cyclosporin A
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cyclic nonribosomal peptide of eleven amino acids; an immunosuppressant
  drug widely used in post-allogeneic organ transplant to reduce the activity of the
  patient's immune system, and therefore the risk of organ rejection. Also causes
  reversible inhibition of immunocompetent lymphocytes in the G0- and G1-phase of
  the cell cycle.
