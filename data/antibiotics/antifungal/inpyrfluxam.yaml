definition: A member of the class of indanes that is indane substituted by methyl
  groups at positions 1,1 and 3R and by a [3-(difluoromethyl)-1-methyl-1H-pyrazole-4-carbonyl]amino
  group at position 4. It is a fungicide that is a Complex II succinate dehydrogenase
  inhibitor, which is a functional part of the tricarboxylic acid cycle and linked
  to the mitochondrial electron transport chain. It exhibits high efficacy against
  major plant diseases including Brown Rust on wheat, Net Blotch on barley, and Black
  Scurf on potato.
