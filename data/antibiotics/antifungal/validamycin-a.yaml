definition: A member of the class of validamycins that is (1R,2S,3S,4S,6R)-4-amino-6-(hydroxymethyl)cyclohexane-1,2,3-triol
  in which the hydroxy group at position 1 has been converted to its β-D-glucoside
  and in which one of the hydrogens attached to the nitrogen is replaced by a (1R,4R,5R,6S)-4,5,6-trihydroxy-3-(hydroxymethyl)cyclohex-2-en-1-yl
  group. It is the major validamycin produced by Streptomyces hygroscopicus.
