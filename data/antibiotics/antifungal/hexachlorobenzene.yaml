definition: A member of the class of chlorobenzenes that is benzene in which all of
  the hydrogens are replaced by chlorines. An agricultural fungicide introduced in
  the mid-1940s and formerly used as a seed treatment, its use has been banned since
  1984 under the Stockholm Convention on Persistent Organic Pollutants.
