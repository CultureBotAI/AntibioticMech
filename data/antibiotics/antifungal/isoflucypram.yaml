definition: A tertiary carboxamide resulting from the formal condensation of the carboxy
  group of 3-(difluoromethyl)-5-fluoro-1-methyl-1H-pyrazole-4-carboxylic acid with
  the amino group of N-[5-chloro-2-(propan-2-yl)benzyl]cyclopropanamine. It is a broad
  spectrum fungicide developed by Bayer that exhibits high efficacy against the major
  fungal diseases of cereal crops (wheat, triticale, rye, barley and oats).
