definition: A 5-methyl-5-(4-phenoxyphenyl)-3-(phenylamino)-1,3-oxazolidine-2,4-dione
  that is the (active) (S)-enantiomer of famoxadone. It prevents spore germination
  and mycelial growth of sensitive fungi and is used in agriculture for the control
  of various fungal diseases.
