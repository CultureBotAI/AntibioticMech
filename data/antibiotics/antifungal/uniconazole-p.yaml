definition: A (1E)-1-(4-chlorophenyl)-4,4-dimethyl-2-(1H-1,2,4-triazol-1-yl)pent-1-en-3-ol
  that has S configuration at the chiral centre. It is the enantiomer of (R)-uniconazole;
  the fungicide and plant growth retardant uniconazole is the racemic mixture comprising
  (R)-uniconazole and uniconazole-P.
