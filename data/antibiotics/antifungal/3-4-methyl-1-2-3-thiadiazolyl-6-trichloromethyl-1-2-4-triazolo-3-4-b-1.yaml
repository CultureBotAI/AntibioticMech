definition: A triazolothiadiazole that is 1,7a-dihydro[1,2,4]triazolo[3,4-b][1,3,4]thiadiazole
  substituted by a 4-methyl-1,2,3-thiadiazol-5-yl group at position 3 and by a trichloromethyl
  group at position 6. It is a fungicide with a wide spectrum of activity and inhibits
  the enzymatic activity of pyruvate kinase.
