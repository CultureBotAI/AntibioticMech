definition: A hydrochloride resulting from the formal reacton of equimolar amounts
  of hydrogen chloride and amorolfine. An inhibitor of the action of squalene monooxygenase,
  Δ14 reductase and D7-D8 isomerase and an antifungal agent, it is used for the topical
  treatment of fungal nail and skin infections.
