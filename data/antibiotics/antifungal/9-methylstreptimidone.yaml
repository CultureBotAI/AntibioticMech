  from Streptomyces species (related to cycloheximide and streptimidone) that inhibits
  eukaryotic 80S ribosome-mediated translation and fungal hyphal growth in phytopathogenic
  and yeast fungi (Wang et al. 2013, DOI:10.1021/ol400224n, PMID:23438151; Song et
  al. 2025, DOI:10.1016/j.pestbp.2025.106683, PMID:41162067).'
