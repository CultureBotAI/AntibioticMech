    snippet: 9-Methylstreptimidone is an antifungal and antiviral glutarimide polyketide
      produced by the modular polyketide synthase Smd in Streptomyces.
    notes: Wang et al. 2013 (Org Lett 15:1278-1281; PMID:23438151) characterized the
      biosynthesis and antifungal glutarimide-polyketide scaffold of 9-methylstreptimidone
      in Streptomyces.
  - reference: DOI:10.1016/j.pestbp.2025.106683
    notes: Song et al. 2025 (Pestic Biochem Physiol 214:106683; PMID:41162067) demonstrated
      antifungal activity and cellular growth inhibition by Streptomyces-derived 9-methylstreptimidone
      against fungal pathogens.
