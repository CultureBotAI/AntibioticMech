definition: A cyclopropylcarboxamide obtained by formal condensation of the carboxy
  group of 2,2-dichloro-1-ethyl-3-methylcyclopropanecarboxylic acid with the amino
  group of 1-(4-chlorophenyl)ethylamine. A rice fungicide with specific action against
  Pyricularia oryzae. It is not highly toxic to mammals but shows a moderate level
  of toxicity to birds, fish and earthworms.
