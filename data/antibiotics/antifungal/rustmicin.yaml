  taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  experimental_context: Subnanomolar inhibition of purified membrane-bound fungal
    inositol phosphorylceramide (IPC) synthase activity (Aur1 / Ipc1) across Cryptococcus
    neoformans (IC50 = 70 pM), Candida albicans, and Saccharomyces cerevisiae, blocking
    transfer of myo-inositol phosphate from phosphatidylinositol to phytoceramide
    (Mandala et al. 1998, DOI:10.1074/jbc.273.24.14942, PMID:9614099).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 1998-06
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.1074/jbc.273.24.14942
    snippet: Mandala et al. identified the 14-membered macrolide rustmicin (galbonolide
      A) as a potent, selective inhibitor of fungal inositol phosphorylceramide (IPC)
      synthase (AUR1/IPC1) with an IC50 of 70 pM against Cryptococcus neoformans IPC
      synthase.
    notes: Mandala et al. 1998 (J Biol Chem 273:14942-14949; PMID:9614099) demonstrated
      direct subnanomolar inhibition of fungal IPC synthase (Aur1/Ipc1) and sphingolipid
      biosynthesis by rustmicin across Saccharomyces cerevisiae, Candida albicans,
      and Cryptococcus neoformans.
  - reference: PMID:9614099
    notes: PubMed record for Mandala et al. 1998 establishing fungal inositol phosphorylceramide
      synthase (Aur1/Ipc1) as the direct target of rustmicin.
