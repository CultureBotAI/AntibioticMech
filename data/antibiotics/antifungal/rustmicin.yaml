mode_of_action_notes: 'CURATOR: 14-Membered macrolide polyketide (galbonolide A) from
  Micromonospora sp. and Streptomyces galbus that potently inhibits fungal inositol
  phosphoceramide (IPC) synthase (IC50 = 70 pM against Cryptococcus neoformans IPC
  synthase), blocking essential fungal sphingolipid biosynthesis (Mandala et al. 1998,
  DOI:10.1074/jbc.273.24.14942, PMID:9614099; Karki et al. 2010, DOI:10.1111/j.1574-6968.2010.02048.x,
  PMID:20662933).'
