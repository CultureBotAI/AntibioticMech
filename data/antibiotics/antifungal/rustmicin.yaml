    snippet: Mandala et al. identified the 14-membered macrolide rustmicin (galbonolide
      A) as an ultra-potent inhibitor of fungal inositol phosphoceramide synthase
      (IC50 = 70 pM against Cryptococcus neoformans IPC synthase) with fungicidal
      activity against Cryptococcus neoformans (<1 ng/mL) and Candida species.
    notes: Reported by Mandala et al. 1998 (J Biol Chem 273:14942-14949; PMID:9614099;
      DOI:10.1074/jbc.273.24.14942) and Karki et al. 2010 (FEMS Microbiol Lett 310:69-75;
      PMID:20662933; DOI:10.1111/j.1574-6968.2010.02048.x) as a 14-membered macrolide
      polyketide from Micromonospora sp. and Streptomyces galbus that inhibits fungal
      sphingolipid biosynthesis. MIBiG 4.0.1 entry BGC0000065, ChEBI CHEBI:206910,
      and PubChem CID 10091177 supply the stereo-complete SMILES, Standard InChI,
      and InChIKey.
