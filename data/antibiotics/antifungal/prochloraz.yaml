definition: A member of the class of ureas that is 1H-imidazole-1-carboxamide substituted
  by a propyl and a 2-(2,4,6-trichlorophenoxy)ethyl group at the amino nitrogen atom.
  A fungicide active against a wide range of diseases affecting field crops, fruit,
  turf and vegetables.
