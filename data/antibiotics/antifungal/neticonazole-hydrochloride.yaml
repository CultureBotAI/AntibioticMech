definition: A hydrochloride resulting from the formal reaction of equimolar amounts
  of neticonazole and hydrogen chloride. An inhibitor of P450-dependent C-14α-demethylation
  of lanosterol (preventing conversion to ergosterol and inhibiting cell wall synthesis
  in fungi), it is used in Japan as an antifungal drug for the treatment of superficial
  skin infections.
