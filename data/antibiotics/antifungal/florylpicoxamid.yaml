identifier: CHEBI:156432
label: florylpicoxamid
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A carboxylic ester resulting from the formal condensation of the carboxy
  group of N-{[3-(acetyloxy)-4-methoxypyridin-2-yl]carbonyl}-L-alanine with the hydroxy
  group of (2S)-1,1-bis(4-fluorophenyl)propan-2-ol. It is a fungicide introduced by
  Dow AgroSciences for the control of a wide variety of pathogens such as Septoria
  spp, Powdery Mildews, Botrytis spp, and others in cereals, vines, fruits, nuts and
  vegetables.
