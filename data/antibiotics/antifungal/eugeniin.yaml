definition: An ellagitannin isolated from the dried flower buds of Eugenia caryophyllata.
  It exhibits α-glucosidase inhibitory activity and antiviral activity against acyclovir
  and phosphonoacetic acid (PAA)-resistant herpes simplex virus type 1 (HSV-1) as
  well as the wild-type HSV-1.
