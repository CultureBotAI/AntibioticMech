definition: An aryl sulfide that is diphenyl sulfide in which each phenyl group is
  substituted at position 2 by hydroxy and at positions 3 and 5 by chlorine. A fungicide
  and anthelmintic, it was used in various topical drug products for the treatment
  of liver flukes, but withdrawn after being shown to be a potent photosensitizer
  with the potential to cause serious skin disorders.
