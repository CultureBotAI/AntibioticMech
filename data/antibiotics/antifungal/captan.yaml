definition: A dicarboximide that is 3a,4,7,7a-tetrahydrophthalimide in which the hydrogen
  attached to the nitrogen is replaced by a trichloromethyl group. A non-systemic
  fungicide introduced in the 1950s, it is widely used for the control of fungal diseases
  in fruits, vegetables, and ornamental crops.
