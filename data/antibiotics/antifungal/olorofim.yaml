  evidence:
  - reference: DOI:10.1128/aac.00307-23
    snippet: Olorofim is a first-in-class orotomide antifungal agent that acts via
      inhibition of the pyrimidine biosynthesis enzyme dihydroorotate dehydrogenase
      (DHODH). Olorofim showed potent in vitro activity against A. fumigatus (n =
      1,031; MIC50/90, 0.03/0.06 mg/L; 100% WT), including itraconazole-non-wild-type
      (NWT; n = 98; MIC50/90, 0.03/0.06 mg/L) and voriconazole-NWT (n = 55; MIC50/90,
      0.03/0.06 mg/L) isolates.
    notes: Reported by Pfaller et al. 2023 (Antimicrob Agents Chemother 67:e0030723;
      PMID:37338411) as a first-in-class orotomide pyrrole-2-yl-2-oxoacetamide antifungal
      (F901318) that inhibits fungal dihydroorotate dehydrogenase (DHODH), showing
      MIC50/MIC90 of 0.03/0.06 mg/L across 1,031 clinical Aspergillus fumigatus isolates.
