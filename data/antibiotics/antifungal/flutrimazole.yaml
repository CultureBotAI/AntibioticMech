definition: An imidazole antifungal agent that is imidazole in which the hydrogen
  attached to the nitrogen is replaced by a 2,4'-difluorotrityl group. A topical antifungal
  agent which displays potent broad-spectrum in vitro activity against dermatophytes,
  filamentous fungi and yeasts.
