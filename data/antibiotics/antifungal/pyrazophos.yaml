definition: A member of the class of pyrazolopyrimidines that is the ethyl ester of
  2-[(diethoxyphosphorothioyl)oxy]-5-methylpyrazolo[1,5-a]pyrimidine-6-carboxylic
  acid. A profungicide (by hydrolysis of the thionophosphate group to afford the corresponding
  2-hydroxypyrazolopyrimidine fungicide), it is used to control Erysiphe, Helminthosporium
  and Rhynchospium in cereals.
