definition: A carbamate ester that is carbamic acid in which the nitrogen has been
  substituted by a butyl group and in which the hydrogen of the carboxy group is replaced
  by a 1-iodoprop-2-yn-3-yl group. A fungicide, it is used as a preservative and sapstain
  control chemical in wood products and as a preservative in adhesives, paints, latex
  paper coating, plastic, water-based inks, metal working fluids, textiles, and numerous
  consumer products.
