definition: A member of the class of bromoindoles that is 3-bromo-6-fluoro-2-methylindole
  substituted at position 1 by a 1-(dimethylsulfamyl)-1,2,4-triazole-3-sulfonyl group.
  A fungicide for use on potatoes to control late blight (Phytophthora infestans)
  and downy mildew [Plasmopara viticola). It has a low mammalian toxicity but it is
  considered to be a reproduction toxicant, is moderately toxic to birds and honey
  bees but poses a greater risk to aquatic species and earthworms.
