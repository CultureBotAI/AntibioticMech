definition: An organic nitrate salt obtained by reaction of equimolar amounts of arasertaconazole
  and nitric acid. The active R-enantiomer of sertaconazole nitrate that is used for
  treatment of vulvovaginal candidiasis. The racemate itself is also used as a broad-spectrum
  antifungal drug.
