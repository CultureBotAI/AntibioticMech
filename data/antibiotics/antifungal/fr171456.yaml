definition: A steroid acid that is 9β,19-cyclo-5α-ergost-24(28)-ene-4α-carboxylic
  acid which is substituted by hydroxy groups at the 3β, 8α, and 11α positions, by
  a methyl group at the 4β position, and by oxo groups at positions 1 and 6. It is
  a cholesterol and ergosterol synthesis inhibitor isolated from the fungus Sporormiella
  minima that specifically targets the enzyme, sterol-4-alpha-carboxylate-3-dehydrogenase,
  encoded by ERG26 in budding yeast, and NSDHL in humans.
