definition: An organic sodium salt that is monosodium salt of eurysterol B sulfonic
  acid. Isolated from an undescribed marine sponge of the genus Euryspongia collected
  in Palau, it is cytotoxic and exhibits antifungal activity against both amphotericin
  B-resistant and wild-type strains of Candida albicans.
