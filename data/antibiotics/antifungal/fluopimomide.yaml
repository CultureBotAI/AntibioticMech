identifier: CHEBI:145667
label: fluopimomide
antimicrobial_class: ANTIFUNGAL
curation_status: SEEDED
grounding_status: EXACT
definition: A benzamide resulting from the formal condensation of the carboxy group
  of 2,3,5,6-tetrafluoro-4-methoxybenzoic acid with the amino group of 1-[3-chloro-5-(trifluoromethyl)pyridin-2-yl]methanamine.
  It is a benzamide fungicide, synthesized by Shandong Sino-Agri United Biotechnology
  Co., Ltd (China). Used for the control of cucumber and grape downy mildew, phytophthora
  capsici, litchi downy blight, potato late blight, rice sheath blight, and cotton
  rhizoctonia solani.
