definition: A polyketide that is 2,3-dihydrofuran substituted by hydroxy, methyl,
  oxo, methyl and (2S,3Z,5E,7R,8R,9E)-2,8-dihydroxy-7,9,12-trimethyltrideca-3,5,9-trien-1-yl
  groups at positions 2, 2, 3, 4, and 5, respectively. It is a cytotoxic natural product
  found in several myxobacteria species and inhibits the growth of some filamentous
  fungi.
