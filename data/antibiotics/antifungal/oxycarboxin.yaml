definition: An anilide obtained by formal condensation of the amino group of aniline
  with the carboxy group of 2-methyl-5,6-dihydro-4,4-dioxo-1,4-oxathiine-3-carboxylic
  acid. A fungicide for the control of rust diseases on ornamentals, cereals and nursery
  trees as well as fairy rings on turf.
