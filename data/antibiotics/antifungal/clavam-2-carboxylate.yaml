mode_of_action_notes: 'CURATOR: (5S)-Clavam natural product produced by Streptomyces
  clavuligerus that lacks beta-lactamase inhibitory activity due to its (5S) ring-junction
  stereochemistry and acts as an antifungal antimetabolite inhibiting fungal cellular
  metabolic pathways (Brown et al. 1979, DOI:10.1039/C39790000282; Mosher et al. 2000,
  DOI:10.1128/AAC.44.3.720-726.2000, PMID:10681345; Tahlan et al. 2007, DOI:10.1016/j.chembiol.2006.11.012,
  PMID:17317567).'
molecular_targets:
- target_id: GO:0044237
  target_label: fungal cellular metabolic process
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:4751
  taxon_label: Fungi
  experimental_context: Whole-cell antifungal bioassays and (5S)-clavam biosynthetic
    pathway studies demonstrate that clavam-2-carboxylate inhibits fungal growth without
    inhibiting bacterial beta-lactamases (Brown et al. 1979, DOI:10.1039/C39790000282;
    Mosher et al. 2000, DOI:10.1128/AAC.44.3.720-726.2000, PMID:10681345; Tahlan et
    al. 2007, DOI:10.1016/j.chembiol.2006.11.012, PMID:17317567).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2000-03
  source_retrieved_on: '2026-11-09'
  evidence:
  - reference: PMID:10681345
    notes: Mosher et al. 2000 (Antimicrob Agents Chemother 44:720-726; DOI:10.1128/AAC.44.3.720-726.2000)
      characterized the paralogous early biosynthetic steps for clavulanic acid and
      the antifungal (5S)-clavam metabolites including clavam-2-carboxylate in Streptomyces
      clavuligerus.
  - reference: PMID:17317567
    notes: Tahlan et al. 2007 (Chem Biol 14:131-142; DOI:10.1016/j.chembiol.2006.11.012)
      established the late (5S)-clavam biosynthetic pathway and antifungal bioactivity
      of clavam-2-carboxylate.
  - reference: DOI:10.1039/C39790000282
    notes: Brown et al. 1979 (J Chem Soc Chem Commun 1979:282-283) isolated clavam-2-carboxylate
      from Streptomyces clavuligerus and reported its antifungal activity and absence
      of beta-lactamase inhibition.
