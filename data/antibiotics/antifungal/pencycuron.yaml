definition: A member of the class of phenylureas that is urea which is substituted
  by p-chlorobenzyl and cyclopentyl groups at position 1 and a phenyl group at position
  3. A fungicide used to control diseases caused by Rhizoctonia solani and Pellicularia
  spp. It is not highly toxic to mammals but is moderately toxic to birds, most aquatic
  organisms, honeybees and earthworms.
