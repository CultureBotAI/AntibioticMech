definition: A tertiary amine that is N-methyl-1-naphthalenemethylamine in which the
  amino hydrogen is replaced by a 3-(tertbutylethynyl)allyl group. An antifungal agent
  administered orally (generally as the hydrochloride salt) for the treatment of skin
  and nail infections.
