definition: An angucycline antibiotic that consists of a tetrangomycin skeleton linked
  to deoxy sugars through C-glycosidic and O-glycosidic bonds at positions 9 and 3
  respectively. It is isolated from Streptomyces sp.KY002 and exhibits cytotoxicity
  against human lung cancer and MCF-7 human breast cancer cells.
