definition: A member of the class of xanthones that is 9H-xanthen-9-one substituted
  by a 2,2-dimethyl-4-(prop-1-en-2-yl)cyclopentyl group at position 2, hydroxy groups
  at positions 1, 3 and 6 and a methoxy group at position 5. It is isolated from the
  callus of Hypericum perforatum and exhibits antioxidant and antimicrobial activities.
