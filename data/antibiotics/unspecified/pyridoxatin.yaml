definition: A member of the class of dihydroxypyridines that is 1,4-dihydroxypyridin-2-one
  carrying an additional 6-ethenyl-2,4-dimethylcyclohexyl substituent at position
  3. Pyridoxatin is a MMP-2 (Gelatinase A) inhibitor with antibiotic and anticancer
  properties. Also indicated to be a lipid peroxidation and DNA synthesis inhibitor
  as well as a free radical scavenger.
