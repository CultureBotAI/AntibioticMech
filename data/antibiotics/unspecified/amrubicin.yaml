definition: A synthetic anthracycline antibiotic with molecular formula C25H25NO9.
  A specific inhibitor of topoisomerase II, it is used (particularly as the hydrochloride
  salt) in the treatment of cancer, especially lung cancer, where it is a prodrug
  for the active metabolite, ambrucinol.
