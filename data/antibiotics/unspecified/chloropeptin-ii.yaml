definition: A heterodetic cyclic peptide consisting of N-acylated trytophan, 3,5-dichloro-4-hydroxyphenylglycine,
  4-hydroxyphenylglycine, 3,5-dichloro-4-hydroxyphenylglycyl, tyrosine and 4-hydroxyphenylglycine
  residues joined in sequence and in which the side-chain of the central 4-hydroxyphenylglycine
  residue is attached to the side-chain of the tryptophan via a C3-C6 bond and to
  the side-chain of the tyrosine via an ether bond from C5. It is isolated from the
  culture broth of Streptomyces and has anti-HIV-1 activity.
