definition: A benzothiadiazine, hydrogenated at positions 2, 3 and 4 and substituted
  with an aminosulfonyl group at C-7, a chloro substituent at C-6 and a dichloromethyl
  group at C-3 and with S-1 as an S,S-dioxide. A sulfonamide antibiotic, it is used
  as a diuretic to treat oedema (including that associated with heart failure) and
  hypertension.
