definition: A dibenzodioxocine that is 5H,7H-dibenzo[b,g][1,5]dioxocin-5-one substituted
  by a hydroxy group at position 11, a (1S)-1-hydroxy-3-methylbutyl group at position
  3 and a methoxy and a methyl group at positions 4 and 9 respectively. It is isolated
  from the culture broth of Penicillium asperosporum and acts as an acyl-CoA:cholesterol
  acyltransferase inhibitor.
