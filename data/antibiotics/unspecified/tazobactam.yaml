definition: A member of the class of penicillanic acids that is sulbactam in which
  one of the exocyclic methyl hydrogens is replaced by a 1,2,3-triazol-1-yl group;
  used (in the form of its sodium salt) in combination with ceftolozane sulfate for
  treatment of complicated intra-abdominal infections and complicated urinary tract
  infections.
