definition: A member of the class of morpholines that is morpholine-2,5-dione substituted
  by a benzyl, isopropyl and a methyl group at positions 3, 6 and 4 respectively.
  It is isolated from the culture broth of the fungus Beauveria bassiana and acts
  as a platelet aggregation inhibitor.
