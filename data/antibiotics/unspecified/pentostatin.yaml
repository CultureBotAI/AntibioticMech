mode_of_action_notes: 'CURATOR: PMID:18602399 resolved pentostatin (2''-deoxycoformycin)
  bound to Plasmodium vivax adenosine deaminase, a central enzyme in parasite purine
  salvage. The conserved enzyme is host-shared, while the structures identify parasite-specific
  conformational and substrate-recognition features that may support selectivity.'
