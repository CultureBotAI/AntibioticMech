mode_of_action_notes: 'CURATOR: PMID:23361008 showed that agrocin 84 is processed
  inside susceptible Agrobacterium into the toxic moiety TM84. TM84 requires tRNA(Leu)
  for tight binding to the leucyl-tRNA synthetase synthetic active site and traps
  an aminoacylation-like enzyme-tRNA complex. The direct structural target claim therefore
  applies to the active metabolite, not to unprocessed agrocin 84.'
