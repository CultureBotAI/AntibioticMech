definition: A member of the class of cinnamamides that is tyramine substituted by
  a (1E)-3-oxo-1-phenylprop-1-en-3-yl group at the nitrogen atom. It is found in rice
  and exhibits an allelopathic effect to suppress the growth of weeds.
