definition: A member of the class of dihydroxy-1,4-benzoquinones that is 2,5-dihydroxy-1,4-benzoquinone
  which is substituted by an undecyl group at position 3. Isolated from Lysimachia
  punctata and Embelia ribes, it exhibits antimicrobial, antineoplastic and inhibitory
  activity towards hepatitis C protease.
