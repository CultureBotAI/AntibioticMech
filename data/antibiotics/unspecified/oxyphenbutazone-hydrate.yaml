definition: A hydrate obtained by combining oxyphenbutazone with one molar equivalent
  of water. Commonly used to treat pain, swelling and stiffness associated with arthritis
  and gout, it was withdrawn from the market 1984 following association with blood
  dyscrasis and Stevens-Johnson syndrome.
