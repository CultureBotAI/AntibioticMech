  preacylation complex with an engineered S70C SHV-1 beta-lactamase. The mutation
  and an unexpected C70-K73 sulfenamide bond were used to trap the otherwise reactive
  complex, so this structure establishes inhibitor recognition but is not a wild-type
  preacylation structure.'
