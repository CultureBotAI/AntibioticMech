definition: An organic heterobicyclic compound that is 7,7a-dihydrocyclopenta[b]pyran-6(2H)-one
  substituted by a hydroxy group at position 5 and a prop-2-en-1-ylidene group at
  position 7 (the E isomer). Isolated from the sponge Ulosa and ascidian Diplosoma
  virens, it exhibits antimicrobial activity and toxicity against HCT116 cells (human
  colorectal cancer cells) by triggering apoptotic cell death.
