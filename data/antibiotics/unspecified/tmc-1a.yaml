definition: A polyene antibiotic that is 2-amino-4,5-dihydroxycyclohex-2-en-1-one
  in which the hydrogen at position 4 is replaced by a by an all-E-6-carboxyhexa-1,3,5-trien-1-yl
  group; in which the amino group has been acylated by a (2E)-2,4-dimethyloct-2-enoyl
  group; and in which the carboxy group of the resulting carboxylic acid has been
  condensed with the amino group of 2-amino-3-hydroxycyclopent-2-en-1-one to give
  the corresponding carboxamide. TMC-1A is an antitumour antibiotic isolated from
  Streptomyces sp. A-230.
