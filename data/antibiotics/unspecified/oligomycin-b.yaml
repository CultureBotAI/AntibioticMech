definition: An oligomycin with formula C45H72O12 that is oligomycin A in which the
  spirocyclic ring bearing the 2-hydroxypropyl substituent has been substituted by
  an oxo group at the carbon which is directly attached to the spirocentre. It is
  a nonselective inhibitor of the mitochondrial F1F0 ATP synthase.
