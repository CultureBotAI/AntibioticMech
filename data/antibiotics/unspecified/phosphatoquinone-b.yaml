definition: A hydroxy-1,4-naphthoquinone that is 1,4-naphthoquinone substituted by
  a (2E)-3,7-dimethylocta-2,6-dien-1-yl group at position 2, a methyl group at position
  3, and hydroxy groups at positions 5 and 7. It is isolated from the culture broth
  of Streptomyces sp.TC-0363 and exhibits inhibitory activity against the enzyme protein
  tyrosine phosphatase.
