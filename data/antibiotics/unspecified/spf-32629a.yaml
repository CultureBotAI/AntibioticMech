definition: A carboxylic ester obtained by the formal condensation of the secondary
  hydroxy group of 4-hydroxy-6-[hydroxy(phenyl)methyl]pyridin-2(1H)-one with 3-methylbutanoic
  acid. It is isolated from the culture broth of Penicillium sp. SPF-32629 and acts
  as an inhibitor of the enzyme chymase (EC 3.4.21.39).
