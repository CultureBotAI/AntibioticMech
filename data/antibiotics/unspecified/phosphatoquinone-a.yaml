definition: An organic heterotricyclic compound resulting from the formal epoxidation
  of the 2-3 double bond of the 1,4-naphthoquinone moiety of phosphatoquinone B. It
  is isolated from the culture broth of Streptomyces sp.TC-0363 and exhibits inhibitory
  activity against the enzyme protein tyrosine phosphatase.
