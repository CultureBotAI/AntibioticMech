definition: A naturally occurring antibiotic and antitumor agent isolated from Actinomadura
  verrucosopora. Its chemical structure consists of a core bicyclo[7.3.1]tridecadiynene
  moiety containing a 1,5-diyn-3-ene as part of a ten-membered ring, a α,β-unsaturated
  ketone with a bridgehead double bond and an attached allylic trisulfide. This ring
  system is attached at one end by a trisaccharide moiety and at the opposite end
  by a 2-deoxy-L-fucose-anthranilate moiety. The trisaccharide consists of a hydroxyamino
  sugar which is connected to a isopropylamino sugar through a glycosidic linkage
  and a thiomethyl sugar through an NH‒O linkage.
