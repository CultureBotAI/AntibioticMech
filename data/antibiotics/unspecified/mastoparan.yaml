definition: A member of the class of mastopyrans that is a 14-amino acid polypeptide
  comprising isoleucyl, asparaginyl, leucyl, lysyl, alanyl, leucyl, alanyl, alanyl,
  leucyl, alanyl, lysyl, lysyl, isoleucyl, and leucinamide residues coupled in sequence.
  It is the major active component of the venom of the vespid wasp, Vespula lewisii
  and causes degranulation of mast cells.
