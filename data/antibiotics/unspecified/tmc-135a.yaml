definition: An organonitrogen heterocyclic compound that is a 21-membered macrocyclic
  lactam, substituted by a ({1-[(cyclohex-1-en-1-ylcarbonyl)amino]cyclopropyl}carbonyl)oxy
  group at position 17, which is obtained from Streptomyces sp. TC-1190. It exhibits
  growth inhibitory effects on a series of human tumour cell lines.
