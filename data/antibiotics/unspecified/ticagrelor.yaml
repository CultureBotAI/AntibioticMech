definition: A triazolopyrimidine that is an adenosine isostere; the cyclopentane ring
  is similar to ribose and the nitrogen-rich [1,2,3]triazolo[4,5-d]pyrimidine moiety
  resembles the nucleobase adenine. A platelet aggregation inhibitor which is used
  for prevention of thromboembolic events in patients with acute coronary syndrome.
