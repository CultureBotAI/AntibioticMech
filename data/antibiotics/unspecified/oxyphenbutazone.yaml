definition: A metabolite of phenylbutazone obtained by hydroxylation at position 4
  of one of the phenyl rings. Commonly used (as its hydrate) to treat pain, swelling
  and stiffness associated with arthritis and gout, it was withdrawn from the market
  1984 following association with blood dyscrasis and Stevens-Johnson syndrome.
