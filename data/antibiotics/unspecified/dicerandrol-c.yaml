definition: A biaryl that is 5,5',7,7',9,9',10a,10a'-octahydro-6H,6'H-2,2'-bixanthene
  substituted by acetyloxy groups at C-5 and C-5', (acetyloxy)methyl group at C-10a
  and C-10a', hydroxy groups at C-1, C-1', C-8 and C-8', methyl groups at C-6 and
  C-6' and oxo groups at C-9 and C-9' respectively. A dimeric tetrahydroxanthone derivative
  isolated from Phomopsis longicolla, it exhibits antibacterial and cytotoxic activities.
