definition: A butenolide that is furan-2(3H)-one substituted by a 3,4-dihydroxybenzylidene
  group at position 3 and a 3,4-dihydroxyphenyl group at position 5 (the 3E stereoisomer).
  It is isolated from the fermentation broth of the fungal strain Rhizoctonia solani
  F23372 and has been found to possess significant tyrosine kinase inhibitory potential.
  It also inhibits the growth of A431 human epidermoid carcinoma and MKN-7 human stomach
  cancer cell lines.
