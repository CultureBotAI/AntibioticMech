definition: A member of the class of acrylamides that is acrylamide which is substituted
  at positions 2 and 3 by 2-furyl and 5-nitro-2-furyl groups, respectively (the trans
  isomer). Formerly used as a food preservative, it was withdrawn from the market
  following suspicions of carcenogenicity.
