definition: A member of the class of xanthones that is 9H-xanthene substituted by
  hydroxy group at positions 1, 3 and 6, a methoxy group at position 7, an oxo group
  at position 9 and prenyl groups at positions 2 and 8. Isolated from the stems of
  Cratoxylum cochinchinense, it exhibits antioxidant, antimicrobial and antitumour
  activities.
