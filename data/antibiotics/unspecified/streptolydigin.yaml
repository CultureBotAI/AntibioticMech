    description: Streptolydigin binds bacterial RNA polymerase alongside the bridge
      helix and trigger loop and traps an inactive enzyme conformation.
    evidence:
    - reference: PMID:16122422
      notes: A 2.4-angstrom Thermus thermophilus RNA polymerase-streptolydigin cocrystal
