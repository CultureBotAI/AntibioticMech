mode_of_action_notes: 'CURATOR: PMIDs 16122422 and 16167380 resolved streptolydigin
  bound to bacterial RNA polymerase beside the active center, contacting the bridge
  helix and trigger loop. The inhibitor stabilizes a catalytically inactive preinsertion
  conformation rather than preventing nucleotide binding, DNA translocation, or phosphodiester-bond
  formation.'
