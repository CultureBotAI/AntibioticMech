- graph_id: streptolydigin_rnap_bridge_helix_trigger_loop_inhibition
  title: Streptolydigin traps the bacterial RNA polymerase bridge helix and trigger
    loop to block transcription elongation
  description: Streptolydigin binds bacterial DNA-directed RNA polymerase adjacent
    to the bridge helix and trigger loop (~20 angstroms from the catalytic Mg2+ center),
    traps these mobile beta/beta' elements in an inactive conformation, and inhibits
    nucleotide addition during transcription elongation.
