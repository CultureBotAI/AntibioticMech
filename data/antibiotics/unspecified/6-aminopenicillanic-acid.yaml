definition: A penicillanic acid compound having a (6R)-amino substituent. The active
  nucleus common to all penicillins, it may be substituted at the 6-amino position
  to form the semisynthetic penicillins, resulting in a variety of antibacterial and
  pharmacologic characteristics.
