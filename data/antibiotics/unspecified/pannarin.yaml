definition: A member of the class of depsidones that is 11H-dibenzo[b,e][1,4]dioxepine
  substituted by methyl groups at positions 1,6 and 9, chloro group at position 2,
  hydroxy group at position 3, formyl group at position 4, methoxy group at position
