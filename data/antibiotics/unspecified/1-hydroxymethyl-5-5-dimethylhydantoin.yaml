definition: An imidazolidine-2,4-dione substituted by a hydroxymethyl group at position
  1 and two methyl groups at position 5. It is approved by the FDA for use as an adjuvant
  in the bleaching of recycled paper and board used in food packaging, and is also
  a decomposition product of DMDM hydantoin, a preservative and antimicrobial agent
  used in cosmetics and personal care products.
