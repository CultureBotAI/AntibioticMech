mode_of_action_notes: 'CURATOR: PMID:14670947 measured nanomolar inhibition and stoichiometric
  binding of ilicicolin H at the Qn site of the Saccharomyces cerevisiae cytochrome
  bc1 complex. PMID:18022381 compared yeast, bovine, and bacterial complexes and showed
  strong species dependence, so the conserved respiratory target is host-shared despite
  marked selectivity.'
