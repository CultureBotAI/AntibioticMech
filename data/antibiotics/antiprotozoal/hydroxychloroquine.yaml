identifier: CHEBI:5801
label: hydroxychloroquine
antimicrobial_class: ANTIPROTOZOAL
curation_status: SEEDED
grounding_status: EXACT
definition: An aminoquinoline that is chloroquine in which one of the N-ethyl groups
  is hydroxylated at position 2. An antimalarial with properties similar to chloroquine
  that acts against erythrocytic forms of malarial parasites, it is mainly used as
  the sulfate salt for the treatment of lupus erythematosus, rheumatoid arthritis,
  and light-sensitive skin eruptions.
