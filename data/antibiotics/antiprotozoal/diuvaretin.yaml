definition: A member of the class of dihydrochalcones that is dihydrochalcone substituted
  by 2-hydroxybenzyl groups at positions 3 and 5, hydroxy groups at positions 2 and
  4 and a methoxy group at position 6. Isolated from the roots of Uvaria acuminata
  and Uvaria chamae, it exhibits cytotoxicity towards human promyelocytic leukemia
  HL-60 cells.
