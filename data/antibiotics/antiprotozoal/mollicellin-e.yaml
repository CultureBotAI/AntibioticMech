definition: A member of the class of depsidones that is 11H-dibenzo[b,e][1,4]dioxepine
  substituted by a chloro group at position 2, hydroxy groups at positions 3 and 9,
  a methoxy group at position 8, methyl groups at positions 1 and 6, a 3-methylbut-2-enoyl
  group at position 7, an oxo group at position 11 and a formyl group at position
  4. Isolated from Chaetomium brasiliense, it exhibits antimalarial and cytotoxic
  activities.
