definition: An aminoquinoline that is quinoline which is substituted at position 4
  by a [5-(diethylamino)pentan-2-yl]amino group at at position 7 by chlorine. It is
  used for the treatment of malaria, hepatic amoebiasis, lupus erythematosus, light-sensitive
  skin eruptions, and rheumatoid arthritis.
