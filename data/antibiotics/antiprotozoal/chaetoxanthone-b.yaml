definition: A bridged organic heteropentacyclic compound that is 3,4,5,6-tetrahydro-2H,8H-2,6-epoxyoxocino[3,2-b]xanthen-8-one
  substituted by a hydroxy group at position 7, a methoxy group at position 9 and
  a methyl group at position 2. It is isolated from the marine derived fungus Chaetomium
  and has antiprotozoal activity.
