definition: A member of the class of isoindoles that is 2,3-dihydro-1H-isoindole substituted
  by (3-cyano-1H-1,2,4-triazol-1-yl)acetyl and 5-fluoro-2-(trifluoromethyl)pyridin-3-yl
  groups at positions 2 and 5, respectively. It inhibits Trypanosoma cruzi topoisomerase
  II and eradicates Trypanosoma cruzi in a mouse model of Chagas disease.
