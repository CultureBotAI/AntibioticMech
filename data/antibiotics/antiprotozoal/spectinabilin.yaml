definition: A polyketide that is deoxyspectinabilin in which the tetramethyldeca-tetraen-1-yl
  chain attached to the 4-pyranone moiety has undergone oxidation at position 1 and
  at the methyl group at position 3 to afford the corresponding tetrahydrofuranyl
  moiety. Produced by Streptomyces spectabilis, it exhibits antiviral and antimalarial
  activity.
