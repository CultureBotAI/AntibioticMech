definition: A C-nitro compound that is 5-nitroimidazole in which the hydrogens at
  positions 1 and 2 are replaced by methyl groups. An antiprotozoal drug, it has been
  banned by both the Government of Canada and the European Union as a livestock feed
  additive owing to suspicions of it being carcinogenic.
