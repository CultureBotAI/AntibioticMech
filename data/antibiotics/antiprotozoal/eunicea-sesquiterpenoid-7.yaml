definition: A sesquiterpenoid that is a carboxylic ester obtained by the formal condensation
  of the 6-hydroxy group of cyclodec-4-en-1-one which is also substituted by an acetyl,
  a methyl and a methylidene group at positions 7, 4 and 10 respectively with the
  carboxy group of pent-2-enoic acid substituted with a hydroxy and a methyl group
  at position 4. It is an antiplasmodial drug isolated from a Caribbean gorgonian
  coral Eunicea sp.
