mode_of_action_notes: 'CURATOR: PMID:12765337 measured inhibition of Leishmania donovani
  DNA topoisomerase I relaxation and topoisomerase II decatenation. Dihydrobetulinic
  acid prevented formation of enzyme-DNA binary complexes without inducing DNA cleavage;
  it inhibited promastigotes and amastigotes and reduced hamster spleen and liver
  parasite burden by more than 92%.'
