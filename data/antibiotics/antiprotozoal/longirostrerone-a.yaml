definition: An azaphilone that is 9,9a-dihydro-6H-furo[2,3-h]isochromene-6,8(6aH)-dione
  substituted by a 4-hydroxy-2-methyl-6-oxocyclohexyl group at position 3, a methyl
  group at position 6a and a 4,6,8-trimethyldeca-2,4-dienoyl group at position 9.
  Isolated from Chaetomium longirostre, it exhibits cytotoxic and antimalarial activities.
