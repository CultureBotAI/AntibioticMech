  - reference: DOI:10.1016/j.chembiol.2011.01.016
    snippet: 7-Deoxypactamycin, an engineered pactamycin analog produced by inactivation
      of the cytochrome P450 gene ptmY in Streptomyces pactum ATCC 27456, exhibited
      potent antimalarial activity against Plasmodium falciparum strains D6 and Dd2
      (IC50 ~8-15 nM) as well as antibacterial activity with reduced mammalian cytotoxicity.
    notes: MIBiG 4.0.1 entry BGC0000119 (Streptomyces pactum); Lu et al. 2011 (DOI:10.1016/j.chembiol.2011.01.016,
      PMID:21513878), Kudo et al. 2007 (DOI:10.1038/ja.2007.63, PMID:17827660), and
      Masaki et al. 2026 (DOI:10.1038/s41429-026-00934-y, PMID:42265342) establish
      biosynthesis and nanomolar antiplasmodial and antibacterial activity. ChEBI
      CHEBI:198890 and PubChem CID 3064514 supply the stereo-complete SMILES, Standard
      InChI, and InChIKey.
