- target_label: bacterial 30S ribosomal subunit
  target_type: RIBOSOMAL_SUBUNIT
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Engineered biosynthesis, structural elucidation, and antibacterial/antiprotozoal
    bioactivity comparison of 7-deoxypactamycin and pactamycin congeners targeting
    the ribosomal small subunit translation machinery (Lu et al. 2011, DOI:10.1016/j.chembiol.2011.01.016,
    PMID:21513878; Kudo et al. 2007, DOI:10.1038/ja.2007.63, PMID:17827660; Masaki
    et al. 2026, DOI:10.1038/s41429-026-00934-y, PMID:42265342).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2026-05
  source_retrieved_on: '2026-11-08'
  evidence:
  - reference: DOI:10.1016/j.chembiol.2011.01.016
    snippet: 7-Deoxypactamycin exhibited superior antibacterial and antimalarial activity
      compared with pactamycin while retaining the aminocyclopentitol ribosome-targeting
      pharmacophore.
    notes: Lu et al. 2011 (Chem Biol 18:425-431; PMID:21513878) generated 7-deoxypactamycin
      in Streptomyces pactum and demonstrated antibacterial activity against Staphylococcus
      aureus, Bacillus subtilis, Escherichia coli, and Pseudomonas aeruginosa as well
      as antimalarial activity against Plasmodium falciparum.
  - reference: DOI:10.1038/ja.2007.63
    notes: Kudo et al. 2007 (J Antibiot 60:492-503; PMID:17827660) characterized the
      pactamycin biosynthetic gene cluster and 7-deoxypactamycin intermediate in Streptomyces
      pactum.
