mode_of_action_notes: 'CURATOR: Aminocyclopentitol antibiotic congener of pactamycin
  generated in Streptomyces pactum (wild-type congener and ΔptmU4 / ΔpctN biosynthetic
  mutants) that binds the small (30S/40S) ribosomal subunit E-site cleft to inhibit
  ribosomal translocation and protein synthesis with antibacterial and antiprotozoal
  activity (Lu et al. 2011, DOI:10.1016/j.chembiol.2011.01.016, PMID:21513878; Kudo
  et al. 2007, DOI:10.1038/ja.2007.63, PMID:17827660; Masaki et al. 2026, DOI:10.1038/s41429-026-00934-y,
  PMID:42265342).'
mode_of_action_target_scope: MICROBIAL_TARGET
