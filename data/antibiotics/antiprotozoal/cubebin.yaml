definition: A lignan that consists of tetrahydrofuran-2-ol substituted by two 1,3-benzodioxol-5-ylmethyl
  groups at positions 3 and 4 respectively (the 2S,3R,4R stereoisomer). It is isolated
  from the leaves of Piper nigrum and exhibits analgesic, anti-inflammatory, antimicrobial
  and trypanocidal activities.
