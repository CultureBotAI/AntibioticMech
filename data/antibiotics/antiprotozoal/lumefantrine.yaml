definition: A member of the class of fluorenes that is 9-(p-chlorobenzylidene)-9H-fluorene
  which is substitutec by chlorine at positions 2 and 7, and by a 2-(dibutylamino)-1-hydroxyethyl
  group at position 4. An antimalarial drug used in combination with artemether for
  the treatment of multi-drug resistant strains of falciparum malaria.
