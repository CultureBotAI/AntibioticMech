definition: An organic heterotricyclic compound that is 2,3,3a,8b-tetrahydro-1H-benzo[b]cyclopenta[d]furan
  substituted by hydroxy groups at positions 1 and 8b, methoxy groups at positions
  6 and 8, a 4-methoxyphenyl group at position 3a, a phenyl group at position 3 and
  a N,N-dimethylcarbamoyl group at position 1. Isolated from Aglaia odorata and Aglaia
  duperreana, it exhibits antineoplastic activity.
