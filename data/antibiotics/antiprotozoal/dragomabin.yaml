definition: A lipopeptide consisting of a 2-methyloct-7-ynoyl moiety attached to a
  linear tetrapeptide comprising of N-methyl-L-phenylalanyl, L-alanyl, N-methyl-L-alanyl
  and Nα,O-dimethyl-L-tyrosine units. It is isolated from a Panamanian strain of the
  marine cyanobacterium Lyngbya majuscula and displays antimalarial activity.
