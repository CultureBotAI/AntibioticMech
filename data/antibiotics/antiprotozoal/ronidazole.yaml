definition: A carbamate ester that is 5-nitroimidazole in which the hydrogens at positions
  1 and 2 are replaced by methyl and (carbamoyloxy)methyl groups, respectively. An
  antiprotozoal agent, it is used in veterinary medicine for the treatment of histomoniasis
  and swine dysentery.
