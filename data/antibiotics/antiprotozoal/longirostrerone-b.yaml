definition: An azaphilone that is 7,8-dihydro-6H-isochromen-6-one substituted by a
  hydroxy group at position 7, a 4-hydroxy-2-methyl-6-oxocyclohexyl group at position
  3, a methyl group at position 7 and a 5,7,9-trimethyl-2-oxoundeca-3,5-dien-1-yl
  group at position 8. Isolated from Chaetomium longirostre, it exhibits cytotoxic
  and antimalarial activities.
