definition: A quercetin O-glucoside in which quercetin is attached to a α-L-arabinofuranosyl
  group at position 3 via a glycosidic linkage while the hydroxy group at position
  5 is replaced by a galloyl group. Isolated from the young leaves of Calycolpus warscewiczianus,
  it exhibits activity against a chloroquine-resistant strain of Plasmodium falciparum.
