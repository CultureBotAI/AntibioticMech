definition: A member of the class of xanthones that is 9H-xanthen-9-one substituted
  by hydroxy groups at positions 3 and 8, methoxy groups at position 2 and 4 and a
  prenyl group at position 1. A methyl ether derivative of celebixanthone, it is isolated
  from the roots of Cratoxylum cochinchinense and exhibits antimalarial activities.
