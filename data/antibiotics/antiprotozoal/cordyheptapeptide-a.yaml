definition: A homodectic cyclic peptide made up from N-methylglycyl, L-phenylalanyl,
  N-methyl-L-tyrosyl, L-isoleucyl, L-leucyl, N-methyl-D-phenylalanyl and L-prolyl
  residues linked in sequence. It is an antimalarial drug isolated from the insect
  pathogenic fungus Cordyceps.
