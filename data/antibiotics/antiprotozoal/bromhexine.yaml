definition: A substituted aniline that is 2,4-dibromoaniline which is substituted
  at position 6 by a [cyclohexyl(methyl)amino]methyl group. It is used (as the monohydrochloride
  salt) as a mucolytic for the treatment of respiratory disorders associated with
  productive cough (i.e. a cough characterised by the production of sputum).
