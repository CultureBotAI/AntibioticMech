definition: A bridged organic heteropentacyclic compund that is 3,4,5,6-tetrahydro-2H,8H-2,6-epoxyoxocino[3,2-b]xanthen-8-one
  substituted by hydroxy groups at positions 4 and 7, a methoxy group at position
  9 and a methyl group at position 2 (the 2S,4R,6S stereoisomer). It is isolated from
  the marine derived fungus Chaetomium and has antiprotozoal activity.
