definition: A member of the class of chromones that is 4H-chromen-4-one in which the
  hydrogens at positions 2,5,7 and 8 are replaced by methyl, hydroxy, hydroxy, and
  (3S,4R)-3-hydroxy-1-methylpiperidin-4-yl groups, respectively. It is an alkaloid
  initially isolated from Amoora rohituka and is a precursor of the anti-cancer compound
  flavopiridol.
