definition: An isoquinoline alkaloid that is (3S)-6,8-dimethoxy-1,3-dimethyl-3,4-dihydroisoquinoline
  substituted by a 4,5-dimethoxy-7-methylnaphthalen-1-yl group at position 5. It is
  isolated from the leaves of Ancistrocladus tanzaniensis and exhibits antiplasmodial,
  antileishmanial and antitrypanocidal activities.
