definition: A member of the class of phenylureas that is urea in which each of the
  amino groups has been substituted by a 3-({2-methyl-5-[(4,6,8-trisulfo-1-naphthyl)carbamoyl]phenyl}carbamoyl)phenyl
  group. An activator of both the rabbit skeletal muscle RyR1 and sheep cardiac RyR2
  isoform ryanodine receptor channels, it has been used for the treatment of human
  African trypanosomiasis for over 100 years.
