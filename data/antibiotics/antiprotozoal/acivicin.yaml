definition: An L-α-amino acid that is L-alanine in which the methyl group is replaced
  by a (5S)-3-chloro-4,5-dihydro-1,2-oxazol-5-yl group. A glutamine analogue antimetabolite,
  it interferes with glutamate metabolism and several glutamate-dependent synthetic
  enzymes. It is obtained as a fermentation product of Streptomyces sviceus bacteria.
