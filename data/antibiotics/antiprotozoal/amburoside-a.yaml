definition: A β-D-glucoside in which a β-D-glucopyranosyl residue is attached at position
  4 of 4-hydroxybenzyl 3,4-dihydroxybenzoate via a glycosidic linkage. It is isolated
  from the trunk barks of Amburana cearensis and exhibits antimalarial, neuroprotective,
  hepatoprotective and antioxidant activities.
