definition: A cyclic terpene ketone that is 2a,3,4,5,5a,6,7,8-octahydroacenaphthylen-1(2H)-one
  substituted by hydroxy groups at positions 2 and 2a, methyl groups at positions
  2, 5 and 8 and a 2-methylprop-1-en-1-yl group at position 3. It is isolated from
  the the West Indian gorgonian octocoral Pseudopterogorgia elisabethae and exhibits
  antitubercular and antimalarial activity.
