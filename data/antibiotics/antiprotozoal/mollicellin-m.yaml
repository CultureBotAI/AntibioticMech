definition: A member of the class of depsidones that is 3,4-dihydro-2H,7H-chromeno[7,6-b][1,4]benzodioxepine
  substituted by a chloro group at position 9, a hydroxy group at position 10, methyl
  groups at positions 2, 2, 5 and 8, a formyl group at position 11 and oxo groups
  at positions 4 and 7. Isolated from Chaetomium brasiliense it exhibits antimalarial
  and cytotoxic activities.
