definition: A quercetin O-glucoside that is quercetin attached to β-D-glucopyranosyl
  residue at position 3 and a α-L-rhamnopyranosyl residue at position 7 via glycosidic
  linkages. Isolated from the aerial parts of Delphinium staphisagria, it exhibits
  trypanocidal activity.
