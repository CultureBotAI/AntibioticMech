definition: A member of the class of xanthones that is 3,6,8-trihydroxy-1H-xanthene-2,9-dione
  substituted by geminal prenyl groups at position 1 and a single prenyl group at
  position 7. It is isolated from the stem barks of Allanblackia monticola and exhibits
  antiplasmodial activity. It also shows weak cytotoxicity against human melanoma
  cells.
