definition: A eudesmane sesquiterpenoid in which the eudesmane skeleton is substituted
  with an α-hydroxy group at C-1 (eudesmane numbering) and a methylidene group at
  C-4, and includes a lactone ring formed between C-12 and a β-hydroxy group at C-6.
  It is isolated from Eunicea sp. and exhibits significant inhibitory effect upon
  the growth of the malarial parasite Plasmodium falciparum
