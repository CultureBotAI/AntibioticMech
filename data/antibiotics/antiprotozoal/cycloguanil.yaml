definition: A triazine in which a 1,6-dihydro-1,3,5-triazine ring is substituted at
  N-1 by a 4-chlorophenyl group, at C-2 and -4 by amino groups and at C-6 by gem-dimethyl
  groups. A dihydrofolate reductase inhibitor, it is a metabolite of the antimalarial
  drug proguanil.
