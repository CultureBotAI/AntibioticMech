definition: A carbohydrazide that is L-tryptophan in which the amino and carboxy groups
  are substituted by tert-butoxycarbonyl and 2-({[2-(2-ethylanilino)-2-oxoethyl]sulfanyl}carbonyl)hydrazinyl
  groups, respectively. It is a potent and reversible inhibitor of human cathepsin
  L (IC50 = 56 nM).
