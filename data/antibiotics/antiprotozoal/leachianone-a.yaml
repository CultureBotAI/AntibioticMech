definition: A trihydroxyflavanone that is (2S)-flavanone substituted by a lavandulyl
  group at position 8, hydroxy groups at positions 5, 7 and 4' and a methoxy group
  at position 2'. Isolated from the roots of Sophora flavescens and Sophora leachiana,
  it exhibits antineoplastic and antimalarial activity.
