definition: A dipeptide that is L-tryptophyl-L-leucinamide in which the N-terminal
  amino group has been converted to the corresponding (morpholin-4-yl)acetamide and
  in which one of the hydrogens attached to the nitrogen of the C-terminal amide has
  been replaced by a (1E)-5-methyl-1-(methylsulfonyl)hex-1-en-3-yl group. It is a
  selective proteasome inhibitor.
