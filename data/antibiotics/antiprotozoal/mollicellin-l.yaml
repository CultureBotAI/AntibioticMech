definition: A member of the class of depsidones that is 11H-dibenzo[b,e][1,4]dioxepine
  substituted by a hydroxy group at position 3, a methoxy group at position 7, methyl
  groups at positions 1 and 9, a 3-methylbut-2-enoyl group at position 8, a formyl
  group at position 4 and an oxo group at position 11. Isolated from Chaetomium brasiliense,
  it exhibits antimalarial and cytotoxic activities.
