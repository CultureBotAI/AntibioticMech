definition: A pyridoisoquinoline comprising emetam having methoxy substituents at
  the 6'-, 7'-, 10- and 11-positions. It is an antiprotozoal agent and emetic. It
  inhibits SARS-CoV2, Zika and Ebola virus replication and displays antimalarial,
  antineoplastic and antiamoebic properties.
