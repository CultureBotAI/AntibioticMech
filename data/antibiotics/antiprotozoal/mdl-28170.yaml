definition: A dipeptide resulting from the formal condensation of the carboxy group
  of N-benzyloxycarbonyl-L-valine with the amino group of L-phenylalanine aldehyde.
  It is a potent cell-permeable inhibitor of calpain I and II, and is also a γ-secretase
  inhibitor.
