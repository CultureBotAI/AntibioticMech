definition: A steroid saponin that consists of (3β,22R)-22-methoxyfurostan-3,26-diol
  attached to a β-D-glucopyranosyl residue at position 26 and a β-D-glucopyranosyl-(1→2)-[β-D-xylopyranosyl-(1→3)]-β-D-glucopyranosyl-(1→4)-β-D-glucopyranosyl
  residue at position 3 via a glycosidic linkage. Isolated from Brunfelsia grandiflora,
  it exhibits antileishmanial activity.
