definition: A nitroso compound that is N-undecylnitrous hydrazide carrying double
  bonds at positions 1,2,4, and 7. It is a long-chain fatty acyl CoA synthetase inhibitor
  and interferes with lipid metabolism by inhibiting the de novo synthesis of glycerolipids
  and cholesterol esters.
