definition: An anthraquinone that is anthracene-9,10-dione substituted by a 3-acetyl-4,6-dihydroxy-2-methoxyphenyl
  moiety at position 1, hydroxy groups at positions 4 and 5 and a hydroxymethyl group
  at position 2. Isolated from the roots of Bulbine frutescens, it exhibits antiplasmodial
  and antitrypanosomal activities.
