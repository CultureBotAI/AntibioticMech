definition: An aminopyrimidine that is pyrimidine-2,4-diamine which is substituted
  at position 5 by a p-chlorophenyl group and at position 6 by an ethyl group. It
  is a folic acid antagonist used as an antimalarial or with a sulfonamide to treat
  toxoplasmosis.
