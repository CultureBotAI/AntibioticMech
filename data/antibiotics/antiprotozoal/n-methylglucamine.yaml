definition: A hexosamine that is D-glucitol in which the hydroxy group at position
  1 is substituted by the nitrogen of a methylamino group. A crystalline base, it
  is used in preparing salts of certain acids for use as diagnostic radiopaque media,
  while its antimonate is used as an antiprotozoal in the treatment of leishmaniasis.
