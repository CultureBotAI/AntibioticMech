definition: A member of the class of depsidones that is 11H-dibenzo[b,e][1,4]dioxepine
  substituted by a chloro group at position 2, hydroxy groups at position 3 and 7,
  methyl group at positions 1 and 9, a prenyl group at position 8, an oxo group at
  position 11 and a formyl group at position 4. Isolated from Chaetomium brasiliense
  it exhibits cytotoxic activity.
