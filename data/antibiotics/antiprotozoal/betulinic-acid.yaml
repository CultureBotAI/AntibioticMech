definition: A pentacyclic triterpenoid that is lupane having a double bond at position
  20(29) as well as 3β-hydroxy and 28-carboxy substituents. It is found in the bark
  and other plant parts of several species of plants including Syzygium claviflorum.
  It exhibits anti-HIV, antimalarial, antineoplastic and anti-inflammatory properties.
