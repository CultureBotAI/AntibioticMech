definition: A pentacyclic triterpenoid that is the cinnamate ester obtained by the
  formal condensation of the carboxylic group of cis-caffeic acid with the hydroxy
  group of lupeol (the 3β stereoisomer). It is isolated from the fruits of Bruguiera
  parviflora and exhibits antimalarial activity.
