definition: A pyridoisoquinoline which was developed in response to the cardiovascular
  toxicity associated with emetine and results from the dehydrogenation of the heterotricylic
  ring of emetine. It is an antiprotozoal agent and displays antimalarial, antiamoebic,
  and antileishmanial properties.
