definition: A member of the class of monohydroxy-1,4-benzoquinones that is embelin
  in which the hydroxy group at position 5 is replaced by a methoxy group. Isolated
  from Lysimachia punctata and Embelia ribes, it exhibits antileishmanial activity
  as well as inhibitory activity towards hepatitis C protease.
