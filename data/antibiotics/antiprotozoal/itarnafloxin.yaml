definition: An organic heteropentacyclic compound that is 3H-benzo[b]pyrido[3,2,1-kl]phenoxazin-3-one
  substituted by 2-[(2S)-1-methylpyrrolidin-2-yl]ethanaminoacyl, fluoro, and 3-(pyrazin-2-yl)pyrrolidin-1-yl
  groups at positions 2, 5 and 6, respectively. It is a G-quadruplex interactive agent,
  previously in clinical trials for the treatment of carcinoid/neuroendocrine tumours
  (now discontinued).
