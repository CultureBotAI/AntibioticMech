definition: A lignan that is 2,3-dihydro-1-benzofuran substituted by a (benzoyloxy)methyl
  group at position 3, a 4-hydroxy-3-methoxyphenyl group at position 2, a methoxy
  group at position 7 and a 3-(benzoyloxy)prop-1-en-1-yl group at position 5. It is
  isolated as a racemate from Euterpe precatoria and exhibits antiplasmodial activity.
