definition: A member of the class of diamino-1,3,5-triazines that is 1,3,5-triazine-2,4-diamine
  in which the amino groups at positions 2 and 4 are respectively carrying 2-methoxy-4-[4-(4-methylpiperazin-1-yl)piperidin-1-yl]phenyl
  and 2-(propan-2-ylsulfonyl)phenyl substituents. It is a potent inhibitor of anaplastic
  lymphoma kinase (ALK), Ack and ROS1 activity (IC50 values are 3.5, 5.8 and 8.9 nM
  respectively) and exhibits anti-cancer properties.
