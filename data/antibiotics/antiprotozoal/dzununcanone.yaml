definition: A tetracyclic triterpenoid that is 3,24-dinor-2,4-seco-friedelan-1(10),5,7-triene
  substituted by methoxycarbonyl groups at positions 2 and 29 and an oxo group at
  position 4. Isolated from the root bark of Hippocratea excelsa, it exhibits anti-protozoal
  activity against Giardia intestinalis.
