definition: An oxazolidinone that is 1,3-oxazolidin-2-one substituted at position
  1 by a (5-nitro-2-furyl)methylene]amino group and at position 5 by a morpholin-4-ylmethyl
  group. An antibacterial formerly used oraly but withdrawn due to toxicity, it is
  used topically (as the hydrochloride salt) for treatment of ear disorders.
