identifier: CHEBI:70718
label: ceftaroline fosamil
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cephalosporin having [4-(1-methylpyridinium-4-yl)-1,3-thiazol-2-yl]sulfanyl
  and {(2Z)-2-(ethoxyimino)-2-[5-(phosphonoamino)-1,2,4-thiadiazol-3-yl]acetyl}amino
  side groups located at positions 3 and 7 respectively. The N-phospho prodrug of
  ceftaroline, a broad-spectrum antibiotic active against methicillin-resistant Staphylococcus
  aureus (MRSA). It is used for the treatment of adults with acute bacterial skin
  and skin structure infections.
