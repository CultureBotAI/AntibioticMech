definition: Phenelfamycin C was isolated from two environmental isolates called AB999F-80
  and AB1047T-33. They were both identified as Streptomyces violaceoniger strains.
  Both these strains were found to produce phenelfamycins A-F and unphenelfamycin.
  Phenelfamycin C has a disaccaride moeity and is isomeric with phenelfamycin D. All
  phenelfamycins were selected due to their activity against anaerobic bacteria, especially
  Clostridioides difficile.
