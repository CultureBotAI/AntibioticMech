mode_of_action_notes: 'CURATOR: PMID:11158751 found rapid, bacteriostatic inhibition
  of RNA synthesis in Escherichia coli, independent of the RelA stringent response,
  and beta-galactosidase kinetics consistent with impaired RNA-chain elongation. Purified
  RNA polymerase was only weakly inhibited above growth-inhibitory concentrations,
  so the direct target remains unresolved and intracellular conversion to an active
  species remains possible.'
