definition: A dithiolopyrrolone antibiotic that is 4,5-dihydro[1,2]dithiolo[4,3-b]pyrrole
  in which the hydrogens at positions 5 and 6 have been replaced by oxo and acetamido
  groups, respectively. It is an inhibitor of DNA-dependent RNA polymerase, and exhibits
  antibacterial and antitumour properties.
