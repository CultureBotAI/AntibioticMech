definition: An organic heterotricyclic compound that is 1,2,3,4-tetrahydrocyclopenta[b]indole
  substituted by carboxymethyl and [4-cyclopentyl-3-(trifluoromethyl)phenyl]methoxy
  groups at positions 3R and 7, respectively. It is a potent and functional antagonist
  of the sphingosine-1-phosphate-1 (S1P1) receptor (IC50 = 1.88 nM in CHO cells).
