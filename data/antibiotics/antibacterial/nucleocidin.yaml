definition: A nucleoside antibiotic that is 5'-O-sulfamoyladenosine in which the hydrogen
  atom at position 4' is replaced by a fluorine atom. It is a natural product synthesized
  by several Streptomyces species. It exhibits broad spectrum antibacterial activity,
  and also has a strong effect against Trypanosoma brucei, the protozoan parasite
  responsible for the African sleeping sickness.
