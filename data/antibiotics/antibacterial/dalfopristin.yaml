identifier: CHEBI:4309
label: dalfopristin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A macrolide that is pristinamycin IIA in which the double bond between
  positions 26 and 26a of the pyrroline ring has been reduced and position 26R carries
  a [2-(diethylamino)ethyl]sulfonyl group. It is a semi-synthetic streptogramin antibiotic
  and often used as a mixture with quinupristin for the treatment of vancomycin-resistant
  Enterococcus faecium.
