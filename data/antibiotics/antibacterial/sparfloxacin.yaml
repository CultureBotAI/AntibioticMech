mode_of_action_notes: 'CURATOR: Synthetic C-5-amino-6,8-difluoroquinolone antibiotic
  that dually inhibits bacterial DNA gyrase (GyrA/GyrB) DNA supercoiling and topoisomerase
  IV (ParC/ParE) decatenation, arresting bacterial DNA replication (Takei et al. 2001,
  DOI:10.1128/AAC.45.12.3544-3547.2001, PMID:11709337).'
