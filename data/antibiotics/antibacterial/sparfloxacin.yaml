definition: Sparfloxacin is a dimethylpiperazinyl difluoroquinolone that acts by inhibiting
  DNA gyrase. It is active against aerobic Gram-positive and Gram-negative bacteria,
  as well as some mycobacteria. It has moderate activity against some anaerobes.
