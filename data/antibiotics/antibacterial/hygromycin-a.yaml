definition: Hygromycin A is an antibiotic produced by Streptomyces hygroscopicus.
  It inhibits translation by binding to the peptidyl transferase center on the large
  ribosomal subunit. This prevents the binding of aminoacyl-tRNA to the A-site. Not
  to confused with Hygromycin B, which is structurally distinct.
