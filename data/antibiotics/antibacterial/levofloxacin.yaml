  (ATP-hydrolysing)] inhibitor), CHEBI:53559 (topoisomerase IV inhibitor), CHEBI:59517
  (DNA synthesis inhibitor). ChEBI asserts the role on the compound. The role names
  a target specific to the microbe or virus — see mode_of_action_target_scope. Not
  a curator's mechanistic review.
