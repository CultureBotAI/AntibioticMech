definition: A quinolone that is 4-oxo-1,4-dihydroquinoline-3-carboxylic acid which
  is substituted at positions 1, 6, 7 and 8 by cyclopropyl, fluoro, hexahydropyrrolo[3,4-b][1,4]oxazin-6-yl
  and cyano groups respectively; an antibiotic used for treatment of acute otitis
  externa (swimmer's ear) caused by the bacteria Pseudomonas aeruginosa and Staphylococcus
  aureus.
