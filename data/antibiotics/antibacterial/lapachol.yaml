definition: A hydroxy-1,4-naphthoquinone that is 1,4-naphthoquinone substituted by
  hydroxy and 3-methylbut-2-en-1-yl groups at positions 2 and 3, respectively. It
  is a natural compound that exhibits antibacterial and anticancer properties, first
  isolated in 1882 from the bark of Tabebuia avellanedae.
