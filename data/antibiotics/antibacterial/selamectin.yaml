definition: Selamectin is a topical antiparasitic medication for dogs and cats prescribed
  for various parasite infections. Exposure caused relevant cell surface alterations.
  A synergistic effect was observed between ampicillin and selamectin. Selamectin
  may represent a timely and promising macrocyclic lactone for the treatment of S.
  aureus infections.
