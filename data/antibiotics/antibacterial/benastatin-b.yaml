  evidence:
  - reference: DOI:10.1038/s41429-024-00727-1
    snippet: Benastatin B exhibited potent antibacterial activity against Gram-positive
      bacteria including Micrococcus luteus (MIC 3.9 uM) and Staphylococcus aureus.
    notes: Kawahara et al. 2024 (J Antibiot 77:433-442; PMID:38664572) quantified
      the whole-cell Gram-positive antibacterial activity of benastatin B against
      Micrococcus luteus (MIC 3.9 uM) and comparator Gram-positive strains.
  - reference: DOI:10.1016/j.jbiotec.2008.10.013
    notes: Xu et al. 2009 (J Biotechnol 140:107-113; PMID:19047004) characterized
      the type II polyketide biosynthetic pathway and aromatic pentacyclic scaffold
      of benastatins in Streptomyces sp. A2991200.
