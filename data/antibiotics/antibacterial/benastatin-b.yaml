  Gram-positive bacteria including Micrococcus luteus (MIC 3.9 uM) and methicillin-resistant
  Staphylococcus aureus while also inhibiting glutathione S-transferase (Kawahara
  et al. 2024, DOI:10.1038/s41429-024-00727-1, PMID:38664572; Xu et al. 2009, DOI:10.1016/j.jbiotec.2008.10.013,
  PMID:19047004).'
