definition: A member of the class of azabicycloalkanes that is (2S,5R)-7-oxo-1,6-diazabicyclo[3.2.1]octane-2-carboxamide
  in which the amino hydrogen at position 6 is replaced by a sulfooxy group. Used
  (in the form of its sodium salt) in combination with ceftazidime pentahydrate for
  the treatment of complicated urinary tract infections including pyelonephritis.
