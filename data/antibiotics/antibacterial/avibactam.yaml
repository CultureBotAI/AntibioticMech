mode_of_action_notes: 'CURATOR: PMID:25406838 resolved covalent avibactam complexes
  with the class D beta-lactamases OXA-24 and OXA-48 and explained the inhibitor''s
  selectivity and unusually slow reversibility. Avibactam restores partner beta-lactam
  activity by inhibiting resistance enzymes rather than by directly inhibiting bacterial
  cell-wall synthesis itself.'
