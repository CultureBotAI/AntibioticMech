identifier: CHEBI:17630
label: kanamycin A
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: Kanamycin is an aminoglycoside antibiotic used to treat different types
  of bacterial infections. Kanamycin works by binding to the bacterial 30S ribosomal
  subunit, causing misreading of mRNA and leaving the bacterium unable to synthesize
  proteins vital to its growth.
definition_source: PMID:10103173
