definition: A semisynthetic, first-generation cephalosporin antibiotic with acetoxymethyl
  and (2-thienylacetyl)nitrilo moieties at positions 3 and 7, respectively, of the
  core structure. Administered parenterally during surgery and to treat a wide spectrum
  of blood infections.
