identifier: CHEBI:195558
label: entrectinib
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of indazoles that is 1H-indazole substituted by
  [4-(4-methylpiperazin-1-yl)-2-(tetrahydro-2H-pyran-4-ylamino)benzoyl]amino and 3,5-difluorobenzyl
  groups at positions 3 and 5, respectively. It is a potent inhibitor of TRKA, TRKB,
  TRKC, ROS1, and ALK (IC50 values of 0.1 to 1.7 nM), and used for the treatment of
  NTRK, ROS1 and ALK gene fusion-positive solid tumours.
