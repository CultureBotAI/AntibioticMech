definition: A sulfonamide that is sulfanilamide in which the sulfonamide nitrogen
  is substituted by a 1-phenyl-1H-pyrazol-5-yl group. It is a selective inhibitor
  of cytochrome P450 (CYP) 2C9 isozyme, and antibacterial agent.
