definition: A carbotricyclic compound that is pleuromutilin in which the hydroxyacetate
  group is replaced by a 2-{[2-(diethylamino)ethyl]sulfanyl}acetate group. An antibacterial
  drug, tiamulin is used in veterinary medicine (generally as its hydrogen fumarate
  salt) for the treatment of swine dysentery caused by Serpulina hyodysenteriae.
