definition: Mutanobactin is produced by a polyketide synthase-nonribosomal peptide
  synthetase hybrid system encoded by the mub locus. Mutanobactin-producing S. mutans
  inhibits planktonic and biofilm growth of E. faecalis and is active against other
  Enterococcus species and Staphylococcus aureus.
