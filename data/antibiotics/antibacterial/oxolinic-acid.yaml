definition: A quinolinemonocarboxylic acid having the carboxy group at position 7
  as well as oxo and ethyl groups at positions 4 and 1 respectively and a dioxolo
  ring fused at the 5- and 6-positions. A synthetic antibiotic, it is used in veterinary
  medicine for the treatment of bacterial infections in cattle, pigs and poultry.
