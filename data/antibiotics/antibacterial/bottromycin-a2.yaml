  source_retrieved_on: '2026-11-09'
  evidence:
  - reference: DOI:10.1002/anie.200804138
    snippet: Bottromycin A2 blocks aminoacyl-tRNA binding to the A site on the 50S
      ribosomal subunit and exhibits potent antibacterial activity against MRSA (MIC
      = 1 ug/mL) and VRE (MIC = 0.5 ug/mL).
    notes: Shimamura et al. 2009 (Angew Chem Int Ed 48:914-917; PMID:19115340) revised
      the absolute configuration of bottromycin A2 and characterized its antibacterial
      activity against MRSA and VRE via 50S ribosomal A-site inhibition.
  - reference: DOI:10.1248/cpb.60.169
    notes: Gouda et al. 2012 (Chem Pharm Bull 60:169-171; PMID:22293474) determined
      the three-dimensional solution structure of bottromycin A2 in relation to its
      potent antibacterial activity against MRSA and VRE.
  - reference: DOI:10.1016/j.chembiol.2012.08.013
    notes: Huo et al. 2012 (Chem Biol 19:1278-1287; PMID:23021914) characterized ribosomal
      peptide biosynthesis and engineering of bottromycin A2 in Streptomyces sp. BC16019.
