  evidence:
  - reference: DOI:10.1002/anie.200804138
    snippet: Bottromycin A2, a macrocyclic amidine- and thiazole-containing peptide
      antibiotic produced by Streptomyces bottropensis, exhibits potent antibacterial
      activity against methicillin-resistant Staphylococcus aureus (MRSA, MIC 1 ug/mL)
      and vancomycin-resistant enterococci (VRE, MIC 0.5 ug/mL) by blocking aminoacyl-tRNA
      binding to the ribosomal A site.
    notes: MIBiG 4.0.1 entries BGC0000468 and BGC0000469 (Streptomyces bottropensis
      DSM 40262 and Streptomyces sp. BC16019); Shimamura et al. 2009 (DOI:10.1002/anie.200804138,
      PMID:19115340), Gouda et al. 2012 (DOI:10.1248/cpb.60.169, PMID:22293474), and
      Huo et al. 2012 (DOI:10.1016/j.chembiol.2012.08.013, PMID:23021914) establish
      the total synthesis, revised stereostructure, RiPP biosynthesis, and potent
      anti-MRSA/VRE antibacterial activity of bottromycin A2. ChEBI CHEBI:202006 and
      PubChem CID 25215756 supply the stereo-complete SMILES, Standard InChI, and
      InChIKey.
