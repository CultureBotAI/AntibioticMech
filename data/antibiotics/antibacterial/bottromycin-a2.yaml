  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Selective binding to the bacterial 50S ribosomal subunit aminoacyl-tRNA
    acceptor (A) site, blocking aminoacyl-tRNA binding and arresting bacterial translation
    with potent MIC activity against methicillin-resistant Staphylococcus aureus and
    vancomycin-resistant Enterococcus (Shimamura et al. 2009, DOI:10.1002/anie.200804138,
    PMID:19115340; Gouda et al. 2012, DOI:10.1248/cpb.60.169, PMID:22293474; Huo et
    al. 2012, DOI:10.1016/j.chembiol.2012.08.013, PMID:23021914).
