  from Streptomyces bottropensis that selectively inhibits bacterial protein synthesis
  by blocking aminoacyl-tRNA binding to the bacterial 50S ribosomal A site (Shimamura
  et al. 2009, DOI:10.1002/anie.200804138, PMID:19115340; Gouda et al. 2012, DOI:10.1248/cpb.60.169,
  PMID:22293474; Huo et al. 2012, DOI:10.1016/j.chembiol.2012.08.013, PMID:23021914).'
