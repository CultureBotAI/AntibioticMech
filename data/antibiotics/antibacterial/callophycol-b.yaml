definition: A dibromophenol that is 2,4-dibromophenol substituted at position 6 by
  a decahydronaphthalen-1-ylmethyl group which in turn is substituted by a bromo,
  4-bromo-3-chloro-4-methylpentyl group, two methyl groups and a methylidene group
  at positions 6, 5, 5, 8a and 2 respectively. A diterpenoid isolated from the Fijian
  red alga Callophycus serratus, it exhibits antibacterial, antimalarial and anticancer
  activities.
