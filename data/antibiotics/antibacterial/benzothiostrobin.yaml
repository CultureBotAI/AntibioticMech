definition: Strobilurins, also known as QOI fungicides, are a group of fungicides
  originally isolated from the fungus Strobilurus tenacellus that inhibit mitochondrial
  respiration by binding to Complex III in the electron transport chain thereby disrupting
  the fungus's ability to produce energy. Benzothiostrobin is a novel strobilurin
  fungicide with no pubchem, chebi or chembl entries as of 08/31/25.
