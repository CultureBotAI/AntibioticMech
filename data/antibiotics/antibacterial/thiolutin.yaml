definition: A dithiolopyrrolone antibiotic that is 4,5-dihydro[1,2]dithiolo[4,3-b]pyrrole
  in which the hydrogens at positions 4,5 and 6 have been replaced by methyl, oxo
  and acetamido groups, respectively. It is a potent inhibitor of RNA polymerases,
  inhibits the angiogenesis of human umbilical vein endothelial cells, and also inhibits
  JAMM metalloproteases.
