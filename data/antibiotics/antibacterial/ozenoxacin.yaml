  - reference: DOI:10.1128/AAC.46.5.1229-1234.2002
    snippet: Yamakawa et al. reported that the nonfluorinated topical quinolone T-3912
      (ozenoxacin) exhibited potent antibacterial activity against Gram-positive and
      Gram-negative pathogens, including fluoroquinolone-resistant Staphylococcus
      aureus and Streptococcus pneumoniae, by inhibiting DNA gyrase and topoisomerase
      IV.
    notes: Yamakawa et al. 2002 (PMID:11959549) characterized T-3912 (ozenoxacin)
      activity against GyrA/ParC target-mutant staphylococcal and pneumococcal strains
      and established dual inhibition of bacterial DNA gyrase and topoisomerase IV.
