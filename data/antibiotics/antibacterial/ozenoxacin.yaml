  evidence:
  - reference: DOI:10.1128/AAC.01509-13
    snippet: Tato et al. evaluated the nonfluorinated quinolone ozenoxacin (T-3912)
      against 1,031 Gram-positive clinical isolates from skin and soft tissue infections
      and reported MIC50 and MIC90 values of 0.002 and 0.004 ug/mL for methicillin-susceptible
      Staphylococcus aureus, 0.004 and 0.12 ug/mL for methicillin-resistant S. aureus,
      and 0.015 and 0.03 ug/mL for Streptococcus pyogenes.
    notes: Reported by Tato et al. 2014 (Antimicrob Agents Chemother 58:3579-3581;
      PMID:24687498) and Yamakawa et al. 2002 (Antimicrob Agents Chemother 46:1229-1234;
      DOI:10.1128/AAC.46.5.1229-1234.2002) as a nonfluorinated pyridone quinolone
      antibacterial (T-3912) that dually inhibits DNA gyrase and topoisomerase IV.
      PubChem CID 9863827 and ChEBI CHEBI:136050 supply the standard InChI, InChIKey,
      formula, and SMILES for ozenoxacin.
