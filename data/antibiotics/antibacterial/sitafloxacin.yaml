definition: Sitafloxacin is a fluoroquinolone active against multi-resistant Gram-positive
  and negative pathogens. Sitafloxacin shows inhibitory activity against DNA gyrase
  and topoisomerase IV, which blocks bacterial DNA replication, thereby causing double-stranded
  breaks in the bacterial chromosome.
