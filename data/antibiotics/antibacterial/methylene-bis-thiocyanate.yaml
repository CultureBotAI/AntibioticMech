definition: A member of the class of thiocyanates that is methane in which two of
  the hycrogens have been replaced by thiocyanato groups. Used as a biocide for the
  control of various pathogens and algae in industrial water systems and as a fungicide
  for the control of surface moulds and sapstain fungi on wood.
