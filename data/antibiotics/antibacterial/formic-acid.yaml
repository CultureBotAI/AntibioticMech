definition: The simplest carboxylic acid, containing a single carbon. Occurs naturally
  in various sources including the venom of bee and ant stings, and is a useful organic
  synthetic reagent. Principally used as a preservative and antibacterial agent in
  livestock feed. Induces severe metabolic acidosis and ocular injury in human subjects.
