definition: A monocarboxylic acid amide obtained by the formal condensation of the
  amino group of 3-amino-2,4-dihydroxybenzoic acid with the carboxy group of the polycyclic
  cage component. It is an antibiotic isolated from Streptomyces platensis and exhibits
  inhibitory activity against fatty acid synthase.
