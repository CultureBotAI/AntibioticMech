  taxon_label: Streptomyces albus
  strain: SB12013
  phenotype_label: partial resistance / reduced susceptibility to platencin
  assay: Source-reported growth susceptibility assays; qualitative result only
  note: Primary functional evidence in a laboratory S. albus derivative; S. albus
    J1074 is the host background, not the derivative. Streptomyces platensis MA7327
    is the native donor, not the tested host. The coarse route follows the authors'
    interpretation; it is not an independent kinetic or exact-allele validation. The
    paper reports donor gene archive KF543053; no matching UniProt protein was resolved.
    Same-species DSM 40041 proteins are not MA7327 assignments. The precise basis
    of the reported intrinsic insensitivity is unresolved. The partial platencin response
    is not equivalent to full resistance. NCBITaxon:58346 is a donor species reference;
    NCBITaxon:1888 is a host species-name reference. The J1074 taxonomy search is
    ambiguous. No exact allele, strain TaxID, genome, numerical AST or clinical category
    is assigned.
