    of the reported intrinsic insensitivity is unresolved. The partial platencin response
    is not equivalent to full resistance. NCBITaxon:58346 is a donor species reference;
    NCBITaxon:1888 is a host species-name reference. The J1074 taxonomy search is
    ambiguous. No exact allele, strain TaxID, genome, numerical AST or clinical category
    is assigned. Species-grounding update (2026-10-14): the source-reported J1074
    host lineage is grounded to Streptomyces albidoflavus (NCBITaxon:1886), using
    the published J1074 background chromosome CP004370.1 and its ENA taxonomic metadata,
    with agreeing UniProt species rank and name. The preceding NCBITaxon:1888 and
    J1074 name-search statements retain historical reference context, not the current
    species assignment. This is species-level lineage grounding, not resequencing
    or exact identity validation of the tested derivative. CP004370.1 and its associated
    sample and study remain background references only; no experimental genome, sample,
    strain TaxID or protein allele is assigned. Donor references and the original
    phenotype and mechanism limitations remain unchanged. Donor-archive update (2026-10-14):
