definition: Prulifloxacin is a 6-fluoroquinolone antibiotic with a C-2 sulfur atom.
  It is hydrolyzed by esterases to produce the active compound Ulifloxacin. The active
  compound has broad spectrum activity against most Gram-negative bacteria. Prulifloxacin
  displays strong bactericidal activity against Pseudomonas aeruginosa biofilms and
  persister cells.
