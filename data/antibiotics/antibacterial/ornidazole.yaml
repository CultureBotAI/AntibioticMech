definition: A C-nitro compound that is 5-nitroimidazole in which the hydrogens at
  positions 1 and 2 are replaced by 3-chloro-2-hydroxypropyl and methyl groups, respectively.
  It is used in the treatment of susceptible protozoal infections and for the treatment
  of anaerobic bacterial infections.
