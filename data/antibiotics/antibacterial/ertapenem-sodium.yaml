identifier: CHEBI:60070
label: ertapenem sodium
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: The monosodium salt of ertapenem. It is used for the treatment of moderate
  to severe susceptible infections including intra-abdominal and acute gynaecological
  infections, pneumonia, and infections of the skin and of the urinary tract. It is
  more stable to renal dehydropeptidase I tham imipenem, and so unlike imipenem, its
  use with cilastatin, which inhibits the enzyme, is not required.
