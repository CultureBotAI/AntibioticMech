  evidence:
  - reference: DOI:10.1038/nm.3262
    snippet: Here, we report on a promising class of imidazopyridine amide (IPA) compounds
      that block Mycobacterium tuberculosis growth by targeting the respiratory cytochrome
      bc1 complex. The optimized IPA compound Q203 inhibited the growth of MDR and
      XDR M. tuberculosis clinical isolates in culture broth medium in the low nanomolar
      range and was efficacious in a mouse model of tuberculosis at a dose less than
      1 mg per kg body weight.
    notes: Reported by Pethe et al. 2013 (Nat Med 19:1157-1160; PMID:23913123) as
      an imidazo[1,2-a]pyridine-3-carboxamide (Q203) targeting the QcrB subunit of
      the mycobacterial respiratory cytochrome bc1:aa3 complex, with MIC50 = 2.7 nM
      (~1.5 ng/mL) against Mycobacterium tuberculosis H37Rv in broth and MIC50 = 0.28
      nM inside macrophages.
