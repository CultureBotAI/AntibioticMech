    snippet: Ganfeborole (GSK3036656) is a first-in-class benzoxaborole inhibiting
      Mycobacterium tuberculosis leucyl-tRNA synthetase. Ganfeborole exhibits potent
      in vitro activity against M. tuberculosis H37Rv (MIC = 0.08 uM; ~0.024 ug/mL)
      and demonstrated bactericidal early bactericidal activity in patients with rifampicin-susceptible
      pulmonary tuberculosis at oral doses of 10-30 mg once daily.
    notes: Diacon et al. 2024 (Nat Med 30:896-904; PMID:38365949) and Li et al. 2017
      (J Med Chem 60:8011-8026; PMID:28379699; PDB:5AGR) establish that ganfeborole
      (GSK3036656) inhibits Mycobacterium tuberculosis H37Rv leucyl-tRNA synthetase
      (LeuS, Rv0041, UniProtKB:P9WFV1, IC50 = 0.20 uM) by forming a covalent adduct
      with the 3'-terminal adenosine of tRNA(Leu) in the editing site.
