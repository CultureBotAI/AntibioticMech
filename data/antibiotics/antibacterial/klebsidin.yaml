definition: Klebsidin is a peptide antibiotic derived from Klebsiella pneumoniae that
  exhibits activity against members of the Enterobacteriaceae family of Gram-negative
  bacteria, including Escherichia and Salmonella species. Klebsidin acts by accumulating
  in the target cell and inhibiting RNA polymerase.
