  evidence:
  - reference: DOI:10.1128/AAC.37.3.384
    snippet: Fukuoka et al. reported that T-3761 (pazufloxacin) showed potent broad-spectrum
      antibacterial activity against Gram-negative and Gram-positive bacteria and
      inhibited bacterial DNA gyrase supercoiling activity.
    notes: Fukuoka et al. 1993 (PMID:8460909) measured direct inhibition of Escherichia
      coli DNA gyrase supercoiling activity by T-3761 (pazufloxacin), and Mitsuyama
      et al. 2002 (PMID:11959571) established dual inhibition of bacterial DNA gyrase
      and topoisomerase IV.
