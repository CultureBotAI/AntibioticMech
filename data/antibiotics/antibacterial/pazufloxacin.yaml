  taxon_label: Bacteria
  experimental_context: Purified bacterial DNA gyrase DNA supercoiling inhibition
    and topoisomerase IV decatenation assays with T-3761 / pazufloxacin (Fukuoka et
    al. 1993, DOI:10.1128/AAC.37.3.384, PMID:8460909; Mitsuyama et al. 2002, PMID:11959571).
  evidence_status: PRIMARY_EVIDENCE
