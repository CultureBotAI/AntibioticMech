  evidence:
  - reference: DOI:10.1128/AAC.37.3.384
    snippet: Fukuoka et al. evaluated the in vitro and in vivo antibacterial activities
      of T-3761 (pazufloxacin) and reported MIC90 values of 0.39 ug/mL against methicillin-susceptible
      Staphylococcus aureus, 0.025 to 0.39 ug/mL against Enterobacteriaceae species,
      and 0.78 ug/mL against Pseudomonas aeruginosa, along with inhibition of Escherichia
      coli DNA gyrase supercoiling.
    notes: Reported by Fukuoka et al. 1993 (Antimicrob Agents Chemother 37:384-392;
      PMID:8460909) and Muratani et al. 1992 (Antimicrob Agents Chemother 36:2293-2303;
      DOI:10.1128/AAC.36.10.2293) as a 10-(1-aminocyclopropyl) oxazine-ring-fused
      fluoroquinolone antibacterial (T-3761). PubChem CID 65957 and ChEBI CHEBI:94700
      supply the standard InChI, InChIKey, formula, and isomeric SMILES for pazufloxacin.
