definition: A monohydroxyquinoline that is quinolin-8-ol in which the hydrogens at
  positions 5 and 7 are replaced by chlorine and iodine, respectively. It has antibacterial
  and atifungal properties, and is used in creams for the treatment of skin infections.
  It has also been investigated as a chelator of copper and zinc ions for the possible
  treatment of Alzheimer's disease.
