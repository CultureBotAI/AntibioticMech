definition: A quinolinemonocarboxylic acid that is 1,4-dihydroquinoline-3-carboxylic
  acid that is substituted by an ethyl group at position 1 and by a pyridin-4-yl group
  at position 7. An antibacterial drug, active against Neisseria gonorrhoeae, it has
  been used for treating urinary tract infections and certain sexually transmitted
  diseases.
