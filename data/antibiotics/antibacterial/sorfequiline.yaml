  - reference: DOI:10.1128/aac.02404-19
    snippet: TBAJ-876, a clinical development candidate of this series, shows attractive
      in vitro antitubercular activity and efficacy in a murine tuberculosis model.
      TBAJ-876 displayed submicromolar in vitro activity against reference strains
      representing the three subspecies of M. abscessus and against a collection of
      clinical isolates.
    notes: Reported by Sarathy et al. 2020 (Antimicrob Agents Chemother 64:e02404-19;
      PMID:31964791) and Sarathy et al. 2019 (Antimicrob Agents Chemother 63:e01191-19;
      PMID:31358589; DOI:10.1128/aac.01191-19) as a next-generation 3,5-dialkoxypyridine
      diarylquinoline (TBAJ-876, INN sorfequiline) targeting the c and epsilon subunits
      of mycobacterial F1FO-ATP synthase, with MIC50 = 0.004 uM against Mycobacterium
      tuberculosis H37Rv and submicromolar MICs (0.15-0.6 uM) across Mycobacterium
      abscessus isolates.
