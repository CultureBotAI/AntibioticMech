identifier: antibioticmech:aro-d075cb1991
label: edeine B
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: MINTED
definition: Edeine B is a subtype of the peptide antibiotic edeine, composed of beta-tyr,
  beta-ser, diaminopropionic acid, diaminohydroxyazelaic acid, glycine, and guanylspermidine.
  Edeine B is a mixture of edeine B1 and its inactive isomer, edeine B2. Edeines bind
  to the 30S subunit to block fMet-tRNA interaction at the P site, inhibiting protein
  synthesis and subsequent structure/function processes critical for life or replication.
  Edeine B has also been shown to inhibit septation and cause filamentous morphology,
  also leading to cell death.
