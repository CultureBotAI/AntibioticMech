  evidence:
  - reference: DOI:10.1128/aac.00338-22
    snippet: OPC-167832 (quabodepistat) is a newly synthesized 3,4-dihydrocarbostyril
      derivative targeting decaprenylphosphoryl-beta-D-ribose 2'-oxidase (DprE1).
      The MICs of OPC-167832 for M. tuberculosis laboratory and clinical isolates
      ranged from 0.00024 to 0.001 ug/mL, and its 50% inhibitory concentration (IC50)
      against recombinant M. tuberculosis DprE1 was 0.258 uM.
    notes: Reported by Hariguchi et al. 2022 (Antimicrob Agents Chemother 66:e0033822;
      PMID:35699441) and Hariguchi et al. 2020 (Antimicrob Agents Chemother 64:e02020-19;
      DOI:10.1128/aac.02020-19) as a noncovalent 3,4-dihydrocarbostyril inhibitor
      (OPC-167832) of Mycobacterium tuberculosis decaprenylphosphoryl-beta-D-ribose
      2'-oxidase (DprE1, IC50 = 0.258 uM) with MICs of 0.00024-0.001 ug/mL across
      drug-susceptible and multidrug-resistant M. tuberculosis isolates.
