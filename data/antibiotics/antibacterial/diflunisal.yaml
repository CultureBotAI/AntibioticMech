definition: Diflunisal is a salicylic acid derivative and aspirin analogue typically
  used as a nonsteroidal anti-inflammatory drug. It has been shown to exhibit antibiotic
  activity against Escherichia coli by inhibiting MurA (MurZ), thereby disrupting
  cell wall synthesis.
