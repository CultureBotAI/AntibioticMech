definition: Glycerol in which the hydrogen of one of the primary hydroxy groups is
  substituted by a 4-chlorophenyl group. It has antifungal and antibacterial properties,
  and is used for treatment of cutaneous and vaginal infections. Its 1-carbamate is
  used as a skeletal muscle relaxant for the treatment of painful muscle spasm.
