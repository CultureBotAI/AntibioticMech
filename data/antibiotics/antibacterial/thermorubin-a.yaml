  evidence:
  - reference: DOI:10.1093/nar/gkac1189
    snippet: Thermorubin (THR) is an aromatic anthracenopyranone antibiotic active
      against both Gram-positive and Gram-negative bacteria. It is known to bind to
      the 70S ribosome at the intersubunit bridge B2a and was thought to inhibit factor-dependent
      initiation of translation and obstruct the accommodation of tRNAs into the A
      site. Here, we show that thermorubin causes ribosomes to stall in vivo and in
      vitro at internal and termination codons.
    notes: Characterized by Paranjpe et al. 2023 (Nucleic Acids Res 51:449-467; PMID:36546783)
      and Bulkley et al. 2012 (J Mol Biol 416:571-578; PMID:22240456; DOI:10.1016/j.jmb.2011.12.055)
      as a Thermoactinomyces antibioticus anthracenopyranone antibiotic that binds
      intersubunit bridge B2a of the bacterial 70S ribosome and inhibits Escherichia
      coli tolC-mutant growth (MIC ~1.6 ug/mL) and translation elongation/termination.
      Resolves the structureless ChEBI parent CHEBI:48516 (thermorubin) via the specific
      defined structure CHEBI:48480 (thermorubin A).
