    snippet: Thermorubin (THR) is an aromatic anthracenopyranone antibiotic active
      against both Gram-positive and Gram-negative bacteria. It is known to bind to
      the 70S ribosome at the intersubunit bridge B2a and was thought to inhibit factor-dependent
