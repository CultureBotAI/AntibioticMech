definition: A glycopeptide that is vancomycin substituted at position N-3'' by a 2-(decylamino)ethyl
  group and at position C-29 by a (phosphonomethyl)aminomethyl group. Used as its
  hydrochloride salt for treatment of adults with complicated skin and skin structure
  infections caused by bacteria.
