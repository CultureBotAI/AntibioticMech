  title: Salinamide A binds the bacterial RNA polymerase bridge-helix cap/hinge pocket
    to inhibit nucleotide addition and transcription
  description: Salinamide A, a marine streptomycete bicyclic depsipeptide antibiotic,
    binds the bacterial DNA-directed RNA polymerase (RpoB/RpoC) bridge-helix cap/hinge
    site, allosterically preventing bridge-helix N-terminal hinge unbending required
    for nucleotide addition and arresting bacterial transcription.
