      cap/hinge region that mediates catalytic nucleotide addition.
    evidence:
    - reference: DOI:10.7554/eLife.02451
      notes: Saturation mutagenesis of E. coli rpoB and rpoC and X-ray crystallography
        (PDB:4MEX) mapped the salinamide A pocket to RpoB and RpoC residues flanking
        the bridge-helix N-terminal hinge (PMID:24843001).
