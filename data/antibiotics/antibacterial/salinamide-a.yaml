    predicate: inhibits
    object: rnap_bridge_helix_hinge_nucleotide_addition_activity
    description: Salinamide A binds the bacterial RNA polymerase bridge-helix cap/hinge
      site and allosterically inhibits nucleotide addition.
    evidence:
    - reference: DOI:10.7554/eLife.02451
      notes: Degen et al. 2014 (PMID:24843001; PDB:4MEX) solved the crystal structure
        of Escherichia coli RNA polymerase holoenzyme bound to salinamide A and showed
        that binding at the bridge-helix cap/hinge pocket prevents bridge-helix N-terminal
        hinge unbending required for nucleotide addition.
