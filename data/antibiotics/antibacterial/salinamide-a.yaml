molecular_targets:
- target_id: GO:0000428
  target_label: bacterial DNA-directed RNA polymerase bridge-helix cap (RpoB / RpoC)
  target_type: PROTEIN_COMPLEX
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: In vitro transcription inhibition assays, spontaneous resistance
    mapping to rpoB and rpoC, and X-ray crystal structure of Escherichia coli DNA-directed
    RNA polymerase holoenzyme bound to salinamide A at the bridge-helix cap (PDB:4MEX)
    allosterically blocking nucleotide addition (Degen et al. 2014, DOI:10.7554/eLife.02451,
    PMID:24843001; Ray et al. 2016, DOI:10.1002/anie.201508576, PMID:26553755).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2014-05
  source_retrieved_on: '2026-11-05'
  evidence:
  - reference: DOI:10.7554/eLife.02451
    snippet: Degen et al. demonstrated that salinamide A inhibits bacterial RNA polymerase
      in vitro and in vivo without cross-resistance to rifampin and determined the
      crystal structure of Escherichia coli RNA polymerase bound to salinamide A at
      the bridge-helix cap (PDB:4MEX).
    notes: Degen et al. 2014 (eLife 3:e02451; PMID:24843001; PDB:4MEX) mapped the
      salinamide A binding site to the RpoB/RpoC bridge-helix cap of Escherichia coli
      DNA-directed RNA polymerase.
  - reference: PMID:24843001
    notes: PubMed record for Degen et al. 2014 on transcription inhibition and crystal
      structure of E. coli RNA polymerase with salinamide A.
  - reference: DOI:10.1002/anie.201508576
    notes: Ray et al. 2016 (Angew Chem Int Ed Engl 55:364-367; PMID:26553755) characterized
      biosynthesis of the salinamide A bicyclic depsipeptide core in Streptomyces
      sp. CNB-091.
  - reference: PMID:26553755
    notes: PubMed record for Ray et al. 2016 on salinamide A biosynthesis and antibacterial
      activity.
