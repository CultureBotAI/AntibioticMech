    snippet: Ray et al. characterized the nonribosomal peptide synthetase Sln9 that
      installs the acylglycine basket handle of the bicyclic depsipeptide antibiotic
      salinamide A in marine Streptomyces sp. CNB-091, which inhibits bacterial RNA
      polymerase and exhibits antibacterial activity against Gram-positive and Gram-negative
      bacteria.
    notes: Reported by Ray et al. 2016 (Angew Chem Int Ed Engl 55:364-367; PMID:26553755;
      DOI:10.1002/anie.201508576), Degen et al. 2014 (eLife 3:e02451; PMID:24843001;
      DOI:10.7554/eLife.02451), and Moore et al. 1999 (J Org Chem 64:1145-1150; PMID:11674169;
      DOI:10.1021/jo981406+) as an epoxide-containing bicyclic depsipeptide antibiotic
      from marine Streptomyces sp. CNB-091 that binds the bridge-helix cap of bacterial
      RNA polymerase. MIBiG 4.0.1 entry BGC0001230, ChEBI CHEBI:227666, and PubChem
      CID 10102536 supply the stereo-complete SMILES, Standard InChI, and InChIKey.
