    predicate: supports
    object: bacterial_dna_templated_transcription
    description: Bridge-helix hinge cycling and nucleotide addition drive bacterial
      transcription initiation and elongation.
    evidence:
    - reference: DOI:10.7554/eLife.02451
      notes: Allosteric arrest of bridge-helix hinge unbending by salinamide A inhibits
        transcription initiation and elongation without cross-resistance to rifampicin,
        fidaxomicin, CBR703, or streptolydigin (PMID:24843001).
