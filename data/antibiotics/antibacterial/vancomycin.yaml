  gene_families:
  - vanM
  taxon_id: NCBITaxon:1352
  taxon_label: Enterococcus faecium
  strain: Efm-HS0661
  phenotype_label: source-reported vancomycin resistance
  assay: Etest
  note: Native-isolate phenotype and precursor analysis support a cluster-associated
    target-alteration route, not isolated VanM sufficiency. UniProtKB:B8XGS3 and FJ349556.1
    are source-bound ligase references only; CP039730.1 belongs to a different isolate.
    No exact experimental protein, allele or genome is assigned. Laboratory-recipient
    findings are not assigned here.
  evidence:
  - reference: PMID:20733041
    notes: Publisher Table 1, native-isolate Results, precursor analysis and accession
      statement; qualitative finding only.
