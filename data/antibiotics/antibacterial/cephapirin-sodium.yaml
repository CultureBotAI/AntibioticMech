definition: The sodium salt of cephapirin. A first-generation cephalosporin antibiotic,
  it is effective against gram-negative and gram-positive organisms. Being more resistant
  to β-lactamases than penicillins, it is effective agains most staphylococci, though
  not methicillin-resistant staphylococci.
