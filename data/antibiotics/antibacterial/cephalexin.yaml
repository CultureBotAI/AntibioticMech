definition: A semisynthetic first-generation cephalosporin antibiotic having methyl
  and β-(2R)-2-amino-2-phenylacetamido groups at the 3- and 7- of the cephem skeleton,
  respectively. It is effective against both Gram-negative and Gram-positive organisms,
  and is used for treatment of infections of the skin, respiratory tract and urinary
  tract.
