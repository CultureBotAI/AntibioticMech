definition: Spongosorites has yielded a bis-indole alkaloid which we have named dragmacidin
  G. Dragmacidin G is the first in this series of compounds to have a pyrazine ring
  linking the two indole rings. It also has a rare N-(2-mercaptoethyl)-guanidine side
  chain. Dragmacidin G shows a broad spectrum of biological activity including inhibition
  of methicillin-resistant Staphylococcus aureus, Mycobacterium tuberculosis, Plasmodium
  falciparum, and a panel of pancreatic cancer cell lines.
