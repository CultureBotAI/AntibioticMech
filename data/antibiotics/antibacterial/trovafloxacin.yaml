definition: A 1,8-naphthyridine derivative that is 4-oxo-1,4-dihydro-1,8-naphthyridine-3-carboxylic
  acid bearing additional 2,4-difluorophenyl, fluoro and 6-amino-3-azabicyclo[3.1.0]hex-3-yl
  substituents at positions 1, 6 and 7 respectively. A broad-spectrum antibiotic that
  was withdrawn from the market due to risk of liver failure.
