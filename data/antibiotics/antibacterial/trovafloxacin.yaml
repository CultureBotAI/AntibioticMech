mode_of_action_notes: 'CURATOR: Synthetic fluoronaphthyridone antibiotic that dually
  inhibits bacterial DNA gyrase (GyrA/GyrB) DNA supercoiling and topoisomerase IV
  (ParC/ParE) decatenation, arresting bacterial DNA replication (Takei et al. 2001,
  DOI:10.1128/AAC.45.12.3544-3547.2001, PMID:11709337).'
molecular_targets:
- target_id: ARO:3000733
  target_label: fluoroquinolone sensitive gyrA
  target_type: PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  experimental_context: CARD/ARO database assertion; target organism, strain, and
    assay are not specified. ARO explicitly describes ligand binding to gyrase subunit
    A.
  evidence_status: PRIMARY_EVIDENCE_NEEDED
  source: CARD_ARO
  source_version: '2026-08-30'
  source_retrieved_on: '2026-08-30'
  evidence:
  - reference: ARO:3000733
    notes: CARD/ARO asserts targeted_by_antibiotic ARO:3000664 (trovafloxacin); database
      assertion, not a primary citation.
- target_label: bacterial DNA gyrase (GyrA/GyrB) and topoisomerase IV (ParC/ParE)
  target_type: PROTEIN_COMPLEX
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Purified bacterial DNA gyrase DNA supercoiling and topoisomerase
    IV decatenation IC50 inhibition assays and GyrA/ParC QRDR mutant-panel susceptibility
    profiling of trovafloxacin alongside comparator fluoroquinolones (Takei et al.
    2001, DOI:10.1128/AAC.45.12.3544-3547.2001, PMID:11709337).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2001-12
  source_retrieved_on: '2026-11-03'
  evidence:
  - reference: DOI:10.1128/AAC.45.12.3544-3547.2001
    snippet: Takei et al. determined the inhibitory activities (IC50s) of trovafloxacin
      and 15 other quinolones against purified bacterial DNA gyrase supercoiling and
      topoisomerase IV decatenation and correlated enzyme inhibition with MIC shifts
      across defined GyrA and ParC QRDR mutants.
    notes: Takei et al. 2001 (Antimicrob Agents Chemother 45:3544-3547; PMID:11709337)
      measured direct dual inhibition of bacterial DNA gyrase and topoisomerase IV
      by trovafloxacin and established target-mutation resistance shifts across GyrA
      and ParC QRDR variants.
