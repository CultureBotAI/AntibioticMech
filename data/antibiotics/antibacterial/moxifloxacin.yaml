definition: A quinolone that consists of 4-oxo-1,4-dihydroquinoline-3-carboxylic acid
  bearing a cyclopropyl substituent at position 1, a fluoro substitiuent at position
  6, a (4aS,7aS)-octahydro-6H-pyrrolo[3,4-b]pyridin-6-yl group at position 7 and a
  methoxy substituent at position 8. A member of the fluoroquinolone class of antibacterial
  agents.
