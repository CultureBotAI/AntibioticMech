definition: A pyridopyrimidine that is 5-oxo-5,8-dihydropyrido[2,3-d]pyrimidine-6-carboxylic
  acid, substituted at position 2 by a pyrrolidin-1-yl group and at position 8 by
  an ethyl group. A synthetic antibacterial which is used for the treatment of urinary
  tract and intestinal infections.
