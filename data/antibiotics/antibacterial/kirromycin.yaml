definition: Kirromycin, also known as mocimycin, is the representative molecule of
  its own class of elfamycins which is composed of more than 10 analogs. Kirromycin
  binds to the domain 1,2 interface of elongation factor Tu. This interaction maintains
  the EF-Tu*GTP conformation even after GTP is hydrolyzed to GDP. EF-Tu*GDP normally
  releases aa-tRNA and then exits the ribosome; however, kirromycin*EF-Tu*GDP*aa-tRNA
  forms a strong complex and remains bound to the ribosome, prohibits translocation
  of the peptide chain and translation is halted.
