definition: Propylphosphonic acid in which one of the hydrogens at position 3 is substituted
  by a formyl(hydroxy)amino group. An antibiotic obtained from Streptomyces lavendulae,
  it specifically inhibits DXP reductoisomerase (EC 1.1.1.267), a key enzyme in the
  non-mevalonate pathway of isoprenoid biosynthesis.
