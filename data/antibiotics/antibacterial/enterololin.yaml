  evidence:
  - reference: DOI:10.1038/s41564-025-02142-0
    snippet: Here we screened 10,747 bioactive small molecules for antibacterial activity
      against AIEC and discovered enterololin, an antibacterial compound with targeted
      activity against Enterobacteriaceae species. Molecular substructure- and deep
      learning-guided mechanism-of-action investigations revealed that enterololin
      perturbs lipoprotein trafficking through a mechanism involving the LolCDE complex,
      laboratory-evolved resistant mutants predominantly mapped to lolC and lolE,
      with an in vitro frequency of resistance of ~10-8 to 10-7.
    notes: Reported by Catacutan et al. 2025 (Nat Microbiol 10:2827-2841; PMID:41044363)
      as a narrow-spectrum Enterobacteriaceae-selective antibacterial targeting the
      LolCDE lipoprotein transport complex (resistance mutations in lolC and lolE),
      active against adherent-invasive Escherichia coli (MIC ~2-4 ug/mL, and potentiated
      across multidrug-resistant Enterobacteriaceae with SPR741).
