mode_of_action_notes: 'CURATOR: C-nucleoside natural-product antibiotic (oxazinomycin)
  whose intracellularly phosphorylated 5''-triphosphate metabolite incorporates into
  nascent RNA in place of UTP and arrests bacterial and eukaryotic DNA-directed RNA
  polymerase transcription elongation at polythymidine sequences (Prajapati et al.
  2019, DOI:10.1093/nar/gkz782, PMID:31535140; Kong et al. 2019, DOI:10.1016/j.isci.2019.11.037,
  PMID:31816530).'
