- target_id: GO:0000428
  target_label: DNA-directed RNA polymerase complex
  target_type: PROTEIN_COMPLEX
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: In vitro transcription elongation and nascent RNA incorporation
    assays with purified Escherichia coli DNA-directed RNA polymerase and oxazinomycin
    (minimycin) 5'-triphosphate (Prajapati et al. 2019, DOI:10.1093/nar/gkz782, PMID:31535140;
    Kong et al. 2019, DOI:10.1016/j.isci.2019.11.037, PMID:31816530).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2019-11
  source_retrieved_on: '2026-11-03'
  evidence:
  - reference: DOI:10.1093/nar/gkz782
    snippet: Prajapati et al. demonstrated that the 5'-triphosphate of the C-nucleoside
      antibiotic oxazinomycin (minimycin) is incorporated into nascent RNA by Escherichia
      coli RNA polymerase in place of UTP and arrests transcription elongation at
      polythymidine tracts.
    notes: Prajapati et al. 2019 (Nucleic Acids Res 47:10296-10312; PMID:31535140)
      established that oxazinomycin (minimycin) 5'-triphosphate serves as a substrate
      for purified Escherichia coli DNA-directed RNA polymerase and blocks transcription
      elongation.
  - reference: DOI:10.1016/j.isci.2019.11.037
    notes: Kong et al. 2019 (iScience 22:430-440; PMID:31816530) elucidated the min
      biosynthetic gene cluster and MinT/MinC self-resistance determinants for minimycin
      (oxazinomycin) in Streptomyces hygroscopicus.
