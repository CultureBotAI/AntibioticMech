  evidence:
  - reference: DOI:10.7164/antibiotics.51.323
    snippet: Kobayashi et al. isolated micacocidin from Pseudomonas sp. No. 57-250
      as a metal-chelating thiazoline antibiotic exhibiting potent and selective antibacterial
      activity against pathogenic Mycoplasma species.
    notes: Kobayashi et al. 1998 (J Antibiot 51:323-327; PMID:9589068) discovered
      micacocidin from Pseudomonas sp. No. 57-250 and characterized its potent antimycoplasmal
      activity and Zn2+/Cu2+/Fe3+ complexation.
  - reference: DOI:10.7164/antibiotics.51.328
    notes: Ino et al. 1998 (J Antibiot 51:328-332) determined the planar and X-ray
      crystal structure of micacocidin as a thiazoline-containing pentadentate metal-chelating
      antibiotic.
