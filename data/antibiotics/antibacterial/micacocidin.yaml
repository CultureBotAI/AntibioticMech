  taxon_label: Bacteria
  experimental_context: Antimycoplasmal susceptibility and metal-complexation (Zn2+,
    Cu2+, Fe3+) bioactivity profiling of micacocidin from Pseudomonas sp. No. 57-250
    (Kobayashi et al. 1998, DOI:10.7164/antibiotics.51.323, PMID:9589068; Ino et al.
    1998, DOI:10.7164/antibiotics.51.328).
  evidence_status: PRIMARY_EVIDENCE
