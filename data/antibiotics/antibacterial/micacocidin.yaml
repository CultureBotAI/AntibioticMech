mode_of_action_notes: 'CURATOR: Thiazoline-containing siderophore-like polyketide-nonribosomal
  peptide antibiotic from Ralstonia/Pseudomonas sp. that chelates divalent transition-metal
  cations (Zn2+, Cu2+, Fe3+) and inhibits bacterial protein biosynthesis and transition-metal
  homeostasis, with potent antimycoplasmal activity (Kobayashi et al. 1998, DOI:10.7164/antibiotics.51.323,
  PMID:9589068; Ino et al. 1998, DOI:10.7164/antibiotics.51.328).'
