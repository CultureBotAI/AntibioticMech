definition: A member of the class of chalcones that is benzene in which the hydrogens
  at positions 1,2 and 5 are replaced by carboxymethoxy, (1E)-1-{4-[(3-methylbut-2-en-1-yl)oxy]phenyl}-3-oxoprop-1-en-3-yl,
  and (3-methylbut-2-en-1-yl)oxy groups, respectively. It is a gastrointestinal drug
  currently used for treatment of gastritis and gastric ulcers in Japan and South
  Korea.
