definition: Cyclomarin A was found to be bacteriocidal against bacteria replicating
  in culture broth and in human-derived macrophages and a series of multidrug resistant
  clinical isolates. It was identified as a potent antitubercular compound in a natural
  product whole cell screen. Importantly it kills both growing and dormant, non-replicating
  mycobacteria.
