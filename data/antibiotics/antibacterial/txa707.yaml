  evidence:
  - reference: DOI:10.1128/AAC.00708-15
    snippet: Kaul et al. designed the metabolic-stability-optimized FtsZ-targeting
      benzamide TXA707 by replacing the Cl atom of PC190723 with a CF3 group and reported
      bactericidal activity against methicillin-resistant, vancomycin-intermediate,
      and linezolid-resistant Staphylococcus aureus clinical isolates with MIC values
      of 0.5 to 2 ug/mL.
    notes: Kaul et al. 2015 (Antimicrob Agents Chemother 59:4835-4844; PMID:26033735)
      and Fujita et al. 2017 (ACS Infect Dis 3:851-862; PMID:28621933; PDB:5XDT) established
      that TXA707 binds the interdomain binding pocket of Staphylococcus aureus FtsZ
      (UniProtKB:P0A031 / S. aureus NCTC 8325 UniProtKB:Q2FZ89), promoting aberrant
      FtsZ polymerization and blocking cytokinesis.
