identifier: CHEBI:75046
label: phleomycin D1
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A glycopeptide originally isolated from the bacterium Streptomyces verticillus
  which contains a (4'R)-4',5'-dihydro-2,4'-bi-1,3-thiazole-2',4-diyl moiety with
  a a 4-guanidylbutylaminocarbonyl group attached to the 4-position of the terminal
  thiazole ring. Like all phleomycins, phleomycin D1 can form complexes with redox-active
  metals such as Co, Cu, and Fe.
