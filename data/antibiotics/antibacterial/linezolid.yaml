mode_of_action: PROTEIN_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:18757750 resolved linezolid in the A-site pocket
  of the Deinococcus radiodurans 50S peptidyl-transferase center. It overlaps the
  aminoacyl group of A-site tRNA and stabilizes a nonproductive conformation of conserved
  23S-rRNA nucleotide U2585, perturbing tRNA positioning.'
mode_of_action_target_scope: HOST_SHARED_TARGET
