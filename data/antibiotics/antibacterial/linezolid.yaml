identifier: CHEBI:63607
label: linezolid
antimicrobial_class: ANTIBACTERIAL
curation_status: REVIEWED
grounding_status: EXACT
definition: An organofluorine compound that consists of 1,3-oxazolidin-2-one bearing
  an N-3-fluoro-4-(morpholin-4-yl)phenyl group as well as an acetamidomethyl group
  at position 5. A synthetic antibacterial agent that inhibits bacterial protein synthesis
  by binding to a site on 23S ribosomal RNA of the 50S subunit and prevents further
  formation of a functional 70S initiation complex.
