definition: 'A macrolide antibiotic which displays in vitro activity against both
  gram-positive and gram-negative bacteria and is currently under investigation for
  the treatment of community-acquired pneumonia. The US Food and Drug Administration
  (FDA) have also granted orphan drug designation to cethromycin for the treatment
  of anthrax prophylaxis, tularemia, and plague (PDB entry: <a href="https://www.ebi.ac.uk/pdbe/entry/pdb/1NWX"
  target="_blank">1NWX</a>).'
