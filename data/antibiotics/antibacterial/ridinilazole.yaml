  evidence:
  - reference: DOI:10.1093/jac/dkae149
    snippet: Ridinilazole (RDZ) is a narrow-spectrum bis-benzimidazole antibacterial
      agent developed for the treatment of Clostridioides difficile infection (CDI).
      Across all 304 baseline C. difficile isolates collected in the Phase 3 Ri-CoDIFy
      trials, ridinilazole demonstrated potent in vitro activity with an MIC50 of
      0.125 mg/L, an MIC90 of 0.25 mg/L, and an MIC range of 0.03 to 0.5 mg/L.
    notes: Reported by Basseres et al. 2024 (J Antimicrob Chemother 79:1906-1914;
      PMID:38775229) as a narrow-spectrum symmetrical bis-benzimidazole antibacterial
      (SMT19969) that binds the DNA minor groove and impairs bacterial septum formation,
      with MIC50/MIC90 of 0.125/0.25 mg/L across 304 Phase 3 Clostridioides difficile
      clinical isolates.
