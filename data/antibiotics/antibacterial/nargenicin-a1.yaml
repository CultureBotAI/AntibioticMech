      DOI:10.1016/j.chembiol.2015.09.008), and Celmer et al. 1980 (J Am Chem Soc 102:4203-4209;
      DOI:10.1021/ja00532a040) as an oxa-bridged cis-decalin macrolide pyrrole-2-carboxylate
      antibiotic from Nocardia species that inhibits bacterial replicative DNA polymerase
      DnaE1 with potent bactericidal activity against Staphylococcus aureus. MIBiG
      4.0.1 entry BGC0001875 and PubChem CID 6326334 supply the stereo-complete SMILES,
