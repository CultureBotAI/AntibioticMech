  evidence:
  - reference: DOI:10.1002/anie.201900290
    snippet: Pidot et al. identified the 85 kb nargenicin biosynthetic gene cluster
      in Nocardia arthritidis responsible for producing the ether-bridged cis-decalin
      macrolide antibiotic nargenicin A1, which exhibits potent antibacterial activity
      against multidrug-resistant Staphylococcus aureus.
    notes: Reported by Pidot et al. 2019 (Angew Chem Int Ed Engl 58:3996-4001; PMID:30677204;
      DOI:10.1002/anie.201900290), Painter et al. 2015 (Chem Biol 22:1362-1373; PMID:26456734;
      DOI:10.1016/j.chembiol.2015.08.015), and Celmer et al. 1980 (J Am Chem Soc 102:4203-4209;
      DOI:10.1021/ja00532a040) as an oxa-bridged cis-decalin macrolide pyrrole-2-carboxylate
      antibiotic from Nocardia species that inhibits bacterial replicative DNA polymerase
      DnaE1 with potent bactericidal activity against Staphylococcus aureus. MIBiG
      4.0.1 entry BGC0001875 and PubChem CID 6326334 supply the stereo-complete SMILES,
      Standard InChI, and InChIKey.
