definition: A second-generation cephamycin antibiotic having [(1-methyl-1H-tetrazol-5-yl)sulfanyl]methyl
  and 2-{[(2S)-2-amino-2-carboxyethyl]sulfanyl}acetamido side-groups located respectively
  at positions 3 and 7β of the cephem nucleus. A broad-spectrum bactericide, it is
  especially effective against Gram-negative and anaerobic bacteria.
