definition: A salicylanilide resulting from the formal condensation of the carboxy
  group of 2-hydroxy-3,5-diiodobenzoic acid with the amino group of 3-chloro-4-(4-chlorophenoxy)aniline.
  It is a broad-spectrum anthelmintic used for the treatment of parasitic infections
  in cattle and sheep.
