definition: A pyridopyrimidine that is 5-oxo-5,8-dihydropyrido[2,3-d]pyrimidine-6-carboxylic
  acid substituted at position 2 by a piperazin-1-yl group and at position 8 by an
  ethyl group. A synthetic broad-spectrum antibacterial, it is used for treatment
  of gastrointestinal, biliary, and urinary infections.
