definition: A fluoroquinolone antibiotic that is 7-oxo-2,3-dihydro-7H-[1,3,4]oxadiazino[6,5,4-ij]quinoline
  substituted at positions 6, 9 and 10 by carboxy, fluoro and 4-methylpiperazin-1-yl
  groups, respectively. A synthetic, broad spectrum bactericidal agent, it is used
  in veterinary medicine, although its mechanism of action is not thoroughly understood.
