definition: A third-generation cephalosporin antibiotic bearing vinyl and (2Z)-2-(2-amino-1,3-thiazol-4-yl)-2-[(carboxymethoxy)imino]acetamido
  groups at positions 3 and 7, respectively, of the cephem skeleton. It is used in
  the treatment of gonorrhoea, tonsilitis, pharyngitis, bronchitis, and urinary tract
  infections.
