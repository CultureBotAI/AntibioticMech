definition: A cephalosporin with ({1-[2-(dimethylamino)ethyl]-1H-tetrazol-5-yl}sulfanyl)methyl
  and (2-amino-1,3-thiazol-4-yl)acetamido substituents at positions 3 and 7, respectively,
  of the cephem skeleton. A third generation beta-lactam cephalosporin antibiotic,
  it is active against a broad spectrum of both Gram positive and Gram negative bacteria.
