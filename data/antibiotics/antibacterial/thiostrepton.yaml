definition: A heterodetic cyclic peptide, in which the cyclisation step involves a
  formal lactonisation between the carboxy group of a quinaldic acid-based residue
  and a secondary alcohol. An antibiotic that inhibits bacterial protein synthesis.
  Also acts as an antitumor agent.
