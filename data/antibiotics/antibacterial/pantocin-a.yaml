definition: A member of the class of indolizines that is 3,5,6,7-tetrahydroindolizine
  which carries a 2-aminoacyl-4-amino-4-oxobutanoic acid, oxo, amino groups at positions
  3S, 5 and 6S, respectively. It is a ribosomally encoded and post-translationally
  modified peptide natural product found in several species of the Pantoea genus and
  derived from a Glu-Glu-Asn precursor peptide.
