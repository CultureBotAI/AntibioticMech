definition: A carbopolycyclic compound that is 3,4-dihydrotetraphene-1,7,12(2H)-trione
  substituted by hydroxy groups at positions 6 and 8 and an ethyl group at position
  3 (the S stereoisomer). It is isolated from the culture broth of Nocardia brasiliensis
  and exhibits antibacterial activity against Gram-positive bacteria. It is also active
  against the multiple drug-resistant P388/ADR tumour cells.
