definition: A pentacyclic triterpenoid that is oleana-11,13(18)-diene substituted
  by hydroxy groups at positions 3 and 23 and a carboxy group at position 28 (the
  3α stereoisomer). Isolated from the leaves and twigs of Fatsia polycarpa, it exhibits
  antibacterial and anti-HBV activities.
