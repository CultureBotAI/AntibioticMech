identifier: CHEBI:157681
label: tomaymycin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A pyrrolobenzodiazepine that is (11aS)-2,3,5,10,11,11a-hexahydro-1H-pyrrolo[2,1-c][1,4]benzodiazepine
  which is substituted at positions 2,5,7,8 and 11R by ethylidene, oxo, methoxy, hydroxy
  and methoxy groups, respectively. It is a natural product of Streptomyces achromogenes
  that binds covalently with guanine in the minor groove of DNA. It is an antitumoral
  compound which is active in ovarian, plasmacytoma, and leukemia cancer cell lines
  at nanomolar concentrations.
