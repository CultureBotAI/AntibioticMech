definition: Telithromycin is a semi-synthetic derivative of erythromycin. It is a
  14-membered macrolide and is the first ketolide antibiotic to be used in clinics.
  Telithromycin binds the 50S subunit of the bacterial ribosome to inhibit protein
  synthesis.
