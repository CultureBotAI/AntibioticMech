definition: Delafloxacin is a novel fluoroquinolone antibiotic, differentiated from
  other on-market fluoroquinolones by the absence of a protonatable substituent conferring
  a weakly acidic character to the molecule. This property results in increased intracellular
  penetration and enhanced bactericidal activity under acidic conditions.
