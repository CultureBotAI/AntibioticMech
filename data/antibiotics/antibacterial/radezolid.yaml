  - reference: DOI:10.1128/AAC.00962-09
    snippet: Locke et al. evaluated the biaryl oxazolidinone radezolid (RX-1741) against
      Staphylococcus aureus strains and reported MIC values of 0.25 to 0.5 ug/mL against
      wild-type S. aureus ATCC 29213 and RN4220 and 1 to 4 ug/mL against linezolid-resistant
      strains carrying 23S rRNA mutations or the cfr methyltransferase gene.
    notes: Reported by Locke et al. 2009 (Antimicrob Agents Chemother 53:5265-5274;
      PMID:19752277) and Skripkin et al. 2008 (Antimicrob Agents Chemother 52:3550-3557;
      DOI:10.1128/AAC.01193-07) as a biaryl-tetrazolylmethyl oxazolidinone antibacterial
      (RX-1741) targeting the bacterial 50S ribosomal subunit peptidyl transferase
      center. PubChem CID 11224409 supplies the standard InChI, InChIKey, formula,
      and isomeric SMILES for radezolid.
