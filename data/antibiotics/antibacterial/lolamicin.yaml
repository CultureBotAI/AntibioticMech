  taxon_id: NCBITaxon:83333
  taxon_label: Escherichia coli (strain K12)
  experimental_context: Resistance mutation mapping in lolC and lolE, lipoprotein
    trafficking inhibition, and structural binding-site modeling on the Escherichia
    coli LolCDE ABC transporter (DOI:10.1038/s41586-024-07502-0).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2024-06
  source_retrieved_on: '2026-10-24'
  evidence:
  - reference: DOI:10.1038/s41586-024-07502-0
    snippet: The resultant compound—lolamicin—is selectively active against a panel
      of more than 130 multidrug-resistant clinical isolates, has efficacy in multiple
      mouse models of acute pneumonia and septicaemia infection, and spares the gut
      microbiome in mice, preventing secondary infection with Clostridioides difficile.
    notes: Munoz et al. 2024 (Nature 630:429-436; PMID:38811738) established that
      lolamicin selectively inhibits outer-membrane lipoprotein trafficking via the
      LolCDE ABC transporter complex (LolC UniProtKB:P0ADC3, LolD UniProtKB:P75957,
      LolE UniProtKB:P75958 in Escherichia coli K-12), with resistance mutations clustering
      in the LolC/LolE transmembrane interface.
