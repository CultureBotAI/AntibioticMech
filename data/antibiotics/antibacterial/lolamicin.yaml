  - reference: DOI:10.1038/s41586-024-07502-0
    snippet: The resultant compound—lolamicin—is selectively active against a panel
      of more than 130 multidrug-resistant clinical isolates, has efficacy in multiple
      mouse models of acute pneumonia and septicaemia infection, and spares the gut
      microbiome in mice, preventing secondary infection with Clostridioides difficile.
    notes: Reported by Munoz et al. 2024 (Nature 630:429-436; PMID:38811738) as a
      Gram-negative-specific inhibitor of the LolCDE outer-membrane lipoprotein transport
      complex that spares commensal gut bacteria, with MIC 1-2 ug/mL against Escherichia
      coli and Klebsiella pneumoniae clinical isolates (MIC50/MIC90 1/2 mg/L for E.
      coli and 1/4 mg/L for K. pneumoniae in DOI:10.1128/aac.01701-25).
