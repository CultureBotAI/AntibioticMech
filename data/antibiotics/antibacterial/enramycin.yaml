definition: Enramycin is a polypeptide antibiotic commonly used as a feed additive
  for livestock. It is produced by species of the Streptomyces genus and is used to
  prevent necrotic enteritis in poultry and pigs. Enramycin disrupts cell wall synthesis
  by inhibiting MurG.
