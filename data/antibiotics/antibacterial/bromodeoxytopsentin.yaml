mode_of_action_notes: 'CURATOR: PMID:22030393 measured nanomolar inhibition of methicillin-resistant
  Staphylococcus aureus pyruvate kinase by bromodeoxytopsentin, at least 166-fold
  selectivity over human pyruvate-kinase isoforms, and antibacterial activity against
  S. aureus. The reported cocrystal used a related bis-indole compound, so bromodeoxytopsentin
  is not classified as a direct-binding target here.'
