identifier: CHEBI:144087
label: bromodeoxytopsentin
antimicrobial_class: ANTIBACTERIAL
curation_status: REVIEWED
grounding_status: EXACT
definition: An aromatic ketone that is imidazole which is substituted by a 1H-indole-3-carbonyl
  group and a 6-bromo-1H-indol-3-yl group at positions 2 and 4, respectively. Isolated
  from the Mediterranean shallow-water sponge, Topsentia genetrix. It is a potent
  inhibitor of MRSA pyruvate kinase and exhibits antibacterial properties.
