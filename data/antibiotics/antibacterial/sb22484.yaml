definition: SB22484 antibiotics are of the same chemical group as kirromycins. SB22484
  antibiotics are produced by Streptomyces sp. NRRL 15496. There are two SB22484 isomers
  with the same UV absorption spectra, but differing molecular masses. These antibiotics
  are strongly active against Neisseria species, but also show activity against Streptococci,
  and Haemophilus influenzae.
