mode_of_action_notes: 'CURATOR: PMID:21094257 measured 150 nM inhibition of wild-type
  Escherichia coli enoyl-acyl carrier protein reductase (FabI) and resolved triclosan-NAD+
  complexes of G93A, G93S, and highly resistant G93V enzymes. These data support inhibition
  of bacterial type-II fatty-acid/envelope synthesis, replacing the seed''s unsupported
  folate-pathway assignment; the structures are mutant, not wild-type, complexes.'
