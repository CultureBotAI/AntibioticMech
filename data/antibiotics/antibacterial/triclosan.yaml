definition: An aromatic ether that is phenol which is substituted at C-5 by a chloro
  group and at C-2 by a 2,4-dichlorophenoxy group. It is widely used as a preservative
  and antimicrobial agent in personal care products such as soaps, skin creams, toothpaste
  and deodorants as well as in household items such as plastic chopping boards, sports
  equipment and shoes.
