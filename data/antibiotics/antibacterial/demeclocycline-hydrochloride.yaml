identifier: CHEBI:59725
label: demeclocycline hydrochloride
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: The hydrochloride salt of demeclocycline. A tetracycline antibiotic, it
  is used (mainly as the hydrochloride) for the treatment of Lyme disease, acne and
  bronchitis, as well as for hyponatraemia (low blood sodium concentration) due to
  the syndrome of inappropriate antidiuretic hormone (SIADH) where fluid restriction
  alone has been ineffective.
