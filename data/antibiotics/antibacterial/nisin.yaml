definition: A type-A lantibiotic containing 34 amino acid residues (including lanthionine
  (Lan), methyllanthionine (MeLan), didehydroalanine (Dha) and didehydroaminobutyric
  acid (Dhb)) and five thioether bridges. It is obtained by fermentation of the bacterium
  Lactococcus lactis and shows particular activity against Clostridium botulinum.
  It is used in the production of various processed foods to suppress Gram-positive
  spoilage and pathogenic bacteria and so extend shelf life.
