definition: Iboxamycin is a fully synthetic lincosamide antibiotic. Like other lincosamides,
  it selectively targets the bacterial ribosome and prevents elongation of the peptide
  chain. Iboxamycin has been shown to be effective against bacterial strains otherwise
  resistant to licosamide antibiotics.
