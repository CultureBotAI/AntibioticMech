definition: Klebsazolicin is a peptide antibiotic encoded by and identified from the
  genome of Klebsiella pneumoniae. Klebsazolicin is a ribosomally synthesized and
  post-translationally modified peptide with antibiotic activity against gram-negative
  bacteria. Klebsazolicin inhibits ribosomal protein synthesis through binding and
  thus blocking peptide access.
