definition: An erythromycin derivative that is erythromycin A in which the hydrogen
  attached to the carbon at position 8 (α to the ketone carbonyl group) has been replaced
  by a fluorine. It has been used (generally as the corresponding monoethyl succinate
  ester) as an antibacterial drug.
