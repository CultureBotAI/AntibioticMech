  evidence:
  - reference: DOI:10.1126/science.adk8013
    snippet: On the basis of structural analyses of bacterial ribosomes bound to diverse
      antibiotics, we designed a conformationally restricted molecule, which we name
      cresomycin (CRM), that adopts the exact conformation required for ribosomal
      binding. CRM exhibits potent in vitro and in vivo efficacy against both Gram-positive
      and Gram-negative bacteria, including multidrug-resistant strains of Staphylococcus
      aureus, Escherichia coli, and Pseudomonas aeruginosa.
    notes: Reported by Wu et al. 2024 (Science 383:721-726; PMID:38359125) as a conformationally
      preorganized bridged macrobicyclic oxepanoprolinamide antibiotic targeting the
      bacterial 50S ribosomal subunit peptidyl transferase center, exhibiting MICs
      of <=0.06-0.25 ug/mL against multidrug-resistant Staphylococcus aureus (including
      cfr- and erm-positive strains), 1-2 ug/mL against Escherichia coli, and in vivo
      murine septicemia and thigh-infection efficacy.
