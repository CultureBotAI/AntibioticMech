identifier: CHEBI:5280
label: gatifloxacin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A monocarboxylic acid that is 4-oxo-1,4-dihydroquinoline-3-carboxylic
  acid which is substituted on the nitrogen by a cyclopropyl group and at positions
  6, 7, and 8 by fluoro, 3-methylpiperazin-1-yl, and methoxy groups, respectively.
  Gatifloxacin is an antibiotic of the fourth-generation fluoroquinolone family, that
  like other members of that family, inhibits the bacterial topoisomerase type-II
  enzymes.
