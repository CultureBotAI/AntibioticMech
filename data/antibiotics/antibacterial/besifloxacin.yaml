  evidence:
  - reference: DOI:10.1128/AAC.00418-09
    snippet: Haas et al. evaluated the in vitro antibacterial activity of the novel
      8-chloro-fluoroquinolone besifloxacin against 2,690 ocular clinical isolates
      and reported MIC90 values of 0.06 ug/mL against methicillin-susceptible Staphylococcus
      aureus, 1 ug/mL against methicillin-resistant Staphylococcus aureus, 0.06 ug/mL
      against Streptococcus pneumoniae, and 0.03 ug/mL against Haemophilus influenzae.
    notes: Reported by Haas et al. 2009 (Antimicrob Agents Chemother 53:3552-3560;
      PMID:19506065) and Cambau et al. 2009 (J Antimicrob Chemother 63:443-450; DOI:10.1093/jac/dkn528)
      as an 8-chloro-fluoroquinolone antibacterial (BOL-303224-A) with balanced inhibition
      of bacterial DNA gyrase and topoisomerase IV. PubChem CID 10178705 and ChEBI
      CHEBI:135622 supply the standard InChI, InChIKey, formula, and isomeric SMILES
      for besifloxacin.
