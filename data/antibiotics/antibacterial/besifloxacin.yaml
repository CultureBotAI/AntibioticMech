  title: Besifloxacin inhibits bacterial DNA gyrase and topoisomerase IV with balanced
    dual-target potency to block DNA replication
  description: Besifloxacin (BOL-303224-A), an 8-chloro-fluoroquinolone, potently
    and equipotently inhibits both bacterial DNA gyrase (GyrA/GyrB) DNA supercoiling
    and topoisomerase IV (ParC/ParE) decatenation in Gram-positive and Gram-negative
    pathogens, blocking bacterial DNA replication.
