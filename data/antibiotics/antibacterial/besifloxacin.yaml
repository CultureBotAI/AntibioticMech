    snippet: Besifloxacin is a novel chiral fluoroquinolone with potent activity against
      Gram-positive and Gram-negative ocular pathogens through balanced inhibition
      of bacterial DNA gyrase and topoisomerase IV.
    notes: Cambau et al. 2009 (PMID:19451292) measured purified S. pneumoniae and
