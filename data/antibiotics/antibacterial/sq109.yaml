  evidence:
  - reference: DOI:10.1128/AAC.05708-11
    snippet: Tahlan et al. demonstrated that the 1,2-ethylenediamine antitubercular
      clinical candidate SQ109 inhibits Mycobacterium tuberculosis H37Rv growth at
      an MIC of 0.39 to 0.78 ug/mL (1.2 to 2.4 uM) and blocks trehalose monomycolate
      export by targeting the inner-membrane transporter MmpL3 (Rv0206c), causing
      trehalose monomycolate accumulation and loss of trehalose dimycolate and cell
      wall mycolates.
    notes: Reported by Tahlan et al. 2012 (Antimicrob Agents Chemother 56:1797-1809;
      PMID:22252828) and Protopopova et al. 2005 (J Antimicrob Chemother 56:968-974;
      DOI:10.1093/jac/dki319) as an N-geranyl-N'-(2-adamantyl)ethane-1,2-diamine antimycobacterial
      agent targeting MmpL3 and proton-motive-force bioenergetics. PubChem CID 5274428
      supplies the neutral parent standard InChI, InChIKey, formula, and isomeric
      SMILES for SQ109.
