definition: A triterpenoid saponin that is maslinic acid attached to a β-D-glucopyranosyl
  residue at position 3 and a α-L-rhamnopyranosyl-(1→2)-β-D-glucopyranosyl residue
  at position 28 via a glycosidic linkage. Isolated from the methanolic extract of
  the leaves of Symplocos lancifolia, it exhibits antibacterial activity.
