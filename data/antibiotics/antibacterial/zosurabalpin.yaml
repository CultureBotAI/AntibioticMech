definition: Zosurabalpin is a macrocyclic peptide (MCP) antibiotic with potent antibacterial
  activity against Carbapenem-resistant Acinetobacter baumannii. The mechanism of
  action involves blocking the transport of bacterial lipopolysaccharide from the
  inner membrane to its destination on the outer membrane, through inhibition of the
  LptB2FGC complex.
