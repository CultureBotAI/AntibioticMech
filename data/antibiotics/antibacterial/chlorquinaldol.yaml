definition: A monohydroxyquinoline that is quinolin-8-ol which is substituted by a
  methyl group at position 2 and by chlorine at positions 5 and 7. An antifungal and
  antibacterial, it was formerly used for topical treatment of skin conditions and
  vaginal infections.
