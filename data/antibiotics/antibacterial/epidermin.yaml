definition: A type A lantibiotic that is a tetracyclic 21-amino-acid peptide which
  contains meso-lanthionine, 3-methyllanthionine, and S-(2-aminovinyl)-D-cysteine.
  It is obtained from Staphylococcus epidermidis Tü 3298 and exhibits antibiotic activity
  against many Gram-positive bacteria.
