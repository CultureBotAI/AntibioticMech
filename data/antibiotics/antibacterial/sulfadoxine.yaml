biosynthesis_origin: SYNTHETIC
mode_of_action: FOLATE_PATHWAY_INHIBITION
mode_of_action_notes: 'CURATOR: Synthetic para-aminobenzenesulfonamide antimicrobial
  (sulfadoxine) that acts as a competitive structural analog of para-aminobenzoic
  acid (PABA) at the active site of bacterial dihydropteroate synthase (FolP / DHPS,
  EC 2.5.1.15), forming dead-end pterin-sulfa adducts and blocking de novo dihydropteroate
  and tetrahydrofolate biosynthesis (Roland et al. 1979, DOI:10.1128/AAC.15.2.195,
  PMID:378102; Yun et al. 2012, DOI:10.1126/science.1214641, PMID:22383845).'
mode_of_action_target_scope: MICROBIAL_TARGET
causal_graphs:
- graph_id: sulfadoxine_dhps_paba_competitive_folate_inhibition
  title: Sulfadoxine competitively inhibits bacterial dihydropteroate synthase (DHPS)
    to block de novo folate biosynthesis
  description: Sulfadoxine (4-amino-N-(5,6-dimethoxypyrimidin-4-yl)benzenesulfonamide),
    a synthetic folate-pathway antimicrobial, acts as a para-aminobenzoate (pABA)
    competitive substrate analog at dihydropteroate synthase (DHPS / FolP), forming
    a dead-end pterin-sulfa adduct with 6-hydroxymethyl-7,8-dihydropterin pyrophosphate
    (DHPPP) and blocking de novo folate biosynthesis.
  scope_status: MECHANISTIC
