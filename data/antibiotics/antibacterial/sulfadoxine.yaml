definition: A sulfonamide consisting of pyrimidine having methoxy substituents at
  the 5- and 6-positions and a 4-aminobenzenesulfonamido group at the 4-position.
  In combination with the antiprotozoal pyrimethamine (CHEBI:8673) it is used as an
  antimalarial.
