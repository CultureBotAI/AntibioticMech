identifier: CHEBI:59343
label: cefditoren
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A broad spectrum, third-generation cephalosporin antibiotic with (Z)-2-(4-methyl-1,3-thiazol-5-yl)ethenyl
  and (2Z)-2-(2-amino-1,3-thiazol-4-yl)-2-(methoxyimino)acetamido groups at positions
  3 and 7, respectively, of the cephem skeleton. Generally administered as its orally
  absorbed pivaloyloxymethyl ester prodrug, it is used for the treatment of mild to
  moderate infections caused by susceptible strains of microorganisms in acute bacterial
  exacerbation of chronic bronchitis, community-acquired pneumonia, pharyngitis/tonsillitis,
  and uncomplicated skin and skin-structure infections.
