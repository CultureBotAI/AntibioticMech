definition: A hydroxylamine that is N-hydroxyquinolin-4-one in which the hydrogen
  at position 2 has been replaced by a (1E)-non-1-en-1-yl group. It is the most active
  agent produced by Pseudomonas aeruginosa that modulates the growth and virulence
  of Staphylococcus aureus; the corresponding Z isomer is inactive.
