definition: A member of the class of thiadiazinanes that is 1,2,4-thiadiazinane 1,1-dioxide
  substituted by a (1,1-dioxido-1,2,4-thiadiazinan-4-yl)methyl group at position 4.
  It is a broad-spectrum antiseptic used as lock therapy solution in patients with
  long term central venous catheters for the prevention of catheter related bloodstream
  infections.
