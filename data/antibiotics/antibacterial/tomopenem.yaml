  evidence:
  - reference: DOI:10.1128/AAC.49.8.3239-3250.2005
    snippet: Koga et al. evaluated the novel parenteral 1-beta-methylcarbapenem CS-023
      (RO4908463, tomopenem) against Gram-positive and Gram-negative clinical isolates
      and reported MIC90 values of 4 ug/mL against methicillin-resistant Staphylococcus
      aureus, 0.25 ug/mL against penicillin-resistant Streptococcus pneumoniae, <=0.06
      ug/mL against Escherichia coli and Klebsiella pneumoniae, and 2 ug/mL against
      Pseudomonas aeruginosa.
    notes: Reported by Koga et al. 2005 (Antimicrob Agents Chemother 49:3239-3250;
      PMID:16048932) as a 2-guanidinylacetylamino-pyrrolidinylthio 1-beta-methylcarbapenem
      antibiotic (CS-023, RO4908463) that binds penicillin-binding proteins including
      PBP2a of MRSA and PBPs of Pseudomonas aeruginosa. PubChem CID 9809656 supplies
      the standard InChI, InChIKey, formula, and isomeric SMILES for tomopenem.
