  - reference: DOI:10.1128/AAC.49.8.3239-3250.2005
    snippet: Koga et al. reported that CS-023 (R-115685, tomopenem) exhibited potent
      antibacterial activity against methicillin-resistant Staphylococcus aureus and
      Pseudomonas aeruginosa through high-affinity binding to bacterial penicillin-binding
      proteins, including PBP2a in MRSA.
    notes: Koga et al. 2005 (PMID:16048932) and Koga et al. 2008 (PMID:18070969) demonstrated
      high-affinity binding of CS-023 (tomopenem) to MRSA PBP2a and P. aeruginosa
      PBPs, inhibiting bacterial peptidoglycan cross-linking.
