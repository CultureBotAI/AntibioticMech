definition: A chromenol that is a derivative of filicinic acid and is isolated from
  the stems and leaves of Hypericum drummondii. It has been found to exhibit antibacterial
  activity against Gram-positive bacteria Staphylococcus aureus and Bacillus subtilis
  and the acid fast bacterium Mycobacterium smegmatis.
