biosynthesis_origin: SYNTHETIC
mode_of_action: FOLATE_PATHWAY_INHIBITION
mode_of_action_notes: 'CURATOR: Synthetic 2,4-diaminopyrimidine antimicrobial (tetroxoprim)
  that selectively inhibits bacterial dihydrofolate reductase (FolA / DHFR, EC 1.5.1.3),
  blocking reduction of 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate and arresting
  folate-dependent thymidylate and purine biosynthesis (Then & Keller 1979, PMID:391962;
  Baccanari et al. 1982, PMID:6752145; Hawser et al. 2006, DOI:10.1016/j.bcp.2005.10.052,
  PMID:16359642).'
mode_of_action_target_scope: MICROBIAL_TARGET
causal_graphs:
- graph_id: tetroxoprim_dhfr_tetrahydrofolate_biosynthesis_inhibition
  title: Tetroxoprim selectively inhibits bacterial dihydrofolate reductase (DHFR)
    to block tetrahydrofolate and nucleotide biosynthesis
  description: Tetroxoprim (5-[3,5-dimethoxy-4-(2-methoxyethoxy)benzyl]pyrimidine-2,4-diamine),
    a synthetic 2,4-diaminopyrimidine antibacterial, selectively binds and inhibits
    bacterial dihydrofolate reductase (DHFR / FolA), blocking NADPH-dependent reduction
    of 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate and arresting folate-dependent
    thymidylate and purine biosynthesis.
