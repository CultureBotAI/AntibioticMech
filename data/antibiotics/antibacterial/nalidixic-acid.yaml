causal_graphs:
- graph_id: nalidixic_acid_gyrase_cleavage_complex
  title: Nalidixic acid poisons bacterial DNA gyrase
  description: Nalidixic acid acts on the GyrA-containing bacterial DNA gyrase complex,
    trapping a protein-linked DNA cleavage state that blocks completion of DNA topology-changing
    reactions.
  scope_status: MECHANISTIC
  nodes:
  - node_id: nalidixic_acid
    label: nalidixic acid
    node_type: COMPOUND
    grounding: CHEBI:100147
  - node_id: dna_gyrase
    label: bacterial DNA gyrase
    node_type: GENE_OR_PROTEIN
    grounding: ARO:3000733
    grounding_notes: Grounded through CARD's fluoroquinolone-sensitive GyrA target;
      GyrA is the NalA protein genetically and biochemically linked to nalidixic acid
      sensitivity.
    gene_symbols:
    - gyrA
  - node_id: gyrase_dna_cleavage_complex
    label: DNA gyrase covalent DNA cleavage complex
    node_type: STATE
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Protein-linked DNA break stabilized by nalidixic acid; kept label-only
      because the state is drug-bound and catalytic-step specific.
  - node_id: dna_religation
    label: DNA gyrase DNA religation
    node_type: MOLECULAR_FUNCTION
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Gyrase resealing step blocked when quinolone-stabilized cleavage
      complexes persist.
  - node_id: dna_topology_control
    label: bacterial DNA topology control
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Covers DNA gyrase-dependent supercoiling and relaxation reactions
      needed to control bacterial chromosome topology.
  edges:
  - subject: nalidixic_acid
    predicate: stabilizes
    object: gyrase_dna_cleavage_complex
    description: Nalidixic acid induces formation of a DNA gyrase relaxation-complex
      analogue that yields protein-linked DNA breaks after detergent treatment.
    evidence:
    - reference: PMID:200930
      notes: Sugino and colleagues showed nalidixic and oxolinic acids inhibit E.
        coli DNA gyrase and induce a relaxation-complex analogue.
  - subject: dna_gyrase
    predicate: participates in
    object: gyrase_dna_cleavage_complex
    description: The GyrA-containing DNA gyrase complex forms the nalidixic acid-sensitive
      cleavage state.
    evidence:
    - reference: PMID:200930
      notes: Purified NalA/GyrA restored nalidixic acid sensitivity to DNA gyrase
        activity in biochemical assays.
  - subject: gyrase_dna_cleavage_complex
    predicate: inhibits
    object: dna_religation
    description: Stabilized DNA gyrase cleavage complexes are trapped before the broken
      DNA is resealed.
    evidence:
    - reference: PMID:200930
      notes: Nalidixic acid-induced gyrase complexes generated covalently protein-linked
        linear DNA after detergent treatment.
  - subject: dna_religation
    predicate: supports
    object: dna_topology_control
    description: Gyrase-mediated nicking, closing, and strand passage are required
      to finish bacterial DNA supercoiling and relaxation reactions.
    evidence:
    - reference: PMID:200930
      notes: The nalidixic acid-sensitive NalA/GyrA protein participated in DNA gyrase
        supertwisting and ATP-independent DNA relaxation.
