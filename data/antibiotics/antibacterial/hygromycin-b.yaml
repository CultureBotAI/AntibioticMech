definition: Hygromycin B is an aminoglycoside antibiotic used to treat different types
  of bacterial infections. Hygromycin B works by binding to the bacterial 30S ribosomal
  subunit, causing misreading of mRNA and leaving the bacterium unable to synthesize
  proteins vital to its growth. Hygromycin B has also been shown to interact with
  eukaryotic cells.
