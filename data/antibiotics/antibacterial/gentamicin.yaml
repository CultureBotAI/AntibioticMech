definition: Gentamicin is a commonly used aminoglycoside antibiotic derived from members
  of the Micromonospora genus of bacteria. It acts by binding the 30S ribosomal subunit,
  thus inhibiting protein synthesis. Gentamicin is typically used to treat Gram-negative
  infections of the repiratory and urinary tract, as well as infections of the bone
  and soft tissue. It also exhibits considerable nephrotoxicity and ototoxicity. Gentamicin
  is administered as a mixture of gentamicin type C (which makes about around 80%
  of the complex) and types A, B, and X (distributed in the remaining 20% of the complex).
