definition: An organic heterohexacyclic compound that is 12,13-dihydro-6H-indolo[2,3-a]pyrrolo[3,4-c]carbazole
  in which the hydrogen at position 5 is substituted by a methoxycarbonyl group. It
  is synthesized by a gene cluster found in environmental DNA and exhibits cytotoxic
  activity against human HCT116 cancer cells and Staphylococcus aureus.
