definition: Chrysomycin A (ChryA) is a benzonaphthopyranone glycoside with rapid bactericidal
  activity that is highly active against S. aureus persisters, robustly eradicates
  biofilms in vitro, and shows a sustainable killing efficacy in vivo. Chrysomycin
  A belongs to the coumarin class of antibiotics which are known to bind gyrase subunit
  B and inhibit the enzyme function.
