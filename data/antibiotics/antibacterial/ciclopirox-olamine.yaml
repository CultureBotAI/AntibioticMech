definition: The ethanolamine salt of ciclopirox. A broad spectrum antigfungal agent,
  it also exhibits antibacterial activity against many Gram-positive and Gram-negative
  bacteria, and has anti-inflammatory properties. It is used a a topical treatment
  of fungal skin and nail infections.
