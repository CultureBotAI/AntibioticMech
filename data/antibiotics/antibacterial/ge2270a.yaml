definition: GE2270A is the model molecule of cyclic thiazolyl peptide elfamycins.
  GE2270A is produced by Planobispora rosea. Biosynthesis of the molecule has been
  shown to originate as a ribosomally synthesized peptide that undergoes significant
  post-translational modification. Clinical use of cyclic thiazolyl peptides is hindered
  by their low water solubility and bioavailability.
