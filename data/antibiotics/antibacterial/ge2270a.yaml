- target_id: GO:0003746
  target_label: bacterial translation elongation factor Tu (EF-Tu)
  target_type: PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: X-ray crystal structures of Escherichia coli EF-Tu-GDP-GE2270A
    at 2.35 A resolution (Heffron & Jurnak 2000, DOI:10.1021/bi9913597, PMID:10625477,
    PDB:1D8T) and Thermus thermophilus EF-Tu-GppNHp-GE2270A at 1.6 A resolution (Parmeggiani
    et al. 2006, DOI:10.1021/bi0525122, PMID:16734421, PDB:2C77) establish that GE2270A
    binds the 3'-aminoacyl-tRNA pocket on domain 2 of EF-Tu and prevents aminoacyl-tRNA
    binding.
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2000-01
  source_retrieved_on: '2026-11-09'
  evidence:
  - reference: PMID:10625477
    notes: Heffron & Jurnak 2000 (Biochemistry 39:37-45; DOI:10.1021/bi9913597) resolved
      the 2.35 A cocrystal structure of Escherichia coli EF-Tu-GDP bound to GE2270A
      (PDB:1D8T), showing steric occlusion of the aminoacyl-tRNA binding cleft on
      domain 2.
  - reference: PMID:16734421
    notes: Parmeggiani et al. 2006 (Biochemistry 45:6846-6857; DOI:10.1021/bi0525122)
      resolved the 1.6 A cocrystal structure of Thermus thermophilus EF-Tu in complex
      with GE2270A (PDB:2C77) and characterized E. coli EF-Tu resistance substitutions.
