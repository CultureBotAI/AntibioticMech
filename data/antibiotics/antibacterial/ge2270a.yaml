mode_of_action_notes: 'CURATOR: 29-membered thiazolyl peptide antibiotic from Planobispora
  rosea that binds domain 2 of bacterial elongation factor Tu (EF-Tu) and sterically
  blocks formation of the aminoacyl-tRNA*EF-Tu*GTP ternary complex required for ribosomal
  translation elongation (Heffron & Jurnak 2000, DOI:10.1021/bi9913597, PMID:10625477;
  Parmeggiani et al. 2006, DOI:10.1021/bi0525122, PMID:16734421, PDB:2C77).'
