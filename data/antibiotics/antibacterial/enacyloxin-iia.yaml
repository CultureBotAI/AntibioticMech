identifier: antibioticmech:aro-9fd72752cb
label: enacyloxin IIa
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: MINTED
definition: Enacyloxin IIa is structurally distinct but acts in a similar mechanism
  to kirromycin-like elfamycins. It prohibits the transfer of the amino acid at the
  A site to the elongating peptide chain. It is most likely that the mechanism of
  action is that EF-Tu*GDP is locked in the EF-Tu*GTP form, and EF-Tu*GDP*aa-tRNA
  is immobilized on the ribosome. It is an open question whether enacyloxin IIa actually
  belongs to the kirromycin-like group of elfamycins due to their high similarity.
