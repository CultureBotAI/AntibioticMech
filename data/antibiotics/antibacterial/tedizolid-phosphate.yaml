definition: A phosphate monoester resulting from the formal condensation of equimolar
  amounts of phosphoric acid with the hydroxy group of tedizolid . It is a prodrug
  of tedizolid, used for the treatment of acute bacterial skin infections caused by
  certain susceptible bacteria, including Staphylococcus aureus (including methicillin-resistant
  strains (MRSA) and methicillin-susceptible strains), various Streptococcus species,
  and Enterococcus faecalis.
