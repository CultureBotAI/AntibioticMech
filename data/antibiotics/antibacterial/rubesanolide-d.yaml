definition: An abietane diterpenoid found in the medicinal plant Isodon rubescens
  that is 7α,8β-dihydroxyabiet-13-ene in which the 20-methyl group has undergone formal
  oxidation to the corresponding carboxy group and condensed with the 8-hydroxy group
  to give the corresponding γ-lactone. It has shown inhibitory activity against biofilm
  formation of the dental bacterium Streptococcus mutans.
