mode_of_action: FOLATE_PATHWAY_INHIBITION
mode_of_action_target_scope: MICROBIAL_TARGET
mode_of_action_notes: 'CURATOR: 1,8-Diazaanthraquinone natural-product antibiotic
  of the antifolate/thymidylate-synthase-inhibitor diazaquinomycin family from marine-derived
  Streptomyces sp. F001 and Micromonospora sp. B006 that selectively inhibits Mycobacterium
  tuberculosis H37Rv growth and replication (MIC = 0.04 ug/mL; Mullowney et al. 2015,
  DOI:10.1021/acsinfecdis.5b00005, PMID:25893226; Braesel et al. 2018, DOI:10.1021/acs.jnatprod.8b00394,
  PMID:30110167).'
molecular_targets:
- target_label: mycobacterial folate-dependent thymidylate biosynthesis and replication
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:83332
  taxon_label: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
  experimental_context: Whole-cell Mycobacterium tuberculosis H37Rv growth-inhibition
    and drug-resistant panel profiling of diazaquinomycin H (MABA MIC90 = 0.04 ug/mL;
    LORA MIC90 = 0.07 ug/mL; Mullowney et al. 2015, DOI:10.1021/acsinfecdis.5b00005,
    PMID:25893226; Braesel et al. 2018, DOI:10.1021/acs.jnatprod.8b00394, PMID:30110167).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2015-04
  source_retrieved_on: '2026-11-03'
  evidence:
  - reference: DOI:10.1021/acsinfecdis.5b00005
    snippet: Mullowney et al. isolated the 1,8-diazaanthraquinone antibiotics diazaquinomycins
      H and J from Streptomyces sp. F001 and demonstrated potent, selective antitubercular
      activity against replicating and nonreplicating Mycobacterium tuberculosis H37Rv
      (MIC = 0.04 and 0.07 ug/mL) and monoresistant M. tuberculosis strains.
    notes: Mullowney et al. 2015 (ACS Infect Dis 1:168-174; PMID:25893226) isolated
      diazaquinomycin H and demonstrated nanomolar-to-submicromolar selective growth
      inhibition of Mycobacterium tuberculosis H37Rv (MABA MIC = 0.04 ug/mL) within
      the antifolate/thymidylate-synthase-inhibitor diazaquinomycin scaffold class.
  - reference: DOI:10.1021/acs.jnatprod.8b00394
    notes: Braesel et al. 2018 (J Nat Prod 81:2280-2287; PMID:30110167) identified
      the daq biosynthetic gene cluster for diazaquinomycins H and J in Micromonospora
      sp. B006 and confirmed their selective antitubercular activity.
