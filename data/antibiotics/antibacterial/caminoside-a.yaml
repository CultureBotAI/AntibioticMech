definition: A glycolipid with an unusual non-glycerol aglycone, 10-hydroxynonadecan-2-one
  that is glycosylated at the C10 hydroxy group by a branched tetrasaccharide residue.
  It is isolated from the marine sponge Caminus sphaeroconia and exhibits potent activity
  as an inhibitor of a type III bacterial secretory system.
