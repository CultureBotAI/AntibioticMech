identifier: CHEBI:209807
label: cefoxitin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A semisynthetic cephamycin antibiotic which, in addition to the methoxy
  group at the 7α position, has 2-thienylacetamido and carbamoyloxymethyl side-groups.
  It is resistant to β-lactamase.
