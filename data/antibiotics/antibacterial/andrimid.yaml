mode_of_action_notes: 'CURATOR: Octatrienoyl-beta-phenylalanyl-valyl-methylpyrrolidinedione
  hybrid PKS-NRPS pseudopeptide antibiotic from Pantoea agglomerans that selectively
  inhibits the bacterial multisubunit acetyl-CoA carboxylase carboxyltransferase reaction
  (AccA/AccD, Ki = 5 nM against Escherichia coli ACC) to block malonyl-CoA formation
  and bacterial fatty acid / membrane lipid biosynthesis (Freiberg et al. 2004, DOI:10.1074/jbc.m402989200,
  PMID:15066985; Jin et al. 2006, DOI:10.1021/ja063194c, PMID:16866529).'
