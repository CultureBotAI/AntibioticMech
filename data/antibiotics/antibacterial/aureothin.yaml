definition: A C-nitro compound that is (3Z)-3-[(2E)-2-methyl-3-(4-nitrophenyl)prop-2-en-1-ylidene]tetrahydrofuran
  which is substituted by a 6-methoxy-3,5-dimethyl-4-oxo-4H-pyran-2-yl group at position
  5. It is isolated from the soil bacterium, Streptomyces thioluteus and exhibits
  antitumor, antifungal, and insecticidal activities.
