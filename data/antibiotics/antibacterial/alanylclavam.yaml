mode_of_action_notes: 'CURATOR: Antipodal (3S,5S) beta-lactam clavam amino acid antibiotic
  from Streptomyces clavuligerus that acts as a methionine/homoserine antimetabolite
  in defined minimal media, with growth inhibition reversed by L-methionine, L-homoserine,
  or L-cystathionine supplementation (Pruess & Kellett 1983, DOI:10.7164/antibiotics.36.208,
  PMID:6833138; Jensen et al. 2000, DOI:10.1128/aac.44.3.720-726.2000, PMID:10681345).'
molecular_targets:
- target_label: bacterial methionine and homoserine amino acid biosynthesis
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Antimetabolite growth inhibition of Escherichia coli and Bacillus
    species in minimal medium by the (3S,5S) clavam beta-lactam alanylclavam, specifically
    reversed by supplementation with L-methionine, L-homoserine, or L-cystathionine
    (Pruess and Kellett 1983, DOI:10.7164/antibiotics.36.208, PMID:6833138; Jensen
    et al. 2000, DOI:10.1128/aac.44.3.720-726.2000, PMID:10681345).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2000-03
  source_retrieved_on: '2026-11-09'
  evidence:
  - reference: DOI:10.1128/aac.44.3.720-726.2000
    snippet: Alanylclavam acts as an antimetabolite that inhibits bacterial growth
      in minimal media, with growth inhibition reversed by L-methionine or L-homoserine.
    notes: Jensen et al. 2000 (Antimicrob Agents Chemother 44:720-726; PMID:10681345)
      characterized alanylclavam biosynthesis and methionine/homoserine-reversible
      antibacterial activity.
  - reference: DOI:10.7164/antibiotics.36.208
    notes: Pruess and Kellett 1983 (J Antibiot 36:208-212; PMID:6833138) isolated
      alanylclavam (Ro 22-5417) from Streptomyces clavuligerus and demonstrated that
      antibacterial growth inhibition on minimal medium is reversed by L-methionine,
      L-cystathionine, and L-homoserine.
