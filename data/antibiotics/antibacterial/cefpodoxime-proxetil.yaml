identifier: CHEBI:3505
label: cefpodoxime proxetil
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: The 1-[(isopropoxycarbonyl)oxy]ethyl (proxetil) ester prodrug of cefpodoxime.
  After swallowing, hydrolysis of the ester group occurs in the intestinal epithelium,
  to release active cefpodoxime in the bloodstream. It is used to treat acute otitis
  media, pharyngitis, and sinusitis.
