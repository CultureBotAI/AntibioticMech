definition: A cyclodepsipeptide that is (together with pristinamycin IIA) a component
  of pristinamycin, an oral streptogramin antibiotic produced by Streptomyces pristinaespiralis.
  Pristinamycin exhibits bactericidal activity against Gram positive organisms including
  methicillin-resistant Staphylococcus aureus.
