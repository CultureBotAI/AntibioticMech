definition: A member of the class of mastopyrans that is a 14-amino acid polypeptide
  comprising leucyl, lysyl, leucyl, lysyl, seryl, isoleucyl, valyl, seryl, tryptophyl,
  alanyl, lysyl, lysyl, valyl, and leucinamide residues coupled in sequence. It is
  the major active component of the venom of the hornet Vespa basalis and causes degranulation
  of mast cells. It exhibits antimicrobial activity against both Gram-positive and
  -negative bacteria as well as haemolytic activity on chicken, human and sheep erythrocytes.
