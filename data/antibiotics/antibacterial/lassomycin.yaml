identifier: antibioticmech:aro-41b2842f38
label: lassomycin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: MINTED
definition: A ribosomally synthesized cyclic peptide antibiotic. Lassomycin has been
  shown to be effective against drug-resistant mycobacteria but shows little activity
  against other bacteria. Lassomycin targets and binds to a region of the ClpC1 ATPase
  complex and uncouples ATPase from proteolytic activity, an essential function for
  mycobacterial viability, causing cell death.
