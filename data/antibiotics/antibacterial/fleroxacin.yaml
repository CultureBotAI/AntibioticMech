definition: A fluoroquinolone antibiotic that is 4-oxo-1,4-dihydroquinoline which
  is substituted at positions 1, 3, 6, 7 and 8 by 2-fluoroethyl, carboxy, fluoro,
  4-methylpiperazin-1-yl and fluoro groups, respectively. It is active against many
  Gram-positive and Gram-negative bacteria.
