definition: Phenelfamycin E was isolated from two environmental isolates called AB999F-80
  and AB1047T-33. They were both identified as Streptomyces violaceoniger strains.
  Both these strains were found to produce phenelfamycins A-F and unphenelfamycin.
  Phenelfamycin E has a trisaccaride moeity and is isomeric with phenelfamycin F.
  All phenelfamycins were selected due to their activity against anaerobic bacteria,
  especially Clostridioides difficile. Phenelfamycin E and F are the most potent of
  the phenelfamycins.
