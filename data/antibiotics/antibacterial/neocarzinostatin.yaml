  evidence:
  - reference: DOI:10.1016/j.chembiol.2004.12.013
    snippet: The chromophore of the antitumor antibiotic neocarzinostatin (NCS), produced
      by Streptomyces carzinostaticus, consists of an extremely labile nine-membered
      enediyne core that cleaves DNA and inhibits growth of Gram-positive bacteria
      such as Sarcina lutea and Staphylococcus aureus.
    notes: MIBiG 4.0.1 entry BGC0000112 (Streptomyces carzinostaticus subsp. neocarzinostaticus);
      Liu et al. 2005 (DOI:10.1016/j.chembiol.2004.12.013, PMID:15797213) and Ohtsuki
      & Ishida 1975 (DOI:10.7164/antibiotics.28.229, PMID:123897) characterize the
      enediyne chromophore biosynthesis and potent bactericidal DNA-cleaving activity
      against Sarcina lutea and Gram-positive bacteria. ChEBI CHEBI:29655 and PubChem
      CID 447545 supply the stereo-complete SMILES, Standard InChI, and InChIKey.
