definition: An azaphilone that is 5,6,7,8-tetrahydro-1H-isochromene substituted by
  a hydroxy group and a methyl group at position 7, an oxo group at position 8, a
  prop-1-en-1-yl group at position 3 and a (3,4-dihydroxy-2-methoxy-6-methylbenzoyl)oxy
  group at position 6. Isolated from Penicillium commune, it exhibits antibacterial
  and antineoplastic activities.
