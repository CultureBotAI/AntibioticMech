definition: A cyclopentapyran that is (4aS,7aR)-1,4a,5,6,7,7a-hexahydrocyclopenta[c]pyran
  substituted at position 1 by an oxo group and at positions 4 and 7 by methyl groups,
  respectively (the 4aS,7S,7aR-diastereomer). An iridoid monoterpenoid isolated from
  several Nepeta plant species. It is an aphid sex pheromone and cat attractant, and
  exhibits antibacterial, antifungal, and analgesic properties.
