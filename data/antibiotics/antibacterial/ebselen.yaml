mode_of_action_notes: Assigned from ChEBI role CHEBI:147285 (EC 3.4.22.69 (SARS coronavirus
  main proteinase) inhibitor). ChEBI asserts the role on the compound, but this mechanism
  belongs to an anti-viral activity while the record is filed as ANTIBACTERIAL. Either
  the compound has both activities, or the filing is wrong — the priority table has
  put azole antifungals under ANTIBACTERIAL before now. A curator should decide which.
  The role names a target specific to the microbe or virus — see mode_of_action_target_scope.
  Not a curator's mechanistic review.
