definition: A cephalosporin compound having (1H-1,2,3-triazol-4-ylsulfanyl)methyl
  and [(2R)-2-amino-2-(4-hydroxyphenyl)]acetamido side-groups. An antibacterial drug
  first prepared in the 1970s, it has more recently been found to be an inhibitor
  of eukaryotic elongation factor-2 kinase (eEF2K), which is known to regulate apoptosis,
  autophagy and ER stress in many types of human cancers.
