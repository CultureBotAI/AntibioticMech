definition: Edeine A is a subtype of the peptide antibiotic edeine, composed of beta-tyr,
  beta-ser, diaminopropionic acid, diaminohydroxyazelaic acid, glycine, and spermidine.
  Edeine A is a mixture of edeine A1 and its inactive isomer, edeine A2. Edeines bind
  to the 30S subunit to block fMet-tRNA interaction at the P site, inhibiting protein
  synthesis and subsequent structure/function processes critical for life or replication.
