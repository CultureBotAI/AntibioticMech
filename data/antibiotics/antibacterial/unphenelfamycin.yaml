definition: Unphenelfamycin was isolated from two environmental isolates called AB999F-80
  and AB1047T-33. They were both identified as Streptomyces violaceoniger strains.
  Both these strains were found to produce phenelfamycins A-F and unphenelfamycin.
  Unphenelfamycin has a monosaccaride moeity and lacks the phenacetyl moeity present
  in the other phenelfamycins. All phenelfamycins were selected due to their activity
  against anaerobic bacteria, especially Clostridioides difficile.
