identifier: CHEBI:85264
label: potassium clavulanate
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A potassium salt having clavulanate as the counterion. It acts as a suicide
  inhibitor of bacterial β-lactamase enzymes and has only weak anitbiotic activity
  when administered alone. However it can be used in combination with amoxicillin
  trihydrate (under the trade name Augmentin) for treatment of a variety of bacterial
  infections, where it prevents antibiotic inactivation by microbial lactamases.
