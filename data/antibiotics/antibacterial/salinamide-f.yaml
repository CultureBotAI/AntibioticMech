  - reference: DOI:10.1002/anie.201508576
    snippet: Ray et al. characterized the salinamide biosynthetic gene cluster in
      marine Streptomyces sp. CNB-091 producing the diol bicyclic depsipeptide congener
      salinamide F, which inhibits bacterial RNA polymerase and growth of Enterococcus
      faecalis, Staphylococcus aureus, and Neisseria gonorrhoeae.
    notes: 'Reported by Ray et al. 2016 (Angew Chem Int Ed Engl 55:364-367; PMID:26553755;
      DOI:10.1002/anie.201508576) and Hassan et al. 2015 (J Nat Prod 78:96-100; PMID:25607994;
      DOI:10.1021/np500887p) as a diol bicyclic depsipeptide antibiotic from marine
      Streptomyces sp. CNB-091 that inhibits Escherichia coli and Staphylococcus aureus
      RNA polymerase and exhibits antibacterial activity (MIC 12.5-25 ug/mL against
      Enterococcus faecalis, Staphylococcus aureus, and Neisseria gonorrhoeae). MIBiG
      4.0.1 entry BGC0001230 and PubChem CID 90206850 supply the stereo-complete SMILES,
      Standard InChI, and InChIKey QDRISVFLDJIQNB-UMPSVNBLSA-N (note: ChEBI CHEBI:222899
      Salinamide F carries diastereomeric InChIKey QDRISVFLDJIQNB-CHKOLDIQSA-N and
      is omitted from xrefs).'
