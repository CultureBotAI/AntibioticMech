definition: A homodetic cyclic peptide found in several Streptomyces species, consisting
  of 3-hydroxyasparagine, L-ornithine, L-isoleucine, D-leucine, D-valine and 5-chloro-L-tryptophan
  joined in sequence in a cyclic arrangement by peptide linkages. It exhibits antibacterial
  properties.
