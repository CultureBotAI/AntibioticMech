definition: An organic heterotricyclic compound and tetramic acid derivative originally
  isolated from an unidentified oligosporic actinomycete strain (no. E864-861) and
  found to be active against both Gram-positive and Gram-negative anaerobic bacteria
  as well as some aerobic bacteria such as Streptococci. The methyl ester of nocamycin
