definition: A member of the class of oxazolidines that is 1,3-oxazolidin-2-one in
  which the hydrogen attached to the nitrogen is replaced by an N-{[(5-nitro-2-furyl)methylene]amino}
  group. It has antibacterial and antiprotozoal properties, and is used in the treatment
  of giardiasis and cholera.
