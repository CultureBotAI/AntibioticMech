causal_graphs:
- graph_id: sulfamethoxazole_dhps_paba_competitive_folate_inhibition
  title: Sulfamethoxazole competitively inhibits bacterial dihydropteroate synthase
    (DHPS) to block de novo folate biosynthesis
  description: Sulfamethoxazole (4-amino-N-(5-methylisoxazol-3-yl)benzenesulfonamide),
    a synthetic sulfonamide antimicrobial, acts as a para-aminobenzoate (pABA) competitive
    substrate analog at dihydropteroate synthase (DHPS / FolP), forming a dead-end
    pterin-sulfa adduct with 6-hydroxymethyl-7,8-dihydropterin pyrophosphate (DHPPP)
    and blocking de novo folate biosynthesis.
  scope_status: MECHANISTIC
