resistance_mechanisms:
- mechanism_type: OTHER
  label: SbmA alterations reduce PR-39 susceptibility
  gene_families:
  - sbmA
  note: Salmonella enterica serovar Typhimurium mutants with SbmA alterations were
    about fourfold less susceptible and showed slower killing without an obvious measured
    fitness cost. The study called SbmA a putative transport protein but did not directly
    measure uptake, so the specific resistance route remains unresolved.
  evidence:
  - reference: PMID:18519732
    notes: Primary PR-39 resistance selection, genetic analysis, and fitness study.
