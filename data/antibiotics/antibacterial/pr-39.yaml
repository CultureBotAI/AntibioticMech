- target_label: SbmA peptide transporter
  target_type: PROTEIN
  target_relation: SUSCEPTIBILITY_DETERMINANT
  experimental_context: Independent Salmonella mutants with altered SbmA were about
    fourfold less susceptible and killed more slowly. This establishes a genetic susceptibility
    determinant, but the study did not directly measure peptide uptake or identify
    SbmA as the lethal binding target.
  evidence_status: PRIMARY_EVIDENCE
