mode_of_action: MEMBRANE_DISRUPTION
mode_of_action_notes: 'CURATOR: PMID:24755622 found that mature PR-39 caused ATP leakage
  and loss of membrane potential in Bacillus globigii and Escherichia coli. PMID:18519732
  showed killing of Salmonella without overt cell lysis and identified SbmA loss-of-function
  mutations that reduced susceptibility. Together these data support membrane permeabilization/depolarization
  with SbmA-linked susceptibility, not universal gross lysis or directly measured
  SbmA-dependent uptake.'
