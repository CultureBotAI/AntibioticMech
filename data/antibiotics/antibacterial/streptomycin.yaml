causal_graphs:
- graph_id: streptomycin_30s_decoding_site_misreading
  title: Streptomycin perturbs the bacterial 30S decoding site
  description: Streptomycin binds the bacterial 30S ribosomal decoding site formed
    by 16S rRNA and ribosomal protein S12, distorts 16S rRNA helix 44, and lowers
    translational decoding accuracy.
  scope_status: MECHANISTIC
  nodes:
  - node_id: streptomycin
    label: streptomycin
    node_type: COMPOUND
    grounding: CHEBI:17076
  - node_id: rrna_16s
    label: bacterial 16S rRNA
    node_type: RNA
    grounding: ARO:3000755
  - node_id: ribosomal_protein_s12
    label: ribosomal protein S12
    node_type: GENE_OR_PROTEIN
    grounding: ARO:3003431
    gene_symbols:
    - rpsL
  - node_id: streptomycin_30s_binding_site
    label: streptomycin binding site in the 30S ribosomal subunit
    node_type: STATE
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Local 30S site composed of 16S rRNA helices and nearby S12 residues;
      kept label-only to avoid overgrounding a drug-bound subsite.
  - node_id: distorted_decoding_site
    label: streptomycin-distorted decoding site
    node_type: STATE
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Streptomycin-induced local conformation in the 16S rRNA decoding
      site.
  - node_id: decoding_accuracy
    label: bacterial translational decoding accuracy
    node_type: QUALITY
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Fidelity of codon recognition by aminoacyl-tRNA in the bacterial
      A site.
  - node_id: protein_synthesis
    label: bacterial protein synthesis
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Bacterial translation as the downstream process disrupted by
      streptomycin-induced decoding errors.
  edges:
  - subject: rrna_16s
    predicate: participates in
    object: streptomycin_30s_binding_site
    description: 16S rRNA forms the main RNA scaffold of the streptomycin binding
      pocket in the 30S ribosomal subunit.
    evidence:
    - reference: PMID:24820088
      notes: Demirci and colleagues resolved streptomycin-bound Thermus thermophilus
        30S subunits and described 16S rRNA contacts in the streptomycin site.
  - subject: ribosomal_protein_s12
    predicate: participates in
    object: streptomycin_30s_binding_site
    description: Ribosomal protein S12 sits adjacent to the streptomycin binding site
      and contributes residues linked to streptomycin response.
    evidence:
    - reference: PMID:24820088
      notes: The 16S rRNA resistance-structure study placed S12 next to streptomycin
        in the bacterial 30S subunit.
  - subject: streptomycin
    predicate: binds
    object: streptomycin_30s_binding_site
    description: Streptomycin binds near the codon-recognition site of the bacterial
      30S subunit.
    evidence:
    - reference: PMID:23322043
      notes: Demirci and colleagues used X-ray crystallography to locate streptomycin
        in the Thermus thermophilus 30S decoding region.
  - subject: streptomycin_30s_binding_site
    predicate: promotes
    object: distorted_decoding_site
    description: Streptomycin binding laterally shifts the 16S rRNA decoding site.
    evidence:
    - reference: PMID:23322043
      notes: Streptomycin-bound 30S structures showed local distortion of 16S rRNA
        and bases involved in codon recognition.
  - subject: distorted_decoding_site
    predicate: decreases
    object: decoding_accuracy
    description: The streptomycin-induced decoding-site conformation promotes mRNA
      misreading.
    evidence:
    - reference: PMID:23322043
      notes: Cognate and near-cognate mRNA-tRNA crystal structures explained how streptomycin
        promotes misreading of the genetic code.
  - subject: decoding_accuracy
    predicate: supports
    object: protein_synthesis
    description: Accurate A-site codon recognition is required for faithful bacterial
      protein synthesis.
    evidence:
    - reference: PMID:11340196
      notes: Ogle and colleagues resolved 30S ribosomal subunit complexes that define
        the conserved A-site bases used to recognize cognate tRNA.
