mode_of_action: PROTEIN_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:23322043 resolved streptomycin at the Thermus
  thermophilus 30S decoding center with cognate or near-cognate anticodon-stem-loop
  and mRNA substrates. Streptomycin distorts 16S-rRNA bases including A1492 and A1493,
  destabilizing cognate while stabilizing near-cognate decoding and thereby promoting
  genetic-code misreading.'
mode_of_action_target_scope: MICROBIAL_TARGET
