definition: A member of the class of pterocarpans that is 3,9-dihydroxypterocarpan
  substituted with prenyl groups at positions 4 and 10 (the 6aR,11aR stereoisomer).
  Isolated from Erythrina stricta and Erythrina zeyheri, it exhibits antibacterial,
  antimycobacterial, antiplasmodial and cytotoxic activities.
