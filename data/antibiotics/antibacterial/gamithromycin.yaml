definition: A macrolide antibiotic with formula C40H76N2O12. It is used for the treatment
  of of bovine respiratory disease caused by Mannheimia haemolytica, Pasteurella multocida,
  Histophilus somni and Mycoplasma bovis in beef and non-lactating dairy cattle. The
  compound is also licensed in Europe for the treatment of footrot in sheep caused
  by Dichelobacter nodosus and Fusobacterium nodosus.
