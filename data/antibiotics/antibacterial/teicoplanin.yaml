definition: Teicoplanin is a glycopeptide antibiotic used in the prophylaxis and treatment
  of serious infections caused by Gram-positive bacteria. Teicoplanin has a unique
  acyl-aliphatic chain, and binds to cell wall precursors to inhibit transglycosylation
  and transpeptidation.
