  replicative DNA polymerase IIIC (PolC) by pairing with template dCMP and trapping
  the enzyme-DNA complex in Clostridioides difficile and other Firmicutes (Murray
  et al. 2024, DOI:10.1128/aac.00332-24, PMID:38717162; Xu et al. 2019, DOI:10.1128/AAC.01918-18,
  PMID:30559132).'
