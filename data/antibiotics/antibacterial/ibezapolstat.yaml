  - reference: DOI:10.1128/aac.00332-24
    snippet: Ibezapolstat is a novel DNA polymerase IIIC inhibitor structural class
      under clinical development for the treatment of Clostridioides difficile infection
      (CDI). In the 28 RT027 strains, the MIC50, MIC90, and geometric mean MIC values
      were 2.0, 4.0, and 2.1 ug/mL for ibezapolstat.
    notes: Reported by Murray et al. 2024 (Antimicrob Agents Chemother 68:e0033224;
      PMID:38717162) as a dichlorobenzyl-substituted guanine analogue (ACX-362E) that
      selectively inhibits low-G+C Gram-positive bacterial DNA polymerase IIIC (PolC),
      with MIC50 = 2.0 ug/mL and MIC90 = 4.0 ug/mL against clinical Clostridioides
      difficile isolates.
