definition: Tuberactinomycins are a family of cyclic peptide antibiotics that are
  important in the treatment of tuberculosis. Tuberactinomycins contain nonproteinogenic
  amino acids and inhibit group I self-splicing RNA to disrupt prokaryotic protein
  synthesis.
