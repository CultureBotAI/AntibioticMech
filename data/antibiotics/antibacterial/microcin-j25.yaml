definition: Microcin J25 is a peptide antibiotic that inhibits transcription by bacterial
  RNA polymerase. MccJ25 is produced by Escherichia coli strains that harbor a plasmid-borne
  antibiotic-synthesis and antibiotic-export cassette, consisting of a gene for MccJ25
  precursor (a 58 residue linear peptide), two genes for factors that process MccJ25
  precursor into MccJ25, and one gene for export of MccJ25.
