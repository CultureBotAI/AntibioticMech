definition: Arsinothricin is a natural product synthesized by the rhizosphere bacterium
  Burkholderia gladioli GSRB05 and is a broad-spectrum antibiotic effective against
  human pathogens such as carbapenem-resistant Enterobacter cloacae. It is a non-proteogenic
  amino acid and glutamate mimetic that inhibits bacterial glutamine synthetase.
