definition: Bacitracin is a mixture of related cyclic polypeptides produced by organisms
  of the licheniformis group of Bacillus subtilis var Tracy. Bacitracin interferes
  with the dephosphorylation of the C55-isoprenyl pyrophosphate, a molecule which
  carries the building blocks of the peptidoglycan bacterial cell wall outside of
  the inner membrane.
