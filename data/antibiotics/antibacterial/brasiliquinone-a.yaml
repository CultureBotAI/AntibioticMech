identifier: CHEBI:65516
label: brasiliquinone A
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A carbopolycyclic compound that is (3S)-3-ethyl-6,8-dihydroxy-3,4-dihydrotetraphene-1,7,12(2H)-trione
  substituted at position 8 by a 3-amino-2,3,6-trideoxy-α-L-ribo-hexopyranosyl group.
  It is isolated from the culture broth of Nocardia brasiliensis and exhibits antibacterial
  activity against Gram-positive bacteria. It is also active against the multiple
  drug-resistant P388/ADR tumour cells.
