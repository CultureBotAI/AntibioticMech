mode_of_action_target_scope: MICROBIAL_TARGET
mode_of_action_notes: 'CURATOR: Ansa-macrocyclic quinone methide polyketide antibiotic
  from Streptomyces violaceoruber that perturbs bacterial cell-division septation,
  peptidoglycan/cell-wall homeostasis, and covalent protein/amino-acid adducts via
  its electrophilic para-quinone methide pharmacophore in Gram-positive bacteria including
  MRSA (Funabashi et al. 2000, DOI:10.7164/antibiotics.53.199, PMID:10805582; Elnakady
  et al. 2016, DOI:10.1371/journal.pone.0146165, PMID:26799212).'
