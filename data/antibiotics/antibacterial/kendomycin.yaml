- target_label: bacterial cell division and cell-wall homeostasis
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Proteomic, physiological, and ultrastructural profiling of
    methicillin-resistant Staphylococcus aureus (MRSA) treated with kendomycin, demonstrating
    aberrant septum formation and cell-division/cell-wall stress alongside Gram-positive
    antibacterial susceptibility (Funabashi et al. 2000, DOI:10.7164/antibiotics.53.199,
    PMID:10805582; Elnakady et al. 2016, DOI:10.1371/journal.pone.0146165, PMID:26799212).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2016-01
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.1371/journal.pone.0146165
    snippet: Elnakady et al. investigated the antibacterial mechanism of kendomycin
      in methicillin-resistant Staphylococcus aureus (MRSA), showing disruption of
      septum formation, cell division, and amino-acid/protein homeostasis.
    notes: Elnakady et al. 2016 (PLoS One 11:e0146165; PMID:26799212) characterized
      the antibacterial mode of action of kendomycin in MRSA, demonstrating cell-division
      septation defects and polypharmacological proteome perturbation.
  - reference: DOI:10.7164/antibiotics.53.199
    notes: Funabashi et al. 2000 (J Antibiot 53:199-201; PMID:10805582) isolated kendomycin
      (TAN-2162) from Streptomyces violaceoruber and reported its potent antibacterial
      activity against Gram-positive and Gram-negative bacteria.
