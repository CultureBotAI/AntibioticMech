definition: A hydroxyquinolone that is 3-hydroxyuinolin-2(1H)-one which is substituted
  at position 4 by a phenyl groups. Isolated from the mycelium of several Penicillium
  species, it exhibits strong antibiotic activity against M. tuberculosis and also
  against B. subtilis, S. aureus and S. cerevisiae.
