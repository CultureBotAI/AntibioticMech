definition: An dialkyl phosphate resulting from the formal condensation of the acidic
  hydroxy group of dimethyl hydrogen phosphate with the alcoholic hydroxy group of
  1,2-dibromo-2,2-dichloroethanol. An organophosphate insecticide, it is no longer
  approved for use within the European Union.
