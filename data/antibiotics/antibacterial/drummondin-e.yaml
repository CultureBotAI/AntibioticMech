definition: A member of the class of resorcinols that is a derivative of filicinic
  acid. Isolated from the stems and leaves of Hypericum drummondii, it exhibits antibacterial
  activity against Gram-positive bacteria Staphylococcus aureus and Bacillus subtilis
  and the acid fast bacterium Mycobacterium smegmatis.
