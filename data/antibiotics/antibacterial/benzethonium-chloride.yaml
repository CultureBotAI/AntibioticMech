identifier: CHEBI:31264
label: benzethonium chloride
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A (synthetic) quaternary ammonium salt that is benzyldimethylamine in
  which the nitrogen is quaternised by a 2-{2-[p-(2,4,4-trimethylpentan-2-yl)phenoxy]ethoxy}ethyl
  group, with chloride as the counter-ion. An antiseptic and disinfectant, it is active
  against a broad spectrum of bacteria, fungi, moulds and viruses.
