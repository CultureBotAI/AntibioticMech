causal_graphs:
- graph_id: chloramphenicol_50s_peptidyl_transferase_inhibition
  title: Chloramphenicol blocks the 50S peptidyl-transferase center
  description: Chloramphenicol binds the 23S rRNA peptidyl-transferase center of the
    bacterial large ribosomal subunit and blocks peptide-bond formation by the translation
    elongation complex.
  scope_status: MECHANISTIC
  nodes:
  - node_id: chloramphenicol
    label: chloramphenicol
    node_type: COMPOUND
    grounding: CHEBI:17698
  - node_id: peptidyl_transferase_center_23s_rrna
    label: 23S rRNA peptidyl-transferase center
    node_type: RNA
    grounding: ARO:3000754
  - node_id: chloramphenicol_bound_ptc
    label: chloramphenicol-bound peptidyl-transferase center
    node_type: STATE
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Drug-bound state of the bacterial large-subunit catalytic center.
  - node_id: peptide_bond_formation
    label: ribosomal peptide-bond formation
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Peptidyl-transferase-center catalysis during bacterial translation
      elongation.
  - node_id: protein_synthesis
    label: bacterial protein synthesis
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Bacterial translation as the downstream process blocked by a
      peptidyl-transferase-center inhibitor.
  edges:
  - subject: chloramphenicol
    predicate: binds
    object: chloramphenicol_bound_ptc
    description: Chloramphenicol binds the peptidyl-transferase center in the large
      ribosomal subunit.
    evidence:
    - reference: PMID:12860128
      notes: Hansen and colleagues solved a chloramphenicol-bound large ribosomal
        subunit structure with the drug in a peptidyl-transferase-center crevice.
  - subject: peptidyl_transferase_center_23s_rrna
    predicate: participates in
    object: chloramphenicol_bound_ptc
    description: The 23S rRNA peptidyl-transferase center provides the chloramphenicol
      binding site.
    evidence:
    - reference: PMID:12860128
      notes: The comparative large-subunit structures localized chloramphenicol to
        a ribosomal RNA site adjacent to the catalytic center.
    - reference: PMID:35165455
      notes: Syroegin and colleagues resolved bacterial 70S complexes that place chloramphenicol
        in the catalytic peptidyl-transferase center.
  - subject: chloramphenicol_bound_ptc
    predicate: decreases
    object: peptide_bond_formation
    description: Chloramphenicol occupancy of the peptidyl-transferase center interferes
      with peptide-bond formation.
    evidence:
    - reference: PMID:35165455
      notes: Nascent-chain ribosome structures explained the context-specific blockade
        of peptide-bond formation by peptidyl-transferase-center chloramphenicol.
  - subject: peptide_bond_formation
    predicate: supports
    object: protein_synthesis
    description: Peptide-bond formation drives bacterial translation elongation.
    evidence:
    - reference: PMID:12860128
      notes: The antibiotic-bound ribosome study interpreted chloramphenicol action
        as competitive inhibition of peptide-bond formation in the large subunit.
