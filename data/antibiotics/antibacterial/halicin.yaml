definition: A member of the class of thiadiazoles that is 1,3,4-thiadiazol-2-amine
  which is substituted by a (5-nitro-1,3-thiazol-2-yl)sulfanediyl group at position
  5. It is a <a href="https://en.wikipedia.org/wiki/C-Jun_N-terminal_kinases" target="_blank">c-Jun
  N-terminal kinase</a> inhibitor (IC50 = 0.7uM) and exhibits antibacterial properties.
