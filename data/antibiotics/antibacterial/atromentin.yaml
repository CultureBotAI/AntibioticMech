definition: A member of the class of dihydroxy-1,4-benzoquinones that is 2,5-dihydroxycyclohexa-2,5-diene-1,4-dione
  which is substituted by a 4-hydroxyphenyl group at positions 3 and 6. It is a mushroom
  pigment isolated from several fungi species and acts as a smooth muscle stimulant,
  and exhibits anticoagulant, antibacterial and antineoplastic properties.
