definition: A furopyran and lactone that is (2H-pyran-3(6H)-ylidene)acetic acid which
  is substituted by hydroxy groups at positions 4 an 6 and in which the hydroxy group
  at position 4 has condensed with the carboxy group to give the corresponding bicyclic
  lactone. Also known as neopatulin, it is a mycotoxic substance produced by Aspergillus
  and Penicillium species.
