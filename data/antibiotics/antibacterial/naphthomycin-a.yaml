mode_of_action_target_scope: MICROBIAL_TARGET
mode_of_action_notes: 'CURATOR: Ansamycin antibiotic from Streptomyces collinus that
  inhibits bacterial nucleic acid synthesis and acts as a sulfhydryl-reactive vitamin
  K antagonist in Gram-positive bacteria; cysteine and other sulfhydryl compounds
  reverse growth inhibition by nucleophilic Michael addition to the naphthoquinone
  chromophore (Balerna et al. 1969, DOI:10.1007/BF00409749, PMID:4978971; Okabe et
  al. 1985, DOI:10.7164/antibiotics.38.230, PMID:3997669).'
molecular_targets:
- target_label: bacterial nucleic acid biosynthesis
  target_type: BIOLOGICAL_PROCESS
  target_relation: DOWNSTREAM_AFFECTED_PROCESS
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Gram-positive bacterial growth-inhibition reversal by vitamin
    K and sulfhydryl compounds (cysteine, glutathione) and nucleic acid synthesis
    inhibition assays in Bacillus megaterium and mouse leukemia L5178Y cells (Balerna
    et al. 1969, DOI:10.1007/BF00409749, PMID:4978971; Okabe et al. 1985, DOI:10.7164/antibiotics.38.230,
    PMID:3997669).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 1985-02
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.7164/antibiotics.38.230
    snippet: Okabe et al. demonstrated that naphthomycin A inhibits nucleic acid synthesis
      and that sulfhydryl compounds such as cysteine and dithiothreitol reverse its
      biological activity via nucleophilic addition to the naphthoquinone moiety.
    notes: Okabe et al. 1985 (J Antibiot 38:230-235; PMID:3997669) established that
      naphthomycin A inhibits nucleic acid synthesis and is inactivated by sulfhydryl-group
      nucleophilic addition to its naphthoquinone chromophore.
  - reference: DOI:10.1007/BF00409749
    notes: Balerna et al. 1969 (Arch Mikrobiol 65:303-317; PMID:4978971) isolated
      naphthomycin from Streptomyces collinus and characterized its Gram-positive
      antibacterial activity and competitive antagonism by vitamin K and cysteine.
