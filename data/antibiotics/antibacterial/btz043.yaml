  experimental_context: Whole-genome sequencing of spontaneous BTZ043-resistant Mycobacterium
    tuberculosis and M. smegmatis mutants mapping to DprE1 (Rv3790) Cys387 and covalent
    enzyme inactivation of cell-wall decaprenylphosphoryl-D-arabinose biosynthesis
    (DOI:10.1126/science.1171583; PMID:19299584).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
