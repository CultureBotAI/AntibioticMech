mode_of_action_notes: Benzothiazinone nitro-suicide inhibitor that undergoes DprE1-mediated
  nitroreduction and covalently modifies Cys387 of mycobacterial decaprenylphosphoryl-beta-D-ribose
  2'-epimerase (DprE1), blocking cell-wall arabinan synthesis (DOI:10.1126/science.1171583;
  PMID:19299584).
