  source_retrieved_on: '2026-10-25'
  evidence:
  - reference: DOI:10.1126/science.1171583
    snippet: Makarov et al. discovered 1,3-benzothiazin-4-ones and identified the
      S-enantiomer BTZ043, reporting an MIC of 1 ng/mL (2.3 nM) against Mycobacterium
      tuberculosis H37Rv and 4 ng/mL against Mycobacterium smegmatis, covalent inhibition
      of decaprenylphosphoryl-beta-D-ribose 2'-epimerase (DprE1), and bactericidal
      efficacy across multidrug- and extensively drug-resistant M. tuberculosis clinical
      isolates.
    notes: Makarov et al. 2009 (Science 324:801-804; PMID:19299584) demonstrated that
      BTZ043 targets Mycobacterium tuberculosis H37Rv DprE1 (Rv3790, UniProtKB:P9WJF1),
      where FAD-dependent nitroreduction of BTZ043 to a nitroso intermediate forms
      a covalent adduct with Cys387 and Cys387Ser/Gly substitutions confer >2,500-fold
      resistance.
