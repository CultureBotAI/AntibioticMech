definition: Battacin is a cationic lipopeptide antibiotic produced from a Paenibacillus
  tianmuensis soil isolate. Battacin kills bacteria in vitro and has potent activity
  against Gram-negative bacteria, including multidrug-resistant and extremely drug-resistant
  clinical isolates. The bactericidal kinetics of battacin correlate with the depolarization
  of the cell membrane, suggesting that battacin kills bacteria by disrupting the
  cytoplasmic membrane.
