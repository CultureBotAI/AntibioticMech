  evidence:
  - reference: DOI:10.1093/jac/dkm236
    snippet: Park et al. evaluated the 2-pyridone FabI inhibitor CG400549 (nilofabicin)
      against 209 clinical Staphylococcus aureus isolates (111 MSSA and 98 MRSA) and
      reported an MIC range of 0.06 to 1.0 mg/L with uniform MIC50 and MIC90 values
      of 0.25 mg/L, plus in vivo efficacy in murine systemic S. aureus infections.
    notes: Reported by Park et al. 2007 (J Antimicrob Chemother 60:568-574; PMID:17606483)
      and Bogdanovich et al. 2007 (Antimicrob Agents Chemother 51:4191-4196; DOI:10.1128/AAC.00501-07)
      as a selective 2-pyridone inhibitor (CG400549) of staphylococcal enoyl-acyl
      carrier protein reductase (FabI). PubChem CID 11844916 supplies the standard
      InChI, InChIKey, formula, and SMILES for nilofabicin.
