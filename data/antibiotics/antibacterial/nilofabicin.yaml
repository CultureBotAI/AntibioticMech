  evidence:
  - reference: DOI:10.1093/jac/dkm236
    snippet: Park et al. evaluated the 2-pyridone FabI inhibitor CG400549 (nilofabicin)
      against 209 clinical Staphylococcus aureus isolates (111 MSSA and 98 MRSA) and
      reported an MIC range of 0.06 to 1.0 mg/L with uniform MIC50 and MIC90 values
      of 0.25 mg/L, plus in vivo efficacy in murine systemic S. aureus infections.
    notes: Park et al. 2007 (J Antimicrob Chemother 60:568-574; PMID:17606482) established
      that CG400549 (nilofabicin) selectively targets Staphylococcus aureus enoyl-acyl
      carrier protein reductase FabI (confirmed by fabI overexpression and the Phe204Leu
      resistance substitution); held from reviewed UniProtKB accession assignment
      because the clinical isolate panel does not pin a single reviewed Swiss-Prot
      S. aureus strain proteome between NCTC 8325 (UniProtKB:Q2FZQ3) and MRSA252 (UniProtKB:Q6GI75).
