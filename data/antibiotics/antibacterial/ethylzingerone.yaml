definition: A methyl ketone that is 4-phenylbutan-2-one in which the phenyl ring is
  substituted at positions 3 and 4 by ethoxy and hydroxy groups, respectively. It
  is a preservative with antimicrobial activity and a good safety profile that has
  been approved for use in cosmetics. It is structurally similar to zingerone, a phytochemical
  found in the root of the ginger plant Zingiber officinale.
