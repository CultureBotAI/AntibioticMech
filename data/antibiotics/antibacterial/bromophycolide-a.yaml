definition: A diterpenoid that is a macrolide isolated from the Fijian red alga Callophycus
  serratus. It has been found to exhibit moderate cytotoxicity against several human
  tumour cell lines via specific apotopic cell death. It also displays anti-HIV, antibacterial,
  antifungal and antimalarial activity.
