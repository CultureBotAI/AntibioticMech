      DOI:10.1126/science.1214641).
  edges:
  - subject: sulfamethazine
    predicate: inhibits
    object: dhps_paba_condensation_and_pterin_adduct_diversion
    description: Sulfamethazine competitively inhibits pABA utilization at bacterial
      dihydropteroate synthase (DHPS) and forms an alternate pterin-sulfa adduct.
    evidence:
    - reference: DOI:10.1128/AAC.15.2.195
      notes: Roland et al. 1979 (PMID:378102) quantified purified Escherichia coli
        dihydropteroate synthase inhibition by sulfamethazine and demonstrated its
        incorporation with DHPPP into a dead-end pterin-sulfonamide adduct.
    - reference: DOI:10.1126/science.1214641
      notes: Yun et al. 2012 (PMID:22383845) resolved the structural mechanism of
        sulfonamide binding and pterin-sulfa conjugate formation at the bacterial
        DHPS pABA site.
  - subject: bacterial_dihydropteroate_synthase_folp
