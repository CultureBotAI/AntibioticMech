identifier: antibioticmech:aro-6fbc93a42c
label: nybomycin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: MINTED
definition: A heterocyclic antibiotic that targets mutant gyrA (type II topoisomerase)
  containing an S84L substitution, counteracting acquired quinolone resistance. It
  is effective against quinolone-resistant Gram-positive bacteria including S. aureus
  and E. faecalis. Due to its ability to counteract quinolone resistance by targeting
  the mutant form of the gyrA protein, it is classified as a reverse antibiotic (RA).
