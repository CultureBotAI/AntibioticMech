mode_of_action_notes: Assigned from ChEBI role CHEBI:75282 (ergosterol biosynthesis
  inhibitor), CHEBI:77884 (EC 1.14.13.70 (sterol 14α-demethylase) inhibitor). ChEBI
  asserts the role on the compound, but this mechanism belongs to an anti-fungal activity
  while the record is filed as ANTIBACTERIAL. Either the compound has both activities,
  or the filing is wrong — the priority table has put azole antifungals under ANTIBACTERIAL
  before now. A curator should decide which. The target it names is one the host has
  too, so the mechanism is true but is not evidence of selectivity — see mode_of_action_target_scope.
  Not a curator's mechanistic review.
