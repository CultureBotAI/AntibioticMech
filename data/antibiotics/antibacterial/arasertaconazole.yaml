definition: A 1-{2-[(7-chloro-1-benzothiophen-3-yl)methoxy]-2-(2,4-dichlorophenyl)ethyl}imidazole
  that is the active R-enantiomer of sertaconazole and is used (as its nitrate salt)
  for treatment of vulvovaginal candidiasis. The racemate itself is also used as a
  broad-spectrum antifungal drug.
