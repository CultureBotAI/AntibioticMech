definition: Phenelfamycin H is produced by Streptomyces albospinus strain Acta 3619.
  Phenelfamycin G and H are isomeric and similar to phenelfamycin E and F only with
  the addition of a hydroxyl group at position C-30. Phenelfamycin G and H have a
  narrow antibacterial spectrum with potent activity against Cutibacterium acnes.
