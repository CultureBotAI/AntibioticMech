definition: This chemical compound is produced by the myxobacterium Myxococcus fulvus.
  It is an inhibitor of the mitochondrial cytochrome bc1 complex (coenzyme Q - cytochrome
  c reductase). It is a competitive inhibitor of ubiquinol, and binds at the quinol
  oxidation (Qo) site of the bc1 complex, blocking electron transfer to the Rieske
  iron-sulfur protein.
