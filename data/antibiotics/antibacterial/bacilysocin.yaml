definition: A carboxylic ester resulting from the formal condensation of the carboxylic
  acid group of 12-methyltetradecanoic acide with one of the primary alcoholic hydroxy
  groups of glycerophosphoglycerol. An antibiotic obtained from Bacillus subtilis
  168, it has particular activity against certain fungi. The stereochemistries of
  the hydroxy groups at positions C-2 and C-2' and the methyl group at position C-12
  have not been determined.
