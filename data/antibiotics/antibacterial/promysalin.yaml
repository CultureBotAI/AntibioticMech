definition: A carboxylic ester resulting from the formal condensation of the carboxy
  group of (2S)-1-(2-hydroxybenzoyl)-2,3-dihydro-1H-pyrrole-2-carboxylic acid with
  the hydroxy group of (2R,8R)-2,8-dihydroxytetradecanamide. It is a metabolite isolated
  from Pseudomonas putida, , which resides in the rhizosphere of rice plants. The
  compound selectively inhibits the growth of Pseudomonas aeruginosa at low-micromolar
  concentrations.
