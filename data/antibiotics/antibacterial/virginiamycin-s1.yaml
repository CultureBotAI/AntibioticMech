identifier: CHEBI:46416
label: virginiamycin S1
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cyclodepsipeptide that is N-(3-hydroxypicolinoyl)-L-threonyl-D-α-aminobutyryl-L-prolyl-N-methyl-L-phenylalanyl-4-oxo-L-pipecoloyl-L-2-phenylglycine
  in which the carboxy group of the 2-phenylglycine moiety has undergone formal intramolecular
  condensation with the hydroxy group of the N-(3-hydroxypicolinoyl)-L-threonyl to
  give the corresponding 19-membered ring lactone. It is one of the two major components
  of the antibacterial drug virginiamycin, produced by Streptomyces virginiae, S.
  loidensis, S. mitakaensis, S. pristina-spiralis, S. ostreogriseus, and others.
