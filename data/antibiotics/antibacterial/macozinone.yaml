  evidence:
  - reference: DOI:10.1002/emmm.201303575
    snippet: Here, we synthesized a new series of piperazine-containing benzothiazinones
      (PBTZ) and show that, like BTZ043, the preclinical candidate PBTZ169 binds covalently
      to DprE1. The crystal structure of the DprE1-PBTZ169 complex reveals formation
      of a semimercaptal adduct with Cys387 in the active site and explains the irreversible
      inactivation of the enzyme.
    notes: Reported by Makarov et al. 2014 (EMBO Mol Med 6:372-383; PMID:24500695)
      as a 2-[4-(cyclohexylmethyl)piperazin-1-yl]-8-nitro-6-(trifluoromethyl)-1,3-benzothiazin-4-one
      (PBTZ169) that covalently modifies Cys387 of Mycobacterium tuberculosis decaprenylphosphoryl-beta-D-ribose
      2'-epimerase (DprE1) and inhibits M. tuberculosis H37Rv growth at MIC <= 0.19
      ng/mL (0.4 nM).
