identifier: CHEBI:32066
label: prothionamide
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: Prothionamide is a thioamide derivative with antibacterial properties.
  It increases cell wall permeability and decreases cell wall damage resistance by
  inhibition of mycolic acid synthesis, resulting in cell death. It is particularly
  used to treat M. tuberculosis and M. leprae infections.
