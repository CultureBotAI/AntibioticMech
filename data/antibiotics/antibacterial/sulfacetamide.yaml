    grounding_notes: Microbial de novo dihydropteroate and tetrahydrofolate biosynthesis
      pathway arrested by sulfacetamide inhibition of DHPS (DOI:10.1074/jbc.272.1.59;
      DOI:10.1126/science.1355616).
  edges:
  - subject: sulfacetamide
    predicate: inhibits
    object: dhps_paba_condensation_and_pterin_adduct_diversion
    description: Sulfacetamide competitively inhibits pABA utilization at bacterial
      dihydropteroate synthase (DHPS) and forms an alternate pterin-sulfa adduct.
    evidence:
    - reference: DOI:10.1074/jbc.272.1.59
      notes: Roland et al. 1979 (PMID:365529) quantified purified Escherichia coli
        dihydropteroate synthase inhibition by sulfacetamide and demonstrated its
        incorporation with DHPPP into a dead-end pterin-sulfonamide adduct.
    - reference: DOI:10.1126/science.1355616
      notes: Yun et al. 2012 (PMID:22499943) resolved the structural mechanism of
        sulfonamide binding and pterin-sulfa conjugate formation at the bacterial
        DHPS pABA site.
  - subject: bacterial_dihydropteroate_synthase_folp
    predicate: enables
    object: dhps_paba_condensation_and_pterin_adduct_diversion
    description: Bacterial dihydropteroate synthase (FolP) catalyzes the condensation
      of DHPPP with para-aminobenzoate (pABA) at its active site.
    evidence:
    - reference: DOI:10.1074/jbc.272.1.59
      notes: Purified Escherichia coli DHPS (FolP) catalyzed pABA condensation and
        alternate substrate reaction with sulfacetamide (PMID:365529).
  - subject: dhps_paba_condensation_and_pterin_adduct_diversion
    predicate: supports
    object: bacterial_de_novo_folate_biosynthesis
    description: DHPS-catalyzed dihydropteroate formation is an essential step in
      bacterial de novo folate biosynthesis.
    evidence:
    - reference: DOI:10.1074/jbc.272.1.59
      notes: Competitive inhibition of DHPS and DHPPP depletion by sulfacetamide block
        de novo dihydropteroate and folate synthesis required for microbial growth
        (PMID:365529).
