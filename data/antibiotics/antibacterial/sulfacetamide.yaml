causal_graphs:
- graph_id: sulfacetamide_dhps_paba_competitive_folate_inhibition
  title: Sulfacetamide competitively inhibits bacterial dihydropteroate synthase (DHPS)
    to block de novo folate biosynthesis
  description: Sulfacetamide (N-[(4-aminophenyl)sulfonyl]acetamide), a synthetic sulfonamide
    antimicrobial, acts as a para-aminobenzoate (pABA) competitive substrate analog
    at dihydropteroate synthase (DHPS / FolP), forming a dead-end pterin-sulfa adduct
    with 6-hydroxymethyl-7,8-dihydropterin pyrophosphate (DHPPP) and blocking de novo
    folate biosynthesis.
  scope_status: MECHANISTIC
