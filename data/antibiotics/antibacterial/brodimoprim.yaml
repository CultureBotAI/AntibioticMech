mode_of_action_notes: 'CURATOR: Synthetic 2,4-diaminopyrimidine antimicrobial (brodimoprim)
  that selectively inhibits bacterial dihydrofolate reductase (FolA / DHFR, EC 1.5.1.3),
  blocking reduction of 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate and arresting
  folate-dependent thymidylate and purine biosynthesis (Then & Keller 1979, PMID:391962;
  Baccanari et al. 1982, PMID:6752145; Hawser et al. 2006, DOI:10.1016/j.bcp.2005.10.052,
  PMID:16359642).'
