  - reference: DOI:10.1128/jb.02291-12
    snippet: Planosporicin (antibiotic 97518) is a 24-amino-acid pentacyclic class
      I lantibiotic produced by the rare actinomycete Planomonospora alba that inhibits
      cell wall peptidoglycan synthesis in Gram-positive pathogens including Staphylococcus
      aureus, Streptococcus pneumoniae, and Enterococcus spp.
    notes: MIBiG 4.0.1 entry BGC0000544 (Planomonospora alba); Sherwood et al. 2013
      (DOI:10.1128/jb.02291-12, PMID:23475977), Castiglione et al. 2007 (DOI:10.1021/bi700131x,
      PMID:17469849), and Maffioli et al. 2009 (DOI:10.1021/np800794y, PMID:19301921)
      establish the structure, biosynthesis, and cell-wall-inhibitory Gram-positive
      antibacterial activity of planosporicin. ChEBI CHEBI:226796 and PubChem CID
      139586698 supply the stereo-complete SMILES, Standard InChI, and InChIKey.
