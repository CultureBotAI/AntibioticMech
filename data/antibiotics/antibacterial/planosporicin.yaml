  experimental_context: Selective inhibition of bacterial cell-wall peptidoglycan
    biosynthesis (accumulation of UDP-MurNAc-pentapeptide without immediate membrane
    depolarization) and whole-cell antibacterial activity against Gram-positive pathogens
    by the 24-residue pentacyclic type A lantibiotic planosporicin (Castiglione et
    al. 2007, DOI:10.1021/bi700131x, PMID:17469849; Maffioli et al. 2009, DOI:10.1021/np800794y,
    PMID:19301921; Sherwood et al. 2013, DOI:10.1128/jb.02291-12, PMID:23475977).
