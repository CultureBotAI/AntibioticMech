  evidence:
  - reference: DOI:10.1128/jb.02291-12
    snippet: Planosporicin, a 24-amino-acid pentacyclic lantibiotic produced by Planomonospora
      alba, inhibits bacterial cell wall peptidoglycan biosynthesis.
    notes: Sherwood et al. 2013 (J Bacteriol 195:2309-2321; PMID:23475977) characterized
      the planosporicin lantibiotic gene cluster and cell-wall biosynthesis inhibition.
  - reference: DOI:10.1021/bi700131x
    notes: Castiglione et al. 2007 (Biochemistry 46:5884-5895; PMID:17469849) isolated
      planosporicin (97518) and demonstrated selective inhibition of bacterial peptidoglycan
      synthesis and accumulation of UDP-N-acetylmuramyl-pentapeptide.
  - reference: DOI:10.1021/np800794y
    notes: Maffioli et al. 2009 (J Nat Prod 72:605-607; PMID:19301921) revised the
      lanthionine/methyllanthionine ring connectivity of planosporicin.
