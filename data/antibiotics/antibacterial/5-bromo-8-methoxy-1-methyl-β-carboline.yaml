definition: A member of the class of β-carboline that is 9H-β-carboline substituted
  by bromo, methoxy and a methyl group at positions 5, 8 and 1 respectively. It is
  isolated from a marine bryozoan Pterocella vesiculosa and has been found to exhibit
  moderate antitumour activity against the P388 murine leukemia cell line. Additionally
  it shows antimicrobial activity towards the Gram-positive bacterium Bacillus subtilis
  and the fungi Candida albicans and Trichophyton mentagrophytes.
