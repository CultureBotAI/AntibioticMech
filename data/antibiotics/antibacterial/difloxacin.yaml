definition: A quinolone that is pefloxacin in which the ethyl group at position 1
  of the quinolone has been replaced by a p-fluorophenyl group. A broad-spectrum antibiotic
  effective against both Gram-positive and Gram-negative bacteria, it is used (usually
  as the monohydrochloride salt) for the treatment of bacterial infections in dogs.
