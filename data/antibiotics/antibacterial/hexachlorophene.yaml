  measurements:
  - measurement_type: IC50
    original_value: '21520'
    qualifier: EQ
    value: 21520.0
    unit: nM
    assay_name: 3CLpro enzyme assay
    assay_description: The 3CLpro enzyme assay was developed in 384-well black, medium
      binding microplates (Greiner Bio-One, Monroe, NC, USA) with a total volume of
      20 μL and then miniaturized to 1536-well format. In 384-well plate format, 10
      μL enzyme in reaction buffer was added into each well, followed by the addition
      of 10 μL substrate. Fluorescent intensity was measured at different time points
      on a PHERAstar FSX plate reader (BMG Labtech, Cary, NC, USA) with Ex=340 nm/Em=460
      nm after the addition of substrate. The experiment was conducted at both room
      temperature (RT) and 37 °C.Steady-state kinetic parameters were evaluated using
      50 nM 3CLpro and different concentrations of substrate. In brief, 10 μL/well
      enzyme was added into 384-well plate. The reaction was then initialized by adding
      the substrate solutions at different concentrations. The substrate stock solution
      was serially diluted 1:2 to obtain seven concentrations. The final concentrations
      used in this test were 160, 80, 40, 20, 10, 5, and 2.5 μM. The fluorescent intensity
      was measured at 5, 10, 15, and 30 min.
    bindingdb_reactant_set_id: '844363'
    bindingdb_entry_assay_id: '8814_1'
    bindingdb_monomer_id: '31712'
    source_version: 2026-09
    source_retrieved_on: '2026-08-31'
    reference: PMID:32803196
  - measurement_type: EC50
    original_value: '790'
    qualifier: EQ
    value: 790.0
    unit: nM
    assay_name: SARS-CoV-2 CPE assay
    assay_description: SARS-CoV-2 CPE assay was conducted at Southern Research Institute
      (Birmingham, AL) as described in previous reports30, 31. In brief, high ACE2
      expressing Vero E6 cells were inoculated with SARS-CoV-2 (USA_WA1/2020) at 0.002
      M.O.I. After infection of 72 h at 37 °C and 5% CO2, the cell viability was examined
      with CellTiter-Glo ATP content assay kit (Promega, Madison, WI, USA). CPE raw
      data were normalized to non-infected cells and virus infected cells only which
      were set as 100% efficacy and 0 efficacy, respectively. In addition, the compound
      cytotoxicity was evaluated in the same cells by measuring ATP content in the
      absence of virus.
    bindingdb_reactant_set_id: '844364'
    bindingdb_entry_assay_id: '8814_2'
    bindingdb_monomer_id: '31712'
    source_version: 2026-09
    source_retrieved_on: '2026-08-31'
    reference: PMID:32803196
  - measurement_type: IC50
    original_value: '900'
    qualifier: EQ
    value: 900.0
    unit: nM
    assay_name: DRC analysis by immunofluorescence
    assay_description: 'Ten-point DRCs were generated for each drug. Vero cells were
      seeded at 1.2 × 104 cells per well in DMEM, supplemented with 2% FBS and 1×
      antibiotic-antimycotic solution (Gibco), in black, 384-well μClear plates (Greiner
      Bio-One) 24 h prior to the experiment. Ten-point DRCs were generated, with compound
      concentrations ranging from 0.1 to 50 μM. For the viral infections, plates were
      transferred into the BSL3 containment facility and SARS-CoV-2 was added at a
      multiplicity of infection (MOI) of 0.0125. The cells were fixed at 24 hours
      postinfection (hpi) with 4% PFA and analyzed by immunofluorescence. The acquired
      images were analyzed using in-house software to quantify cell numbers and infection
      ratios, and antiviral activity was normalized to positive (mock) and negative
      (0.5% DMSO) controls in each assay plate. DRCs were fitted by sigmoidal dose-response
      models, with the following equation: Y = bottom + (top − bottom)/[1 + (IC50/X)Hillslope],
      using XLfit 4 software or Prism7. IC50 values were calculated from the normalized
      activity data set-fitted curves. All IC50 and 50% cytotoxic concentration (CC50)
      values were measured in duplicate, and the quality of each assay was controlled
      by Z -factor and the coefficient of variation in percent (%CV).'
    bindingdb_reactant_set_id: '874414'
