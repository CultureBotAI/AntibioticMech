    assay_name: Determination of kinetic parameters and the Ki of effective compounds
      using the FRET peptide
    assay_description: Kinetic parameters were obtained using various concentrations
      of FRET peptide in the fluorescent assay. The maximal velocity (Vmax) and Michaelis
      Menten constant (Km) were calculated from the Eadie Hofstee plot. If the type
      of inhibitionwas found to be competitive using a Lineweaver Burk double reciprocal
      plot, then the inhibitory constant (Ki) for 3CLpro was estimated using the equation:Ki
      = IC50/(1+[substrate]/Km).Plots were performed, and kinetic parameters were
      calculated, using Prism software (Graphpad Software, San Diego, CA).
