definition: An organochlorine compound that is diphenylmethane in which each of the
  phenyl groups is substituted by chlorines at positions 2, 3, and 5, and by a hydroxy
  group at position 6. An antiseptic that is effective against Gram-positive organisms,
  it is used in soaps and creams for the treatment of various skin disorders. It is
  also used in agriculture as an acaricide and fungicide, but is not approved for
  such use within the European Union.
