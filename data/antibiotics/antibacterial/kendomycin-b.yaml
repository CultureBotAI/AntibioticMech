  from Streptomyces sp. that perturbs bacterial cell-division septation and peptidoglycan/cell-wall
  homeostasis via its electrophilic para-quinone methide pharmacophore in Gram-positive
  bacteria and Mycobacteria (Suciati et al. 2022, DOI:10.1038/s41429-021-00493-4,
  PMID:34966190; Elnakady et al. 2016, DOI:10.1371/journal.pone.0146165, PMID:26795276).'
