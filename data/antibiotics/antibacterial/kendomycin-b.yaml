    profiling of kendomycin B alongside kendomycin A and quinone-methide cell-division/cell-wall
    perturbation studies in Staphylococcus aureus (Suciati et al. 2022, DOI:10.1038/s41429-021-00493-4,
    PMID:34966190; Elnakady et al. 2016, DOI:10.1371/journal.pone.0146165, PMID:26795276).
