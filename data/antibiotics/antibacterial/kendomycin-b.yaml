  evidence:
  - reference: DOI:10.1038/s41429-021-00493-4
    snippet: Suciati et al. isolated kendomycin B from Streptomyces sp. and demonstrated
      potent antibacterial activity against Gram-positive bacteria and Mycobacteria
      alongside kendomycin A.
    notes: Suciati et al. 2022 (J Antibiot 75:229-236; PMID:34966190) isolated kendomycin
      B from marine-derived Streptomyces sp. and characterized its Gram-positive antibacterial
      and antimycobacterial potency.
  - reference: DOI:10.1371/journal.pone.0146165
    notes: Elnakady et al. 2016 (PLoS One 11:e0146165; PMID:26795276) established
      that the ansa-quinone methide kendomycin scaffold disrupts bacterial septum
      formation, cell division, and cell-wall homeostasis in Staphylococcus aureus.
