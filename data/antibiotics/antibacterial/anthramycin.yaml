definition: A member of the class of pyrrolobenzodiazepines that is (11aS)-5,10,11,11a-tetrahydro-1H-pyrrolo[2,1-c][1,4]benzodiazepine
  substituted at positions 2, 5, 8, 9 and 11R by a (1E)-3-amino-3-oxoprop-1-en-1-yl,
  oxo, methyl, hydroxy and hydroxy groups, respectively. It is a natural product isolated
  from Streptomyces refuineus subsp. thermotolerans.
