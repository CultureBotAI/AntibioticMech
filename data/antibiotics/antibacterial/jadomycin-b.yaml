definition: A jadomycin that is jadomycin A in which the phenolic hydroxy group at
  position 12 has been converted to the corresponding 2,6-dideoxy-α-L-ribo-hexopyranoside,
  isolated from Streptomyces venezuelae. It exists as a diastereoisomeric mixture
  consisting of both 3aS and 3aR isomers.
