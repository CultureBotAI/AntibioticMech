definition: A bisindole alkaloid that is phenol bearing a 3,3-dimethylallyl group
  at position 4, two methoxy groups at positions 3 and 6, and two indol-3-yl groups
  at positions 2 and 5. It is a natural product isolated from the sclerotia of Aspergillus
  orbraceus, with moderate activity against some insects, as well as Gram-positive
  bacteria.
