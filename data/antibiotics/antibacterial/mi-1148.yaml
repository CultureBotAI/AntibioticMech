definition: A tripeptide comprising of L-arginine, 3-methyl-L-valine and L-arginine
  joined in sequence by peptide linkages and in which the amino terminus is substituted
  by a [4-(carbamimidamidomethyl)phenyl]acetyl group and the carboxy terminus is substituted
  by a (4-carbamimidoylbenzyl)amino group. It is a highly potent inhibitor of furin
  endoprotease (Ki = 5.5 pM) that has anti-infectious activity.
