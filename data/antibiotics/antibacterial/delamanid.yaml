definition: A novel nitroimidazole antibiotic for treating Mycobacterium tuberculosis
  infection. Delamanid inhibits bacterial cell wall growth by mycolic acid synthesis
  disruption and is particularly effective in combination therapies against multidrug-resistant
  tuberculosis.
