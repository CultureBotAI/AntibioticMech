  evidence:
  - reference: DOI:10.1021/acschembio.3c00773
    snippet: Mechanistic profiling of pentabromopseudilin in Staphylococcus aureus
      demonstrated rapid cytoplasmic membrane depolarization and disruption of bacterial
      membrane phospholipid homeostasis.
    notes: ACS Chem Biol 2024 (DOI:10.1021/acschembio.3c00773; PMID:38377384) established
      that pentabromopseudilin acts on Gram-positive bacteria (Staphylococcus aureus)
      via cytoplasmic membrane depolarization and phospholipid bilayer disruption,
      distinct from its eukaryotic myosin ATPase inhibition.
  - reference: PMID:38377384
    notes: PubMed record for DOI:10.1021/acschembio.3c00773 on pentabromopseudilin
