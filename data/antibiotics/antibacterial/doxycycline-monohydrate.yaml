identifier: CHEBI:60648
label: doxycycline monohydrate
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: The monohydrate form of doxycycline. A semi-synthetic tetracycline antibiotic,
  it is used to inhibit bacterial protein synthesis and treat non-gonococcal urethritis
  and cervicitis, exacerbations of bronchitis in patients with chronic obstructive
  pulmonary disease (COPD), and adult periodontitis.
