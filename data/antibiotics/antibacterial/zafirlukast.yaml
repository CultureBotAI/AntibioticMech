  taxon_id: NCBITaxon:83332
  taxon_label: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
  experimental_context: Direct inhibition of Mycobacterium tuberculosis Lsr2-DNA complexation
    and transcriptional repression in vitro and in whole mycobacterial cells (PMID:23650171;
    DOI:10.1128/AAC.02407-12).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2013-08
  source_retrieved_on: '2026-10-24'
  evidence:
  - reference: PMID:23650171
    snippet: Here, we show that the asthma drug zafirlukast inhibits the complexation
      between the nucleoid-associated protein Lsr2 and DNA, resulting in dysregulation
      of transcription and severely impeding the growth of M. tuberculosis.
    notes: Pinault et al. 2013 (Antimicrob Agents Chemother 57:3949-3953; DOI:10.1128/AAC.02407-12)
      demonstrated that zafirlukast directly binds and inhibits Mycobacterium tuberculosis
      H37Rv nucleoid-associated protein Lsr2 (Rv3597c, UniProtKB:P9WIP7), blocking
      Lsr2-DNA complexation.
