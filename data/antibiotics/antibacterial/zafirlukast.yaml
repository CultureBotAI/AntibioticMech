definition: An indole-based sulfonylcarbamate (leukotriene receptor antagonist) with
  direct anti-Gram-positive and antimycobacterial activity mediated by inhibition
  of staphylococcal lipoteichoic acid synthase (LtaS) and mycobacterial Lsr2.
