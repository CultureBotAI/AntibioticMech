  evidence:
  - reference: DOI:10.3390/antibiotics15090914
    snippet: Zafirlukast showed modest direct-acting antimicrobial activity (0.5-32
      ug/mL) against a panel of Gram-positive bacteria, including MRSA. It was also
      found that Zafirlukast synergised with a number of existing antibiotics. Mutational
      analysis suggested the target of Zafirlukast in Staphylococci is LtaS (Lipoteichoic
      acid synthase).
    notes: Siegwart et al. 2026 (Antibiotics 15:914; PMID:42792065) identified lipoteichoic
      acid synthase (LtaS) as the staphylococcal target of zafirlukast by resistance
      mutation analysis in Staphylococcus aureus; held from single-strain UniProtKB
      accession assignment because S. aureus LtaS is split across strain-specific
      Swiss-Prot entries (e.g. NCTC 8325 UniProtKB:Q2G093, MW2 UniProtKB:Q7A1I3, MRSA252
      UniProtKB:Q6GIU0).
