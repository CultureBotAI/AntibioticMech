  evidence:
  - reference: DOI:10.3390/antibiotics15090914
    snippet: Zafirlukast showed modest direct-acting antimicrobial activity (0.5-32
      ug/mL) against a panel of Gram-positive bacteria, including MRSA. It was also
      found that Zafirlukast synergised with a number of existing antibiotics. Mutational
      analysis suggested the target of Zafirlukast in Staphylococci is LtaS (Lipoteichoic
      acid synthase).
    notes: Reported by Siegwart et al. 2026 (Antibiotics 15:914; PMID:42792065) to
      exhibit direct antibacterial activity (MIC 0.5-32 ug/mL) against Gram-positive
      bacteria including methicillin-resistant Staphylococcus aureus (MRSA) via inhibition
      of lipoteichoic acid synthase (LtaS), in addition to antimycobacterial activity
      targeting nucleoid-associated protein Lsr2.
