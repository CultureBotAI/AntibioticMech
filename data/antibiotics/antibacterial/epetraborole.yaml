  evidence:
  - reference: DOI:10.1128/aac.01029-23
    snippet: Epetraborole is a boron-containing leucyl-tRNA synthetase (LeuRS) inhibitor
      under clinical development for treatment-refractory Mycobacterium avium complex
      (MAC) lung disease. Epetraborole inhibited 99.3% of M. avium complex isolates
      at <=4 ug/mL (MIC50/90, 1/2 ug/mL) and 100.0% of M. abscessus isolates at <=0.5
      ug/mL (MIC50/90, 0.12/0.25 ug/mL).
    notes: Castanheira et al. 2023 (Antimicrob Agents Chemother 67:e0102923; PMID:37937988)
      characterized the antimycobacterial potency of the bacterial leucyl-tRNA synthetase
      (LeuRS) inhibitor epetraborole against Mycobacterium avium complex and Mycobacterium
      abscessus clinical isolates.
  - reference: PMID:37937988
    notes: PubMed record for Castanheira et al. 2023 on epetraborole LeuRS inhibition
      in nontuberculous mycobacteria.
  - reference: DOI:10.1128/AAC.02058-12
    notes: Hernandez et al. 2013 (Antimicrob Agents Chemother 57:1394-1403; PMID:23295922)
      discovered AN3365 (GSK2251052 / epetraborole) and demonstrated direct oxaborole-tRNA(Leu)
      adduct inhibition of Escherichia coli leucyl-tRNA synthetase (LeuS, IC50 = 0.31
      uM) and editing-domain resistance mutations.
  - reference: PMID:23295922
    notes: PubMed record for Hernandez et al. 2013 on discovery and LeuRS mechanism
      of AN3365 (epetraborole).
