  evidence:
  - reference: DOI:10.1128/aac.01029-23
    snippet: Epetraborole is a boron-containing leucyl-tRNA synthetase (LeuRS) inhibitor
      under clinical development for treatment-refractory Mycobacterium avium complex
      (MAC) lung disease. Epetraborole inhibited 99.3% of M. avium complex isolates
      at <=4 ug/mL (MIC50/90, 1/2 ug/mL) and 100.0% of M. abscessus isolates at <=0.5
      ug/mL (MIC50/90, 0.12/0.25 ug/mL).
    notes: Reported by Castanheira et al. 2023 (Antimicrob Agents Chemother 67:e0102923;
      PMID:37937988) as a benzoxaborole inhibitor (AN3365, GSK2251052) of bacterial
      leucyl-tRNA synthetase (LeuRS) via oxaborole-assisted tRNA(Leu) trapping in
      the editing domain, with MIC50/MIC90 of 1/2 ug/mL against Mycobacterium avium
      complex and 0.12/0.25 ug/mL against Mycobacterium abscessus.
