identifier: CHEBI:65561
label: callophycoic acid E
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A dibenzooxepine diterpenoid that is hexahydrodibenzo[b,e]oxepine-2-carboxylic
  acid with an isolated double bond between positions 6 and 6a and is substituted
  by a bromo, a 2-[(1R,3S)-3-bromo-2,2-dimethyl-6-methylidenecyclohexyl]ethyl and
  a methyl group at positions 9, 10 and 10 respectively (the 9S,10S,10aR stereoisomer).
  It is isolated from the Fijian red alga Callophycus serratus and exhibits antibacterial,
  antimalarial and anticancer activities.
