  evidence:
  - reference: DOI:10.1021/jm401382v
    snippet: Shirude et al. identified 1,4-azaindole noncovalent inhibitors of Mycobacterium
      tuberculosis decaprenylphosphoryl-beta-D-ribose 2'-epimerase (DprE1) and reported
      that compound 8 (TBA-7371, AZ-7371) inhibited M. tuberculosis DprE1 with an
      IC50 of 10 nM, inhibited M. tuberculosis H37Rv growth with an MIC of 1.56 uM
      (0.55 ug/mL), and reduced bacterial load in acute and chronic murine tuberculosis
      infection models.
    notes: Reported by Shirude et al. 2013 (J Med Chem 56:9701-9708; PMID:24215368)
      and Shirude et al. 2014 (ACS Med Chem Lett 5:792-796; PMID:24957839; DOI:10.1021/ml500134b)
      as a clinical-stage 1,4-azaindole noncovalent DprE1 inhibitor (TBA-7371, AZ-7371).
      PubChem CID 72792692 supplies the standard InChI, InChIKey, formula, and SMILES
      for TBA-7371.
