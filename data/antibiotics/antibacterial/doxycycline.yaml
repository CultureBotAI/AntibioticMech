definition: Tetracycline in which the 5β-hydrogen is replaced by a hydroxy group,
  while the 6α-hydroxy group is replaced by hydrogen. A semi-synthetic tetracycline
  antibiotic, it is used to inhibit bacterial protein synthesis and treat non-gonococcal
  urethritis and cervicitis, exacerbations of bronchitis in patients with chronic
  obstructive pulmonary disease (COPD), and adult periodontitis.
