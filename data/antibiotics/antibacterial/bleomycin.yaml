definition: Bleomycin is a family of glycopeptide antibiotics produced by the bacterium
  Streptomyces verticillus. Bleomycins, taken as a mixture, act by the induction of
  DNA and RNA strand breaks. In addition to its antibacterial activity, bleomycin
  is also used as an anticancer agent.
