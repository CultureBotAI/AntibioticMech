  evidence:
  - reference: DOI:10.1038/s41598-025-29583-1
    snippet: Both exhibited potent antibacterial activity in the nanomolar range against
      multiple Enterococcus species, including vancomycin-resistant and vancomycin-sensitive
      E. faecium, E. faecalis, E. hirae, and E. durans. CRS3123 displayed exceptional
      potency, with MIC values of < 0.007 ug/mL for most strains.
    notes: Reported by Abdelmegeed et al. 2025 (Sci Rep 15:44061; PMID:41413129) and
      Lomeli et al. 2019 (Antimicrob Agents Chemother 63:e01395-19; PMID:31685472;
      DOI:10.1128/aac.01395-19) as a narrow-spectrum diaryldiamine inhibitor (REP3123)
      of bacterial type 1 methionyl-tRNA synthetase (MetRS), exhibiting MIC90 = 1
      ug/mL against Clostridioides difficile and MIC < 0.007 ug/mL against vancomycin-resistant
      Enterococcus faecium and Enterococcus faecalis.
