  evidence:
  - reference: DOI:10.1038/s41598-025-29583-1
    snippet: Both exhibited potent antibacterial activity in the nanomolar range against
      multiple Enterococcus species, including vancomycin-resistant and vancomycin-sensitive
      E. faecium, E. faecalis, E. hirae, and E. durans. CRS3123 displayed exceptional
      potency, with MIC values of < 0.007 ug/mL for most strains.
    notes: Abdelmegeed et al. 2025 (Sci Rep 15:44061; PMID:41413129) demonstrated
      potent nanomolar antibacterial activity of the bacterial type 1 methionyl-tRNA
      synthetase (MetRS) inhibitor CRS3123 against Enterococcus faecalis, Enterococcus
      faecium, and Clostridioides difficile.
  - reference: PMID:41413129
    notes: PubMed record for Abdelmegeed et al. 2025 on CRS3123 MetRS inhibition in
      Enterococcus and Clostridioides difficile.
  - reference: DOI:10.1128/aac.01395-19
    notes: Lomeli et al. 2019 (Antimicrob Agents Chemother 63:e01395-19; PMID:31685472)
      characterized CRS3123 (REP3123) activity against Clostridioides difficile type
      1 methionyl-tRNA synthetase.
  - reference: PMID:31685472
    notes: PubMed record for Lomeli et al. 2019 on CRS3123 activity against Clostridioides
      difficile.
  - reference: DOI:10.1093/jac/dkp042
    notes: Ochsner et al. 2009 (J Antimicrob Chemother 63:964-971; PMID:19246509)
      established Ki = 0.020 nM inhibition of purified Clostridioides difficile type
      1 methionyl-tRNA synthetase (MetRS) by REP3123 (CRS3123).
  - reference: PMID:19246509
    notes: PubMed record for Ochsner et al. 2009 characterizing REP3123 (CRS3123)
      inhibition of C. difficile MetRS.
