mode_of_action_notes: 'CURATOR: Synthetic diaryldiamine antibacterial (REP3123) that
  selectively inhibits bacterial type 1 methionyl-tRNA synthetase (MetRS1 / MetG),
  arresting protein synthesis, toxin production, and sporulation in Clostridioides
  difficile and Gram-positive cocci (Abdelmegeed et al. 2025, DOI:10.1038/s41598-025-29583-1,
  PMID:41413129; Lomeli et al. 2019, DOI:10.1128/aac.01395-19, PMID:31685472; Ochsner
  et al. 2009, DOI:10.1093/jac/dkp042, PMID:19246509).'
