definition: A (4R)-6,8-dibromochroman-4-ylamino-linked thieno[3,2-b]pyridin-7-one
  derivative (REP3123) that selectively inhibits bacterial type 1 methionyl-tRNA synthetase
  (MetRS) in Clostridioides difficile and Gram-positive cocci.
