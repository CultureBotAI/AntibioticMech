  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Selective competitive inhibition of Gram-positive bacterial
    type 1 methionyl-tRNA synthetase (MetRS1, Ki = 0.020 nM against Clostridioides
    difficile MetRS) and potent whole-cell antibacterial activity against Clostridioides
    difficile and vancomycin-resistant Enterococcus species (Abdelmegeed et al. 2025,
    DOI:10.1038/s41598-025-29583-1, PMID:41413129; Lomeli et al. 2019, DOI:10.1128/aac.01395-19,
    PMID:31685472; Ochsner et al. 2009, DOI:10.1093/jac/dkp042, PMID:19246509).
