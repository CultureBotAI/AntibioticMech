    snippet: Amicetin is a disaccharide-containing cytosine peptidyl nucleoside antibiotic
      produced by Streptomyces vinaceusdrappus NRRL 2363 that exhibits antibacterial
      activity, particularly against Mycobacterium tuberculosis and Gram-positive
      bacteria, and antiviral activity by inhibiting ribosomal peptidyl transferase.
    notes: MIBiG 4.0.1 entry BGC0000953 (Streptomyces vinaceusdrappus NRRL 2363);
      Zhang et al. 2012 (DOI:10.1128/aem.07185-11, PMID:22267658) and DeBoer et al.
      1953 (J Am Chem Soc 75:499-500; DOI:10.1021/ja01098a518) characterize the biosynthesis,
      structure, and antimycobacterial/antibacterial translation-inhibitory activity
      of amicetin. ChEBI CHEBI:199652 and PubChem CID 28675 supply the stereo-complete
      SMILES, Standard InChI, and InChIKey.
