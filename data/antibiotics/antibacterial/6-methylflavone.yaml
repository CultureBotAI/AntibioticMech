    snippet: Among the compounds tested, 6-methylflavone (6-MF) was identified as
      a selective inhibitor of mycobacterial growth. 6-MF showed consistent activity
      against multiple clinical isolates of M. abscessus with minimum inhibitory concentration
      (MIC) values of 8-16 ug/mL and was also effective against intracellular mycobacteria
      without cytotoxicity.
    notes: Reported by Oh et al. 2026 (Microbiol Spectr; PMID:42007697) as a selective
      antimycobacterial flavone that disrupts mycobacterial membrane potential and
      respiratory energetics, inhibiting clinical Mycobacterium abscessus isolates
      at MIC 8-16 ug/mL and reducing pulmonary bacterial burden in vivo.
