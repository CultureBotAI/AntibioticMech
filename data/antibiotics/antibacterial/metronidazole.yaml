identifier: CHEBI:6909
label: metronidazole
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of imidazoles substituted at C-1, -2 and -5 with
  2-hydroxyethyl, nitro and methyl groups respectively. It has activity against anaerobic
  bacteria and protozoa, and has a radiosensitising effect on hypoxic tumour cells.
  It may be given by mouth in tablets, or as the benzoate in an oral suspension. The
  hydrochloride salt can be used in intravenous infusions. Metronidazole is a prodrug
  and is selective for anaerobic bacteria due to their ability to intracellularly
  reduce the nitro group of metronidazole to give nitroso-containing intermediates.
  These can covalently bind to DNA, disrupting its helical structure, inducing DNA
  strand breaks and inhibiting bacterial nucleic acid synthesis, ultimately resulting
  in bacterial cell death.
