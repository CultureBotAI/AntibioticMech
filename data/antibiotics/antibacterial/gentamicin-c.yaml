definition: Gentamicin C is a mixture of gentamicin C1, gentamicin C1a, and gentamicin
  C2 (these differ in substituents at position C6'). Gentamicin works by binding to
  the bacterial 30S ribosomal subunit, causing misreading of mRNA and leaving the
  bacterium unable to synthesize proteins vital to its growth.
