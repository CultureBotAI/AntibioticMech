identifier: CHEBI:149836
label: tigecycline
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: Tetracycline in which the hydroxy group at position 5 and the methyl group
  at position 6 are replaced by hydrogen, and with a dimethylamino substituent and
  an (N-tert-butylglycyl)amino substituent at positions 7 and 9, respectively. A glycylcycline
  antibiotic, it has activity against a broad range of Gram-positive and Gram-negative
  bacteria, including tetracycline-resistant organisms. It is used for the intravenous
  treatment of complicated skin and skin structure infections caused by susceptible
  organisms.
