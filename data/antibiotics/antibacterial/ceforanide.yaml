identifier: CHEBI:3495
label: ceforanide
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A second-generation cephalosporin antibiotic with {[1-(carboxymethyl)-1H-tetrazol-5-yl]sulfanyl}methyl
  and 2-(aminomethyl)phenylacetamido groups at positions 3 and 7, respectively, of
  the cephem skeleton. It is effective against many coliforms, including Escherichia
  coli, Klebsiella, Enterobacter and Proteus, and most strains of Salmonella, Shigella,
  Hemophilus, Citrobacter and Arizona species.
