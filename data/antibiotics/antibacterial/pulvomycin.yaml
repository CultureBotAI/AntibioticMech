  experimental_context: X-ray crystal structure of Thermus thermophilus EF-Tu-GppNHp
    in complex with pulvomycin at 1.4 A resolution (PDB:2C78) and biochemical assays
    with Escherichia coli EF-Tu demonstrate that pulvomycin spans the interface of
    domains 1, 2, and 3 of EF-Tu and sterically blocks aminoacyl-tRNA binding (Parmeggiani
    et al. 2006, DOI:10.1021/bi0525122, PMID:16734421).
