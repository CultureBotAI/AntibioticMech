mode_of_action_notes: 'CURATOR: 22-membered macrocyclic lactone elfamycin antibiotic
  that binds at the three-domain interface of bacterial elongation factor Tu (EF-Tu)
  and prevents formation of the aminoacyl-tRNA*EF-Tu*GTP ternary complex required
  for ribosomal translation elongation (Parmeggiani et al. 2006, DOI:10.1021/bi0525122,
  PMID:16734421, PDB:2C78).'
