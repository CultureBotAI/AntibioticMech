definition: Pulvomycin is a polyketide antibiotic that binds elongation factor Tu
  (EF-Tu) to inhibit protein biosynthesis by preventing the formation of the ternary
  complex (EF-Tu*GTP*aa-tRNA). Phenotypically, it was shown that pulvomycin sensitivity
  is dominant over resistance.
