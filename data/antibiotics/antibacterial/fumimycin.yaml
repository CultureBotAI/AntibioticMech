definition: A member of the class of 1-benzofurans that is 1-benzofuran-2(3H)-one
  substituted by a propenyl group at position 4, hydroxy groups at positions 5 and
  6, methyl group at position 3 and a [(2E)-3-carboxyprop-2-enoyl]nitrilo group at
  position 3. Isolated from the fermentation broth of Aspergillus fumisynnematus F746,
  it exhibits antibacterial activity.
