definition: A member of the class of pyrroles that is 1H-pyrrole which is substituted
  by chloro groups at positions 2 and 3 and by a nitro group position 4. It is the
  simplest member of the pyrrolomycins, a family of natural products found in several
  species of the Streptomyces genus. The compound is active against Gram-positive
  and Gram-negative bacteria and some genera of fungi.
