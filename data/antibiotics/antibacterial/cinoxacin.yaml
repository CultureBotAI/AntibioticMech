- target_label: bacterial DNA gyrase (GyrA/GyrB) and topoisomerase IV (ParC/ParE)
  target_type: PROTEIN_COMPLEX
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Purified bacterial DNA gyrase DNA supercoiling and topoisomerase
    IV decatenation IC50 inhibition assays and GyrA/ParC QRDR mutant-panel susceptibility
    profiling of cinoxacin and comparator quinolones (Gootz et al. 1990, DOI:10.1128/AAC.34.1.8,
    PMID:2158274; Takei et al. 2001, DOI:10.1128/AAC.45.12.3544-3547.2001, PMID:11709337).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2001-12
  source_retrieved_on: '2026-11-04'
  evidence:
  - reference: DOI:10.1128/AAC.45.12.3544-3547.2001
    snippet: Takei et al. determined the inhibitory activities (IC50s) of quinolones
      against purified bacterial DNA gyrase supercoiling and topoisomerase IV decatenation
      and correlated enzyme inhibition with MIC shifts across defined GyrA and ParC
      QRDR mutants.
    notes: Takei et al. 2001 (Antimicrob Agents Chemother 45:3544-3547; PMID:11709337)
      characterized bacterial DNA gyrase and topoisomerase IV inhibition and GyrA/ParC
      QRDR resistance shifts across quinolone antibacterials.
  - reference: DOI:10.1128/AAC.34.1.8
    notes: Gootz et al. 1990 (Antimicrob Agents Chemother 34:8-12; PMID:2158274) measured
      direct inhibition of purified Escherichia coli DNA gyrase supercoiling and DNA
      synthesis by cinoxacin and comparator quinolones.
