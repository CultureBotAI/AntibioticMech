mode_of_action_notes: 'CURATOR: Synthetic first-generation cinnoline-3-carboxylic
  acid quinolone-class antibacterial that inhibits bacterial DNA gyrase (GyrA/GyrB)
  DNA supercoiling and topoisomerase IV (ParC/ParE) decatenation, arresting bacterial
  DNA replication (Gootz et al. 1990, DOI:10.1128/AAC.34.1.8, PMID:2158274; Takei
  et al. 2001, DOI:10.1128/AAC.45.12.3544-3547.2001, PMID:11709337).'
