definition: A member of the class of cinnolines that is 6,7-methylenedioxycinnolin-4(1H)-one
  bearing an ethyl group at position 1 and a carboxylic acid group at position 3.
  An analogue of oxolinic acid, it has similar antibacterial actions. It was formerly
  used for the treatment of urinary tract infections.
