  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: In vitro transcription inhibition assays and X-ray crystal
    structure of Escherichia coli DNA-directed RNA polymerase holoenzyme bound to
    the chlorohydrin bicyclic depsipeptide salinamide B at the bridge-helix cap (PDB:4MEY)
    blocking bridge-helix N-terminal hinge conformational cycling (Degen et al. 2014,
    DOI:10.7554/eLife.02451, PMID:24843001; Ray et al. 2016, DOI:10.1002/anie.201508576,
    PMID:26553755).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
