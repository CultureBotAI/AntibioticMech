  source_retrieved_on: '2026-11-05'
  evidence:
  - reference: DOI:10.7554/eLife.02451
    snippet: Degen et al. solved the crystal structure of Escherichia coli RNA polymerase
      holoenzyme in complex with salinamide B (bromo-analogue/congener, PDB:4MEY)
      at the bridge-helix cap and showed direct inhibition of bacterial RNA polymerase
      nucleotide addition.
    notes: Degen et al. 2014 (eLife 3:e02451; PMID:24843001; PDB:4MEY) established
      direct binding of salinamide B to the RpoB/RpoC bridge-helix cap of Escherichia
      coli DNA-directed RNA polymerase.
  - reference: PMID:24843001
    notes: PubMed record for Degen et al. 2014 on transcription inhibition and crystal
      structure of E. coli RNA polymerase with salinamide B.
  - reference: DOI:10.1002/anie.201508576
    notes: Ray et al. 2016 (Angew Chem Int Ed Engl 55:364-367; PMID:26553755) characterized
      the salinamide B biosynthetic pathway in marine Streptomyces sp. CNB-091.
  - reference: PMID:26553755
    notes: PubMed record for Ray et al. 2016 on salinamide B biosynthesis and antibacterial
      activity.
