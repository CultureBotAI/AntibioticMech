causal_graphs:
- graph_id: salinamide_b_rnap_bridge_helix_cap_hinge_transcription_inhibition
  title: Salinamide B binds the bacterial RNA polymerase bridge-helix cap/hinge pocket
    to inhibit nucleotide addition and transcription
  description: Salinamide B, a chlorinated bicyclic depsipeptide antibiotic from marine
    Streptomyces sp. CNB-091, binds the bacterial DNA-directed RNA polymerase (RpoB/RpoC)
    bridge-helix cap/hinge pocket (PDB:4MEY), allosterically blocking bridge-helix
    N-terminal hinge unbending required for nucleotide addition and arresting bacterial
    transcription.
