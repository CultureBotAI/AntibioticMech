causal_graphs:
- graph_id: norfloxacin_dna_gyrase_supercoiling_inhibition
  title: Norfloxacin inhibits bacterial DNA gyrase supercoiling
  description: Norfloxacin binds the DNA-DNA gyrase reaction complex and inhibits
    DNA gyrase-catalyzed supercoiling, disrupting bacterial chromosome topology control.
  scope_status: MECHANISTIC
  nodes:
  - node_id: norfloxacin
    label: norfloxacin
    node_type: COMPOUND
    grounding: CHEBI:100246
  - node_id: dna_gyrase
    label: bacterial DNA gyrase
    node_type: GENE_OR_PROTEIN
    grounding: ARO:3000733
    grounding_notes: Grounded through CARD's fluoroquinolone-sensitive GyrA target;
      GyrA and GyrB form the bacterial DNA gyrase target complex.
    gene_symbols:
    - gyrA
    - gyrB
  - node_id: dna_supercoiling
    label: ATP-dependent DNA supercoiling
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: DNA gyrase-catalyzed supercoiling measured in purified-enzyme
      assays.
  - node_id: dna_topology_control
    label: bacterial DNA topology control
    node_type: BIOLOGICAL_PROCESS
    grounding_status: REVIEWED_LABEL_ONLY
    grounding_notes: Covers the gyrase-dependent DNA supercoiling step that norfloxacin
      blocks.
  edges:
  - subject: norfloxacin
    predicate: binds
    object: dna_gyrase
    description: Norfloxacin binds specific sites created in the bacterial DNA-DNA
      gyrase complex.
    evidence:
    - reference: PMID:2536729
      notes: Shen and colleagues characterized norfloxacin binding sites that appear
        in DNA gyrase-DNA complexes.
  - subject: norfloxacin
    predicate: inhibits
    object: dna_supercoiling
    description: Norfloxacin inhibits DNA gyrase-catalyzed DNA supercoiling in purified
      bacterial enzyme assays.
    evidence:
    - reference: PMID:2982149
      notes: Shen and Pernet assayed tritiated norfloxacin to probe quinolone inhibition
        of DNA gyrase.
    - reference: PMID:3010848
      notes: Zweerink and Edison compared norfloxacin and other quinolones in Micrococcus
        luteus DNA gyrase supercoiling assays.
  - subject: dna_gyrase
    predicate: enables
    object: dna_supercoiling
    description: DNA gyrase catalyzes the ATP-dependent supercoiling reaction inhibited
      by norfloxacin.
    evidence:
    - reference: PMID:3010848
      notes: The purified-enzyme assay measured quinolone inhibition of supercoiling
        by Micrococcus luteus DNA gyrase.
  - subject: dna_supercoiling
    predicate: supports
    object: dna_topology_control
    description: DNA supercoiling by gyrase contributes to bacterial chromosome topology
      control.
    evidence:
    - reference: PMID:3010848
      notes: The in vitro comparison links quinolone-sensitive DNA gyrase activity
        to DNA supercoiling.
