identifier: CHEBI:100246
label: norfloxacin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A quinolinemonocarboxylic acid with broad-spectrum antibacterial activity
  against most gram-negative and gram-positive bacteria. Norfloxacin is bactericidal
  and its mode of action depends on blocking of bacterial DNA replication by binding
  itself to an enzyme called DNA gyrase.
