definition: A terpenoid indole alkaloid that is 1H-indole substituted by cyclohexylmethyl
  ring at position 3 which in turn is substituted by additional methyl groups at positions
  2 and 3, a propan-2-ylidene group at position 6 and a 2-carboxyethyl group at position
  1. Isolated from Greenwayodendron suaveolens, it exhibits antibacterial activity.
