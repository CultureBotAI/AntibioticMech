  - reference: DOI:10.1016/j.ijantimicag.2024.107242
    snippet: Delpazolid (LCB01-0371) is a novel oxazolidinone with cyclic amidrazone
      under clinical investigation. Against clinical M. tuberculosis isolates, delpazolid
      showed an MIC50 of 0.5 mg/L and an MIC90 of 1.0 mg/L. Against M. abscessus isolates,
      delpazolid exhibited an MIC50 of 2.0 mg/L and an MIC90 of 4.0 mg/L.
    notes: Reported by Shang et al. 2024 (Int J Antimicrob Agents 64:107242; PMID:38909850)
      as a cyclic-amidrazone-bearing oxazolidinone antibacterial (LCB01-0371) targeting
      the 50S ribosomal subunit, exhibiting MIC50/MIC90 of 0.5/1.0 mg/L against Mycobacterium
      tuberculosis and 2.0/4.0 mg/L against Mycobacterium abscessus clinical isolates.
