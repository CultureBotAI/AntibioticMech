  - reference: DOI:10.1021/acscentsci.2c00598
    snippet: This compound, which we have named fabimycin, displays impressive activity
      against >200 clinical isolates of E. coli, K. pneumoniae, and A. baumannii,
      does not kill commensal bacteria indiscriminately, and demonstrates efficacy
      in multiple mouse models of infection caused by Gram-negative bacteria.
    notes: Reported by Parker et al. 2022 (ACS Cent Sci 8:1145-1158; PMID:36035943)
      as an eNTRy-rule-optimized primary-amine-bearing enoyl-ACP reductase (FabI)
      inhibitor active against >200 clinical isolates of Escherichia coli, Klebsiella
      pneumoniae, and Acinetobacter baumannii (typical MICs 1-4 ug/mL; confirmed at
      MIC 2 ug/mL against K. pneumoniae ATCC 43816 in DOI:10.1021/acsinfecdis.3c00391).
