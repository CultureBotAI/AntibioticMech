label: halolitoralin A
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: MINTED
definition: Halolitoralin A is an alanine-rich cyclic hexapeptide. It exhibits potent
  activity against the pathogenic fungi Candida albicans and Trichophyton mentagrophytes
  and the gram negative bacteria Pseudomonas aeruginosa and Escherichia coli. Gram
  negative bacteria were found to be more sensitive than gram positive bacteria. It
  was also found to exhibit moderate anthelmintic activity against the earthworms
  Megascoplex konkanensis and Eudrilus sp.
