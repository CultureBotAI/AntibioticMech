definition: UK-69,753 is a glycosylated form of factumycin. The disaccharide moiety
  of UK-69,753 is virtually identical to that of efrotomycin, another member of this
  class of antibiotics. UK-69,753 has been shown to have strong in vitro and in vivo
  activity toward a swine pathogen, Treponema hyodysenteriae.
