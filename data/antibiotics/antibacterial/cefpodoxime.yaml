definition: A third-generation cephalosporin antibiotic with methoxymethyl and (2Z)-2-(2-amino-1,3-thiazol-4-yl)-2-(methoxyimino)acetamino
  substituents at positions 3 and 7, respectively, of the cephem skeleton. Given by
  mouth as its proxetil ester prodrug, it is used to treat acute otitis media, pharyngitis,
  and sinusitis.
