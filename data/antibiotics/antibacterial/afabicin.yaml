  - reference: DOI:10.1093/jac/dkae155
    snippet: Afabicin, the prodrug of afabicin desphosphono, is a novel antibiotic
      targeting the bacterial type II fatty acid synthesis (FASII) pathway (FabI inhibitor)
      with potent activity against staphylococci. Afabicin desphosphono showed potent
      in vitro activity against all 210 clinical isolates of staphylococci (MIC50
      <= 0.008 mg/L; MIC90 = 0.015 mg/L), regardless of species and methicillin resistance
      status.
    notes: Reported by Valour et al. 2024 (J Antimicrob Chemother 79:1857-1869; PMID:38814612)
      as the O-phosphonooxymethyl prodrug (Debio 1450) of afabicin desphosphono (AFN-1252,
      Debio 1452), targeting staphylococcal enoyl-ACP reductase FabI with MIC50 <=
      0.008 mg/L and MIC90 = 0.015 mg/L across 210 clinical Staphylococcus isolates.
