definition: An aminoglycoside antibiotic that is gentamycin C1a in which the hydrogen
  of the amino group at position 1 is substituted by an ethyl group. It is a fourth
  generation semisynthetic aminoglycoside that has antimicrobial activity against
  both gram-positive and gram-negative bacterial infections and also effective against
  aminoglycoside resistant strains.
