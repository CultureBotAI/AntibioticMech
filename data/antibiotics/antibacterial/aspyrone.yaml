definition: A member of the class of 2-pyranones that is 5,6-dihydro-2H-pyran-2-one
  in which the hydrogens at positions 3, 5S and 6R are replaced by (2S,3S)-3-methyloxiran-2-yl,
  hydroxy and methyl groups, respectively. It is a fungal metabolite isolated from
  Aspergillus melleus and exhibits nematicidal, antibacterial and antifungal properties.
