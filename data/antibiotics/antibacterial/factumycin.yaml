definition: Factumycin is a kirromycin-like antibiotic produced by Kitasatospora setae
  and Streptomyces strains. Its biosynthetic cluster has been characterized which
  has interesting acetyl transferase domains in trans, or outside of the polyketide
  synthase domains. Factumycin has specific, rather than broad spectrum, antibacterial
  properties, especially targeting various Acinetobacter baumanii strains.
