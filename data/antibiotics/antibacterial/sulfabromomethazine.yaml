definition: A sulfonamide consisting of 5-bromo-4,6-dimethylpyrimidine with a 4-aminobenzenesulfonamido
  group at the 2-position. A long-acting derivative of sulfamezathine, it is used
  in the poultry, swine and cattle industries for the treatment of coccidiosis and
  various bacterial infections.
