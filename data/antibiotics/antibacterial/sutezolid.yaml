  evidence:
  - reference: DOI:10.1128/AAC.01182-08
    snippet: Williams et al. evaluated the thiomorpholinyl oxazolidinone PNU-100480
      (sutezolid) against Mycobacterium tuberculosis H37Rv, reporting an MIC of 0.25
      ug/mL (twofold lower than linezolid) and markedly superior sterilizing bactericidal
      activity in a murine tuberculosis model both alone and in combination with first-line
      antitubercular drugs.
    notes: Reported by Williams et al. 2009 (Antimicrob Agents Chemother 53:1314-1319;
      PMID:19075058) and Barbachyn et al. 1996 (J Med Chem 39:680-685; DOI:10.1021/jm950956y)
      as a thiomorpholinyl oxazolidinone antitubercular agent (PNU-100480, U-100480)
      that inhibits mycobacterial 50S ribosomal protein synthesis. PubChem CID 465951
      supplies the standard InChI, InChIKey, formula, and isomeric SMILES for sutezolid.
