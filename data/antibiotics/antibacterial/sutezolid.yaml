  evidence:
  - reference: DOI:10.1128/AAC.01182-08
    snippet: Williams et al. reported that PNU-100480 (sutezolid), an oxazolidinone
      bacterial protein synthesis inhibitor targeting the 50S ribosomal subunit, had
      MICs <= 0.5 ug/mL against Mycobacterium tuberculosis and showed superior sterilizing
      activity to linezolid in a murine tuberculosis model.
    notes: Williams et al. 2009 (PMID:19064896) characterized PNU-100480 (sutezolid)
      and its sulfoxide metabolite PNU-101603 as 50S ribosomal subunit translation
      inhibitors active against drug-susceptible and multidrug-resistant Mycobacterium
      tuberculosis.
