identifier: CHEBI:142133
label: trichosetin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A member of the class of octahydronaphthalenes that is (2R,4aS,5R,6R,8aS)-2,5-dimethyl-6-[(1E)-prop-1-en-1-yl]-1,2,3,4,4a,5,6,8a-octahydronaphthalene
  in which the hydrogen at position 5 has been replaced by a (Z)-hydroxy[(5S)-5-(hydroxymethyl)-2,4-dioxopyrrolidin-3-ylidene]methyl
  group. Produced by the dual culture of Trichoderma harzianum and Catharanthus roseus
  callus, it exhibits significant antimicrobial activity against Gram-positive bacteria
  such as Staphylococcus aureus and Bacillus subtilis.
