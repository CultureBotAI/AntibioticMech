definition: A 1,8-naphthyridine derivative that is 1,4-dihydro-1,8-naphthyridine with
  an ethyl group at the 1 position, a carboxy group at the 3-position, an oxo sustituent
  at the 4-position, a fluoro substituent at the 5-position and a piperazin-1-yl group
  at the 7 position. An antibacterial, it is used in the treatment of urinary-tract
  infections and gonorrhoea.
