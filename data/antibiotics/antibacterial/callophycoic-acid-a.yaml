identifier: CHEBI:65557
label: callophycoic acid A
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A dibenzooxepine diterpenoid that is hexahydrodibenzo[b,e]oxepine with
  an isolated double bond between positions 6a and 7 and is substituted by a bromo,
  a carboxy, a 3E-4,8-dimethylnona-3,7-dien-1-yl and a methyl group at positions 9,
  2, 10 and 10 respectively (the 9S,10S,10aR stereoisomer). It is isolated from the
  Fijian red alga Callophycus serratus and exhibits antibacterial, antimalarial and
  anticancer activities.
