  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Inhibition of bacterial energy-coupling factor (ECF) vitamin
    uptake (IC50 = 4 uM in Lactobacillus casei vitamin transport assays), rapid time-kill
    bactericidal activity against Enterococcus faecium, whole-cell MICs of 1 to 9
    ug/mL against Enterococcus faecalis, Enterococcus faecium, and Streptococcus pneumoniae,
    and in vivo efficacy in Galleria mellonella and Danio rerio S. pneumoniae infection
    models (Exapicheidou et al. 2026, DOI:10.1021/acs.jmedchem.5c02721).
  evidence_status: PRIMARY_EVIDENCE
