  - reference: DOI:10.1021/acs.jmedchem.5c02721
    snippet: Exapicheidou et al. reported that compound 18 inhibited Enterococcus
      faecalis, Enterococcus faecium, and Streptococcus pneumoniae strains with MIC
      values of 1 to 9 ug/mL, inhibited Lactobacillus casei vitamin uptake with an
      IC50 of 4 uM, and improved larval survival in a Galleria mellonella Streptococcus
      pneumoniae infection model.
    notes: Exapicheidou et al. 2026 (J Med Chem 69:14069-14084; DOI:10.1021/acs.jmedchem.5c02721)
      optimized compound 18 as a potent inhibitor of Gram-positive bacterial energy-coupling
      factor (ECF) transporters with in vitro and in vivo antibacterial efficacy against
      Enterococcus and Streptococcus species.
