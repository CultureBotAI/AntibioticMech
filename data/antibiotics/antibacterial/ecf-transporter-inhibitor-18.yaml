mode_of_action_notes: 'CURATOR: Synthetic salicylic acid derivative (compound 18)
  that inhibits Gram-positive bacterial energy-coupling factor (ECF) transmembrane
  vitamin transporters (IC50 = 4 uM in Lactobacillus casei vitamin uptake assays),
  blocking essential micronutrient translocation and producing bactericidal activity
  against Enterococcus faecalis, Enterococcus faecium, and Streptococcus pneumoniae
  (MIC 1-9 ug/mL; Exapicheidou et al. 2026, DOI:10.1021/acs.jmedchem.5c02721).'
