identifier: CHEBI:7528
label: netilmycin
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: Netilmicin is a member of the aminoglycoside family of antibiotics. These
  antibiotics have the ability to kill a wide variety of bacteria by binding to the
  bacterial 30S ribosomal subunit, causing misreading of mRNA and leaving the bacterium
  unable to synthesize proteins vital to its growth. Netilmicin is not absorbed from
  the gut and is therefore only given by injection or infusion. It is only used in
  the treatment of serious infections particularly those resistant to gentamicin.
definition_source: PMID:10103173
