  evidence:
  - reference: DOI:10.1093/jac/dkt411
    snippet: Locher et al. characterized cadazolid (ACT-179811) against Clostridioides
      difficile strains including fluoroquinolone- and linezolid-resistant isolates,
      reporting an MIC50 of 0.125 mg/L and MIC90 of 0.25 mg/L, potent inhibition of
      C. difficile protein synthesis (IC50 0.08 to 0.31 mg/L), and inhibition of toxin
      and spore formation.
    notes: Reported by Locher et al. 2014 (J Antimicrob Chemother 69:719-726; PMID:24176982)
      and Baldoni et al. 2014 (Antimicrob Agents Chemother 58:901-908; DOI:10.1128/AAC.01789-13)
      as a hybrid oxazolidinone-fluoroquinolone antibacterial (ACT-179811, CAS 1025097-10-2)
      that primarily inhibits bacterial translation and weakly inhibits DNA gyrase
      in Clostridioides difficile. The IUPAC structure from DOI:10.1093/jac/dkt411
      was normalized with RDKit to derive the standard InChI and InChIKey.
