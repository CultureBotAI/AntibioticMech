  evidence:
  - reference: DOI:10.1093/jac/dkt411
    snippet: Cadazolid is a novel quinoxolidinone antibiotic that potently inhibits
      Clostridium difficile protein synthesis, including in linezolid-resistant strains,
      and prevents toxin A/B and spore formation while also weakly inhibiting DNA
      synthesis.
    notes: Locher et al. 2014 (PMID:24128668) demonstrated by macromolecular labeling
      and cell-free translation assays in C. difficile that cadazolid acts primarily
      by inhibiting bacterial ribosomal protein synthesis (IC50 0.08-0.31 ug/mL),
      with >60-fold weaker secondary inhibition of DNA synthesis.
