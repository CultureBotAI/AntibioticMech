  evidence:
  - reference: DOI:10.1128/AAC.40.9.2142
    snippet: Singh et al. tested the tricyclic beta-lactam (trinem) sanfetrinem (GV104326)
      against 287 Gram-positive organisms and reported MIC90 values of <=0.03 to 0.06
      ug/mL for Streptococcus pyogenes, Streptococcus agalactiae, and penicillin-susceptible
      Streptococcus pneumoniae, 0.125 ug/mL for methicillin-susceptible Staphylococcus
      aureus, and 1 ug/mL for ampicillin-susceptible Enterococcus faecalis.
    notes: Reported by Singh et al. 1996 (Antimicrob Agents Chemother 40:2142-2146;
      PMID:8878596) and Di Modugno et al. 1994 (Antimicrob Agents Chemother 38:2362-2368;
      DOI:10.1128/AAC.38.10.2362) as a broad-spectrum tricyclic carbapenem/trinem
      beta-lactam antibiotic (GV104326) with high stability to beta-lactamases and
      potent activity against Gram-positive, Gram-negative, anaerobic, and mycobacterial
      pathogens. PubChem CID 71452 supplies the standard InChI, InChIKey, formula,
      and isomeric SMILES for sanfetrinem.
