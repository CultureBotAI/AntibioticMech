definition: A synthetic monocyclic β-lactam antibiotic (monobactam), used primarily
  to treat infections caused by Gram-negative bacteria. It inhibits mucopeptide synthesis
  in the bacterial cell wall, thereby blocking peptidoglycan crosslinking.
