  evidence:
  - reference: DOI:10.1016/j.molcel.2014.09.020
    snippet: Polikanov et al. solved the 2.4 A crystal structure of amicoumacin A
      bound to the Thermus thermophilus 70S ribosome, showing that amicoumacin A bridges
      16S rRNA bases in the E-site of the 30S subunit and the mRNA backbone to block
      translocation, and demonstrated that 16S rRNA mutations C795U, A794G, or G693A
      increase the Escherichia coli Delta-tolC MIC from 0.5-1 ug/mL to 4-8 ug/mL.
    notes: Reported by Polikanov et al. 2014 (Mol Cell 56:531-540; PMID:25306920)
      and Lama et al. 2012 (Antimicrob Agents Chemother 56:2802-2807; DOI:10.1128/AAC.00147-12)
      as a Bacillus dihydroisocoumarin natural-product antibiotic (MIC 0.25-0.78 ug/mL
      against methicillin-resistant Staphylococcus aureus) that stabilizes mRNA in
      the 30S ribosomal E-site. PubChem CID 25223631 supplies the standard InChI,
      InChIKey, formula, and isomeric SMILES for amicoumacin A.
