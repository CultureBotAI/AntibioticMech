  evidence:
  - reference: DOI:10.1016/j.molcel.2014.09.020
    snippet: Polikanov et al. solved the 2.4 A crystal structure of amicoumacin A
      bound to the Thermus thermophilus 70S ribosome, showing that amicoumacin A bridges
      16S rRNA bases in the E-site of the 30S subunit and the mRNA backbone to block
      translocation, and demonstrated that 16S rRNA mutations C795U, A794G, or G693A
      increase the Escherichia coli Delta-tolC MIC from 0.5-1 ug/mL to 4-8 ug/mL.
    notes: Polikanov et al. 2014 (Mol Cell 56:531-540; PMID:25306919; PDB:4W2F) established
      that amicoumacin A simultaneously contacts conserved 16S rRNA nucleotides (U788,
      A794, C795 in helix 24 and G693 in helix 23) and the E-site mRNA phosphate-ribose
      backbone in the 30S ribosomal subunit without a primary target protein contact.
