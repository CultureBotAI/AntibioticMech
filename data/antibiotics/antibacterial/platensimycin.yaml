resistance_mechanisms:
- mechanism_type: ANTIBIOTIC_TARGET_REPLACEMENT
  label: ptmP3-associated reported resistance to platensimycin in a laboratory Streptomyces
    albidoflavus derivative
  gene_families:
  - ptmP3
  taxon_label: Streptomyces albidoflavus
  strain: SB12011
  phenotype_label: reported resistance to platensimycin
  assay: Source-reported growth susceptibility assays; qualitative result only
  note: 'Primary functional evidence in a laboratory S. albus derivative; S. albus
    J1074 is the host background, not the derivative. Streptomyces platensis MA7327
    is the native donor, not the tested host. The coarse route follows the authors''
    interpretation; it is not an independent kinetic or exact-allele validation. Donor
    reference UniProtKB:D8L2W8 (entry version 45, sequence version 1; EMBL:FJ655920
    / ACS13710.1) matches the paper''s PtmP3 archive accession. This is not an experimental
    construct or allele assignment. PtnP3 is not substituted for the tested PtmP3.
    NCBITaxon:58346 is a donor species reference; NCBITaxon:1888 is a host species-name
    reference. The J1074 taxonomy search is ambiguous. No exact allele, strain TaxID,
    genome, numerical AST or clinical category is assigned. Species-grounding update
    (2026-10-14): the source-reported J1074 host lineage is grounded to Streptomyces
    albidoflavus (NCBITaxon:1886), using the published J1074 background chromosome
    CP004370.1 and its ENA taxonomic metadata, with agreeing UniProt species rank
    and name. The preceding NCBITaxon:1888 and J1074 name-search statements retain
    historical reference context, not the current species assignment. This is species-level
    lineage grounding, not resequencing or exact identity validation of the tested
    derivative. CP004370.1 and its associated sample and study remain background references
    only; no experimental genome, sample, strain TaxID or protein allele is assigned.
    Donor references and the original phenotype and mechanism limitations remain unchanged.'
  evidence:
  - reference: PMID:24560608
    notes: Accepted author manuscript, Results pages 4-5, Discussion pages 6-7, Figure
      2 and Table 1. Donor, host background and derivative are distinct; the coarse
      route is the authors' interpretation. Supplements were not inspected.
  - reference: PMID:24495463
    notes: 'Host-lineage context only: Establishing strain ancestry distinguishes
      J1074 from its S. albus G ancestor; Sequence accession id reports CP004370 for
      the J1074 background. This genome paper is not evidence for the resistance-study
      derivatives'' exact genomes.'
