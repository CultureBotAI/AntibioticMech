definition: A phenylpropanoid formally derived from guaiacol with an allyl chain substituted
  para to the hydroxy group. It is a major component of clove essential oil, and exhibits
  antibacterial, analgesic and antioxidant properties. It has been widely used in
  dentistry to treat toothache and pulpitis.
