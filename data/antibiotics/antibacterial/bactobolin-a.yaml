causal_graphs:
- graph_id: bactobolin_a_ul2_50s_translation_termination_inhibition
  title: Bactobolin A binds 50S ribosomal subunit protein uL2 (RplB) at the P-site
    tRNA interface to inhibit bacterial translation
  description: Bactobolin A binds a conserved pocket on the bacterial 50S ribosomal
    subunit formed by ribosomal protein uL2 (RplB, centered on Glu236), 23S rRNA,
    and the CCA end of P-site tRNA, displacing the P-site tRNA 3'-CCA away from the
    peptidyl transferase center and impairing peptidyl transfer and translation termination.
