mode_of_action_target_scope: MICROBIAL_TARGET
mode_of_action_notes: Dichlorinated polyketide-peptide natural product that binds
  a distinct site on the bacterial 50S/30S ribosomal interface coordinating 16S rRNA
  helix 18, 23S rRNA, P-site tRNA, and ribosomal protein uL2 (DOI:10.1128/mBio.00499-12;
  PMID:23249812; DOI:10.1016/j.jmb.2014.12.018; PMID:25562208).
