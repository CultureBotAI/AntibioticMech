  evidence:
  - reference: DOI:10.1128/mBio.00499-12
    snippet: Chandler et al. identified quorum-sensing-controlled bactobolin A as
      the broad-spectrum antibiotic secreted by Burkholderia thailandensis, reported
      an MIC of 0.31 ug/mL against Bacillus subtilis 168, and demonstrated that resistance
      mutations map to the conserved uL2 (RplB) ribosomal protein (E236A or E236Q,
      increasing the B. subtilis MIC to 4.2 to 5.0 ug/mL).
    notes: Chandler et al. 2012 (mBio 3:e00499-12; PMID:23249812) showed that substitutions
      at Glu236 of Bacillus subtilis 168 50S ribosomal protein uL2 (RplB, UniProtKB:P42919)
      confer specific resistance to bactobolin A without cross-resistance to chloramphenicol,
      clindamycin, linezolid, or erythromycin; Amunts et al. 2015 (J Mol Biol 427:753-755;
      PMID:25562208; DOI:10.1016/j.jmb.2014.12.018; PDB:4WT8) resolved bactobolin
      A bound to the Thermus thermophilus HB8 70S ribosome in direct contact with
      uL2 (UniProtKB:P60405) and P-site tRNA CCA.
