  experimental_context: Selection and ectopic expression of spontaneous bactobolin
    A-resistant Bacillus subtilis 168 mutants mapping to rplB (50S ribosomal protein
    uL2 Glu236Ala and Glu236Gln) and 70S ribosome crystal structure (PDB:4WT8) showing
    direct contact with uL2 Glu236 (DOI:10.1128/mBio.00499-12; PMID:23249812; DOI:10.1016/j.jmb.2014.12.018).
