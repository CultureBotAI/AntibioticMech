  evidence:
  - reference: DOI:10.1128/mBio.00499-12
    snippet: Chandler et al. identified quorum-sensing-controlled bactobolin A as
      the broad-spectrum antibiotic secreted by Burkholderia thailandensis, reported
      an MIC of 0.31 ug/mL against Bacillus subtilis 168, and demonstrated that resistance
      mutations map to the conserved uL2 (RplB) ribosomal protein (E236A or E236Q,
      increasing the B. subtilis MIC to 4.2 to 5.0 ug/mL).
    notes: Reported by Chandler et al. 2012 (mBio 3:e00499-12; PMID:23249812) and
      Amunts et al. 2015 (J Mol Biol 427:753-755; DOI:10.1016/j.jmb.2014.12.018) as
      a Burkholderia thailandensis polyketide-peptide hybrid antibiotic that binds
      a unique site on the 50S ribosomal subunit coordinated by ribosomal protein
      uL2 and 23S rRNA together with P-site tRNA. PubChem CID 54676871 and ChEBI CHEBI:138579
      supply the standard InChI, InChIKey, formula, and isomeric SMILES for bactobolin
      A.
