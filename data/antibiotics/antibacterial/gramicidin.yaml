definition: Gramicidins are a family of antibiotics synthesized by Bacillus brevis.
  It includes the linear pentadecapeptides gramicidin A, B and C that make up the
  mixture gramicidin D. Gramicidin S is a cyclic peptide chain. Gramicidins are also
  components of tyrothricins, another mixture of antibiotics produced by Bacillus
  brevis.
