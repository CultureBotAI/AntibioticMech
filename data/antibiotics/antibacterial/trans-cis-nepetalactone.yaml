definition: A cyclopentapyran that is (4aS,7aS)-1,4a,5,6,7,7a-hexahydrocyclopenta[c]pyran
  substituted at position 1 by an oxo group and at positions 4 and 7 by methyl groups,
  respectively (the 4aS,7S,7aS-diastereomer). An iridoid monoterpenoid isolated from
  several Nepeta plant species. It exhibits potent repellant activity against house
  dust mites and mosquitoes.
