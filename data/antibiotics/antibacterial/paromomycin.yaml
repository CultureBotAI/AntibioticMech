identifier: CHEBI:7934
label: paromomycin
antimicrobial_class: ANTIBACTERIAL
curation_status: REVIEWED
grounding_status: EXACT
definition: An amino cyclitol glycoside that is the 1-O-(2-amino-2-deoxy-α-D-glucopyranoside)
  and the 3-O-(2,6-diamino-2,6-dideoxy-β-L-idopyranosyl)-β-D-ribofuranoside of 4,6-diamino-2,3-dihydroxycyclohexane
  (the 1R,2R,3S,4R,6S diastereoisomer). It is obtained from various Streptomyces species.
  A broad-spectrum antibiotic, it is used (generally as the sulfate salt) for the
  treatment of acute and chronic intestinal protozoal infections, but is not effective
  for extraintestinal protozoal infections. It is also used as a therapeutic against
  visceral leishmaniasis.
