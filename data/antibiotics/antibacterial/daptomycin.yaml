definition: A polypeptide comprising N-decanoyltryptophan, asparagine, aspartic acid,
  threonine, glycine, ornithine, aspartic acid, D-alanine, aspartic acid, glycine,
  D-serine, threo-3-methylglutamic acid and 3-anthraniloylalanine (also known as kynurinine)
  coupled in sequence and lactonised by condensation of the carboxylic acid group
  of the 3-anthraniloylalanine with the alcohol group of the threonine residue.
