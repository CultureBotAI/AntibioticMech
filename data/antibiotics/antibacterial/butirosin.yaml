definition: Butirosin is an aminoglycoside antibiotic used to treat different types
  of bacterial infections. Butirosin works by binding to the bacterial 30S ribosomal
  subunit, causing misreading of mRNA and leaving the bacterium unable to synthesize
  proteins vital to its growth.
