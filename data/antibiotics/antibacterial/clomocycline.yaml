definition: Tetracycline in which the hydrogen at position 7 is substituted by chlorine
  and a hydrogen attached to the amide nitrogen is substituted by a hydroxymethyl
  group. A tetracyline antibiotic, it is used to treat acne, urinary tract infections,
  gum disease, and other bacterial infections such as gonorrhoea and chlamydia.
