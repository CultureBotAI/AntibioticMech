definition: A homodetic cyclic peptide containing a 28-membered ring and consisting
  of 3-methyl-N-[(2E,4Z)-8-methylnona-2,4-dienoyl]-L-α-aspartyl, (2S)-2,3-diaminobutanoyl,
  D-valyl, L-lysyl, 3-hydroxy-L-α-aspartyl, L-α-aspartyl, glycyl, 3-methyl-D-α-aspartyl,
  L-valyl, and (4R)-methyl-L-proline joined in sequence and cyclised by condensation
  of the β-amino group of the 2,3-diaminobutanoyl residue with the carboxy group of
  the 4-methylproline residue.
