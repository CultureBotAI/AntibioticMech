definition: Albicidin phytotoxins produced by the sugarcane pathogen Xanthomonas albilineans
  is a potent DNA gyrase inhibitor with inhibitory effects significantly better than
  most DNA gyrase inhibitors. Albicidin acts primarily by inhibiting the religation
  of the cleaved DNA intermediate during the gyrase catalytic sequence similar to
  quinolones.
