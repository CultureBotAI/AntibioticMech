  evidence:
  - reference: DOI:10.1073/pnas.1414401111
    snippet: Olivier et al. determined the crystal structure of negamycin bound to
      the Escherichia coli 70S ribosome, showed that negamycin binds helix 34 of the
      30S ribosomal subunit head domain to induce translational stalling and miscoding
      (translation IC50 = 1.8 uM), and reported an MIC of 32 ug/mL against E. coli
      ATCC 25922 and single-rrn strain SQ110 that increased 16- to 32-fold upon 16S
      rRNA U1052G or U1060A mutation.
    notes: Reported by Olivier et al. 2014 (Proc Natl Acad Sci U S A 111:16274-16279;
      PMID:25368144) and Polikanov et al. 2014 (Mol Cell 56:541-550; DOI:10.1016/j.molcel.2014.09.021)
      as a Streptomyces pseudodipeptide hydrazide antibiotic targeting 16S rRNA helix
      34 in the 30S ribosomal decoding center. PubChem CID 11118411 and ChEBI CHEBI:198310
      supply the standard InChI, InChIKey, formula, and isomeric SMILES for negamycin.
