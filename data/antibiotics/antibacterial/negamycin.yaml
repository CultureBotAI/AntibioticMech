      demonstrated that negamycin binds 16S rRNA helix 34 and the A-site tRNA anticodon
      stem-loop in the 30S ribosomal subunit head domain.
causal_graphs:
- graph_id: negamycin_30s_helix_34_miscoding_and_stalling
  title: Negamycin binds 16S rRNA helix 34 and the A-site tRNA anticodon arm to induce
    miscoding and block translocation
  description: Negamycin binds the head domain of the bacterial 30S ribosomal subunit
    at 16S rRNA helix 34, contacts the sugar-phosphate backbone of the A-site aminoacyl-tRNA
    anticodon stem-loop, stabilizes near-cognate tRNA occupancy, and impairs mRNA-tRNA
    translocation and translational fidelity.
