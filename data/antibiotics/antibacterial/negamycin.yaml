definition: A natural pseudodipeptide hydrazide antibiotic ([2-[(3R,5R)-3,6-diamino-5-hydroxyhexanoyl]-1-methylhydrazinyl]acetic
  acid) that binds helix 34 of the bacterial 30S ribosomal subunit to impair translocation
  and induce miscoding.
