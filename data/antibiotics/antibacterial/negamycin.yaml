  experimental_context: X-ray crystal structure of negamycin bound to the Escherichia
    coli 70S ribosome (PDB:4W2I), single-molecule FRET tRNA-stabilization assays,
    and 16S rRNA helix 34 resistance mutations (U1052G, U1060A, A1197U) in E. coli
    SQ110 (DOI:10.1073/pnas.1414401111; PMID:25368144).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2014-11
  source_retrieved_on: '2026-10-25'
  evidence:
  - reference: DOI:10.1073/pnas.1414401111
    snippet: Olivier et al. determined the crystal structure of negamycin bound to
      the Escherichia coli 70S ribosome, showed that negamycin binds helix 34 of the
      30S ribosomal subunit head domain to induce translational stalling and miscoding
      (translation IC50 = 1.8 uM), and reported an MIC of 32 ug/mL against E. coli
      ATCC 25922 and single-rrn strain SQ110 that increased 16- to 32-fold upon 16S
      rRNA U1052G or U1060A mutation.
    notes: Olivier et al. 2014 (Proc Natl Acad Sci U S A 111:16274-16279; PMID:25368144;
