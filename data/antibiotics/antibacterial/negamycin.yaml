mode_of_action_notes: Pseudodipeptide natural product from Streptomyces purpeofuscus
  that binds the 16S rRNA helix 34 decoding center of the bacterial 30S ribosomal
  subunit, stabilizing near-cognate tRNA binding and inducing miscoding (DOI:10.1073/pnas.1414401111;
  PMID:25368144).
