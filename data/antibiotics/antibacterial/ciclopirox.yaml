identifier: CHEBI:453011
label: ciclopirox
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cyclic hydroxamic acid that is 1-hydroxypyridin-2(1H)-one in which the
  hydrogens at positions 4 and 6 are substituted by methyl and cyclohexyl groups,
  respectively. A broad spectrum antigfungal agent, it also exhibits antibacterial
  activity against many Gram-positive and Gram-negative bacteria, and has anti-inflammatory
  properties. It is used a a topical treatment of fungal skin and nail infections.
