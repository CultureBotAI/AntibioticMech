definition: Nifuratel is a nitrofuran antibiotic already in use for parasitic infections.
  It was effective against different serovars, including multidrug-resistant strains
  of Salmonella Typhimurium, and in macrophages from different host species and against
  Listeria monocytogenes and Shigella flexneri. It reduced IL-10 and STAT3 production
  in infected macrophages which should increase the inflammatory response against
  Salmonella.
