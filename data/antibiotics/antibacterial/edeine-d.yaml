definition: Edeine D is a subtype of edeine similar to edeine A with the beta-tyr
  replaced by beta-phe-beta-ala. Edeines bind to the 30S subunit to block fMet-tRNA
  interaction at the P site, inhibiting protein synthesis and subsequent structure/function
  processes critical for life or replication.
