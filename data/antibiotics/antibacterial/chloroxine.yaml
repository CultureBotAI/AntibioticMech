definition: A monohydroxyquinoline that is quinolin-8-ol in which the hydrogens at
  positions 5 and 7 have been substituted by chlorine. A synthetic antibacterial prepared
  by chlorination of quinolin-8-ol, it is used for the treatment of dandruff and seborrhoeic
  dermatitis of the scalp.
