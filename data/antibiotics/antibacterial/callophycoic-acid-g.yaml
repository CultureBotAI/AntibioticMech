definition: A monohydroxybenzoic acid that is 4-hydroxybenzoic acid substituted at
  position 3 by a decahydronaphthalen-1-ylmethyl group which in turn is substituted
  by a bromo, two methyl groups, a methylidene and a 4-methylpent-3-en-1-yl group
  at positions 6, 5, 8a, 2 and 5 respectively. A diterpenoid isolated from the Fijian
  red alga Callophycus serratus, it exhibits antibacterial, antimalarial and anticancer
  activities.
