definition: Oleandomycin is a 14-membered macrolide produced by Streptomyces antibioticus.
  It is ssimilar to erythromycin, and contains a desosamine amino sugar and an oleandrose
  sugar. It targets the 50S ribosomal subunit to prevent protein synthesis.
