- target_id: GO:0004156
  target_label: bacterial dihydropteroate synthase (FolP / DHPS)
  target_type: PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Purified Escherichia coli dihydropteroate synthase (FolP /
    DHPS) cell-free enzyme inhibition (I50) and PABA competitive kinetics alongside
    structural and biochemical characterization of pterin-sulfonamide dead-end adduct
    formation in bacterial DHPS for sulfasalazine and comparator para-aminobenzenesulfonamide/sulfone
    folate inhibitors (Roland et al. 1979, DOI:10.1128/AAC.15.2.195, PMID:378102;
    Yun et al. 2012, DOI:10.1126/science.1214641, PMID:22383845).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2012-03
  source_retrieved_on: '2026-11-08'
  evidence:
  - reference: DOI:10.1128/AAC.15.2.195
    snippet: Roland et al. quantified the cell-free inhibition (I50) of purified Escherichia
      coli dihydropteroate synthase by 27 sulfonamides and dapsone and correlated
      competitive DHPS enzyme inhibition with whole-cell antibacterial MICs.
    notes: Roland et al. 1979 (Antimicrob Agents Chemother 15:195-197; PMID:378102)
      measured direct inhibition of purified Escherichia coli dihydropteroate synthase
      (FolP / DHPS) by sulfasalazine and comparator folate-pathway inhibitors.
  - reference: DOI:10.1126/science.1214641
    notes: Yun et al. 2012 (Science 335:1110-1114; PMID:22383845) resolved the structural
      and catalytic mechanism of sulfonamide/sulfone binding at the PABA site of bacterial
      dihydropteroate synthase (DHPS / FolP), demonstrating pterin-sulfa adduct catalysis
      and resistance loop mutations.
