  evidence:
  - reference: DOI:10.1021/ol902290v
    snippet: 2-Demethylenepamamycin-621A (pamamycin-621A) was isolated from Streptomyces
      alboniger as a 16-membered macrodiolide polyketide antibiotic that inhibits
      the growth of Gram-positive bacteria and mycobacteria and stimulates aerial
      mycelium formation.
    notes: Reported by Ren and Wu 2009 (Org Lett 11:5638-5641; PMID:19924823) and
      Rebets et al. 2015 (J Am Chem Soc 137:12031-12037; DOI:10.1021/jacs.5b05606)
      as a 16-membered macrodiolide ionophore antibiotic from Streptomyces alboniger.
      MIBiG 4.0.1 entry BGC0001150, ChEBI CHEBI:219230, and PubChem CID 10508137 supply
      the stereo-complete SMILES, Standard InChI, and InChIKey.
