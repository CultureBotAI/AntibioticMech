mode_of_action_notes: 'CURATOR: 16-Membered macrodiolide cation-ionophore antibiotic
  from Streptomyces alboniger that mediates transmembrane alkali-metal cation transport
  and disrupts Gram-positive bacterial and mycobacterial cytoplasmic membrane ion
  gradients (Natsume et al. 1995, DOI:10.7164/antibiotics.48.1159, PMID:7490225; Ren
  and Wu 2009, DOI:10.1021/ol902290v, PMID:19924823).'
