definition: The hemiethanolate hemihydrate of doxycycline hydrochloride. A semi-synthetic
  tetracycline antibiotic, it is used to inhibit bacterial protein synthesis and treat
  non-gonococcal urethritis and cervicitis, exacerbations of bronchitis in patients
  with chronic obstructive pulmonary disease (COPD), and adult periodontitis.
