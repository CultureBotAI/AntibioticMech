identifier: CHEBI:192380
label: cefaloram
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A cephalosporin derivative with potent antibacterial activity which binds
  to and inactivates penicillin-binding proteins (PBPs) located on the inner membrane
  of the bacterial cell wall. PBPs are enzymes involved in the terminal stages of
  assembling the bacterial cell wall and in reshaping the cell wall during growth
  and division, inactivation of which interferes with the cross-linkage of peptidoglycan
  chains necessary for bacterial cell wall strength and rigidity, resulting in the
  weakening of the bacterial cell wall and causing cell lysis.
