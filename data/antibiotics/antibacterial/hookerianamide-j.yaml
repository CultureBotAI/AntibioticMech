definition: A steroid alkaloid that is 5α-preg-16-ene substituted by a hydroxy group
  at position 4, a N,N-dimethylamino group at position 20 and a N-senecoylamino group
  at position 3 (the 3β,4β,20S stereoisomer). Isolated from Sarcococca hookeriana,
  it exhibits antileishmanial and antibacterial activities.
