definition: Gramicidin D is a mixture of the linear peptides gramicidin A, B, and
  C, each with 15 alternating L- and D-amino acids. They are active against most gram-positive
  bacteria and select gram-negative bacteria. These compounds create channels in the
  bacterial membrane and increase the permeability to cations.
