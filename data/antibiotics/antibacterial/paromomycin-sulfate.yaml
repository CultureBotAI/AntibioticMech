identifier: CHEBI:7935
label: paromomycin sulfate
antimicrobial_class: ANTIBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: An aminoglycoside sulfate salt resulting from the treatment of paromomycin
  with sulfuric acid. A broad-spectrum antibiotic, it is used for the treatment of
  acute and chronic intestinal protozoal infections, but is not effective for extraintestinal
  protozoal infections. It is also used as a therapeutic against visceral leishmaniasis.
