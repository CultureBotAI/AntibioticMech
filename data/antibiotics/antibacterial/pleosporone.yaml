definition: A carbotricyclic compound that is 1,2,3,4-tetrahydroanthracene-9,10-dione
  substituted by hydroxy groups at positions 1, 2, 3 and 8 and a methyl group at position
  6. It is isolated from a pleosporalean ascomycete (MF7028), an endophytic fungus
  from Anthyllis vulneraria and exhibits modest antibacterial activity against a number
  of bacterial strains. Additionally it exhibits cytotoxicity against HeLa cells.
