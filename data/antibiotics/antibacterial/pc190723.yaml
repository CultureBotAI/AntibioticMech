  evidence:
  - reference: DOI:10.1126/science.1159961
    snippet: Haydon et al. reported that the difluorobenzamide derivative PC190723
      inhibited cell division FtsZ GTPase activity in a concentration-dependent manner
      (IC50 = 55 ng/mL), exhibited potent bactericidal activity against all tested
      Staphylococcus strains including methicillin- and multidrug-resistant Staphylococcus
      aureus at MICs of 0.5 to 1.0 ug/mL, and cured mice in a lethal S. aureus septicemia
      model.
    notes: Reported by Haydon et al. 2008 (Science 321:1673-1675; PMID:18801997) as
      a 3-[(6-chloro[1,3]thiazolo[5,4-b]pyridin-2-yl)methoxy]-2,6-difluorobenzamide
      antibacterial that binds the interdomain cleft of the bacterial cytokinetic
      protein FtsZ and blocks Z-ring constriction. PubChem CID 25016417 supplies the
      standard InChI, InChIKey, formula, and SMILES for PC190723.
