definition: An organic heterohexacyclic compound that is 6,7,12,13-tetrahydro-5H-indolo[2,3-a]pyrrolo[3,4-c]carbazole
  in which the hydrogens at positions 5 and 7 are substituted by a methoxycarbonyl
  and oxo groups, respectively. It is synthesized by a gene cluster found in environmental
  DNA and exhibits cytotoxic activity against human HCT116 cancer cells and Staphylococcus
  aureus.
