definition: A member of the class of 1,2-thiazole that is 1,2-thiazol-3-one substituted
  on the nitrogen (position 2) by an octyl group. A fungicide and antibacterial agent,
  it is used for treatment of canker and other fungal and bacterial diseases in fruit
  trees. It is no longer approved for use within the European Union.
