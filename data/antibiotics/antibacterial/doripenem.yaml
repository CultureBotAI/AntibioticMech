definition: Doripenem is a carbapenem with a broad range of activity against Gram-positive
  and Gram-negative bacteria, and along with meropenem, it is the most active beta-lactam
  antibiotic against Pseudomonas aeruginosa. It inhibits bacterial cell wall synthesis.
