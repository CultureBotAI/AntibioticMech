definition: Efrotomycin is produced by Streptomyces lactamodurans NRRL 3802. This
  kirromycin-like antibiotic is used in animal agriculture, especially in the production
  of swine. Generally gram negative bacteria are susceptible to efrotomycin, while
  gram positive bacteria are resistant.
