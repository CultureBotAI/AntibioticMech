definition: A semicarbazone resulting from the formal condensation of semicarbazide
  with 5-nitrofuraldehyde. A broad spectrum antibacterial drug, although with little
  activity against Pseudomonas species, it is used as a local application for burns,
  ulcers, wounds and skin infections.
