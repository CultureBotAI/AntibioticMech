mode_of_action_notes: 'CURATOR: PMID:10446055 resolved mupirocin in a 2.2-angstrom
  Staphylococcus aureus isoleucyl-tRNA synthetase (IleRS)-tRNA(Ile) complex. The structure
  directly supports inhibition of IleRS and hence isoleucyl-tRNA production; the paper
  focused on tRNA editing geometry rather than reporting an enzyme inhibition constant.'
