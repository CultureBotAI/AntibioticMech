  taxon_id: NCBITaxon:2
  taxon_label: Bacteria
  experimental_context: Gram-positive bacterial susceptibility and macrodiolide cation-ionophore
    membrane-transport structure-activity characterization of pamamycin congeners
    including pamamycin-649B (Natsume et al. 1995, DOI:10.7164/antibiotics.48.1159,
    PMID:7490225; Renner et al. 2011, DOI:10.1002/chem.201102093).
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 1995-10
  source_retrieved_on: '2026-11-03'
  evidence:
  - reference: DOI:10.7164/antibiotics.48.1159
    snippet: Natsume et al. characterized the structure-activity relationships of
      pamamycin macrodiolide homologues from Streptomyces alboniger, showing that
      the dimethylamino-substituted 16-membered macrodiolide ionophore scaffold mediates
      antimicrobial activity against Gram-positive bacteria.
    notes: Natsume et al. 1995 (J Antibiot 48:1159-1166; PMID:7490225) established
      the cation-ionophore and membrane-depolarizing structure-activity relationships
      of pamamycin macrodiolide antibiotics against Gram-positive bacteria.
  - reference: DOI:10.1002/chem.201102093
    notes: Renner et al. 2011 (Chem Eur J 17:10893-10900) completed the total synthesis
      and structural confirmation of the 16-membered macrodiolide antibiotic pamamycin-649B.
