definition: Nocardamine is a cyclic trihydroxamate. It belongs to a group of microbial
  siderophores which form complexes with iron and aluminum ions. Nocardamine was described
  first as an antibiotic active against mycobacteria and proteus. It is produced by
  Nocardia species, several Streptomyces species, Chromobacterium and Pseudomonas.
