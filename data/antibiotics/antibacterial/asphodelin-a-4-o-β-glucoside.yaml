definition: A β-D-glucoside in which a β-D-glucopyranosyl residue is attached at position
  4' of asphodelin A via a glycosidic linkage. It is isolated from the roots of Asphodelus
  microcarpus and exhibits antimicrobial activity against bacteria like Staphylococcus
  aureus, Escherichia coli and Pseudomonas aeruginosa and fungal microorganisms like
  Candida albicans and Botrytis cinerea.
