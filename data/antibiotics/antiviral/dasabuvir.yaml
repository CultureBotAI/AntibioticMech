definition: A member of the class of pyrimidone, which is (as the monohydrate of its
  sodium salt) in combination with ombitasvir, paritaprevir and ritonavir (under the
  trade name Viekira Pak) for treatment of chronic hepatitis C virus genotype 1 infection
  as well as cirrhosis of the liver.
