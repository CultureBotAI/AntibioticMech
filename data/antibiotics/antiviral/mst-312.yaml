definition: A member of the class of benzamides that results from the formal condensation
  of the two amino groups of benzene-1,3-diamine with the carboxylic acid groups of
  two molar equivalents of 2,3-dihydroxybenzoic acid. It is telomerase inhibitor (IC50
  = 0.67 μM in a TRAP assay) and exhibits antineoplastic activity.
