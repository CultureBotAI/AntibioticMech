resistance_mechanisms:
- mechanism_type: ANTIBIOTIC_TARGET_ALTERATION
  label: HCV NS3 V36, T54, R155, and A156 resistance-associated substitutions
  gene_families:
  - HCV NS3 serine protease
  note: 'Longitudinal clonal sequencing detected substitutions at these NS3 positions
    during narlaprevir exposure; participants with detected substitutions had a smaller
    viral-load decline, and R155K persisted in two participants for 3.1 years. Taxon
    grounding only: the source calls the virus HCV. The clinical association does
    not establish an individual patient''s UniProt accession, strain TaxID or genome.
    No allele coordinates or resistance measurements were added.'
  evidence:
  - reference: PMID:24168257
    notes: Primary treatment-exposure, clonal-sequencing, and viral-load study.
  - reference: https://rest.uniprot.org/taxonomy/3052230
