identifier: CHEBI:173104
label: narlaprevir
antimicrobial_class: ANTIVIRAL
curation_status: REVIEWED
grounding_status: EXACT
definition: An azabicyclohexane that is (1R,5S)-6,6-dimethyl-3-azabicyclo[3.1.0]hexane
  substituted by [(3S)-1-(cyclopropylamino)-1,2-dioxoheptan-3-yl]aminoacyl and N-({1-[(tert-butylsulfonyl)methyl]cyclohexyl}carbamoyl)-3-methyl-L-valyl
  groups at positions 2S and 3, respectively. It is a hepatitis C virus (HCV) NS3/4A
  serine protease inhibitor (Ki = 6 nM) that is used for the treatment of chronic
  hepatitis C.
