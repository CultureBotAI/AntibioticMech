definition: A monocarboxylic acid that is 3,8-dimethyl-5-oxo-1,2,3,4,4a,8a-hexahydronaphthalene-1-carboxylic
  acid substituted by a (2R)-hexan-2-yl at position 7, a hydroxy group at position
  6 and a 3-hydroxypropanoyl group at position 8. It is a fungal metabolite produced
  by Cytospora with HIV-1 integrase inhibitory activity.
