definition: A tetracyclic triterpenoid that is A,B-dihomo-19-nor-4-oxalanosta-1,8,19,24-tetraen-26,22-olide
  substituted by an acetoxy group at position 15, a hydroxy group at position 23 and
  an oxo group at position 3 (the 22S, 23R stereoisomer). It is isolated from the
  fruiting bodies of the Vietnamese mushroom Ganoderma colossum and displays inhibitory
  activity towards the enzyme HIV protease.
