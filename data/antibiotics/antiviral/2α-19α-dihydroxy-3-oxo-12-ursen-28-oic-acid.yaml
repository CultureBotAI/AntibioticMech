definition: A pentacyclic triterpenoid that is urs-12-ene substituted by a carboxy
  group at position 28, α-configured hydroxy groups at positions 2 and 19 and an oxo
  group at position 3. Isolated from the whole plants of Geum japonicum, it exhibits
  activity against HIV-1 protease.
