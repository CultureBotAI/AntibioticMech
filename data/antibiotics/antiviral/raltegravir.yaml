definition: A pyrimidone that is pyrimidin-4(3H)-one in which the hydrogens at positions
  2, 3, 5 and 6 are replaced by 2-[(5-methyl-1,3,4-oxadiazole-2-carbonyl)amino]propan-2-yl,
  methyl, hydroxy, and N-[(4-fluorophenyl)methyl]aminoacyl groups, respectively. It
  is an antiretroviral drug used for treatment of HIV infection.
