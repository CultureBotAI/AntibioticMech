mode_of_action_notes: 'CURATOR: PMID:21030679 reports raltegravir-bound retroviral
  intasome cocrystal structures that establish the integrase strand-transfer inhibitor
  binding mode and explain resistance-associated active-site rearrangements. The structural
  model uses prototype foamy virus integrase, with HIV-1 resistance positions mapped
  to homologous sites.'
