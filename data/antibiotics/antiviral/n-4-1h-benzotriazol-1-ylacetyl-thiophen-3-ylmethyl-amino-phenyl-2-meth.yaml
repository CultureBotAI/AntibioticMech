definition: A member of the class of benzotriazoles that is 1H-benzotriazole which
  is substituted by a 2-{[4-(2-methylpropanamido)phenyl][(thiophen-3-yl)methyl]amino}-2-oxoethyl
  group at position 1. It is a 3C-like protease inhibitor of SARS-CoV and bat coronavirus
  HKU4.
