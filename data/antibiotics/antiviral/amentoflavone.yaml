definition: A biflavonoid that is obtained by oxidative coupling of two molecules
  of apigenin resulting in a bond between positions C-3 of the hydroxyphenyl ring
  and C-8 of the chromene ring. A natural product found particularly in Ginkgo biloba
  and Hypericum perforatum.
