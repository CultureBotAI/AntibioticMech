definition: A member of the class of thienopyrans that is 7H-thieno[3,2-b]pyran-7-one
  substituted by 2,3-dihydro-1,4-benzodioxin-6-yl and morpholin-4-yl groups at positions
  3 and 5, respectively. It is a dual inhibitor of PI3K and BRD4 that exhibits antineoplastic
  activity.
