definition: A morphinane alkaloid from the opium poppy, in which the 5,6,8,14-tetradehydromorphinan-7-one
  skeleton is substituted at position 4 by a hydroxyl group, positions 3 and 6 by
  methoxy groups and position N17 by a methyl group. An intermediate in the biosynthesis
  of narcotic analgesics such as morphine and codeine.
