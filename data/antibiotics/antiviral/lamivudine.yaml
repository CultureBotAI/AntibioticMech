definition: A monothioacetal that consists of cytosine having a (2R,5S)-2-(hydroxymethyl)-1,3-oxathiolan-5-yl
  moiety attached at position 1. An inhibitor of HIV-1 reverse transcriptase, it is
  used as an antiviral in the treatment of AIDS and hepatitis B.
