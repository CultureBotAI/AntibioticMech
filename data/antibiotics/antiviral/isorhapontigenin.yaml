definition: A stilbenol that is trans-stilbene in which one of the phenyl groups is
  substituted by hydroxy groups at positions 3 and 5, while the other phenyl group
  is substituted by a methoxy group at position 3 and a hydroxy group at position
  4. It natural product isolated from the seeds of Aïphanes aculeata and has antioxidant,
  anti-tumour, and anti-inflammatory effects.
