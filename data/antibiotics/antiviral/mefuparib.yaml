definition: A member of the class of 1-benzofurans that is 1-benzofuran substituted
  by 4-[(methylamino)methyl]phenyl, fluoro and aminocarbonyl groups at positions 2,
  5, and 7, respectively. It is a potent inhibitor of poly(ADP-ribose) polymerases
  PARP1 and PARP2 (IC50 of 3.2 nM and 1.9 nM, respectively). The compound exhibits
  anti-cancer properties and has also shown promising antiviral activity against the
  virus that causes COVID-19.
