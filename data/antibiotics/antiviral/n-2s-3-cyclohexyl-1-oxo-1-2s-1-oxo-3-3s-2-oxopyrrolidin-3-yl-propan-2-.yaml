definition: A secondary carboxamide resulting from the formal condensation of the
  carboxy group of 1H-indole-2-carboxylic acid with the primary amino group of 3-cyclohexyl-N-{(2S)-1-oxo-3-[(3S)-2-oxopyrrolidin-3-yl]propan-2-yl}-L-alaninamide.
  It is an inhibitor of SARS coronavirus main proteinase and inhibits SARS-CoV-2 replication
  in cell culture (EC50 = 0.53 μM).
