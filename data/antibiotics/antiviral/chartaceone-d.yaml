definition: A dihydroxyflavanone that is flavanone substituted by hydroxy groups at
  positions 5 and 7, 6-carboxy-1-phenylhex-2-en-1-yl group at positions 6 and a 6-carboxy-1-phenylhex-1-en-3-yl
  group at position 8. It has been isolated as a racemate from the bark of Cryptocarya
  chartacea and exhibits inhibitory activity against dengue virus NS5 polymerase.
