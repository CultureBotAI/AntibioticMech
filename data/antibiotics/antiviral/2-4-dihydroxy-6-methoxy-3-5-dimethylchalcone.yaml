definition: A member of the class of chalcones that is trans-chalcone substituted
  by hydroxy groups at positions 2' and 4', a methoxy group at position 6' and methyl
  groups at positions 3' and 5'. Isolated from the buds of Cleistocalyx operculatus,
  it has been shown to exhibit inhibitory effects on the viral neuraminidases from
  two influenza viral strains, H1N1 and H9N2.
