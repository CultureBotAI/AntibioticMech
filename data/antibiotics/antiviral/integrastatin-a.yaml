definition: An organic heterotetracyclic compound that is 6H-6,12-epoxydibenzo[b,f]oxocin-11(12H)-one
  substituted by hydroxy groups at positions 4, 7 and 8, a hydroxymethyl group position
  1, methyl groups at positions 6 and 12 and methoxy groups at positions 3 and 9.
  It is isolated as a racemate from Unidentified fungi (New mexico) and has been shown
  to exhibit inhibitory activity against HIV-1 integrase.
