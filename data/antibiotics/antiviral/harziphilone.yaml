definition: A member of the class of isochromanes that is 1,5,6,7-tetrahydro-8H-isochromen-8-one
  substituted by hydroxy groups at positions 6 and 7, a methyl group at position 7
  and a penta-1,3-dien-1-yl moiety at position 3. Isolated from the fermentation broth
  of Trichoderma harzianum, it exhibits anti-HIV activity.
