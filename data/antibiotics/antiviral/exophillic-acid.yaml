definition: A monosaccharide derivative that is 4-(2,4-dihydroxy-6-nonylbenzoyloxy)-2-hydroxy-6-nonylbenzoic
  acid in which the hydroxy group at position 2 is replaced by a β-D-glucopyranosyloxy
  group.
