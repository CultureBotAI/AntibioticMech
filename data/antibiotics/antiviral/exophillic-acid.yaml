mode_of_action: MULTIPLE
mode_of_action_notes: 'CURATOR: exophillic acid has two compound-specific antiviral
  mechanisms in different systems. PMID:15015729 measured inhibition of HIV-1 integrase
  strand transfer (IC50 68 micromolar), whereas PMID:35458494 found that it interacts
  with host NTCP and blocks preS1-mediated attachment and entry of HBV and HDV without
  affecting intracellular HBV replication. The mixed viral and host targets make a
  single target-scope value inappropriate.'
