definition: An aryl sulfide that is (2E)-3-phenyl-N-(2-sulfanylphenyl)prop-2-enamide
  in which the hydrogen of the thiol group is substituted by a 3-(dimethylamino)propyl
  group. It is a 5-hydroxytryptamine receptor antagonist and an inhibitor of SARS-CoV
  replication.
