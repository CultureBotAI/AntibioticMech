mode_of_action_notes: 'CURATOR: PMID:32895623 determined a SARS-CoV-2 papain-like
  protease complex with GRL-0617 and measured protease inhibition. The inhibitor occupies
  the S3-S4 pockets and closes the BL2 loop over the substrate cleft. PMID:32726803
  further linked PLpro inhibition to reduced viral replication and preserved host
  antiviral signaling in infected cells.'
