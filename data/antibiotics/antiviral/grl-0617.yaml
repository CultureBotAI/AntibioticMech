definition: A benzamide resulting from the formal condensation of the carboxy group
  of 5-amino-2-methylbenzoic acid with the amino group of (1R)-1-(naphthalen-1-yl)ethan-1-amine.
  It is a potent noncovalent inhibitor (IC50 = 600 nM) of severe acute respiratory
  syndrome-coronavirus papain-like protease (SARS-CoV PLpro).
