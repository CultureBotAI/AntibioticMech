definition: A member of the class of 1,3-thiazoles that is 1,3-thiazole substituted
  by (2E)-2-(2-carboxybenzylidene)hydrazinyl and 2-chlorophenyl groups at positions
  2 and 4, respectively. It is a potent inhibitor of human dihydroorotate dehydrogenase
  (hDHODH) with IC50 of 32 nM. It exhibits antineoplastic activity and broad-spectrum
  antiviral activity against various RNA viruses including influenza A, Zika, Ebola,
  and SARS-CoV-2 viruses.
