definition: A ginsenoside found in Panax ginseng that is dammarane which is substituted
  by hydroxy groups at the 3β, 12β and 20 pro-S positions, in which the hydroxy groups
  at positions 3 and 20 have been converted to the corresponding β-D-glucopyranosyl-(1→2)-β-D-glucopyranoside
  and α-L-arabinopyranosyl-(1→6)-β-D-glucopyranoside respectively, and in which a
  double bond has been introduced at the 24-25 position.
