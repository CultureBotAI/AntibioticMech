definition: An organic heterotetracyclic compound that is 11,12-dihydro-2H,6H,10H-dipyrano[2,3-f:2',3'-h]chromen-2-one
  substituted by a hydroxy group at position 12, methyl groups at positions 6, 6,
  10 and 11 and a propyl group at position 4 (the 10S,11R,12S stereoisomer). Isolated
  from Calophyllum lanigerum var austrocoriaceum and Calophyllum brasiliense, it exhibits
  potent activity against HIV-1 reverse transcriptase.
