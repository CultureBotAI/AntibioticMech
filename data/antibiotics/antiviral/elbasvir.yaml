mode_of_action_notes: 'CURATOR: PMID:24127258 identified MK-8742 (elbasvir) as a hepatitis
  C virus NS5A inhibitor with activity across genotype replicons. PMID:26303801 mapped
  reduced susceptibility to NS5A substitutions at positions 30, 31, and 93. These
  functional studies identify NS5A but do not establish a compound-bound NS5A structure
  or direct binding.'
