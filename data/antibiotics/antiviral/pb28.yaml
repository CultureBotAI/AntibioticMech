definition: A member of the class of tetralins that is tetralin that is substituted
  by 3-(4-cyclohexylpiperazin-1-yl)propyl and methoxy groups at positions 1 and 5,
  respectively. It is a sigma 2 (σ2) receptor agonist (Ki = 0.68 nM) and exhibits
  antineoplastic and anti SARS-CoV-2 activities.
