definition: A member of the class of chalcones that is trans-chalcone substituted
  by a methyl group at position 3', hydroxy groups at positions 2' and 4' and a methoxy
  group at position 6'. Isolated from the buds of Cleistocalyx operculatus, it has
  been shown to exhibit inhibitory effects on the viral neuraminidases from two influenza
  viral strains, H1N1 and H9N2.
