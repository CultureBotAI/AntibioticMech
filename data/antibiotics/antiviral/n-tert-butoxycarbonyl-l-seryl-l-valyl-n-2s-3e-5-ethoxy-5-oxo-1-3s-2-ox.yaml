definition: A tripeptide that is L-seryl-L-valyl-L-leucine in which the amino group
  at the N-terminal is substituted by a tert-butoxycarbonyl group and the carboxy
  group at the C-terminal is substituted by a {(2S,3E)-5-ethoxy-5-oxo-1-[(3S)-2-oxopyrrolidin-3-yl]pent-3-en-2-yl}amino
  group. It is a 3C-like protease inhibitor of MERS-CoV and SARS-CoV.
