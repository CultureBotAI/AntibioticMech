definition: A member of the class of benzimidazoles that is 1H-benzimidazole substituted
  by methyl, [4-(trifluoromethyl)phenyl]amino, and {2-[5-(trifluoromethyl)-1H-imidazol-2-yl]pyridin-4-yl}oxy
  groups at positions 1, 2, and 5, respectively. It is an inhibitor of RAF kinases,
  including the BRAF V600E mutant.
