definition: A monohydroxyflavanone that is (2S)-flavanone substituted by a hydroxy
  group at position 5, a methoxy group at position 7, a methyl group at position 6
  and a formyl group at position 8. Isolated from Cleistocalyx operculatus, it has
  been shown to exhibit inhibitory effects on the viral neuraminidases from two influenza
  viral strains, H1N1 and H9N2.
