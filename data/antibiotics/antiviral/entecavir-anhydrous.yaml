identifier: CHEBI:473990
label: entecavir (anhydrous)
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: Guanine substituted at the 9 position by a 4-hydroxy-3-(hydroxymethyl)-2-methylidenecyclopentyl
  group. A synthetic analogue of 2'-deoxyguanosine, it is a nucleoside reverse transcriptase
  inhibitor with selective antiviral activity against hepatitis B virus. Entecavir
  is phosphorylated intracellularly to the active triphosphate form, which competes
  with deoxyguanosine triphosphate, the natural substrate of hepatitis B virus reverse
  transcriptase, inhibiting every stage of the enzyme's activity, although it has
  no activity against HIV. It is used for the treatment of chronic hepatitis B.
