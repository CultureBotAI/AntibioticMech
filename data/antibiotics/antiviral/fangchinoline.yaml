definition: A bisbenzylisoquinoline alkaloid that is (1β)- berbaman which has been
  substituted by methyl groups at the 2 and 2' positions, by methoxy groups at the
  6, 6', and 12 positions, and by a hydroxy group at position 7. Isolated from Stephania
  tetrandra, it has been found to possess neuroprotective and anti-tumour activity.
