definition: A member of the class of benzimidazoles that is 1-methyl-1H-benzimidazole
  which is substituted at positions 4, 5, and 6 by fluorine, (4-bromo-2-chlorophenyl)amino,
  and N-(2-hydroxyethoxy)aminocarbonyl groups, respectively. It is a MEK1 and MEK2
  inhibitor.
