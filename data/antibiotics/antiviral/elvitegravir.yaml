definition: A quinolinemonocarboxylic acid that is 7-methoxy-4-oxo-1,4-dihydroquinoline-3-carboxylic
  acid substited at position 1 by a 1-hydroxy-3-methylbutan-2-yl group and at position
  6 by a 3-chloro-2-fluorobenzyl group (the S-enantiomer). It is used in combination
  therapy for the treatment of HIV-1 infection.
