mode_of_action_notes: 'CURATOR: PMID:12235158 resolved ribavirin 5''-monophosphate
  bound to Tritrichomonas foetus IMP dehydrogenase. IMPDH catalyzes the rate-limiting
  step in GMP biosynthesis; its inhibition depletes guanine nucleotides needed for
  RNA and DNA synthesis. IMPDH is conserved across microbial and host cells, with
  isoform-dependent inhibitor sensitivity.'
