definition: A methoxyisoflavone that is isoflavone substituted by a methoxy group
  at position 5, a hydroxy group at position 7 and methyl groups at positions 6 and
  8. It has been isolated from the buds of Cleistocalyx operculatus and has been shown
  to exhibit inhibitory effects on the viral neuraminidases from two influenza viral
  strains,H1N1 and H9N2.
