mode_of_action_notes: 'CURATOR: PMID:23089758 measured picomolar daclatasvir activity
  against HCV NS5A genotype-3 replicons and selected NS5A resistance at residues 31
  and 93. PMID:23431163 combined viral-kinetic modeling with cell experiments and
  supported two effects: inhibition of viral RNA synthesis and of virion assembly/secretion.
  Direct compound-NS5A binding was not established.'
