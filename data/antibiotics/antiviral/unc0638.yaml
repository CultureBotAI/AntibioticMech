definition: A member of the class of quinazolines that is quinazoline substituted
  by cyclohexyl, [1-(propan-2-yl)piperidin-4-yl]amino, methoxy, and 3-(pyrrolidin-1-yl)propoxy
  groups at positions 2, 4, 6 and 7, respectively. It inhibits G9a and GLP histone
  methyltransferase activity (IC50 = <15 nM and <20 nM, respectively).
