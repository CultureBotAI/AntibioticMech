definition: An azabicyclohexane that is (1R,5S)-3-azabicyclo[3.1.0]hexane substituted
  by {(1S)-1-cyano-2-[(3S)-2-oxopyrrolidin-3-yl]ethyl}aminoacyl, 3-methyl-N-(trifluoroacetyl)-L-valinamide,
  methyl and methyl groups at positions 2S, 3, 6 and 6, respectively. It is the first
  orally administered inhibitor of SARS-CoV-2 main protease developed by Pfizer and
  used in combination with ritonavir for the treatment of COVID-19.
