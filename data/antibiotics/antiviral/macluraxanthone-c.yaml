definition: A member of the class of xanthones that is 9H-xanthen-9-one substituted
  by hydroxy groups at positions 1, 3, 5 and 6, a dimethylallyl group at position
  2 and a prenyl group at position 4. Isolated from Maclura tinctoria and Cudrania
  tricuspidata, it exhibits anti-HIV and antineoplastic activity.
