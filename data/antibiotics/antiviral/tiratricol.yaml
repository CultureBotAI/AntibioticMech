definition: A monocarboxylic acid that is (4-hydroxy-3,5-diiodophenyl)acetic acid
  in which the phenolic hydroxy group has been replaced by a 4-hydroxy-3-iodophenoxy
  group. It is a thyroid hormone analogue that has been used in the treatment of thyroid
  hormone resistance syndrome.
