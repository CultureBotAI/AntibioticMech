definition: A primary amino compound that is ethane-1,2-diamine in which the hydrogen
  on one of the amino groups is replaced by a 2-(aziridin-1-yl)ethyl group. It is
  a angiotensin-converting enzyme 2 (ACE2) inhibitor and a potential therapeutic agent
  for treating SARS coronavirus infections.
