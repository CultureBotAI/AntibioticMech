mode_of_action_notes: 'CURATOR: PMID:19841155 measured subnanomolar inhibition of
  HCV genotype 1a and 1b NS3/4A proteases by MK-7009 (vaniprevir), plus potent HCV
  replicon activity and selectivity against human proteases. PMID:23747481 confirmed
  antiviral activity in people with genotype 1 infection and identified resistance-associated
  NS3 variants.'
