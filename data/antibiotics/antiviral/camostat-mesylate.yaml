definition: A methanesulfonate (mesylate) salt prepared from equimolar amounts of
  camostat and methanesulfonic acid. It is a serine protease inhibitor approved and
  marketed in Japan in 1985 for the alleviation of acute symptoms associated with
  chronic pancreatitis. In 1994, it was approved for the treatment of postoperative
  reflux esophagitis.
