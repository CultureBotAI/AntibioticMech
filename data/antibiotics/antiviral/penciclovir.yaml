definition: A member of the class of 2-aminopurines that is guanine in which the hydrogen
  at position 9 is substituted by a 4-hydroxy-3-(hydroxymethyl)but-1-yl group. An
  antiviral drug, it is administered topically for treatment of herpes labialis. A
  prodrug, famciclovir, is used for oral administration.
