identifier: CHEBI:63580
label: ribavirin
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A 1-ribosyltriazole that is the 1-ribofuranosyl derivative of 1,2,4-triazole-3-carboxamide.
  A synthetic guanosine analogue, it is an inhibitor of HCV polymerase and possesses
  a broad spectrum of activity against DNA and RNA viruses.
