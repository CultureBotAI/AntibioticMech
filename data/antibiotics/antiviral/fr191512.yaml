definition: A polyphenol which is the benzoate ester obtained by formal condensation
  of the hydroxy ester derivative produced by the successive intermolecular condensation
  of 3 molecules of 2,4-dihydroxy-6-(2-hydroxypropyl)benzoic acid with the carboxy
  OH of o-orsellinic acid. It is isolated from the Fungus strain no.17415 and exhibits
  activity against the infectivity of influenza A virus.
