identifier: CHEBI:608828
label: enfuvirtide
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A synthetic 36-amino acid peptide consisting of N-acetyltyrosyl, threonyl,
  seryl, leucyl, isoleucyl, histidyl, seryl, leucyl, isoleucyl, α-glutamyl, α-glutamyl,
  seryl, glutaminyl, asparaginyl, glutaminyl, glutaminyl, α-glutamyl, lysyl, asparaginyl,
  α-glutamyl, α-glutamyl, α-glutamyl, leucyl, leucyl, α-glutamyl, leucyl, α-aspartyl,
  lysyl, tryptophyl, alanyl, seryl, leucyl, tryptophyl, asparaginyl, tryptophyl, and
  phenylalaninamide residues joined in sequence. An HIV fusion inhibitor, it was the
  first of a novel class of antiretroviral drugs used in combination therapy for the
  treatment of HIV-1 infection. It interferes with entry of HIV into cells by binding
  to the gp41 sub-unit of the viral envelope glycoprotein, so inhibiting fusion of
  viral and cellular membranes.
