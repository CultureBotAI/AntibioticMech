definition: An aminopyrimidine that is 6-methylpyrimidine-2,4-diamine in which the
  amino groups at positions 2 and 4 are substituted by 5-(diethylamino)pentan-2-yl
  and 4-amino-2-methylquinolin-6-yl groups respectively. An inhibitor of the signalling
  G-protein known as <a href="https://en.wikipedia.org/wiki/RAC1" target="_blank">RAC1</a>
  (Ras-related C3 botulinum toxin substrate 1).
