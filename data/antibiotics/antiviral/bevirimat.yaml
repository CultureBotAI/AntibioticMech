mode_of_action: VIRAL_ASSEMBLY_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:22151792 used bevirimat photoaffinity analogs
  and mass spectrometry to demonstrate direct binding in immature HIV-1 Gag at or
  near the CA-SP1 cleavage site. This blocks the final protease-mediated Gag cleavage
  and produces immature, noninfectious particles; it does not inhibit the viral protease
  active site.'
