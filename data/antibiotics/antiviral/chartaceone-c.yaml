definition: A dihydroxyflavanone that is flavanone substituted by hydroxy groups at
  positions 5 and 7 and 6-carboxy-1-phenylhex-2-en-1-yl groups at positions 6 and
  8 respectively. It has been isolated as a racemate from the bark of Cryptocarya
  chartacea and exhibits inhibitory activity against dengue virus NS5 polymerase.
