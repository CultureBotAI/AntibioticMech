mode_of_action_notes: Assigned from ChEBI role CHEBI:59897 (EC 2.7.7.49 (RNA-directed
  DNA polymerase) inhibitor). ChEBI asserts the role on the compound. The target it
  names is one the host has too, so the mechanism is true but is not evidence of selectivity
  — see mode_of_action_target_scope. Not a curator's mechanistic review.
