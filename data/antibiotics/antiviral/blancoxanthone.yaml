definition: A member of the class of pyranoxanthones that is 2H,6H-pyrano[3,2-b]xanthen-6-one
  substituted by hydroxy groups at positions 5 and 10, geminal methyl groups at position
  2 and a 2-methylbut-3-en-2-yl group at position 12. It is isolated from the roots
  of Calophyllum blancoi and exhibits antiviral activity against coronavirus.
