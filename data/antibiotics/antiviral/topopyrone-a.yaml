definition: A naphthochromene that is 4H-naphtho[2,3-h]chromene-4,7,12-trione substituted
  by a chloro group at position 10, hydroxy groups at positions 5, 9 and 11 and a
  methyl group at position 2. It is isolated from a fungal strain Phoma sp.BAUA2861
  and acts as an inhibitor of the enzyme topoisomerase I.
