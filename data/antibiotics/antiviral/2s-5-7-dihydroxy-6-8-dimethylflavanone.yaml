definition: A dihydroxyflavanone that is (2S)-flavanone substituted by hydroxy groups
  at positions 5 and 7 and methyl groups at positions 6 and 8. Isolated from the buds
  of Cleistocalyx operculatus, it has been shown to exhibit inhibitory effects on
  the viral neuraminidases from two influenza viral strains, H1N1 and H9N2.
