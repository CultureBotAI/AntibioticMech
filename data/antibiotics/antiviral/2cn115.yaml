definition: An oligopeptide that is N-[(1E,3S)-6-amino-1-(methanesulfonyl)-6-oxohex-1-en-3-yl]-N2-carboxy-L-leucinamide
  in which the carboxy group is protected by a (3-ethynylphenyl)methyl group. It is
  a SARS-CoV-2 Nsp5 main protease inhibitor that inhibits SARS-CoV-2 replication.
