definition: A pyrimidone that is uracil which is substituted at positions 1, 5 and
  6 by ethoxymethyl, isopropyl, and benzyl groups, respectively. A non-nucleoside
  inhibitor of HIV-1 reverse transcriptase, emivirine was an unsuccessful experimental
  agent for the treatment of HIV.
