definition: A hexacyclic triterpenoid that is D:A-friedooleanan-29-oic acid substituted
  by a hydroxy group at position 3 and an epoxy group across positions 3 and 24 (the
  (3β,20α stereoisomer). Isolated from Salacia macrosperma and Tripterygium wilfordii,
  it exhibits anti-HIV activity.
