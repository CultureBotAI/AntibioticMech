definition: A pyrimidine 2'-deoxyribonucleoside that is 2'-deoxyuridine in which the
  hydrogen at position 5 of the uracil ring is substituted by a 2-bromoethenyl group.
  It is an antiviral drug used for the treatment of herpes zoster (shingles).
