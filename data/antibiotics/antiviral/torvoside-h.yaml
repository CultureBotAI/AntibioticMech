identifier: CHEBI:66259
label: torvoside H
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A steroid saponin that is (5α,6α,22R,25S)-6,22,26-trihydroxyfurostan-3-one
  in which the hydroxy group at position 6 has been converted into the β-D-glucopyranosyl-(1→3)-α-L-rhamnoside
  derivative, while that at position 26 has been converted to its β-D-glucoside. Torvoside
  H is a natural product found in the fruit of Solanum torvum which shows antiviral
  activity against herpes simplex virus type 1.
