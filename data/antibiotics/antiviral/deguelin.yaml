definition: A rotenone that is 13,13a-dihydro-3H-chromeno[3,4-b]pyrano[2,3-h]chromen-7(7aH)-one
  substituted by methoxy groups at positions 9 and 10, and by two methyl groups at
  position 3 (the 7aS,13aS-stereoisomer). It exists in abundant quantities in the
  bark, roots, and leaves of the Leguminosae family of plants and reported to exert
  anti-tumour effects in various cancers.
