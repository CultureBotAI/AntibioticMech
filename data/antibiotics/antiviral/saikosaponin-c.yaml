definition: A member of the class of saikosaponins that is saikogenin E substituted
  by a 6-deoxy-α-L-mannopyranosyl-(1→4)-[β-D-glucopyranosyl-(1→6)]-β-D-glucopyranosyl
  group at position 3β. It is a natural product isolated from the traditional Chinese
  herb, Radix Bupleuri and exhibits anti-HBV replication activity.
