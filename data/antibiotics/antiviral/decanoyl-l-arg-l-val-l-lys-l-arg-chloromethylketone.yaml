definition: A tetrapeptide consisting of N-decanoyl-L-arginine, L-valine, L-lysine,
  and L-arginine joined in sequence by peptide linkages and in which the carboxy group
  at the C-terminus is substituted by a chloroacetyl group. It is a furin inhibitor
  that has antiviral activity against Chikungunya virus, Zika virus and Japanese encephalitis
  virus.
