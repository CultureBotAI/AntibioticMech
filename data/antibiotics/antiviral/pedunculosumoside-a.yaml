definition: A homoflavonoid glycoside that is ophioglonol substituted by a prenyl
  group at position 5' as well as 2-O-(β-D-glucopyranosyl)-β-D-glucopyranosyl and
  β-D-glucopyranosyl residues at positions 7 and 4' respectively via glycosidic linkages.
  Isolated from the whole plants of Ophioglossum pedunculosum, it exhibits anti-HBV
  activity.
