    assay_name: In vitro Anti-HIV RT Assay
    assay_description: The HIV-1 RTwt inhibition assay was implemented using the template/primer
      hybrid poly(A)9oligo(dT)15, digoxigenin- and biotin-labeled nucleotides, an
      antibody to digoxigenin which is conjugated to peroxidase (anti-DIG-POD), and
      the peroxidase substrate ABTS for quantifying the RT polymerase activity. The
      incorporation quantities of the digoxigenin- and biotin-labeled dUTP into DNA
      represented the activity of HIV-1 RT. The IC50 value corresponds to the concentration
      of the tested compound required to inhibit the incorporation of the labeled
      dUTP by 50%. The procedure for RT assay was performed as described in the kit
      (Roche) protocol
