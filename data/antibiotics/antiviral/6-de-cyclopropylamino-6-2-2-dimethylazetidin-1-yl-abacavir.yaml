definition: A 2,6-diaminopurine that is an analogue of abacavir in which the cyclopropylamino
  group at position 6 of the purine moiety is replaced by a 2,2-dimethylazetidin-1-yl
  group. One of a series of synthesised abacavir analogues with antiviral activity
  found to stimulate IFN-γ secretion in abacavir-responsive clones.
