definition: A trihydroxyflavanone that is flavanone substituted by hydroxy groups
  at positions 3, 5 and 7 and methyl groups at positions 6 and 8 (the 2S,3S-stereoisomer).
  It has been isolated from the buds of Cleistocalyx operculatus and has been shown
  to exhibit inhibitory effects on the viral neuraminidases from two influenza viral
  strains, H1N1 and H9N2.
