definition: A member of the class of coumarins that is 11,12-dihydro-2H,6H,10H-dipyrano[2,3-f:2',3'-h]chromen-2-one
  substituted by a phenyl group at position 4, methyl groups at positions 6, 6, 10
  and 11 and a hydroxy group at position 12 (the 10S,11R,12S stereoisomer). Isolated
  from Calophyllum brasiliense and Calophyllum soulattri, it exhibits anti-HIV activity.
