definition: An oxoaporphine alkaloid that is 7H-dibenzo[de,g]quinolin-7-one substituted
  by a methylenedioxy group across positions 1 and 2, a methoxy group at position
  11 and a hydroxy group at position 10. Isolated from Hernandia nymphaeifolia and
  Lindera chunii, it exhibits activity against HIV-1 integrase.
