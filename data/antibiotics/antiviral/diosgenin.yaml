definition: A sapogenin that is spirostan which is substituted by a hydroxy group
  at the 3β position, contains a double bond at the 5-6 position, and has R- configuration
  at position 25. A natural product found in Dioscorea (wild yam) species, it is used
  as the starting point for the commercial synthesis of a number of steroids, including
  cortisone, pregnenolone and progesterone.
