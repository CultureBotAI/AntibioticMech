definition: A bisindole alkaloid that is quinone bearing hydroxy substituents at positions
  2 and 5 and two indol-3-yl groups at positions 3 and 6, one of which is carrying
  a prenyl group at position 6. Isolated from the culture broth of Chrysosporium merdarium,
  it acts as an inhibitor of HIV-1 protease and EGF-R protein tyrosine kinase.
