definition: A pentacyclic triterpenoid that is the diester obtained by the condensation
  of the hydroxy groups of 2α-hydroxymaprounic acid with p-hydroxybenzoic acid. Isolated
  from Maprounea africana, it exhibits inhibitory activity against HIV-1 reverse transcriptase.
