definition: A member of the class of fluoren-9-ones that is 9H-fluoren-9-one which
  is substituted by a 2-(diethylamino)ethoxy group at positions 2 and 7. It is an
  interferon inducer and a selective α7 nicotinic acetylcholine receptor (α7 nAChR)
  agonist. Its hydrochloride salt is used as an antiviral drug.
