definition: A monohydroxyflavone that is flavone substituted by a hydroxy group at
  position 7, a methoxy group at position 5 and methyl groups at positions 6 and 8.
  Isolated from the buds of Cleistocalyx operculatus, it has been shown to exhibit
  inhibitory effects on the viral neuraminidases from two influenza viral strains,
  H1N1 and H9N2.
