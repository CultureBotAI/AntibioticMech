definition: A member of the class of imidazoles that is 1H-imidazole in which the
  hydrogens at positions 2, 4, and 5 are replaced by 4-nitrophenyl, 4-fluorophenyl,
  and pyridin-4-yl groups, respectively. It is a potent inhibitor of p38 MAP kinase
  (IC50 = 89 nM).
