definition: A member of the class of quinazolines that is quinazoline substituted
  by (5-chloro-2H-1,3-benzodioxol-4-yl)amino, (oxan-4-yl)oxy and 2-(4-methylpiperazin-1-yl)ethoxy
  groups at positions 4, 5 and 7, respectively. It is a dual inhibitor of the tyrosine
  kinases c-Src and Abl (IC50 = 2.7 and 30 nM, respectively). Saracatinib was originally
  developed by AstraZeneca for the treatment of cancer but in 2019 it was granted
  orphan drug designation by the US Food and Drug Administration for the treatment
  of idiopathic pulmonary fibrosis (IPF), a type of lung disease that results in scarring
  (fibrosis) of the lungs.
