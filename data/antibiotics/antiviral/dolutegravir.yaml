identifier: CHEBI:76010
label: dolutegravir
antimicrobial_class: ANTIVIRAL
curation_status: REVIEWED
grounding_status: EXACT
definition: A monocarboxylic acid amide obtained by formal condensation of the carboxy
  group of (4R,12aS)-7-hydroxy-4-methyl-6,8-dioxo-3,4,6,8,12,12a-hexahydro-2H-pyrido[1',2':4,5]pyrazino[2,1-b][1,3]oxazine-9-carboxylic
  acid with the amino group of 2,4-difluorobenzylamine. Used (as its sodium salt)
  for treatment of HIV-1.
