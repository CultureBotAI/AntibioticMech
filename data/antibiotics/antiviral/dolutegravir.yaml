mode_of_action_notes: 'CURATOR: PMID:22205735 tested dolutegravir against HIV-1 integrase
  strand-transfer function in virus, site-directed mutant, and purified-enzyme assays.
  The study also selected and confirmed R263K as a low-level resistance substitution
  while distinguishing the integration effect from reverse transcription.'
