definition: A synthetic tripeptide consisting of N-(tert-butylcarbamoyl)-3-methyl-L-valyl,
  a cyclopropyl-fused prolyl and 3-amino-4-cyclobutyl-2-oxobutanamide residues joined
  in sequence. Used for treatment of chronic hepatitis C virus genotype 1 infection.
