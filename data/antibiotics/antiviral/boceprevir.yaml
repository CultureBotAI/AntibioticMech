mode_of_action_notes: 'CURATOR: PMID:18201776 tested SCH 503034 (boceprevir) against
  hepatitis C virus NS3/4A protease and selected NS3 resistance substitutions at V36,
  T54, R155, A156, and V170. PMID:20004570 further measured boceprevir-series inhibition
  of the NS3 protease. The inspected reports support enzyme inhibition but not a direct-binding
  classification.'
