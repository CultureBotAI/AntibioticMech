definition: A lignan that consists of buta-1,3-diene substituted by a 2,4-dihydroxybenzyl
  group at position 2 and a 1,3-benzodioxol-5-ylmethyl group at position 3. It is
  isolated from the ground stems of Anogeissus acuminata and exhibits anti-HIV activity
  by inhibiting HIV-1 reverse transcriptase enzyme.
