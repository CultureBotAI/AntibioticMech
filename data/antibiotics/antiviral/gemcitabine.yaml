definition: A 2'-deoxycytidine having geminal fluoro substituents in the 2'-position.
  An inhibitor of ribonucleotide reductase, gemcitabine is used in the treatment of
  various carcinomas, particularly non-small cell lung cancer, pancreatic cancer,
  bladder cancer and breast cancer.
