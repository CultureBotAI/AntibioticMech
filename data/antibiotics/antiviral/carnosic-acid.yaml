definition: An abietane diterpenoid that is abieta-8,11,13-triene substituted by hydroxy
  groups at positions 11 and 12 and a carboxy group at position 20. It is isolated
  from rosemary (Rosmarinus officinalis) and common sage (Salvia officinalis) and
  exhibits anti-angiogenic, antineoplastic, antioxidant and anti-HIV activity.
