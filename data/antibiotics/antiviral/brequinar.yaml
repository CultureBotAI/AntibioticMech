definition: A quinolinemonocarboxylic acid that is quinoline substituted by 2'-fluoro[1,1'-biphenyl]-4-yl,
  methyl, carboxy and fluoro groups at positions 2, 3, 4, and 6, respectively. It
  is an inhibitor of dihydroorotate dehydrogenase, an enzyme that is required for
  de novo pyrimidine biosynthesis. The compound exhibits antineoplastic and antiviral
  properties.
