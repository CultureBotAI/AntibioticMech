definition: A tricyclic triterpenoid that is 3,4-secolanosta-8,24-diene-3,26-dioic
  acid 3-methylester substituted by acetoxy groups at positions 19 and 22 and a hydroxy
  group at position 4. It is isolated from the fruiting bodies of the Vietnamese mushroom
  Ganoderma colossum and displays inhibitory activity towards the enzyme HIV protease.
