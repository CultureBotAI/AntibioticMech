definition: The trisodium salt of phosphonoformic acid. It is used as an antiviral
  agent in the treatment of cytomegalovirus retinitis (CMV retinitis, an inflamation
  of the retina that can lead to blindness) and as an alternative to ganciclovir for
  AIDS patients who require concurrent antiretroviral therapy but are unable to tolerate
  ganciclovir due to haematological toxicity.
