definition: A carboxylic ester resulting from the formal condensation of the carboxy
  group of N-[(S)-{[(2R,3S,4R,5R)-5-(4-aminopyrrolo[2,1-f][1,2,4]triazin-7-yl)-5-cyano-3,4-dihydroxytetrahydrofuran-2-yl]methoxy}(phenoxy)phosphoryl]-L-alanine
  with the hydroxy group of 2-ethylbutan-1-ol. A broad-spectrum antiviral prodrug
  with potent in vitro antiviral activity against a diverse panel of RNA viruses such
  as Ebola virus, MERS-CoV and SARS-CoV. It is currently in Phase III clinical trials
  for the treatment of Covid-19 in adults.
