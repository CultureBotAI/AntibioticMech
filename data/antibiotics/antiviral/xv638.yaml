definition: A member of the class of diazepanones that is 1,3-diazepane which is substituted
  by a 3-(1,3-thiazol-2-ylcarbamoyl)benzyl group at positions 1 and 3, oxo group at
  position 2, hydroxy groups at positions 5S and 6S, and benzyl groups at positions
  4R and 7R. It is a potent HIV-1 protease inhibitor.
