definition: A nucleoside analogue that is N4-hydroxycytidine in which the 5'-hydroxy
  group is replaced by a (2-methylpropanoyl)oxy group. It is the prodrug of the active
  antiviral ribonucleoside analog N4-hydroxycytidine (EIDD-1931), has activity against
  a number of RNA viruses including SARS-CoV-2, MERS-CoV, and seasonal and pandemic
  influenza viruses. It is currently in phase III trials for the treatment of patients
  with COVID-19.
