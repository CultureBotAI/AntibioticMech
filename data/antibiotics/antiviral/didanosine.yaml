identifier: CHEBI:490877
label: didanosine
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A purine 2',3'-dideoxyribonucleoside that is inosine in which the hydroxy
  groups at both the 2' and the 3' positions on the sugar moiety have been replaced
  by hydrogen. An antiviral drug, it is used as a medication to treat HIV/AIDS.
