definition: A benzoate ester obtained by the formal condensation of the hydroxy group
  of 5-(8-hydroxyundecyl)benzene-1,3-diol with 4,6-dihydroxy benzoic acid which is
  also substituted by a 8-(acetoxy)undecyl group at position 2. It is isolated from
  Cytonaema sp. and has anti-HIV-1 activity.
