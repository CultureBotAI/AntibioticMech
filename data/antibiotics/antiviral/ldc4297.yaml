definition: A pyrazolotriazine that is pyrazolo[1,5-a][1,3,5]triazine substituted
  by a piperidin-3-yloxy group, [2-(1H-pyrazol-1-yl)benzyl]nitrilo group and an isopropyl
  group at positions 2, 4 and 8 respectively. It is a potent and selective CDK7 inhibitor
  and exhibits antiviral activity.
