mode_of_action_notes: 'CURATOR: PMID:21566148 visualized phosphonoformic acid in the
  active site of an engineered family-B DNA polymerase carrying human cytomegalovirus
  UL54 elements. It supports pyrophosphate mimicry and trapping of an untranslocated
  closed polymerase state, while the structure itself is a UL54-sensitive chimera
  rather than native UL54.'
