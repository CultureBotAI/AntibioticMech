definition: Phosphoric acid in which one of the hydroxy groups is replaced by a carboxylic
  acid group. It is used as the trisodium salt as an antiviral agent in the treatment
  of cytomegalovirus retinitis (CMV retinitis, an inflamation of the retina that can
  lead to blindness) and as an alternative to ganciclovir for AIDS patients who require
  concurrent antiretroviral therapy but are unable to tolerate ganciclovir due to
  haematological toxicity.
