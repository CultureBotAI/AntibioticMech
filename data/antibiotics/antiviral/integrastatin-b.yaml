definition: An organic heterotetracyclic compound that is 11,12-dihydro-6H-6,12-epoxydibenzo[b,f]oxocine
  substituted by hydroxy groups at positions 4, 7 and 8, methoxy groups at positions
  3 and 9, methyl groups at positions 6 and 12, an oxo group at position 11 and a
  formyl group at position 1. It is isolated as a racemate from Ascochyta and exhibits
  inhibitory activity against HIV-1 integrase.
