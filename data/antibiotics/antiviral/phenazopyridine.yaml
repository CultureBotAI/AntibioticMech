definition: A diaminopyridine that is 2,6-diaminopyridine substituted at position
  3 by a phenylazo group. A local anesthetic that has topical analgesic effect on
  mucosa lining of the urinary tract. Its use is limited by problems with toxicity
  (primarily blood disorders) and potential carcinogenicity.
