identifier: CHEBI:28680
label: cytarabine
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A pyrimidine nucleoside in which cytosine is attached to D-arabinofuranose
  via a β-N1-glycosidic bond. Used mainly in the treatment of leukaemia, especially
  acute non-lymphoblastic leukaemia, cytarabine is an antimetabolite antineoplastic
  agent that inhibits the synthesis of DNA. It also has antiviral and immunosuppressant
  properties.
