definition: A sesquiterpenoid that is 1,2,3,4,4a,5,6,7,7a,8-decahydrobenzo[d]xanthene
  substituted by a hydroxy group at position 12, methyl groups at positions 4, 4,
  7 and 7a and a methoxy group at position 9 (the 4aS,7S,7aR,13aS stereoisomer). Isolated
  from Strongylophora hartmani, it exhibits activity against the influenza virus.
