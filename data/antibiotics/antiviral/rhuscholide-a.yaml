definition: A member of the class of 1-benzofurans that is 1-benzofuran-2(3H)-one
  substituted by a hydroxy group at position 5, a propan-2-ylidene group at position
  3 and a (2E,6E,10E)-3,7,11,15-tetramethylhexadeca-2,6,10,14-tetraen-1-yl group at
  position 7. Isolated from Rhus chinensis, it exhibits anti-HIV activity.
