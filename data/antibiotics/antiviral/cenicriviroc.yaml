definition: A member of the class of benzazocines that is (5Z)-1,2,3,4-tetrahydro-1-benzazocine
  which is substituted by a 2-methylpropyl, N-{4-[(S)-(1-propyl-1H-imidazol-5-yl)methanesulfinyl]phenyl}carboxamide
  and 4-(2-butoxyethoxy)phenyl groups at positions 1, 5 and 8, respectively. It is
  a potent chemokine 2 and 5 receptor antagonist currently in development for the
  treatment of liver fibrosis in adults with nonalcoholic steatohepatitis (NASH).
