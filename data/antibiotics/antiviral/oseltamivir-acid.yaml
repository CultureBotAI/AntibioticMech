definition: A cyclohexenecarboxylic acid that is cyclohex-1-ene-1-carboxylic acid
  which is substituted at positions 3, 4, and 5 by pentan-3-yloxy, acetamido, and
  amino groups, respectively (the 3R,4R,5S enantiomer). An antiviral drug, it is used
  as the corresponding ethyl ester prodrug, oseltamivir, to slow the spread of influenza.
