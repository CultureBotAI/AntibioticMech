  measurements:
  - measurement_type: IC50
    original_value: '>50000'
    qualifier: GT
    value: 50000.0
    unit: nM
    assay_name: DRC analysis by immunofluorescence
    assay_description: 'Ten-point DRCs were generated for each drug. Vero cells were
      seeded at 1.2 × 104 cells per well in DMEM, supplemented with 2% FBS and 1×
      antibiotic-antimycotic solution (Gibco), in black, 384-well μClear plates (Greiner
      Bio-One) 24 h prior to the experiment. Ten-point DRCs were generated, with compound
      concentrations ranging from 0.1 to 50 μM. For the viral infections, plates were
      transferred into the BSL3 containment facility and SARS-CoV-2 was added at a
      multiplicity of infection (MOI) of 0.0125. The cells were fixed at 24 hours
      postinfection (hpi) with 4% PFA and analyzed by immunofluorescence. The acquired
      images were analyzed using in-house software to quantify cell numbers and infection
      ratios, and antiviral activity was normalized to positive (mock) and negative
      (0.5% DMSO) controls in each assay plate. DRCs were fitted by sigmoidal dose-response
      models, with the following equation: Y = bottom + (top − bottom)/[1 + (IC50/X)Hillslope],
      using XLfit 4 software or Prism7. IC50 values were calculated from the normalized
      activity data set-fitted curves. All IC50 and 50% cytotoxic concentration (CC50)
      values were measured in duplicate, and the quality of each assay was controlled
      by Z -factor and the coefficient of variation in percent (%CV).'
    bindingdb_reactant_set_id: '874399'
    bindingdb_entry_assay_id: '8945_1'
    bindingdb_monomer_id: '50031706'
