definition: A benzoate ester resulting from the formal condensation of the carboxy
  group of 4-guanidinobenzoic acid with the hydroxy group of 2-(dimethylamino)-2-oxoethyl
  (4-hydroxyphenyl)acetate. It is a potent inhibitor of the human transmembrane protease
  serine 2 (TMPRSS2) and its mesylate salt is currently under investigation for its
  effectiveness in COVID-19 patients.
