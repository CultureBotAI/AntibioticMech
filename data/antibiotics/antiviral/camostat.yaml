  - measurement_type: EC50
    original_value: '11'
    qualifier: EQ
    value: 11.0
    unit: nM
    assay_name: Median half-maximal effective concentration (EC50) curves
    assay_description: Intracellular dose response (EC50 values) for selected compounds
      against SARS-CoV-2 were determined by pre-treating Calu-3 cells for three hr
      with serially diluted compounds (0.064, 0.32, 1.6, 8, 40, 200, and 1000 nM),
      followed by SARS-CoV-2 infection for 48 hr. Viral infection was detected by
      staining for dsRNA or nucleocapsid signal and quantified as described above.
      EC50 experiments were repeated at least three times for each compound with three
      technical replicates in each experiment. Intracellular nucleocapsid levels were
      interpolated to negative control (0.1% DMSO, no infection) = 0 and positive
      control (0.1% DMSO, with infection) = 100. The GraphPad Prism 9 (GraphPad Software,
      Inc.) nonlinear regression fit modeling variable slope was used to generate
      a dose-response curve [Y = Bottom + (Top-Bottom)/ (1+10^((LogIC50-X)*HillSlope)],
      constrained to top = 100, bottom = 0.
