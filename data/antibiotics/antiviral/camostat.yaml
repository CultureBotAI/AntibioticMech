mode_of_action: VIRAL_ENTRY_INHIBITION
mode_of_action_notes: 'CURATOR: In primary human tracheal epithelial cells, PMID:26166259
  showed that camostat reduced influenza HA0-to-HA1 cleavage, intracellular viral
  RNA, and released virus. TMPRSS2, TMPRSS4, and TMPRSS11D/HAT were detected, but
  the study did not isolate which protease mediated the effect or measure direct camostat
  binding to one of them.'
