definition: An aromatic ketone that is imidazole that is substituted at positions
  2 and 5 by (6-hydroxy-1H-indol-3-yl)carbonyl and 6-bromo-1H-indol-3-yl groups respectively.
  Isolated from Mediterranean shallow-water sponges Topsentia genetrix, and from Caribbean
  deep-sea sponges of the Halichondriidae family, it has antitumour and antiviral
  properties. Toxic to fish.
