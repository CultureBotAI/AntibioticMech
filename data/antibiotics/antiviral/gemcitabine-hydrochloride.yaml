definition: A 2'-deoxycytidine hydrochloriode having geminal fluoro substituents in
  the 2'-position. An inhibitor of ribonucleotide reductase, gemcitabine hydrochloride
  is used in the treatment of various carcinomas, including non-small cell lung cancer,
  pancreatic cancer, bladder cancer and breast cancer.
