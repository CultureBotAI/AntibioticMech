definition: A member of the class of barbiturates that is barbituric acid substituted
  by cyclohexyl groups at positions 1 and 3, and by a (carboxymethyl)aminocarbonyl
  group at position 5. It is an inhibitor of hypoxia-inducible factor prolyl hydroxylase
  developed by GlaxoSmithKline for the treatment of anaemia in patients with chronic
  kidney disease.
