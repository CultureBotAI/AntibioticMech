definition: A qinazoline derivative carrying chloro and fluoro substituents at positions
  6 and 8 respectively, a 2-fluoro-6-hydroxyphenyl group at position 7, and a 4-(prop-2-enoyl)piperazin-1-yl
  group at position 4. A potent, selective, and orally bioavailable covalent KRAS-G12C
  inhibitor, it inhibits the protein coding gene KRAS (Kirsten rat sarcoma virus)
  with high potency in cells and animals.
