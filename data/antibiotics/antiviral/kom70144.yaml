definition: A benzamide that is GRL-0617 in which one of the hydrogen's of the primary
  amino group is replaced by an acetyl group. It an inhibitor of SARS-CoV and SARS-CoV-2
  papain-like protease (PLpro) with an IC50 of 2.6 μM and 5.0 μM, respectively. It
  also inhibits SARS-CoV and SARS-CoV-2 infection of Vero E6 cells in vitro (EC50
  values are 13.1 and 21 μM, respectively).
