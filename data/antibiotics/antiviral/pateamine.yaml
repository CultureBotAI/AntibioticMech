mode_of_action: PROTEIN_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:16337595 showed that pateamine A binds host eIF4A,
  alters its enzymatic and protein-interaction behavior, stalls translation initiation
  complexes, and inhibits cap-dependent translation. PMID:26057151 linked this host-directed
  mechanism to Sindbis-virus mRNA translation, while PMID:26773380 found eIF4A-family
  dependence during human cytomegalovirus replication.'
