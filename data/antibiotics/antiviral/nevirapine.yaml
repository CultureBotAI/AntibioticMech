identifier: CHEBI:63613
label: nevirapine
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A dipyridodiazepine that is 5,11-dihydro-6H-dipyrido[3,2-b:2',3'-e][1,4]diazepine
  which is substituted by methyl, oxo, and cyclopropyl groups at positions 4, 6, and
  11, respectively. A non-nucleoside reverse transcriptase inhibitor with activity
  against HIV-1, it is used in combination with other antiretrovirals for the treatment
  of HIV infection.
