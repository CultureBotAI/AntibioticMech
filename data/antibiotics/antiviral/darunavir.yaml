identifier: CHEBI:367163
label: darunavir
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: An N,N-disubstituted benzenesulfonamide bearing an unsubstituted amino
  group at the 4-position, used for the treatment of HIV infection. A second-generation
  HIV protease inhibitor, darunavir was designed to form robust interactions with
  the protease enzyme from many strains of HIV, including those from treatment-experienced
  patients with multiple resistance mutations to other protease inhibitors.
definition_source: ChEBI
