molecular_targets:
- target_label: dengue virus NS5 mRNA 2'-O-methyltransferase domain
  target_type: VIRAL_PROTEIN
  target_relation: DIRECT_BINDING_TARGET
  experimental_context: Enzyme assays showed competitive inhibition with GTP, and
    a 2.6-angstrom ternary cocrystal directly located ribavirin 5'-triphosphate in
    the viral NS5 methyltransferase domain.
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
