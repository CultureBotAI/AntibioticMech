mode_of_action: MULTIPLE
mode_of_action_notes: 'CURATOR: the exact triphosphate has more than one experimentally
  supported viral-enzyme interaction. PMID:15152003 directly structures competitive
  binding to dengue NS5 2''-O-methyltransferase; PMID:11833782 measures inhibition
  of HCV NTPase/helicase; and PMID:12606760 tests ribavirin nucleotides against HCV
  polymerase. The prior polymerase-only seed was therefore too narrow. Published eIF4E
  results conflict and are kept as an open controversy rather than asserted as a target.'
