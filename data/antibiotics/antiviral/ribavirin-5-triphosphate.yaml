- target_label: hepatitis C virus NTPase/helicase
  target_type: VIRAL_PROTEIN
  target_relation: MEASURED_TARGET_ASSOCIATION
  experimental_context: Biochemical unwinding kinetics measured a reduced helicase
    turnover number; the inspected report did not establish a compound-bound structure.
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: '2001'
  source_retrieved_on: '2026-09-02'
  evidence:
  - reference: PMID:11833782
    notes: Primary HCV helicase unwinding-kinetics study.
- target_label: hepatitis C virus RNA-dependent RNA polymerase
  target_type: VIRAL_PROTEIN
  target_relation: MEASURED_TARGET_ASSOCIATION
  experimental_context: In-vitro initiation and elongation assays compared ribavirin
    triphosphate and ribose-modified analogues against HCV RNA polymerase; no compound-polymerase
    cocrystal was reported.
  evidence_status: PRIMARY_EVIDENCE
  source: PRIMARY_LITERATURE
  source_version: 2003-03
  source_retrieved_on: '2026-09-02'
  evidence:
  - reference: PMID:12606760
    notes: Primary HCV polymerase initiation/elongation and analogue-activation study.
