discussions:
- discussion_id: ribavirin-triphosphate-eif4e-binding-conflict
  prompt: Does ribavirin 5'-triphosphate bind eIF4E with physiologically relevant
    affinity and inhibit cap-dependent translation?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - mode_of_action
  - molecular_targets
  rationale: PMID:16131589 reported weak binding and no eIF4E-specific translation
    inhibition in vitro, whereas PMID:23583375 reported concentration-dependent NMR
    evidence for a higher-affinity complex. Resolving the assay-dependent discrepancy
    would determine whether a host target belongs in the curated mechanism.
  evidence:
  - reference: PMID:16131589
    supports: REFUTE
    explanation: Primary biochemical study arguing against functional cap mimicry
      in vitro.
  - reference: PMID:23583375
    supports: SUPPORT
    explanation: Primary NMR study reporting concentration-dependent eIF4E binding.
