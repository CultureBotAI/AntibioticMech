definition: A member of the class of pyrazines that is pyrazine substituted by aminocarbonyl,
  hydroxy and fluoro groups at positions 2, 3 and 6, respectively. It is an anti-viral
  agent that inhibits RNA-dependent RNA polymerase of several RNA viruses and is approved
  for the treatment of influenza in Japan.
