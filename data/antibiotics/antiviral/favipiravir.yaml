mode_of_action: VIRAL_POLYMERASE_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:23917318 studied T-705RTP, the intracellularly
  formed ribosyl-triphosphate metabolite of favipiravir, rather than direct binding
  of the parent compound. T-705RTP competed with ATP and GTP, showed noncompetitive
  or mixed inhibition versus UTP and CTP, and after one incorporation into nascent
  influenza RNA inhibited further extension.'
