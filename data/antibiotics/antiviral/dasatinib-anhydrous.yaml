identifier: CHEBI:49375
label: dasatinib (anhydrous)
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: An aminopyrimidine that is 2-methylpyrimidine which is substituted at
  position 4 by the primary amino group of 2-amino-1,3-thiazole-5-carboxylic acid
  and at position 6 by a 4-(2-hydroxyethyl)piperazin-1-yl group, and in which the
  carboxylic acid group has been formally condensed with 2-chloro-6-methylaniline
  to afford the corresponding amide. A multi-targeted kinase inhibitor, it is used,
  particularly as the monohydrate, for the treatment of chronic, accelerated, or myeloid
  or lymphoid blast phase chronic myeloid leukemia. Note that the name 'dasatinib'
  is used to refer to the monohydrate (USAN) as well as to anhydrous dasatinib (INN).
