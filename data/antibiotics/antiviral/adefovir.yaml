definition: A member of the class of phosphonic acids that is methylphosphonic acid
  in which one of the methyl hydrogens has been replaced by a 2-(6-amino-9H-purin-9-yl)ethoxy
  group. An inhibitor of HIV-1 reverse transcriptase, the bis(t-butoxycarbonyloxymethyl)
  ester (dipivoxil ester) prodrug is used to treat chronic hepatitis B viral infection.
