definition: An L-alanine derivative that is isopropyl L-alaninate in which one of
  the amino hydrogens is replaced by an (S)-({[(2R)-1-(6-amino-9H-purin-9-yl)propan-2-yl]oxy}methyl)(phenoxy)phosphoryl
  group. A prodrug for tenofovir, it is used (as the fumarate salt) in combination
  therapy for the treatment of HIV-1 infection.
