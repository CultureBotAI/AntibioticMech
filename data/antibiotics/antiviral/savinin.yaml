definition: A lignan that is dihydrofuran-2(3H)-one (γ-butyrolactone) substituted
  by a 1,3-benzodioxol-5-ylmethylidene group at position 3 and a 1,3-benzodioxol-5-ylmethyl
  group at position 4 (the 3E,4R-isomer). It exhibits antiviral activity against SARS-CoV-2.
