identifier: CHEBI:3755
label: clomipramine hydrochloride
antimicrobial_class: ANTIVIRAL
curation_status: SEEDED
grounding_status: EXACT
definition: A hydrochloride resulting from the reaction of equimolar amounts of clomipramine
  and hydrogen chloride. One of the more sedating tricyclic antidepressants, it is
  used for the treatment of depression as well as obsessive-compulsive disorder and
  phobias.
