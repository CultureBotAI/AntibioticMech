definition: A member of the class of quinolines that is quinoline which is substituted
  by pyridazin-4-yl and 5-[(2,4-difluorobenzene-1-sulfonyl)amino]-6-methoxypyridin-3-yl
  groups at positions 4 and 6, respectively. It is a highly potent inhibitor of PI3K
  and mTOR developed by GlaxoSmithKline and was previously in human phase 1 clinical
  trials for the treatment of idiopathic pulmonary fibrosis and solid tumors.
