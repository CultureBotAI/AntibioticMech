definition: A pentacyclic triterpenoid that is the benzoate ester obtained by the
  condensation of the 3-hydroxy group of 1β-hydroxymaprounic acid with p-hydroxybenzoic
  acid. Isolated from Maprounea africana, it exhibits inhibitory activity against
  HIV-1 reverse transcriptase.
