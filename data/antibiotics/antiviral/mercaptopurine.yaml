definition: A member of the class of purines that is 6,7-dihydro-1H-purine carrying
  a thione group at position 6. An adenine analogue, it is used in the treatment of
  acute lymphocytic leukemia (ALL), chronic myeloid leukemia (CML), Crohn's disease,
  and ulcerative colitis.
