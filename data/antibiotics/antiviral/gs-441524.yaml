definition: A C-nucleoside analog that is (2R,3R,4S,5R)-3,4-dihydroxy-5-(hydroxymethyl)tetrahydrofuran-2-carbonitrile
  substituted by a 4-aminopyrrolo[2,1-f][1,2,4]triazin-7-yl group at position 2. It
  is the active metabolite of remdesivir and exhibits a broad range of inhibitory
  activity against various RNA viruses including HCV, parainfluenza and SARS-CoV.
