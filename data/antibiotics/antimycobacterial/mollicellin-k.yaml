definition: A member of the class of depsidones that is 11H-dibenzo[b,e][1,4]dioxepine
  substituted by hydroxy groups at positions 3 and 7, methyl groups at positions 1
  and 9, a 3-methylbut-2-enoyl group at position 8, a formyl group at position 4 and
  an oxo group at position 11. Isolated from Chaetomium brasiliense, it exhibits antimalarial,
  antimycobacterial and cytotoxic activities.
