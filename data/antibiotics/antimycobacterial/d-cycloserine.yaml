antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A 4-amino-1,2-oxazolidin-3-one that has R configuration. It is an antibiotic
  produced by Streptomyces garyphalus or S. orchidaceus and is used as part of a multi-drug
  regimen for the treatment of tuberculosis when resistance to, or toxicity from,
  primary drugs has developed. An analogue of D-alanine, it interferes with bacterial
  cell wall synthesis in the cytoplasm by competitive inhibition of L-alanine racemase
  (which forms D-alanine from L-alanine) and D-alanine—D-alanine ligase (which incorporates
  D-alanine into the pentapeptide required for peptidoglycan formation and bacterial
  cell wall synthesis).
