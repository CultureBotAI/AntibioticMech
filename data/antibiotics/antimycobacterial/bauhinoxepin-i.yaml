definition: A dibenzooxepine that is 10,11-dihydrodibenzo[b,f]oxepine-1,4-dione substituted
  by a hydroxy, a methoxy and a methyl group at positions 8, 2 and 3 respectively.
  It is isolated from the root extract of Bauhinia purpurea and exhibits antimalarial,
  antimycobacterial, antifungal, anti-inflammatory and cytotoxic activities.
