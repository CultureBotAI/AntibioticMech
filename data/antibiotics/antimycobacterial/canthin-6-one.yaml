  assay: Qualitative plate and liquid growth comparisons
  note: 'Conditional gene associations from one study, not two independent studies
    or resistance inferred from gene presence. G175-W303, BY4742 / EUROSCARF Y10000
    and YPH250 are distinct laboratory backgrounds, not one experimental strain. YCF1
    was a negative comparison. These findings do not establish a direct drug target
