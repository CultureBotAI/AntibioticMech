definition: A monocarboxylic acid amide resulting from the formal condensation of
  the carboxy group of pyrazinoic acid (pyrazine-2-carboxylic acid) with ammonia.
  A prodrug for pyrazinoic acid, pyrazinecarboxamide is used as part of multidrug
  regimens for the treatment of tuberculosis.
