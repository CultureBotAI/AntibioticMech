definition: A fumarate salt prepared from equimolar amounts of bedaquiline and fumaric
  acid. It is used in combination therapy for the treatment of pulmonary multi-drug
  resistant tuberculosis by inhibition of ATP synthase, an enzyme essential for the
  replication of the mycobacteria.
