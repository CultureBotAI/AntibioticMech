definition: A carbotricyclic compound that is (1aS,4aR,7aR,7bR)-decahydro-1H-cyclopropa[e]azulene
  carrying four methyl substituents at positions 1, 1, 4 and 7 as well as a hydroxy
  substituent at position 4. It is a sesquiterpenoid isolated from several plant species
  and is a strong feeding deterrent for the melaleuca weevil that retards larval development.
