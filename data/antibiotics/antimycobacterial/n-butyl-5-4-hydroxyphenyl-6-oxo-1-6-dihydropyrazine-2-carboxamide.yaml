definition: A pyrazinecarboxamide in which a 6-oxo-1,6-dihydropyrazine nucleus is
  substituted on C-5 by a 4-hydroxyphenyl group and on C-2 by a butylcarbamyl group.
  A synthetic determinant of cefadroxil, it is a promising tool for determining in
  vitro cross-reactivity to cefadroxil in amoxicillin-allergic patients.
