identifier: CHEBI:3749
label: clofazimine
antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: 3-Isopropylimino-3,5-dihydro-phenazine in which the hydrogen at position
  5 is substituted substituted by a 4-chlorophenyl group, and that at position 2 is
  substituted by a (4-chlorophenyl)amino group. A dark red crystalline solid, clofazimine
  is an antimycobacterial and is one of the main drugs used for the treatment of multi-bacillary
  leprosy. However, it can cause red/brown discolouration of the skin, so other treatments
  are often preferred in light-skinned patients.
