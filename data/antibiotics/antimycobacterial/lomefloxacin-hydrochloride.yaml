definition: The hydrochloride salt of lomefloxacin. It is administered by mouth to
  treat bacterial infections including bronchitis and urinary tract infections. It
  is also used topically as eye drops for the treatment of bacterial conjunctivitis,
  and as ear drops for the treatment of otitis externa and otitis media.
