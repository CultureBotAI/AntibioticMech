definition: A dihydroagarofuran sesquiterpenoid that consists of dihydro-β-agarofuran
  substituted by an acetoxy group at position 1 and benzoyloxy groups at positions
  2, 6 and 9 (the 1β,2β,6α,9α stereoisomers). Isolated from the roots of Celastrus
  orbiculatus and Microtropis fokienensis and exhibits cytotoxic and antitubercular
  properties.
