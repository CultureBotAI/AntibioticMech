identifier: CHEBI:4325
label: dapsone
antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: A sulfone that is diphenylsulfone in which the hydrogen atom at the 4
  position of each of the phenyl groups is substituted by an amino group. It is active
  against a wide range of bacteria, but is mainly employed for its actions against
  Mycobacterium leprae, being used as part of multidrug regimens in the treatment
  of all forms of leprosy.
