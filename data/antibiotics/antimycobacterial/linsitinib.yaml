identifier: CHEBI:91402
label: linsitinib
antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: An imidazopyrazine that is imidazo[1,5-a]pyrazine substituted by 2-phenylquinolin-7-yl,
  cis-3-hydroxy-3-methylcyclobutyl, and amino groups at positions 1, 3, and 8, respectively.
  It is dual inhibitor of the IGF-1 receptor and insulin receptor (IC50 = 35 and 75
  nM, respectively) that was previously in clinical development for the treatment
  of cancer and thyroid eye disease.
