definition: A synthetic glucocorticoid drug that is particularly effective as an immunosuppressant,
  and affects virtually all of the immune system. Prednisone is a prodrug that is
  converted by the liver into prednisolone (a β-hydroxy group instead of the oxo group
  at position 11), which is the active drug and also a steroid.
