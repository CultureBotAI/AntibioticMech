definition: A dihydroagarofuran sesquiterpenoid that consists of dihydroagarofuran
  substituted by a acetyloxy group at position 1, benzyloxy groups at positions 6,
  9 and 15 and a hydroxy group at position 2. It is isolated from the roots of Microtropis
  fokienensis and exhibits antitubercular activity.
