mode_of_action: NUCLEIC_ACID_SYNTHESIS_INHIBITION
mode_of_action_notes: 'CURATOR: PMID:11290327 resolved rifampicin bound to Thermus
  aquaticus core RNA polymerase. It occupies a beta-subunit pocket in the DNA/RNA
  channel more than 12 angstrom from the active site and sterically blocks extension
  once nascent RNA reaches two to three nucleotides. This primary transcription mechanism
  replaces the source-seeded MULTIPLE bucket.'
mode_of_action_target_scope: HOST_SHARED_TARGET
