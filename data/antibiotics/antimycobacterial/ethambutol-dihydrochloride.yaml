identifier: CHEBI:4878
label: ethambutol dihydrochloride
antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: The dihydrchloride salt of ethambutol. A bacteriostatic antimycobacterial
  drug, it is effective against Mycobacterium tuberculosis and some other mycobacteria.
  It is used in combination with other antituberculous drugs in the treatment of pulmonary
  and extrapulmonary tuberculosis; resistant strains of M. tuberculosis are readily
  produced if ethambutol dihydrochloride is used alone.
