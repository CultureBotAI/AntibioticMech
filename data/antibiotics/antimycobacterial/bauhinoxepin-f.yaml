definition: A dibenzooxepine that is 10,11-dihydrodibenzo[b,f]oxepine substituted
  by methoxy groups at positions 6 and 9, methyl group at position 7 and hydroxy groups
  at positions 1 and 8 respectively. It is isolated from the root extract of Bauhinia
  purpurea and exhibits antimalarial, antimycobacterial, antifungal, anti-inflammatory
  and cytotoxic activities.
