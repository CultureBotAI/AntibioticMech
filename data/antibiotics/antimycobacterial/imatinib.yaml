definition: A benzamide obtained by formal condensation of the carboxy group of 4-[(4-methylpiperazin-1-yl)methyl]benzoic
  acid with the primary aromatic amino group of 4-methyl-N3-[4-(pyridin-3-yl)pyrimidin-2-yl]benzene-1,3-diamine.
  Used (as its mesylate salt) for treatment of chronic myelogenous leukemia and gastrointestinal
  stromal tumours.
