identifier: CHEBI:4877
label: ethambutol
antimicrobial_class: ANTIMYCOBACTERIAL
curation_status: SEEDED
grounding_status: EXACT
definition: An ethylenediamine derivative that is ethane-1,2-diamine in which one
  hydrogen attached to each of the nitrogens is sutstituted by a 1-hydroxybutan-2-yl
  group (S,S-configuration). It is a bacteriostatic antimycobacterial drug, effective
  against Mycobacterium tuberculosis and some other mycobacteria. It is used (as the
  dihydrochloride salt) in combination with other antituberculous drugs in the treatment
  of pulmonary and extrapulmonary tuberculosis; resistant strains of M. tuberculosis
  are readily produced if ethambutol is used alone.
