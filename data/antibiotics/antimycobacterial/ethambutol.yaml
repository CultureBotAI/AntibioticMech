mode_of_action_notes: 'CURATOR: PMID:32327601 resolved ethambutol with mycobacterial
  EmbA-EmbB and EmbC-EmbC arabinosyltransferase complexes. The drug occupies the donor-
  and acceptor-substrate site in EmbB and EmbC, explaining inhibition of mycobacterial
  cell-wall arabinan synthesis and the clustering of resistance mutations near the
  binding site.'
