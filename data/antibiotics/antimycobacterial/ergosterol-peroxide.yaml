definition: An ergostanoid that is ergosta-6,22-dien-3-ol with a peroxy group between
  positions 5 and 8 (the 3β,5α,8α,22E stereoisomer). Isolated from Ganoderma lucidum
  and Cordyceps sinensis, it exhibits antimycobacterial, trypanocidal and antineoplastic
  activities.
