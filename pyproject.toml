[project]
name = "antibioticmech"
version = "0.1.0"
description = "Knowledge base of individual chemical structures with antimicrobial activity, harmonized from ChEBI and CARD/ARO and grounded in chemistry and mechanism ontologies"
authors = [
    {name = "AntibioticMech Contributors"}
]
readme = "README.md"
# The PACKAGE is CC0: code, schema, tests, configuration. The record content it
# builds is CC BY 4.0 — see LICENSE-DATA and ATTRIBUTION.md — because it derives
# from ChEBI and CARD, both CC BY 4.0.
license = {text = "CC0-1.0"}
requires-python = ">=3.10"
keywords = [
    "microbiology",
    "antibiotic",
    "antimicrobial",
    "chebi",
    "card",
    "aro",
    "cheminformatics",
    "mechanism of action",
    "ontology",
    "knowledge graph",
    "linkml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "linkml>=1.10.0",
    "linkml-runtime>=1.7.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    # The vendored id-label correspondence gate resolves CURIEs through OAK.
    # >=0.7.3 rather than 0.7.2: 0.7.2 declares requires_python <3.14 while this
    # project claims >=3.10 with no ceiling; 0.7.3 widened it. Matches
    # CultureMech, MediaIngredientMech and CellStructureMech.
    "oaklib>=0.7.3",
    # oaklib imports eutils, which still imports pkg_resources; setuptools 82
    # removed it, and uv does not install setuptools unless it is declared.
    "setuptools<82",
]

[project.optional-dependencies]
# Local text-embedding stack (scripts/embed_*.py). Heavy (torch), deliberately
# out of the core install: the recipes run on system python, and neither `just
# qc` nor the site build needs it. Declared so the versions are recorded.
embed = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pacmap>=0.7",
    "umap-learn>=0.5",
]

dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
# Optional model-assisted research lane used only by research_antibiotic.py.
# Extraction, seeding, validation, rendering, and tests remain independent.
# Python 3.12+ matches the client's floor; the runner defaults to an isolated
# uvx environment so the main project environment is not rebuilt.
research = [
    "deep-research-client[cyberian]>=0.2.12; python_version >= '3.12'",
]
# Reproducible, CPU-only build dependencies for the generated chemical map.
# These are not needed to consume the library or browse the committed site.
chemical-map = [
    "numpy==2.2.6",
    "rdkit==2026.3.5",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "umap-learn==0.5.12",
]

# Readers used only to evaluate large upstream source snapshots. The committed
# inventories and all normal validation/seeding commands remain independent.
source-ingest = [
    "duckdb>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/CultureBotAI/AntibioticMech"
Repository = "https://github.com/CultureBotAI/AntibioticMech"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antibioticmech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"
# extend-exclude, not exclude: `exclude` REPLACES ruff's defaults (which cover
# .venv, .git, build/, ...), so setting it would put the whole virtualenv in
# scope and drown the repo's own findings in third-party ones.
extend-exclude = [
    "src/antibioticmech/schema/antibioticmech_dataclasses.py",
    # claw-governed vendored files: byte-identical to canon, linted there, not
    # here. Reformatting one would break check_vendored_sync, which is the point
    # of vendoring them. Matches CellStructureMech.
    "scripts/check_vendored_sync.py",
    "scripts/validate_id_label_correspondence.py",
    "scripts/chem_formula.py",
    "tests/test_skill_frontmatter.py",
    "tests/test_curation_timestamp_schema.py",
    "tests/test_id_label_empty_adapter.py",
    "tests/test_id_label_unknown_prefix.py",
    "tests/test_id_label_plausibility.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
