- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  issue_key: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: 'Six PROPOSED EXACT ChEBI records (alanylclavam, amicetin, andrimid, bottromycin
    A2, planosporicin, ajudazol A) have complete primary-literature mechanism and
    target curation but remain curation_status: PROPOSED'
  description: 'Six PROPOSED/EXACT records seeded in Cycle 8 Stage 1 and enriched
    in Cycle 8 Stages 2-3 — alanylclavam (CHEBI:81029, AMINO_ACID_METABOLISM_DISRUPTION,
    fungal homoserine O-acetyltransferase Met2p / MetX PATHWAY_ENZYME [canonical GO:0004413
    homoserine O-acetyltransferase activity], Pruess et al. 1983 PMID:6190822; Bourgouin
    et al. 2019 DOI:10.1016/j.ABB.2019.01.023 / PMID:30684464), amicetin (CHEBI:199652,
    PROTEIN_SYNTHESIS_INHIBITION, bacterial 50S ribosomal subunit peptidyl-transferase
    center RIBOSOMAL_SUBUNIT [canonical GO:0015934 large ribosomal subunit], Paternoga
    et al. 2023 DOI:10.1038/s41594-023-01047-w / PMID:37550506; Leviev et al. 1994
    DOI:10.1093/nar/22.23.5112 / PMID:7800501), andrimid (CHEBI:216634, FATTY_ACID_SYNTHESIS_INHIBITION,
    GO:0003989 bacterial acetyl-CoA carboxylase carboxyltransferase AccAD PROTEIN
    with reviewed Swiss-Prot UniProtKB protein_examples P0ABD5 and P0A9Q5, Freiberg
    et al. 2004 DOI:10.1074/jbc.m402989200 / PMID:15166242; Jin et al. 2006 DOI:10.1021/ja063074c
    / PMID:16866529), bottromycin A2 (CHEBI:202006, PROTEIN_SYNTHESIS_INHIBITION,
    bacterial 50S ribosomal subunit A-site RIBOSOMAL_SUBUNIT [canonical GO:0015934
    large ribosomal subunit], Otaka & Kaji 1976 PMID:783135; Huo et al. 2012 DOI:10.1016/j.chembiol.2012.08.013
    / PMID:23102221), planosporicin (CHEBI:226796, CELL_WALL_SYNTHESIS_INHIBITION,
    CHEBI:60224 peptidoglycan precursor lipid II CELL_WALL_COMPONENT, Castiglione
    et al. 2007 DOI:10.1021/bi700131x / PMID:17417879; Sherwood et al. 2013 DOI:10.1128/jb.02052-12
    / PMID:23242744), and ajudazol A (CHEBI:204968, ELECTRON_TRANSPORT_INHIBITION
    / HOST_SHARED_TARGET, mitochondrial respiratory chain complex I NADH-ubiquinone
    oxidoreductase PROTEIN_COMPLEX [canonical GO:0005747 mitochondrial respiratory
    chain complex I], Kunze et al. 2004 DOI:10.7164/antibiotics.57.151 / PMID:15112964;
    Buntin et al. 2010 DOI:10.1002/cbic.200900770 / PMID:20336704) — carry exact ChEBI
    grounding, complete single-molecule chemical_structure, curated mode_of_action,
    and PRIMARY_LITERATURE molecular_targets with complete UniProtKB protein_examples
    or held_targets accounting, yet retain curation_status: PROPOSED (and alanylclavam,
    amicetin, bottromycin A2, and ajudazol A can additionally be enriched with canonical
    GO target_id terms GO:0004413, GO:0015934, and GO:0005747).'
