- finding_id: cycle8-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  issue_key: cycle8-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Four Cycle 8 Stage 1 PROPOSED EXACT natural-product records (TP-1161, 2-formyloxymethylclavam,
    2-hydroxymethylclavam, clavam-2-carboxylate) have curated biosynthesis_origin
    and primary literature but lack mode_of_action, PRIMARY_LITERATURE molecular_targets,
    and REVIEWED promotion
  description: 'Four PROPOSED natural-product records seeded with grounding_status:
    EXACT and complete single-molecule chemical_structure in Cycle 8 Stage 1 — TP-1161
    (CHEBI:217619, Engelhardt et al. 2010 DOI:10.1128/aem.00741-10 / PMID:20562278;
    Morris et al. 2009 DOI:10.1021/ja904661a / PMID:19665975; MIBiG BGC0000615), a
    26-membered Series d thiopeptide antibiotic from marine-derived Nocardiopsis sp.
    TFS65-07 active against Gram-positive bacteria that inhibits bacterial protein
    synthesis by binding elongation factor Tu (EF-Tu, GO:0003746 translation elongation
    factor activity, PROTEIN, DIRECT_BINDING_TARGET); and three antipodal (5S) clavam
    antifungal natural products from Streptomyces clavuligerus ATCC 27064 (MIBiG BGC0000845)
    — 2-formyloxymethylclavam (CHEBI:81025), 2-hydroxymethylclavam (CHEBI:81026),
    and clavam-2-carboxylate (CHEBI:81027, Brown et al. 1979 DOI:10.1039/c39790000282;
    Pruess et al. 1983 PMID:6190822; Mosher et al. 1999 DOI:10.1128/aac.43.5.1215
    / PMID:10223939; Jensen et al. 2000 DOI:10.1128/aac.44.3.720-726.2000 / PMID:10681345)
    — carry biosynthesis_origin: NATURAL_PRODUCT but lack curated mode_of_action,
    mode_of_action_target_scope, CURATOR mode_of_action_notes, structured PRIMARY_LITERATURE
    molecular_targets (with UniProtKB protein_examples or held_targets accounting),
    and promotion to REVIEWED.'
  target_ids:
  - CHEBI:217619
  - CHEBI:81025
  - CHEBI:81026
  - CHEBI:81027
