- finding_id: seeded-exact-rifamycins-and-elfamycins-with-card-only-targets-awaiting-primary-literature-promotion
  issue_key: seeded-exact-rifamycins-and-elfamycins-with-card-only-targets-awaiting-primary-literature-promotion
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Five SEEDED EXACT rifamycin and elfamycin records (rifabutin, rifaximin,
    rifapentine, GE2270A, pulvomycin) carry only CARD_ARO database target assertions
    awaiting primary-literature curation and REVIEWED promotion
  description: 'Five SEEDED/EXACT antibiotic records with complete single-molecule
    ChEBI chemical_structure — three semisynthetic rifamycin RNA polymerase (rpoB)
    inhibitors (rifabutin CHEBI:45367, rifaximin CHEBI:75246, and rifapentine CHEBI:45304)
    carrying only source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000737 rifamycin sensitive beta-subunit of RNA polymerase (rpoB)) and two
    natural-product elfamycin elongation factor Tu (EF-Tu / tufA) inhibitors (GE2270A
    CHEBI:29584 and pulvomycin CHEBI:29668) carrying only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000731 elongation factor Tu)
    — lack curated biosynthesis_origin (SEMISYNTHETIC on rifabutin, rifaximin, rifapentine;
    NATURAL_PRODUCT on GE2270A, pulvomycin), curator-reviewed mode_of_action (NUCLEIC_ACID_SYNTHESIS_INHIBITION
    with MICROBIAL_TARGET on the three rifamycins; PROTEIN_SYNTHESIS_INHIBITION with
    MICROBIAL_TARGET on the two elfamycins) and CURATOR mode_of_action_notes, lack
    structured source: PRIMARY_LITERATURE molecular_targets (bacterial DNA-directed
    RNA polymerase beta-subunit RpoB GO:0003899 or bacterial translation elongation
    factor Tu GO:0003746) with reviewed Swiss-Prot UniProtKB protein_examples, and
    remain curation_status: SEEDED.'
  target_ids:
  - CHEBI:45367
  - CHEBI:75246
  - CHEBI:45304
  - CHEBI:29584
  - CHEBI:29668
