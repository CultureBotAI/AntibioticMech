findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Six PROPOSED EXACT ChEBI records (alanylclavam, amicetin, andrimid, bottromycin
    A2, planosporicin, ajudazol A) have complete primary-literature mechanism and
    target curation but remain curation_status: PROPOSED (6 target(s): CHEBI:81029,
    CHEBI:199652, CHEBI:216634, CHEBI:202006, CHEBI:226796, CHEBI:204968). Six PROPOSED/EXACT
    records seeded in Cycle 8 Stage 1 and enriched in Cycle 8 Stages 2-3 — alanylclavam
    (CHEBI:81029, OTHER, bacterial methionine and homoserine amino acid biosynthesis
    BIOLOGICAL_PROCESS / DOWNSTREAM_AFFECTED_PROCESS [optional canonical GO:0009086
    methionine biosynthetic process], Jensen et al. 2000 DOI:10.1128/aac.44.3.720-726.2000
    / PMID:10681345; Pruess & Kellett 1983 DOI:10.7164/antibiotics.36.208 / PMID:6833138),
    amicetin (CHEBI:199652, PROTEIN_SYNTHESIS_INHIBITION, bacterial 50S ribosomal
    subunit peptidyl-transferase center RIBOSOMAL_SUBUNIT / DIRECT_BINDING_TARGET
    [optional canonical GO:0015934 large ribosomal subunit], Zhang et al. 2012 DOI:10.1128/aem.07185-11
    / PMID:22267658; DeBoer et al. 1953 DOI:10.1021/ja01098a518), andrimid (CHEBI:216634,
    CELL_MEMBRANE_SYNTHESIS_INHIBITION, GO:0009317 bacterial acetyl-CoA carboxylase
    carboxyltransferase complex (AccA / AccD) PROTEIN_COMPLEX / DIRECT_BINDING_TARGET
    with reviewed Swiss-Prot UniProtKB protein_examples P0ABD5 and P0A9Q5, Freiberg
    et al. 2004 DOI:10.1074/jbc.m402989200 / PMID:15066985; Jin et al. 2006 DOI:10.1021/ja063194c
    / PMID:16866529), bottromycin A2 (CHEBI:202006, PROTEIN_SYNTHESIS_INHIBITION,
    bacterial 50S ribosomal subunit A site RIBOSOMAL_SUBUNIT / DIRECT_BINDING_TARGET
    [optional canonical GO:0015934 large ribosomal subunit], Shimamura et al. 2009
    DOI:10.1002/anie.200804138 / PMID:19115340; Gouda et al. 2012 DOI:10.1248/cpb.60.169
    / PMID:22293474; Huo et al. 2012 DOI:10.1016/j.chembiol.2012.08.013 / PMID:23021914),
    planosporicin (CHEBI:226796, CELL_WALL_SYNTHESIS_INHIBITION, bacterial cell wall
    peptidoglycan biosynthesis BIOLOGICAL_PROCESS / DOWNSTREAM_AFFECTED_PROCESS [optional
    canonical GO:0009252 peptidoglycan biosynthetic process], Sherwood et al. 2013
    DOI:10.1128/jb.02291-12 / PMID:23475977; Castiglione et al. 2007 DOI:10.1021/bi700131x
    / PMID:17469849; Maffioli et al. 2009 DOI:10.1021/np800794y / PMID:19301921),
    and ajudazol A (CHEBI:204968, ENERGY_METABOLISM_INHIBITION / HOST_SHARED_TARGET,
    mitochondrial respiratory chain complex I (NADH:ubiquinone oxidoreductase) PROTEIN_COMPLEX
    / DIRECT_BINDING_TARGET [optional canonical GO:0005747 mitochondrial respiratory
    chain complex I], Kunze et al. 2004 DOI:10.7164/antibiotics.57.151 / PMID:15112964;
    Buntin et al. 2010 DOI:10.1002/cbic.200900712 / PMID:20432424) — carry exact ChEBI
    grounding, complete single-molecule chemical_structure, curated mode_of_action,
    and PRIMARY_LITERATURE molecular_targets with complete UniProtKB protein_examples
    or held_targets accounting, yet retain curation_status: PROPOSED (and alanylclavam,
    amicetin, bottromycin A2, planosporicin, and ajudazol A can optionally be enriched
    with canonical GO target_id terms GO:0009086, GO:0015934, GO:0009252, and GO:0005747).'
- finding_id: cycle8-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  status: open
  summary: 'Four Cycle 8 Stage 1 PROPOSED EXACT natural-product records (TP-1161,
    2-formyloxymethylclavam, 2-hydroxymethylclavam, clavam-2-carboxylate) have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion (4 target(s): CHEBI:217619, CHEBI:81025,
    CHEBI:81026, CHEBI:81027). Four PROPOSED natural-product records seeded with grounding_status:
    EXACT and complete single-molecule chemical_structure in Cycle 8 Stage 1 — TP-1161
    (CHEBI:217619, Engelhardt et al. 2010 DOI:10.1128/aem.00741-10 / PMID:20562278
    and DOI:10.1021/np1005617 / PMID:20929206; MIBiG BGC0000615), a 26-membered trisubstituted-pyridine
    macrocyclic thiopeptide antibiotic from marine-derived Nocardiopsis sp. TFS65-07
    active against Gram-positive bacteria; and three antipodal (5S) clavam antifungal
    natural products from Streptomyces clavuligerus ATCC 27064 (MIBiG BGC0000841 and
    BGC0000843) — 2-formyloxymethylclavam (CHEBI:81025), 2-hydroxymethylclavam (CHEBI:81026),
    and clavam-2-carboxylate (CHEBI:81027, Jensen et al. 2000 DOI:10.1128/aac.44.3.720-726.2000
    / PMID:10681345; Mosher et al. 1999 DOI:10.1128/aac.43.5.1215 / PMID:10223939;
    Brown et al. 1979 DOI:10.1039/c39790000282) — carry biosynthesis_origin: NATURAL_PRODUCT
    but lack curated mode_of_action, mode_of_action_target_scope, CURATOR mode_of_action_notes,
    structured PRIMARY_LITERATURE molecular_targets (with UniProtKB protein_examples
    or held_targets accounting), and promotion to REVIEWED.'
- finding_id: seeded-exact-rifamycins-and-elfamycins-with-card-only-targets-awaiting-primary-literature-promotion
  status: open
  summary: 'Five SEEDED EXACT rifamycin and elfamycin records (rifabutin, rifaximin,
    rifapentine, GE2270A, pulvomycin) carry only CARD_ARO database target assertions
    awaiting primary-literature curation and REVIEWED promotion (5 target(s): CHEBI:45367,
    CHEBI:75246, CHEBI:45304, CHEBI:29584, CHEBI:29668). Five SEEDED/EXACT antibiotic
    records with complete single-molecule ChEBI chemical_structure — three semisynthetic
    rifamycin RNA polymerase (rpoB) inhibitors (rifabutin CHEBI:45367, rifaximin CHEBI:75246,
    and rifapentine CHEBI:45304) carrying only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000737 rifamycin sensitive beta-subunit
    of RNA polymerase (rpoB)) and two natural-product elfamycin elongation factor
    Tu (EF-Tu / tufA) inhibitors (GE2270A CHEBI:29584 and pulvomycin CHEBI:29668)
    carrying only source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000731 elongation factor Tu) — lack curated biosynthesis_origin (SEMISYNTHETIC
    on rifabutin, rifaximin, rifapentine; NATURAL_PRODUCT on GE2270A, pulvomycin),
    curator-reviewed mode_of_action (NUCLEIC_ACID_SYNTHESIS_INHIBITION with MICROBIAL_TARGET
    on the three rifamycins; PROTEIN_SYNTHESIS_INHIBITION with MICROBIAL_TARGET on
    the two elfamycins) and CURATOR mode_of_action_notes, lack structured source:
    PRIMARY_LITERATURE molecular_targets (bacterial DNA-directed RNA polymerase beta-subunit
    RpoB GO:0003899 or bacterial translation elongation factor Tu GO:0003746) with
    reviewed Swiss-Prot UniProtKB protein_examples, and remain curation_status: SEEDED.'
