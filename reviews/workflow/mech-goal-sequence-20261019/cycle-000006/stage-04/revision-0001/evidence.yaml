    (CHEBI:8269) cites PMID:23751969, which tested tiamulin rather than parent pleuromutilin;
    source-owned qualification is projected via curation/card_evidence_reviews.json.'
  disposition: Derivative-versus-parent qualification note is already projected via
    curation/card_evidence_reviews.json; exact parent pleuromutilin experimental testing
    is absent from the cited primary study.
  carried_from: eatav-compound
- finding_id: msrc-evidence
  status: deferred
  summary: 'Early msrC association study does not establish exclusive causality or
    target-protection mechanism (2 target(s): CHEBI:42355, CHEBI:8732). CARD ARO:3002819
    (msrC) on erythromycin A (CHEBI:42355) and quinupristin (CHEBI:8732) cites PMID:11120975,
    which reports susceptibility shifts without proving exclusive target-protection
    causality.'
  disposition: Awaits later primary mechanistic evidence curation and native gene-field
    representation on source-owned ResistanceMechanismEntry items.
  carried_from: msrc-evidence
- finding_id: ddl-scope
