findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Eight PROPOSED EXACT ChEBI records (berninamycin A, berninamycin B, empedopeptin,
    laterocidine, obafluorin, salinamide A, salinamide B, rimocidin) have complete
    primary-literature mechanism and target curation but remain curation_status: PROPOSED
    (8 target(s): CHEBI:199044, CHEBI:205987, CHEBI:222785, CHEBI:219296, CHEBI:199965,
    CHEBI:227666...). Eight PROPOSED/EXACT records seeded in Cycle 6 Stage 1 and enriched
    in Cycle 6 Stages 2-3 — berninamycin A (CHEBI:199044, PROTEIN_SYNTHESIS_INHIBITION,
    GO:0015934 bacterial 50S ribosomal subunit, Reusser 1969 DOI:10.1021/bi00836a026
    / PMID:4897214; De et al. 2021 DOI:10.1039/d1ob01759d / PMID:34617948), berninamycin
    B (CHEBI:205987, PROTEIN_SYNTHESIS_INHIBITION, GO:0015934 bacterial 50S ribosomal
    subunit, De et al. 2021 DOI:10.1039/d1ob01759d / PMID:34617948; Liesch et al.
    1976 DOI:10.1021/ja00417a047 / PMID:1244374), empedopeptin (CHEBI:222785, CELL_WALL_SYNTHESIS_INHIBITION,
    CHEBI:61384 bacterial peptidoglycan precursor lipid II, Muller et al. 2012 DOI:10.1074/jbc.M112.369504
    / PMID:22518842; Ho et al. 2021 DOI:10.3390/md19040209 / PMID:33918939), laterocidine
    (CHEBI:219296, MEMBRANE_DISRUPTION, CHEBI:16412 Gram-negative bacterial outer
    membrane lipopolysaccharide, Li et al. 2018 DOI:10.1038/s41467-018-05781-6 / PMID:30115920),
    obafluorin (CHEBI:199965, PROTEIN_SYNTHESIS_INHIBITION, GO:0004829 bacterial threonyl-tRNA
    synthetase ThrRS/ThrS with reviewed UniProtKB:P0A8M3, Schaffer et al. 2017 DOI:10.1038/nchembio.2374
    / PMID:28504677; Scott et al. 2019 DOI:10.1021/acschembio.9b00590 / PMID:31675206),
    salinamide A (CHEBI:227666, NUCLEIC_ACID_SYNTHESIS_INHIBITION, GO:0000428 bacterial
    DNA-directed RNA polymerase bridge-helix cap RpoB/RpoC with reviewed UniProtKB:P0A8V2
    and UniProtKB:P0A8T7, Degen et al. 2014 DOI:10.7554/eLife.02451 / PMID:24843001;
    Ray et al. 2016 DOI:10.1002/anie.201508576 / PMID:26553755), salinamide B (CHEBI:200517,
    NUCLEIC_ACID_SYNTHESIS_INHIBITION, GO:0000428 bacterial DNA-directed RNA polymerase
    bridge-helix cap RpoB/RpoC with reviewed UniProtKB:P0A8V2 and UniProtKB:P0A8T7,
    Degen et al. 2014 DOI:10.7554/eLife.02451 / PMID:24843001; Ray et al. 2016 DOI:10.1002/anie.201508576
    / PMID:26553755), and rimocidin (CHEBI:80106, MEMBRANE_DISRUPTION, CHEBI:16933
    fungal membrane ergosterol, Seco et al. 2004 DOI:10.1016/j.chembiol.2004.02.017
    / PMID:15031268; Liao et al. 2020 DOI:10.1007/s00253-020-10955-8 / PMID:33057790)
    — carry exact ChEBI grounding, complete single-molecule chemical_structure, curated
    mode_of_action, and PRIMARY_LITERATURE molecular_targets with complete UniProtKB
    accounting, yet retain curation_status: PROPOSED.'
- finding_id: cycle6-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  status: open
  summary: 'Five Cycle 6 Stage 1 PROPOSED EXACT natural-product records have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion (5 target(s): CHEBI:225841, CHEBI:201881,
    CHEBI:206310, CHEBI:199931, CHEBI:223870). Five PROPOSED natural-product records
    seeded with grounding_status: EXACT and complete single-molecule chemical_structure
    in Cycle 6 Stage 1 — kendomycin B (CHEBI:225841, Chen et al. 2021 DOI:10.3390/md19120673
    / PMID:34940672; Zhang et al. 2019 DOI:10.1021/acs.orglett.9b00323 / PMID:30843714),
    an all-carbon macrocyclic quinone-methide ansa-polyketide congener of kendomycin
    from marine Verrucosispora sp. SCSIO 07399; marinopyrrole C (CHEBI:201881), marinopyrrole
    D (CHEBI:206310), and marinopyrrole E (CHEBI:199931, Hughes et al. 2010 DOI:10.1021/jo1002054
    / PMID:20405892; Yamanaka et al. 2012 DOI:10.1021/ja305670f / PMID:22800473),
    pentahalogenated bis-salicyloyl 1,3''-bipyrrole marine antibiotics from Streptomyces
    sp. CNQ-418; and amipurimycin (CHEBI:223870, Kang et al. 2019 DOI:10.1021/acs.orglett.9b00840
    / PMID:30990701; Harada et al. 1977 DOI:10.7164/antibiotics.30.11 / PMID:838626),
    a 2-aminopurine C9-sugar peptidyl nucleoside antifungal antibiotic from Streptomyces
    novoguineensis — carry biosynthesis_origin: NATURAL_PRODUCT but lack curated mode_of_action,
    mode_of_action_target_scope, CURATOR mode_of_action_notes, structured PRIMARY_LITERATURE
    molecular_targets (with UniProtKB protein_examples or held_targets accounting),
    and promotion to REVIEWED.'
- finding_id: seeded-exact-sulfonamides-with-card-only-targets-awaiting-primary-literature-promotion
  status: open
  summary: 'Five SEEDED EXACT sulfonamide records carry only CARD_ARO database target
    assertions and ChEBI-derived mode_of_action notes awaiting primary-literature
    curation and REVIEWED promotion (5 target(s): CHEBI:63845, CHEBI:102265, CHEBI:9331,
    CHEBI:9332, CHEBI:9328). Five SEEDED/EXACT sulfonamide antibiotic records with
    complete single-molecule ChEBI chemical_structure — sulfacetamide (CHEBI:63845),
    sulfamethazine (CHEBI:102265), sulfamethizole (CHEBI:9331), sulfamethoxazole (CHEBI:9332),
    and sulfadiazine (CHEBI:9328) — currently carry only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000744 antibiotic sensitive dihydropteroate
    synthase), lack biosynthesis_origin: SYNTHETIC and curator-reviewed mode_of_action_notes
    (with MICROBIAL_TARGET for dihydropteroate synthase FolP/DHPS), lack structured
    source: PRIMARY_LITERATURE molecular_targets with reviewed Swiss-Prot UniProtKB
    protein_examples, and remain curation_status: SEEDED.'
- finding_id: mcr43-context
  status: deferred
  summary: 'Contrasting functional contexts and component-specific grounding for MCR-4.3
    remain unresolved (2 target(s): CHEBI:59064, CHEBI:59673). CARD ARO:3004695 (MCR-4.3)
    on colistin A (CHEBI:59064) and colistin B (CHEBI:59673) carries source-owned
    qualifications via curation/card_evidence_reviews.json, but purified component-specific
    experimental testing and primary supplement reconciliation remain unresolved.'
  disposition: Source-owned qualification notes are already projected via curation/card_evidence_reviews.json;
    component-specific experimental grounding requires external primary experimental
    data not available in local cached sources.
  carried_from: mcr43-context
- finding_id: eatav-compound
