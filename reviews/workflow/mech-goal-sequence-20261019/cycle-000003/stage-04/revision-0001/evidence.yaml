findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Two PROPOSED EXACT ChEBI records have complete primary-literature mechanism
    and target curation but remain curation_status: PROPOSED (2 target(s): CHEBI:138579,
    CHEBI:198310). Two EXACT ChEBI records seeded in Cycle 3 Stage 1 — bactobolin
    A (CHEBI:138579, Chandler et al. 2012 DOI:10.1128/mBio.00499-12 / PMID:23249812;
    Amunts et al. 2015 DOI:10.1016/j.jmb.2014.12.018 / PMID:25562208) and negamycin
    (CHEBI:198310, DOI:10.1073/pnas.1414401111 / PMID:25368144; DOI:10.1016/j.molcel.2014.09.021
    / PMID:25306922) — possess exact single-molecule chemical_structure, curated biosynthesis_origin
    (NATURAL_PRODUCT), curated mode_of_action (PROTEIN_SYNTHESIS_INHIBITION) with
    mode_of_action_target_scope: MICROBIAL_TARGET and CURATOR mode_of_action_notes,
    source: PRIMARY_LITERATURE (evidence_status: PRIMARY_EVIDENCE) molecular_targets,
    and complete UniProtKB accounting (bactobolin A carries reviewed UniProtKB:P42919
    and UniProtKB:P60405 protein_examples on 50S ribosomal subunit protein uL2 / RplB,
    while negamycin carries a documented RIBOSOMAL_SUBUNIT hold in curation/uniprot_protein_examples.yaml),
    yet retain curation_status: PROPOSED.'
  carried_from: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
- finding_id: proposed-exact-quinolones-with-moa-missing-primary-targets-and-reviewed-promotion
  status: open
  summary: 'Three PROPOSED EXACT fluoroquinolone records have curated mode_of_action
    and primary target citations but lack structured PRIMARY_LITERATURE molecular_targets
    and REVIEWED promotion (3 target(s): CHEBI:135622, CHEBI:136050, CHEBI:94700).
    Three PROPOSED antibacterial fluoroquinolone records with grounding_status: EXACT
    and complete single-molecule chemical_structure — besifloxacin (CHEBI:135622,
    Cambau et al. 2009 DOI:10.1093/jac/dkn528 / PMID:19451292; DOI:10.1128/AAC.00418-09
    / PMID:19506065), ozenoxacin (CHEBI:136050, Tato et al. 2014 DOI:10.1128/AAC.01509-13
    / PMID:24080666; Yamakawa et al. 2002 DOI:10.1128/AAC.46.5.1229-1234.2002 / PMID:11959549;
    Lopez et al. 2014 PMID:24752267), and pazufloxacin (CHEBI:94700, DOI:10.1128/AAC.37.3.384
    / PMID:8460909; PMID:11959571) — already carry curated biosynthesis_origin: SYNTHETIC,
    mode_of_action: NUCLEIC_ACID_SYNTHESIS_INHIBITION (MICROBIAL_TARGET), and CURATOR
    mode_of_action_notes describing dual inhibition of bacterial DNA gyrase (GyrA/GyrB)
    and topoisomerase IV (ParC/ParE), but lack structured source: PRIMARY_LITERATURE
    molecular_targets (and reviewed UniProtKB protein_examples) and remain curation_status:
    PROPOSED.'
