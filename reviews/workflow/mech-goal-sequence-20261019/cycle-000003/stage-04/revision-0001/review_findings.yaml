- finding_id: proposed-minted-records-with-moa-missing-primary-targets
  issue_key: proposed-minted-records-with-moa-missing-primary-targets
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Seven PROPOSED MINTED records have curated mode_of_action and primary target
    citations but lack structured PRIMARY_LITERATURE molecular_targets
  description: Seven PROPOSED/MINTED records with exact single-molecule chemical_structure,
    curated biosynthesis_origin, curated mode_of_action (MICROBIAL_TARGET), and CURATOR
    mode_of_action_notes — cadazolid (antibioticmech:curator-975acd7c4d, Locher et
    al. 2014 DOI:10.1093/jac/dkt411 / PMID:24128668; Baldoni et al. 2014 DOI:10.1128/AAC.01789-13;
    PMID:24798276), radezolid (antibioticmech:curator-a739fc0555, Locke et al. 2009
    DOI:10.1128/AAC.00962-09 / PMID:19752277; Skripkin et al. 2008 DOI:10.1128/AAC.01193-07;
    PMID:22508309), sutezolid (antibioticmech:curator-f56d459cee, Williams et al.
    2009 DOI:10.1128/AAC.01182-08 / PMID:19075058; Barbachyn et al. 1996 DOI:10.1021/jm950956y;
    PMID:19687246), sanfetrinem (antibioticmech:curator-daae3d88a3, Singh et al. 1996
    DOI:10.1128/AAC.40.9.2142 / PMID:8878596; Di Modugno et al. 1994 DOI:10.1128/AAC.38.10.2362;
    PMID:8540693), tomopenem (antibioticmech:curator-e14f58e6dc, Koga et al. 2005
    DOI:10.1128/AAC.49.8.3239-3250.2005 / PMID:16048932; PMID:18070969), albaconazole
    (antibioticmech:curator-6bdee75cea, Carrillo & Guarro 2001 DOI:10.1128/AAC.45.7.2151-2153.2001
    / PMID:11408242; Ramos et al. 1999 DOI:10.1128/AAC.43.12.2992; PMID:11061504),
    and quilseconazole (antibioticmech:curator-217ed2935e, Lockhart et al. 2016 DOI:10.1128/AAC.02770-15
    / PMID:26787697; Warrilow et al. 2016 DOI:10.1128/AAC.00349-16; PMID:27161862)
    — cite primary target studies in mode_of_action_notes/source_concepts but lack
    structured PRIMARY_LITERATURE molecular_targets (and UniProtKB protein_examples
    / held_targets accounting).
