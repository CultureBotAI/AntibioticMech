- finding_id: cycle7-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  issue_key: cycle7-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Five Cycle 7 Stage 1 PROPOSED EXACT natural-product records have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion
  description: 'Five PROPOSED natural-product records seeded with grounding_status:
    EXACT and complete single-molecule chemical_structure in Cycle 7 Stage 1 — benastatin
    A (CHEBI:226154) and benastatin B (CHEBI:200324, Aoyagi et al. 1992 DOI:10.7164/antibiotics.45.1385
    / PMID:1429223; Xu et al. 2007 DOI:10.1128/JB.00682-07 / PMID:17675384), pentacyclic
    benzo[a]naphthacenequinone type II polyketide antibiotics from Streptomyces sp.
    A2991200; tetarimycin A (CHEBI:204430, Kallifidas et al. 2012 DOI:10.1021/ja307317c
    / PMID:23057685), a tetracyclic fluorene-scaffold type II polyketide antibiotic
    with potent anti-MRSA activity; 9-methylstreptimidone (CHEBI:215258, Saito et
    al. 1974 DOI:10.7164/antibiotics.27.206 / PMID:4857359; Wang et al. 2013 DOI:10.1016/j.chembiol.2013.01.013
    / PMID:23521794), a glutarimide polyketide antifungal antibiotic from Streptomyces
    sp. that inhibits eukaryotic protein synthesis; and 7-deoxypactamycin (CHEBI:198890,
    Lu et al. 2011 DOI:10.1021/np200426v / PMID:21823615; Ito et al. 2009 DOI:10.1002/cbic.200900339
    / PMID:19670201), an aminocyclopentitol antibiotic congener of pactamycin from
    Streptomyces pactum that binds the 30S ribosomal subunit and inhibits protein
    synthesis — carry biosynthesis_origin: NATURAL_PRODUCT but lack curated mode_of_action,
    mode_of_action_target_scope, CURATOR mode_of_action_notes, structured PRIMARY_LITERATURE
    molecular_targets (with UniProtKB protein_examples or held_targets accounting),
    and promotion to REVIEWED.'
  target_ids:
  - CHEBI:226154
  - CHEBI:200324
  - CHEBI:204430
  - CHEBI:215258
  - CHEBI:198890
