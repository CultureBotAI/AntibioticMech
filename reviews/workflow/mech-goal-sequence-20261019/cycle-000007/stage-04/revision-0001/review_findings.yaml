- finding_id: seeded-exact-folate-inhibitors-with-card-only-targets-awaiting-primary-literature-promotion
  issue_key: seeded-exact-folate-inhibitors-with-card-only-targets-awaiting-primary-literature-promotion
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Six SEEDED EXACT folate-pathway inhibitor records (sulfadoxine, sulfasalazine,
    sulfisoxazole, dapsone, brodimoprim, tetroxoprim) carry only CARD_ARO database
    target assertions awaiting primary-literature curation and REVIEWED promotion
  description: 'Six SEEDED/EXACT synthetic folate-pathway inhibitor records with complete
    single-molecule ChEBI chemical_structure — four dihydropteroate synthase (DHPS
    / FolP) inhibitors (sulfadoxine CHEBI:9329, sulfasalazine CHEBI:9334, sulfisoxazole
    CHEBI:102484, and dapsone CHEBI:4325) carrying only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000744 antibiotic sensitive dihydropteroate
    synthase) and two 2,4-diaminopyrimidine dihydrofolate reductase (DHFR / FolA)
    inhibitors (brodimoprim CHEBI:131726 and tetroxoprim CHEBI:135420) carrying only
    source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000743 antibiotic sensitive dihydrofolate reductase) — lack biosynthesis_origin:
    SYNTHETIC, curated mode_of_action: FOLATE_PATHWAY_INHIBITION (with MICROBIAL_TARGET)
    and CURATOR mode_of_action_notes, lack structured source: PRIMARY_LITERATURE molecular_targets
    (GO:0004156 dihydropteroate synthase activity or GO:0004146 dihydrofolate reductase
    activity) with reviewed Swiss-Prot UniProtKB protein_examples, and remain curation_status:
    SEEDED.'
