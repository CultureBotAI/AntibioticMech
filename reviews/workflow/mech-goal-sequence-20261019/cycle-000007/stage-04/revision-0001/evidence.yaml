findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Three PROPOSED EXACT ChEBI records (neocarzinostatin, streptothricin E,
    epoxomicin) have complete primary-literature mechanism and target curation but
    remain curation_status: PROPOSED (3 target(s): CHEBI:29655, CHEBI:67576, CHEBI:42265).
    Three PROPOSED/EXACT records seeded in Cycle 7 Stage 1 and enriched in Cycle 7
    Stages 2-3 — neocarzinostatin (CHEBI:29655, NUCLEIC_ACID_SYNTHESIS_INHIBITION,
    CHEBI:16991 bacterial duplex DNA, Liu et al. 2005 DOI:10.1016/j.chembiol.2004.12.013
    / PMID:15797213; Ohtsuki & Ishida 1975 DOI:10.7164/antibiotics.28.229 / PMID:123897),
    streptothricin E (CHEBI:67576, PROTEIN_SYNTHESIS_INHIBITION, bacterial 30S ribosomal
    subunit RIBOSOMAL_SUBUNIT [canonical GO:0015935 small ribosomal subunit], Inamori
    et al. 1990 DOI:10.1248/cpb.38.2296 / PMID:2177682; Maruyama et al. 2012 DOI:10.1038/nchembio.1040
    / PMID:22820420), and epoxomicin (CHEBI:42265, OTHER / HOST_SHARED_TARGET, Plasmodium
    falciparum 20S proteasome catalytic beta subunits PROTEIN_COMPLEX [canonical GO:0005839
    proteasome core complex], Czesny et al. 2009 DOI:10.1128/aac.00088-09 / PMID:19651911;
    Schorn et al. 2014 DOI:10.1021/cb400699p / PMID:24168704) — carry exact ChEBI
    grounding, complete single-molecule chemical_structure, curated mode_of_action,
    and PRIMARY_LITERATURE molecular_targets with complete UniProtKB held_targets
    accounting, yet retain curation_status: PROPOSED (and streptothricin E / epoxomicin
    can additionally be enriched with canonical GO target_id terms GO:0015935 and
    GO:0005839).'
- finding_id: cycle7-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  status: open
  summary: 'Five Cycle 7 Stage 1 PROPOSED EXACT natural-product records have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion (5 target(s): CHEBI:226154, CHEBI:200324,
    CHEBI:204430, CHEBI:215258, CHEBI:198890). Five PROPOSED natural-product records
    seeded with grounding_status: EXACT and complete single-molecule chemical_structure
    in Cycle 7 Stage 1 — benastatin A (CHEBI:226154) and benastatin B (CHEBI:200324,
    Kawahara et al. 2024 DOI:10.1038/s41429-024-00727-1 / PMID:38664572; Xu et al.
    2009 DOI:10.1016/j.jbiotec.2008.10.013 / PMID:19047004; MIBiG BGC0000203), pentacyclic
    benzo[a]naphthacenequinone type II polyketide antibiotics from Streptomyces sp.
    A2991200; tetarimycin A (CHEBI:204430, Kallifidas et al. 2012 DOI:10.1021/ja3093828
    / PMID:23157252; MIBiG BGC0000274), a tetracyclic fluorene-scaffold type II polyketide
    antibiotic with potent anti-MRSA activity; 9-methylstreptimidone (CHEBI:215258,
    Wang et al. 2013 DOI:10.1021/ol400224n / PMID:23438151; Song et al. 2025 DOI:10.1016/j.pestbp.2025.106683
    / PMID:41162067; MIBiG BGC0000171), a glutarimide polyketide antifungal antibiotic
    from Streptomyces himastatinicus ATCC 53653 that inhibits eukaryotic protein synthesis;
    and 7-deoxypactamycin (CHEBI:198890, Lu et al. 2011 DOI:10.1016/j.chembiol.2011.01.016
    / PMID:21513878; Kudo et al. 2007 DOI:10.1038/ja.2007.63 / PMID:17827660; Masaki
    et al. 2026 DOI:10.1038/s41429-026-00934-y / PMID:42265342; MIBiG BGC0000711),
    an aminocyclopentitol antibiotic congener of pactamycin from Streptomyces pactum
    that binds the 30S ribosomal subunit and inhibits protein synthesis — carry biosynthesis_origin:
    NATURAL_PRODUCT but lack curated mode_of_action, mode_of_action_target_scope,
    CURATOR mode_of_action_notes, structured PRIMARY_LITERATURE molecular_targets
    (with UniProtKB protein_examples or held_targets accounting), and promotion to
    REVIEWED.'
- finding_id: seeded-exact-folate-inhibitors-with-card-only-targets-awaiting-primary-literature-promotion
  status: open
  summary: 'Six SEEDED EXACT folate-pathway inhibitor records (sulfadoxine, sulfasalazine,
    sulfisoxazole, dapsone, brodimoprim, tetroxoprim) carry only CARD_ARO database
    target assertions awaiting primary-literature curation and REVIEWED promotion
    (6 target(s): CHEBI:9329, CHEBI:9334, CHEBI:102484, CHEBI:4325, CHEBI:131726,
    CHEBI:135420). Six SEEDED/EXACT synthetic folate-pathway inhibitor records with
    complete single-molecule ChEBI chemical_structure — four dihydropteroate synthase
    (DHPS / FolP) inhibitors (sulfadoxine CHEBI:9329, sulfasalazine CHEBI:9334, sulfisoxazole
    CHEBI:102484, and dapsone CHEBI:4325) carrying only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000744 antibiotic sensitive dihydropteroate
    synthase) and two 2,4-diaminopyrimidine dihydrofolate reductase (DHFR / FolA)
    inhibitors (brodimoprim CHEBI:131726 and tetroxoprim CHEBI:135420) carrying only
    source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000745 antibiotic sensitive dihydrofolate reductase) — lack biosynthesis_origin:
    SYNTHETIC, curator-reviewed mode_of_action (FOLATE_PATHWAY_INHIBITION with MICROBIAL_TARGET;
    brodimoprim carries ChEBI-seeded FOLATE_PATHWAY_INHIBITION / HOST_SHARED_TARGET
    while the other 5 lack mode_of_action) and CURATOR mode_of_action_notes, lack
    structured source: PRIMARY_LITERATURE molecular_targets (GO:0004156 dihydropteroate
    synthase activity or GO:0004146 dihydrofolate reductase activity) with reviewed
    Swiss-Prot UniProtKB protein_examples, and remain curation_status: SEEDED.'
