    CHEBI:199044, CHEBI:205987, CHEBI:199753, CHEBI:225769...). After Cycle 7 Stage
    2 curated primary-literature causal_graphs on 8 additional REVIEWED records (obafluorin,
    salinamide A, salinamide B, sulfacetamide, sulfamethazine, sulfamethizole, sulfamethoxazole,
    sulfadiazine), 90 of the 145 REVIEWED records now carry causal_graphs while 55
    of the 145 REVIEWED records have verified primary-literature mode_of_action and
    molecular_targets but do not yet have curated causal_graphs; additionally, ofloxacin
