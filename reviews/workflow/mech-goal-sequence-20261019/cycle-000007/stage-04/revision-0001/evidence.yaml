    with reviewed UniProtKB protein_examples P0AES4/P0AES6 on dna_gyrase) and CARD_ARO
    molecular_targets but remains SEEDED/MINTED because racemic CHEBI:7731 lacks a
    2D molfile in ChEBI v249.'
  disposition: 'Curating new multi-step primary-literature causal_graphs across 55
    additional REVIEWED compounds and resolving upstream ChEBI structure availability
    for racemic CHEBI:7731 are multi-cycle corpus expansion tasks tracked in Issue
    #1257 outside bounded Stage 5 coherence remediation.'
