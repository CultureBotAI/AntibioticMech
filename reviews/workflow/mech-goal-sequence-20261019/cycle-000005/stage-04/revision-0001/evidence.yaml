- finding_id: mexjk-role-conflict
  status: deferred
  summary: 'Upstream CARD aro.owl reverses MexJ and MexK component roles in MexJK-OpmH
    relative to MexJK-OprM (4 target(s): CHEBI:42355, CHEBI:27902, CHEBI:164200, antibioticmech:aro-1fe0873afd).
    Upstream aro.owl assigns opposite inner-membrane versus periplasmic-adaptor restrictions
    for MexJ (ARO:3003692) and MexK (ARO:3003693) in MexJK-OpmH (ARO:3003694) relative
    to MexJK-OprM (ARO:3000802), affecting complex provenance on erythromycin A (CHEBI:42355),
    tetracycline (CHEBI:27902), triclosan (CHEBI:164200), and acriflavine (antibioticmech:aro-1fe0873afd).'
  disposition: Primary papers PMID:12193619 and PMID:12951344 remain under publisher
    HTTP 403 hold, and generated AntibioticRecord files do not store subcomponent
    role restrictions; preserved without guessing which upstream CARD restriction
    is correct.
  carried_from: mexjk-role-conflict
- finding_id: reviewed-records-awaiting-causal-graphs
  status: deferred
  summary: '38 REVIEWED records await primary-literature causal_graphs and ofloxacin
    is blocked by structureless CHEBI:7731 (39 target(s): CHEBI:28429, CHEBI:228412,
    CHEBI:199753, CHEBI:225769, CHEBI:172922, CHEBI:156451...). After Cycle 5 Stage
    2 curated primary-literature causal_graphs on 6 additional REVIEWED records (squalestatin
    S1, minimycin, enoxacin, fleroxacin, gatifloxacin, trovafloxacin), 74 of the 112
    REVIEWED records now carry causal_graphs while 38 of the 112 REVIEWED records
    have verified primary-literature mode_of_action and molecular_targets but do not
    yet have curated causal_graphs; additionally, ofloxacin (antibioticmech:aro-2eea3233f3)
    has a primary-literature causal graph (PMID:2849927, with reviewed UniProtKB protein_examples
    P0AES4/P0AES6 on dna_gyrase) and CARD_ARO molecular_targets but remains SEEDED/MINTED
    because racemic CHEBI:7731 lacks a 2D molfile in ChEBI v249.'
  disposition: 'Curating new multi-step primary-literature causal_graphs across 38
    additional REVIEWED compounds and resolving upstream ChEBI structure availability
    for racemic CHEBI:7731 are multi-cycle corpus expansion tasks tracked in Issue
    #1257 outside bounded Stage 5 coherence remediation.'
  carried_from: reviewed-records-awaiting-causal-graphs
