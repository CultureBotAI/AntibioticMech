findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Five PROPOSED EXACT ChEBI records (pentabromopseudilin, taromycin A, pneumocandin
    A0, rustmicin, soraphen A) have complete primary-literature mechanism and target
    curation but remain curation_status: PROPOSED (5 target(s): CHEBI:70619, CHEBI:219845,
    CHEBI:198520, CHEBI:206910, CHEBI:9200). Five PROPOSED/EXACT records seeded in
    Cycle 5 Stage 1 and enriched in Cycle 5 Stages 2-3 — pentabromopseudilin (CHEBI:70619,
    MEMBRANE_DISRUPTION, GO:0005886 bacterial cytoplasmic membrane, Castro-Falcon
    et al. 2024 DOI:10.1021/acschembio.3c00773 / PMID:38377384; Agarwal et al. 2014
    DOI:10.1038/nchembio.1564 / PMID:24974229), taromycin A (CHEBI:219845, MEMBRANE_DISRUPTION,
    GO:0005886 Gram-positive bacterial cytoplasmic membrane, Yamanaka et al. 2014
    DOI:10.1073/pnas.1319584111 / PMID:24449899; Reynolds et al. 2018 DOI:10.1038/ja.2017.146
    / PMID:29184121), pneumocandin A0 (CHEBI:198520, CELL_WALL_SYNTHESIS_INHIBITION,
    GO:0000148 fungal 1,3-beta-D-glucan synthase Fks1/Fks2 with reviewed UniProtKB:P38631
    and UniProtKB:P40989, Schmatz et al. 1992 DOI:10.7164/antibiotics.45.1886 / PMID:1490879;
    Chen et al. 2013 DOI:10.1186/1471-2164-14-339 / PMID:23688303; Douglas et al.
    1994 DOI:10.1073/pnas.91.26.12907 / PMID:7809096), rustmicin (CHEBI:206910, CELL_MEMBRANE_SYNTHESIS_INHIBITION,
    GO:0052645 fungal inositol phosphorylceramide synthase Aur1/Ipc1 with reviewed
    UniProtKB:P36107 and UniProtKB:O13332, Mandala et al. 1998 DOI:10.1074/jbc.273.24.14942
    / PMID:9614099; Karki et al. 2010 DOI:10.1111/j.1574-6968.2010.02048.x / PMID:20662933),
    and soraphen A (CHEBI:9200, CELL_MEMBRANE_SYNTHESIS_INHIBITION, GO:0003989 eukaryotic
    acetyl-CoA carboxylase Acc1 with reviewed UniProtKB:Q00955, Shen et al. 2004 DOI:10.1126/science.1103399
    / PMID:15550663; Gerth et al. 1994 DOI:10.7164/antibiotics.47.23 / PMID:8119858;
    Ligon et al. 2002 DOI:10.1016/s0378-1119(02)00396-7 / PMID:12039053) — carry exact
    ChEBI grounding, complete single-molecule chemical_structure, curated mode_of_action,
    and PRIMARY_LITERATURE molecular_targets with complete UniProtKB accounting, yet
    retain curation_status: PROPOSED.'
- finding_id: cycle5-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  status: open
  summary: 'Five Cycle 5 Stage 1 PROPOSED EXACT natural-product records have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion (5 target(s): CHEBI:218214, CHEBI:191052,
    CHEBI:198957, CHEBI:197824, CHEBI:29671). Five PROPOSED antibacterial natural-product
    records seeded with grounding_status: EXACT and complete single-molecule chemical_structure
    in Cycle 5 Stage 1 — naphthomycin A (CHEBI:197824, Kaewkla et al. 2024 DOI:10.3389/fmicb.2024.1353511
    / PMID:38694805; Wu et al. 2011 DOI:10.1039/c1mb05036b / PMID:21614382), a chlorinated
    29-membered naphthalenic ansamacrolactam polyketide antibiotic from Streptomyces
    species; resistomycin (CHEBI:29671, Taechowisan et al. 2025 DOI:10.3923/pjbs.2025.749.764
    / PMID:41618676; Jakobi & Hertweck 2004 DOI:10.1021/ja0390698 / PMID:14982421),
    a pentacyclic discoid benzo[cd]pyrenequinone aromatic polyketide antibiotic (heliomycin)
    from Streptomyces resistomycificus; micacocidin (CHEBI:198957, Kreutzer et al.
    2014 DOI:10.1039/c3ob41839a / PMID:24202877; Kreutzer et al. 2011 DOI:10.1128/aem.05198-11
    / PMID:21724891), a salicylate-derived thiazoline- and thiazolidine-containing
    polyketide-nonribosomal peptide antibiotic potent against Mycoplasma pneumoniae;
    kendomycin (CHEBI:191052, Elnakady et al. 2016 DOI:10.1371/journal.pone.0146165
    / PMID:26795276; Wenzel et al. 2008 DOI:10.1002/cbic.200800456 / PMID:18972512),
    a carbocyclic quinone-methide ansa-polyketide antibiotic (TAN-2162) from Streptomyces
    violaceoruber; and endophenazine A (CHEBI:218214, Gebhardt et al. 2002 DOI:10.7164/antibiotics.55.794
    / PMID:12458768; Taechowisan et al. 2024 DOI:10.3923/pjbs.2024.469.478 / PMID:39415555;
    Saleh et al. 2012 DOI:10.3762/bjoc.8.57 / PMID:22509222), a prenylated phenazine-1-carboxylic
    acid antibiotic from Streptomyces anulatus — carry biosynthesis_origin: NATURAL_PRODUCT
    but lack curated mode_of_action, mode_of_action_target_scope, CURATOR mode_of_action_notes,
    structured PRIMARY_LITERATURE molecular_targets (with UniProtKB protein_examples
    or held_targets accounting), and promotion to REVIEWED.'
- finding_id: seeded-exact-fluoroquinolones-with-card-only-targets-awaiting-primary-literature-promotion
  status: open
  summary: 'Five SEEDED EXACT quinolone/fluoroquinolone records carry only CARD_ARO
    database target assertions and ChEBI-derived mode_of_action notes awaiting primary-literature
    curation and REVIEWED promotion (5 target(s): CHEBI:3716, CHEBI:5543, CHEBI:63611,
    CHEBI:9212, CHEBI:116278). Five SEEDED/EXACT quinolone and fluoroquinolone records
    with complete single-molecule ChEBI chemical_structure — cinoxacin (CHEBI:3716),
    Grepafloxacin (CHEBI:5543), moxifloxacin (CHEBI:63611), sparfloxacin (CHEBI:9212),
    and lomefloxacin (CHEBI:116278) — currently carry only source: CARD_ARO (evidence_status:
    PRIMARY_EVIDENCE_NEEDED) molecular_targets (ARO:3000733 fluoroquinolone sensitive
    gyrA and/or ARO:3003261 fluoroquinolone sensitive gyrB), lack biosynthesis_origin:
    SYNTHETIC and curator-reviewed mode_of_action_notes (with MICROBIAL_TARGET for
    bacterial DNA gyrase and topoisomerase IV), lack structured source: PRIMARY_LITERATURE
    molecular_targets with reviewed Swiss-Prot UniProtKB protein_examples, and remain
    curation_status: SEEDED.'
