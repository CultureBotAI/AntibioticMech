  title: Five SEEDED EXACT quinolone/fluoroquinolone records carry only CARD_ARO database
    target assertions and ChEBI-derived mode_of_action notes awaiting primary-literature
    curation and REVIEWED promotion
  description: 'Five SEEDED/EXACT quinolone and fluoroquinolone records with complete
    single-molecule ChEBI chemical_structure — cinoxacin (CHEBI:3716), Grepafloxacin
    (CHEBI:5543), moxifloxacin (CHEBI:63611), sparfloxacin (CHEBI:9212), and lomefloxacin
    (CHEBI:116278) — currently carry only source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED)
    molecular_targets (ARO:3000733 fluoroquinolone sensitive gyrA and/or ARO:3003261
    fluoroquinolone sensitive gyrB), lack biosynthesis_origin: SYNTHETIC and curator-reviewed
    mode_of_action_notes (with MICROBIAL_TARGET for bacterial DNA gyrase and topoisomerase
    IV), lack structured source: PRIMARY_LITERATURE molecular_targets with reviewed
    Swiss-Prot UniProtKB protein_examples, and remain curation_status: SEEDED.'
