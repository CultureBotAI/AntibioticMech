  issue_key: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: 'Five PROPOSED EXACT ChEBI records (pentabromopseudilin, taromycin A, pneumocandin
    A0, rustmicin, soraphen A) have complete primary-literature mechanism and target
    curation but remain curation_status: PROPOSED'
  description: 'Five PROPOSED/EXACT records seeded in Cycle 5 Stage 1 and enriched
    in Cycle 5 Stages 2-3 — pentabromopseudilin (CHEBI:70619, MEMBRANE_DISRUPTION,
    GO:0005886 bacterial cytoplasmic membrane, Castro-Falcon et al. 2024 DOI:10.1021/acschembio.3c00773
    / PMID:38377384; Agarwal et al. 2014 DOI:10.1038/nchembio.1564 / PMID:24974229),
    taromycin A (CHEBI:219845, MEMBRANE_DISRUPTION, GO:0005886 Gram-positive bacterial
    cytoplasmic membrane, Yamanaka et al. 2014 DOI:10.1073/pnas.1319584111 / PMID:24449899;
    Reynolds et al. 2018 DOI:10.1038/ja.2017.146 / PMID:29184121), pneumocandin A0
    (CHEBI:198520, CELL_WALL_SYNTHESIS_INHIBITION, GO:0000148 fungal 1,3-beta-D-glucan
    synthase Fks1/Fks2 with reviewed UniProtKB:P38631 and UniProtKB:P40989, Schmatz
    et al. 1992 DOI:10.7164/antibiotics.45.1886 / PMID:1490879; Chen et al. 2013 DOI:10.1186/1471-2164-14-339
    / PMID:23688303; Douglas et al. 1994 DOI:10.1073/pnas.91.26.12907 / PMID:7809096),
    rustmicin (CHEBI:206910, CELL_MEMBRANE_SYNTHESIS_INHIBITION, GO:0052645 fungal
    inositol phosphorylceramide synthase Aur1/Ipc1 with reviewed UniProtKB:P36107
    and UniProtKB:O13332, Mandala et al. 1998 DOI:10.1074/jbc.273.24.14942 / PMID:9614099;
    Karki et al. 2010 DOI:10.1111/j.1574-6968.2010.02048.x / PMID:20662933), and soraphen
    A (CHEBI:9200, CELL_MEMBRANE_SYNTHESIS_INHIBITION, GO:0003989 eukaryotic acetyl-CoA
    carboxylase Acc1 with reviewed UniProtKB:Q00955, Shen et al. 2004 DOI:10.1126/science.1103399
    / PMID:15550663; Gerth et al. 1994 DOI:10.7164/antibiotics.47.23 / PMID:8119858;
    Ligon et al. 2002 DOI:10.1016/s0378-1119(02)00396-7 / PMID:12039053) — carry exact
    ChEBI grounding, complete single-molecule chemical_structure, curated mode_of_action,
    and PRIMARY_LITERATURE molecular_targets with complete UniProtKB accounting, yet
    retain curation_status: PROPOSED.'
