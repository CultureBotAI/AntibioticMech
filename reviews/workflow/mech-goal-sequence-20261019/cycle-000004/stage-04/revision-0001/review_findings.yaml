- finding_id: cycle4-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  issue_key: cycle4-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Six Cycle 4 Stage 1 PROPOSED EXACT natural-product records have curated biosynthesis_origin
    and primary literature but lack mode_of_action, PRIMARY_LITERATURE molecular_targets,
    and REVIEWED promotion
  description: 'Six PROPOSED antibacterial natural-product records seeded with grounding_status:
    EXACT and complete single-molecule chemical_structure in Cycle 4 Stage 1 — diazaquinomycin
    H (CHEBI:199753, Mullowney et al. 2018 DOI:10.1021/acs.jnatprod.8b00394 / PMID:30110167)
    and diazaquinomycin J (CHEBI:225769, DOI:10.1021/acs.jnatprod.8b00394 / PMID:30110167),
    which belong to the thymidylate synthase (ThyA/ThyX) / folate-pathway-inhibiting
    diazaquinomycin family; jessenipeptin (CHEBI:221686, Arp et al. 2018 DOI:10.1073/pnas.1721790115
    / PMID:29592954), a cyclic lipodepsipeptide acting on the Gram-positive bacterial
    cell envelope; minimycin / oxazinomycin (CHEBI:224130, Kong et al. 2019 DOI:10.1016/j.isci.2019.11.037
    / PMID:31816530; Kusakabe et al. 1972 DOI:10.7164/antibiotics.25.44), a C-nucleoside
    antimetabolite inhibiting bacterial nucleic acid / pyrimidine biosynthesis; and
    the macrodiolide ionophores pamamycin-621A (CHEBI:219230, Ren & Wu 2009 DOI:10.1021/ol902290v
    / PMID:19924823; Rebets et al. 2015 DOI:10.1021/jacs.5b05606) and pamamycin-649B
    (CHEBI:198952, Renner et al. 2011 DOI:10.1002/chem.201102093; Natsume et al. 1995
    DOI:10.7164/antibiotics.48.1159), which act as bacterial membrane cation ionophores
    — carry biosynthesis_origin: NATURAL_PRODUCT but lack curated mode_of_action,
    mode_of_action_target_scope, CURATOR mode_of_action_notes, structured PRIMARY_LITERATURE
    molecular_targets (with UniProtKB protein_examples or held_targets accounting),
    and promotion to REVIEWED.'
  target_ids: &id002
