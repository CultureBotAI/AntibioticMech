- finding_id: seeded-exact-fluoroquinolones-with-card-only-targets-awaiting-primary-literature-promotion
  issue_key: seeded-exact-fluoroquinolones-with-card-only-targets-awaiting-primary-literature-promotion
  category: completeness
  severity: major
  status: open
  certainty: confirmed
  title: Four SEEDED EXACT fluoroquinolone records carry only CARD_ARO database target
    assertions and ChEBI-derived mode_of_action notes awaiting primary-literature
    curation and REVIEWED promotion
  description: 'Four SEEDED/EXACT fluoroquinolone records with complete single-molecule
    ChEBI chemical_structure — enoxacin (CHEBI:157175), fleroxacin (CHEBI:31810),
    gatifloxacin (CHEBI:5280), and trovafloxacin (CHEBI:9763) — currently carry only
    source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000733 fluoroquinolone sensitive gyrA and/or ARO:3003261 fluoroquinolone
    sensitive gyrB), lack biosynthesis_origin: SYNTHETIC and curator-reviewed mode_of_action_notes
    (enoxacin and gatifloxacin also inherit HOST_SHARED_TARGET from broad ChEBI topoisomerase/DNA
    synthesis role mappings rather than MICROBIAL_TARGET for bacterial DNA gyrase
    and topoisomerase IV), lack structured source: PRIMARY_LITERATURE molecular_targets
    with reviewed Swiss-Prot UniProtKB protein_examples, and remain curation_status:
    SEEDED.'
  target_ids: &id003
