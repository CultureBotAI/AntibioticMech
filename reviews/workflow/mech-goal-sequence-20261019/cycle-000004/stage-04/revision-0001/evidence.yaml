findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'One PROPOSED EXACT ChEBI record (squalestatin S1, CHEBI:220211) has complete
    primary-literature mechanism and target curation but remains curation_status:
    PROPOSED (1 target(s): CHEBI:220211). Squalestatin S1 (CHEBI:220211, data/antibiotics/antifungal/squalestatin-s1.yaml),
    seeded in Cycle 4 Stage 1 and enriched in Cycle 4 Stages 2-3, possesses exact
    single-molecule chemical_structure (C35H46O13, InChIKey KKQOCSPYLTUDES-KVBVMKTNSA-N),
    curated biosynthesis_origin (NATURAL_PRODUCT), curated mode_of_action (ERGOSTEROL_PATHWAY_INHIBITION,
    HOST_SHARED_TARGET) with CURATOR mode_of_action_notes (Dawson et al. 1992 DOI:10.7164/antibiotics.45.639
    / PMID:1624366; Bonsch et al. 2016 DOI:10.1039/c6cc02130a / PMID:27032439), and
    a source: PRIMARY_LITERATURE (evidence_status: PRIMARY_EVIDENCE) molecular_targets
    entry for fungal squalene synthase (Erg9; GO:0051996) carrying 3 reviewed Swiss-Prot
    UniProtKB protein_examples (UniProtKB:P78589, UniProtKB:A0A1D8PI71, UniProtKB:P29704;
    DOI:10.7164/antibiotics.45.639 / PMID:1624366; Bergstrom et al. 1993 DOI:10.1073/pnas.90.1.80
    / PMID:8419946), yet retains curation_status: PROPOSED.'
- finding_id: cycle4-stage1-proposed-exact-natural-products-missing-mechanism-and-targets
  status: open
  summary: 'Six Cycle 4 Stage 1 PROPOSED EXACT natural-product records have curated
    biosynthesis_origin and primary literature but lack mode_of_action, PRIMARY_LITERATURE
    molecular_targets, and REVIEWED promotion (6 target(s): CHEBI:199753, CHEBI:225769,
    CHEBI:221686, CHEBI:224130, CHEBI:219230, CHEBI:198952). Six PROPOSED antibacterial
    natural-product records seeded with grounding_status: EXACT and complete single-molecule
    chemical_structure in Cycle 4 Stage 1 — diazaquinomycin H (CHEBI:199753, Mullowney
    et al. 2018 DOI:10.1021/acs.jnatprod.8b00394 / PMID:30110167) and diazaquinomycin
    J (CHEBI:225769, DOI:10.1021/acs.jnatprod.8b00394 / PMID:30110167), which belong
    to the thymidylate synthase (ThyA/ThyX) / folate-pathway-inhibiting diazaquinomycin
    family; jessenipeptin (CHEBI:221686, Arp et al. 2018 DOI:10.1073/pnas.1721790115
    / PMID:29592954), a cyclic lipodepsipeptide acting on the Gram-positive bacterial
    cell envelope; minimycin / oxazinomycin (CHEBI:224130, Kong et al. 2019 DOI:10.1016/j.isci.2019.11.037
    / PMID:31816530; Kusakabe et al. 1972 DOI:10.7164/antibiotics.25.44 / PMID:4555729),
    a C-nucleoside antimetabolite inhibiting bacterial nucleic acid / pyrimidine biosynthesis;
    and the macrodiolide ionophores pamamycin-621A (CHEBI:219230, Ren & Wu 2009 DOI:10.1021/ol902290v
    / PMID:19924823; Rebets et al. 2015 DOI:10.1021/jacs.5b05606 / PMID:26331569)
    and pamamycin-649B (CHEBI:198952, Renner et al. 2011 DOI:10.1002/chem.201102093;
    Natsume et al. 1995 DOI:10.7164/antibiotics.48.1159 / PMID:7490226), which act
    as bacterial membrane cation ionophores — carry biosynthesis_origin: NATURAL_PRODUCT
    but lack curated mode_of_action, mode_of_action_target_scope, CURATOR mode_of_action_notes,
    structured PRIMARY_LITERATURE molecular_targets (with UniProtKB protein_examples
    or held_targets accounting), and promotion to REVIEWED.'
- finding_id: seeded-exact-fluoroquinolones-with-card-only-targets-awaiting-primary-literature-promotion
  status: open
  summary: 'Four SEEDED EXACT fluoroquinolone records carry only CARD_ARO database
    target assertions and ChEBI-derived mode_of_action notes awaiting primary-literature
    curation and REVIEWED promotion (4 target(s): CHEBI:157175, CHEBI:31810, CHEBI:5280,
    CHEBI:9763). Four SEEDED/EXACT fluoroquinolone records with complete single-molecule
    ChEBI chemical_structure — enoxacin (CHEBI:157175), fleroxacin (CHEBI:31810),
    gatifloxacin (CHEBI:5280), and trovafloxacin (CHEBI:9763) — currently carry only
    source: CARD_ARO (evidence_status: PRIMARY_EVIDENCE_NEEDED) molecular_targets
    (ARO:3000733 fluoroquinolone sensitive gyrA and/or ARO:3003261 fluoroquinolone
    sensitive gyrB), lack biosynthesis_origin: SYNTHETIC and curator-reviewed mode_of_action_notes
    (enoxacin and gatifloxacin also inherit HOST_SHARED_TARGET from broad ChEBI topoisomerase/DNA
    synthesis role mappings rather than MICROBIAL_TARGET for bacterial DNA gyrase
    and topoisomerase IV), lack structured source: PRIMARY_LITERATURE molecular_targets
    with reviewed Swiss-Prot UniProtKB protein_examples, and remain curation_status:
    SEEDED.'
