- finding_id: mexjk-role-conflict
  status: deferred
  summary: 'Upstream CARD aro.owl reverses MexJ and MexK component roles in MexJK-OpmH
    relative to MexJK-OprM (4 target(s): CHEBI:42355, CHEBI:27902, CHEBI:164200, antibioticmech:aro-1fe0873afd).
    Upstream aro.owl assigns opposite inner-membrane versus periplasmic-adaptor restrictions
    for MexJ (ARO:3003692) and MexK (ARO:3003693) in MexJK-OpmH (ARO:3003694) relative
    to MexJK-OprM (ARO:3000802), affecting complex provenance on erythromycin A (CHEBI:42355),
    tetracycline (CHEBI:27902), triclosan (CHEBI:164200), and acriflavine (antibioticmech:aro-1fe0873afd).'
  disposition: Primary papers PMID:12193619 and PMID:12951344 remain under publisher
    HTTP 403 hold, and generated AntibioticRecord files do not store subcomponent
    role restrictions; preserved without guessing which upstream CARD restriction
    is correct.
  carried_from: mexjk-role-conflict
