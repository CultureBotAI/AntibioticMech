findings:
- finding_id: proposed-exact-records-with-primary-targets-awaiting-reviewed-promotion
  status: open
  summary: 'Six PROPOSED EXACT ChEBI records have complete primary-literature mechanism
    and target curation but remain curation_status: PROPOSED (6 target(s): CHEBI:28429,
    CHEBI:228412, CHEBI:48480, CHEBI:10100, CHEBI:34825, CHEBI:188153). Six EXACT
    ChEBI records seeded via curation/curator_antibiotics.tsv — (2R,3R)-dihydromyricetin
    (CHEBI:28429, DOI:10.1177/15353141261501298 / PMID:42908502), 6-methylflavone
    (CHEBI:228412, DOI:10.1128/spectrum.03588-25 / PMID:42007697), thermorubin A (CHEBI:48480,
    DOI:10.1093/nar/gkac1189 / PMID:36546783; DOI:10.1016/j.jmb.2011.12.055 / PMID:22240456),
    zafirlukast (CHEBI:10100, DOI:10.3390/antibiotics15090914 / PMID:42792065; DOI:10.1128/AAC.02407-12
    / PMID:23650171), luliconazole (CHEBI:34825, DOI:10.1007/s10156-004-0327-1 / PMID:15365862),
    and oteseconazole (CHEBI:188153, DOI:10.1128/aac.00778-22 / PMID:35969069; PMID:25056938)
    — possess exact single-molecule chemical_structure, curated biosynthesis_origin,
    curated mode_of_action with mode_of_action_target_scope: MICROBIAL_TARGET and
    CURATOR mode_of_action_notes, and source: PRIMARY_LITERATURE (evidence_status:
    PRIMARY_EVIDENCE) molecular_targets (with reviewed UniProtKB protein_examples
    on 2 of the 3 protein-targeted records — zafirlukast Lsr2 UniProtKB:P9WIP7 and
    oteseconazole ERG11 UniProtKB:P10613/P50859 — while luliconazole CYP51 UniProtKB:F2SHH3
    and zafirlukast LtaS are documented holds in curation/uniprot_protein_examples.yaml,
    and the remaining 3 records target MEMBRANE, BIOLOGICAL_PROCESS, and RIBOSOMAL_SUBUNIT),
    yet retain curation_status: PROPOSED from initial seeding.'
- finding_id: proposed-minted-records-with-primary-targets-missing-mode-of-action
  status: open
