    9 of them, with ibrexafungerp and olorofim documented holds in curation/uniprot_protein_examples.yaml)
    in Cycle 2 Stage 3 (PR #1266) — enterololin (antibioticmech:curator-cb71d1e3b5,
    DOI:10.1038/s41564-025-02142-0), fabimycin (antibioticmech:curator-47d32d7a07,
    DOI:10.1021/acscentsci.2c00598), ganfeborole (antibioticmech:curator-172bfdd938,
    DOI:10.1038/s41591-024-02829-7), lolamicin (antibioticmech:curator-1db8575797,
    DOI:10.1038/s41586-024-07502-0), macozinone (antibioticmech:curator-607ce000f8,
    DOI:10.1002/emmm.201303575), quabodepistat (antibioticmech:curator-88af230f5d,
    DOI:10.1128/aac.00338-22), sorfequiline (antibioticmech:curator-0106724e5f, DOI:10.1128/aac.02404-19),
    telacebec (antibioticmech:curator-17023fe654, DOI:10.1038/nm.3262), ibrexafungerp
    (antibioticmech:curator-fd1c955758, DOI:10.1093/mmy/myac049), manogepix (antibioticmech:curator-4a1156c964,
    DOI:10.1128/aac.01723-25), and olorofim (antibioticmech:curator-18f8e84826, DOI:10.1128/aac.00307-23)
    — still lack top-level biosynthesis_origin, mode_of_action, mode_of_action_target_scope,
    and CURATOR mode_of_action_notes.'
- finding_id: unreviewed-seeded-pdb-structural-observations
