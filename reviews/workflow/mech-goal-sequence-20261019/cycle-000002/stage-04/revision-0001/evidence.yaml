  summary: 'Three SEEDED records carry ChEBI-seeded PDB structural_observations with
    relevance: UNREVIEWED (unblocked for Stage 5 curation by PR #1261) (3 target(s):
    CHEBI:138488, CHEBI:28971, CHEBI:44499). Three SEEDED EXACT records in the structure-unreviewed
    queue — alsterpaullone (CHEBI:138488, PDB:1Q3W), ampicillin (CHEBI:28971, PDB:1H8S),
    and methyl nonanoate (CHEBI:44499, PDB:1CLY) — carry ChEBI-seeded structural_observations
    with relevance: UNREVIEWED and evidence_status: PRIMARY_EVIDENCE_NEEDED. Cycle
    1 Stage 6 (PR #1261) updated scripts/seed_from_sources.py to preserve curator-reviewed
    structural_observations across reseeding, unblocking Stage 5 primary PDB complex
    curation on all three records.'
