- evidence_id: original1996
  kind: primary_source
  reference: PMID:8836773; DOI:10.1111/j.1399-3011.1996.tb01096.x; https://www.cmdr.ubc.ca/bobh/wp-content/uploads/2016/10/161.-Kondejewski-1996.pdf
  locator: All seven original pages 460–466 read; page461 Tables 1–2 independently
    viewed. Methods, material source, NPN experiments and Discussion inspected.
  accessed_at: '2026-10-21T17:40:20Z'
  support: supports
  summary: Table 1 distinguishes parent cyclic S, with two D-Phe and Orn residues,
    from synthetic Lys-containing analogues. Sigma supplied GS; the bulk salt/counterion
    is not specified. Broth MIC testing used LB without added salt, 5×10^5 CFU/mL
    and overnight incubation at 37 degrees C. Parent S liquid MICs include E.coli
    UB1005 12.5, DC2 3.1, SC9251 6.2 and SC9252 3.1 micrograms/mL; P.aeruginosa H187
    12.5; S.aureus SAP0017 and K147 3.1; and B.subtilis Vernon 3.1. Agar values differ
    markedly for Gram-negative strains. The paper also measures E.coli SC9251 NPN
    uptake, an outer-membrane perturbation assay, not direct single-channel recording
    or proof that every downstream effect is caused by a discrete pore. Parent antibacterial
    activity is supported without transferring analogue values or specifying an unreported
    salt.
  snapshot_sha256: 7fc6fd8c3400050610719fba979196c9c062c3d79a6fa92090331364a4d855f1
- evidence_id: original2018
  kind: primary_source
  reference: PMID:30301848; DOI:10.1128/mBio.00802-18; https://pmc.ncbi.nlm.nih.gov/articles/PMC6178620/
  locator: Complete original main text and captions, with Figures 1, 3, 4, 5 independently
    viewed. Supplemental captions read; Text S2 download yielded HTML and publisher
    route returned403.
  accessed_at: '2026-10-21T17:39:54Z'
  support: supports
  summary: Figure 1C explicitly depicts the native cyclic S sequence. In B.subtilis168,
    the main study uses log-phase cells at OD600 0.3, LB, 30 degrees C and generally
    10-minute exposure at 1×MIC, reported as 1 microgram/mL. S gradually and partially
    depolarizes cells at 1×MIC and fully depolarizes at 2×MIC; it produces little
    propidium-iodide influx. In POPG/POPE model membranes, discrete long-lived pores
    are observed for tyrocidines, whereas S gives short broad conductance events at
    membrane-collapse concentrations, 5 micromolar. S also delocalizes selected peripheral
    membrane proteins and alters lipid domains. These results qualify a pore-only
    interpretation but support broad membrane action. Protein relocalization is not
    direct protein binding, and tyrocidine DNA or transmembrane-protein findings must
    not be assigned to S. Exact experimental material details beyond the main text
    remain bounded by unavailable Text S2.
  snapshot_sha256: 671ff43a98fd391895d45cf8a4237da05c6af251a6ddfbe44b54f95d694124ce
