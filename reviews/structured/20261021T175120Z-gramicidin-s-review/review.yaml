limitations:
- The entire native record and exact maintained rows were assessed. Both adopted abstracts
  were read; the 1996 original was read in full and Tables 1–2 viewed. The 1999 adopted
  review full text was unavailable through the inspected publisher route, so its scope
  is the complete indexed abstract.
- 'The complete 2018 main text and captions were read and Figures 1, 3, 4, 5 viewed.
  Supplemental Text S2 was not obtained: the PMC .docx route returned HTML and the
  official publisher route 403. Other supplemental raw figures and data were not reprocessed.
  The 2014 article was retrieved as a lead but not relied on as inspected evidence.'
- The 1996 commercial GS material has no specified bulk counterion, hydration or purity
  in the inspected Methods. Qualitative parent activity is supported, but a neutral
  free-base or particular salt assay cannot be asserted solely from the compound name.
- The optional internal chemistry check exited1 for average mass 1141.4 versus 1141.47;
  required schema/strict and independent exact-authority/residue checks pass. This
  does not establish a failed required check or identity defect.
- This bounded review does not claim exhaustive coverage of all gramicidin S mechanisms,
  producers, resistance routes or clinical use. Newly encountered biosynthetic enzyme
  abstracts are class context, not antibacterial target evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
