- PMID 426520 was read from all five original scanned pages. PMID 893226 was read
  in full as extracted text, with Figure 1, Methods and Table 2 visually checked.
  Neither Methods section states the exact sample counterion; the BL-S786 name and
  original chemical scaffold support ceforanide active-moiety mapping without proving
  an isolated neutral solid.
- The complete abstract of adopted PMID 315929 was read from the index and publisher;
  the full article remained subscription-only. No paid access was used. Population
  susceptibility and clinical outcomes are not converted into modern breakpoints or
  universal efficacy.
- The US patent review covers the abstract, introductory scope, indexed claims and
  selected original drawings, especially claim 1. It does not claim visual reading
  of every page. BE837682 original chemical content remains unavailable in the inspected
  public representation.
- LINCS LSM-2838 is officially attested but the provider failed certificate verification.
  Beilstein and paid CAS Registry contents were not accessed. DrugBank public identity
  was inspected through web retrieval after direct HTTP 403.
- The five FDA historical approvals and discontinued marketing states were verified.
  No inspected exact-NDA withdrawal notice was found in the bounded search. The located
  2003 Precef notice concerns ANDA062579 and was not transferred to NDA050554.
- No native gene/protein, pathway or stress-response assertion required a structured
