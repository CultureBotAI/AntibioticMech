- evidence_id: primary-1979
  kind: primary_source
  reference: PMID:426520; https://doi.org/10.1128/AAC.15.2.318; https://pmc.ncbi.nlm.nih.gov/articles/PMC352652/
  locator: All five original scanned pages 318–322, Methods, Figure 1 and Tables 1–3
    visually read.
  accessed_at: '2026-10-21T11:34:28Z'
  support: supports
  summary: The paper tests Bristol BL-S786/ceforanide against 453 clinical isolates
    using broth microdilution. Routine assays used Mueller-Hinton broth, reported
    diluted inocula around 10^5 cells/mL before addition, and 18 h at 37°C; streptococcal
    conditions differed. It supports antibacterial activity with marked organism and
    inoculum dependence. Only 20% of 25 Enterobacter isolates were inhibited at 25
    µg/mL in this cohort. The authors explicitly contrast more susceptible earlier
    cohorts; this is not proof that Enterobacter is universally resistant. Their MBC
    method uses less than five colonies and describes 99% killing, not the common
    99.9% convention. No exact counterion was stated in Methods.
  snapshot_sha256: c2c3d67729243b8da3bf98835a7e486e873b04cb9d5019457cdce13d45ec9b06
- evidence_id: primary-1977
  kind: primary_source
  reference: PMID:893226; https://doi.org/10.7164/antibiotics.30.576; https://www.jstage.jst.go.jp/article/antibiotics1968/30/7/30_7_576/_pdf
  locator: Full seven-page paper read as extracted text; original Figure 1, Methods
    and Table 2 visually inspected on pages 577–578.
  accessed_at: '2026-10-21T11:34:28Z'
  support: supports
  summary: The 5,762-isolate multicentre study explicitly names BL-S786 and depicts
    the ceforanide free-acid scaffold. Broth microdilution used a final 5 × 10^5 organisms/mL,
    15–18 h at 35°C, clear-well MIC endpoint and specified supplements for fastidious
    organisms. At 16 µg/mL, 70% of 196 E. cloacae and 83% of 125 E. aerogenes isolates
    were inhibited. Other Enterobacter groups, E. coli, Klebsiella, P. mirabilis,
    Citrobacter and Salmonella also show activity with varying susceptibility. The
    small pooled Other group includes three Shigella and one Arizona isolate, so it
    cannot independently justify a modern universal or prevalence claim for those
    taxa. Figure 1 maps the active moiety; the sample’s exact counterion is not specified.
  snapshot_sha256: e80ed7f4f347ca9751c86eaaf27679a84edddc08ac19935ea19c5aeaf99541cf
