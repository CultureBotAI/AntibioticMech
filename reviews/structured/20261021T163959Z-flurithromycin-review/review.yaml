limitations:
- Independent Reaxys identity and original development-code P 80206/Cl-932 spelling
  remain unresolved; source-attributed aliases are not silently normalized.
- The nephritis case report has no available abstract. The 1995 genital-tissue study
  and 2004 bacterial mechanism study were read at complete-original-abstract depth,
  not full-main depth.
- The native graph is the free-base ketone. Original experiments can involve solution
  hemiketal equilibrium; clinical ethylsuccinate material and exposure measurements
  are distinct contexts.
- No primary direct-binding target is established here. Cellular inhibition of translation
  and ribosomal assembly does not by itself identify a particular directly bound protein.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
