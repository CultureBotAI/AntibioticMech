- evidence_id: original-identity
  kind: primary_source
  reference: DOI:10.7164/antibiotics.36.1439
  locator: 452-original1983.pdf, selected pp1439–1442 and1447–1448; Scheme1 p1440
    visually inspected
  accessed_at: '2026-10-21T16:31:09.821134Z'
  support: supports
  summary: The original study chemically prepares fluorinated precursors and feeds
    them to blocked S. erythraeus ATCC 31772. It isolates exact (8S)-8-fluoroerythromycin
    A as IV, separately from C as VI and B/D products. IV has C37H66FNO13 and [M+H]+
    752. A solution-dependent, reversible fluoroketone/6,9-hemiketal equilibrium is
    described; the supported native ketone representation is not thereby a mistaken
    congener. Mutasynthesis does not imply unmodified natural fluorinated production.
  snapshot_sha256: 670bed443aae869df193f9db580e8983c281acbdfc915afd90a2853d001029c7
- evidence_id: original-activity
  kind: primary_source
  reference: DOI:10.7164/antibiotics.36.1439
  locator: 452-original1983.pdf, IV column Tables2–4 pp1444–1445 and antimicrobial
    methods p1448; Tables3/4 visually inspected
  accessed_at: '2026-10-21T16:31:09.821134Z'
  support: supports
  summary: Exact IV has antibacterial activity with strain- and method-dependent MIC/MBC
    values. For S. aureus ATCC 6538P the agar MIC is 0.097 µg/mL, broth MIC 0.195
    µg/mL and MBC 3.12 µg/mL. Erythromycin-resistant strains in the agar panel remain
    above 25 µg/mL. The methods use Mueller-Hinton conditions with organism-specific
    supplements/media and further antibiotic-free subculture for MBC. These data support
    activity, not universal bactericidal efficacy or a protein-binding mechanism.
    No native MIC is added.
  snapshot_sha256: 670bed443aae869df193f9db580e8983c281acbdfc915afd90a2853d001029c7
- evidence_id: patent
  kind: primary_source
  reference: US4673736A
  locator: 452-US4673736A.pdf, synthesis discussion and exact A examples
  accessed_at: '2026-10-21T16:30:20.523736Z'
  support: supports
  summary: Original patent describes conversion of erythromycin A through the anhydro
    hemiketal to (8S)-8-fluoroerythromycin A, supporting the semisynthetic class.
    Its separate A/B/C/D substitutions are not conflated. No legal-status or approval
    inference is made.
  snapshot_sha256: 3796dd795a0ef7911e48b06eef4fef68f6884d118a04498f27e41f74dcfcfc3b
- evidence_id: host
  kind: primary_source
  reference: PMID:3084433; PMID:3733532
  locator: 452-original1986-463.pdf and452-original1986-839.pdf; introductions, methods
    and selected Results; original Fig1 p839 visually inspected
  accessed_at: '2026-10-21T16:29:40.684637Z'
  support: supports
  summary: Both original papers identify P-0501A as (8S)-8-fluoroerythromycin A; the
    latter labels it flurithromycin and shows the matching free-base structure. Seven-day
    rat dosing, liver microsomal activities and perfused-liver clearance concern host
    pharmacology. Their cytochrome P450 effects are not a bacterial molecular target
    or a human safety guarantee.
  snapshot_sha256: 4379cfa0152fd07e0ed595255a56cbf04061b79642439e63235c0f4443e8eac3
- evidence_id: adopted
  kind: primary_source
  reference: Ten adopted PMID records
  locator: 452-adopted-core.json; individual read-depth/disposition in452-source-audit.json
  accessed_at: '2026-10-21T16:29:18.848328Z'
  support: supports
  summary: All ten MED records were resolved. Original abstracts cover H. pylori agar
    dilution/PAE (11165121), respiratory/anaerobic panels and serum effects (1452490),
    adjunct periodontal treatment (15216949), tonsil exposure (2722307), early antibacterial/neutrophil
    studies (3487389) and genital-tissue exposure (7486945). The liver papers 3084433/3733532
    and tissue paper 3245699 were inspected beyond abstracts. 10783037 is a nephritis
    case-report title with no abstract; no unsupported case details are adopted.
  snapshot_sha256: 7dbb08ae9e2810a90c8e928d7faabc915b8e357c2f87f0c093bde65fa3616e39
- evidence_id: human
  kind: primary_source
  reference: PMID:3245699
  locator: 452-PMC176036-page2/page1/page3/page4.png, original printedpp1875–1878
    all visually read
  accessed_at: '2026-10-21T16:29:40.422891Z'
  support: supports
  summary: Surgical patients received oral flurithromycin and underwent microbiological
    serum/tissue assays. The paper distinguishes total tissue content from modeled
    free interstitial concentrations and notes that high total levels need not equal
    active antibiotic. It supports historical human use and exposure, not treatment
    efficacy, an exact administered ester assignment or a bacterial target.
  snapshot_sha256: 1b45f735d6448607be6dad0c73ce84ef0f23f24c1b21917ff91dbbc3c355e718
