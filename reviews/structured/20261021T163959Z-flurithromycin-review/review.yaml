  locator: 452-chebi.json;452-chebi-37143/3992/48924/72588/33281/36047.json
  accessed_at: '2026-10-21T16:29:16.631104Z'
  support: supports
  summary: Current ChEBI preserves the identity and names. A carbon-fluorine bond,
    ring ketone, erythromycin scaffold and documented partial chemical synthesis support
    all four broader parents. Antimicrobial-agent and antibacterial-drug roles are
    compatible with the exact primary activity and qualified clinical context. Source-attributed
