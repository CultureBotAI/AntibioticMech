  accessed_at: '2026-10-21T16:15:52.533976Z'
  support: supports
  summary: The later original isolates AB as compound 2 and PB as compound 3, with
    distinct acyl substituents and respective masses. AB is C22H26O8 with [M-H]- m/z417.1547.
