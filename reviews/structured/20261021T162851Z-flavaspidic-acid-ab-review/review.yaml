- evidence_id: authority
  kind: authority
  reference: CHEBI:65897; CHEBI:26195; CHEBI:51867; CHEBI:55380; CHEBI:76224; CHEBI:33282
  locator: 442-chebi.json and five term snapshots
  accessed_at: '2026-10-21T16:15:16.180158Z'
  support: supports
  summary: Current ChEBI repeats the native identity, definition and polyphenol parent,
    so simple source refresh would retain the classification conflict. The exact CHEBI:26195
    definition requires two or more benzene rings, each bearing hydroxy. Methyl ketone,
    beta-hydroxy ketone and aromatic ketone remain supported; the antibacterial role
    has separate primary support.
  snapshot_sha256: a7372f74703ab4c49ad977d7e6703e4db02275c7843ec91b1678e8c0fae4c3ab
- evidence_id: adopted
  kind: primary_source
  reference: PMID:12951487; DOI:10.1248/bpb.26.1354
  locator: 442-original2003.pdf, full three-page paper; Figure 1 and Table 1, printed
    p1355, visually inspected
  accessed_at: '2026-10-21T16:15:52.003410Z'
  support: supports
  summary: The sole adopted paper isolates AB as compound 2 and PB as compound 1 from
    D. crassirhizoma rhizomes, voucher CNU 1011. Figure 1 distinguishes AB acetyl
    from PB propionyl substitution, with the common butyryl ring. AB DPPH, superoxide
    and rat-brain lipid-peroxidation IC50 values are 76.3, 64.4 and 13.1 µM. This
    supports radical-scavenging language and occurrence. Iron-chelation interpretation
    in the antioxidant experiment is not an antibacterial target claim.
  snapshot_sha256: afdff7bf2f11c89886a556389579c977c3c2b5b3b385ed7588a1d59eaf7a0da3
- evidence_id: antibacterial
  kind: primary_source
  reference: PMID:19471878; DOI:10.1007/s12272-009-1502-9
  locator: 442-PMC7091015.xml complete original abstract; publisher abstract HTML
    in442-original2009-springer.pdf
  accessed_at: '2026-10-21T16:15:52.003469Z'
  support: supports
  summary: The original antibacterial abstract describes separately isolated and spectrally
    characterized AB/PB and paper-disc activity against Gram-positive bacteria, including
    source-described MRSA S. aureus KCTC 1928, S. mutans and B. subtilis. Fungal/chlorella
    negatives are limited to that panel. The inaccessible main tables prevent independent
    assignment of numerical per-congener MICs or inhibition zones; none is adopted.
  snapshot_sha256: 22569895c28836f101733468ffa7317f31a180d98e530f9a701fa0bbdf78570e
- evidence_id: fraction
  kind: primary_source
  reference: PMID:36339560; DOI:10.3389/fphar.2022.961087
  locator: 442-PMC9630833.xml, selected fractionation Results, Table 2, Table 3 and
    mechanism discussion/methods
  accessed_at: '2026-10-21T16:15:52.510542Z'
  support: context_only
  summary: The study could not separate AB and nor-AB; NMR was unsuccessful and identities
    were assigned by multistage MS. A3 was enriched in nor-AB and tested against MRSA
    USA300. Its 6-hour growth-suppression MIC50 and metabolomic changes belong to
    the fraction, not purified AB, and do not establish direct inhibition of a specific
    bacterial enzyme.
  snapshot_sha256: d7c6a664468e0727893316bf69a85b00c6e5ca17a428af578f806b24e57b4988
- evidence_id: later-isolation
