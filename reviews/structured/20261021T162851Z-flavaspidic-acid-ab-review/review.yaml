limitations:
- Independent Reaxys 2067974 identity remains inaccessible. ChemSpider is verified
  at an explicitly tautomer-normalized scaffold level, not by equal raw InChIKeys.
- The 2009 antibacterial main tables/methods were not retrieved. Its complete original
  abstract supports the qualitative isolated-compound claim, while precise congener-specific
  zone or MIC values remain unverified.
- The 2022 A3 fraction cannot establish purified AB potency, a direct enzyme target
  or an exact AB causal mechanism. Bovine xanthine oxidase and antioxidant iron-chelation
  observations are separate contexts.
- Additional anti-PRRSV AB activity was found in a complete original abstract (PMID23178515)
  as a discovery lead. No new antiviral role or mechanism is adopted, and sibling
  BB studies are outside exact-AB evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Standalone chemistry used the batch 019 interpreter against batch 045; the source
  ledger and contract use batch 045.
- Native contains no named gene/protein/pathway. Mixed-fraction pathway suggestions
  and bovine enzyme experiments were excluded from bacterial mechanism adoption, so
  the structured bacterial adapter was not applicable.
- All native inputs and status remain unchanged; no optional field absence is treated
  as a demonstrated defect.
- Before saving, an independent reviewer raised the formal polyphenol requirement.
  A separate atom-level recheck confirmed it, and this unsaved review was revised.
  Broad natural-products terminology is distinguished from the explicit ontology constraint.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
