  snapshot_sha256: 7cd77ab08f7cd8f14173f00ef0a2d4cc75fbff7c4ca6acb32e14aab5c8649afa
- evidence_id: foundational-activity
  kind: primary_source
  reference: PMID:6983861
  locator: DOI:10.1128/aac.22.5.728; 215-additional-core.json, complete original-study
    abstract
  accessed_at: '2026-10-21T11:07:07Z'
  support: partial
  summary: The original T-1982 report explicitly specifies the sodium carboxylate
    with the matching 2R,3S side chain and 7-alpha methoxy/7-beta amino arrangement.
    It reports antibacterial activity in tested Gram-positive/Gram-negative panels
    and protection in mouse infection models. This supports the cefbuperazone active-moiety
    context, but is not an exact neutral free-acid reagent measurement; no MIC or
    sodium/free-acid identity equivalence is adopted.
  snapshot_sha256: 8c571c6e0f781c00dd6004571978ada5d55718b8cc835b3074006e93cb485ee1
- evidence_id: activity-resistance
  kind: primary_source
  reference: PMID:3874597; PMID:3879464
  locator: 215-additional-core.json, complete original-study abstracts
  accessed_at: '2026-10-21T11:07:07Z'
  support: partial
  summary: A 278-isolate anaerobic agar-dilution study and a 726-isolate study independently
    support cefbuperazone antibacterial activity at their tested scopes. The latter
    reports selected beta-lactamase inhibition and EDTA potentiation suggestive of
    a permeability barrier. Tested-enzyme hydrolysis stability is not universal resistance
    immunity, and EDTA potentiation is not direct proof of a specific porin mechanism.
    Reagent salt details and full methods were not verified.
  snapshot_sha256: 8c571c6e0f781c00dd6004571978ada5d55718b8cc835b3074006e93cb485ee1
- evidence_id: morphology
  kind: primary_source
  reference: PMID:3328503
  locator: 215-mechanism-core.json, complete original-study abstract
  accessed_at: '2026-10-21T11:07:07Z'
  support: partial
  summary: After cefbuperazone treatment of cystitis patients, the study describes
    E. coli filamentation, vacuole-like changes, spheroplasts and bulges in urine.
    Its conclusion suggests PBP3 and PBP1 affinity from that morphology. This is phenotypic
    inference, not a demonstrated direct-binding experiment in the inspected abstract;
    it cannot justify quantitative PBP affinities or a direct molecular target claim
    by itself.
  snapshot_sha256: 50a1e0cac78bd19aaf400a2dc6f0143c8a2c9025549b71e57ffb3761f22daa94
- evidence_id: pharmacokinetics
  kind: primary_source
