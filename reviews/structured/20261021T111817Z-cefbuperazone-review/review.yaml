    abstract/introduction
  accessed_at: '2026-10-21T11:07:07Z'
  support: context_only
  summary: The original work validates an HPLC-MS/MS method and studies cefbuperazone
    pharmacokinetics in healthy volunteers after cefbuperazone sodium injection. Its
    introduction attributes PBP/cell-wall statements to manufacturer instructions;
    these are background rather than that paper performing a binding experiment.
  snapshot_sha256: 50a1e0cac78bd19aaf400a2dc6f0143c8a2c9025549b71e57ffb3761f22daa94
