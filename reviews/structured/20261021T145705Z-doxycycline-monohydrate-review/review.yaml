limitations:
- Chemical tautomer and CIP-label differences were assessed with preserved atom-level
  chiral parity and reciprocal mapping, not raw descriptor comparison. This review
  does not infer different epimers from those labels.
- The primary periodontal trial used a modified-release monohydrate formulation alongside
  scaling/root planing. Its 70-subject microbiology subset had baseline imbalance;
  no blanket absence of resistance or broad antimicrobial efficacy is inferred. The
  trial does not itself establish a regulatory periodontal indication.
- Monodox and Oracea contain the same monohydrate ingredient but differ in dose, release
  and indication. Oracea clinical approval does not establish an antibacterial indication
  for its low-dose product.
- The exact-form urethritis paper was inspected at complete-abstract level. Chronic-bronchitis
  monohydrate study detail comes from a regulator synopsis; the full original report
  was not read. COPD trial abstracts with unspecified solid form remain contextual.
- The crystal-structure paper and attempted supplementary file were inaccessible.
  DrugBank contents were blocked; KEGG drug-context placement is retained.
- 'No current-product completeness claim is made: the broad FDA name query includes
  sibling formulations. Only the 76 native product assertions were independently compared.'
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The review adds no native target, MIC, resistance or clinical observations. Missing
  optional structured mechanism objects are not treated as defects.
- Standalone chemistry used the batch 019 interpreter against batch 038; native schema,
  strict and source-ledger checks used batch 038.
- A preparatory CSV lookup initially used the wrong column name and raised KeyError
  after the owner append and lossless read were complete. The actual chebi_id column
  was then inspected, the exact single row captured, and the final source-ledger check
  passed.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
