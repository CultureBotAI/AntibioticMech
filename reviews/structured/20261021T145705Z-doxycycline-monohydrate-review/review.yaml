  reference: data/antibiotics/antibacterial/doxycycline-monohydrate.yaml
  locator: Whole YAML; 372-lossless-read.json contains every clinical common field
    and variable row
  accessed_at: '2026-10-21T14:56:29Z'
  support: supports
  summary: Exact monohydrate with three typed names, explicit hydrate parent, antibacterial
    role and FDA clinical provenance. No native molecular-target, resistance, MIC,
    producer or causal-graph objects. Repeated clinical templates were reconstructed
    exactly with all original values and order.
- evidence_id: chemistry
  kind: authority
  reference: CHEBI:60648; UNII:N12000U13O; PubChem CID54684461; KEGG D00307
  locator: 372-chebi.json/.mol; 372-gsrs.json; 372-pubchem.json; 372-kegg.txt/.mol;
    372-authority-chemistry.json
  accessed_at: '2026-10-21T14:56:29Z'
  support: supports
  summary: Eight encodings give one doxycycline plus one water, aggregate C22H26N2O9,
    zero charge and matching masses. Native, ChEBI and GSRS have XQTWDDCIUJNLTR-CVHRZJFOSA-N;
    PubChem uses FZKWRPSUNUOXKJ-CVHRZJFOSA-N with a different enol pattern. Explicit
    normalization preserves original atom-neighbor ordering and parity at all six
    centers, disables stereo removal, and produces reciprocal chirality-aware mappings.
    This is not a demonstrated epimer mismatch.
  snapshot_sha256: 15fee359777fe8a73fe10d95cb681245dc4b38b296a8092137cb7c5e974d5071
- evidence_id: terms
  kind: authority
  reference: CHEBI:35505 hydrate; CHEBI:36047 antibacterial drug; exact ChEBI/GSRS
    names
  locator: 371-parent.json; 371-role.json; 372-chebi.json; 372-gsrs.json; 372-monodox.xml
  accessed_at: '2026-10-21T14:54:10.897184Z'
  support: supports
  summary: The hydrate parent fits the explicit water component. The antibacterial
    role is supported by the conventional monohydrate product. Doxycycline is typed
    INN, rather than an unqualified exact-structure alias; FDA/GSRS also names this
    hydrated ingredient DOXYCYCLINE while separately identifying the anhydrous active
    moiety. The systematic name and hydrate synonym fit the one-water graph.
  snapshot_sha256: e281fcf79f1c367463ea183bb9bf693e1ac327d03af5dd72d5eeb739c7409239
- evidence_id: label
  kind: authority
  reference: DailyMed MONODOX, NDA050641, SPL a65325a7-ae0a-4704-99c4-a3a2e4e1dcf2
  locator: 372-monodox.xml description, clinical pharmacology/microbiology and indicated
    urethral/endocervical pathogens
  accessed_at: '2026-10-21T14:54:49.391953Z'
  support: supports
  summary: The product explicitly contains doxycycline monohydrate and gives C22H24N2O8.H2O
    and mass 462.45. Strengths are doxycycline equivalents. The label identifies bacterial
    protein-synthesis inhibition through the 30S subunit and specified susceptible
    urethral/endocervical infections. This supports the broad record mechanism and
    use without implying universal clinical efficacy.
  snapshot_sha256: 7ca581e47ed94f2729f958fefb784b3c7849f4e490e467fbc887e46fdc3d6d38
- evidence_id: periodontal
  kind: primary_source
  reference: PMID:18315426; DOI:10.1902/jop.2008.070375
  locator: '372-periodontal.pdf pp441-448: exact material, study design, clinical/microbiological
    methods and results; Tables1-8'
  accessed_at: '2026-10-21T14:54:49.393023Z'
  support: supports
  summary: The original study explicitly used modified-release doxycycline monohydrate
    40 mg once daily, Oracea, with scaling/root planing. It randomized 266 adults,
    133 per arm, against placebo plus the same procedure for nine months. Clinical
    attachment and pocket-depth outcomes improved; the microbiology subset contained
    70 subjects with baseline resistance imbalance and no microbiologically significant
    treatment-related change. This supports monohydrate periodontal investigation/use
    with adjunctive low-dose scope, not bacterial killing as its clinical mechanism
    or an independently established FDA periodontal indication.
  snapshot_sha256: 33f85761d3f33c8858ee0432714f05df3593ae9f56b2c3067f107a62f7aee1d8
- evidence_id: low-dose
  kind: authority
  reference: DailyMed ORACEA, NDA050805, SPL aa15c93a-ff4c-447a-8a21-96da506d8997
  locator: 372-oracea.xml sections1,11,12.1,12.4
  accessed_at: '2026-10-21T14:54:49.392828Z'
  support: supports
  summary: The current label identifies monohydrate with 40 mg doxycycline equivalent,
    using immediate- and delayed-release beads. Its indication is inflammatory rosacea
    lesions; its mechanism in that disease is unknown. Exposures are below those required
    to treat bacterial disease and the product is not indicated for bacterial infection
    treatment. Overall ingredient approval in the native record does not mean every
    product is approved for every use listed in the definition.
  snapshot_sha256: b2cfc519c977c609090399f6b0e71513b6715c6f0d61c8f2092e8674f14d8c6a
- evidence_id: urethritis
  kind: primary_source
  reference: PMID:6539988
  locator: 372-monohydrate-core.json complete original abstract
  accessed_at: '2026-10-21T14:54:49.460548Z'
  support: supports
  summary: The original abstract explicitly describes doxycycline monohydrate in 25
    men with non-specific urethritis/adnexitis, distinguishing clinical and organism-specific
    microbiological outcomes. It supports exact-form clinical use; the full paper
    was not inspected and no quantitative native observation is adopted. The separate
    PMID4980166 lead concerns gonorrheal disease and has no abstract, so it does not
    establish the non-gonococcal claim.
  snapshot_sha256: 95784bc7d5e00eac0b487e5ad483fb52fa0b91d62160945c3e9e2a429cbdc75c
- evidence_id: bronchitis
  kind: authority
  reference: Doxycycline UK/W/0090/pdWS/001 public assessment report
  locator: 372-bronchitis-regulator.pdf pp18-19, study DXC-II-94-002
  accessed_at: '2026-10-21T14:54:49.661659Z'
  support: supports
  summary: The regulator summarizes an open-label, non-comparative, multicenter study
    explicitly using doxycycline monohydrate Vibazine DT in lower-respiratory infections,
    including exacerbations of chronic bronchitis. It is use-context evidence rather
    than a controlled demonstration of benefit for all COPD exacerbations. The underlying
    original trial report was not independently inspected.
  snapshot_sha256: a5ee5e972e05d847e77521a7dba588acbb04f8e859cbf1a072374b5d8ba32841
- evidence_id: copd-boundary
  kind: primary_source
  reference: PMID:19875685 and PMID:28483402
  locator: 371-copd-core.json complete original trial abstracts reused with their
    material limitation
  accessed_at: '2026-10-21T14:50:11.595238Z'
  support: context_only
  summary: The inpatient trial separates favorable short-term endpoints from nonsignificant
    day-30 primary success; the outpatient prednisolone-adjunct trial found no prolongation
    of time to the next exacerbation. Abstracts do not establish exact solid form.
    These results bound broad historical use and are not transferred as exact-monohydrate
    quantitative efficacy.
  snapshot_sha256: d7f5d1e7c8e858a7df061acf92e1fd4dd60bad35f7de3d54da6788f6fe932b89
- evidence_id: ribosome
  kind: primary_source
  reference: PMID:42225615; DOI:10.1038/s41467-026-73421-5
  locator: 371-ribosome.xml previously inspected main methods/results/discussion
  accessed_at: '2026-10-21T14:47:42.147458Z'
  support: context_only
  summary: Purified E. coli and C. burnetii ribosome structures directly locate doxycycline
    binding, but the named reagent is hyclate D9891, not monohydrate. This supports
    the parent drug mechanism only and is not evidence that a monohydrate crystal
