  inspected. Only1mg was originally isolated; the SI reports proton/NOESY data, and
  raw spectra were not reprocessed.
- The sole adopted2021 paper was read at complete abstract and selected relevant main
  Results/Table2/methods depth. Its quantitative formicamycin panel is J/R/S, not
  G.
- The2020 original abstract and SI compound19 drawing/data were read; the exact G
  main activity table and methods were not inspected at draft completion, so secondary
  numerical claims are excluded.
- The2026 actual Table1 G row, congener-specific crystal statistics and relevant Results
  were read. Native standard structures omit the experimentally supported Sa axis;
  raw diffraction data were not independently reprocessed.
- Original2017 G MRSA/VRE assays were not performed and no G resistance-selection
  or direct antibacterial target experiment is established by the inspected evidence.
  Missing optional native collections are not themselves defects.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
