limitations:
- The entire native record and maintained exact source rows were read. Initial thirteen
  input hashes were preserved, with six actual ARO/target-policy inputs appended before
  assessment; all nineteen were rehashed unchanged.
- All twenty native activity observations were checked against their exact source
  pages or full primary letter. Source MIC units were converted only by the exact
  equivalence 1 µg/mL = 1 mg/L. Assay references identify cefoxitin as the tested
  drug but do not establish the isolated neutral solid or commercial counterion in
  every experiment.
- The CfxA paper was personally read from all nine original scans. The PBP4 main article
  and figure captions were read in full, but its supplemental methods were not inspected.
  PMID33416461 was checked selectively for relevant results and Table 2, not read
  in full.
- All thirteen adopted ChEBI/ARO citation leads were assessed at the stated scope.
  Faraci PMID3487346 provides only an indexed abstract marked truncated at 250 words;
  PMID15673804 has metadata without an abstract. Most other adopted or CARD-linked
  primary papers were read at abstract level. Downloading their full-text files was
  not counted as reading their tables or validating every underlying edge.
- The current CARD target and twenty-three resistance relationships are verified as
  database assertions. Except for the specifically inspected primary studies, exact
  organism, expression, variant, MIC and enzyme-kinetic support remains a bounded
  follow-up rather than a fully completed primary-mechanism audit.
- HMDB0015426 was officially attested but public page and MOL retrieval returned 403;
  LINCS LSM-5786 failed certificate verification. Paid CAS Registry, Beilstein and
  Reaxys contents were not accessed. DrugBank public identity was inspected through
  web retrieval.
- Patent inspection establishes relevant chemical product passages, not complete visual
  reading of every page or a legal claim interpretation.
- Structured iModulonDB catalog/search checks preceded web research for native protein
  assertions. No expression module or causal inference resulted. Optional absence
  of a producer, dataset, graph or clinical-status summary was not treated as an error.
  Native status remains SEEDED.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
