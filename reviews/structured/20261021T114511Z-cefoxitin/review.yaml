  accessed_at: '2026-10-21T11:43:13Z'
  support: refutes
  summary: cfxA cloning and insertional disruption link this determinant to cefoxitin
    resistance in the tested Bacteroides backgrounds. Table 1 reports 128 µg/mL for
    an intact cfxA strain versus 8 µg/mL after disruption. Whole-cell HPLC shows substantial
    cefoxitin degradation in positive strains. Table 2 instead reports <0.01% relative
    cefoxitin activity in the short crude-extract assay; the authors explain this
    slow rate. This is evidence against unqualified resistance to all beta-lactamases,
    not evidence of rapid purified-enzyme turnover or universal resistance across
    taxa.
