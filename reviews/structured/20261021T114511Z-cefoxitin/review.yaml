- evidence_id: cfxa
  kind: primary_source
  reference: PMID:8517690; https://doi.org/10.1128/AAC.37.5.1028; https://pmc.ncbi.nlm.nih.gov/articles/PMC187887/
  locator: All nine original scanned pages 1028–1036 personally read, including Table
