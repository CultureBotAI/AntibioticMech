findings:
- finding_id: F1
  issue_key: cefoxitin-definition-enzyme-stability-scope
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Qualify the blanket beta-lactamase stability sentence
  description: The ChEBI-derived definition says cefoxitin is resistant to beta-lactamase
    without an enzyme or relative-stability qualifier. Original CfxA experiments show
    cfxA-dependent resistance and cefoxitin degradation; their very slow short-assay
    activity must remain distinguished from whole-cell HPLC degradation. The adopted
    RTEM-2 abstract supports poor substrate behaviour for that enzyme, not universal
    stability. Qualify the sentence to relative, enzyme-dependent stability or remove
    the unsupported blanket wording.
  target_ids:
  - CHEBI:209807
  field_paths:
  - definition
  evidence_ids:
  - record
  - chebi
  - cfxa
  - faraci
  rule_id: 'native-review-checklist: exact identity and claim-level source support'
  native_severity: minor
  normalization_reason: The core cephamycin identity and antibacterial classification
    are correct. This is a bounded overgeneralization in a descriptive sentence, not
    a claim that cefoxitin is unstable to every beta-lactamase or that every resistant
    isolate uses CfxA.
