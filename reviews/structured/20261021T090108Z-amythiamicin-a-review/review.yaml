findings:
- finding_id: F1
  issue_key: aro-3001260-amythiamicin-a-established-stereochemistry-omitted
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Stored chemistry omits experimentally established stereochemistry
  description: All five tetrahedral centers are unspecified. The A-specific structure
    paper assigns the side-chain serine/proline residues as L by chiral HPLC. Thus
