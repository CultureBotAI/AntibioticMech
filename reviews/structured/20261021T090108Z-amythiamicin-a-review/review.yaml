- evidence_id: structure
  kind: primary_source
  reference: PMID:7961166
  locator: DOI:10.7164/antibiotics.47.1153; 096-primary1994.pdf pp1153,1155,1158–1159;
    original p1158 image
  accessed_at: '2026-10-21T08:50:07Z'
  support: refutes
  summary: A-specific NMR/degradation work identifies the oxazoline-linked seryl-prolinamide
    and formula C50H51N15O8S6. Chiral HPLC of A hydrolysates establishes L-serine
    and L-proline. Three thiazole-containing degradation products were racemic, leaving
    their original assignments unresolved in this paper; this does not establish that
    native A was a racemate. Table 4 and the original page were inspected.
  snapshot_sha256: e823de05736c3ebf30b3e11cde00e6940eed236b05d187cb85ba594c8300c0ed
- evidence_id: mechanism
  kind: primary_source
  reference: PMID:7706132
  locator: DOI:10.7164/antibiotics.48.182; 096-primary1995.pdf pp182–184
  accessed_at: '2026-10-21T08:50:07Z'
  support: supports
  summary: The sole adopted PMID has no indexed abstract; all three original pages
    were read. At equal molar exposure, E.coli K12 Q13 S30 poly(U)-directed poly(Phe)
    synthesis inhibition ranks A,D,B,C, supporting the native comparison. A selected
    B.subtilis NRRL B-558 resistant mutant carried tuf Val228Ala and at least 100-fold
    resistance. This is genetic association plus a functional translation assay, not
    purified-protein binding or an engineered causal allele test.
  snapshot_sha256: e757ac0d5682dea3b8d02bc38f7cb472cd0854b5b0e4b09037465cc5eaffedcc
- evidence_id: discovery
  kind: primary_source
  reference: PMID:8040071
  locator: DOI:10.7164/antibiotics.47.668; 096-primary1994-discovery.pdf Methods,production/purification,Table5
    and original p673 image
  accessed_at: '2026-10-21T08:50:07Z'
  support: supports
  summary: Fermentation and separate HPLC purification support Amycolatopsis sp.MI481-42F4
    as producer of A. Serial agar-dilution assays used Mueller-Hinton agar at 37°C
    for 18h. A MICs include S.aureus FDA209P 0.1, MRSA No.5/No.17 each 0.2, B.subtilis
    NRRL B-558 0.2 µg/ml. Tested E.coli NIHJ/K-12 exceed 100 µg/ml; Salmonella enteritidis
    1891 is an exception at 0.39. Preserve strain/condition and compound columns rather
    than universal Gram-negative inactivity.
  snapshot_sha256: 540bf8b9a9c70e4b1f6ffc6fe5f1c01e36cb76a4be3cf38b07c0cf26bdf7e3f9
- evidence_id: synthesis-lead
