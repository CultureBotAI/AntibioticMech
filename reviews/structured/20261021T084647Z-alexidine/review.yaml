limitations:
- All eight adopted original abstracts inspected; only the two2013 International Journal
  of Oral Science main articles were read in full. Primary2008/2018 binding and2010
  host-phosphatase work remain abstract-level for this review. No uninspected method
  details are treated as established.
- Biofilm paper does not identify supplied salt or supplier in inspected methods and
  has concentration/dilution ambiguities; numerical enrichment is conditional. Dentin
  paper explicitly tests dihydrochloride and acknowledges lack of viability measurement.
- LINCSLSM-4432 access failed through public pages/resolver with TLS/access errors.
  Reaxys and CAS registry were not directly inspected. Current ChEBI corroborates
  those accessions but does not independently resolve exact LINCS/Reaxys structures.
- Unspecified stereochemistry is retained as unspecified; this review does not establish
  enantiomer composition,clinical approval,biosynthetic producer or a unique antibacterial
  protein target.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
