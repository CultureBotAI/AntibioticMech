- evidence_id: ecoli-pbp
  kind: primary_source
  reference: https://doi.org/10.11250/chemotherapy1953.28.Supplement2_51
  locator: 1980 Chemotherapy 28 supplement 2, pp.51–56; methods p.51, Figure 2 p.52,
    English abstract p.56
  accessed_at: '2026-10-21T10:52:23Z'
  support: supports
  summary: E. coli NIHJ JC-2 membranes were preincubated with cefadroxil at 1, 5 or
    25 µg/mL before 14C-penicillin G labeling and electrophoresis/fluorography. Reported
    affinity order is 1a, 1b, 3, 2, 4. This is direct competition evidence, not a
    universal PBP3 assignment or purified catalytic IC50. The compound is named; an
    anhydrous-versus-hydrate reagent specification is not established in the inspected
    methods.
  snapshot_sha256: ec0fac9c8f57a87542a5e48e0181ef1cdc6fee49136200144dd8e429dd9536be
- evidence_id: ecoli-stability
  kind: primary_source
