limitations:
- Beilstein/Reaxys registry content and LINCS LSM-5722 were not independently inspected;
  DrugBank DB01140 returned HTTP 403. Current source mappings are retained as authority-asserted,
  without claiming exact registry verification.
- All ten adopted PMID abstracts and current target review PMID 3055170 were inspected.
  Complete primary papers were read for the two 1980 PBP experiments, not every host-disposition,
  immunochemistry or clinical lead.
- The primary PBP studies name cefadroxil but do not resolve anhydrous-versus-hydrate
  reagent composition in the inspected methods. Their quantitative assays must retain
  that material qualification.
- Pneumococcal Table 1 is not split by R6 versus CW1; do not fabricate separate strain
  MIC rows. Historical MICs and competition measurements do not establish clinical
  breakpoints or one universally lethal PBP.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Original 13-input capture preserved; actual ARO/target owners and guidance expanded
  provenance to 24 files before assessment. All hashes unchanged. No native/source/status/history
  edits.
- Schema/strict used batch 021; chemistry used existing locked batch 019 RDKit 2026.03.5
  against batch 021 cwd.
- The original PNG pages 631/633 were fetched after a parser initially selected duplicate
  figure thumbnails; final evidence uses corrected full-page hashes, with both retrieval
  logs retained.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
