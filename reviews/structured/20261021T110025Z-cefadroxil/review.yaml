  acceptance_checks:
  - Preserve the imported CARD assertion separately; use the maintained claim-review
    mechanism rather than manually rewriting source-owned target metadata.
  - Attach DOI 10.11250/chemotherapy1953.28.Supplement2_51 and PMID 7447421 to their
    exact organism, preparation and radioligand competition contexts. Do not treat
    I50 as Kd or identify one universal PBP3 killing target.
  - If adding CELL_WALL_SYNTHESIS_INHIBITION, use MICROBIAL_TARGET scope and taxon-agnostic
    PBP family/function grounding; specific proteins remain independently verified
    examples.
  - Before numeric activity adoption, resolve or explicitly qualify cefadroxil reagent
    hydration and the Table 1 unsplit R6/CW1 context; retain nmol/mL, C medium, inoculum
    and incubation.
  - Keep beta-lactamase hydrolysis, host PepT1 transport and IgE recognition separate
    from antibacterial target evidence.
