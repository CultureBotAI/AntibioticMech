  locator: Figures 6–7, Table 3 and discussion pp.54–56
  accessed_at: '2026-10-21T10:52:23Z'
  support: supports
  summary: Cefadroxil showed low relative hydrolysis by the tested penicillinase and
    Ia cephalosporinase preparations; Proteus vulgaris Ic enzyme did hydrolyze it.
    The source cautions that enzyme amount and substrate affinity also affect resistance.
    These are bounded stability/kinetic observations, not universal beta-lactamase
    resistance or antibacterial-target binding constants.
  snapshot_sha256: ec0fac9c8f57a87542a5e48e0181ef1cdc6fee49136200144dd8e429dd9536be
- evidence_id: pneumo-method
  kind: primary_source
  reference: https://doi.org/10.1128/aac.18.4.629
  locator: PMID 7447421; original pp.629–630 Materials and Methods
  accessed_at: '2026-10-21T10:55:32Z'
  support: supports
  summary: The study names cefadroxil BL-S578 from Bristol and uses S. pneumoniae
    R6 and autolysis-deficient CW1. MIC methods use C medium with yeast extract, about
    6 × 10^4 CFU/mL, 16 h at 37 °C. Whole-cell PBP competition uses 10-min drug pretreatment
    followed by 3H-benzylpenicillin. Hydration state is not specified, and the table
    is not split into two strain-specific rows.
  snapshot_sha256: ece9b8c3ea0c601ee207be339505f8afa4e0f2b0b63059d25f950fe9723d2da9
- evidence_id: pneumo-results
  kind: primary_source
  reference: https://doi.org/10.1128/aac.18.4.629
  locator: Original Table 1 p.632, Table 2 p.634, discussion pp.635–636; full nine-page
    paper inspected
  accessed_at: '2026-10-21T10:55:32Z'
  support: supports
  summary: Table 1 reports cefadroxil MIC 4.3 nmol/mL and PBP competition I50 values
    4.6, 8.0, 1.3, 12.0 and <0.14 nmol/mL for 1a, 1b, 2a, 2b and 3 respectively. At
    MIC, labeling inhibition is 48%, 32%, 77%, 31%, 89%. The authors explicitly find
    no consistent equation of strongest PBP affinity with growth inhibition. Preserve
    original units, assay and unresolved reagent hydration; these are not Kd values
    or clinical breakpoints.
  snapshot_sha256: adbc36dd58c9812e2bff439446e20b4827e7a4681d8eca1ca49d796a5738d25e
