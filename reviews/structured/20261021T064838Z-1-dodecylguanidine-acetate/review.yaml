limitations:
- Older primary papers were inspected at abstract level. The2020 author preproof Results/Discussion
  and Methods were inspected, but supplements and final PMC text were not accessible;
  no quantitative activity rows were curated.
- Direct independent Reaxys, Alan Wood pesticide-page and patent-document verification
  was unavailable. Current official ChEBI links were checked; this limitation does
  not prove incorrect references.
- Bounded searches and inspected sources do not prove absence of other activity, targets,
  resistance, producer or dataset evidence. No paid research was used.
- Authoritative just qc failed during collection because the pinned SciPy 1.15.3 native
  library has an invalid Mach-O section on this platform; identical pinned version
  also failed under Python 3.10. No dependency versions were changed. Full closed-schema,
  reproduction and corpus-integrity gates passed independently; these do not replace
  full QC.
