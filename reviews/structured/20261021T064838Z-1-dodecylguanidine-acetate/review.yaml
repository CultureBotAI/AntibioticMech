- evidence_id: membrane-1991
  kind: primary_source
  reference: PMID:1902648
  locator: https://pubmed.ncbi.nlm.nih.gov/1902648/ — title, DOI and abstract
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: The exact monoacetate was tested in Pseudomonas syringae ATCC12271. The
    abstract reports death and leakage of potassium, UV-absorbing substances and ribose-containing
    material, interpreting extensive cytoplasmic-membrane damage. DOI10.1128/AAC.35.2.341
    verified. Full-text PMC attempts returned browser challenges; no assay-table extraction
    performed.
- evidence_id: membrane-1992
  kind: primary_source
  reference: PMID:1381663
  locator: https://pubmed.ncbi.nlm.nih.gov/1381663/ — abstract; DOI10.1139/m92-019
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: Exact monoacetate treatment of P. syringae at50 µM produced RNA release
    and lysis, with concentration-dependent cytoplasmic coagulation and membrane changes.
    The abstract attributes antibacterial action mainly to surfactant micelles. The
    observed cell effects and that interpretation must remain separate; the latter
    relies on a CMC claim challenged by later work.
- evidence_id: membrane-1993
  kind: primary_source
  reference: PMID:8229668
  locator: https://pubmed.ncbi.nlm.nih.gov/8229668/ — abstract; DOI10.1002/jobm.3620330402
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: Exact monoacetate produced concentration-dependent potassium/phosphate
    leakage and respiratory changes in P. syringae. The authors infer greater micellar
    damage using an earlier aggregation threshold above25 µM. The abstract supports
    measured leakage, not direct binding to a named respiratory protein; its micelle
    premise is disputed by the later conductivity study.
- evidence_id: cmc-disagreement
  kind: primary_source
  reference: PMID:17617418
  locator: https://pubmed.ncbi.nlm.nih.gov/17617418/ — abstract; DOI10.1016/j.jcis.2007.06.038
  accessed_at: '2026-10-21T06:43:19Z'
  support: refutes
  summary: 'This experimental comment contests the earlier20–30 µM CMC: conductivity
    showed no micelle formation up to several hundred µM at25°C, a Krafft temperature
    near52°C and a9.5mM CMC at54°C. It challenges the micelle explanation without
    refuting measured bacterial leakage. Conditions differ and require full-paper
    comparison before reconciliation.'
- evidence_id: fungal-1977
  kind: primary_source
  reference: PMID:200325
  locator: https://pubmed.ncbi.nlm.nih.gov/200325/ — abstract
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: The exact acetate was tested on Fusarium sulphureum isolate1 macroconidia.
    The abstract reports concentration-dependent permeability/transport changes and
    lysis, supporting a bounded fungal-membrane claim. It does not establish a universal
    fungal target or a discrete binding protein.
- evidence_id: fungal-2020
  kind: primary_source
  reference: DOI:10.1016/j.fgb.2020.103414
  locator: https://www.researchgate.net/publication/341724715_The_fungicide_dodine_primarily_inhibits_mitochondrial_respiration_in_Ustilago_maydis_but_also_affects_plasma_membrane_integrity_and_endocytosis_which_is_not_found_in_Zymoseptoria_tritici
    — author journal preproof Results/Discussion pp4–10 and Methods pp11–16; PubMed32474016
    DOI confirmed
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: Primary source text inspected beyond the abstract. Methods name Sigma dodine,
    methanol controls and U. maydis/ Z. tritici strains. U. maydis mitochondrial depolarization
    occurred at lower concentrations than endocytosis inhibition; corresponding plasma-membrane
    effects differed between the fungi. Fimbrin mislocalization is not evidence of
    direct binding. This supports organism-specific mechanistic curation; the preproof
    version and absent supplementary tables limit extraction.
- evidence_id: fungal-activity
  kind: primary_source
  reference: PMID:23175430
  locator: https://pubmed.ncbi.nlm.nih.gov/23175430/ — abstract; DOI10.1002/ps.3434
  accessed_at: '2026-10-21T06:43:19Z'
  support: supports
  summary: The study reports dodine efficacy against cherry leaf spot and Blumeriella
    jaapii isolate MICs spanning0.05–400 µg active ingredient/mL, with orchard isolates
