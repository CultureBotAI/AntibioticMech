limitations:
- The adopted2001 overview was read at indexed abstract level. The2000 original Methods/Results/Tables/Discussion
  and2012 susceptibility/resistance sections and Table4 were read; raw gel and susceptibility-plot
  images were not inspected.
- The official Factive label is dated2018 and is used for chemical/brand identity
  only. No current marketing or prescribing recommendation is inferred.
- DrugBank returned403; direct Beilstein was not read. KEGG and DrugCentral are broad
  drug associations. Patent inspection is bounded to document context and US Example180,
  not every image-based stereochemical example.
- The native CARD evidence already says database assertion, not a primary citation.
  Clinical-isolate associations and grouped gemifloxacin MIC ranges do not justify
  unsupported allele-specific causal claims.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
