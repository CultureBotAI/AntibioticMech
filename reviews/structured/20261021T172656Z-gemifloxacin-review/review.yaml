- evidence_id: primary2000
  kind: primary_source
  reference: PMID:11036032; DOI:10.1128/AAC.44.11.3112-3117.2000; https://pmc.ncbi.nlm.nih.gov/articles/PMC101612/
  locator: Complete original Methods, Results, Tables 1 and 2, Discussion and figure
    captions; raw gel images not inspected
  accessed_at: '2026-10-21T17:26:15Z'
  support: supports
  summary: SmithKline Beecham supplied gemifloxacin mesylate. S. pneumoniae 7785 and
    isogenic mutants were tested by twofold BHI agar dilution with 10% horse blood,
    10^4–10^5 CFU, 37 degrees C and 18–24 h. Wild-type MIC was 0.06 micrograms/mL;
    single gyrA or parC mutants had 0.12–0.25 and double mutants 0.5–1. First-step
    gemifloxacin selection produced gyrA mutations, followed by parC mutations, suggesting
    preferential gyrase targeting in vivo with substantial contributions from both
    enzymes. Purified recombinant gyrase and topoisomerase IV generated drug-stabilized
    DNA cleavage; Table 2 CC25 values were 5 and 0.1 micromolar respectively. CC25
    measures 25% DNA linearization, not IC50 or binding affinity. These data do not
    equate whole-cell potency, enzyme preference and isolated-subunit binding.
  snapshot_sha256: 83237a544ff083d3de55fed9dbb108a5be20eb34c87151c9621db7fed4c671dd
