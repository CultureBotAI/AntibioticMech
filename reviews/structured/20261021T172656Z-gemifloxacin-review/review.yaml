  locator: Original susceptibility Methods, resistance Results, complete Table 4 and
    Discussion; no raw figure image inspection
  accessed_at: '2026-10-21T17:26:15Z'
  support: supports
  summary: The 403 Taiwan C. difficile isolates were tested by agar dilution on supplemented
    Brucella blood agar with 10^5 CFU, anaerobically for 48 h at 35 degrees C. Gemifloxacin
    was supplied by LG Chem. Table 4 groups 81 moxifloxacin-nonsusceptible isolates
    by moxifloxacin MIC and reports gemifloxacin ranges alongside QRDR substitutions.
    Some moxifloxacin-nonsusceptible isolates retain low gemifloxacin MICs. These
    are isolate associations with grouped MIC ranges, not single-allele complementation
    or mutation-specific gemifloxacin causality; the authors require site-directed
    mutagenesis for uncertain substitutions. Preserve the existing database qualification.
