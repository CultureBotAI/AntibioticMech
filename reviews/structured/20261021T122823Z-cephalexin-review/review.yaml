- evidence_id: pbp2003
  kind: primary_source
  reference: PMID:12813065; DOI:10.1128/JB.185.13.3726-3734.2003
  locator: Original full main text, Methods, Results, Discussion, Tables 1-2; Fig.2
    visually inspected
  accessed_at: '2026-10-21T12:25:45Z'
  support: partial
  summary: The study uses Sigma cephalexin with unspecified solid salt/hydration,
    growing E. coli cells in LB and 30-minute exposure followed by Bocillin FL counterlabeling.
    PBP3 acylation is greater in dividing than filamentous cells; at 5 micrograms/mL
    the reported FtsW comparison is 60% versus 42%. Isolated-membrane competition
    uses 20 micromolar Bocillin FL and gives 155/166 micromolar cephalexin half-inhibition
    for FtsW-replete/depleted membranes. These are assay-specific covalent-acylation/competition
    endpoints, not equilibrium Kd or MIC. Apparent PBP1b loss is described as likely
    sample-preparation artifact; proposed allosteric regulation is interpretation.
  snapshot_sha256: 308a93bb28efdf438949dd2e5635b37c058a0215f71212add3c628eb05221cca
