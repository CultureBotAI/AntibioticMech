limitations:
- HMDB HTML/XML returned 403 and the LINCS portal failed certificate verification.
  Beilstein, Reaxys and direct DrugBank content were not independently inspected;
  no absence or broken-identifier conclusion follows.
- All fifteen adopted compound/target/class leads were assessed at complete-abstract
  or metadata depth. The 2003 original main text was read; full 1985 methods were
  unavailable.
- The 2003 Sigma reagent has unspecified solid salt/hydration. Its PBP competition
  values are not independent MICs or equilibrium dissociation constants.
- Cepastar, Cepexin and Cephacillin product-specific formulations remain unresolved;
  source-attested names are not treated as proof that every formulation is the exact
  native material.
- Patent checks establish relevant document identity only. No comprehensive present-day
  clinical, allergy or worldwide regulatory review is claimed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native/source/history/status change occurred. All 16 captured input hashes remain
  unchanged.
- A clinical product label used as context is explicitly monohydrate; this review
  covers only the unsolvated record and does not declare coverage of another record.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
