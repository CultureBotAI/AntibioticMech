summary: Nine structure encodings agree on exact neutral diflunisal. The cited original
  supports E. coli K12 growth inhibition and computational MurA docking, but the native
  definition presents the proposed MurA-to-cell-wall mechanism as established causality.
  Dolobid is also an official product brand represented as EXACT_SYNONYM. All fifteen
  FDA assertions across ten applications reconcile, and the four adopted source citation
  leads have individual dispositions. A separate H. pylori beta-clamp study is retained
  as a bounded optional enrichment lead, not evidence for E. coli MurA.
