  locator: 363-card.html definition, aliases, exact cross-references and publications;
    363-card-class.html definition and parent/subterm sections
  accessed_at: '2026-10-21T14:39:35.598812Z'
  support: supports
  summary: Current CARD repeats the native definition and seven aliases, resolves
    all four exact cross-references and cites only PMID35453279 for this entry. ARO:3007159
    is the salicylic-acid-derived antibiotic class; the native chemical graph and
    observed growth activity fit that scope. Database repetition does not add an independent
