- evidence_id: primary-methods
  kind: primary_source
  reference: PMID:35453279; DOI:10.3390/antibiotics11040528; PMC9031695
  locator: 363-primary.xml complete main paper, Figure 1 caption, Results 2.1–2.5,
    Discussion, Methods 4.1–4.5 and Appendix A Table A1
  accessed_at: '2026-10-21T14:39:35.598315Z'
  support: refutes
  summary: The authors call the candidates MurA inhibitors, but the inspected experiments
    measure bacterial OD600 growth. Diflunisal S8 was docked into L. monocytogenes
    EGD-e MurA, with a predicted R233 interaction; Figure 1 labels the inhibitors
    putative. The complete methods describe docking, reagent preparation, cultures,
    growth and MIC tests, without a MurA catalytic assay, direct-binding measurement,
    genetic target test or cell-wall endpoint. Thus the cited work does not establish
    the definition's causal MurA inhibition and cell-wall disruption.
  snapshot_sha256: 547c27e35b0769968d0a7ad7d3c44d077de613eecb5d43c8e2a7d664ed2c1836
- evidence_id: primary-activity
  kind: primary_source
  reference: PMID:35453279
  locator: 363-primary.xml Results 2.4–2.5, Figures 4–5, Table 1, Methods 4.2–4.5
    and Appendix A Table A1
  accessed_at: '2026-10-21T14:39:35.598315Z'
  support: supports
  summary: Sigma diflunisal S8 in DMSO inhibited E. coli K12 growth under the reported
    broth/24-hour OD600 conditions; Table 1 reports MIC 0.0625 mg/mL. The paper identifies
    ATCC as the strain supplier but gives no exact K12 accession. Its L. innocua result
    is negative only under the tested conditions. These observations support antibacterial
    activity while preserving strain, material and assay scope, independently of the
    proposed MurA mechanism.
  snapshot_sha256: 547c27e35b0769968d0a7ad7d3c44d077de613eecb5d43c8e2a7d664ed2c1836
- evidence_id: dolobid
  kind: authority
  reference: DailyMed Dolobid SPL725234b2-0e23-45c3-a42d-eb4e62273f9b; FDA NDA018445
    historical label
  locator: 363-dolobid.xml title, description, indications and product/application
    identity; 363-fda2007.pdf p1 trademark/description and indications section
  accessed_at: '2026-10-21T14:39:35.598905Z'
  support: refutes
  summary: The current SPL identifies Dolobid tablets containing diflunisal, and the
    historical official label explicitly identifies DOLOBID as a registered trademark.
    ChEMBL independently types Dolobid as TRADE_NAME. Therefore synonym[1] should
    preserve the alias with BRAND_NAME rather than EXACT_SYNONYM. Current named-product
    marketing and the old discontinued NDA are distinct application contexts.
  snapshot_sha256: bc97e13694bf16112b6541fba3678973274eb817ac46f131a52a57f513c23052
