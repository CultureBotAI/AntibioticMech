limitations:
- The MurA finding is bounded to the cited study and inspected current CARD support.
  It does not demonstrate that diflunisal can never inhibit MurA, and the additional-source
  search is not a systematic review of every possible later experiment.
- The original growth assay identifies Sigma diflunisal and E. coli K12 from ATCC
  without a specific reagent catalog or strain accession. Its 24-hour broth OD endpoint
  and tested conditions are not universal susceptibility, bactericidal or clinical
  efficacy evidence.
- All four adopted source PMID abstracts were inspected; the three context-only ChEBI
  papers were not read as full bodies because their abstract scope does not support
  the disputed bacterial mechanism.
- The optional H. pylori beta-clamp source was verified through its full original
  abstract and deposited crystallographic metadata/identity. Publisher full text returned
  403 and could not be opened in the browser. Numerical MIC versus IC50 interpretation,
  complete assay conditions and material details remain unadopted.
- Current CARD repeats all seven aliases, but only Dolobid received independent official
  named-product verification. The remaining aliases are not certified as exact chemical
  synonyms or automatically classified as brands.
- Native focused checks passed; shared corpus-gate outcomes are integrated separately.
  Native records and maintained inputs were not edited.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- 'A successful molecular/schema gate does not settle experimental causality: docking,
  measured growth, biochemical target inhibition and clinical approval are distinct
  evidence levels.'
- The frozen FDA assertions use GSRS version 35 and current GSRS is version 38 with
  matching exact structure. This version difference alone is not an identity or provenance
  defect.
- Standalone chemistry used the recorded batch 019 interpreter against batch 037;
  native schema and strict checks used batch 037. Review artifacts were prepared in
  scratch for the coordinator to integrate and save.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
