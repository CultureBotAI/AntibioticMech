  accessed_at: '2026-10-21T12:25:48Z'
  support: supports
  summary: Purified truncated PBP2 from susceptible N. gonorrhoeae FA19 was expressed
    in E. coli. Crystals soaked in 50 mM ceftriaxone for 5–7 minutes gave a 1.83 Å
    acyl-enzyme structure with a covalent bond to Ser310. The C3 leaving group remains
    in one crystallographic molecule and is eliminated in the other. This is direct,
    taxon- and construct-scoped PBP acylation evidence suitable for optional primary
    target enrichment; it is not an equilibrium affinity or a whole-cell MIC. The
    native family target can remain taxon-agnostic while a specific example is separately
    grounded.
- evidence_id: pilq
  kind: primary_source
  reference: PMID:16101998; DOI:10.1111/j.1365-2958.2005.04752.x; PMID:25199775; DOI:10.1128/AAC.03082-14
  locator: '264-pilq.html/.txt: relevant mutation/oligomer Results, antibiotic-resistance
    section, Discussion and MIC methods; 264-pilq2014.html/.txt: relevant methods,
    Results and Tables 1–2'
  accessed_at: '2026-10-21T12:25:48Z'
  support: refutes
  summary: The 2005 PilQ E666K study reports approximately 1.5–2-fold higher ceftriaxone
    MIC in the PR100 pilQ2 background, as data not shown. Its secretin/oligomer and
    resistance experiments favor altered entry, while discussing direct-pore and indirect
    permeability models. The 2014 study transfers a selected two-base pilQ insertion
    into gonococcal 3502 with mosaic penA, raising ceftriaxone MIC from 0.03 to 0.5
    micrograms/mL. PilQ is an outer-membrane secretin, not a penicillin-binding drug
    target. These studies support a conditional resistance contribution and refute
    the imported target-alteration category; they do not establish direct ceftriaxone
    binding to PilQ or a universal effect in every background.
  snapshot_sha256: 46cd8c089224697ae06b53f5808e05fcde1efcde34f0a86067fb9c158d70686f
