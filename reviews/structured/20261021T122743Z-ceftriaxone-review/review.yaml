limitations:
- 'The IreK route remains uncertain: inspected original phosphorylation and susceptibility
  experiments support cell-wall signaling associated with ceftriaxone resistance,
  but not a direct permeability measurement. Supplementary strain-to-reference-genome
  mapping was not established.'
- Two adopted class records have no abstract. Several enzyme, clinical, surveillance
  and review leads were assessed at complete-abstract depth rather than full experimental-table
  depth; their native database assertions were not promoted to primary evidence.
- KpnEF lists ceftriaxone among tested drugs but omits its numeric MIC from the representative
  table. AbuO complementation is numerically partial for ceftriaxone. Neither paper
  measures ceftriaxone transport directly in its fluorescent transport assay.
- Direct HMDB and DrugBank retrieval returned 403; MetaCyc served a login page. Reaxys
  was corroborated through current ChEBI without independent registry access. The
  first ChEBI molfile endpoint returned HTML; only the separately fetched real molfile
  was used for chemistry.
- Patent documents were inspected at abstract/identity and selected synthesis depth,
  not every claim or example. Wikipedia is contextual only. The official formulation
  label concerns the disodium 3.5-hydrate, not the neutral native formula.
- The PBP crystal source was inspected through the public primary full text; the optional
  taxon-specific target example was not added. No current treatment recommendation
  or clinical extrapolation is made.
- Other commercial-looking aliases were not independently resolved to exact official
  product formulations; the confirmed brand-type finding is limited to Rocephin.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The scientific review did not change the native target or maintained source inputs;
  all 19 captured input hashes remain unchanged.
- An ignored-inclusive search covered maintained curation, conf, raw inventory, scripts
  and documentation for exact target identifiers and labels. Missing optional enrichment
  was not converted into a defect.
- The 13 CDC source comparisons retain page-specific breakpoint context and should
  not be recast as present-day treatment advice.
- Evidence snapshots and fetch manifests in /private/tmp/am-review-session retain
  actual access timestamps and hashes; evidence.accessed_at records the final inspection
  date.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
