  locator: '264-irek2021.html/.txt: methods and relevant IreK/GpsB/MltG Results; 264-irek2023.html/.txt:
    relevant Results/Discussion and methods'
  accessed_at: '2026-10-21T12:25:48Z'
  support: partial
  summary: The 2021 work compares IreK-dependent phosphoproteomes during ceftriaxone
    exposure and validates GpsB/MltG phosphorylation. The 2023 work connects GpsB
    multisite phosphorylation with ceftriaxone MIC in E. faecalis OG1 strains. Some
    phosphorylation and resistance changes diverge, indicating additional regulatory
    complexity. These support cell-wall signaling associated with resistance, but
    the inspected experiments do not directly establish reduced ceftriaxone permeability.
    Keep the positive determinant context while qualifying the specific imported route;
    do not invent a reference-genome assignment or infer absence of resistance.
  snapshot_sha256: 15a68b88319f989115ae8db66676e444bbefddd27d89b5c1b49216e4263432b6
