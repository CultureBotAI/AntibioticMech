  support: refutes
  summary: Native SMILES fails RDKit 2026.03.5 kekulization at atoms 6, 7 and 12;
    current ChEBI repeats the invalid string. Changing only the triazinedione fragment
    c(=O)c(=O)nn3C to c(=O)c(=O)[nH]n3C yields a valid graph identical to the current
    ChEBI molfile, PubChem and KEGG representations. It reproduces native VAAUVRVFOQPIGI-SPQHTLEESA-N,
    C18H18N8O7S3, net charge 0, both R core centers, Z oxime and masses. ChEMBL has
    a valid hydroxy tautomer with the same Standard InChIKey; this is not a demonstrated
    different compound.
  snapshot_sha256: 8fad6ca40d8c9ef6acd4891589e28a9f571a9e9208ad2f62ff9eafa214fb8e80
