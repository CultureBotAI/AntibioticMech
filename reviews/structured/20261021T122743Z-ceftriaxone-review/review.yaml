- evidence_id: pbp
  kind: primary_source
  reference: PMID:31362987; DOI:10.1074/jbc.RA119.009942; PDB:6P54
  locator: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC6755799/: original Results for
