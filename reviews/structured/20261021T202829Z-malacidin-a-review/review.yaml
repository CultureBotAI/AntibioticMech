summary: The adopted graph matches current ChEBI, and the original isolation paper
  supports calcium-dependent antibacterial activity. The structure nevertheless leaves
  four beta stereocentres unspecified despite their later experimental assignment
  by total synthesis and analysis of natural material. A separate exact PubChem association
  has two opposite beta configurations and an additional unspecified centre. The incomplete
  native graph and mismatching external grounding are distinct major findings, without
  evidence of a natural mixture.
