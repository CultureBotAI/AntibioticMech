limitations:
- The2018 main paper, complete Methods, Table1 and actual Figures2/4 were read; two
  PMC supplement downloads returned recaptcha HTML despite HTTP200, and a publisher
  supplement request failed DNS. No unread SI table or chromatogram was treated as
  inspected evidence.
- The2020 original full main paper and actual Scheme3 were read. Its main prose reports
  natural-material Marfey confirmation; exact SI access depth is recorded separately
  in the peer audit.
- The exact literal discovery query returned only three indexed singular-name results
  and missed the plural2018 title. No comprehensive absence claim is made.
- No missing optional molecular target, producer, causal graph, activity observation
  or resistance field is itself a defect. Heterologous expression, in-vitro activity,
  topical animal efficacy and clinical use are distinct scopes.
- The2020 SI was inaccessible by Wiley403, PMC preparation HTML and EuropePMC not-open-access
  response. Main-text reported NMR/Marfey confirmation was read, but no SI chromatogram
  or comparison table was independently assessed. The2021 primary discussion corroborates
  the assignment with different compound numbering; no analogue inactivity is transferred
  to the parent.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
