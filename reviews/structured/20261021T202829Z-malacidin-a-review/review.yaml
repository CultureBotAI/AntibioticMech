- evidence_id: mechanism
  kind: primary_source
  reference: PMID:29434326; DOI:10.1038/s41564-018-0110-1
  locator: Original main results, actual Figure4 and complete membrane/precursor/TLC
    Methods
  accessed_at: '2026-10-21T20:23:49Z'
  support: supports
  summary: MalacidinA caused no rapid SYTOX/DiBAC4 response under the tested MRSA
    conditions, accumulated UDP-MurNAc-pentapeptide and showed calcium-dependent loss
    of its free TLC band upon mixing with purified lipidII. C55-P did not produce
    the same effect. These experiments support lipidII interaction and a cell-wall-related
    effect, with assay-specific limits; they do not identify a protein target, atomic
    binding site or universal absence of membrane effects. No resistant S.aureus was
    selected during the stated20-day experiment; this does not establish universal
    resistance-proof activity.
