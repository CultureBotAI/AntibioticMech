  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: The exact PubChem association has two conflicting beta configurations
  description: Current CID132274667 assigns MeDap2 beta S and MeAsp8 beta R, whereas
    the2020 primary establishes R and S respectively. It also omits the supported
    gamma configuration of MePro10. The two positive inversions survive a comparison
    that masks only the missing gamma centre; changing precisely those two assignments
    restores reciprocal chirality-aware agreement. This exact xref therefore cannot
    independently validate the named natural structure. The native graph itself leaves
    these two beta centres unspecified, so this external mismatch does not establish
    an opposite assigned native stereoisomer.
