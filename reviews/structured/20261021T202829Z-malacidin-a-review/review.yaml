  support: supports
  summary: At15mM supplemented CaCl2, the reported18h/30C microdilution assay gives
    malacidinA MIC ranges0.2–0.8microgram/mL for S.aureus USA300,0.4–0.8 for NRS146(VISA),0.8–2.0
