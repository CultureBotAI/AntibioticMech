- evidence_id: material-boundary
  kind: primary_source
  reference: https://doi.org/10.1128/AAC.12.1.67
  locator: PMID18988; complete original pp67–72, especially Materials p67 and Tables1–4
  accessed_at: '2026-10-21T11:03:00Z'
  support: context_only
  summary: The comparison material is cefamandole lithium, whereas nafate is sodium
    O-formyl ester. Their apparent standard-assay equivalence is influenced by nafate
    hydrolysis. These experiments support cefamandole active-moiety context but do
    not provide unqualified exact sodium-salt MICs.
  snapshot_sha256: eb8554ddb4d0ed63f3e1cec5632d806b081fc49a7dc1ddb88543c51dc7db97d7
