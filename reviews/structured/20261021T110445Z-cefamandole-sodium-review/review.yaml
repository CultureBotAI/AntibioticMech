  locator: Miki et al.1979; original pp253–254 Methods/Results and Table1 visually
    inspected; complete English abstract
  accessed_at: '2026-10-21T11:03:00Z'
  support: supports
  summary: The report explicitly studies cefamandole sodium. Heart infusion agar dilution
    uses undiluted overnight Trypticase soy broth culture and its100-fold dilution.
    S. aureus209P JC MIC is0.2ug/mL undiluted and≤0.1ug/mL diluted; E. coli NIH JC-2
    is1.56 and0.78ug/mL. Table1 separately gives distributions for29 S. aureus,29
    E. coli,27 Klebsiella and30 Proteus isolates; modal values are not individual-strain
    MICs or MIC90. This is direct sodium-salt antibacterial evidence, with no PBP-binding
    assay.
