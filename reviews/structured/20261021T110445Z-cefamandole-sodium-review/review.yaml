    prose. Table1 gives cumulative susceptible-isolate percentages, not independent
    strain MIC rows. This independently supports exact sodium-salt activity without
    direct PBP engagement.
  snapshot_sha256: bdfbdda184c50d534c3bc3176679c9c6922adc11ff8cf1f39f13ff8a73488f9b
