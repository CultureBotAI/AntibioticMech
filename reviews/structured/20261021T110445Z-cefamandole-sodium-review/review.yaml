- evidence_id: sodium1973
  kind: primary_source
  reference: https://doi.org/10.1128/AAC.3.6.657
  locator: PMID4790616; original pp657–658 Materials/Methods and Figure1/Table1, visually
    inspected
  accessed_at: '2026-10-21T11:03:00Z'
  support: supports
  summary: The original paper explicitly identifies cefamandole sodium salt and tests
    1,213 clinical isolates. MIC is defined by no visible growth after 18h at37C on
    Oxoid DST agar; inoculum and larger-inoculum comparisons are specified. MBC uses
