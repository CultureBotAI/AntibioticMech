  support: supports
  summary: NMR/connectivity analysis identifies the glycosidic rhodinose and narrows
    aglycone topology; single-crystal X-ray analysis establishes the complete relative
    structure. Acid hydrolysis yields rhodinose whose negative optical rotation is
    compared with authentic literature L-rhodinose, anchoring the absolute hand. The
    crystal formula is C28H27NO12, space group C2, with reported refinement R 0.049.
    This supports the parent molecular identity; raw diffraction was not independently
    re-refined.
