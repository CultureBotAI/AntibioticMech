  support: context_only
  summary: The original reports low, unstable lactonamycin production from S. rishiriensis
    MJ773-88K4 and small parent amounts isolated by HPLC. It cloned a homologous candidate
    cluster, while decisive glycosyltransferase disruption/complementation and isotope
    incorporation experiments used lactonamycin Z in S. sanglieri. Lct38 efflux and
    Lct56 rRNA-methyltransferase self-resistance roles are predictions from sequence
    similarity, not direct lactonamycin resistance assays or proof of a ribosomal
    inhibition target. The later production difficulty does not negate the original
