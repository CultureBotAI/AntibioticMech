  support: supports
  summary: Calbiochem GM6001 is named with its stereochemical tryptophan-methylamide
    identity. C.trachomatis L2 strain434/bu and C.muridarum NiggII were tested in
    HeLa cells at37C/5%CO2 after2h infection, with30h inclusion assessment. The reported10uM
    MIC is complete inhibition of inclusion formation;50uM MBC is loss of progeny
    inclusion-forming units, not conventional broth MIC. Actual Figure1 supports these
    distinctions. A progesterone-conditioned BALB/c genital model used10uL of1mM solution
    one hour before challenge and three times per day after infection. Figure3 shows
    reduced burden, not universal clearance. Supplier lot/purity is unstated; no human
    efficacy or general host safety follows.
