limitations:
- All ten adopted abstracts were read. The2006 primary full text was inaccessible
  through ordinary publisher routes, and the other adopted host studies were not audited
  beyond their original abstracts.
- The2009 follow-up main/table/captions and actual Figures1/3 were inspected; actual
  Figures2/4 were not independently viewed. The2018 source was read in selected material/inhibition/results
  sections and Table1/chemical Figure1, not its full supplement or all docking plots.
- The2005 toxin paper was read in selected methods/results/discussion; actual gel
  panels were not independently assessed. Its permeability interpretation is context-specific.
- Direct CAS returned401 and LINCS requests failed certificate validation; Reaxys
  was corroborated only through ChEBI attribution. No gated access or credentials
  were used.
- The native SMILES check fails while schema and strict checks pass. Successful scratch
  chemistry establishes a proposed correction, not a native pass.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
