  support: supports
  summary: Calbiochem ilomastat of at least95% purity inhibits recombinant anthrax
    lethal factor and protects against MEK cleavage when inhibitor is incubated with
    extracellular toxin. The experiments use recombinant toxin and host cells, not
    live-bacterium growth assays. Post-entry protection is substantially weaker than
    with the compared CMTs. The paper describes no classical antibiotic activity in
    this context; subsequent Chlamydia growth experiments prevent treating that phrase
    as universal inactivity. Cell permeability must not be assumed to imply equal
    intracellular target access across conditions.
