limitations:
- All five adopted MED identifiers were resolved. Four complete abstracts were read;
  PMID 4736772 has no indexed abstract, and its publisher full text returned 403.
  Its exact litter formulation, efficacy and application conditions remain unverified.
- The original 1976 egg and 2012 brown-root-rot papers were assessed at abstract level;
  full text returned 403. No MIC, dose-response curve, complete sterilization or universal
  absence of phytotoxicity is inferred.
- The additional USDA field paper was inspected for relevant methods/results/discussion,
  not every underlying data table or all raw observations. Selected evidence supports
  fungal-use context only.
- Independent Reaxys 116039 content was not accessible. Current ChEBI corroborates
  its mapping; this limited verification does not establish a wrong identifier. Dazoberg
  has current-ChEBI brand provenance but no separately retrieved manufacturer formulation.
- NIST and other sources mix conventional chemical and trade aliases. Tiazon is retained
  as an authority-listed name without sufficient exact product-only evidence to force
  a new synonym type.
- Dazomet formulations and released MITC are not chemically identical to neat dazomet.
  Future quantitative or mechanistic curation must specify tested material and active
  species; field application rates are not MICs.
- Historical source documents support chemical/use context only. Current regulatory
  permissions, full environmental risk and present commercial formulations were not
  audited.
- Required shared corpus gates remain separate from these focused passes; the review
  does not promote native scientific status or alter records.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No confirmed corrective finding was established. Optional future evidence enrichment
  should retain the egg-study partial reduction, tested formulation, organism/assay
  conditions and decomposition species.
- The native antimicrobial filing preserves both imported activity roles; herbicide
  and nematicide application terms are not silently treated as missing antimicrobial
  roles.
- Native records, maintained inputs and histories remain unchanged. Chemistry used
  batch019 RDKit against batch035, while documented native validators used batch035.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
