summary: Dazomet is the neutral thiadiazinane dithiocarbamic ester represented by
  the native structure. Independent official graphs, CAS identity, KEGG and PPDB agree;
  both antibacterial and antifungal-agrochemical roles remain supported. The original
  egg experiment supports reduced Salmonella recoveries, while fungicidal fumigation
  evidence is scoped to its actual material and conditions. Dazomet is kept distinct
  from its released fumigant methyl isothiocyanate and from commercial formulations.
  No confirmed corrective finding was established; historical-paper access and some
  registry/name details remain limited. Scientific assessment retains the stated evidence
  limits; full verification is blocked by the shared native-library failure.
