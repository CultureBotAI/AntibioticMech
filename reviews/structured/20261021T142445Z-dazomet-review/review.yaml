- evidence_id: eggs
  kind: primary_source
  reference: PMID:786239; DOI:10.1111/j.1751-0813.1976.tb00071.x
  locator: Complete primary abstract in 344-adopted-core.json
  accessed_at: '2026-10-21T14:07:58.047885Z'
  support: supports
  summary: 'Dazomet treatment reduced Salmonella recovery from artificially contaminated
    egg surfaces: one of twenty-one treated versus thirteen of twenty-one untreated
    eggs remained surface-positive. Some organisms persisted in shells or membranes,
    attributed to limited fumigant penetration. This supports antibacterial fumigation
    context, not universal sterilization, a MIC or a parent-specific protein-binding
    mechanism. Full publisher text returned 403, leaving exact formulation and application
    details unresolved.'
  snapshot_sha256: 497c42d9f7db2c8af6612321f2f3ebedb5326e7a9efea3d2804c7bee845625df
- evidence_id: agrochemical
  kind: primary_source
  reference: PMID:22522815; DOI:10.1002/ps.3303; PMID:22228481; PMID:18399425
  locator: Complete primary abstracts in 344-adopted-core.json
  accessed_at: '2026-10-21T14:07:58.047885Z'
  support: supports
  summary: The brown-root-rot trial concerns 98% dazomet fumigation against Phellinus
    noxius and reports an application rate, not a culture MIC. The cucumber and earlier
    greenhouse studies test dazomet/Basamid together with 1,3-dichloropropene; their
    synergy and broad combination performance cannot be assigned to dazomet alone.
    Basamid is explicitly described as 97% dazomet in the earlier abstract. Study-specific
    plant tolerance is not generalized safety.
  snapshot_sha256: 497c42d9f7db2c8af6612321f2f3ebedb5326e7a9efea3d2804c7bee845625df
- evidence_id: field-primary
  kind: primary_source
  reference: USDA Treesearch5335; Fraedrich and Dwinell2003, Southern Journal of Applied
    Forestry27:41–51
  locator: 344-usda-primary.pdf, introduction and methods pp41–43, results p44, discussion
    pp49–50
  accessed_at: '2026-10-21T14:08:29.425348Z'
  support: supports
  summary: The original field study tests dazomet separately from methyl-bromide/chloropicrin
    and nonfumigated controls in two pine nurseries. Inspected methods describe site-specific
    formulations/application, incorporation, irrigation and culture-based fungal/root
    endpoints. Results and discussion show reduced Fusarium abundance or root association
    in several settings, while efficacy and seedling outcomes vary and nutsedge control
    is inferior to the comparator. This independently supports antifungal agrochemical
    use without claiming complete pest eradication, a MIC or universal equivalence
    to methyl bromide.
  snapshot_sha256: efb0c770e9d9182a02406b1ad0769b519b66df21c82c919368a8bf5bd6438db0
- evidence_id: degradate
