  accessed_at: '2026-10-21T08:49:08Z'
  support: partial
  summary: Ambiguine I Table3 reports MIC13.1µM for M.tuberculosis, >128 for B.anthracis,8.9
    for S.aureus,59.7 for M.smegmatis and1.7 for C.albicans; Vero IC50>128µM. Narrative
    instead gives M.tuberculosis11.3µM. The M.tuberculosis assay uses H37Rv and a
    ≥90% inhibition endpoint; S.aureus/Candida use cited broth microdilution methods
