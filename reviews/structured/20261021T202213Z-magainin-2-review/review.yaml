- Current two-star ChEBI 201476 omits every tetrahedral assignment in its default
  InChI and has an invalid aromatic-histidine SMILES. Its submitted systematic name
  is more specific than those default serializations. No native stereochemical defect
  or mixture is inferred.
- The 1987 discovery and cited 1988 article were read in full original scans with
  figures and tables. PMID 9247173 was read only as its complete primary abstract,
  and the 2008 F5W study only at the explicitly stated main-text sections.
- The 2023 cell study was inspected in selected main sections; its methods supplement
  returned HTML instead of PDF. Exact experimental terminal form and full formulation
  remain unresolved, so no numeric or exact-parent stereochemical claim is transferred.
- The 2026 bilayer study was read only at the stated sequence/material/conclusion
  sections. It is context for membrane behavior, not independent proof of a particular
  bacterial lethal target or osmotic rupture.
- The 69-hit exact-name mechanism search is bounded and includes derivatives and model
  systems. The wording finding concerns what the adopted citation actually shows,
  not a claim that all literature excludes bacterial lysis.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
