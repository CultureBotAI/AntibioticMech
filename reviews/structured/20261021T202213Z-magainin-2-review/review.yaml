summary: The native all-L free-acid 23mer is independently corroborated by the original
  sequence, precursor, PubChem and all three current ChEMBL encodings. The cited 1988
  paper supports antibacterial and antifungal activity, but its demonstrated osmotic-lysis
  experiment concerns Paramecium rather than bacteria. One minor finding requests
  accurate organism and mechanism wording without denying bacterial membrane damage
  or possible lysis under other conditions. The less complete two-star ChEBI representation
  and the exact-material limits of later mechanism papers remain explicit.
