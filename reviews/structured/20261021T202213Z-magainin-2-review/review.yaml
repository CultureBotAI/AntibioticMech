- evidence_id: discovery1987
  kind: primary_source
  reference: PMID:3299384; DOI:10.1073/pnas.84.15.5449; https://pmc.ncbi.nlm.nih.gov/articles/PMC298875/
  locator: All five original scanned pages read; exact magainin 2 sequence Figure
    3, Table 1, killing/hemolysis Figure 4 and precursor Figure 5 inspected.
  accessed_at: '2026-10-21T20:13:43Z'
  support: supports
  summary: The original study purified magainin 2 from female Xenopus laevis ventral
    skin, sequenced the 23mer and linked it to precursor cDNA. Table 1 measures inhibition
    in specific bacterial isolates; Figure 4A shows loss of E. coli D31 viability
    after exposure to 10 microgram/mL. The osmotic-swelling/bursting description concerns
    Paramecium caudatum. Bacterial death, growth inhibition and protozoal osmotic
    lysis are distinct observations. The authors describe an antimicrobial host-defense
    interpretation without proving clinical efficacy.
  snapshot_sha256: 206ce9eefcce10a569046b76637f9557932991d2482e72bf382883a1df6449fd
- evidence_id: adopted1988
  kind: primary_source
  reference: PMID:3277183; DOI:10.1073/pnas.85.3.910; https://pmc.ncbi.nlm.nih.gov/articles/PMC279666/
  locator: All four original scanned pages read, with exact component mapping and
    Tables 1–3/Figures 1–3 directly viewed.
  accessed_at: '2026-10-21T20:13:43Z'
  support: partial
  summary: Full-length magainin 2 is component 3, distinct from the truncated 22-residue
    components 1/2 and from magainin 1/component 5. Carboxypeptidase release and synthetic/natural
    chromatography support the free C terminus. Table 3 gives bacterial growth-suppression
    intervals, including 1–7 microgram/mL for E. coli D31 and ATCC25922; the assay
    used about 10^5 CFU/mL, trypticase soy broth, 5 hours at 37 °C and OD600, with
    concentrations 1, 7, 35, 70 and 100 microgram/mL. Figure 2 specifically depicts
    Paramecium caudatum contractile-vacuole swelling and subsequent rupture. The discussion
    explicitly leaves mechanism incompletely defined and suggests altered water flux
    rather than indiscriminate membrane rupture. The native bacteria-specific osmotic-lysis
    sentence is not supported by this experiment.
  snapshot_sha256: 40f9dca1476488e4e270b4b7e3af3d9a411c73025bf02acce4e2997d0d217846
- evidence_id: native1997
  kind: primary_source
  reference: PMID:9247173; DOI:10.1016/S0005-2736(97)00051-5
  locator: Complete indexed primary abstract, retrieved within the bounded exact-name
    mechanism query.
  accessed_at: '2026-10-21T20:16:57Z'
  support: partial
  summary: The original abstract explicitly distinguishes native magainin 2 from charge/hydrophobicity
    variants. Native treatment of E. coli induces potassium efflux, loss of viability,
    surface blebs and increased outer-membrane permeability. This supports bacterial
    membrane damage and death, while not itself establishing osmotic rupture as the
    universal killing endpoint. Full experimental text, exact bulk formulation and
    terminal-state verification were not obtained, so no quantitative or stereospecific
    target assertion is imported.
  snapshot_sha256: c7de5659adff81a1a91d866d3ead266e48be5b5d693efda736f7160e1dc7a02b
- evidence_id: analogue2008
  kind: primary_source
  reference: PMID:18835901; DOI:10.1529/biophysj.108.133488; https://pmc.ncbi.nlm.nih.gov/articles/PMC2599864/
  locator: Original Abstract, Introduction, complete main Methods and selected bacterial/mammalian
    Results and Discussion inspected.
  accessed_at: '2026-10-21T20:17:23Z'
  support: context_only
  summary: Despite the title naming magainin 2, the experimental peptide is F5W-magainin
    2, sometimes doped with a TAMRA-labeled derivative; an A9P/F5W derivative is also
    used. Bacillus megaterium and CHO permeability/pore-size observations therefore
    remain analogue evidence. Neither exact-parent pore sizes nor a bacterial osmotic-lysis
    claim is transferred from this paper.
  snapshot_sha256: a65a65786039c64310335c85714b4332cfd4a7b103a61c2de37decb01dc7b31e
- evidence_id: cells2023
  kind: primary_source
  reference: PMID:37950441; https://pmc.ncbi.nlm.nih.gov/articles/PMC10754687/
  locator: Original abstract/introduction, selected magainin Results, general Discussion
    and Conclusions inspected. Detailed Methods are deferred to unavailable supplement.
  accessed_at: '2026-10-21T20:17:23Z'
  support: partial
  summary: The study connects short magainin exposure, SYTOX entry and inability of
