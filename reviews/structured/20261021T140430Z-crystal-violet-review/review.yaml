limitations:
- The primary antibacterial paper identifies chloride reagent material but does not
  provide a lot-specific composition/purity certificate; the antifungal paper only
  identifies a Sigma-Aldrich gentian-violet reagent. No quantitative endpoint is silently
  assigned to separately isolated counterion-free cation or to every historical gentian-violet
  mixture.
- The 1992 Japanese main text and English abstract were read; tables embedded as images
  and electron micrographs were not independently reprocessed. Its English abstract
  rounds the lowest MIC differently from the Japanese results, and the time-kill caption
  and prose have differing inoculum/replicate descriptions. No numerical observation
  is curated from those ambiguities.
- Reaxys registry entries were not independently accessed through a paid service.
  Their exact numbers are verified as adopted/current ChEBI attestations, with that
  independent-registry limitation retained.
- Neither record contains optional molecular targets, causal graphs, activity-spectrum
  observations, producers or resistance mechanisms. These absences alone are not corrective
  findings. Hypotheses and host-cell effects in reviews do not establish a microbial
  direct-binding mechanism.
- HMDB0014550 was initially inspected through the public web-rendered structure block,
  but subsequent direct page/XML/MOL and web rereads returned 403. No local HMDB graph
  was independently parsed; the fully captured and independently parsed RCSB CVI evidence
  alone establishes the exact-equivalence defect.
- Nine available adopted abstracts were read completely; PMID 23465793 has no indexed
  abstract and its full letter was not obtained. Main full text was read for PMID
  21444708 and PMID 23007862; the remaining adopted publications were not claimed
  fully read. PMID 22889741 publisher access returned 403.
- The extra original rat experiment and MRSA follow-up reports were read at complete
  indexed-abstract depth. The source’s broad historical decline in use and wood/silk/paper
  applications remain authority-level ChEBI context, not independently reconstructed
  market history. An attempted IARC Bookshelf page returned a browser challenge and
  is not cited as inspected evidence.
- Historical brand formulations were not individually certified. Correct BRAND_NAME
  typing and the explicit chloride graph avoid asserting that every commercial gentian-violet
  preparation has identical composition.
- The regulatory audit concerns ANDA085017 and the current native summary supported
  solely by that application. It is not an exhaustive current census of other products
  or countries; no clinical recommendation is made.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
