summary: The native record consistently denotes neutral cervimycin B. ChEBI and PubChem
  independently reproduce its full structure key, including the unassigned methylmalonyl
  stereocentre. The ARO definition and polyketide parent are supported, and original
  discovery abstract evidence supports antibacterial activity of the A–D congeners.
  The adopted 2022 article experimentally studies C and D, so its resistance, target
  hypotheses and numeric susceptibility results do not establish those claims for
  B. No confirmed corrective finding emerged. Original B-specific structure and activity
  tables remain inaccessible, limiting full scientific completion. Scientific assessment
  retains the stated evidence limits; full verification is blocked by the shared native-library
  failure.
