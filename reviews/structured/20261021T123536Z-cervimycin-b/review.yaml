  public university thesis route returned a challenge HTML document. Original B-specific
  numeric tables, drawings and full stereochemical derivation were not inspected.
- The adopted 2022 article was read as full main-text narrative, main tables and figure
  captions; supplemental material and figure images were not independently inspected
  for B. Its experimental subjects are C/D, and the figure is explicitly C relative
  configuration.
- The 2024 C mechanism paper was inspected at indexed-abstract depth for the sibling
  boundary in this B review. Its retrieved full XML is available for a separate C
  review; retrieval alone is not claimed as reading.
- Current ChEBI and PubChem structure agreement independently verifies exact database
  mapping, not the entire original chemical elucidation. No absolute configuration
  was added at the unassigned methylmalonyl centre.
- The native record has no structured-adapter trigger. No module membership, absence
  from an expression dataset, or sibling omics observation is treated as B phenotype
  or mechanism evidence.
- No paid registry or paper access, provider research, author contact or external
