limitations:
- Direct licensed Beilstein8174596 and the current full USP monograph were not accessed.
  The public2019 USP preview and official Japanese Pharmacopoeia XVI were inspected
  at the stated depth.
- The Japanese patent was read only at abstract and family-metadata depth. Irish patent
  text was read through its public transcription; the EP original PDF supplied the
  inspected primary preparation and claim. Numerical diffraction peaks were not independently
  transcribed or reanalysed.
- WHO INN imipenem names the anhydrous active moiety, whereas some pharmacopeial/FDA
  naming conventions use Imipenem for hydrate material. The native INN type is not
  treated as an exact-form equivalence assertion.
- The DailyMed description and mechanism/microbiology portions were inspected, not
  every clinical trial, warning or dosing passage. No original protein-binding experiment
  or hydrate-specific quantitative antimicrobial assay was adopted.
- Discovery was bounded and does not establish absence of later exact-form evidence.
  PubChem neutral/zwitterion encodings were compared through explicit normalization
  while preserving raw structures, water stoichiometry and stereochemistry.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
