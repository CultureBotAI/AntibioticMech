summary: The entire native record and exact adopted source row were reviewed. Its
  neutral, stereodefined monoglucoside is internally coherent and agrees with current
  ChEBI and an additional PubChem comparator. Original literature distinguishes pteleifoside
  G as a diglucoside, so its exact-synonym assertion is a major error. The definition
  also misstates Stemmadenia stem bark as root bark, a minor provenance correction.
  The original antibacterial paper supports exact-isolate MRSA activity with assay-method
  and material limits preserved.
