  certainty: confirmed
  title: Pteleifoside G is a diglucoside, not an exact synonym of the native monoglucoside
  description: The 2012 original assigns pteleifoside G to compound 7, C34H48O18,
    with a second beta-D-glucose linked 1-to-3 to the first. It explicitly distinguishes
    known (+)-lyoniresinol 9-prime-O-beta-D-glucopyranoside10. Native CHEBI:66606
    has C28H38O13 and one glucose. Its exact pteleifoside G alias therefore conflates
    distinct compounds, despite propagation in current ChEBI.
