limitations:
- HMDB and Reaxys exact structures were inaccessible. Their current ChEBI associations
  remain recorded without independent chemical verification.
- The 1992 adopted paper was available only as its complete original abstract. The
  2005 original main, methods and extracted tables were read through the author-posted
  PDF; local download was 403 and screenshot calls did not return inspectable figure
  pixels. Raw spectra, exact purity and ee were not independently determined.
- The 2005 bacterial methods specify LB while Table I also names YPD. Its quantitative
  results are retained with that unresolved conflict; no standardized clinical breakpoint
  or broad safety conclusion was inferred.
- The 2012 original introduction and compound 7/10 elucidation were readable through
  publisher text and an original-text mirror. Retrieved figure backgrounds lack text/heteroatom
  labels, so they were not treated as complete stereochemical drawings. Other new
  pteleifosides and raw spectra were not exhaustively adjudicated.
- The additional 2001 paper was read only for exact compound 11 identification and
  isolation. The 2024 citrate-lyase paper was read only for the relevant glycoside
  mention and reagent/method context; no new target or extract activity was transferred.
  Broad discovery was selective and not an exhaustive review of all 192 hits.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Original 13 and expanded 21 input hashes remain unchanged. Native/source records
  and history were not edited.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
