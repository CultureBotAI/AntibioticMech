  support: refutes
  summary: The original distinguishes pteleifoside G 7 from known (+)-lyoniresinol
    monoglucoside 10. G has C34H48O18, two beta-glucose units and a 1-to-3 interglycosidic
    linkage, supported by two anomeric signals and HMBC correlations. Compound 10
    has one glucose. The study separately isolated 77 mg of 7 and 34 mg of 10 from
    Melicope roots/rhizomes. Thus the native monoglucoside cannot bear G as an exact
    synonym. This isolation paper supplies no antibacterial result for G.
