  accessed_at: '2026-10-21T14:41:02Z'
  support: supports
  summary: The licorice study explicitly lists dihydrolicoisoflavone A among compounds
    with weaker anti-Helicobacter pylori activity. Stronger compounds and resistant/susceptible
