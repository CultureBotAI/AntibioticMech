limitations:
- All 13 original input hashes remain unchanged. Actual CURATOR source ownership was
  recorded separately before scientific assessment; no original capture was silently
  replaced.
- The single adopted reference was verified as PMID41841724, DOI10.1128/spectrum.03977-25
  and PMC13055401. The full main text and extracted supplement text were read, and
  original Figures 3 and 4 were visually inspected. Supplementary plasmid/primer sequences
  were not independently aligned or experimentally revalidated.
- The exact primary figure supports trans relative ring geometry; no independent analytical
  certificate of the purchased test batch was inspected. The native unspecified graph
  does not prove a mixture, racemate or the opposite cis material.
- The published docking SMILES is malformed in the inspected XML. Structural comparison
  therefore uses the original figure and independently parsed official ChEMBL structures,
  with the corrected trans string retained only as a scratch candidate.
- 'The primary report has limitations relevant to later enrichment: no reported enzyme
  IC50, no drug-resistant cellular target rescue, no direct measurement of the full
  proposed downstream metabolic chain, and an RD2408 species-description inconsistency.
  These do not negate the demonstrated in vitro activity and protein-binding observations.'
- The catalog lacks the exact S. suis/mycoplasma context. Covered HPrK gene annotations
  are not equivalent-strain drug response experiments, and zero module search hits
  are not negative evidence.
- Some direct publisher/archive routes returned 403 or 404; the full primary XML and
  original figures/supplement were ultimately retrieved through the public EuropePMC
  API. No commercial evidence or paid access was required.
- The locked batch021 environment lacks RDKit; actual independent chemistry used the
  existing batch019 interpreter against unchanged batch021 inputs. Passing deterministic
  checks do not close the primary relative-geometry finding.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
