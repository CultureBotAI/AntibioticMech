- evidence_id: binding
  kind: primary_source
  reference: PMID:41841724; DOI:10.1128/spectrum.03977-25
  locator: Methods BLI/docking; Results Binding mode; original Figure 4A–D visually
    inspected.
  accessed_at: '2026-10-21T10:55:36Z'
  support: supports
  summary: BLI directly tests binding to recombinant S. suis HPrK; Figure 4C reports
    KD 2.2 × 10^-4 M for wild type and 4.4 × 10^-3 M for the combined D242A/D249A/N281A
    mutant. Docking proposes the contacts and the triple mutant also has reduced catalytic
    activity. Together these support HPrK interaction, but do not separately prove
    each atomic contact, exclude structural effects of mutation, demonstrate drug-resistant
    cellular rescue, or establish direct binding to every aligned ortholog.
  snapshot_sha256: 2953f9ea717c86e218f010e540f05781e4252e01e00c42f1271bed7748440c42
- evidence_id: activity
  kind: primary_source
  reference: PMID:41841724; DOI:10.1128/spectrum.03977-25
  locator: Complete Methods/Results; Table 1 and Galleria experiment.
  accessed_at: '2026-10-21T10:55:36Z'
  support: supports
  summary: Twofold serial-dilution assays use 1 × 10^6 CFU/mL bacteria or 1 × 10^4
    CCU/mL mycoplasmas over 0.0625–128 µg/mL, in triplicate; MBC is assessed by subculture.
    Table 1 reports MIC 16 µg/mL and MBC 32 µg/mL for S. suis SC19 and eight named
    clinical isolates. Tested Gram-positive MICs are 16–32 µg/mL, MBCs 32–64 µg/mL;
    four named mycoplasma strains have MICs 16–32 µg/mL, with MBC not tested. E. coli
    ATCC25922 and S. Typhimurium ATCC14028 have MIC 128 µg/mL and MBC >128 µg/mL.
    Media differ among taxa. The larval infection experiment is an animal-model endpoint,
    not human clinical efficacy.
  snapshot_sha256: 4623ddf6fa761d260883291090d2538a8b6a1667d18130721f6d772dc7b8630e
