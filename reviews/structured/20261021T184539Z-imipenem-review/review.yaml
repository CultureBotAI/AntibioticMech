- All 11 adopted and 36 current ARO lead records were inspected at the depths listed
  in 550-source-audit.json. Two adopted and two current records have no indexed abstract;
  most other current leads remain abstract-only. No claim is made that every current
  primary main or supplement was read.
- Direct DrugBank access returned 403. Beilstein/Reaxys licensed structures and an
  authoritative exact LSM-6568 mapping were not obtained; the limited HMS snapshot
  cannot establish an identifier error. Belgian patent text contains image gaps; no
  independent patent stereo-diagram reassignment was attempted.
- Exact reagent hydration is unspecified in the inspected 1984 PBP and2016/2019 mechanism
  experiments. Pharmacopoeial monohydrate and clinical imipenem/cilastatin formulations
  remain distinct from the native anhydrous structure.
- CDC categorical interpretations are source-reported; breakpoint calculations were
  not independently rerun. Three newer isolates lack BioSamples. CRyPTIC membership/source
  DST was joined, but the original WGS parquet was not independently rejoined.
- Initial local chemistry invocation failed because055 lacks RDKit; the explicit019
  invocation passed. Initial Pseudomonas precise104 adapter calls used an unlisted
  dataset key and were replaced by valid precise364 calls. Initial CDC exact-species
  checks failed on valid complex-level ancestor cases; preserved failed logs and final
  lineage-aware checks document the correction.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
