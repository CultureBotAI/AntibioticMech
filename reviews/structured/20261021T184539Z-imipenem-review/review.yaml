- finding_id: F1
  issue_key: imipenem-lptd-permeability-misclassified-efflux
  category: consistency
  severity: major
  status: open
  certainty: confirmed
  title: LptD envelope permeability is misclassified as antibiotic efflux
  description: resistance_mechanisms[13] assigns ANTIBIOTIC_EFFLUX to ARO3005059 via
    inherited ABC-efflux ancestry. Original R. anatipestifer low-expression results
    retain an exact imipenem phenotype; independent P. aeruginosa lptD experiments
    explicitly separate outer-membrane permeability from major efflux systems. LPS
    assembly/transport is not evidence of antibiotic export. Correct the mechanism
    category while retaining the source assertion, organism/mutant context and phenotype;
    no universal absence of imipenem efflux is claimed.
