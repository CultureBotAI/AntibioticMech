limitations:
- Independent MetaCyc CPD-14946 content was inaccessible; the official ChEBI xref
  assertion was verified. CAS was checked through official ChEBI rather than an independent
  CAS registry.
- Ten adopted PMID abstracts were inspected; the principal2012/2017 antibacterial
  full texts were retrieved from official Europe PMC XML. Other primary full texts
  and earlier referenced isolation/assay protocols were not comprehensively reviewed.
- No per-strain values were extracted from the Halimodendron graphical figures. The2017
  solid-assay table/prose unit conflict remains for a quantitative curator to adjudicate.
  SEM interpretation is reported as the authors’ phenotype observation, not proof
  of an initiating molecular mechanism.
- The literature search is bounded and does not establish global absence of additional
  mechanism, biosynthesis, dataset or target evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
