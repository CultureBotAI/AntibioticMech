  acceptance_checks:
  - Inspect the original free-acid absolute-structure evidence and reconcile all seven
    centres against current PubChem11957499/ChEMBL1256686 and ChEBI3305. Do not treat
    an undefined centre as racemic or infer identity from connectivity alone.
  - Produce a valid pyrrole [nH] SMILES and mutually consistent full InChI/key/formula/charge/masses.
    Reparse independent encodings and exact cross-references. The scratch aromatic
    fix alone is insufficient.
  - Correct the name to S.chartreusis, preserving NRRL3882 strain evidence and claim-level
    primary provenance. Keep free acid distinct from calcium/magnesium complexes,
    other salts and synthetic derivatives.
  - Document correction in the maintained ChEBI/ARO extraction or harmonization path
    and canary reseed; do not patch only generated YAML. Run focused chemistry, schema/strict,
    provenance/history and required corpus gates.
  - Only after exact structure resolution, consider optional assay or producer curation.
    Do not import cancer P2RX4/p38 responses or biosynthetic enzymes as antibacterial
    targets.
limitations:
- The1974 original free-acid structure paper remained metadata-only; the1976 calcium-complex
  paper explicitly assumed its absolute configuration. Current database agreement
  establishes a crosswalk conflict but does not replace primary structural adjudication.
- The2011 biosynthesis abstract and relevant culture, analytical, deletion/complementation
  sections were read. Remaining proposed pathway details and all figures were not
  fully reanalyzed. The production patent was inspected at relevant descriptive passages;
  its numerical MIC table was not visually validated.
- The2023 adopted cancer-cell study and broad2012 class review were assessed through
  their complete original abstracts. No exhaustive clinical, resistance or transcriptomic
  survey is claimed. Licensed registry access was not used.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
