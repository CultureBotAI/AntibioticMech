- evidence_id: owners
  kind: record_content
  reference: data/raw/aro_antibiotics.tsv; data/raw/chebi_antimicrobials.tsv; scripts/extract_source_inventory.py;
    scripts/seed_from_sources.py
  locator: 178-raw-all.json; ARO row527 and ChEBI row62
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: ARO owns the description/crosswalk and ChEBI owns the molecular fields.
    The adopted ChEBI row is2-star and outside its antibacterial role scope, while
    ARO supplies antibacterial eligibility. Both current and adopted ChEBI retain
    the same problematic descriptors. Initial capture was preserved and actual ARO/PubChem
    owners added before detailed judgment. Ignored-inclusive local searches inspected
    exact identifiers and maintained owners.
  snapshot_sha256: c23078faee45d3215066ac3874517417aa7e09dcf1498e9b7bccc00fb73879ce
- evidence_id: chemistry
  kind: validation
  reference: Native encoding versus official PubChem/ChEMBL descriptors
  locator: 178-focus-run.log;178-chemistry-comparison.json;178-focused-results.json
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: The real initial chemistry command fails because c3cccn3 cannot be kekulized
    as the intended pyrrole. Native InChI independently parses to HIYAVKIYRIFSCZ-CVXKHCKVSA-N,
    neutral C29H37N3O6 and matching stored masses. A scratch-only replacement with
    c3ccc[nH]3 restores parsing and exactly reproduces that native InChI key; it does
    not repair the separate stereochemical conflict. No repository field was edited.
  snapshot_sha256: e9f9e54af22b956f7ab22ca0581821b20a7daf08f7bcfaa5fd26732f4eba112f
- evidence_id: xref
  kind: database
  reference: PubChem:11957499; ChEMBL:CHEMBL1256686; ChEBI:3305
  locator: 178-pubchem.json;178-chembl.json;178-chebi.json;178-chemistry-comparison.json
  accessed_at: '2026-10-21T10:31:03Z'
  support: refutes
  summary: PubChem and independently parsed ChEMBL agree on HIYAVKIYRIFSCZ-CYEMHPAKSA-N
    with seven assigned centres. In identical canonical InChI atom order, native indices14/21
    are S versus R,17/28 are unspecified versus S, and15/16/26 agree. The unchanged
    constitution makes this a confirmed exact-structure crosswalk conflict, not just
    a missing-stereo annotation. ChEBI agrees with the conflicting native representation.
    CAS52665-69-7 is source-attested; a proprietary CAS registry was not accessed.
  snapshot_sha256: e9f9e54af22b956f7ab22ca0581821b20a7daf08f7bcfaa5fd26732f4eba112f
- evidence_id: structure
  kind: primary_source
  reference: PMID:776918; DOI:10.7164/antibiotics.29.424
  locator: 178-crystal1976.pdf; complete four-page paper text and rendered Figure1
    p426
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: The original crystal study determines Ca(A23187-H)2 with two ethanol molecules.
    Each antibiotic supplies three coordination ligands to calcium. Its absolute configuration
    was explicitly not redetermined and was assumed from the1974 free-acid study.
    It supports divalent-cation complexation and distinguishes the metal complex from
    neutral native acid; it cannot independently settle the competing absolute encodings.
    Atomic coordinates were not re-refined.
  snapshot_sha256: 72fca42bdfe8b2c8889c0f0e8d90678524a76e247967c009cc510f10bf3f1365
- evidence_id: original-access
  kind: search
  reference: PMID:4815763; DOI:10.1021/ja00813a047
  locator: PubMed metadata and official publisher access page; Natural Products Atlas
    NPA03386 crosswalk
  accessed_at: '2026-10-21T10:31:03Z'
  support: partial
  summary: The1974 original free-acid structure paper was located but full text remained
    unavailable through free routes; no purchase was made. NPatlas links that paper
    and carries the same full CYEMHPAKSA-N InChI as PubChem/ChEMBL. This is supporting
    database provenance, not a substitute for inspecting the original absolute-structure
    proof.
  search_scope: Exact A23187/1974 title, PMID and DOI; official ACS/PubMed, NPatlas,
    free routes and the accessible1976 follow-up.
- evidence_id: producer
  kind: primary_source
  reference: PMID:21173184; DOI:10.1128/AAC.01130-10
  locator: 178-biosynthesis2011.pdf; original abstract, opening text, culture/HPLC
    and deletion-complementation Methods and Results
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: S.chartreusis NRRL3882 produced calcimycin detected by HPLC/MS against
    a commercial standard. Three gene deletions abolished production; complementation
    of calN2 restored it. This demonstrates biosynthesis by the named strain rather
    than isolation alone. The64-kb cluster contains27 predicted genes and is accession
    HM452329. Predicted enzyme functions and producer-resistance genes are not antibiotic
    targets. The complete remaining pathway analysis was not audited.
  snapshot_sha256: 3145113db5479277cf99e99abfde1ec4c1cd3c03ef61b026761f66ef98eab4a9
- evidence_id: taxonomy
  kind: authority
  reference: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id=1079985
  locator: Current strain taxonomy entry and species1969
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: NCBI indexes Streptomyces chartreusis NRRL3882 under S.chartreusis. This
    corroborates the name used by the original biosynthesis paper and production patent;
    the native chartrecensis spelling should not be silently treated as a verified
    taxon.
- evidence_id: patent
  kind: primary_source
  reference: https://patents.google.com/patent/US3923823A/en
  locator: 178-patent.html; description through TableIV, production/taxonomic description
    and early fermentation discussion
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: The original patent separately describes A23187 free acid, mixed calcium-magnesium
    salt and other metal forms, with production by S.chartreusis NRRL3882. TableIV
    reports antibacterial and fungal MICs, but its material/method details and OCR
    table values were not fully validated for numeric curation. The broad antimicrobial
    and production context is supported; patent applications and mouse toxicity are
    not clinical efficacy evidence.
  snapshot_sha256: 6daa47160c1ed3a8808455537987edc30f1e24d46fd0db402c7e40eeed7e517d
- evidence_id: definition-source
  kind: primary_source
  reference: PMID:38103757; DOI:10.1016/j.bbagen.2023.130535
  locator: 178-literature.json; complete original abstract
  accessed_at: '2026-10-21T10:31:03Z'
  support: context_only
  summary: The adopted2023 source concerns human breast/cervical cancer-cell responses,
    P2RX4 expression and calcium/p38-associated pharmacological perturbations. Its
    background repeats the producer-name problem. Host-cell inhibitor rescue and expression
    changes do not establish bacterial target binding, or replace original biosynthesis
    and ionophore evidence.
  snapshot_sha256: cad0fc38091aa570d47fe0211a68e2851738e1713a9b6bdcee05d5daac434a9a
- evidence_id: class-reference
  kind: database
  reference: PMID:22849267; DOI:10.20506/rst.31.1.2096
  locator: 178-extra-core.json; complete review abstract and ARO class stanza
  accessed_at: '2026-10-21T10:31:03Z'
  support: context_only
  summary: The ARO class reference is a broad review of cell-wall/membrane agents.
    Its ionophore discussion is class context, not an exact calcimycin antibacterial
    experiment. The1972 original ion-carrier study PMID4263618 was located as metadata;
    no complete primary full-text audit is claimed.
  snapshot_sha256: ed17d6146c7dd8a633975a791beb2901e9ee6ec13aacc5379ae98cae21db9817
