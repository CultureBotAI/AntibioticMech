  locator: Entire49-line native YAML and16 initially/supplementally captured inputs
  accessed_at: '2026-10-21T10:31:03Z'
  support: supports
  summary: The SEEDED CHEBI3305 record has a neutral formula/key, invalid pyrrole
    SMILES, A23187 synonym, ARO ionophore class and CAS/ChEMBL/PubChem mappings. It
