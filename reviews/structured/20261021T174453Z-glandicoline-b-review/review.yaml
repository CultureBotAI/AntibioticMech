summary: 'Glandicoline B has a confirmed blocker representation defect: the native
  and current ChEBI SMILES omit an explicit imidazole N–H and cannot be kekulized.
  The native InChI, official ChEBI molfile, PubChem and a scratch-only repair agree
  at the expected molecular identity. Original papers support fungal biosynthesis
  and antibacterial activity at bounded assay scope. Exact MetaCyc equivalence and
  direct antimicrobial target remain unresolved; printed stereochemical labels in
  one primary source are retained as a source discrepancy without changing its consistent
  wedge geometry.'
