    viewed
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: The original reconstitutes glandicoline B methylation by OxaG/RoqN and
    downstream OxaC reactions. These are substrate-biosynthesis experiments. No glandicoline
