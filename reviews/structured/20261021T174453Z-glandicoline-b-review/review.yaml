limitations:
- MetaCyc official compound/getxml routes returned login HTML; exact external structure
  equivalence remains unresolved.
- All four adopted abstracts were read, but only the 2013 adopted original main text
  was read fully. The 2011 author-repository route returned an anti-bot page; the
  2015 original and 2015/2016 review remain abstract-level.
- The 2012 paper inferred absolute configuration from related meleagrin crystallography;
  its printed C2/C3 descriptors conflict with current CIP labels despite matching
  pictured wedge parity. Raw supplemental spectra and an independent absolute-configuration
  experiment were not reanalyzed.
- The 2012 reported active concentration is retained without inventing a complete
  MIC table, strain accessions, kill kinetics or certified compliance with the paper’s
  stated NCCLS protocol.
- The 2018 biosynthetic original was read at the specified selected sections/Figures1–2,
  not all supplemental crystallographic/refinement files. Its docking and substrate
  conversions do not establish antimicrobial inhibition.
- The 2013 antifouling publisher PDF text was inspected through the web tool, but
  local download 403 prevented a local PDF snapshot. No quantitative glandicoline
  B result is adopted from its selected-compound table.
- A guessed ChEBI structure/mol URL returned JSON rather than molfile; the correct
  official public/molfile endpoint succeeded and is separately preserved. Two EuropePMC
  XML calls failed 500 and their full HTML alternatives succeeded.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native gene, target, pathway object, regulator or transcriptomic dataset triggers
  a structured adapter. Discovered fungal biosynthetic enzymes are not native antibacterial
  targets.
- Standalone chemistry used batch019 against batch051; native schema/strict, ledger
  and contract used batch051. No native/source bytes or scientific status were changed.
- An initial append script stopped on an incorrect guessed conf/roles.yaml path before
  any writes; actual conf/sources.yaml was used on the successful attempt, preserving
  every original hash.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
