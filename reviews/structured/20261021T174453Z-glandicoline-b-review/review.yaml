evidence:
- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/glandicoline-b.yaml
  locator: Entire native record including all three history events
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: The SEEDED/EXACT record denotes CHEBI:134347 glandicoline B, has one systematic
    exact synonym, six broader parents, one antibacterial role, one MetaCyc xref and
    neutral C22H21N5O4 chemistry. It asserts no quantitative MIC, molecular target,
    resistance mechanism, structured producer, clinical product or causal graph.
- evidence_id: structure
  kind: validation
  reference: CHEBI:134347; PubChem:124079399
  locator: 503-authority-chemistry.json;503-focused-run.log;503-chebi-134347.json;503-chebi-official.mol;503-pc-key.json
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: Both native and current ChEBI SMILES fail kekulization because c4cncn4
    has no explicit pyrrolic N–H. The official molfile, native/current InChI and PubChem
    encodings are valid. Replacing that imidazole substring with c4c[nH]cn4 in scratch
    yields the expected YEVSOYBNHBOQJZ-GCTRCSCRSA-N, C22H21N5O4, zero charge and correct
    masses. Standard InChI normalizes mobile-H imidazole and lactam tautomers, so
    direct bond-form graph matching is separately recorded and not falsely claimed
    universal.
  snapshot_sha256: f276f2faa158ce094f0e79a7047df5f2e162355488f1d1e686e4d2e6ab2aec54
- evidence_id: terms
  kind: authority
  reference: CHEBI:24780;CHEBI:24995;CHEBI:33823;CHEBI:38163;CHEBI:38958;CHEBI:78840;CHEBI:33282
  locator: 503-chebi-<id>.json;503-source-audit.json terms;503-fetch.json
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: Current term identities and outgoing relationships match all six native
    parents and the antibacterial role. The valid graph contains imidazole, lactam,
    enol, an indole-derived scaffold and olefin; it has a fused tetracyclic core plus
    a separate imidazole ring. Total ring count five alone does not refute the tetracyclic-core
    definition. Organic heterotetracyclic compound has no supplied textual definition.
    Upstream mycotoxin/metabolite annotations are not additional configured antimicrobial
    roles.
  snapshot_sha256: 340d09ef299fd4d328b042dc8d1dd98725aaffc6956ea60fd2193186f875a6ae
- evidence_id: primary2012
  kind: primary_source
  reference: DOI:10.1590/S0100-40422012000400022
  locator: 503-2012.html/.txt; complete main, actual Figures1–3 in503-2012-image2.jpg,-image3.jpg,-image0.jpg;503-fetch2/4.json
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: Compound 1 was isolated from cultured Penicillium sp. PBR.2.2.2, identified
    by NMR/MS and reported active at 100 micrograms/ml against S. aureus, M. luteus
    and E. coli. Methods describe MHB microbroth dilution, resazurin, 37°C/24 h and
    agar subculture. No strain accessions, complete MIC table or kill kinetics are
    adopted. The host palm is the fungus source, not a proven compound producer. Absolute
    configuration was inferred from meleagrin crystallography rather than directly
    determined for glandicoline B.
  snapshot_sha256: ae0b4f6fc04c2d8db326e1c9ea38a3a0c1eebc2cc94367738da12824f45c866d
- evidence_id: source-stereo
  kind: primary_source
  reference: DOI:10.1590/S0100-40422012000400022
  locator: Actual Figure1 compound 1,503-2012-image2.jpg, compared with mapped official
    molfile503-chebi-map.png
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: The paper prints C2S/C3R whereas current molfile CIP assignments at mapped
    C2(atom0)/C3(atom2) are R/S. Actual dashed-bond placement and circular ordering
    of neighboring groups were independently inspected by reviewer and coordinator
    and agree. Printed labels alone therefore do not justify inversion of the native
    graph; the annotation discrepancy and indirect absolute-assignment basis remain
    explicit limitations.
  snapshot_sha256: 376081e34c78cfd2f136143abe23f3e70959644311ebd000fffe64a50dd70095
- evidence_id: primary2013
  kind: primary_source
  reference: PMID:23776469; DOI:10.1371/journal.pone.0065328
  locator: 503-PMC3680398.xml; complete original main and supporting-file captions
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: P. chrysogenum DS54555 deletion/metabolite experiments identify glandicoline
    B as compound 6, with isolation and NMR confirmation. Deletion of roqN increases
    6 while meleagrin is lost. This supports fungal biosynthesis and broad isolation
    wording. The disputed intermediate/enzyme assignments are biosynthetic, not antibacterial
    targets; supporting raw spectral files were not independently reprocessed.
  snapshot_sha256: 074869682ee3d7378970b76663c549b70d9f27dbc44b10e2a061ca9aea28ec78
- evidence_id: adopted
  kind: database
  reference: PMID:22118684;PMID:23776469;PMID:25998659;PMID:26668029
  locator: 503-adopted-core.json;503-source-audit.json adopted_leads
  accessed_at: '2026-10-21T17:42:52Z'
  support: supports
  summary: All four adopted MED records and complete supplied abstracts were read.
    The 2011 RNAi study supports glandicoline B accumulation in P. chrysogenum. The
    2015 original concerns a shortened pathway in three P. roqueforti strains and
    does not refute P. chrysogenum production. The 2015/2016 cluster-evolution review
    is secondary context, including P. chrysogenum/P. rubens nomenclature. Full 2011
    and 2015 original main texts were not read.
  snapshot_sha256: 85f22b99681ef77e4a807bbf3986727de40ef9e45da9fe4bc2c52b3886bb7b1d
