  support: supports
  summary: 'A fruit-peel isolate identified as lamesticumin A was tested for 24-hour
    T47D and Vero MTT responses: Table2 reports IC50 15.68±0.30 and 47.46±2.63 µg/mL,
    respectively. These are mammalian cell-viability endpoints, not bacterial MICs
    or direct target binding. Identification has unresolved reporting issues: the
    table lists thirty positions for C31 material, omits a methoxy carbon entry and
    labels approximately148-ppm signals as carbonyls. Figure2 depicts connectivity
    without stereobonds. Thus this report is a qualified same-name isolate lead, not
    an independent absolute-configuration determination or a basis to replace native
    chemistry. Its antibacterial discussion cites2011 and is not a new antibacterial
    experiment.'
