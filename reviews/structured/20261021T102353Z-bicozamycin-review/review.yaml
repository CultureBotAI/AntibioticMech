    and SI Methods;156-ring-core2.json;156-ring-web-source.json
  accessed_at: '2026-10-21T10:08:38Z'
  support: refutes
  summary: SAXS and fluorescence-anisotropy/order-of-addition experiments support
    inhibition of open-to-closed Rho ring transition. The authors explicitly revise
    the earlier simple catalytic-water model. Assays used purified E. coli Rho, RNA
    and nonhydrolyzable nucleotide analogue; this is mechanism evidence, not a bacterial
    MIC.
  snapshot_sha256: ddc9feadff03460b6af382eac7dc7ed0b84fcb56f1a6d48f4ae3cdad0891626d
- evidence_id: kinetics
