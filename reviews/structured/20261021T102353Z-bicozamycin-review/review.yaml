  locator: 156-core.json;complete original abstracts
  accessed_at: '2026-10-21T10:08:38Z'
  support: supports
  summary: The1995 study distinguishes reversible noncompetitive ATPase inhibition
    from prolonged high-concentration effects and semisynthetic dihydrobicyclomycin.
    The1993 study combines rho resistance mutants with ATPase assays. These support
    exact-compound Rho inhibition without transferring mutant/analogue or prolonged-incubation
    outcomes to normal conditions.
  snapshot_sha256: 3dfab0099eb9d6ab4432050c752445ff0a5d0937a04d6905cede4115b8899e44
