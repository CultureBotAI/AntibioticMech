  locator: DOI:10.1016/j.str.2004.10.013;156-core.json complete abstract;PDB1XPO
  accessed_at: '2026-10-21T10:08:38Z'
  support: partial
  summary: The original paper reports the exact bicyclomycin complex separately from
    two semisynthetic derivatives and proposes catalytic-water exclusion to explain
    noncompetitive ATP-turnover inhibition. The bound exact ligand and resolution
    are independently supported by the deposition; the proposal should not be confused
    with a direct dynamic measurement of water exclusion.
  snapshot_sha256: 3dfab0099eb9d6ab4432050c752445ff0a5d0937a04d6905cede4115b8899e44
- evidence_id: later-mechanism
  kind: primary_source
  reference: PMID:27821776
