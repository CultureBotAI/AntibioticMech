    exact strain/compound scope.
limitations:
- The2005 structural paper was inspected through its complete abstract and independently
  verified deposition, not a retrieved full original PDF. The failed CiteSeer PDF
  returned404 and publisher local access403. The water-model wording accurately reflects
  that paper, but does not resolve later evidence.
- The2016 publisher main Results,Discussion,Methods and displayed SI Methods were
  read through web access. Local PNAS retrieval returned403, PMC renderings were challenges
  and XML500; the cached web extraction and complete bibliographic core are retained.
  A guessed related-paper DOI was rejected; the resolved cited DOI is10.1073/pnas.1616749113.
- Producer papers were read as complete abstracts plus original producer/Methods passages
  returned by the primary-site web index; not every supplemental spectrum or raw chromatogram
  was examined. Direct PMC/XML downloads were challenged/500. The native MIBiG inherited-reference
  caveat remains appropriate.
- The bcr-1 genomic article full text was inaccessible and the synergy original was
  available as an abstract only. No negative conclusion about transporter function
  is inferred from this access limit; no direct efflux assay was independently verified.
- KNApSAcK displays a key inconsistent with its own Standard InChI, while the parsed
  graph is exact. Licensed Reaxys was not independently inspected. CAS mapping relies
  on public/adopted identifiers rather than independently accessed registry data.
- The initial optional chemistry helper lacked a regex import; its original bytes
  are retained, and the corrected rerun passed. The failed check command names the
  same script path at its earlier version.
- The native REVIEWED status is reported, not re-awarded by this review. Focused passes
  alone do not establish full-corpus success.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
