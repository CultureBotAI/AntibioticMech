  acceptance_checks:
  - Add a documented EXCLUDE decision for minted antibioticmech:aro-63094b52cf / ARO:0000024
    with the original complex evidence and graph conflict; do not GROUND it to A or
    B or rename the current graph.
  - Use the documented canary and full seed/prune workflow only after separate curation
    authorization; retain immutable review history and source provenance. Verify the
    broad source concept cannot reintroduce the wrong graph.
  - Retain existing CHEBI:65112 butirosin A and CHEBI:65110 butirosin B as separate
    exact structures. Confirm S-AHBA and their distinct xylo/ribofuranosyl configurations
    before any component enrichment.
  - Do not copy broad-complex resistance, target, quantitative activity or sulfate
    identifiers into either component without exact reagent evidence. CHEBI65109 belongs
    as a broader parent, not an exact xref.
  - Run focused schema/strict and documented reference/history, regeneration and full
    QC gates; confirm no duplicate exact component and no accidental removal of existing
    A/B records.
limitations:
- All twelve adopted/ontology PMID records resolved:ten complete abstracts were read;10103173
  and11083623 supplied metadata but no abstract. Their full-text XML requests returned500
  and PMC web rendering was challenged; the bodies and the native clinical-use wording
  remain unverified.
- Four supplemental original identity,biosynthesis and activity studies were read
  at complete-abstract depth. The1972 isolation XML request also returned500. No raw
  spectra or original full stereochemical elucidation was reanalyzed; the explicit
  primary S-AHBA assignment, authority mixture definition and component graph comparisons
  suffice for the bounded identity finding.
- The native PubChem mapping is current and internally consistent. Its agreement does
  not establish biological identity; the R-AHBA and pentose-anomer conflicts are preserved,
  not silently corrected.
- ChEMBL3549904 API returned404; GSRS still lists that accession at mixture scope.
  This was not treated as proof the accession is invalid. Licensed CAS/Reaxys registries
  were not accessed; public GSRS resolves the adopted CAS to the complex.
- AphIIb/IIc full XML requests returned500. Abstract-level butirosin resistance does
  not resolve component or sulfate composition, and other enzyme/genome abstracts
  do not establish the native epimer substrate.
- The adapter PA4119 annotation does not resolve a phosphotransferase crosswalk. No
  exact UniProt example, iModulon phenotype or causal mechanism is inferred from it.
- This is a one-target review. Existing A/B records were inspected only to establish
  nonduplication and structural context; their complete scientific correctness is
  not certified. Focused checks do not establish full-corpus success or promote SEEDED
  status.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All 19 repository input hashes and the external ARO cache remain unchanged; no native
  or saved-bundle edits.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
