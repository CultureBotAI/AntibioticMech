- evidence_id: isolation
  kind: primary_source
  reference: PMID:4670491
  locator: DOI:10.1128/AAC.2.2.84;174-extra-core.json complete abstract
  accessed_at: '2026-10-21T10:25:22Z'
  support: refutes
  summary: Original1972 isolation paper explicitly resolves the butirosin complex
    into isomeric A/B components and discusses their free bases and tetraacetyl derivatives
    separately. It independently establishes that the name of the complex does not
    denote one stereoisomer.
  snapshot_sha256: cb0b60fedbc84ca684bed9faa725875a4f375855fc856d1781f0918d0a260764
- evidence_id: biosynthesis
  kind: primary_source
  reference: PMID:17462573
  locator: DOI:10.1016/j.chembiol.2007.02.005;174-extra-core.json complete abstract
  accessed_at: '2026-10-21T10:25:22Z'
  support: refutes
  summary: Original enzymatic biosynthesis paper specifies the natural (S)-4-amino-2-hydroxybutyrate
    side chain, transfer from BtrI to ribostamycin by BtrH and deprotection by BtrG.
    This directly conflicts with the native R side chain; it is biosynthetic evidence,
    not a ribosomal target assay.
  snapshot_sha256: cb0b60fedbc84ca684bed9faa725875a4f375855fc856d1781f0918d0a260764
- evidence_id: activity
  kind: primary_source
  reference: PMID:4207954;PMID:4670492
  locator: DOI:10.1128/AAC.2.2.79;DOI:10.1128/AAC.2.2.89;174-extra-core.json complete
    abstracts
  accessed_at: '2026-10-21T10:25:22Z'
  support: partial
  summary: The original fermentation and antibacterial studies concern the complex,
    including bacterial in-vitro activity and mouse infection experiments. Fermentation
    titers in micrograms of base per mL are not MIC values. These reports do not establish
    clinical treatment efficacy or activity of the native R epimer.
  snapshot_sha256: cb0b60fedbc84ca684bed9faa725875a4f375855fc856d1781f0918d0a260764
- evidence_id: resistance-exact
  kind: primary_source
  reference: PMID:17088477;PMID:14638496
  locator: 174-core.json complete original abstracts
  accessed_at: '2026-10-21T10:25:22Z'
  support: partial
  summary: AphIIc expression in E.coli increases butirosin MICs and disruption in
    S.maltophilia K279a decreases them; reagent A/B composition is unresolved at abstract
    depth. The IIb/HpaA study names butirosin among resistance substrates, but its4-HPA-induced
    wild-type/mutant experiment is neomycin-specific. Do not transfer that induction
    assay to butirosin.
  snapshot_sha256: 96ff66c6f5e9c101ee3690a3ad9d1111d710675522db38c33110fffb7f319ea0
- evidence_id: other-enzyme-leads
