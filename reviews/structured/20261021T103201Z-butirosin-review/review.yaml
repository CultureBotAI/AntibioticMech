findings:
- finding_id: F1
  issue_key: aro-0000024-butirosin-mixture-wrong-stereoisomer
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Butirosin complex is represented as the wrong exact stereoisomer
  description: The original isolation paper and GSRS identify butirosin as an A/B
    complex; CHEBI65109 is a family, and sulfate synonyms are salts. Native CID72393
    instead specifies one neutral graph with an R-AHBA side chain, contrary to the
    primary natural S assignment and both component structures. It is not authentic
    A or B. Existing exact A/B records preclude solving this by adding duplicates
    or relabelling the wrong graph.
  target_ids:
  - antibioticmech:aro-63094b52cf
