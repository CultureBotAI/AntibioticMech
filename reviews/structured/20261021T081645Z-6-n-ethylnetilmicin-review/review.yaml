actions:
- action_id: A1
  description: Curate selected primary resistance/activity observations with exact
    derivative, construct and source-access boundaries.
  finding_ids:
  - F1
  target_ids:
  - antibioticmech:aro-e4e652725f
  owner_paths:
  - repository: CultureBotAI/AntibioticMech
    path: curation/card_evidence_reviews.json
    role: Reviewed primary evidence qualification for existing imported CARD assertions
  - repository: CultureBotAI/AntibioticMech
    path: data/antibiotics/antibacterial/6-n-ethylnetilmicin.yaml
    role: Curator-owned evidence, resistance_mechanisms, activity_spectrum and discussions
      through validated writer/history
  acceptance_checks:
  - Attach the direct primary study to the narrow existing determinant claim, retaining
    host/construct comparisons and distinguishing gene presence from expressed resistance.
    Resolve the printed inoculum anomaly before quantitative assay normalization.
  - Represent the Tap result as construct-specific resistance with putative transport;
    its direct accumulation experiment concerns another substrate. Do not generalize
    homolog behavior across organisms or vectors.
  - Map historical aac(3)-Vb to current AAC(3)-IIb explicitly. Separate exact-drug
    phenotypes from sisomicin acetylation-product experiments and retain abstract-only
    limits where full text was unavailable.
  - Keep each imported assertion at database evidence level unless its exact primary
    support is verified; do not infer an antimicrobial binding target, clinical efficacy
    or antibiotic biosynthesis from resistance studies.
  - Use the maintained reviewed-evidence overlay or authorized curator fields, validated
    writer/history and all required native gates before REVIEWED sign-off.
limitations:
- All native ARO terms/edges were checked against adopted tables and the hashed local
  OBO; the current official drug page corroborated the 13 determinant labels. Individual
  current determinant pages and all primary phenotype experiments were not exhaustively
  inspected.
- The sole adopted definition reference and 13 additional determinant-definition references
  were resolved and their indexed abstracts read; 3892230 is index-truncated. Most
  full texts were not retrieved. EPMC fullTextXML requests for Tap and the 1992/1993/2020
  studies returned 500; a 1992 PDF endpoint returned 404. Publisher Tap full text
  and the 1996 PDF were independently accessible.
- The 1996 primary PDF prints an implausible 10^-5 CFU/mL inoculum. This was verified
  visually and was not silently corrected to 10^5. Exact reagent salt/purity is not
  established for all experiments.
- The 1998 Tap table gives fold-relative values with a parenthetical baseline, not
  a complete table of absolute MICs. Its homolog-specific negative result is limited
  to those tested constructs; broader literature can differ.
- No exact-compound direct antibacterial binding target or clinical efficacy was established.
  iModulonDB gene presence is computational context only. This review is bounded and
  is not native REVIEWED sign-off; required shared gates remain incomplete.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Only scratch artifacts were written; no native record, maintained source or history
  changed. All 19 captured input hashes were rechecked unchanged.
- Default prepare.py ChEBI owners were replaced with actual ARO/PubChem owners before
  scientific judgment, retaining all original input hashes and adding six maintained
  inputs.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
