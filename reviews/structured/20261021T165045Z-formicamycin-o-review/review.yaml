limitations:
- The2020 original main article was unavailable through attempted public routes; only
  its complete abstract and specified original SI pages were inspected. No main assay
  table, isolation yield, full bioassay method or complete original assignment discussion
  is claimed as read.
- Exact quantitative antibacterial values and16h/microdilution context are explicitly
  ChEMBL extractions. The original table and taxonomy/strain labeling need primary
  confirmation before claim-level quantitative curation.
- Original supplementary drawings and selected proton/carbon spectra were viewed;
  raw data were not reprocessed and HMBC/NOESY correlations were not independently
  assigned.
- The2026 B/D/I revisions raise a relevant analogous question but do not demonstrate
  an N/O defect. No exact N/O crystal, absolute axial proof or direct regiochemical
  reassignment is claimed.
- The adopted2021 paper and2017 family source were read at the specified selected
  sections/table/method depths. S. formicae pathway experiments are not substituted
  for a KIB-1414 pathway or an antibacterial drug target.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
