findings:
- finding_id: F1
  issue_key: helvolic-acid-incompatible-exact-systematic-names
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Two exact systematic synonyms are chemically incompatible
  description: synonyms[3] names only the C-16 acetoxy group on a 3,7-dioxo-29-nordammara
    skeleton and therefore omits the C-6 acetate present in helvolic acid. The inspected2021
    primary figure explicitly separates helvolic acid 4 from its C-6 deacetoxy analogue
    6. Separately, synonyms[2] includes 17β even though its17(20) double bond makes
    C-17 trigonal; the supported geometry is17Z. The stored graph is correct, so this
    finding concerns source-owned exact names, not an instruction to remove a substituent
    or alter the structure.
  target_ids:
  - CHEBI:62460
