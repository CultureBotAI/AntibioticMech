limitations:
- Required shared full-corpus gates are incorporated separately by root before finalization;
  actual focused checks are recorded here.
- 'All eight adopted abstracts were read, but full experimental reading was selective:
  compound characterization, helvolic comparison and assay/BGC sections where stated.
  The 2018 ACS main/SI were inaccessible, and the 2009,2018 osteoclast and2019 aspergilolide
  leads remain abstract-depth. This is not exhaustive full-text reading of every adopted
  paper.'
- The 2017 printed MIC method contains inconsistent stock/first-well concentrations.
  Its reported table is retained as reported, without silently repairing the recipe.
  The 2019 ATCC 29213 MRSA label conflicts with the independent original strain characterization,
  and its actual tested material remains unresolved.
- CAS detail API returned 401 and the public page was an application shell; no freely
  accessible independent Beilstein exact-structure authority was resolved. KNAPSACK
  contains mutually inconsistent displayed structural fields, including one exact-matching
  InChI.
- The 1964 source is a historical skeletal revision, not final absolute-configuration
  evidence. The review inspected modern primary depictions but did not independently
  reprocess original spectral data or infer new natural-product absolute assignments.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
