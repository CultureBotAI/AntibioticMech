  resistance assertions concern benzalkonium chloride, whereas the imported structure
  is one chloride-free tridecyl cation. ChEMBL adds a third scope: the corresponding
  specific chloride salt. This conflict is reproduced from current official sources
  and maintained inputs; successful schema checks do not resolve it. The six resistance
  entries accurately retain database-level provenance and primary studies support
  benzalkonium preparations, but those results cannot automatically become evidence
  for this exact cation.'
