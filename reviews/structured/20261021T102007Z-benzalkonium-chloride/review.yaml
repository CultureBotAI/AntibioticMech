  issue_key: benzalkonium-generic-chloride-c13-cation-identity-collapse
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the generic chloride concept, specific C13 cation and chloride-salt
    mismatch
  description: The record is labeled benzalkonium chloride and carries generic CAS8001-54-5/CHEBI3020/KEGG
    D00857 context, but its only structure is the chloride-free C13 cation C22H40N+.
    Current official ChEMBL instead represents the specific C13 chloride salt. The
    source import is mechanically reproducible yet does not denote one coherent chemical
    entity. Generic benzalkonium activity and six resistance edges cannot automatically
    validate the exact cation. This is a wrong-identity blocker, not a claim that
    the C13 cation lacks activity.
