limitations:
- All12 adopted molecule-level citation leads inspected:10 available abstracts and2
  metadata-only older articles,PMIDs14139119 and14455820. No experimental detail inferred
  for the latter. Most adopted references concern host allergy,combination assays
  or historical context,not direct molecular targets.
- 'Full2023 AMZ-1 main article and tables read. The2017 PBP paper is abstract and
  official structure metadata only: EuropePMC XML500,PMC challenge andpublisher403
  prevented full-text verification; no search-result-only quantitative claims adopted.2001
  antibody paper is abstract and official PDB metadata only. MdeA andselectedPBP2x
  findings are abstract-level.'
- All37 CARD source assertions verified against exact official ontology bytes; most
  original determinant-specific experiments not individually reassessed. Source consistency
  is not complete experimental proof.
- All21 CDC pages,linked BioSamples and7 native taxonomy IDs inspected. No raw AST
  retesting,genome reanalysis or breakpoint reinterpretation performed; current CDC
  CLSI2025 context is preserved.
- HMDB andDrugBank direct pages403,LINCS500,Reaxys andCAS registry uninspected directly.
  Accessible official crosswalks do not establish independent exact equivalence for
  every legacy endpoint. Patents were checked for document identity/relevance,not
  legal status or all experimental claims.
- Structured adapter results are gene context only. The initial S.aureus mdeA query
  is an organism mismatch rejected after primary-source inspection; S.mutans is not
  represented in the available inventory. No hits or unavailable coverage do not refute
  biology.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
