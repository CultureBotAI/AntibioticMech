- evidence_id: adapter
  kind: search
  reference: iModulonDB:e_coli/precise1k/b2430
  locator: 245-imodulondb-datasets.txt and 245-imodulondb-pbp.txt
  accessed_at: '2026-10-21T11:48:58Z'
  support: context_only
  summary: Dataset discovery and the penicillin query preceded protein literature
    follow-up. One yfeW gene-product hit for PBP4B and zero iModulons were returned.
    This catalog result neither proves cefpodoxime binding nor contradicts the imported
    family claim; no component summary was warranted.
  snapshot_sha256: b0f3ec2d7316806c534510fc9e133a264a0079b8388c2e423af73d3f40edf70a
  search_scope: Exact public adapter dataset discovery, followed by e_coli/precise1k
    search --query penicillin; no absence-of-mechanism inference.
- evidence_id: original-binding
  kind: primary_source
  reference: PMID:3310868; DOI:10.1128/AAC.31.7.1085
  locator: All eight original printed pages 1085-1092, 245-primary1085.png through
    245-primary1092.png; Figure 1 p.1086; PBP methods pp.1086 and Figure 3/results
    p.1090
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: 'The original study distinguishes CS-807 ester treatment from R-3746 antibacterial
    testing. Figure 1 explicitly draws R-3746 with COONa. Membrane preparations from
    S. aureus FDA209P JC-1 and E. coli NIHJ JC-2 underwent 10-minute drug preincubation
    at 30 C followed by radiolabeled penicillin G competition. The reported I50 values
    measure 50% label displacement, not Kd/Ki: E. coli PBP3, 1A and 1Bs values are
    0.4, 0.6 and 0.8 micrograms/mL, respectively. Other PBP bands have different affinities;
    no universal PBP3-only claim follows. These experiments support PBP binding of
    the active cefpodoxime moiety with a sodium-reagent boundary, not an exact neutral-acid
    quantitative observation.'
  snapshot_sha256: 46e4b6c91ea340fef03b495e105e905b704802683a07a60de289b4e9b821fa54
- evidence_id: original-activity
  kind: primary_source
  reference: PMID:3310868; DOI:10.1128/AAC.31.7.1085
  locator: Original pp.1085-1092, especially Table 1 pp.1087-1088, Table 2 p.1088,
    Table 3/Figure 2 p.1089, Table 4 p.1091
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: R-3746 clinical-isolate testing used twofold agar dilution with stated
    media and inoculum; Table 1 distinguishes species and methicillin susceptibility
    rather than establishing universal spectrum. Killing curves and broth MBCs are
    separately defined. Beta-lactamase relative hydrolysis depends on enzyme and comparator
    and does not mean complete hydrolysis resistance. Mouse protective effects in
    Table 4 concern orally administered CS-807 proxetil, with R-3746 MICs identified
    separately. Sodium reagent and prodrug outcomes are not copied as exact neutral-acid
    measurements.
  snapshot_sha256: e4a48b383dd510f19a49fe5efe0e23c3f213931b4f3d0222ab0bcb816c68e5e3
- evidence_id: additional-primary
  kind: primary_source
  reference: PMID:2351624; DOI:10.1093/jac/25.4.541; PMID:3073932
  locator: 245-core.json, complete abstracts of the two additional primary studies
  accessed_at: '2026-10-21T11:48:58Z'
  support: partial
  summary: Wise et al. report a 529-isolate comparison, enzyme work and E. coli K-12
    PBP3 I50 of 1 mg/L; complete methods and reagent form were not inspected, and
