  locator: 245-core.json and 245-lead-dispositions.json; all 15 records resolved,
    13 complete abstracts and two metadata-only reviews
  accessed_at: '2026-10-21T11:48:58Z'
  support: partial
  summary: All nine ChEBI compound leads and both ARO compound leads were inspected.
    Proxetil formulation studies, dog pharmacokinetics, pediatric antibiotic acceptability
    and a bronchitis comparison remain distinct from direct neutral-acid binding evidence.
    The irinotecan dose-escalation paper does not make cefpodoxime an antineoplastic.
    Gonococcal penA/PBP2 associations and pneumococcal susceptibility panels retain
