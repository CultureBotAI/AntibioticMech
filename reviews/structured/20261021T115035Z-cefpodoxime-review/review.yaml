  reference: Official FDA label for cefpodoxime proxetil; effective_time:20240619
  locator: Reused 244-label.json, description, clinical pharmacology and indications
    sections; source URL and retrieval hash in 244-fetch-results.json
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: The official label calls cefpodoxime the active metabolite released from
    absorbed proxetil and states doses as cefpodoxime equivalents. Otitis media, pharyngitis/tonsillitis
