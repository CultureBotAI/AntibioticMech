summary: The native neutral cefpodoxime graph, 6R/7R core, Z oxime, formula and masses
  agree with PubChem, ChEMBL and both KEGG accessions. Its imported PBP claim retains
  honest CARD/ARO provenance. Original competition experiments support PBP binding
  of sodium cefpodoxime, with strain and assay limits; oral mouse and clinical treatment
  evidence concerns the proxetil prodrug. Current OLS SMILES loses oxime stereochemistry
  while its InChI and key retain it; VSDB has matching exact chemistry alongside inconsistent
  prodrug metadata. These source limitations do not establish a native identity or
  mechanism defect. No native record was changed. Scientific assessment retains the
  stated evidence limits; full verification is blocked by the shared native-library
  failure.
