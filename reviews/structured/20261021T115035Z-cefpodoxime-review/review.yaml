evidence:
- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/cefpodoxime.yaml
  locator: Entire native YAML, five synonyms and five source-seeding history events
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: The record denotes neutral cefpodoxime, explicitly describes oral administration
    as the proxetil ester prodrug, and keeps drug/document accessions separate from
    chemical xrefs. The PBP item explicitly states CARD/ARO provenance, unspecified
    organism/assay and PRIMARY_EVIDENCE_NEEDED. No curator mechanism, MIC, resistance,
    producer or product approval assertion is present.
- evidence_id: chemistry
  kind: validation
  reference: CHEBI:3504; PubChem:6335986; ChEMBL:CHEMBL1672; KEGG:C08114; KEGG:D07650
  locator: 245-chemistry.py/.json and corresponding authority snapshots
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: Native SMILES and InChI, PubChem, ChEMBL, both KEGG molfiles and current
    ChEBI InChI agree on WYUSVOMTXWRGEK-HBWVYFAYSA-N, C15H17N5O6S2, charge 0, two
    R core centers, Z oxime, average mass 427.464 and exact mass 427.062025264. The
    five native synonyms retain the acid identity; CPD is an adopted ARO abbreviation.
    Current OLS SMILES omits the oxime backslash and produces WYUSVOMTXWRGEK-NOZJJQNGSA-N
    with unspecified oxime stereo, while its stored key and InChI remain the configured
    identity. This source serialization discrepancy is preserved, not silently normalized
    or attributed to the native record.
  snapshot_sha256: 2dad36e0bbda8a61f3b2e765e5a67304bc2f8716a9f120cf1881563669f32a53
- evidence_id: grounding
  kind: authority
  reference: CHEBI:23066; CHEBI:33575; CHEBI:33281; CHEBI:36047; ARO:0000032; ARO:3000647;
    cas:80210-62-4
  locator: 244-parent-23066.json and 244-parent-33575.json reused same-day term snapshots;
    245-aro-stanzas.txt; adopted chebi_role_names.tsv; current chemical authorities
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: Cephalosporin and carboxylic acid are strictly broader structural classes
    and the neutral graph retains a free COOH. The adopted roles resolve to antimicrobial
    agent and antibacterial drug. ChEBI, ARO and KEGG agree on third-generation classification.
    CAS80210-62-4 and the accessible exact chemical mappings agree, without direct
    CAS registry verification.
  snapshot_sha256: 007d4a211cbaee1d2f1e8434add9cbb72bf5e1610b99db7dde3a16503a2b3d7d
- evidence_id: synthesis
  kind: primary_source
  reference: PMID:3570989; DOI:10.7164/antibiotics.40.370
  locator: Reused 244-primary1987.pdf; Figure 2 p.371 and compound 1 characterization
    p.378; 244-primary-p371.png/244-primary-p378.png
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: The original synthesis paper explicitly distinguishes the neutral carboxylic
    acid 1 from proxetil ester 2a. The acid was isolated and characterized with C15H17N5O6S2
    elemental analysis and NMR; the ester has a separate preparation and formula.
    This supports the exact acid/prodrug distinction rather than treating shared clinical
    naming as chemical equivalence.
  snapshot_sha256: f7032994a6d63c1dbf30d8e15a2a048ee15b4d012e3d882b440f72f42550454a
- evidence_id: target-owner
  kind: authority
  reference: ARO:3000749; ARO:3000647
  locator: 245-aro_target_edges.json; 245-aro-stanzas.txt; conf/aro_target_roles.tsv
    line 30; 245-aro-cache-hash.json
  accessed_at: '2026-10-21T11:48:58Z'
  support: supports
  summary: ARO directly asserts targeted_by_antibiotic cefpodoxime. Maintained semantics
    map the source family to DIRECT_BINDING_TARGET/PROTEIN. The native item does not
    invent an organism or measured affinity. The source family description uses E.
