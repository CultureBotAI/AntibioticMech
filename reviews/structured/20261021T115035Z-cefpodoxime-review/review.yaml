limitations:
- Current OLS SMILES omits oxime stereochemistry and produces WYUSVOMTXWRGEK-NOZJJQNGSA-N,
  whereas its InChI/key, the native structure and independent PubChem/ChEMBL/KEGG
  graphs agree on WYUSVOMTXWRGEK-HBWVYFAYSA-N. The diagnostic comparison explicitly
  reports this mismatch; it does not claim every representation is identical or propose
  degrading the native Z specification.
- 'VSDB2968 has matching exact neutral chemistry but internally mixed metadata: prodrug
  terminology, a different CAS82619-04-3, and conversion to cefpodoxime. A curator
  should clarify those fields with the source before using its drug, assay or pharmacokinetic
  claims. The native exact mapping is supported by its explicit graph, not all page
  prose.'
- Reaxys6021381 was confirmed as an adopted/current ChEBI link without direct registry
  inspection. DrugBank DB01416 returned HTTP403. CAS80210-62-4 is corroborated through
  accessible authorities without independent registry access. Wikipedia was read as
  a contextual document and its mixed acid/prodrug pharmacology was not used as primary
  evidence.
- The complete original 1987 activity/binding article explicitly uses sodium R-3746
  in Figure 1. Competition I50 values are conditional label-displacement measurements,
  not Kd/Ki, and are not adopted as exact neutral-acid observations. Its oral mouse
  protection is for CS-807 proxetil. The two additional primary studies were inspected
  only at complete-abstract depth; their full original methods were not inspected.
- 'All 15 adopted compound/ARO parent/target PMID records were checked at actual access
  depth: 13 complete abstracts and two review metadata records without abstracts.
  Several concern proxetil formulations or clinical context rather than the exact
  neutral reagent; an irinotecan combination paper is not evidence that cefpodoxime
  is an antineoplastic, and penA association is not direct PBP binding.'
- The generic iModulonDB penicillin query returned one yfeW/PBP4B gene and zero components.
  It supplies catalog context only, not cefpodoxime mechanism evidence or negative
  evidence. No component summary was applicable.
- Optional future primary target or mechanism enrichment requires claim-level evidence
  preserving sodium/free-acid/prodrug, strain, assay and measurement boundaries. Supplemental
  chemistry used the existing 019 interpreter against 025. Focused checks do not substitute
  for required shared corpus gates.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
