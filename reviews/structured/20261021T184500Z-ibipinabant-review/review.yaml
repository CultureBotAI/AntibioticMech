limitations:
- The adopted main scientific text, all four tables and all four actual figure panels
  were read. The supplementary TablesS1–S3 were unavailable through attempted ordinary
  public routes; the instance download was a browser challenge shell, not a DOCX.
- The adopted study names TargetMol ibipinabant but does not specify catalog, CAS,
  lot, purity or enantiomeric composition in the inspected main. Current S/racemate
  product entries establish a reporting ambiguity, not which material was tested.
- The original2004 discovery and2008 bioisostere studies were read at complete abstract
  depth, not full crystallographic/synthetic depth. The2010 CB1 primary was read in
  its exact Methods/SLV319 Results/Table1 and identity sections, not every unrelated
  SAR section.
- The killing-curve timing differs from its prose, and the mouse Results percentage
  differs from the approximate Discussion log reduction. The native qualitative statements
  remain supported; no new quantitative claim is created.
- The discovery search was bounded; no comprehensive clinical safety, all-target or
  resistance review was performed. No clinical approval or treatment claim is asserted.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
