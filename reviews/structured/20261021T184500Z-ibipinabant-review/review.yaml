  support: supports
  summary: FA1090 time-kill uses5xMIC, logarithmic inoculum5e6CFU/mL, serial plating
    and triplicates. The prose says three-log reduction at8h and below detection at12h,
    while the actual orange curve already reaches the plot floor at8h. Both support
    the native qualitative bactericidal statement, but the source timing difference
