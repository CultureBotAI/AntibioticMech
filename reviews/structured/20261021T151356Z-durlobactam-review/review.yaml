limitations:
- Neither the current combination-product label nor combination susceptibility studies
  prove durlobactam parent monotherapy efficacy. The marketed ingredient is the sodium
  salt, with strengths in parent equivalents.
- The inspected original mBio and JAC methods identify supplied powder/lot but not
  the exact solid form. Their moiety-level mechanism and mixture-level assays are
  retained at those scopes.
- The reversible-inhibition paper was inspected at complete-abstract level. Its enzyme-dependent
  outcomes cannot be replaced by a blanket statement that every covalent complex is
  reversible.
- Every adopted citation was resolved, including both conference abstracts. Some full
  papers were not inspected, two PMID entries have no abstract, and reviews/LactMed/compatibility
  studies were not promoted to original antibacterial evidence.
- DrugBank was blocked and the original Nature discovery main text/supplement was
  not successfully inspected. Batch Europe PMC failures were resolved by individual
  queries, not silently omitted.
- The direct InChI-roundtrip graph assertion failed on tautomeric representation.
  The final comparison retains exact original composition and configured-center parity,
  so no wrong-structure finding is inferred from that failure.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- This review does not create a new target, resistance or clinical-status entry. Protein
  mechanisms in combination papers are attributed to the appropriate component.
- The neutral molecule and sodium salt were separately audited from preserved target
  hashes. Shared retrievals and adapter execution are explicitly identified; no salt
  or assay result is silently transferred.
- Standalone chemistry used the batch 019 interpreter against batch 039; native schema/strict
  and source-ledger checks used batch 039.
- Initial XML extraction using an unavailable optional BeautifulSoup dependency failed;
  standard-library XML parsing then supplied the inspected text.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
