- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/durlobactam.yaml
  locator: Whole native YAML
  accessed_at: '2026-10-21T15:12:35Z'
  support: supports
  summary: The native record contains the neutral parent, structural definition and
    role, with no quantitative MIC, protein-target, resistance, producer, clinical-status
    or causal-graph objects. It does not itself claim that a particular treatment
    combination or resistant isolate establishes parent monotherapy efficacy.
- evidence_id: chemistry
  kind: authority
  reference: CHEBI:229539; UNII:PSA33KO9WA; PubChem CID89851852; KEGG D11591
  locator: 383-chebi.json/.mol; 383-gsrs.json; 383-pubchem.json; 383-kegg.txt/.mol;
    383-authority-chemistry.json
  accessed_at: '2026-10-21T15:12:35Z'
  support: supports
  summary: Eight encodings agree on one neutral C8H11N3O6S component, matching mass
    and BISPBXFUKNXOQY-RITPCOANSA-N. Both configured carbon centers map with chirality
    preserved. InChI reconstruction produces an imidic-acid tautomer; explicit normalization
    with stereo removal disabled and atom-neighbor parity checks restores reciprocal
    graph matching. No sodium or water component is stripped to manufacture agreement.
    GSRS additionally labels the constrained bridgehead nitrogen; the Standard InChI
    represents the two carbon descriptors.
  snapshot_sha256: 2be4970d18eebd60b122b7c321f9961e0d6c4f83a217790515f30dd601206da9
- evidence_id: terms
  kind: authority
  reference: CHEBI:140324, CHEBI:29347, CHEBI:38025, CHEBI:38295; CHEBI:36047
  locator: 382-term-140324/29347/38025/38295.json; shared371-role.json; 383-chebi.json;
    383-kegg.txt
  accessed_at: '2026-10-21T15:06:27.541023Z'
  support: supports
  summary: The graph contains a primary monocarboxamide, the N-O-sulfonic-acid linkage
    and the nitrogen bicyclic skeleton; the four current parents resolve with those
    labels. The structural definition and systematic synonym preserve the methyl,
    unsaturation, carbamoyl, oxo and sulfooxy connectivity. CAS1467829-71-5 and ETX2514
    variants refer to the parent in the inspected authority context, distinct from
    the sodium-qualified sibling.
  snapshot_sha256: 0f87c2a65e502a05ff1a3c9b5dff27c8f7f1c5446262516c3a317bc4f19af053
- evidence_id: label
  kind: authority
  reference: DailyMed XACDURO SPL c0167aec-a89d-4e96-afe5-2ccf3e89fe72
  locator: 382-label.xml sections1,11,12.4,14; shared exact-salt identity inspection
  accessed_at: '2026-10-21T15:07:06.406833Z'
  support: context_only
  summary: The marketed ingredient is durlobactam sodium and its doses are expressed
    in parent equivalents. Approval applies to the co-packaged sulbactam product for
    adult HABP/VABP caused by susceptible ABC isolates; the trial included background
    imipenem/cilastatin. Durlobactam protects sulbactam from certain serine beta-lactamases
    and alone lacks activity against ABC isolates. This supports drug-role context
    without asserting that the isolated neutral solid itself is the administered product
    or universally lacks intrinsic activity.
  snapshot_sha256: 01d6b21826563aac5d80c7ef8ea24cb1b659c97cca0cf6621dc9aa6f02fd2561
- evidence_id: primary
  kind: primary_source
  reference: PMID:30862744; DOI:10.1128/mBio.00159-19
  locator: 382-PMC6414696.xml original reagents, susceptibility/kinetic/mass/crystallographic
    methods and corresponding results
  accessed_at: '2026-10-21T15:07:58.973201Z'
  support: supports
  summary: Entasis ETX2514 powder, without an explicit salt statement, inhibits purified
    ADC-7 and OXA-58 and forms measured covalent adducts. OXA-24/40 crystallography
    locates the ring-opened inhibitor at catalytic S81. Thus direct beta-lactamase
    inhibition concerns the parent drug moiety. Isolate experiments combine sulbactam
    with fixed 4 mg/L ETX2514; their values cannot be restated as standalone durlobactam
    MICs. Binding of the acylated product does not mean the unreacted neutral structure
    remains chemically unchanged in the active site.
  snapshot_sha256: b918cf17d6b771433bbbb9caebdf4ce5e29c855a5814c815855927544f4bc255
- evidence_id: reversibility
  kind: primary_source
  reference: PMID:28835096; DOI:10.1021/acsinfecdis.7b00113
  locator: 383-core-28835096.json complete original abstract
  accessed_at: '2026-10-21T15:07:41.375158Z'
  support: supports
  summary: The original study compares ten class A/C/D serine beta-lactamases. ETX2514
    recyclizes and dissociates intact from five named enzymes but not the tested KPC-2/OXA
    enzymes; KPC-2 slowly degrades the inhibitor. The evidence supports enzyme-specific
    covalent inhibition, not a universal reversible-adduct claim. The full experimental
    body was not inspected.
  snapshot_sha256: d14b3279c54f1ef1d49b75f2bdd254ba1f00847e3627bcd14a9b267ba93618f6
- evidence_id: design
  kind: primary_source
  reference: PMID:28665414; DOI:10.1038/nmicrobiol.2017.104
  locator: 383-core-28665414.json complete original abstract
  accessed_at: '2026-10-21T15:07:43.334089Z'
  support: context_only
  summary: Original discovery work reports serine beta-lactamase and PBP inhibition,
    intrinsic activity against Enterobacteriaceae, and sulbactam-combination efficacy.
    Exact solid form and the complete experimental tables were not established from
    the accessible abstract. It prevents overgeneralizing the official ABC-specific
    monotherapy limitation to all organisms.
  snapshot_sha256: 6013d3a8bb0d669658ebd06d749e99e5238909201dc5c604f34fb77e0540665c
- evidence_id: combination
  kind: primary_source
  reference: PMID:37839896; DOI:10.1093/jac/dkad244
  locator: 383-PMC10689914.xml main material, MIC/time-kill methods and results; related
    conference PMC10678025
  accessed_at: '2026-10-21T15:07:58.973642Z'
  support: context_only
  summary: The original study specifies Entasis durlobactam lot 134693 but no exact
    solid form. It tests fifteen isolates using sulbactam-durlobactam, cefepime and
    their combination; MICs use fixed 4 mg/L durlobactam, whereas time-kills use clinically
    simulated average concentrations. Synergy varies by isolate and regrowth occurs
    in the Pseudomonas experiments. It does not directly isolate durlobactam monotherapy
    or demonstrate clinical benefit. The related conference report is a limited abstract
    and is not a second independent experiment.
  snapshot_sha256: 3fb487f5481d350ad24760897488cec04db83bd99c3342764209232a33aff04e
- evidence_id: resistance
  kind: primary_source
  reference: PMID:37843305; DOI:10.1128/aac.00665-23
  locator: 383-PMC10648852.xml selected full isogenic-panel, susceptibility, PBP3,
    efflux and sulbactam-protection methods/results
  accessed_at: '2026-10-21T15:07:58.973545Z'
  support: context_only
  summary: The study concerns sulbactam-durlobactam combination susceptibility, metallo-beta-lactamases
    and sulbactam-target PBP3 variation. A515V alone is insufficient in the tested
    systems; effects of other variants depend on enzyme context. AdeIJK disruption
    and strain efflux evidence suggest a contribution to durlobactam disposition,
    but not every genotype is individually causal. Native durlobactam has no such
    resistance entries, and none are manufactured from association alone.
  snapshot_sha256: 561fdc4ecef02cfbc763ff51607699f2e7d0e674a3242a684746c2497ea23de7
- evidence_id: conference
  kind: primary_source
  reference: PMC:PMC5631255
  locator: 383-PMC5631255.xml complete conference report
  accessed_at: '2026-10-21T15:07:06.407590Z'
  support: context_only
  summary: The 2017 report describes 72 A. baumannii isolates with sulbactam plus
    fixed 4 mg/L ETX2514 and purified ADC-7/OXA-58 experiments. It is a conference
