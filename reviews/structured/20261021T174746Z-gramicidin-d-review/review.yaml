  status: open
  certainty: confirmed
  title: An antibiotic-mixture concept is represented by an unrelated single 14-residue
    graph
  description: The native definition and official ARO:3000199 describe the A/B/C mixture,
    corroborated by original 1998/2014 papers. The stored CID 45267103 graph is one
    14-residue peptide with composition C96H135N19O16, specifically A lacking Ala3
    in the traced sequence. Even changing it to a normal 15-residue A graph would
    not represent the mixture. The corpus explicitly excludes antibiotic-mixture concepts
    from individual-structure records.
