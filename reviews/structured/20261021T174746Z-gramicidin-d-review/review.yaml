summary: The declared gramicidin D concept is an A/B/C peptide mixture, outside this
  individual-structure corpus. Its fallback graph is a separate 14-residue peptide,
  equivalent in sequence to gramicidin A lacking Ala3, rather than any representation
  of that mixture. Primary modern sources corroborate the mixture boundary. A blocker
  requires source/eligibility adjudication, not substitution of a representative component.
