limitations:
- Required shared full-corpus checks are incorporated separately by the root reviewer
  before finalization; actual focused gates are recorded here.
- The additional 2007 comparison source is a secondary review; its relevant full text
  and cited original 1976/1987 abstracts were inspected. Original 1965 sequence studies
  were not read in full; attempted B/C ACS pages returned 403. Their titles alone
  were not used as structural proof. The 1976/1987 full methods were not retrieved.
- Multiple EPMC fullTextXML requests returned 500; PMC PDF endpoints sometimes returned
  HTTP 200 browser-challenge HTML rather than PDFs. These are access failures, retained
  in fetch manifests. The 1998 original was read at abstract depth only.
- The adopted 1997 HSV source was read at abstract depth; commercial preparation details
  were not retrieved. The 2014 full main was read, but its linked supplement returned
  a challenge, leaving reagent lot/assay details unresolved. No numerical data are
  assigned to the 14-mer.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
