  support: supports
  summary: galE overexpression rescues growth of the tested E. coli background, but
    purified GalE was not inhibited at ciclopirox concentrations up to 500 micromolar
    in the UDP-galactose-to-UDP-glucose coupled assay. The reverse reaction was not
    tested. Results and Methods disagree on substrate concentration, so no uniquely
    resolved kinetic regime is asserted. This is functional rescue plus a bounded
    negative biochemical test, not direct binding or validated inhibition of GalE.
  snapshot_sha256: 402a56a9a236d5e567509216b09e9b5e291e6448f54a4df3612a9c56f789b5e3
