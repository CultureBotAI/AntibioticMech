  support: supports
  summary: The study uses named Santa Cruz ciclopirox in DMSO, with fine-increment
    broth MIC measurements, E. coli BW25113 deletion strains and separate siderophore/swarming
    assays. The 21 specifically susceptible deletion mutants are not direct targets
    or resistant alleles. The Arnow assay detects catechol siderophores and cannot
    separate intact enterobactin from breakdown products. Swarming varies by strain
    and concentration; the authors do not establish an exclusive mechanism. The earlier
    clinical-panel results are cited context, not a newly repeated panel.
