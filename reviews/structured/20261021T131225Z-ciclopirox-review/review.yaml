  accessed_at: '2026-10-21T13:05:15.196360Z'
  support: supports
  summary: Iron supplementation rescues growth under tested conditions, and treated
    E. coli show altered LPS patterns. These observations motivate mechanistic models
    without proving one exclusive initiating target. Figure 2 shows concentration-dependent
    growth inhibition and killing; it does not establish universal bactericidal action.
    One Results sentence prints an mg/mL MIC inconsistent with the figure and adjacent
    microgram/mL methods; the review does not propagate that apparent unit error.
