limitations:
- Beilstein was inaccessible and LINCS LSM-5307 remains unresolved after direct-route
  failures and a bounded official HMS archive search. No incorrect-identifier finding
  is inferred from limited access.
- The 2006 original comparator prose was read in a public reproduction, whose table
  layout is unsuitable for exact numerical extraction; official SI pS10 was inspected.
  The 2007 original full PDF and Table 1 were inspected, but comparator catalog/salt
  details and full local incubation information were not supplied.
- The 2013 original text, Table 1 and Figures 2 and 5 were inspected. Its internal
  substrate-concentration and unit inconsistencies constrain precision; no unsupported
  kinetic or universal bactericidal conclusion is drawn.
- The 2019 full text and figure captions were inspected; individual supplementary
  mutant rows were not exhaustively adjudicated. No per-allele resistance annotation
  or numeric export from those supplements is proposed.
- Additional anti-inflammatory, clinical and broad-spectrum comparators were inspected
  at original-abstract depth and explicitly concern olamine or formulations. This
  does not independently establish every property of isolated parent material.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native record, source table, clinical assertion, status or history was altered.
- Native focused checks used the batch 030 environment; root molecular checks used
  the existing batch 019 RDKit interpreter against batch 030 cwd.
