    XML
  accessed_at: '2026-10-21T13:00:38Z'
  support: supports
  summary: The authors explicitly state that all experiments used ciclopirox without
    ethanolamine salt; the methods identify AK Scientific material. Triplicate CLSI
    microbroth dilution measured no visible growth. Thirty nonclonal E. coli clinical
    isolates had MICs 5-15 micrograms/mL despite differing resistance to other antibiotics.
    The other clinical panels show K. pneumoniae 5-15, A. baumannii 5-7 and P. aeruginosa
    10 to greater than 30 micrograms/mL. These measured panels support antibacterial
    activity, not universal susceptibility or a clinical breakpoint.
