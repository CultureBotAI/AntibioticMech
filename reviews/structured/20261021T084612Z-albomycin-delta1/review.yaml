limitations:
- 2018 preparation chemistry reports a desferri formula while the main drawing depicts
  Fe. Exact ferric MIC transfer requires source adjudication; medium iron does not
  prove the dosed preparation was ferric.
- 2012 δ1-active fraction identity is supported by mass/formula and shunt-product
  experiments, not independent stereochemical characterization of that isolated fraction.
- Direct CAS API access was unavailable; independent official GSRS records supplied
  the mixture and exact-component distinction.
- The bounded search does not establish the absence of additional δ1-specific mechanism
  or clinical evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
