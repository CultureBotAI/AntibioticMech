- All22 captured input hashes rechecked unchanged; no native, history or status changes.
- The older public GitHub MIBiG JSON listed only δ2; the version2 official annotation
  was retrieved and inspected instead. Native source_version4.0.1 and record_version2
  are preserved.
- The native MIBiG note correctly marks the first legacy citation as inherited. A
  future curator may attach primary δ1 shunt-product evidence without upgrading every
  locus-level claim to compound-specific proof.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
