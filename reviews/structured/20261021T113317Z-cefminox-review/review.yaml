limitations:
- Required shared corpus results must be incorporated before final save. Focused success
  alone does not establish whole-corpus quality.
- No paid source was used. Inaccessible independent registry or article contents remain
  explicit limits, not evidence of nonexistence.
- All twelve adopted compound MED leads and two direct mechanism follow-ups were dispositioned,
  plus the cephamycin-parent review and three shared ARO-class review leads. Two toxicology
  abstracts are explicitly truncated; two parent reviews have metadata only.
- The 1984 primary Methods and relevant Results/Discussion were read; Figure 1 and
  Tables 4–5 were visually checked. Not every susceptibility-table cell or figure
  point was audited. Supplied bulk salt/hydrate form and prior referenced assay protocols
  remain limits.
- The India study was inspected at Methods and relevant cefminox result/discussion
  depth. No current breakpoints or clinical recommendations are inferred. The host
  paper was inspected selectively; docking predictions and pathway response are not
  direct antibacterial-target evidence.
- ChemSpider, DrugBank and Wikipedia contents remain independently unverified. Optional
  primary observations should be added only with exact strain, material, method, units
  and citation through the native curation path.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
