summary: The neutral cefminox structure, stereochemistry and checked chemical identifiers
  agree. Original MT-141 structure–activity, PBP competition and killing experiments
  support antibacterial classification with strain and material limits. The native
  broad activity description is historical spectrum context, not universal susceptibility.
  Host pulmonary-hypertension experiments and cell-free biosynthetic conversion do
  not establish the antibacterial target or a natural producer. No confirmed required
  correction was demonstrated. Scientific assessment retains the stated evidence limits;
  full verification is blocked by the shared native-library failure.
