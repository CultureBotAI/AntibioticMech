- evidence_id: sar
  kind: primary_source
  reference: PMID:6439712; DOI:10.7164/antibiotics.37.1403
  locator: Original Methods pp1404–1405, relevant Results pp1405–1410 and Discussion
    pp1411–1412; Figure 1 and Tables 4–5 visually inspected.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: 'MT-141 is the matching cefminox graph, compared with decarboxylated, amidated,
    N-acetylated and L-amino-acid analogues. E. coli K-12 JE1011 killing and optical-density
    loss differ between analogues despite similar PBP profiles. Table 5 reports molar
    competition I50 relative to benzylpenicillin=1: PBP1A 0.8, 1Bs 1.4, PBP2 160,
    PBP3 3.2, PBP4 <1.0 and PBP5/6 0.1. Membranes were preincubated with unlabeled
    drug at 37 C for 10 minutes, then radioligand for 10 minutes. These are not equilibrium
    Kd values. The authors explicitly did not find the PBP-affinity differences sufficient
    to explain killing/morphology differences and proposed an additional mechanism
    for later investigation. Bulk salt/hydrate form was not resolved.'
  snapshot_sha256: 8e7eb5ddbeb51f667545aec49570d96176c178e12725b45fe6629cb6256c17fa
- evidence_id: sar-assays
  kind: primary_source
  reference: PMID:6439712; DOI:10.7164/antibiotics.37.1403
  locator: Original assay Methods and Table 1/4/5 scope.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: Agar MIC used HI agar, 5 microliter spots of 100-fold diluted overnight
    Trypticase soy cultures and 37 C/24 h; anaerobes used GAM agar/GasPak and 37 C/48
    h. Table 1 includes grouped MIC50/ranges, not one strain for every row. Table
    4 compares purified C. freundii GN346 enzyme and crude B. fragilis No.36 extract
    at 200 micromolar substrate/30 C, normalized to cephalothin=100. MT-141 relative
    hydrolysis is 0.20 and <0.01 respectively. These results neither establish universal
    beta-lactamase resistance nor make morphological change a direct binding assay.
  snapshot_sha256: 909b34ea018107f6edab05f74dd774d4a8876550f3463e2cdde81b7bbada1188
- evidence_id: india
  kind: primary_source
  reference: PMID:25068396; DOI:10.1371/journal.pone.0103253; PMC4113358
  locator: Original Methods, cefminox rows in Tables 2–6 and relevant Discussion.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: 'The 2012 South India series comprises 925 consecutive isolates, one per
    patient: 211 E. coli, 207 Klebsiella spp., 153 P. aeruginosa and 354 Acinetobacter
    spp. Broth microdilution used cation-adjusted Mueller–Hinton broth and genus-level
    identification for the latter two genus groups. Cefminox MIC50/MIC90 values in
    micrograms/mL were 1/128, 1/>128, >128/>128 and 64/128, respectively. The paper
    explicitly has no cefminox CLSI interpretation criteria. These are population
    summaries, not exact isolate observations or proof that every Gram-negative organism
    is susceptible.'
  snapshot_sha256: 19de4d0a49aa7befbbea4fbdf0212e1ec35c5b608b59292e3bfb975fa3e39b8d
- evidence_id: host
  kind: primary_source
  reference: PMID:29527168; DOI:10.3389/fphar.2018.00134; PMC5829529
  locator: Original selected Methods and Results on virtual screening, primary rat
    pulmonary artery smooth-muscle cells, antagonist experiments and animal allocation.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: The paper combines modeled PPAR-gamma/IP interactions with rat-cell proliferation/signaling
    experiments and hypoxia-exposed rats. Antagonist reversal supports host-pathway
    involvement in that model; docking energies are calculated rather than direct
    biochemical binding constants. This is host-response research, not the antibacterial
    PBP mechanism or human clinical approval evidence. Supplements and all downstream
    experiments were not independently audited.
  snapshot_sha256: 6675580214fe7cbb871dc8d0ef234efcdcf68ee1480608ecf1dd2696b79aba14
- evidence_id: other-primary
  kind: primary_source
  reference: PMID:25672407; PMID:10855011; PMID:11073141; PMID:10620685; PMID:3928375
  locator: Available complete indexed abstracts.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: The China and 477-isolate comparison studies show organism-dependent in
    vitro activity. The randomized intra-abdominal trial compares cefminox with metronidazole
    plus gentamicin and is a clinical outcome study, not a molecular-target assay.
    Cell-free S. clavuligerus extracts convert a supplied 7-alpha-demethoxy precursor
    to cefminox at low yield; that does not establish natural production of cefminox
    by the organism. The terminal-D-amino-acid second-target paper is an abstract-level
    mechanism lead; no complete causal chain is adopted from it.
  snapshot_sha256: 84a82c29a850492fcaeca3a5c678841654c827ac3781453d285c6d25f3ae6afb
- evidence_id: context
  kind: database
  reference: PMID:31772584; PMID:30395207; PMID:29017833; PMID:2100248; PMID:6434763;
    PMID:6434760; PMID:1107228; PMID:11585791; PMID:15673804; PMID:6810737
  locator: 'Remaining compound and broader-parent leads: available abstracts or metadata.'
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: 31772584 concerns N-acetylcysteine-associated esophagitis, 30395207 cefminox
    sodium impurities, 29017833 allergy and 2100248 a pharmacology review. The two
    MT-141 toxicology abstracts are index-truncated and not antibacterial mechanism
    proof. The cephamycin review 1107228 focuses on cefoxitin and class prospects.
    Shared broader ARO class reviews provide context; 15673804/6810737 have metadata
    only. None justifies transferring a sodium formulation, host effect or class-wide
    assertion into an exact native observation.
  snapshot_sha256: 94fd158e0554701b892d16b4e234c53f16f770b9387e150bb8b22d855591802e
