  support: supports
  summary: Neutral cefminox has (6R,7S) core configuration and the specified (2S)
    terminal D-amino-acid side chain. CAS 84305-41-9 resolves to the matching PubChem
    entry. CHEBI:35689 is tetrazoles and CHEBI:55429 is the broader cephamycin class.
