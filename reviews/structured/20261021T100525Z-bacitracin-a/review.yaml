limitations:
- Reaxys8969478 was verified as the live ChEBI mapping, not independently opened in
  the proprietary registry.
- Resistance source follow-up was bounded to indexed primary abstracts. Exact bacitracin
  A preparation and direct BcrAB drug transport were not established there; database-only
  native evidence was not silently upgraded.
- The2023 source reports0.3 mM ZnSO4 in Results/Table1 but0.3 M in Methods. Resolve
  or preserve that inconsistency before curating its assay conditions.
- The2013 crystal uses geranyl pyrophosphate; C55 recognition is supported separately
  by liposome assays. No crystal, affinity or membrane-leakage claim is expanded beyond
  its measured condition.
- Some primary publisher requests returned403 or verification pages; accessible alternative
  PMC full text supplied the key exact-A structural and synthetic evidence. No failed
  retrieval was treated as absence of evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All25 captured inputs rechecked unchanged. No native, source-table or scientific
  status/history edits.
- An initial helper compared a ChEBI mint with the first ARO source concept; corrected
  scratch checks confirm both actual mints. This helper issue is not a native finding.
- Optional activity_spectrum and primary target annotations can be added later with
  strain, preparation, metal and assay qualifiers; empty optional fields are not findings.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
