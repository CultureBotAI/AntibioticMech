- evidence_id: chemistry
  kind: validation
  reference: CHEBI:198143;pubchem.compound:132493269;NPA000694
  locator: 523-authority-chemistry.json;523-chebi.json/.mol;523-pubchem.json;523-npatlas.json
  accessed_at: '2026-10-21T18:04:53Z'
  support: supports
  summary: Eight native and authority encodings agree at AKSOODVGSHGQHA-VMXHOPILSA-N,
    C23H42N4O4 and zero charge. Four alpha centres and the Ile side-chain centre are
    configured S. Native constitution is cyclo(Ile-Leu-Val-Leu), equivalently the
    cyclic rotation of Val-Leu-Ile-Leu used in the original synthesis; it has no Ala.
    Chirality-aware comparison follows stereo-preserving tautomer normalization of
    InChI reconstruction.
