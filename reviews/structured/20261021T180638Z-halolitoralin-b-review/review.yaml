  finding_ids:
  - F1
  target_ids:
  - antibioticmech:aro-a23579298c
  description: Correct the maintained ARO B definition through a reproducible source-specific
    input/transform correction, describing the supported cyclic tetrapeptide with
    no alanine and citing the inspected B synthesis publisher record. Rewrite any
    retained activity summary for B compound7, its actual disk-diffusion/earthworm
    panel and source limits. Reseed without replacing the supported PubChem graph
    or automatically adopting the conflicting external J-GLOBAL structure.
  owner_paths:
  - repository: CultureBotAI/AntibioticMech
    path: data/raw/aro_antibiotics.tsv
    role: Exact B definition and definition_refs
  - repository: CultureBotAI/AntibioticMech
    path: scripts/extract_source_inventory.py
    role: Reproducible source-specific definition correction
  - repository: CultureBotAI/AntibioticMech
    path: scripts/seed_from_sources.py
    role: Generated definition and reference projection
  generator: scripts/extract_source_inventory.py and scripts/seed_from_sources.py
  acceptance_checks:
  - B definition says cyclic tetrapeptide and does not claim alanine-rich composition
    or copy A-specific potency wording.
  - Every activity statement points to B-specific original material/assays; zones
    are not called MIC and no blanket species or clinical claim is created.
  - Native full key AKSOODVGSHGQHA-VMXHOPILSA-N and C23H42N4O4 remain unless separate
    primary natural-product evidence proves a correction.
  - Re-run focused schema/strict, source/reference/history/corpus and full QC checks
    for any eventual native edit.
limitations:
- The original2002 natural-product full main was unavailable; only its publisher abstract
  and graphical-abstract prose were inspected. Its original congener structure and
  assay tables were not independently verified.
- J-GLOBAL/Nikkaji provides a conflicting C24 constitution for B; exact resolution
  against the original2002 structure remains open. Native/current ChEBI/PubChem/NPAtlas
  and the2007 synthesis are concordant C23, so no graph change follows here.
- The2007 original synthetic-material report was read in full and actual Scheme1/Tables1/2
  inspected. Strain identifiers, full incubation/inoculum and antimicrobial replication
  details are not stated in the inspected section; results cannot be upgraded to MIC
  or clinical susceptibility.
- The adopted broad2021 review was read at its exact halolitoralin paragraph/reference
  beyond the complete abstract; unrelated sections were not fully reviewed. Its citation
  does not support the copied B activity description.
- NRPS origin remains qualified database inference, not experimentally demonstrated
  here. No B target experiment was established in the bounded search; this is not
  a universal absence claim.
- Required shared corpus gates and known platform SciPy failure are integrated by
  the coordinating finalizer; focused checks do not replace full QC.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native, maintained-source or immutable saved bundle was changed. Scratch review
  and source evidence are handed off for independent final audit/saving.
- Original13 hashes are preserved with three actual ARO/PubChem owner inputs; standalone
  chemistry019 runs against053, native schema/strict and ledger use053.
- One linked major finding covers the copied definition and its citation repair; separate
  duplicate findings are avoided.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
