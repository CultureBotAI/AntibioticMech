limitations:
- Reaxys was not independently accessed. The original1997 structural-letter companion
  was not recovered, but the full2008 asymmetric synthesis and final-product supplementary
  comparison were inspected.
- The2008 main article was recovered within a scanned government report and read as
  pages6657–6660, not as all20 pages of that report. Only stated SI sections and S91
  spectra were inspected; raw NMR data were not reprocessed.
- The2010 paper was read for relevant translation results/discussion and material/assay
  methods; all figures and supplementary assays were not independently reconstructed.
  Other later adopted papers remain at complete abstract depth, with2011 core-paper
