- evidence_id: leads
  kind: primary_source
  reference: https://pubmed.ncbi.nlm.nih.gov/37212460/
  locator: all seven adopted PMID records; five complete indexed abstracts and two
    full originals without indexed abstracts
  accessed_at: '2026-10-21T14:02:23Z'
  support: supports
  summary: PMID37212460 is later total synthesis;21663740 concerns A549 TNFR1 shedding;21323372
    concerns core synthesis only;20943818 concerns eukaryotic translation;9809995
    concerns HL-60 apoptosis/p36 kinase. PMID9186568 and18646025 have no indexed abstracts
    and were recovered as originals. None of these later abstracts establishes bacterial
    susceptibility.
  snapshot_sha256: 41195920feb1490680123395675b13532a9a3fcd0c80320031e4d5e0a48dba82
- evidence_id: translation2010
  kind: primary_source
  reference: https://doi.org/10.1261/rna.2307710
  locator: PMID:20943818 / PMC2995401; relevant original Results/Discussion and material/assay
    Methods
  accessed_at: '2026-10-21T14:02:23Z'
  support: supports
  summary: Cytotrienin A from the earlier isolation procedure was tested in mammalian
    translation extracts, purified eukaryotic systems, HeLa and HUVEC cells. The paper
    explicitly leaves direct binding to ribosome and/or eEF1A unresolved. Bacterial
    EF-Tu comparators and E.coli synthetase used as an assay reagent are not cytotrienin
    antibacterial-target evidence. Its Results also report no significant inhibition
    of E.coli S30 translation at50 micromolar, explicitly data not shown; this cell-free
    endpoint is separate from a whole-cell MIC.
  snapshot_sha256: 92909fe13502cfc5c53a6bb74acad79f086e65cf061faff9eaca813136aad5d2
- evidence_id: later-search
  kind: search
  reference: Bounded exact-parent bacterial-activity search
  locator: Europe PMC exact name with bacterial/antimicrobial terms; independent web
    follow-up
  accessed_at: '2026-10-21T14:02:23Z'
  support: context_only
  summary: No verified positive exact-parent bacterial experiment was established
    among inspected hits. PMID36438873 assays plant extracts/fractions after metabolomic
    profiling, not isolated cytotrienin A;23531987 studies different linearolides
    from the same producer;26456470 and40001427 are reviews. Later synthesis/core
    and host-cell papers do not supply bacterial activity. This is a bounded failure
    to corroborate, not exhaustive absence evidence.
  search_scope: 2026-10-21; cytotrienin A plus antibacterial, bacteria, antimicrobial
