limitations:
- The adopted 1984 paper was available as a primary abstract, not its compound table
  or full Methods. Exact diamino-chloride observations remain unresolved.
- The 1997 primary abstract and first two pages of the 1998 paper were inspected;
  full reagent identity remains unresolved. The 1962 paper was a failed-access discovery
  lead only.
- Direct CAS and Reaxys detail pages were unavailable. CAS is corroborated through
  attributed PubChem content; Reaxys remains an inspected ChEBI assertion.
- The 2020 H. pylori paper names a Sigma hydrochloride without a catalog number or
  CAS in the inspected Methods; Figure 1 and exact commercial composition were not
  resolved in this review. Its observations were not assigned to the single chloride.
- Bounded research does not establish absence of additional exact-compound studies.
  No paid research, native edit or saved bundle occurred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Capture preceded judgment; the original hashes and Git base were preserved when
  provenance was expanded to 20 inputs.
- Local absence searches included hidden and ignored files within declared scopes.
- The record remains SEEDED. Optional missing scientific annotations alone were not
  treated as schema or scientific defects.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
