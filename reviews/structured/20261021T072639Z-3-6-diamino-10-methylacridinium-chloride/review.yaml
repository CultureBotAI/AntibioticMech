  - Map the tested material to the full single-chloride structure, separating the
    additional-HCl salt, proflavine mixtures and substituted acridine derivatives.
  - Keep Trypanosoma assays separate from antibacterial activity_spectrum and retain
    strain, endpoint, exposure and experimental conditions.
