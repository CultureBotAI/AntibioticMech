- evidence_id: chemistry
  kind: validation
  reference: CHEBI:65565;ChemSpider:27023094;PubChem:23584317
  locator: 187-chemistry.py;187-chemistry.json;187-ols.json;187-chebi.html;187-chemspider.html;187-pubchem-key.json
