- Focused record checks do not substitute for required corpus gates or authorize a
  REVIEWED status change.
- The optional initial chemistry check exited 1 due to the InChI reverse-conversion
  mismatch; it is not silently replaced by the later passing forward-comparison check.
  Native schema and strict validation both passed.
- The 1995 original four-page article was read, with its first two pages visually
  inspected. The patent description and claims were read in full; the assay and preparation
  pages were also visually checked, but no historical raw laboratory data or independent
  strain re-identification was available.
- The four biosynthesis articles and the desferrioxamine lead were read at complete
  indexed-abstract scope. Attempted Europe PMC full-text XML for the 2015 cluster
  and 2018 CreM papers failed with HTTP 500; their inaccessible methods are not claimed
  read.
- CAS is corroborated by the adopted/current public chemical entries; a paid independent
  registry was not accessed. The exact original preparation lot used for later crystallography
  was not independently traced to the patent lot.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
