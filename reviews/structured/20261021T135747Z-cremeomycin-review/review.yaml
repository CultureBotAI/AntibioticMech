- evidence_id: patent
  kind: primary_source
  reference: https://patents.google.com/patent/US3350269A/en
  locator: entire description and claims; scanned PDF pages 6–7, Tables VI/VII and
    Examples 1/2 visually inspected
  accessed_at: '2026-10-21T13:50:59Z'
  support: supports
  summary: The original patent reports bacterial agar diffusion and BHI tube-dilution
    experiments under subdued light. Disc-zone diameters and inhibition concentrations
    are distinct endpoints. Example 1 isolates crystalline cremeomycin; Example 2
    separately makes its potassium salt. The strain is historically named Actinomyces
    cremeus NRRL3241. This supports antibacterial eligibility without treating every
    salt, crude broth or claimed application as the same tested material.
