  accessed_at: '2026-10-21T13:50:59Z'
  support: supports
  summary: All six adopted leads were resolved individually. The 2015 cluster, CreE/CreD
    nitrous-acid pathway, 2018 CreD structure and CreM diazo-forming enzyme studies
    concern biosynthesis. PMID:30120394 concerns desferrioxamines in S. davawensis
    and does not transfer cremeomycin production to that species. None establishes
