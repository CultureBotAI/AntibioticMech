findings:
- finding_id: F1
  issue_key: bleomycin-family-mixture-mapped-to-partial-a2-structure
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the bleomycin family/mixture mapped to one partially specified A2
    structure
  description: Native definition and ARO/ChEBI denote a family used as variable mixtures.
    PubChem5360373 supplies one A2-connectivity sulfonium graph with ten unspecified
    sugar centres; ChEMBL403664 instead supplies fully specified A2. One A2-like formula
    cannot represent B2 and other terminal-amine congeners. Filling the missing sugar
    stereochemistry or replacing the key with A2 would not repair the broad concept
    and would risk duplicating the separate A2 record.
  target_ids:
  - antibioticmech:aro-1504589de3
