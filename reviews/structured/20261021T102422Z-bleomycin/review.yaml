  acceptance_checks:
  - A variable family/mixture is not retained as one exact molecular formula or graph.
  - Retain or create exact congener/salt records only with independently verified
    complete identity; existing A2 and B2 records must not be duplicated.
  - Do not substitute ChEMBL403664/A2 stereochemistry for generic bleomycin without
    resolving the concept scope.
  - Preserve BLMT sequestration evidence at the preparation scope verified from full
    primary text; do not turn it into chemical degradation or transfer it to all congeners.
  - Keep component-specific DNA/RNA and historical mixture clinical context separately
    attributed.
  - Run maintained source regeneration, identity/duplicate, target/resistance, schema,
    term, reference and history gates; retain native status pending authorized curation.
limitations:
- The adopted2005 review was verified at metadata scope. The1999 BLMT primary abstract
  was inspected; free full-text routes were unavailable, so exact reagent preparation
  and quantitative binding/antibacterial conditions remain unresolved.
- Component-specific DNA/RNA experiments do not establish all bleomycins as equivalent;
  A2 yeast RNA abstract and B2 cell-free DNA evidence remain at original scopes.
- The structured BLMT lookup found no matching gene/module in the selected reference
  dataset; mobile-element absence there is not biological negative evidence.
- No single exact structure can be reconstructed for a variable family/mixture from
  its generic name or one representative congener.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
