- evidence_id: dna-cellular
  kind: primary_source
  reference: https://doi.org/10.7164/antibiotics.22.446
  locator: PMID4982665; full three-page paper, reagent paragraph, Figure3 caption
    and Results
  accessed_at: '2026-10-21T10:02:42Z'
  support: context_only
  summary: Copper-free A2 was used. Growing E.coli15T- exposed to10 or100 micrograms/mL
    for30min at37C showed DNA strand scission; EDTA during extraction controlled additional
    ex-vivo degradation. This directly supports bacterial DNA damage without treating
    it as an MIC or extending it to all strains. Evidence remains at its original
    A2/substrate scope and is not proof of every family member or the native partially
    specified molecular graph.
  snapshot_sha256: f76a9568907cbc1a08c8a3763d82569b0fec46bd96c0627905abd70d9a62cd81
- evidence_id: dna-biochemical
  kind: primary_source
  reference: https://doi.org/10.7164/antibiotics.23.473
  locator: PMID4991640; full paper Materials/Methods, Results and Tables1/2
  accessed_at: '2026-10-21T10:02:42Z'
  support: context_only
  summary: Copper-free A2 and tritiated A2 bound isolated E.coli DNA. Cell-free strand
    scission was observed with1mM2-mercaptoethanol and depended on conditions; ribosomal/transfer
    RNA cleavage was not observed in that experiment. Binding and strand cleavage
    are separate measured endpoints, not universal RNA negativity. Evidence remains
    at its original A2/substrate scope and is not proof of every family member or
    the native partially specified molecular graph.
  snapshot_sha256: f434ac17791636fa062c39cce91408c7d3a2873ebe27bf5b0f0d3d469b0e87b2
- evidence_id: rna
  kind: primary_source
  reference: https://doi.org/10.1021/bi00037a046
  locator: PMID7547941; inspected indexed abstract
  accessed_at: '2026-10-21T10:02:41Z'
  support: context_only
  summary: A2 promoted sequence-selective hydrolysis of yeast tRNA(Phe) without added
    metal ions. This supports a distinct cell-free RNA endpoint, not a bacterial cellular
    RNA mechanism. Full text was not accessed; quantitative extraction is deferred.
    Evidence remains at its original A2/substrate scope and is not proof of every
    family member or the native partially specified molecular graph.
  snapshot_sha256: 726464bf833edac7c619471e25f644a72dc548666f7f9f9521216e380495f221
- evidence_id: mixture-primary
  kind: primary_source
  reference: https://doi.org/10.7164/antibiotics.21.592
  locator: 1968 individual-congener paper; introduction, Materials/Methods and antibacterial/results
    context
  accessed_at: '2026-10-21T10:05:49Z'
  support: supports
  summary: The study separates individual congeners and copper forms from a clinical
    mixture, documents variable component proportions and compares biological activity.
    This directly establishes the mixture/component distinction; it cannot be encoded
    by one A2-type formula. Antitumor data are historical experiments, not a current
    recommendation.
  snapshot_sha256: 69b4e87ad6eaa4676d8c51d359f269c0d8036a73812ef74c01d56611deefe146
- evidence_id: b2-primary
  kind: primary_source
  reference: https://doi.org/10.7164/antibiotics.26.521
  locator: 1973 Materials/Methods and DNA-scission Results
  accessed_at: '2026-10-21T10:05:26Z'
  support: context_only
  summary: Copper-free B2 lot32 directly cleaved isolated SV40 DNA. This is another
    defined congener with a guanidino terminal amine, reinforcing that family activity
    cannot establish the native A2-type graph as a whole-family structure.
  snapshot_sha256: 869c566e6f69684dabb969c707d769575eaf91687cb0c4454a519695dea0b00e
- evidence_id: blmt
  kind: primary_source
  reference: https://doi.org/10.1016/S0014-5793(98)01613-5
  locator: PMID9923599 indexed primary abstract
  accessed_at: '2026-10-21T10:07:35Z'
  support: partial
  summary: The Tn5 ble product BLMT bound bleomycin and quenched antibacterial/DNA-cleaving
