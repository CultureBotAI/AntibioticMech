  reference: data/antibiotics/antibacterial/cethromycin.yaml
  locator: Entire native YAML, including curated mechanism and all five history events
  accessed_at: '2026-10-21T12:42:11Z'
  support: supports
  summary: The exact ChEBI-grounded record is REVIEWED. It contains one directly bound
    ribosomal target with two primary citations, no MIC, resistance, producer, clinical-product
    assertion or causal graph. Its 2026 review event records scientific identity/mechanism
    sign-off, but the present chemical cross-reference conflicts warrant correction
