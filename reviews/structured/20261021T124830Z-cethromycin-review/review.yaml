findings:
- finding_id: F1
  issue_key: CHEBI-29506-exact-xref-stereochemical-scope
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Exact structure links include an epimer and a more specified alkene form
  description: Native xrefs[2] kegg.compound:C12020 differs at one configured tetrahedral
    center, proved by official molfile atom mapping and a single-center parity inversion.
    Native xrefs[3] pdb-ccd:773 and xrefs[5] pubchem.compound:447451 specify the E
    side chain while native ChEBI leaves it unspecified. Thus these links cannot all
    be asserted as exact chemical equivalence. This finding does not require the native
    graph to encode E, does not infer a physical mixture, and does not treat the appropriately
    separated KEGG drug/document links as exact identity claims.
  target_ids:
  - CHEBI:29506
  field_paths:
