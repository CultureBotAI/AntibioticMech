limitations:
- The2004 biochemical study was inspected at complete-abstract depth; publisher body
  returned403. No binding constant or detailed assay protocol was copied.
- The original2003 paper was inspected in the stated main sections and Figure1, not
  independently re-refined crystallographically. Its flexible side-chain density is
  less well resolved; the official CCD graph is used as the exact external descriptor.
- The2000 primary activity body was blocked by a challenge page and EPMC500. The other
  stated primary abstracts were read completely, but not every body or supplement
  was obtained.
- The2023 paper uses a borrowed telithromycin resistance threshold and observational
  erm/MLST associations. It does not provide an authoritative cethromycin breakpoint
  or direct causal resistance mechanism in this review.
- Unspecified alkene stereochemistry is not interpreted as a physical mixture. The
  major finding concerns exact database-link scope; a source-approved native stereochemical
  redefinition remains separate work.
- Current CAP-development status, independent CAS full-structure adjudication and
  DrugBank body were not established. FDA designation records support prophylactic
  historical indications and explicitly deny orphan-indication approval; no general
  current approval conclusion is inferred.
- Two exploratory chemistry comparisons failed as described; the corrected official-SMILES
  parity control passed. These optional diagnostic failures are not replaced by a
  claim that all chemical links agree.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
