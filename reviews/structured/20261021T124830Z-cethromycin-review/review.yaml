summary: 'The native ChEBI structure is internally coherent, and original ribosomal
  structural and biochemical evidence supports the qualitative protein-synthesis mechanism.
  One major finding concerns exact cross-references: KEGG C12020 differs at a configured
  tetrahedral center, while PubChem447451 and PDB CCD773 specify E alkene geometry
  absent from the native representation. This is an equivalence defect, not proof
  that the native unspecified alkene denotes a mixture or must automatically be resolved
  to E. All eleven adopted publication leads were dispositioned; FDA confirms three
  prophylactic orphan designations without orphan-indication approval.'
