- evidence_id: chemistry
  kind: validation
  reference: CHEBI:29506; PubChem:447451; PubChem:156417; CHEMBL3989904; KEGG:C12020;
    KEGG:D02391; PDB-CCD:773
  locator: 281-chemistry.json,281-map.json; official ChEBI/KEGG molfiles, PubChem
    JSON and CCD descriptor snapshots
  accessed_at: '2026-10-21T12:42:11Z'
  support: refutes
  summary: 'Native SMILES/InChI, current ChEBI and ChEMBL3989904 agree on PENDGIOBPJLVBT-AMXFZXBBSA-N,
    C42H59N3O10, charge0, thirteen configured tetrahedral centers and native mass
    precision. Their side-chain alkene is unspecified. PubChem447451 and CCD773 are
    the E representation ONLVEXIXSA-N; removing only alkene stereo recovers the native
    key. KEGG C12020 instead gives HMMOOPTJSA-N and differs at the mapped quinolylallyloxy-bearing
    carbon: native atom3 maps to KEGG atom6. Inverting that single atom in a diagnostic
    copy gives exactly the PubChem E graph and mutual chirality-aware matches, proving
    the conflict independently of raw @ text or CIP labels. The exact native-key query
    resolves PubChem156417. KEGG D02391 agrees with the E graph but occupies the permitted
    drug-granularity field.'
  snapshot_sha256: b60f255f780372774b97f303866b4e63751453fe9efd517b9326d1fc29d3ae9e
- evidence_id: grounding
  kind: authority
  reference: CHEBI:29506; CHEBI:25105; CHEBI:26513; CHEBI:63367; CHEBI:33281; CHEBI:36047;
    ARO:3007455; ARO:0000000
  locator: 281-chebi.json current complete authority response; adopted ARO row in281-aro_antibiotics.json
  accessed_at: '2026-10-21T12:42:11Z'
  support: supports
  summary: ChEBI confirms the native identity, macrolide/quinoline/monosaccharide
    structural parents, antimicrobial and antibacterial-drug roles, chemical descriptors
    and source synonym types. ARO supplies the cethromycin concept and macrolide class.
    The generic label and broad chemical parents remain sound even though certain
    imported exact structure links conflict. CAS205110-48-1 is retained by both source
    inventories and current ChEBI; an independent CAS full-structure record was not
    obtained.
  snapshot_sha256: 1f408d5645bf8f17c28072a8f75d305e67af44e690cef50c4ef6b0d365f4b9a2
- evidence_id: primary-structure
  kind: primary_source
  reference: PMID:12623020; DOI:10.1016/S0969-2126(03)00022-4; PDB:1NWX
  locator: '281-primary2003.pdf: pp329–332 Results, p334 Discussion, pp336–337 Experimental
    Procedures, Table1 and visually inspected Figure1;281-pdb.json and281-ccd.json'
  accessed_at: '2026-10-21T12:42:11Z'
  support: supports
  summary: The original D. radiodurans 50S cocrystal study used Abbott ABT-773 and
    supplied ligand structures, with sevenfold antibiotic excess and3.5Å resolution
    for ABT-773. It localizes the drug in the nascent-peptide exit tunnel and discusses
    rRNA interactions. Figure1 depicts the E side chain. The weakly resolved flexible
    quinolylallyl group is acknowledged by the authors. Two bound azithromycin molecules
    and their L4/L22 contacts are not transferred to cethromycin. The native complex-level
    target and direct-binding relation are appropriately scoped; these data do not
    validate an epimeric external graph.
  snapshot_sha256: c8747aa5d113be00cc2c74717dad95ffa7ff04d87daf8a0c6d27cc875933c3ce
- evidence_id: primary-biochemistry
  kind: primary_source
  reference: PMID:15380262; DOI:10.1016/j.ijantimicag.2004.04.013
  locator: Complete original abstract in281-core.json and PubMed; publisher body request
    returned403
  accessed_at: '2026-10-21T12:42:11Z'
  support: partial
  summary: The primary abstract explicitly reports in vitro transcription/translation
    and whole-cell amino-acid incorporation, H. influenzae NP200 isolated-ribosome
    binding, tighter binding than erythromycin and slower dissociation. This supports
    the native qualitative translation/affinity note. The full protocol, individual
    binding constants and distinction between cellular and isolated-ribosome dissociation
