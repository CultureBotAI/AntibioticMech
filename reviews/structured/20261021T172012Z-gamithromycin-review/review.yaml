limitations:
- All ten adopted papers were read at full abstract level; the2019 original was read
  in complete Methods/Results/Discussion/Conclusion sections. PMC8902991 is conference-abstract
  evidence only.
- The official UK label establishes the organism spelling and listed product uses
  at its stated date; the current EU document download was blocked by an anti-spam
  form. An older EMA download was a referral notice, not substantive product evidence.
- VSDB is internally inconsistent. This review identifies the positive forward-graph
  conflict without assuming which upstream edit is appropriate or alleging that the
  native gamithromycin structure is wrong.
- The original mouse serum/MHB MIC and PK/PD results have matrix, strain and model
  scope. Clinical, host transport and LPS studies are not direct target-binding proof
  or current treatment recommendations.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Bundle completion is partial because full repository QC is unavailable on this runtime;
