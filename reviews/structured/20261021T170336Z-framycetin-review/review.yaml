findings:
- finding_id: F1
  issue_key: framycetin-definition-glycoside-ester-wording
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Definition misnames a glycosidic linkage as an ester
  description: The definition calls framycetin a glycoside ester of neamine and neobiosamine
    B. Its exact native and official structures contain only single bonds and no carbonyl/ester
    group; original glycoside synthesis work describes the connection between these
    cores as glycosidic. The inherited chemical terminology is wrong while the exact
    compound identity and graph remain consistent.
  target_ids:
  - CHEBI:7508
  field_paths:
