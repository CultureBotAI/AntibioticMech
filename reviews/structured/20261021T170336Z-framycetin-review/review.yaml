- evidence_id: glycoside
  kind: primary_source
  reference: PMID:30736311; DOI:10.3390/molecules24030580
  locator: 476-PMC6385478.xml; original introduction, synthesis rationale and conclusion
  accessed_at: '2026-10-21T17:03:01Z'
  support: supports
  summary: The original explicitly describes glycosidic connections between neamine
