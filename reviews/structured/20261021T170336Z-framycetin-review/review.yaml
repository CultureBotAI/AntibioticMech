- evidence_id: target
  kind: primary_source
  reference: PMID:16214802; DOI:10.1093/nar/gki862; PDB:2ET4
  locator: 476-PMC1251667.xml; original methods, exact neomycin B Results and Figure4;
    476-2ET4.json
  accessed_at: '2026-10-21T17:03:01Z'
  support: supports
  summary: The study directly resolves neomycin B bound to a synthetic 22-nt 16S-rRNA
    A-site model at 2.4 Å. It uses E. coli residue numbering and Sigma antibiotic
    material. The exact ligand identity is corroborated by NMY and 2ET4; this is not
    a whole-cell phenotype or an intact 30S ribosome experiment. It supports the molecular
    binding target while preserving the native imported edge as database-tier until
    separately curated.
  snapshot_sha256: 1999a8a9aa83f35c77300c7006ad609ee09d7d83ff1095bb028286d92ae442d8
- evidence_id: acrD
  kind: primary_source
  reference: PMID:10692383; DOI:10.1128/JB.182.6.1754-1756.2000
  locator: 476-PMC94475.html; complete original main text, methods, Table1 and discussion
  accessed_at: '2026-10-21T17:03:01Z'
  support: supports
  summary: E. coli JC7623 acrD deletion and complementation change generic-neomycin
    MIC, with pronounced medium dependence. Direct accumulation experiments measured
    dihydrostreptomycin/gentamicin, not neomycin. This original found no increased
    aminoglycoside susceptibility after acrA/tolC disruption under its conditions;
    it alone does not establish the full AcrAD-TolC exact-B transport claim. The latter
    also cites a review and remains a bounded follow-up rather than universal refutation.
  snapshot_sha256: c9ce430db7f0ec82241a886c779b6073b1623890acd39bef84b02f4956d1bc1b
- evidence_id: pmpM
  kind: primary_source
  reference: PMID:14679249; DOI:10.1128/JB.186.1.262-265.2004
  locator: 476-PMC303449.html; original methods and Tables1–2
  accessed_at: '2026-10-21T17:03:01Z'
  support: supports
  summary: Heterologous PmpM expression in E. coli KAM32 raises reported fradiomycin
    MIC from 0.5 to 2 µg/mL. Native P. aeruginosa deletion/complement strains are
    all 4 µg/mL in Table2. Direct transport experiments concern ethidium. These distinct
    host results coexist; neither universal Pseudomonas fradiomycin resistance nor
    exact pure-B assay material is inferred.
  snapshot_sha256: d38577e99dd59a482068e381ac25c79442631ae7007de4c02995c24ff4abd29e
- evidence_id: rrsB
  kind: primary_source
  reference: PMID:11502507; DOI:10.1128/AAC.45.9.2414-2419.2001
  locator: 476-PMC90670.html; original methods, Tables2–4 and results
  accessed_at: '2026-10-21T17:03:01Z'
  support: supports
  summary: The methods specify a neomycin B/C mixture, while a later table calls the
    material neomycin B. U1406A does not confer neomycin resistance, whereas A1408G
    has a positive resistance phenotype in the specified E. coli ribosomal backgrounds.
    A generic mutation-bearing rrsB database edge is therefore not disproved by the
    negative U1406A result; mutation and material boundaries prevent pure-B quantitative
    transfer.
  snapshot_sha256: aad1c9d5055754a8521dba28d0a400a10334ee286fcec77dec54d2ddc1e1deba
- evidence_id: aph
