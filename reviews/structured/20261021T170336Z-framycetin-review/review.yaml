  kind: database
  reference: ChEMBL:CHEMBL3989751; ChEMBL:CHEMBL184618; ARO:0000005
  locator: 476-chembl.json; 476-chembl184618.json; 476-chebi7507.json; 476-aro-blocks.json
  accessed_at: '2026-10-21T17:03:01Z'
