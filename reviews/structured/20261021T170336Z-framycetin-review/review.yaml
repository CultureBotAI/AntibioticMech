limitations:
- Of 39 adopted/current ARO leads, 36 supplied abstracts were read and three supplied
  no abstract; the latter remain metadata-only. Four selected resistance originals
  and the separate exact-target/glycoside originals received additional section/table
  inspection, not an assertion that every cited paper was read in full.
- Most original resistance experiments call their drug neomycin/fradiomycin without
  a verified exact B/free-base reagent; one explicitly uses a B/C mixture. Mutation,
  host, medium and induction boundaries remain unresolved for quantitative exact-parent
  adoption.
- The 2000 AcrD study does not itself support every component of the AcrAD-TolC exact-B
  transport claim. Later complete primary coverage was not exhausted; no universal
  absence or blanket database-edge invalidation is concluded.
- ChEMBL3989751 supplies no graph; its exact equivalence is unresolved despite a verified
  separate CHEMBL184618 candidate. ARO0000005 combines generic-neomycin and exact-B
  identifiers.
- MetaCyc returned login content, LINCS returned500, VSDB DNS resolution failed and
  DrugBank returned403; Reaxys was not independently inspected. The limited HMS archive
  does not resolve global LINCS identity.
- The official Soframycin page and linked CMI were readable in the browser, but local
  page/PDF downloads timed out. No successful local PDF snapshot is claimed. Other
  potentially product-associated native aliases lack an independently resolved exact
  product definition.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native schema/strict and ledger used batch048; standalone chemistry used the batch019
  interpreter against batch048.
- No native/source bytes, scientific status or previous review bundle was altered.
  Source access failures and restricted primary read depth remain explicit.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
