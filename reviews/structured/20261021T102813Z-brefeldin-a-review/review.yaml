  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: The original fermentation paper describes production of7(S)-brefeldin A
    by Eupenicillium brefeldianum ATCC58665. It supports the source-definition producer
    context at abstract depth; no raw fermentation/strain archive was independently
