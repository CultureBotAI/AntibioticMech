- evidence_id: chemistry
  kind: validation
  reference: CHEBI:48080;PubChem:5287620;ChEMBL:CHEMBL19980;PDB-CCD:AFB
  locator: 168-chemistry.py;168-chemistry.json;downloaded database artifacts
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: Native SMILES/InChI, C16H24O4, neutral charge, masses and mints agree.
    Five stereocenters and two E double bonds match all three independent external
    structure representations, full key KQNZDYYTLMIZCT-KQPMLPITSA-N. Current ChEBI
    definition, nonobsolete term and parent agree. PDB1RE0 entity5 is AFB, not the
    unrelated guessed ligand code BFA.
  snapshot_sha256: 77da00b86d49d4d3307b89afcbb3d6d3053f9993c05f92888bff088ecd82ad6b
- evidence_id: classification-owner
  kind: record_content
  reference: conf/sources.yaml;scripts/seed_from_sources.py
  locator: classify function;aro_definition_overrides;data/raw/aro_antibiotics.tsv
  accessed_at: '2026-10-21T10:18:18Z'
  support: partial
  summary: ARO3009176 explicitly describes antifungal functionality. Generic ChEBI
    role33281 supplies no narrower group, and no compound override exists in the inspected
    configuration. Executing classify reproduces ANTIBACTERIAL through the blanket
    ARO fallback. Ignored-inclusive conf/curation search found only the PHI scope
    overlay and review-queue entry for this identifier, not a classification adjudication.
- evidence_id: early-antifungal
  kind: primary_source
  reference: PMID:13967812
  locator: DOI:10.1007/BF02928123;168-cyanein.html;publisher English summary
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: The original cyanein study reports Candida and other fungal activity and
    inactivity against the bacteria/protozoa tested. It supports an antifungal scope
    for the adopted exact synonym, not universal absence of bacterial activity. Full
    subscription article was not retrieved.
  snapshot_sha256: d7b228f89a832aa8214a27553a458c3bbeeeea56c461a9bdfcd3e14ab67a3cc0
- evidence_id: seafoam
  kind: primary_source
  reference: PMID:25379337
  locator: DOI:10.1080/21501203.2014.931893;168-seafoam.xml;Methods,relevant Results,Tables2/3
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: Purified B2 was identified as brefeldin A by HRMS,NMR and optical-rotation
    comparison, separately from the other extract compounds. Table3 reports C. albicans
    ATCC14035 MIC128 and IC50 20 micrograms/mL; Table2 has both endpoints >128 for
    five specified bacterial strains. Assays were triplicate microbroth,22h at37C.
    Findings support bounded fungal classification and do not transfer mixed-extract
    antibacterial effects or establish clinical efficacy.
  snapshot_sha256: 5198001b128ec580e452d17878902f89119ddc964b58293f8ff2bee4176936a1
- evidence_id: phibase
  kind: validation
  reference: PHIG:8769;PHIPO:0000584;UniProtKB:Q5A4G2
  locator: 168-phibase_amr.json;curation/phibase_grounding_reviews.json;scripts/phibase_grounding_reviews.py;168-uniprot.json;168-phenotype.json
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: Exact compound row hash f455b9799cdbedfd22ced7747738e9311638fbcc3223672cda7c65e3fc14caa3
    and current overlay hash match native provenance. Q5A4G2 entry131/sequence1 maps
    reference SC5314 taxon237561 and C3_05920W_A-T to MRR1. Phenotype term resolves
    with the correct label. Native withholds structured protein/strain-taxonomy identifiers
    and explicitly distinguishes the reference locus from unresolved experimental
    derivative.
  snapshot_sha256: 77da00b86d49d4d3307b89afcbb3d6d3053f9993c05f92888bff088ecd82ad6b
- evidence_id: resistance
  kind: primary_source
  reference: PMID:23629718
  locator: DOI:10.1128/AAC.00555-13;168-core.json;168-resistance-web-source.json;original
    Results/Table4/Figure3 caption passages
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: Original results support increased brefeldin-A resistance in C. albicans
    strains carrying hyperactive MRR1 V877F alleles. JEY355 supplied the allele; JEY429/JEY431
    were distinct transformants with different allele dosage. Figure3 used YPD spot-dilution
    assays,35C,24/48h; fluconazole MICs and cyclosporine experiments are separate.
    The native note correctly avoids assigning a unique derivative or direct biochemical
    mechanism.
  snapshot_sha256: 9676608cce0614fc93315ec4ba74e9510e18b56025416ec8e3dd2787085ea6b6
- evidence_id: mechanism
  kind: primary_source
  reference: PMID:14690595;PDB:1RE0
  locator: DOI:10.1016/S1097-2765(03)00475-1;168-extra-core.json complete abstract;168-pdb.json;168-pdb-entity5.json
  accessed_at: '2026-10-21T10:18:18Z'
  support: supports
  summary: Original structure paper places brefeldin A at the ARF1-GDP/Sec7 interface,
    trapping an exchange intermediate. The2.4-angstrom deposition contains the exact
    AFB ligand. This is a route to optional mechanism enrichment; it is not evidence
    for bacterial50S inhibition, and no such claim is asserted natively.
  snapshot_sha256: a0811fc753feea576b8f2ffee58c73ff8f803d39f03f64d67ad2fda7b935a6c6
- evidence_id: producer
