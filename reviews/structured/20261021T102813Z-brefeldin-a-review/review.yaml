limitations:
- The2013 resistance paper was read through its full abstract and publisher-indexed
  original Methods/Results/Table4 and Figure3-caption passages; not a complete downloaded
  PDF or visually remeasured figure. EPMC XML returned500, PMC rendering was challenged,
  local ASM retrieval403 and BioC429. The retained source qualification remains appropriate.
- The1962 cyanein and1958 decumbin studies were available as publisher summaries,
  not full subscription articles. The1995 fermentation and2003 structure papers were
  inspected at complete-abstract depth with the latter independently checked against
  PDB deposition.
- The2014 activity paper was inspected in its downloaded main XML at Methods, relevant
  compound-identification/Results and Tables2/3. Supplements and raw spectra were
  not reanalyzed; RKDO795 was only probably Edenia, and no exact species-level producer
  assignment is proposed.
- This bounded review does not establish universal bacterial inactivity. Classification
  adjudication follows compound-specific fungal evidence rather than an exhaustive
  survey of every organism or assay condition.
- Licensed Beilstein/Reaxys and authoritative CAS registry records were not independently
  accessed. Public/adopted identifiers and exact-graph mappings support identity without
  a licensed registry audit.
- Focused gate passes do not establish full-corpus success. The initial adapter request
  failed from network resolution; the authorized retry succeeded and showed no applicable
  Candida dataset.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All 17 repository input hashes and the external ARO cache remain unchanged. Native
  data and maintained sources were not edited.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
