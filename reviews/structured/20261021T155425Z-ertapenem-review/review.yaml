limitations:
- The nineteen citation metadata records and their available original abstracts were
  inspected, plus the exact VIM-63 original abstract. Full experimental sections were
  inspected for NDM-5, CTX-M-27/CMY-2 expression, VCC-1, OmpK35, KpnGH and the combination
  study only within the stated relevant scopes; not every figure, clinical endpoint
  or supplementary dataset was reanalyzed.
- NDM-1 and VIM-63 full experimental sections remained inaccessible after browser
  challenges and alternative failures. FRI-11 publisher access returned a client challenge;
  its original abstract lacks exact ertapenem numerical assay detail. The older ertapenem
  review has no indexed abstract and was not obtained. No unavailable full text is
  described as read.
- The original 2021 Table S1 cells and KpnGH Figure 3 were inspected. Phenotypic MIC
  or inhibition-zone changes do not by themselves supply purified hydrolysis rates
  or direct ertapenem efflux measurements. The primary porin result concerns gene
  loss in one subspecies/strain, not normal porin expression as a universal resistance
  determinant.
- The two patents were checked for exact named-compound relevance, Example 4/12 material
  boundaries and the US acid/salt claims. Every patent drawing, preparation and analytical
  trace was not independently reanalyzed; no patent-wide activity is transferred to
  the neutral compound.
- The Beilstein9025520 mapping remains unverified after Reaxys 403. Current authority/version
  agreement and database assertions do not constitute primary biological evidence.
  Optional future target enrichment requires an inspected exact ertapenem binding
  experiment.
- The four CDC observations are source-specific modal MICs with normal assay variability.
  Concentration units reconcile, but no unreported salt/potency basis, clinical outcome
  or resistance genotype is inferred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native or maintained source was edited. Original captures were preserved; every
  expanded input hash is checked unchanged. Optional links, tags and notes refer to
  ertapenem.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
