findings:
- finding_id: F1
  issue_key: lucensimycin-e-cysteine-configuration-conflict
  category: identity
  severity: blocker
  status: open
  certainty: provisional
  title: The encoded D-cysteine fragment conflicts with the original L assignment
  description: The native graph, its 2S side-chain systematic alias and current ChEBI
    encode an N-acetyl-D-cysteine-derived fragment, demonstrated by parity-preserving
