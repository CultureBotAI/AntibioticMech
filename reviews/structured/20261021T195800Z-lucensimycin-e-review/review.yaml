- evidence_id: cysteine
  kind: validation
  reference: Official N-acetyl-L-cysteine CID 12035 and N-acetyl-D-cysteine CID 94364
  locator: 609-N-acetyl-L-cysteine.json,609-N-acetyl-D-cysteine.json;609-identity-resolution.json;609-cysteine-comparison.png
  accessed_at: '2026-10-21T19:57:41Z'
  support: refutes
  summary: Removing only the native sulfur-to-core bond and restoring a thiol hydrogen
    preserves alpha-carbon parity. The isolated fragment matches D-cysteine derivative
    key PWKSKIMOESPYIA-SCSAIBSYSA-N and fails the L comparison. Native SMILES atom
    34, corresponding to InChI atom index 23, is S. A diagnostic single-center inversion
    gives PTLQDKFYOYMVQN-GFWXOAIMSA-N; that conditional candidate is not a validated
    replacement for the whole natural product.
  snapshot_sha256: 6c020992ec9168880b4ccb0dbd240c1f07a0d3e15c6710a2e496121df397dc4b
- evidence_id: primary
