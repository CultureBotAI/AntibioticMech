  support: supports
  summary: Seven encodings retain full key PTLQDKFYOYMVQN-CECFYEBASA-N, formula C34H41NO12S
    and neutral charge. InChI imports the acetamide as N=C(C)O, causing raw reciprocal
    graph mismatch. Canonical tautomer comparison with tetrahedral and bond-stereo
    removal disabled yields reciprocal chirality-aware matches for all seven. This
    is a resolved representation boundary, not a ring-stereochemistry finding.
