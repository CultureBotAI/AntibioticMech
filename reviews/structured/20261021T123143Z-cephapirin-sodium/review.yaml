    binding observations, keeping database annotations separate.
limitations:
- DrugBank direct access returned 403; proprietary Beilstein content was not independently
  inspected.
- The exact methicillin-resistant exclusion in the historical definition remains unverified
  by the inspected original panels. The 1975/1978 beta-lactamase-context papers were
  assessed at abstract depth.
- Patent text was inspected through public full descriptions/examples; no structure
  image or OCR-derived numerical endpoint was promoted.
- The 1979 PBP paper does not explicitly specify salt/hydration; the 1972 study does
  not fully restate incubation conditions from cited susceptibility methods.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
