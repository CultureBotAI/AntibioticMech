  accessed_at: '2026-10-21T12:23:55.727115Z'
  support: partial
  summary: The source explicitly studies cephapirin sodium. Nutrient Broth dilution
    determines MIC and MBC; MBC requires fewer than three colonies from approximately
    0.005 mL subculture. Nutrient Agar/Steers and 30-microgram discs are separate
    assays. At low inoculum, 7.5 microgram/mL or less inhibited and killed all 30
    E. coli and 30 P. mirabilis isolates and over 80% of 30 Klebsiella isolates; higher
    inoculum reduced activity. Penicillin-resistant staphylococci are not equated
    to methicillin-resistant strains. The 77-patient clinical series lacked a comparator
    and cannot establish comparative efficacy. All original scan pages and figures
    were visually inspected.
