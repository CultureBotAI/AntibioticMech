- evidence_id: primary1979
  kind: primary_source
  reference: PMID:106774
  locator: DOI10.1128/AAC.15.2.204; original pp204-208, all five scan pages and Figures
    1-4/Table 1
  accessed_at: '2026-10-21T12:23:55.727557Z'
  support: partial
  summary: Bristol cephapirin and [14C]cephapirin were tested with growing Bacillus
    subtilis Marburg. Cell binding saturated near 0.1 microgram/mL and correlated
    with killing after 30 min. Competition with [14C]benzylpenicillin implicated observed
    PBP bands I-III but not D-alanine carboxypeptidase band IV. The latter enzyme
    formation/release changed without demonstrated direct cephapirin binding or catalytic
    inhibition. Proposed membrane-formation effects remain interpretation. Material
    salt/hydration is not explicitly specified; do not assert exact sodium-solid binding
    measurements.
  snapshot_sha256: 9ced396bbeb9e7e713c4a1ab482ad0b64330989ed5f22b31fcb13c7d5d88f924
- evidence_id: definition-boundary
  kind: primary_source
  reference: PMID:1098870; PMID:649993
  locator: Complete original abstracts in271-primary-discovery.json
  accessed_at: '2026-10-21T12:23:13.640235Z'
  support: partial
  summary: The 1975 study reports lower beta-lactamase sensitivity than ampicillin
    under its experiments. The 1978 preliminary study reports delayed, pH-dependent
    inactivation by 8/13 penicillin-resistant S. aureus strains at high inoculum.
    Together these support bounded historical activity/stability context, not universal
    beta-lactamase immunity. Neither abstract verifies a complete contemporary methicillin-resistant
    strain panel.
  snapshot_sha256: 3f1f15ef55d8c46bd4549503319ad5b5130c5a08cb6cf393319f173d14360c49
