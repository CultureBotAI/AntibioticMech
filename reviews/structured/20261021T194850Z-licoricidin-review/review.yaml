    They explicitly revised 7-methoxy to 5-methoxy using methoxy carbon shift, long-range
    selective proton decoupling and triacetate NOEs. Figure 1 compound 1 has 7/2′/4′
    hydroxyls and both normal prenyl groups. The text explicitly assigns 3R from CD.
    This original directly supports native constitution and stereo while explaining
    the obsolete methoxy placement in older naming.
