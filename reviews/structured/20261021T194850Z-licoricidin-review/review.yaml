  issue_key: licoricidin-lipidmaps-wrong-constitutional-graph
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: The asserted LIPID MAPS accession denotes a different graph
  description: Native xrefs[2] asserts LMPK12080045 as exact chemical equivalence.
    Current SMILES and InChI instead encode 7-methoxy/5-hydroxy substitution, an aryl-adjacent
    E side-chain alkene and undefined C3, full key HWJXKLRHGKKFBY-SOFGYWHQSA-N. Native
    and primary-revised 3R licoricidin have 5-methoxy/7-hydroxy, normal prenyl side
    chains and key GBRZTUJCDFSIHM-KRWDZBQOSA-N. The historical 1968 proposal explains
    only the methoxy placement, not exact equivalence. Preserve the supported native
    graph and adjudicate the source link.
