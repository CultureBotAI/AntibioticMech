limitations:
- CAS Common Chemistry returned 401 and Reaxys403. Current ChEBI/KEGG support the
  registry associations, but registry structural content was not independently inspected.
- The 1988 five-page structural revision was fully read; actual Figure 1/Table 1 and
  NOE/CD page were inspected. The 1968 original was read only at its first-page historical
  proposal. Neither raw NMR nor ECD data were computationally reprocessed.
- The 2000 antibacterial original was read for exact isolation, compound 33, complete
  antibacterial/mechanistic Results and Methods, with actual Tables 1–2, Chart 2 and
  Figures 2–3 viewed. Unrelated new-compound elucidation was not exhaustively reassessed.
  Its growth-curve oxacillin dose differs between caption and prose.
- The adopted2002 H. pylori and 2010 macrophage mains, and 2011 secondary review main,
  were unavailable after recorded403 responses. Complete abstracts were read. The
  2010 host-cell original was read for exact isolation/spectral characterization and
  licoricidin-specific experiments, not every extract-comparator plot.
- The 2011 original main remained 403; its complete abstract and official SI structure/isolation
  sections were read, including actual FigureS1. Abstract growth-inhibition concentrations
  are not treated as complete MIC/strain observations.
- The 2021 full main XML and both tables were read, with figure captions; plots were
  not independently digitized and commercial reagent stereopurity was not verified.
  The 2015 G. iconica primary was read only at complete abstract/institutional abstract
  level and its 3S material was not merged with native 3R.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
