findings:
- finding_id: F1
  issue_key: dragmacidin-d-reduced-aminoimidazole-wrong-identity
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Correct the two-hydrogen reduction in the structure labelled dragmacidin
    D
  description: The record and current PubChem/ChEMBL encodings have a neutral C25H22BrN7O2
    graph with a tetrahedral C-H bonded singly to three nitrogens in the five-membered
    ring. Original synthesis SI pp22–23 instead identifies final D with an aminoimidazole
    system and [C25H20BrN7O2+H]+ HRMS, calculated 530.0940 and found 530.0943; the
    main paper reports agreement with natural D. The native core therefore differs
    by H2 and bond order. This is not a tautomer, choice of R/S assignment, or proton/counterion
    difference. Database agreement reproduces the shared problem rather than validating
    the natural-product identity.
  target_ids:
  - antibioticmech:aro-48bb80f5a5
