limitations:
- The 1992 discovery full text and 1998 phosphatase full text were unavailable through
  the inspected public publisher routes. The 1998 official abstract was read completely;
  later repeated MICs or phosphatase potencies are not treated as original assays
  inspected here.
- The full 2002 author paper was read. Its supporting information was inspected for
  final D synthesis, characterization and formula on printed pages 22–23, with the
  product drawing visually checked; complete intermediate spectra and final spectral
  overlays were not independently reprocessed.
- The 2015 S-assignment paper was read in full main-text form; the conflicting R-assignment
  paper was available at complete-abstract depth. Their disagreement and documented
  sample-dependent racemization remain unresolved. Unspecified stereochemistry alone
  is not proof of a mixture.
- The 2023 host-cell paper was read selectively for exact material, activity context,
  interpretation and relevant methods. Its spectra and complete experimental result
  tables were not independently reprocessed. Its mechanistic suggestions remain hypotheses,
  and its isolated trifluoroacetate material is distinct from the native neutral graph.
- The 2024 G/H source was available at complete-abstract depth. The 2017 G source
  was read in full main-text form. Neither is D-specific evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
