summary: The native graph faithfully reproduces PubChem and ChEMBL but has two excess
  hydrogens and a reduced aminoimidazole ring relative to the experimentally characterized
  dragmacidin D molecular core. This is a blocker independent of the unresolved absolute
  stereochemistry and isolated salt form. A separate major finding concerns the G-specific
  definition and biological panel copied to D. Schema, strict and independent representation
  checks pass; they do not establish the named natural-product identity.
