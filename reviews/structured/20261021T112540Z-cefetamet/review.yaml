- Reaxys 967151 remains authority-corroborated without independent registry contents.
- Both adopted PMID metadata/abstracts were inspected, but the 1989 publisher PDF
  route returned HTML rather than article content. The 2017 allergy lead is a review
  and was not treated as primary antibacterial evidence.
- Original 1985 and 1987 gonococcal papers were fully read, with 1985 structure and
  tables visually inspected. 1985 uses sodium reagent; 1987 does not fully resolve
  reagent counterion or referenced protocol details.
- No direct cefetamet-specific primary PBP binding experiment was established in this
  bounded review; native contains no such asserted primary mechanism.
