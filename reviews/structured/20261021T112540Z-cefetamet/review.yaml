summary: No confirmed native defect. Neutral cefetamet has coherent (6R,7R), Z-oxime
  structure, complete cross-reference matches and both source mints. Original studies
  support the definition’s Neisseria gonorrhoeae activity, while distinguishing the
  active compound from cefetamet pivoxil. The 1985 assay explicitly used cefetamet
  sodium; its numeric observations and enzyme stability require that material and
  assay scope, not unqualified neutral-acid transfer. Scientific assessment retains
  the stated evidence limits; full verification is blocked by the shared native-library
  failure.
