limitations:
- 'All 11 adopted leads were resolved: 9 indexed abstracts read and 2 metadata-only
  reviews. All 76 current discovery leads were resolved: 74 abstracts read and 2 metadata-only
  records. Complete or selected original reading is explicitly itemized; this is not
  a claim to have read every full original.'
- The 2010/2016 structural complexes use core-domain/engineered proteins and particular
  DNA preparations. Ligand structure does not establish the solid hydration state
  of every commercial reagent, and target preference is organism dependent.
- HMDB, Reaxys and DrugBank independent contents remain unavailable; CAS public routes
  exposed no registry entry. The limited HMS archive cannot establish a wrong LINCS
  mapping from absence.
- The WHO landing page resolves the cited catalogue, but the full variant sheets were
  not inspected. Attempted WHO PDF was HTML, and fresh PMC1346799/PMC2650546 pages
  were browser challenges. Failed retrievals are not counted as primary reading.
- All 191 UKMYC groups match adopted tables, but original public parquet and API returned
  403, and ignored-inclusive searches of /private/tmp and the primary repository did
  not locate that original parquet. Original WGS assignments were not independently
  rejoined.
- CDC susceptibility interpretations are retained exactly as source-specific calls;
  current source agreement does not independently rederive clinical breakpoints or
  establish a shared physical drug preparation.
- The current H. pylori rpoB-to-levofloxacin source edge remains unresolved at exact
  experimental scope. Native database qualifiers and the already qualified Salmonella
  ParE overlay are respected; no absence-based edge removal is proposed.
- The required shared full-QC gate has the established platform SciPy import failure.
  Focused checks and review-contract success do not substitute for the separately
  recorded shared corpus gates and failed full QC.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All 13 original inputs are preserved within 29 verified hashes. Native records,
  maintained sources and prior saved reviews remain unchanged by this review.
- Standalone chemistry used the 019 interpreter against 060; schema/strict, source
  ledger and draft contract used 060. The initial scratch-ledger diagnostic failure
  is preserved and was corrected only after checking the three natively bounded Panel
  1394 rows.
- CRyPTIC original-DST and membership checks were independently performed by the coordinating
  reviewer and are cited with exact script/report hashes. No native scientific status
  or curation history was changed.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
