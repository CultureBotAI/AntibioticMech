- evidence_id: activity1980
  kind: primary_source
  reference: PMID:6967296; DOI:10.1128/AAC.17.5.798; https://pmc.ncbi.nlm.nih.gov/articles/PMC283878/
  locator: Complete original five scanned pages 798–802, including Figure 1, all three
    tables, Methods, Results and Discussion, inspected visually.
  accessed_at: '2026-10-21T17:24:01Z'
  support: supports
  summary: The study explicitly distinguishes gentamicin B from 5-epigentamicin B
    and other aminoglycosides. Antibiotics were supplied through Peter Daniels at
    Schering; bulk counterion, hydration and purity were not specified. MIC testing
    used 2 mL nutrient broth at pH 7.2 with an inoculum of 10^4–10^5 organisms. Table
    1 gives gentamicin B MIC 0.5 microgram/mL for plasmid-free E.coli W677 and 16
    micrograms/mL for W677 carrying pML2 with APH(3-prime). The direct comparison
    establishes parent-B antibacterial activity and a bounded resistance phenotype,
    not a species-wide threshold or the identity of every modern APH subtype. MIC
    incubation duration is not supplied by the inspected MIC Methods and must not
    be borrowed from enzyme culture conditions.
  snapshot_sha256: 7c7b941d698289979955fe7a045309eba391606ab648b5060c65839bb12aa992
- evidence_id: enzymes1980
  kind: primary_source
  reference: PMID:6967296; DOI:10.1128/AAC.17.5.798
  locator: Complete original enzyme Methods, Tables 2–3, Figure 2 and Discussion,
    pages 798–802.
  accessed_at: '2026-10-21T17:24:01Z'
  support: supports
  summary: 'Partially purified modifying enzymes were tested with the parent and its
    5-epimer. Phosphate incorporation directly supports modification of gentamicin
    B by the study APH(3-prime), and Table 3 gives a gentamicin B Km of 1.3 micromolar
    for that preparation. Km is not a binding Kd. The paper emphasizes that modification
    capacity alone does not guarantee resistance: enzyme efficiency and substrate
    context matter. The pML2 enzyme was not independently mapped here to all native
    APH subtype accessions. This experiment is not a direct 16S rRNA binding measurement.'
  snapshot_sha256: 707aa17caf7319c475804b12090e6490e1b96b7d8f5ec40891dc00e483710406
- evidence_id: biosynthesis
  kind: primary_source
  reference: PMID:31720212; DOI:10.1016/j.mec.2019.e00096; https://pmc.ncbi.nlm.nih.gov/articles/PMC6838515/
  locator: Original introduction, strain/culture and HPLC-CAD Methods, regulator deletion/complementation
    and overexpression Results, and Discussion; figures and complete plasmid/primer
    tables not independently reprocessed.
  accessed_at: '2026-10-21T17:23:23Z'
  support: supports
  summary: The study documents gentamicin B production in Micromonospora echinospora
    CCTCC M2018898, industrial strain HS-1520-016-89, and manipulated derivatives.
    It distinguishes gentamicin B from its semisynthetic N-acyl derivative isepamicin.
    GenR/GenS deletion, complementation and overexpression affect production; these
    are biosynthesis/regulation experiments, not antibacterial target assays. The
    comparator called wild type in this experiment derives from an industrial UV-mutagenized
    strain. The main text establishes microbial production, but this review does not
    treat HPLC-CAD alone as a new full absolute-configuration determination or infer
    an antibacterial role for the pathway regulators.
  snapshot_sha256: 53a8017f64f7e47634509d3b1df6db4c4f5e7fe661519259410cdd2c64deae91
