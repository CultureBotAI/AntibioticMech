limitations:
- The entire native record and all exact maintained rows were inspected. The sole
  adopted PMID9872733 was read as a complete indexed abstract plus selected original
  review sections and Table 1, not a complete thirteen-page primary article. It is
  secondary evidence.
- The original 1980 gentamicin B study was read in full across all five scanned pages.
  Its bulk counterion, hydration and purity are unspecified, and it does not directly
  measure gentamicin B binding to 16S rRNA. The pML2 APH preparation was not mapped
  here to every modern native APH subtype.
- The 2019 microbial-production study was read in the specified Methods, Results and
  Discussion scope; raw analytical data, every plasmid/primer entry and figure image
  were not independently reprocessed. It does not newly resolve every absolute stereocentre
  of the assayed material.
- The 1976 original publisher abstract was successfully inspected through the browser
  reader, but direct HTML/PDF retrieval and subsequent reopening returned 403. The
  full synthesis paper was not read. The abstract provides positive semisynthetic-route
  evidence without supporting additional experimental detail.
- Selected RmtC and APH-IIc main-text experiments and current ARO primary abstracts
  use unspecified gentamicin or other substrates. No exhaustive primary validation
  of all thirteen exact-B resistance edges, direct 16S binding or clinical efficacy
  is claimed. The native record already qualifies its database evidence.
- The structured adapter yielded no applicable iModulon evidence; E.coli precise1k
  searches cannot establish absence of acquired resistance genes across taxa. No claim
  is made from irrelevant aph substring hits.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
