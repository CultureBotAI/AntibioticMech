  support: context_only
  summary: Wright and Thompson is a secondary review, not primary exact-compound evidence.
    Table 1 explicitly includes gentamicin B in the substrate/resistance profiles
    of APH types I, II, III, VI and VII. This supports family-level phosphotransferase
