  issue_key: gentamicin-b-natural-production-and-semisynthetic-route-context
  category: nomenclature
  severity: informational
  status: open
  certainty: confirmed
  title: Distinguish natural production from a semisynthetic preparation if expanding
    the definition
  description: 'The native definition describes gentamicin B as semisynthetic. The
    inspected microbial-production study and the 1976 synthesis abstract establish
    two compatible preparation contexts: production by M.echinospora and synthesis
    from protected garamine. Natural production does not refute the published semisynthetic
    route. An optional fuller definition could mention both, without confusing parent
    B with its N-acyl derivative isepamicin. This observation does not require a corrective
    edit.'
