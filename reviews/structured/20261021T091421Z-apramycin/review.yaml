- finding_id: F1
  issue_key: apramycin-chembl1909452-underspecified-ring-junction-stereochemistry
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Imported ChEMBL entry is stereochemically broader than the native compound
  description: CHEMBL1909452 leaves two ring-junction stereocentres unassigned. It
    therefore cannot serve as an exact chemical equivalent of fully specified CHEBI:2790.
    The native structure is correct, and no opposite configuration is demonstrated.
    Official CHEMBL1230961 independently matches the full native key and is a concrete
    replacement candidate for source-owner review.
