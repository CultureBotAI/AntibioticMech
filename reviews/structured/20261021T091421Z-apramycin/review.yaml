    by MALDI-ToF MS. The paper explicitly does not determine the precise atomic methylation
    site for KamB; N1 assignment is contextualized by the related KamA result. Do
    not present this experiment alone as a direct atomic-site determination. Source-organism
    naming is historical and differs from the heterologous test host.
  snapshot_sha256: 36f9c6bc10ce98c41d1e946ccc420119e4f770cb100d409d7ab1e7ea43c06d21
- evidence_id: primary-aac
  kind: primary_source
  reference: DOI:10.3390/ijms21176133
  locator: PMID 32854436; 103-PMC7504452.xml, Results and Methods; supplementary tables
    not independently reviewed.
  accessed_at: '2026-10-21T09:13:49Z'
  support: supports
  summary: Clinical E. coli isolates and recombinant strains support AAC(3)-IV-associated
    apramycin resistance by broth microdilution. Table 1 reports 4 micrograms/mL for
    ATCC 25922, 256–512 for AG173 and greater than 512 for AG380/AG381; recombinant
    expression effects depend on promoter strength. Incubation is 35 plus or minus
    2 C for 16–20 h. The paper analyzes deposited apo and substrate-complex structures,
    including apramycin complex 6MN4; these are resistance-protein substrate interactions.
    Genomic prevalence in the sampled database is not a universal clinical prevalence
    or proof that every annotated isolate is phenotypically resistant.
