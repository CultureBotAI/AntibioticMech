limitations:
- No native record was edited during research. All 19 captured maintained input hashes
  are unchanged.
- Four older adopted MED records provide bibliographic metadata but no abstract; their
  ACS/OUP DOI routes did not yield free full text. Two adopted review records also
  lack abstracts in the inspected result. No unavailable article is treated as read.
- The 2012 ribosome paper was read through its initial Results and tables in a successful
  PMC web response, with its full abstract independently available. Remaining methods/discussion
  and raw crystal data were not reviewed after later challenge/error responses. Local
  103-2012-pmc.html is a challenge page, not a paper.
- Results, Discussion and Methods of the 2021 ApmA and 2009 KamB papers were read,
  as were Results/Methods of the 2020 AAC study and Results/Discussion/Methods of
  the 2021 live-cell study. Supplementary spectra, raw coordinates, movies and sequencing
  data were not independently reanalyzed.
- The 2005 AAC kinetic study is abstract-only. Other attached resistance references
  are abstract-level unless their full text is identified above. No detailed substrate
  kinetics or assay formulation is inferred from abstracts.
- DrugBank retrieval was denied and Reaxys was not independently inspected; CAS is
  cross-corroborated, not registry-direct. Patent document identity was inspected,
  but exact factor-specific experiments and the complete patent were not.
- The native ChEMBL mismatch concerns unspecified stereochemistry, not evidence for
  an opposite isomer. CHEMBL1230961 is an independently matched candidate requiring
  a maintained-source correction, not a native edit performed here.
- Structured expression-database misses are bounded by their reference strains and
  inventory. They do not establish biological absence of mobile resistance genes.
  No exhaustive resistance census or producer review is claimed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
