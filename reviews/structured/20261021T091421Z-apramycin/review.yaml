- evidence_id: primary-target
  kind: primary_source
  reference: DOI:10.1073/pnas.1204073109
  locator: PMID 22699498, PMC3390888; complete abstract and initial main-text Introduction/Results,
    Tables 1–3 and structural-result text inspected in the PMC web response.
  accessed_at: '2026-10-21T09:13:49Z'
  support: partial
  summary: The original study directly observes apramycin in the decoding A-site of
    Thermus thermophilus 30S crystals and measures translation inhibition with bacterial
    and hybrid ribosomes. A1408 and G1491 perturbations change susceptibility, supporting
    the native 16S rRNA target. Translation-inhibition IC50, microbial MIC and dissociation
    constants are distinct endpoints. The reported weak miscoding in these assays
    should not become a universal claim that apramycin never induces errors. Later
    attempts to read remaining main text and methods encountered a PMC challenge,
    Europe PMC XML error and publisher cookie page.
  snapshot_sha256: b065d455c04753cc2e85d5d771c9833a27a2c1bc3dc36959e27dabfee80dbce9
- evidence_id: primary-livecell
  kind: primary_source
  reference: DOI:10.1073/pnas.2013315118
  locator: PMID 33619089; 103-PMC7936356.xml, complete Results, Discussion and Methods.
  accessed_at: '2026-10-21T09:13:49Z'
  support: supports
  summary: Live E. coli DH5alpha exposed to named Sigma apramycin at 10 or 100 micrograms/mL
    shows longer ribosome-associated tRNA dwell times and slower ongoing translation.
    The method uses fluorescent tRNA tracking with a hidden Markov model, not transcriptomics.
    Growth and microfluidic experiments are distinct from the translation measurements.
    Erroneous/truncated products and aggregate identity are proposed interpretations;
    the assay does not directly establish every miscoding or cell-killing step. Supplier
    purity is at least 97%, but the exact salt/product code is not supplied in these
    methods.
