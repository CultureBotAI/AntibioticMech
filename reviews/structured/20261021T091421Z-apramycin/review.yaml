    as measured and qualify misreading, aggregate formation and killing steps according
    to their exact experiments. The live-cell tRNA study is not a transcriptomic dataset.
  - Keep named parent, unknown commercial salt form and explicitly identified sulfate
    products distinct. Add no human indication, current approval, producer or biosynthetic
    pathway from drug labels, resistance-gene origin or broad class text.
