findings:
- finding_id: F1
  issue_key: enrofloxacin-soxs-target-alteration-misclassification
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: SoxS-mediated resistance is regulatory efflux, not antibiotic-target alteration
  description: The native mechanism_type for ARO3003511 says ANTIBIOTIC_TARGET_ALTERATION.
    Current ARO and the original A12S reconstruction abstract describe increased acrB/soxS
    expression with increased enrofloxacin MIC, supporting regulation of efflux. Correct
    the mechanism classification while retaining the supported resistance association
    and the exact experimental reading-depth limit. Do not infer that SoxS binds enrofloxacin
    or is its antibacterial target.
  target_ids:
