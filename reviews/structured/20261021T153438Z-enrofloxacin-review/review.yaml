summary: The exact neutral enrofloxacin graph, antibacterial filing and veterinary-use
  context are supported. The imported SoxS mutation is classified as antibiotic-target
  alteration, although the original reconstruction study and current ontology describe
  regulatory efflux changes. Baytril is a product brand rather than a chemical exact
  synonym. The Erysipelothrix gyrA assertion retains its database/strain-association
  boundary, and inaccessible legacy identifiers remain explicitly unresolved.
