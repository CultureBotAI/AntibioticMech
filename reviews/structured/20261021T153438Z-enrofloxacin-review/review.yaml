limitations:
- DrugCentral1017 card and molfile routes returned 404; LINCS LSM-3709 returned 500,
  HMDB0029861 and Reaxys5307824 returned 403. Their exact current mappings remain
  unverified, not disproved by transport failure.
- All six adopted definition/bibliography leads were resolved and their original abstracts
  read. Full texts were not verified for those analytical, ecological, clinical and
  physicochemical leads; no uninspected exact-reagent or comparator result is adopted.
- The SoxS original structured abstract was inspected in full, but original full OUP
  HTML and the exact PDF link returned 403. The finding is restricted to the explicit
  allele reconstruction, expression and qualitative MIC direction reported in that
  abstract.
- The 2023 Erysipelothrix original was inspected for relevant Methods, antibacterial
  Tables 1–3, gyrA Results and limitations. Unrelated SpaA/virulence figures were
  not used or independently reviewed. The paper has a Results-unit discrepancy and
  unspecified catalog/salt form; its historical CLSI VET06 edition is not assumed
  to be current guidance.
- No standalone antibacterial potency is transferred from mixed-formulation patents,
  enrofloxacin hydroiodide, antibody binding or environmental conversion to ciprofloxacin.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native, source, status or history field was edited. Original thirteen input hashes
  were retained and all expanded inputs were checked unchanged before output. Optional
  links, tags and notes were checked against this exact compound.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
