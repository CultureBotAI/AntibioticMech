  accessed_at: '2026-10-21T09:49:53Z'
  support: partial
  summary: For95%-pure baicalin in PAO1, broth MIC and MBC are both >1024 micrograms/mL;
    growth slows at512 or more, while sub-MIC concentrations up to256 do not significantly
    alter growth in the reported comparison. Sub-MIC qPCR changes in las/rhl/pqs genes
    and biofilm effects are response observations, not direct binding to those regulators.
