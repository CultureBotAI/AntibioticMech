limitations:
- The cited 2018 activity main article was read in full, including every table and
  its sole figure. The companion PBP3 main was inspected at the selected sections
  stated above, not all resistance table rows; its detailed kinetic supplement returned
  an HTML preparation page, and the publisher supplement route returned 403. No missing
  supplement method is invented.
- The 2020 synthesis main article was available only as a complete indexed abstract.
  The official 20-page supplement was inspected through its contents and the exact
  LYS228 Figure S11 at printed S15/physical page 16; spectra and intermediate pages
  were not exhaustively reassigned. The original 2018 discovery article was read only
  as a complete indexed abstract; full-text routes failed.
- The native linked PubChem record remains internally inconsistent between its E graph
  and Z deposited name/key strings. The identity finding rests on original figures
  plus independently parsed official structures, not a vendor or depositor synonym
  alone. The neutral molecular drawing does not establish the exact bulk salt, hydration
  state or purity of every experimental preparation.
- Initial public fetch attempts included a mistaken CARD numeric page that resolved
  to Massilia and empty ACS landing responses; these were excluded from evidence.
  The official ARO OBO terms and the correctly resolved ACS Figshare API/supplement
  were inspected instead. Europe PMC XML endpoints returned 500; complete PMC HTML
  succeeded for the three 2018 papers.
- An exploratory authority helper initially exited 1 only after successful chemical
  comparisons when printing a missing top-level names field from the abbreviated NCATS
  response. The actual error was retained, the full record was retrieved, and the
  corrected comparison exited 0. All required focused native validators and the standalone
  native chemistry check exited 0.
- The bounded literature query returned 39 titles, including irrelevant protein-residue
  matches. It is not an exhaustive literature census or proof that the E isomer is
  inactive. No present native clinical, producer or resistance assertion was inferred
  from optional discovery leads.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
