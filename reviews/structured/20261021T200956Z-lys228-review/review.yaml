findings:
- finding_id: F1
  issue_key: lys228-oxime-e-versus-z-identity
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the inherited E-oxime substitution for Z-LYS228
  description: Native SMILES and Standard InChI encode the oxime as E, with key FWTGYTRQUBRVDW-UWGJAOEXSA-N.
    The cited 2018 activity Figure 1, companion PBP3 Figure 1 and 2020 synthesis Figure
    S11 depict Z; independent NCATS GSRS, KEGG and PubChem 118379834 encodings corroborate
    key FWTGYTRQUBRVDW-NRABZWKMSA-N. Inverting only this oxime bond reproduces the
    complete corroborating key while retaining both 3S,4R centres. The imported ARO
    link to PubChem 118380292 drives the wrong stereoisomer into the exact structure.
    Correct the maintained association and regenerate the entire mutually consistent
    structure block after independent bond review. Do not replace it with a hydrate
    or infer that the E isomer lacks antibacterial activity.
  target_ids:
  - antibioticmech:aro-00a588048a
