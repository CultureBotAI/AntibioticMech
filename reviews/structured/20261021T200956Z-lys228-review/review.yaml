- evidence_id: mapping
  kind: validation
  reference: /private/tmp/am-review-session/616-compare.py; /private/tmp/am-review-session/616-authority-chemistry.json;
    /private/tmp/am-review-session/616-Z-authority-chemistry.json; /private/tmp/am-review-session/616-oxime-diagnostic.json
  locator: Independent parsing and specific bond comparison; diagnostic rendering
    in 616-oxime-comparison.png.
  accessed_at: '2026-10-21T20:06:44Z'
  support: supports
  summary: Native SMILES atom 7=N and atom 8=C define the oxime; its CIP reference
    atoms are O6 and carbonyl C15, and RDKit assigns E. Native Standard InChI encodes
    this as /b20-9+. The original drawings put N-O and the adjacent amide-carbonyl
    substituent on the same side, corresponding to Z. A scratch inversion of only
    that double bond changes the key to NRABZWKMSA and /b20-9-, preserving constitution
    and both tetrahedral configurations. Independently parsed official Z encodings
    corroborate the complete structure. The InChI reader can choose an amide/imidic-acid
    tautomer, but that does not explain or erase the opposite oxime stereolayer.
  snapshot_sha256: b1374b6bd0dc7608f1f8e3077416cb55ce68ceef912505067645c995d3b33f47
- evidence_id: activity2018
  kind: primary_source
  reference: PMID:30038040; DOI:10.1128/AAC.00552-18; https://pmc.ncbi.nlm.nih.gov/articles/PMC6153794/
  locator: Complete main abstract, Introduction, Results/Discussion, Tables 1-5 and
    Methods read; Figure 1 separately viewed.
  accessed_at: '2026-10-21T20:02:29Z'
  support: supports
  summary: Novartis-synthesized LYS228 was tested by CLSI broth microdilution against
    271 clinical isolates. MIC90 values were 1 microgram/mL overall, 1 for 37 ESBL
    producers and 4 for 77 carbapenem-resistant isolates. These are panel summaries,
    not species-wide MICs or clinical breakpoints. The main reports VEB-1-associated
    and PBP3-insertion high-MIC exceptions; Table 2 explicitly lacks LYS228 susceptibility
    breakpoints. Time-kill assays used CAMHB and 10^6 CFU/mL at 35 C. MBC/MIC and
    killing endpoints remain distinct from MIC. The study supports the bounded majority-of-tested-strains
    wording for its named material, whose bulk salt/purity is not specified.
  snapshot_sha256: 33bc714e276bf7e81cf7764514c4571be61a749145eb6bca14915613871f98af
- evidence_id: activity-figure
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC6153794/figure/F1/
  locator: Original 2018 Figure 1, downloaded from the PMC image link and visually
    inspected.
  accessed_at: '2026-10-21T20:02:57Z'
  support: refutes
  summary: The chemical drawing labeled LYS228 shows the Z oxime and cis substituted
    beta-lactam ring consistent with 3S,4R. The N-O substituent and adjacent amide
    carbonyl are on the same side of C=N. This positively contradicts the stored E
    geometry; it is not merely a missing stereochemical assignment.
  snapshot_sha256: 0d4b32b162809610977ada3b83c5edd073ea113915ac403afca575450d9d19ac
- evidence_id: moa2018
  kind: primary_source
  reference: PMID:30061293; DOI:10.1128/AAC.01200-18; https://pmc.ncbi.nlm.nih.gov/articles/PMC6153799/
  locator: Abstract/Introduction, PBP3 Results, Table 1, strain table, selected resistance
    results/conclusion and complete main Methods read; Figures 1-3 visually inspected.
    Supplement detailed kinetics unavailable.
  accessed_at: '2026-10-21T20:02:29Z'
  support: supports
  summary: The independent Figure 1 again depicts Z-LYS228. Crude E. coli NB27001
    membranes show BOCILLIN competition preferentially at PBP3; microscopy shows filamentation
    with segregated DNA after 2 h at 0.5 microgram/mL. Purified truncated E. coli
    PBP3 stopped-flow experiments report k2 162.4/s, Kd 441.9 micromolar and k2/Kd
    367504 per M per s; these are distinct quantities, not a MIC or one interchangeable
    affinity number. The paper supports PBP3-mediated cell-division inhibition for
    named LYS228, while describing exceptions involving VEB/PER, OXA-181 and DHA-1.
    No target or resistance object is presently asserted in the native record.
  snapshot_sha256: 13656864ed1444403aa9643c6613cb35cba075e41010611ab0a1c0a4c8b4aaf9
- evidence_id: dha2018
  kind: primary_source
  reference: PMID:30061296; DOI:10.1128/AAC.01202-18; https://pmc.ncbi.nlm.nih.gov/articles/PMC6153798/
  locator: Complete main text, Table 1 and Figure 1 caption read. The plotted image
    itself was not independently examined.
  accessed_at: '2026-10-21T20:02:29Z'
  support: partial
  summary: Among 23 blaDHA-1-bearing K. pneumoniae isolates, 9 had LYS228 MIC at least
    8 microgram/mL. Selected mpl/ampD mutants and increased blaDHA-1 expression support
    a context-dependent resistance route; avibactam restores activity in tested comparisons.
    The authors leave the detailed Mpl-to-expression mechanism unresolved. This is
    not proof that LYS228 is universally stable to all serine beta-lactamases, nor
    does it negate the native bounded majority-of-strains claim.
  snapshot_sha256: d44428c157b1dbaee4d7016c2bb8efe8470870630d279a8bb262f2c47c197625
