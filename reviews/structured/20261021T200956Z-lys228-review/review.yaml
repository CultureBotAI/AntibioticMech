summary: The complete ARO/PubChem seed is reproducible and passes focused schema,
  strict and chemistry checks. Its native SMILES and InChI nevertheless encode the
  E oxime, whereas both original 2018 LYS228 figures, the 2020 synthesis supplement
  and independently parsed official NCATS/KEGG structures specify Z. One blocker covers
  this source mapping and exact-structure conflict. The named compound has primary
  antibacterial and PBP3 evidence, with explicit strain and beta-lactamase limitations;
  those results do not validate the native E isomer.
