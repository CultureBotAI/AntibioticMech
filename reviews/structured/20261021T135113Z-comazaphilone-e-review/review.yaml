    lead
  accessed_at: '2026-10-21T13:42:37.443760Z'
  support: context_only
  summary: The 2025 study combines three new talavaritones with seven known compounds;
    the accessible preview maps E to known compound 7. Its complete abstract does
    not establish an exact-E absolute reassignment or justify transferring individual
    experiments from the new compounds. The 2020 comazaphilone G/H paper concerns
    host macrophage nitric-oxide inhibition, but the inspected abstract does not establish
