limitations:
- Original 2011 full main text and assay table remain unavailable; its complete abstract
  and official SI were inspected. Numeric antibacterial MICs and SW1990 cytotoxic
  values from secondary summaries were not adopted.
- The 2020/2025 main articles and supplements were not obtained. Their complete original
  abstracts were read, but no exact E absolute reassignment was verified. The later
  2026 full main text and supplementary contents/labels were inspected; its new ECD/DP4
  analysis concerns compound 1. Bounded search does not establish global absence of
  later absolute evidence.
- The 2026 A375 assay measures protection from induced host-cell death; it is not
  an antibacterial MIC, direct binding assay or evidence of killing tumors. No mechanism
  is transferred from comazaphilone D neuraminidase experiments or from other congeners.
- Reaxys 21312867 agrees with current/frozen ChEBI but independent registry content
  was not obtained. Agreement of official chemical databases does not independently
  prove the experimentally absolute configuration.
- Initial PMC supplementary attachment retrieval returned HTML despite HTTP 200. The
  successful Europe PMC ZIP and extracted valid PDF are recorded separately. Supplementary
  spectra were inspected for compound scope, not independently reinterpreted as absolute
  stereochemical evidence.
- Focused native checks do not substitute for required shared corpus gates or authorize
  REVIEWED status.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native and maintained source files and history remain unchanged.
- Chemistry used the batch 019 RDKit interpreter against batch 033 paths; native schema/strict
  checks used batch 033.
- Conclusions concern E alone; reused original and later shared artifacts retain their
  actual filenames and hashes.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
