- evidence_id: si
  kind: primary_source
  reference: DOI:10.1021/np100788h.s001
  locator: Reused 320-si.pdf contents and S4 Scheme S1, visually inspected E=5
  accessed_at: '2026-10-21T13:38:28.480893Z'
  support: supports
  summary: Original Scheme S1 identifies E as compound 5 with the C-6 oxygenated benzoate
    ester, C-7 hydroxyl/methyl and E side-chain double bond. C is compound 3 with
    a different ester position, while D is compound 4 with a less oxygenated aromatic
    substituent. The displayed wedge orientation establishes no absolute conclusion
    beyond the original relative assignment and failed absolute experiments.
  snapshot_sha256: 797b2f5a91be450acfde3bf2fc122476911314adc880362a8d37ac6a07b73053
- evidence_id: later2026
  kind: primary_source
  reference: PMID:42741989; DOI:10.1002/cbdv.71678
  locator: 321322-2026.xml full main body, Results, Figures 5/6, experimental sections
    and reference 17; 321322-2026-verified-CBDV-23-e71678-s001.pdf contents and figure
    labels
  accessed_at: '2026-10-21T13:42:54.410816Z'
  support: context_only
  summary: E is known compound 2, isolated from Talaromyces wortmannii MCCC 3A01136
    and identified through NMR/MS/optical-rotation comparison with the 2025 paper.
    It protects human A375 melanoma cells from RSL3-induced ferroptosis; Figure 5
    uses 10 micromolar pretreatment for 1 hour followed by 0.4 micromolar RSL3, and
    Figure 6 reports E EC50 4.52 micromolar. These are host-cell survival endpoints,
    not bacterial MICs, direct target binding or tumor-cell killing. The explicit
    ECD/DP4 analysis concerns new compound 1; E supplementary figures S9–S11 contain
    NMR/MS, not an independent absolute assignment.
  snapshot_sha256: 8e0d06f04b414a0e2269e3b3d766dd502c924411ffed17b7ce1f418e17a17810
- evidence_id: later-abstracts
