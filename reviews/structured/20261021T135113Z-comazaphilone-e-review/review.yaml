summary: Comazaphilone E is supported as the C-6 ester bearing a 3,4-dihydroxy-2-methoxy-6-methylbenzoate
  group, with an E side chain, antibacterial activity and reported tumor-cell cytotoxicity.
  All molecular encodings agree. One major finding concerns the absence of qualification
  beside the absolute R,R serialization despite a relative name and unsuccessful original
  absolute assignment. No inversion or mixture is inferred. Later protection of human
  cells from induced ferroptosis is separate from antibacterial action and tumor-cell
  killing.
