evidence:
- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/comazaphilone-e.yaml
  locator: Entire native YAML
  accessed_at: '2026-10-21T13:48:40Z'
  support: supports
  summary: E has a C-6 ester of 3,4-dihydroxy-2-methoxy-6-methylbenzoic acid and a
    C-7 hydroxyl/methyl group. Its ester position distinguishes it from C, and its
    aromatic oxygenation distinguishes it from D. The definition asserts antibacterial
    and antineoplastic activity; no MIC, target, mechanism, clinical claim, producer
    object or causal graph is present. EXACT denotes source ontology identity, not
    experimental absolute assignment.
- evidence_id: chemistry
  kind: validation
  reference: CHEBI:70014; PubChem exact-key query
  locator: 322-authority-chemistry.json; 322-chebi.mol; 322-pubchem.json
  accessed_at: '2026-10-21T13:48:40Z'
  support: supports
  summary: All five native/official encodings yield VWYGBXGOGQHZHM-JBAXFHHXSA-N, C22H24O8,
    charge 0 and two configured R centers. Average and monoisotopic masses agree with
    416.426 and 416.14712, and mutual chirality-aware atom mappings agree. Ordinary
    SMILES encodes no relative stereo group and the InChI uses /s1. Diagnostic inversion
    of both centers changes absolute identity while preserving connectivity; it is
    not a proposed replacement or sample-composition claim.
  snapshot_sha256: 39a349383b6bd218a22f7e8b3f3557c60f3b3696816a01f6080f9e3829f47d43
- evidence_id: authority
  kind: authority
  reference: https://www.ebi.ac.uk/chebi/CHEBI:70014
  locator: 322-chebi.json complete entry
  accessed_at: '2026-10-21T13:42:36.971449Z'
  support: supports
  summary: Current ChEBI repeats the relative name and absolute graph, all seven native
    structural parents, antibacterial role, Reaxys 21312867 and P. commune QSD 17
    origin through PMID 21226488. The graph supports tertiary alcohol, alpha-hydroxy
    ketone, catechol, aromatic ether, benzoate ester, isochromene and azaphilone parents.
    Antineoplastic and fungal-metabolite roles are outside the configured antimicrobial-role
    extraction scope; their absence from native activity_roles is not a lost antimicrobial-role
    defect.
