findings:
- finding_id: F1
  issue_key: formicin-lantibiotic-small-molecule-identity-conflation
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the lantibiotic concept conflated with three unrelated small molecules
  description: The record calls itself the two-component lantibiotic from PMID 27450592,
    but its native graph and PubChem CID 69365 are N-(hydroxymethyl)acetamide, C3H7NO2,
    89.09 Da. Exact CHEBI:192837 and CAS 50667-69-1 denote the trifluoroacetamide
    C3H4F3NO2 instead, and CHEMBL471524 denotes formycin C10H13N5O4. The author’s
    primary chapter identifies two isolated peptide components with masses 3254.34
    and 2472.06 Da. These positive identities establish conflation; the problem is
    not missing optional detail or uncertain antimicrobial potency. Current ARO preserves
    the conflicting identifiers, so simply re-fetching or trusting the shared name
    would reproduce it.
  target_ids:
  - antibioticmech:aro-1286e26ebd
