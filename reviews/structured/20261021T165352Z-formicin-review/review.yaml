- evidence_id: aro
  kind: authority
  reference: ARO:3003904; ARO:3009656; https://purl.obolibrary.org/obo/aro.obo; https://card.mcmaster.ca/ontology/40606
  locator: Complete current OBO stanzas for the compound and parent, plus the CARD
    compound page and official OLS term.
  accessed_at: '2026-10-21T16:49:32Z'
  support: refutes
  summary: Current ARO retains the same two-peptide definition and all four conflicting
    chemical identifiers. ARO:3009656 is the broader RiPP antibiotic class, which
    is appropriate to the cited lantibiotic but not to N-(hydroxymethyl)acetamide.
    The CARD webpage additionally displays the formycin nucleoside SMILES, matching
    its ChEMBL reference rather than its PubChem CID. This is an upstream identity
    conflation faithfully propagated by the maintained rows, not a local YAML transcription
    mistake. OLS returned 404 for the class, but its exact current OBO stanza resolves
    it.
  snapshot_sha256: d12ec5d36c55f371079c392492b034d115adb256f8d2ff4a84041c6202f4a1c4
- evidence_id: pubchem
  kind: authority
  reference: pubchem.compound:69365; https://pubchem.ncbi.nlm.nih.gov/compound/69365
  locator: Complete current official properties and synonym list, independently parsed
    against native SMILES/InChI.
  accessed_at: '2026-10-21T16:49:01Z'
  support: refutes
  summary: CID 69365 is N-(hydroxymethyl)acetamide, C3H7NO2, neutral, 89.09 g/mol
    and monoisotopic mass 89.047678466. Its full key exactly matches both native encodings.
    PubChem lists Formicin as a synonym and CAS 625-51-4, explaining a homonym route
    without establishing equivalence to the 2016 lantibiotic. The single amide molecule
    is neither of the two kilodalton peptide components.
  snapshot_sha256: e7e58f97eafadb74535492b85a9e0e046fc2220b57a94fc99d64de9af0c52c0a
- evidence_id: other-xrefs
  kind: authority
  reference: CHEBI:192837; cas:50667-69-1; chembl:CHEMBL471524
  locator: Complete ChEBI entry including graph/CAS association, exact-CAS PubChem
    lookup, complete ChEMBL molecule record and independent parsing of all graphs.
  accessed_at: '2026-10-21T16:52:16Z'
  support: refutes
  summary: CHEBI:192837 is N-(hydroxymethyl)trifluoroacetamide, C3H4F3NO2, key URUWXKFAEKTWKG-UHFFFAOYSA-N.
    Its CAS 50667-69-1 is independently mapped by PubChem to CID 3084931 with the
    same fluorinated graph. ChEMBL CHEMBL471524 is FORMYCIN, a C10H13N5O4 nucleoside
    with key KBHMEHLJSZMEMI-KSYZLYKTSA-N. Both graphs differ from native CID 69365
    and from the peptide material in the cited experiment. These are exact xrefs,
    so their disagreement cannot be explained by the broader association semantics
    allowed for drug_xrefs.
  snapshot_sha256: fc890bdc5f3764ea4a57584609e0a1a6e97f703e359ecf16110ce266f4e357df
- evidence_id: adopted
  kind: primary_source
  reference: PMID:27450592; DOI:10.1099/mic.0.000340
  locator: Complete indexed and official publisher abstract of the sole adopted citation;
    author/DOI/publication metadata verified.
  accessed_at: '2026-10-21T16:49:02Z'
  support: refutes
  summary: The 2016 study explicitly reports isolation and characterization of a two-peptide
    lantibiotic from B. paralicheniformis APC 1576, originally isolated from a mackerel
    intestine. It identifies an operon and purifies peptides from bacterial supernatant.
    The antibacterial spectrum and producer language support the peptide concept in
    the native definition, not the native acetamide structure. The publisher main/full-text/PDF
    requests were blocked by HTTP 403; the first author’s deposited thesis chapter
    supplies the primary experimental text below.
  snapshot_sha256: c0a49bd50a006bac565c6e47be9770c908cebe7f55ab656c0b6bdfac57fb95de
- evidence_id: primary-material
  kind: primary_source
  reference: https://hdl.handle.net/10468/8530; Collins FWJ, 2019 doctoral thesis,
    chapter 2, reporting DOI:10.1099/mic.0.000340
  locator: Complete chapter body pp. 44–61 and figure/table captions pp. 62–66; Figure
    3 p. 64 and Table 1 p. 66 independently viewed.
  accessed_at: '2026-10-21T16:50:13Z'
  support: refutes
  summary: The author’s chapter explicitly identifies itself with the 2016 Microbiology
    study. Active HPLC fractions contain alpha and beta peptide masses 3254.34 and
    2472.06 Da. Genomic precursors, purification and protease sensitivity support
    peptide production. Figure 3 is explicitly a structure prediction based on homologous
    lantibiotics; bridge topology and disulfide placement are not independently solved
    structures. Consequently the native 89-Da acetamide cannot represent this material,
    and replacing it with a fully stereospecified peptide graph from the predicted
    cartoon would require further validation.
  snapshot_sha256: 1ac2f324102f4257458c5f71c9c0b285e49ee92a423bff2e4f5885ee12a0090b
- evidence_id: primary-activity
  kind: primary_source
  reference: https://hdl.handle.net/10468/8530; DOI:10.1099/mic.0.000340
  locator: Chapter 2 Results pp. 51–53, antimicrobial Methods p. 60 and Table 1 p.
    66.
  accessed_at: '2026-10-21T16:52:16Z'
  support: context_only
  summary: Purified peptides were combined 1:1 at 25 micromolar each; 50 microlitres
    were added to 7-mm agar wells seeded with 50 microlitres of overnight indicator
    culture in 20 mL agar. Overnight incubation used strain-specific medium/atmosphere.
    Table 1 records inhibition in 29 of 35 strains, including S. aureus R963, three
    L. monocytogenes strains and the paper’s C. difficile ATCC 1382 entry; S. aureus
    C55 was negative. These are categorical diffusion zones, not MICs or species-universal
    activity. Alpha alone had activity against some indicators at 50 micromolar, while
    beta alone had no detectable activity under the tested conditions. None is a test
    of N-(hydroxymethyl)acetamide.
  snapshot_sha256: f09a3095a3efa2292ae3c03d1c9d2f2bbc27c66953d204169cdeb296e7f6e6df
- evidence_id: mechanism
  kind: primary_source
  reference: https://hdl.handle.net/10468/8530; DOI:10.1099/mic.0.000340
  locator: Chapter 2 Introduction, structure-prediction Results, Discussion and Conclusion.
  accessed_at: '2026-10-21T16:50:13Z'
  support: context_only
  summary: Lipid-II docking and subsequent beta-peptide recruitment/pore formation
    are proposed by homology to other two-component lantibiotics. Biosynthetic modification/transport/immunity
    genes are largely assigned by sequence comparisons. This chapter does not establish
    direct formicin lipid-II binding, a pore assay or a resistance mechanism for the
    small molecule. Such hypotheses should not be converted into measured target or
    causal objects.
  snapshot_sha256: 1ac2f324102f4257458c5f71c9c0b285e49ee92a423bff2e4f5885ee12a0090b
