summary: The complete record faithfully reproduces its maintained ARO/PubChem inputs,
  but those inputs conflate the cited two-peptide lantibiotic with three distinct
  small-molecule identities. The native graph is N-(hydroxymethyl)acetamide; its exact
  ChEBI/CAS and ChEMBL references denote two further unrelated compounds. One confirmed
  identity blocker covers this source conflation. The original study, read through
  the first author’s deposited thesis chapter, supports the peptide-producing strain
  and bounded combined-peptide activity, not the native small molecule. Schema, strict
  and internal chemistry checks pass.
