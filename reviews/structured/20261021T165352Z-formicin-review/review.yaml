  acceptance_checks:
  - Record a maintained source/decision resolution that separates the two-component
    lantibiotic from N-(hydroxymethyl)acetamide, N-(hydroxymethyl)trifluoroacetamide
    and formycin. Preserve the ARO provenance; do not select one of its conflicting
    xrefs solely because the label is similar.
  - Apply the documented mixture/one-structure rule to the combined lantibiotic concept,
    using an explicit exclusion or deferred structure-resolution path as appropriate.
    Evaluate alpha and beta components separately only after exact mature structures
    and activity scope are supported; the homology-derived ring cartoon is not a fully
    experimentally solved replacement graph.
  - If the small-molecule homonym is retained or admitted independently, provide its
    own exact identity and antimicrobial evidence instead of the peptide definition/citation.
    Remove or qualify the proven non-equivalent xrefs through maintained ownership.
  - Regenerate the affected record/products through the source pipeline; verify expected
    worklist/retirement behavior, exact identifier/graph agreement, focused schema/strict
    checks, corpus reproduction and shared QC. Do not manually patch generated YAML.
limitations:
- The publisher’s complete article/PDF endpoints returned HTTP 403; the complete original
  study body was instead inspected in its first author’s public 2019 thesis chapter,
  explicitly labelled with the 2016 paper. The deposited chapter is the source for
  detailed methods and tables here; the publisher abstract was independently verified.
- Figure 3 and Table 1 were viewed directly. Other figures were read through their
  captions and surrounding Results; raw spectra and genomic reads were not reprocessed.
  The chapter’s proposed ring connections, cleavage details and mechanism are not
  treated as solved exact component chemistry.
- CAS identity was checked through two official chemical databases, not a directly
  accessible CAS registry record. The ChEBI structure endpoint fetched under a .mol
  filename returned SVG, so no molfile parsing is claimed; the official JSON SMILES
  and independent PubChem CAS graph were used.
- No conclusion that the small-molecule homonym is universally inactive is made. The
  confirmed problem is its conflation with the cited peptide and with two further
  exact chemical xrefs. Broader historical formulation studies would require separate
  exact-material review.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
