  summary: The H. influenzae ftsI study examines correlated mutations and susceptibility
    in clinical isolates. Figure 2d is explicitly labeled cefditoren pivoxil (CFDN-PI),
    creating an unresolved assay-material/naming boundary for the free-acid edge.
    The paper cannot isolate the contribution of linked substitutions; its correlations
    should not become a direct free-acid binding assay or single-variant causal claim.
    Native resistance remains explicitly database-supported.
