- evidence_id: urinary
  kind: primary_source
  reference: PMID:23009290; DOI:10.1186/1471-2334-12-228; PMC3518207
  locator: Original XML Methods, relevant Results and Discussion.
  accessed_at: '2026-10-21T11:15:22Z'
  support: supports
  summary: The study tests 563 Greek outpatient urinary isolates by agar dilution
    using GSK cefditoren standard powder; bulk salt form is not resolved. Overall
    MIC50/MIC90 are 0.25/0.5 mg/L. Its ≤1 mg/L susceptible threshold was explicitly
    tentative because no cefditoren-specific CLSI/EUCAST breakpoint was established
    there. Resistance mechanisms were phenotypically inferred. This is susceptibility
    surveillance, not clinical treatment efficacy or isolated gene causality; no individual
    MIC row is adopted here.
