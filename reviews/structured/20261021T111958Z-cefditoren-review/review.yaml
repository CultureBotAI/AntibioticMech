  accessed_at: '2026-10-21T11:15:22Z'
  support: supports
  summary: S. pneumoniae R6 soluble PBP2X residues 49–750 were expressed in E. coli
    and trypsin-digested. Crystals were soaked 105 min in 5 mg/mL cefditoren sodium;
    the 2.60 Å complex shows covalent cefditoren acylation of Ser337. This is direct
    active-moiety structural evidence using a sodium reagent, not an experiment with
    pivoxil or proof of a specific whole-cell killing pathway. Alternative crystal
    contacts limit claims about the physiological C3-side-chain binding mode. Original
    figure images and coordinate re-refinement were not audited.
