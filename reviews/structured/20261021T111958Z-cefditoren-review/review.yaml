limitations:
- No paid registry or research service was used. An inaccessible document is an explicit
  verification limit, not evidence that the document or biological effect does not
  exist.
- All fourteen compound/target/parent MED records were dispositioned; three have no
  indexed abstract. Several clinical reviews and original panel studies were inspected
  only at abstract level.
- The original 2012 urinary paper Methods and relevant Results/Discussion were inspected;
  individual Table 7 isolates were not exhaustively adjudicated and no numeric row
  is proposed for adoption.
- The original 2007 PBP2X HTML was available after earlier XML failures. Methods,
  Results/Discussion and table/captions were inspected; original images and PDB coordinates
  were not independently reanalyzed. A 2026 PBP1b lead was found but its attempted
  full XML failed and was not used for a claim.
- The 2018 H. influenzae study labels its cefditoren panel as pivoxil. Resolve exact
  test material before assigning its quantitative results to the free acid. Supplements
  and plot points were not separately audited.
- DrugBank and Reaxys independent contents remain unavailable. Patent checks establish
  document relevance at title/abstract/metadata level, not exhaustive chemical claims.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Bundle completion is partial because full repository QC is unavailable on this runtime;
