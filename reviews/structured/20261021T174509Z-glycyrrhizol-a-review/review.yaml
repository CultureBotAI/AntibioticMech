  locator: Complete original main text, Methods, Results, tables and Discussion; figure
    captions read, raw images not visually inspected
  accessed_at: '2026-10-21T17:38:49Z'
  support: supports
  summary: HPLC tracked A in an ethanol licorice extract; lollipops contained7–15
    mg extract adjusted for batch composition. The microbial and human studies therefore
    test mixed extracts/products. The two pilot human studies enrolled26 participants
    without control groups and measured salivary S. mutans before/after10 days, not
    tooth-caries outcomes. The Discussion explicitly leaves killing mechanism and
    clinical anticavity efficacy unresolved. Neither extract MICs nor safety/pilot
    outcomes are pure-A measurements. The first PMC PDF route returned an HTML challenge;
