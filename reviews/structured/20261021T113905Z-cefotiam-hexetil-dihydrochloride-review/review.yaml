summary: Native cefotiam hexetil dihydrochloride agrees with current chemical authorities
  in full key, two-HCl composition, formula, masses and two configured cefotiam core
  centers. Its additional ester stereocenter is unspecified, and the record makes
  no single-isomer claim. Original compound-specific research supports conversion
  to cefotiam and oral prodrug activity. The experimentally tested material included
  both ester-center diastereomers, and the original analytical preparation was a dihydrate;
  neither fact is silently transferred into the anhydrous native graph. No confirmed
  required correction was established and no native record was changed. Scientific
  assessment retains the stated evidence limits; full verification is blocked by the
  shared native-library failure.
