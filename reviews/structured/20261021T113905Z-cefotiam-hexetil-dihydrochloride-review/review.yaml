- evidence_id: chemistry
  kind: validation
  reference: CHEBI:31373; KEGG:D01415; PubChem:175647; PubChem:57515952
  locator: 237-chemistry.py/.json and authority snapshots
  accessed_at: '2026-10-21T11:35:04Z'
  support: supports
  summary: Native SMILES/InChI, KEGG molfile and both exact-key PubChem results normalize
    to FFSANQNELHESQJ-LWBICVDYSA-N. They agree on C27H39Cl2N9O7S3, equivalent to the
    native component formula C27H37N9O7S3.2HCl, charge 0, average mass 768.772 and
    exact mass 767.151162948. Both cefotiam core centers are R; the additional ester
    center is unspecified. Neutral-HCl and proton/chloride encodings have the same
    composition and normalized key. Partial stereochemistry alone neither proves a
    mixture nor defines its ratio.
  snapshot_sha256: 47e010b013666700693cf6555b92fa7e85053a1dd57a99c950bf63d514caee87
- evidence_id: grounding
  kind: authority
  reference: CHEBI:31373; CHEBI:36807; CHEBI:36047; cas:95789-30-3; kegg.drug:D01415
  locator: 237-ols.json; 237-kegg.txt; 236-parent.json reused for the same unchanged
    hydrochloride term
  accessed_at: '2026-10-21T11:35:04Z'
  support: supports
  summary: ChEBI resolves the exact salt, hydrochloride parent and antibacterial role.
    KEGG D01415 uses the shorter cefotiam hexetil hydrochloride name while explicitly
    retaining two HCl equivalents; it identifies cefotiam as the active form. The
    native short HCl/hydrochloride aliases therefore do not establish an erroneous
    mono-HCl structure. CAS is corroborated through these authorities rather than
    independently through the registry. KEGG drug-context placement is appropriate.
  snapshot_sha256: 3c3d72311729ebe6b2711e8b2dd81b71a0b712dc52d97524c43ed9467936ef90
- evidence_id: synthesis
  kind: primary_source
  reference: PMID:3470275; DOI:10.7164/antibiotics.40.81
  locator: 237-primary.pdf, printed pp.81-89, chemistry/results, Tables 1-3 and 5-6,
    exact 9d preparation and methods; table images inspected
  accessed_at: '2026-10-21T11:35:04Z'
  support: supports
  summary: The original paper identifies 9d/SCE-2174 as the requested ester dihydrochloride
    and reports an approximately equal diastereomer mixture, followed by separated-isomer
    experiments. Mouse plasma cefotiam measurements and tissue-homogenate hydrolysis
    support the prodrug relationship. The paper reports no significant bioavailability
    difference between separated isomers under its conditions, despite different in
    vitro hydrolysis rates. Table 5 characterizes a dihydrate, so these experimental
    observations are not evidence that the native anhydrous representation itself
    specifies that hydrate or a mixture ratio. Doses are cefotiam-equivalent, not
    directly interchangeable salt mass.
  snapshot_sha256: 396d8b1c241ed2da7fe167fb4fbce7d4bb987bb44ec96ddd4afa167ad572eeb3
- evidence_id: activity
  kind: primary_source
  reference: DOI:10.11250/chemotherapy1953.36.Supplement6_80
  locator: 237-activity.html, complete English abstract; 237-activity.pdf printed
    pp.80-81, original definition, Figure 1 and methods
  accessed_at: '2026-10-21T11:35:04Z'
  support: supports
  summary: The original study explicitly identifies the (RS)-ester dihydrochloride
    and depicts two HCl components. It separates in vitro cefotiam assays from in
    vivo cefotiam hexetil experiments. Its reported mouse protection supports the
    antibacterial prodrug context; the cefotiam in vitro MICs and killing assays must
    not be copied as direct parent-ester results. The full 31-page numerical panel
    was not exhaustively inspected.
  snapshot_sha256: 018d3a3e8f8ab806f49ee6fe9306a9907fb0a0781d8530974715529e6259b1fc
- evidence_id: mechanism-boundary
  kind: primary_source
  reference: PMID:371539; DOI:10.1128/AAC.15.1.20
  locator: Previously inspected 236-pbp20.png through 236-pbp22.png, original SCE-963
    methods/results
  accessed_at: '2026-10-21T11:35:04Z'
  support: context_only
  summary: The older direct PBP study concerns cefotiam/SCE-963, not the later hexetil
    ester/SCE-2174. Its competition, peptidoglycan and morphology findings may explain
    the released active moiety but do not establish direct binding by the intact ester
