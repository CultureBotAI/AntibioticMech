limitations:
- The native unspecified ester center does not encode the presence or ratio of two
  stereoisomers. The original 9d preparation was experimentally near-equimolar in
  its ester-center diastereomers; separated-isomer results are distinct observations.
  Preserve the two fixed cefotiam core centers and do not arbitrarily assign the third.
- The original synthetic analytical sample includes two waters. Native chemical identity
  is the anhydrous dihydrochloride authority representation, so no hydrated-material
  measurement was imported as an exact anhydrous quantitative observation.
- The 1987 primary paper was read in the relevant chemistry, results, exact 9d preparation
  and biological methods with the key tables inspected. The 1988 paper was read at
  complete English abstract depth plus original pp.80-81; its full numerical animal
  and bacterial panels were not exhaustively reviewed. Animal conversion and exposure
  do not establish an uninspected human treatment claim.
- The primary activity study uses cefotiam for in vitro tests and cefotiam hexetil
  for in vivo tests. Direct PBP evidence for cefotiam does not demonstrate binding
  by the intact ester. Any future curated assay must retain exact form, hydration,
  stereoisomer material, conversion context and dose basis.
- CAS was corroborated through chemical authorities without direct registry access.
  No adopted PMID leads are present in the source row. Supplemental chemistry used
  the existing 019 interpreter against 024; focused checks do not substitute for required
  shared corpus gates.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
