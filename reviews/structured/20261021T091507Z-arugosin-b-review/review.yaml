limitations:
- The adopted2006 original was read at complete-abstract scope only; ACS full body
  returned403. The author thesis repository abstract and front matter were readable,but
  its relevant chapter was not; an HTML challenge masquerading as.pdf was detected
  and excluded.
- The1970 structural and2011 analytical sources were assessed at complete-abstract
  scope. The two newer congener papers were screened at the explicitly stated abstract/text-search
  scope,not exhaustively audited.
- No purified-B numerical antibacterial assay,direct target,absolute stereochemistry
  or clinical status was established. The search is bounded and does not prove these
  data absent from the literature. Reaxys was not directly verified.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
