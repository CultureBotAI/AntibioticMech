findings:
- finding_id: F1
  issue_key: fidaxomicin-missing-c18-stereochemistry-exact-xrefs
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: The reviewed fidaxomicin graph omits experimentally established C18 stereochemistry
  description: Native/current ChEBI InChI atom 34 is unspecified and maps to macrolactone
    C18. Original 2017 single-crystal work and native patent Example 1 establish 18S;
    the linked PubChem and ChEMBL molecules and bound ligand FI8 all assign it. The
    other thirteen native centres agree. Resolve the intended exact chemical identity
    and source ownership, then make graph, structural key and exact xrefs consistent.
    Do not call the native graph a racemate, a confirmed opposite epimer or a proven
    physical mixture.
  target_ids:
  - CHEBI:68590
