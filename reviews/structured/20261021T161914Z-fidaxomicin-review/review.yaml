  summary: The original directly resolves fidaxomicin at the C. difficile RNAP clamp
    hinge and measures transcription inhibition. RNAP genes are from strain 630, including
    CD630_00660 rpoB and CD630_00670 rpoC, heterologously expressed with a beta/beta-prime
    fusion. The expression host does not change target taxon. C. difficile K84E is
    less sensitive in purified transcription assays; E. coli Q94K sensitization and
    B. subtilis R84E genetic tests use different organisms. E. coli whole-cell sensitization
    requires the outer-membrane sensitizer SPR741. The residue contributes to selectivity
    but is not a universal single cause of susceptibility. Methods use named fidaxomicin
    stocks; the ligand model is stereodefined, not every structure compatible with
    native /t34?.
