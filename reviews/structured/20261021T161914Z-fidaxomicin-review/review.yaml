limitations:
- All fifteen adopted PMID leads were read at complete original abstract depth. Selected
  2022 mechanism, 2017 structure and 2012 assay papers were read more deeply as individually
  documented; other reviews and clinical papers were not represented as full-text
  experimental audits.
- The 2017 original main paper, crystallographic methods and actual Figures 1/4/5
  were inspected, but raw diffraction intensities were not re-refined. The 2022 main
  Results, relevant Methods and actual Figures 1/4 were inspected; raw cryo-EM data
  were not reprocessed.
- Both native patents were resolved and relevant exact-structure, preparation and
  activity sections inspected. Every broad formulation claim and numerical table cell
  was not independently audited. Historical OPT-80/lipiarmycin aliases do not imply
  every named preparation was one pure molecule.
- Reaxys 12687773 returned 403. The CAS number is consistent with public identity
  sources, but an authoritative CAS registry graph was not independently obtained.
  Wikipedia was resolved only as a document link, not as primary scientific support.
- The Taiwan 2012 source has differing abstract and Table 1 MIC90 values. No numerical
  susceptibility assertion or clinical breakpoint is imported from that conflict.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native records, maintained sources and immutable reviews were not edited. Original
  thirteen hashes and all expanded inputs were rechecked. Optional links, tags and
  notes were checked specifically for fidaxomicin.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
