  support: supports
  summary: Current named entry, CAS and exported SMILES corroborate the exact neutral
    native identity. The additional nitrogen stereotag in its SMILES does not change
    the standardized InChIKey.
  snapshot_sha256: 8c341cca97cfa2cb1c962b6028d63f53704ded337ea4b4147cea4a95bd16bf43
- evidence_id: oxa
  kind: primary_source
  reference: PMID:25406838
  locator: DOI:10.1021/cb500703p; full abstract and PDB4WM9/4WMC deposited records/coordinates
  accessed_at: '2026-10-21T09:27:04Z'
  support: partial
  summary: The original abstract explicitly reports OXA-24 and OXA-48 complexes and
    selective, slowly reversible inhibition. Deposited 2.4- and 2.3-Angstrom structures
    share that primary citation and contain covalent serine-oxygen to NXL-ligand-carbon
    links. This supports the existing direct-binding claim. It does not imply equal
    potency against every OXA enzyme, and full kinetic Methods were not retrieved.
  snapshot_sha256: c3f7bb084bc3f312034fd3aac742f635c298f67f9e367272183a1cf327175aaf
- evidence_id: pbp
  kind: primary_source
  reference: PMID:26574008
  locator: DOI:10.1128/AAC.02102-15;127-primary2016-pbp.xml; Methods, Results and
    Table 1
  accessed_at: '2026-10-21T09:27:04Z'
  support: partial
  summary: AstraZeneca avibactam was tested against bacterial membranes using Bocillin-FL
    competition. E. coli K-12 PBP2 competition IC50 was 0.92 micrograms/ml, separate
    from its broth MIC of 8 micrograms/ml. P. aeruginosa showed PBP engagement despite
    MIC greater than 128 micrograms/ml. These are direct experimental PBP interactions,
    not a dissociation constant or evidence of clinical monotherapy. Reagent counterion
    was not stated.
  snapshot_sha256: e1461c9306cbaf5969e997342c8d800f6bc68399dade6b9f0deb7b0abd24fb26
- evidence_id: direct
  kind: primary_source
  reference: PMID:40503840
  locator: DOI:10.1128/spectrum.03241-24;127-primary2025-direct.xml; antimicrobial/MIC/time-kill
    Methods and selected Results
  accessed_at: '2026-10-21T09:27:04Z'
  support: partial
  summary: The peer-reviewed 2025 study used MedChemExpress avibactam without a catalog/CAS
    in Methods. Direct-activity testing of Enterobacterales showed growth inhibition,
    rounding compatible with PBP2 action and substantial regrowth during prolonged
    exposure. The work supports a second in-vitro route without establishing routine
    standalone clinical efficacy; its growth phenotype does not by itself replace
    the earlier binding experiment.
  snapshot_sha256: 2548bc91c5926fd8d10a11903a5d4ed8b6f60266cb6713eafbf32a181328777c
- evidence_id: checkerboard
  kind: primary_source
  reference: PMID:25487794
  locator: 127-core.json complete abstract; DOI:10.1128/AAC.04146-14
  accessed_at: '2026-10-21T09:27:04Z'
  support: partial
  summary: This adopted checkerboard paper itself reports avibactam-alone Enterobacteriaceae
    activity as well as ceftazidime restoration. The whole MIC distribution and original
    Methods were not inspected, so only the qualitative distinction is used.
- evidence_id: leads
  kind: database
  reference: Ten adopted ChEBI PMID leads
  locator: 127-core.json;127-lead-dispositions.json
  accessed_at: '2026-10-21T09:27:04Z'
  support: context_only
  summary: All ten complete abstracts were read. PMID25361682 is a secondary review;25645843
    is murine pharmacokinetics;25444674,25534728,25583732 and25737290 are partner/strain-specific
    combination studies;25666153 and25691639 examine engineered KPC/SHV variants.
    The OXA and checkerboard leads are separately scoped. No combination MIC is relabeled
    inhibitor-only activity.
  snapshot_sha256: 32eb5743183fff905587b41da9c9d39de5b217a5d8f65fe296b0b893eb1fe05d
- evidence_id: resistance
  kind: primary_source
  reference: PMID:25666153;PMID:25691639;PMID:25444674
  locator: 127-core.json complete abstracts
  accessed_at: '2026-10-21T09:27:04Z'
  support: context_only
  summary: KPC/SHV variant studies combine controlled genetic, kinetic and partner-specific
    susceptibility evidence; modeling is a proposed explanation. Japanese OXA-producing
    Acinetobacter isolates did not show restored partner activity. Neither resistance
    nor species-wide susceptibility follows merely from a cocrystal.
- evidence_id: adapter
  kind: database
