findings:
- finding_id: F1
  issue_key: chebi-85984-avibactam-direct-pbp-scope
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Qualify the mechanism contrast so it does not exclude direct PBP activity
  description: The current note correctly explains protection of the partner beta-lactam
    but ends with a broad contrast against direct bacterial cell-wall inhibition.
    Direct PBP engagement and intrinsic activity have been experimentally reported.
    Scope the contrast to the described beta-lactamase-mediated potentiation, and
    acknowledge the separate limited in-vitro activity; retain the valid OXA target
    and OTHER classification for this resistance-enzyme mechanism.
  target_ids:
  - CHEBI:85984
