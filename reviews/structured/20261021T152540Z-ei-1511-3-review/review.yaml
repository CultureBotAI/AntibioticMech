  issue_key: ei-1511-3-incorrect-producer-strain
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Correct the reported isolation strain from E-1625 to E-1511
  description: The native definition attributes EI-1511-3 to Streptomyces E-1625.
    The original Part I isolation text and Figure2 explicitly derive EI-1511-3 from
    E-1511, while E-1625 is separately used to isolate EI-1625-2. This is a wrong
    asserted experimental source, reproduced from ChEBI prose; ChEBI species metadata
    independently names E1511. Correct the specific isolation statement without changing
    the exact structure or supported antibacterial classification.
