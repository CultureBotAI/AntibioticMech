- evidence_id: structure
  kind: primary_source
  reference: PMID:8982334; DOI:10.7164/antibiotics.49.1079; https://www.jstage.jst.go.jp/article/antibiotics1968/49/11/49_11_1079/_pdf
  locator: Entire original six-page Part II read; Figure 1 and Table 1 on p1079 and
    the absolute-configuration conclusion and Table 4 on p1082 visually inspected.
  accessed_at: '2026-10-21T15:21:06Z'
  support: supports
  summary: Compound 1 is EI-1511-3. The paper assigns C27H30N2O7 and reports HRFAB
    [M+H]+ 495.2124 against calculated 495.2131. NMR establishes the two side chains
    and their five E alkenes; a temporarily unresolved coupling in chloroform is resolved
    in pyridine. CD and oxidative-derivative analysis assign the core paper positions
    4S,5R,6S. Independent atom mapping places native atom 18 at the tertiary hydroxyl
    C4(S), atom 0 at epoxide C5(R), and atom 2 at carbonyl-adjacent epoxide C6(S).
    The native bicyclic systematic name uses a different numbering system, not different
    stereochemistry. Uncertainty discussed for compound3 is not transferred to compound1.
  snapshot_sha256: 542ec54efdaf2c288a92be3a378e26b4c31f64dcce6ac42ded35f978b1df5028
- evidence_id: producer
  kind: primary_source
  reference: DOI:10.7164/antibiotics.49.1073; https://www.jstage.jst.go.jp/article/antibiotics1968/49/11/49_11_1073/_pdf
  locator: Entire original six-page Part I read; pp1075–1076 isolation text and Figures1–2
    visually inspected.
  accessed_at: '2026-10-21T15:21:20Z'
  support: refutes
  summary: The study identifies E-1511 and E-1625 as separate Streptomyces isolates
    and deposits them as FERM BP-4792 and BP-4965, respectively. The E-1511 fermentation
    and isolation procedure yields 160 mg EI-1511-3 from 17 litres of broth after
    resin and ODS chromatography. A separate E-1625 procedure produces EI-1625-2.
    This directly contradicts the native attribution of EI-1511-3 isolation to E-1625.
    It is an exact compound-to-strain correction, not proof that a strain could never
    produce another metabolite under different conditions.
  snapshot_sha256: 643c66916ed5125ed33417441b9c3466246176c29d681a3a09031b58c8148140
- evidence_id: antibacterial
  kind: primary_source
  reference: DOI:10.7164/antibiotics.49.1085; https://www.jstage.jst.go.jp/article/antibiotics1968/49/11/49_11_1085/_pdf
  locator: Entire original six-page Part III read; Table 2 and its MIC units on p1087
    visually inspected.
  accessed_at: '2026-10-21T15:21:06Z'
  support: supports
  summary: Exact EI-1511-3 has reported MICs of 40 micromolar for S. aureus subsp.
    aureus ATCC6538P and E. faecium ATCC10541, and 20 micromolar for B. subtilis No.10707.
    The other seven tested organisms, including six Gram-negative bacterial strains
    and C. albicans, are reported above 40 micromolar. This supports the native weak
    antibacterial activity claim for the tested strains without a species-wide susceptibility
    inference. The complete main-paper methods do not specify antimicrobial medium,
    inoculum, incubation or MIC endpoint; these details cannot be reconstructed for
    quantitative reuse.
  snapshot_sha256: 1e0627ae2f27418e4e08e8484574cda74dd501cf268eb17e2b5b774ebd5991b0
- evidence_id: human-ice
  kind: primary_source
  reference: DOI:10.7164/antibiotics.49.1073; DOI:10.7164/antibiotics.49.1085
  locator: Part I enzyme preparation and assay methods; Part III full Results/Discussion,
    Figures1–3 and Table1 on p1086 visually checked.
  accessed_at: '2026-10-21T15:21:06Z'
  support: supports
  summary: The purified recombinant target is human ICE expressed in E. coli. The
    assay uses a fluorogenic tetrapeptide substrate, phosphate buffer and a two-hour
    room-temperature incubation. EI-1511-3 inhibits recombinant ICE with IC50 0.09
    micromolar and THP-1-extracted ICE with IC50 0.16 micromolar; elastase and cathepsin
    B are above 20 micromolar in the tested comparisons. Two millimolar DTT weakens
    activity approximately 100-fold, with HPLC suggesting compound degradation. These
    observations support the native human-enzyme inhibition claim. The expression
    host is not the target organism, IC50 is not a binding constant, and no antibacterial
    mechanism through human ICE is established.
  snapshot_sha256: 1e0627ae2f27418e4e08e8484574cda74dd501cf268eb17e2b5b774ebd5991b0
