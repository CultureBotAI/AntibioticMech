limitations:
- Reaxys7630280 was checked as adopted provenance but its proprietary exact structure
  was not accessed.
- All three original 1996 main articles were read in full, with key identity, producer
  and assay figures/tables visually checked. Raw NMR spectra and all analytical data
  were not independently reprocessed; the review verifies the reported assignment
  against the native graph.
- The antibacterial table gives strain-specific MICs in micromolar units, but the
  inspected complete main-paper methods do not report antimicrobial medium, inoculum,
  incubation or endpoint definition. No complete structured MIC protocol is invented.
- The host-cell secretion IC50 differs between the Part III abstract and Results/Table3.
  That numerical inconsistency remains unresolved and is not transferred into the
  native qualitative ICE claim.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The E-1511/E-1625 correction concerns the documented isolation experiment. It is
  not evidence that E-1625 could never produce EI-1511-3 under other conditions.
- Optional future enrichment should preserve exact congener identity, bacterial strain
  and assay boundaries; host ICE inhibition must remain distinct from an experimentally
  established antibacterial mode of action.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
