  support: supports
  summary: Isogenic E. coli DH10B pBAD-expression MICs used ampicillin selection and
    arabinose preinduction, followed by CAMHB at 35 °C for 18–20 h. TP-434 MICs were
    0.063 for lacZ control, 0.25 for tet(A) and 4 µg/mL for tet(X); tested tet(M),
    tet(K) and tet(B) did not increase the control value. P. acnes G1058C observations
