limitations:
- The adopted 2013 paper was read for Methods, relevant Introduction/Discussion, its
  exact structure figure, the selected A. baumannii Table 1 row and all of Table 5.
  Every row of the much larger clinical isolate Tables 1–4 was not independently re-audited;
  no complete current clinical spectrum is certified.
- The original 2012 mechanism Methods, relevant Results/Discussion, Tables 1–3 and
  actual Figures 2/3 were inspected with the full 2015 erratum. Competition IC50 is
  not Kd or MIC, and the non-isogenic P. acnes comparison is not direct mutation reconstruction.
- The original synthesis abstract was inspected, but the full ACS paper returned 403.
  The exact isolated assay preparation is not assigned a salt, hydrate or analytical
  purity from uninspected synthetic methods.
- ChEMBL uses an alternate keto-enol representation. RDKit tautomer enumeration reached
  its transform cap and the common canonical result removes stereochemistry; the original
  formula, connectivity and stereolayers were therefore retained as separate evidence.
  No graph replacement or identifier deletion is recommended from that calculation
  alone.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native, source, status or history field was edited. Original thirteen input hashes
  were retained and all expanded inputs were checked unchanged before output. Optional
  links, tags and notes were checked against this exact compound.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
