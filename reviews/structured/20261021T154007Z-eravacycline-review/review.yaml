  accessed_at: '2026-10-21T15:27:10.243508Z'
  support: supports
  summary: Tetraphase-synthesized TP-434 was tested in E. coli coupled transcription/translation
    with a luciferase readout, 22 µL reactions, 37 °C for 1 h, with or without 2.75
    µM purified Tet(M). Separate competition used empty E. coli 70S ribosomes at 0.4
    µM, 8 µM radiolabeled tetracycline, room temperature for 2 h and nitrocellulose
    capture. TP-434 competition IC50 was 0.22 ± 0.07 µM, supporting an overlapping
    tetracycline ribosome site. This is not a Kd, growth MIC or atom-resolved binding
    structure. Exact isolated salt form is not specified in the inspected Methods.
