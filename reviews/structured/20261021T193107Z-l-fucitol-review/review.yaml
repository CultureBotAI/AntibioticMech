- evidence_id: crystal2008
  kind: primary_source
  reference: PMID:21203146; DOI:10.1107/S1600536808020345; PMC2962223
  locator: Full original main text and supplementary crystallographic text read; Figure
    1 viewed.
  accessed_at: '2026-10-21T19:23:48Z'
  support: supports
  summary: The crystal report identifies 1-deoxy-D-galactitol as L-fucitol and prepares
    it by hydrogenating L-fucose. Figure 1 explains the rotated Fischer representation.
    The measured formula is C6H14O5 and the reported rotation is positive. Friedel
    pairs were merged and absolute stereochemistry was assigned from the starting
    material, so this is not an independent anomalous-scattering assignment of the
    absolute hand. No antibacterial experiment is reported.
  snapshot_sha256: 4c85ce2bd929f0aedc5deec6d6bacecc7f93516bf32d3d2c85c383c676b935ab
- evidence_id: activity1982
  kind: primary_source
  reference: PMID:7042910; DOI:10.1099/00221287-128-3-601
  locator: Complete original four-page article, including Methods on p601, Tables
    1/2 and results/discussion.
  accessed_at: '2026-10-21T19:23:48Z'
  support: supports
  summary: L-fucitol and comparison sugar alcohols were made by sodium-borohydride
    reduction and explicitly used as their borate esters. Galactitol-positive E. coli
    K12 derivatives were inhibited on glycerol minimal medium at 30°C. Selection used
    20 mM glycerol and approximately 5 mM inhibitor; this is not an MIC. D-fucitol
    was not inhibitory and Salmonella typhimurium LT2 was not inhibited under these
    conditions. These results support a narrowly qualified antibacterial role involving
    L-fucitol-derived material, not a general free-parent potency or bactericidal
    claim.
  snapshot_sha256: 31fdad302104686658a8f787020ad0c58aeb73817812e5328f3b5eb59203368d
- evidence_id: mechanism1982
  kind: primary_source
  reference: PMID:7042910; DOI:10.1099/00221287-128-3-601
  locator: Original strain/genotype comparison, phosphotransferase Table 2 and final
    mechanistic interpretation.
  accessed_at: '2026-10-21T19:23:48Z'
  support: context_only
  summary: Resistance associates with loss or inducibility of galactitol utilization.
    Table 2 assays galactitol phosphotransferase activity rather than direct L-fucitol
    binding. Accumulation of a toxic phosphorylated analogue is an interpretation,
    not a measured L-fucitol-phosphate endpoint. This study does not prove that the
    fucose-isomerase ligand interaction in later structural papers causes whole-cell
    inhibition.
  snapshot_sha256: 31fdad302104686658a8f787020ad0c58aeb73817812e5328f3b5eb59203368d
- evidence_id: enzyme-abstracts
  kind: primary_source
  reference: PMID:9367760 DOI:10.1006/jmbi.1997.1280; PMID:20123133 DOI:10.1016/j.bbapap.2010.01.018;
    PMID:24333485 DOI:10.1016/j.jmb.2013.12.006
  locator: All three complete indexed original abstracts read; full articles not obtained.
  accessed_at: '2026-10-21T19:23:25Z'
  support: context_only
  summary: The 1997 E. coli fucose-isomerase structure places L-fucitol at the catalytic
    centre coordinating manganese; the 2010 Bacillus pallidus isomerase complex similarly
    treats it as an inhibitor. These are direct enzyme-ligand contexts, not antibacterial
    causal evidence. The 2014 pneumococcal FcsI/FcsK/FcsA study concerns fucose utilization
    and does not identify an exact L-fucitol antibacterial experiment in its abstract.
    No direct-target object is inferred from these leads.
  snapshot_sha256: bbd4a00dba58f5b5f00651cd2796f0f2c00225fa6428d0f627f77c9944bd9d3f
- evidence_id: other-adopted
  kind: primary_source
  reference: PMID:12377243 DOI:10.1016/S0031-9422(02)00288-1; PMID:6053331 DOI:10.1016/S0021-9673(01)85975-6
  locator: Complete 2002 original abstract and 1967 bibliographic record; the latter
    has no indexed abstract.
  accessed_at: '2026-10-21T19:23:25Z'
  support: context_only
  summary: The 2002 paper reports isolation of L-fucitol from the water-soluble methanolic
    fraction of Carum carvi fruit, supporting plant occurrence but not nutmeg or antibacterial
    activity. The 1967 analytical paper concerns chromatographic fucose determination
    as tritiated fucitol; without its full text no biological or exact isotope-free
