limitations:
- The 2008 original crystal report and 1982 original four-page growth study were fully
  read. Absolute stereochemistry in the crystal report was chemically correlated to
  L-fucose, with Friedel pairs merged; no independent anomalous-scattering assignment
  is claimed.
- The 1982 biological material was explicitly used as borate esters. The role is retained
  with this qualification; no free-parent MIC, bactericidal potency, or universal
  inactivity conclusion is supported.
- The 2022 main text and Figure 2 were inspected, but supplementary material was not.
  Its fucitol enantiomer and supplier remain unverified; detailed mechanism and transcriptome
  experiments are mannitol-specific.
- All seven adopted citations were dispositioned. The 1997, 2010 and 2014 enzyme papers
  and 2002 occurrence paper were read at complete-abstract depth only. The 1967 analytical
  paper had metadata but no indexed abstract; full text was not obtained.
- The 2018 nutmeg publisher abstract was available but the main compound-specific
  row was not. DrugBank main access returned 403; its official depositor identity
  was inspected through PubChem. The CAS association was corroborated publicly, not
  through a licensed registry.
- The literature search was bounded. Optional activity, mechanism and occurrence enrichment
  requires exact material and assay evidence; absence of those optional fields was
  not counted as a defect.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
