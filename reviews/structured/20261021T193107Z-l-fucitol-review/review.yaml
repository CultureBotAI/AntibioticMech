summary: 'The native L-fucitol structure is valid and agrees with current ChEBI, the
  CCD ligand and the original stereochemical preparation. One major exact-reference
  defect and one minor synonym-scope defect require source-level curation. Primary
  biological evidence is real but material- and strain-dependent: the 1982 study used
  borate esters, and a 2022 fucitol growth study does not specify the enantiomer.
  Neither establishes a universal free-parent antibacterial mechanism.'
