actions:
- action_id: A1
  description: Reassess reactant 902206 against the primary supplement and preserve
    its explicitly reported hemisulfate preparation. Correct the upstream measurement
    representation so this free-base record either carries a justified active-moiety
    interpretation with source conditions or no longer presents the salt experiment
    as an unqualified exact-form association.
  finding_ids:
  - F1
  target_ids:
  - CHEBI:8452
  owner_paths:
  - repository: CultureBotAI/AntibioticMech
    path: data/raw/bindingdb_target_measurements.tsv
    role: Imported target measurement and exact-material provenance
  - repository: CultureBotAI/AntibioticMech
    path: scripts/extract_bindingdb_targets.py
    role: BindingDB source interpretation and assertion mapping
  - repository: CultureBotAI/AntibioticMech
    path: scripts/seed_from_sources.py
    role: Reproducible generated molecular-target representation
  acceptance_checks:
  - Retain the original BindingDB IDs, DOI, value 830 nM and primary Table S3 compound
    SPE_K68408467; do not substitute the DOM_SIM_502 Proflavine row.
  - Explicitly record reported hemisulfate identity and justify any cross-form applicability;
    do not infer an anhydrous free-base preparation from CID 7099 or the normalized
    SMILES.
  - Retain no-DTT conditions and the DTT-sensitive classification. A blank +DTT IC50
    cell must remain unmeasured rather than zero or a negative assay result.
  - Scope the protein measurement to 3CL protease/nsp5, retaining P0DTD1 as the valid
    viral protein example. Keep MEASURED_TARGET_ASSOCIATION unless separate direct-binding
    evidence is inspected.
  - Clarify that generic assay text mentioning X-ray profiling does not establish
    a proflavine crystal complex; the inspected crystal experiment used myricetin.
  - Keep enzyme IC50, cell-based antiviral endpoints and antibacterial MIC separate.
    Do not infer antibacterial mode or clinical efficacy from this assay.
  - Implement through maintained inventory/extractor/seeder owners and rerun focused
    validation, reproducibility, provenance and corpus gates; preserve native scientific
    status until sign-off criteria are met.
limitations:
- The native preprint DOI resolves through the live BindingDB citation; its direct
  bioRxiv body was inaccessible. The corresponding published primary article and official
  ACS Table S3 were inspected, including the exact matching 0.83 µM row. No claim
  is made to have compared every preprint version.
- Eight additional ChEBI primary leads were assessed at abstract/metadata level only.
  Exact reagent and full assay details remain unresolved for those leads; the IARC
  review and the accessible ARO hemisulfate paper were explicitly kept within their
  form and endpoint scopes.
- Direct Reaxys substance detail was unavailable. DrugBank public identity text was
  accessible via the web tool despite a failed direct command-line request. No paid
  or authenticated access was used.
- The source table reports a hemisulfate preparation but uses normalized free-base
  CID/SMILES; solution speciation and active-moiety equivalence were not independently
  established. The finding calls for explicit applicability, not a claim of free-base
  inactivity.
- Structured adapter succeeded after network escalation and supplied no viral dataset.
  Bounded public searches are not an exhaustive absence proof. No native edits occurred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Capture preceded scientific judgment; original hashes were preserved and provenance
  was expanded to 24 inputs, including ARO and BindingDB owners and transforms.
- Ignored and hidden files were included in all local absence searches.
- Native SEEDED status remains unchanged. A measured-association relation is not criticized
  merely for lacking direct-binding proof; the finding concerns the tested preparation
  of an existing quantitative claim.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
