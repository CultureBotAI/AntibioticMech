findings:
- finding_id: F1
  issue_key: chebi-8452-bindingdb-902206-tested-salt-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: The imported 830 nM result omits its reported hemisulfate preparation
  description: The free-base record imports an apparently exact quantitative target
    association through BindingDB monomer 12590. In the published primary Table S3,
    the matching 0.83 µM result is explicitly SPE_K68408467 PROFLAVINE HEMISULFATE,
    while a separate Proflavine preparation has different confirmation results. Both
    source rows carry a normalized free-base structure, so structure-key agreement
    alone cannot establish tested-form identity. Preserve the valid measured datum
    and correct its applicability through explicit reported-material provenance, an
    independently justified active-moiety interpretation or an appropriate exact-salt
    placement. This finding does not assert that the free base lacks activity.
  target_ids:
  - CHEBI:8452
  field_paths:
  - molecular_targets[0].measurements[0]
  - molecular_targets[0].experimental_context
  - molecular_targets[0].evidence
  evidence_ids:
  - record
  - owners
  - bindingdb-reaction
  - primary-table
  - rubric
  rule_id: native-review-checklist:Exact chemical form, Evidence standard and Molecular
    targets
  native_severity: major unqualified exact-material evidence transfer
  normalization_reason: A populated claim-level quantitative association lacks a material
    preparation boundary exposed by the primary source. This is evidence-scope inflation
    rather than a missing optional annotation or a wrong native chemical identity.
  owner_paths:
