    spectrum, not uniform susceptibility, an individual-strain MIC or a clinical outcome.
  snapshot_sha256: 688284456d227a26a950fdb2eaf36b5a41b0b0c3b9e0ee5ffb6a23c545f7d967
- evidence_id: primary-resistance
  kind: primary_source
  reference: PMID:28320717; DOI:10.1128/AAC.00120-17
  locator: Original Tables 2-3, methods and discussion.
  accessed_at: '2026-10-21T19:29:25Z'
  support: supports
  summary: Sequential S. aureus, S. pneumoniae and E. coli mutants show increased
    MICs with gyrA/parC mutations. Incomplete cross-resistance means reduced susceptibility
    is still present. Table 3 reports single-step selection limits after approximately
    70 h at 4, 8 and 16 times MIC; no selected colonies is not proof that resistance
    cannot evolve. No native resistance claim needs correction.
  snapshot_sha256: 688284456d227a26a950fdb2eaf36b5a41b0b0c3b9e0ee5ffb6a23c545f7d967
- evidence_id: primary-enzymes
  kind: primary_source
  reference: PMID:28320717; DOI:10.1128/AAC.00120-17
  locator: Original Table 4, footnotes and enzymatic methods.
  accessed_at: '2026-10-21T19:29:25Z'
  support: supports
  summary: Purified recombinant S. aureus gyrase and topoisomerase IV assays give
    wild-type IC50 values 1.7±0.4 and 0.73±0.06 µg/mL, respectively; GyrA Ser84Leu
    and ParC Ser80Phe enzymes give 17±3 and 2.8±0.3 µg/mL. Human topoisomerase II
    IC50 is >2400 µg/mL. These are enzyme-reaction inhibition measurements, not Kd
    values or proof of direct binding to every purified subunit. They support bacterial
    type II topoisomerase inhibition at the tested complex scope.
  snapshot_sha256: 688284456d227a26a950fdb2eaf36b5a41b0b0c3b9e0ee5ffb6a23c545f7d967
