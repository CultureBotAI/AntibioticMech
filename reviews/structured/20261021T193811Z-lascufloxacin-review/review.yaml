  locator: Original methods and complete Table 1.
  accessed_at: '2026-10-21T19:29:25Z'
  support: supports
  summary: The study tested 600 Japanese clinical isolates collected 2013-2015, using
    CLSI agar or broth dilution and a modified broth method for Mycoplasma pneumoniae.
    MRSA n=100 had a 0.03-2 µg/mL range and MIC90 2 µg/mL; E. coli n=30 and P. aeruginosa
