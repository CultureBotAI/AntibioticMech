evidence:
- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/clinafloxacin.yaml
  locator: Entire native YAML, including both target qualifications and complete history
  accessed_at: '2026-10-21T13:27:46Z'
  support: supports
  summary: The record describes neutral clinafloxacin, not its hydrochloride. Its
    one pyrrolidine stereocenter is unspecified. The GyrA and GyrB objects explicitly
    lack organism, strain and assay context, cite database terms, and require primary
    evidence. There is no native claim that a particular purified GyrB binding experiment
    has been performed.
- evidence_id: chemistry
  kind: validation
  reference: PubChem:60063; ChEMBL:CHEMBL278255
  locator: 310-authority-chemistry.json;310-chemistry.py/.log;310-pubchem.json;310-chembl.json
  accessed_at: '2026-10-21T13:27:46Z'
  support: supports
  summary: Native SMILES and InChI, PubChem SMILES and InChI, and ChEMBL canonical
    SMILES, InChI and molfile all yield QGPKADBNRMWEQR-UHFFFAOYSA-N, C17H17ClFN3O3,
    charge 0, with mutual chirality-aware atom mappings. Average mass 365.792 agrees
    with rounded native 365.8; exact mass 365.094247304 agrees. Each encoding has
    one unspecified stereocenter. This consistent partial stereochemical representation
    does not itself establish an experimentally racemic material, and no particular
    enantiomer or hydrochloride is silently substituted.
  snapshot_sha256: 84463ff830523b1b7fa22373b47a1a88523f4e6e19b74375c88716a5e2dc96e3
- evidence_id: aro
  kind: database
  reference: https://card.mcmaster.ca/ontology/40938; https://purl.obolibrary.org/obo/aro.obo
  locator: '310-card-official.html;310-aro-current.obo;310-aro-selected.json: ARO:3004011,0000001,3000733,3003261'
  accessed_at: '2026-10-21T13:22:43.359603Z'
  support: supports
  summary: Current official ARO retains the exact native definition, PMID 3142350,
    CLX exact abbreviation, fluoroquinolone parent, PubChem 60063 and ChEMBL278255.
    Both target terms still assert targeted_by_antibiotic ARO:3004011. The GyrA definition
    describes alpha-subunit binding and carries general gyrase references; the GyrB
    definition describes susceptibility and has no definition bibliography. Neither
    ontology entry supplies an exact clinafloxacin/GyrB primary binding assay. This
    supports preservation of the database assertions with their existing evidence
    qualifications.
  snapshot_sha256: d12ec5d36c55f371079c392492b034d115adb256f8d2ff4a84041c6202f4a1c4
- evidence_id: original1988
  kind: primary_source
  reference: PMID:3142350; DOI:10.1128/aac.32.8.1251
  locator: Original 1988 pp1251–1256;310-1988-p1.png throughp6.png, all six pages
    visually inspected; Figure1 and Table3
  accessed_at: '2026-10-21T13:22:43.930276Z'
  support: supports
  summary: PD127391 was supplied by Warner-Lambert. Figure 1 depicts the native acid
    connectivity without assigning the pyrrolidine stereocenter; the starting salt
    and enantiomeric composition are not established. The paper measures susceptibility,
    MBC, medium/pH effects and serum protein binding. It does not directly measure
    gyrase binding or DNA cleavage. Table 3 reports unchanged PD127391 MIC 0.008 microgram/mL
    for E. coli KL16 and its nalD mutant, while ciprofloxacin changes from 0.004 to
    0.06. The Discussion connects nalD with GyrB and raises a possible difference
    requiring further work. This is a bounded mutant observation, not proof that clinafloxacin
    cannot interact with GyrB. It supports antibacterial identity/activity but cannot
    alone carry all mechanistic clauses in the native definition.
  snapshot_sha256: 4fbd73599ecce7cbf8678d93744676c22a5b626d290de76bbf1b8cd6b6546448
- evidence_id: genetic1998
  kind: primary_source
  reference: PMID:9797208; DOI:10.1128/aac.42.11.2810
  locator: '310-primary1998.html: complete Methods, Results, Tables1–3 and Discussion'
  accessed_at: '2026-10-21T13:22:43.359699Z'
  support: supports
  summary: S. pneumoniae 7785 and derived mutants were tested with clinafloxacin hydrochloride
    from Parke-Davis, using brain-heart-infusion agar with 10% horse blood. Individual
    gyrA or parC mutants show small twofold MIC changes, whereas double mutants show
    a larger change; stepwise selections alternate changes in gyrase and topo IV.
    The GyrB E474K first-step mutant supports a target-associated genetic effect,
    not isolated GyrB binding. The authors infer comparable but unequal cellular targeting,
    with a modest gyrase preference, and explicitly leave molecular determinants unresolved.
    These strain-specific hydrochloride results are active-moiety evidence, not measurements
    on isolated neutral acid or proof of universal target preference.
  snapshot_sha256: 8d4cdfc62a31cbf2774d70abd11c215d75739443f5d66744c1499d1cfb9cbf0a
- evidence_id: enzyme1999
  kind: primary_source
  reference: PMID:10223925; DOI:10.1128/aac.43.5.1129
  locator: '310-primary1999.html: complete Methods, Results, Table1 and Discussion'
  accessed_at: '2026-10-21T13:22:43.359759Z'
  support: supports
  summary: Purified recombinant His-tagged S. pneumoniae 7785 GyrA/GyrB and ParC/ParE
    subunits were reconstituted into active enzymes. Clinafloxacin hydrochloride from
    Parke-Davis inhibited gyrase supercoiling and topo IV decatenation and promoted
    enzyme-mediated plasmid linearization after SDS/proteinase K treatment. Table
    1 reports gyrase supercoiling IC50=2.5 micromolar and cleavage CC25=2.5 micromolar;
    topo IV cleavage CC25=0.1 micromolar. These are enzyme endpoints, not MICs. The
    stronger topo IV preference in vitro contrasts with the genetic cellular targeting
    results, and the Discussion distinguishes affinity, intracellular conditions and
    downstream lethality. This directly supports cleavage-complex activity, but it
    does not independently measure ligand binding to purified GyrB alone.
  snapshot_sha256: 91c3ab74153e55fac6399cba937944698d2af6215792580d5eecc54f47a19926
- evidence_id: structure2016
  kind: primary_source
  reference: PMID:27655731; DOI:10.1098/rsob.160157; PDB:3RAD
  locator: '310-primary2016.xml: Methods, Figure6, Figures7–8, Tables5–6 and Results;310-pdb3rad.json'
  accessed_at: '2026-10-21T13:23:26.146952Z'
  support: supports
  summary: The original paper studies new bridged fluoroquinolones and includes actual
    clinafloxacin comparator experiments and the clinafloxacin topo IV-DNA complex
    3RAD. Figure 6 compares drug positions; Table 6 separately reports clinafloxacin
    cleavage activity for wild-type core and mutant topo IV complexes. The ParE475A
    effect and ParC/ParE structural context inform clinafloxacin interactions with
    this S. pneumoniae topo IV system. ParE is not GyrB, so these observations are
    not transferred to the native GyrB object. Novel ACHN245/454 data are likewise
    not relabeled as clinafloxacin. The inspected methods do not independently resolve
    the clinafloxacin comparator solid form or enantiomeric composition.
  snapshot_sha256: 6ebb8d79aa506fc5bde070545f2985831ed4e6d6be3639ba44290b1ff4730d1d
- evidence_id: later-context
  kind: primary_source
  reference: PMID:15047530; DOI:10.1128/aac.48.4.1281-1288.2004
  locator: Complete original abstract in 310-core.json
  accessed_at: '2026-10-21T13:22:07.206831Z'
  support: context_only
  summary: The abstract reports recombinant M. tuberculosis gyrase assays across 22
    quinolones and includes clinafloxacin among the active agents. Full original methods/results
    were not inspected here, and no pooled potency range, exact reagent form, individual
    GyrB binding result or new native quantitative value is adopted from it.
  snapshot_sha256: a83e752af18ba10401c9e9e556dfe79c63ec24d59423c7afc23102c07ac5f0f6
