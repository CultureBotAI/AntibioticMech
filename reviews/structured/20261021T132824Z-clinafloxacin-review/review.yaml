limitations:
- The inspected 1988 paper does not establish starting salt or enantiomeric composition.
  The 1998 and 1999 studies explicitly use clinafloxacin hydrochloride; they support
  active-moiety biology without proving assays on isolated neutral acid.
- Direct clinafloxacin binding to GyrB as a distinct protein is unresolved in the
  inspected sources. Native database provenance and PRIMARY_EVIDENCE_NEEDED are preserved;
  the unchanged nalD-mutant MIC is not a universal no-binding result.
- The 1998 cellular target preference and 1999 purified-enzyme preference differ.
  Their authors discuss this discrepancy; no single universal target hierarchy is
  imposed.
- The 2016 source includes novel compounds and clinafloxacin comparators. Only the
  clinafloxacin portions inform this review, and topo IV ParE findings are not transferred
  to GyrB. Its reported clinafloxacin-comparator solid form and enantiomeric composition
  were not independently resolved.
- PMID 15047530 was inspected only at abstract depth and remains context; no quantitative
  or exact material claim is adopted from it. General bibliography embedded in current
  ontology class definitions was not treated as new native primary evidence.
- Initial direct ARO GitHub retrieval returned404 and an alternate CARD hostname failed
  TLS validation; official PURL and card.mcmaster.ca retrievals succeeded. Europe
  PMC XML requests for 1998 and 1999 returned500, but complete original PMC HTML was
  obtained and inspected. The 2016 XML succeeded.
- Focused checks do not replace the separately recorded full-corpus reference, history,
  term and QC gates or authorize promotion to REVIEWED.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
