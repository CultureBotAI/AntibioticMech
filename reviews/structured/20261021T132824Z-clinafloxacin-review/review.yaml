summary: 'The native neutral clinafloxacin structure, unspecified pyrrolidine stereocenter,
  fluoroquinolone class and three cross-references are supported. Both CARD target
  assertions remain current and are honestly labeled PRIMARY_EVIDENCE_NEEDED. Later
  original experiments support gyrase/topoisomerase IV activity and enzyme-mediated
  DNA cleavage, with material, species and assay limits. One minor provenance correction
  is recommended: the sole definition citation, PMID 3142350, is a susceptibility
  study that does not directly establish the full mechanistic sentence. No wrong-identity
  or wrong-GyrB-target conclusion is justified.'
