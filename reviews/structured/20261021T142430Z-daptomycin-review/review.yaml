    binding to anionic lipids. The study also isolates a drug/PG complex from treated
    B. subtilis168 membranes; this is not a producer claim. Figure 6 is explicitly
    a proposed two-phase mechanism, including a pre-insertion state and tail unfolding.
    The native qualitative membrane target and first four graph edges broadly follow
    this interpretation, but should retain model-versus-observation scope. This paper
    does not directly measure depolarization or establish every bactericidal consequence,
    and it supports the D-Asn compound rather than the native L-Asn graph.
