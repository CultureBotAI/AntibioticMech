- finding_id: F2
  issue_key: daptomycin-indole-smiles-missing-pyrrolic-hydrogen
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: The exported indole SMILES cannot be parsed as the intended aromatic structure
  description: The native and maintained source SMILES encode the tryptophan indole
    as c1cnc2ccccc12 instead of a pyrrolic [nH] representation. Actual RDKit parsing
    fails kekulization. A scratch-only hydrogen correction restores a valid graph
    that matches the stored InChI/key, demonstrating a representation failure separate
    from the Asn epimer problem. A syntax-only repair would leave F1 unresolved.
  target_ids:
