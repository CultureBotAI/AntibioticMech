summary: The record retains L-Asn at residue 2, whereas an adopted primary paper explicitly
  revised natural daptomycin to D-Asn and independently parsed current GSRS, PubChem
  and KEGG DRUG structures confirm that single-centre change. This is an exact-identity
  blocker. A separate major finding concerns an invalid indole SMILES. The nineteen
  MIC observations, BioSamples, qualified CARD relations and membrane studies are
  traceable at the stated depths, but their evidence for natural daptomycin must not
  be assigned automatically to the L-Asn epimer.
