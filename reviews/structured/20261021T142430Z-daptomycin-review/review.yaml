findings:
- finding_id: F1
  issue_key: daptomycin-obsolete-l-asn2-exact-identity
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: The exact record retains L-Asn2 instead of natural daptomycin D-Asn2
  description: The native InChI/key and three explicit exact names retain L-Asn at
    residue 2. The adopted 2005 primary paper expressly corrected this to D-Asn after
    comparison of synthetic stereoisomers with the natural product. Independent current
    GSRS, PubChem21585658 and KEGG DRUG mappings differ from the native graph only
    at the unique Asn alpha carbon, S/L versus R/D; the 2025 native mechanism paper
    visually labels D-Asn2. Current ChEBI and PubChem16134395 still carry the old
    assignment, so authority agreement with those entries does not settle natural-product
    identity. The record therefore misgrounds natural daptomycin evidence to its L-Asn
    epimer. This finding does not establish that the epimer is inactive or that all
    assays should be automatically transferred to a newly chosen structure.
  target_ids:
  - CHEBI:600103
