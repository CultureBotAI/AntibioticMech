limitations:
- The 2005 structural-revision paper was read at complete original-abstract depth
  plus its USDA author record. Direct publisher fulltext/PDF, public deliver and legacy
  PDF routes returned 403; the indexed CiteSeer route failed 404/403. Detailed synthetic
  comparison methods and numerical outcomes were not read or inferred. The explicit
  revision is nevertheless corroborated by independent graph mapping and the original2025
  figure.
- The 2025 main article and Figures 1, 5, 6 were read; raw supplementary spectra and
  datasets were not independently reprocessed, and the appended peer-review history
  was not exhaustively read. Its proposed pre-insertion model is distinct from direct
  observation of every causal step.
- The 1991 paper was read completely from all six original scans. Flow-cell and viability
  exposures differ, and no direct experiment tests the later proposed PG intermediate.
  Its reagent was Lilly daptomycin; a full stereochemical certificate was not provided.
- The 2022 MIC paper main text and all nineteen relevant table rows were read; there
  was no independent laboratory replication. Its own limitation states no repeat or
  alternative-method confirmation. Exact salt/purity and stereochemical characterization
  of its test reagent were not established.
- All fifteen adopted leads were read at complete indexed-abstract depth; only the
  separately identified native primary papers received the deeper scope recorded above.
  Reviews and comments are not primary evidence. Each of the thirty-five CARD determinant
  literatures was not independently audited in full.
- DrugBank direct access returned 403. Its identifier is retained as current source
  attestation and a drug-level link, not a verified same-structure descriptor. Current
  ChEBI and PubChem16134395 still conflict with the natural-product stereo revision.
- Standard InChI parsing yields an imidic-acid tautomer for some amides. External
  atom maps therefore normalized both inputs through Standard InChI; failed unnormalized
  graph matches were not treated as constitutional-isomer findings.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All nineteen captured source input hashes are unchanged. Optional enrichment is
  separate from the two established corrective findings.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
