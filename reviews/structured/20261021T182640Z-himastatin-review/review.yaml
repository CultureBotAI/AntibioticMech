findings:
- finding_id: F1
  issue_key: himastatin-knapsack-exact-xref-connectivity-mismatch
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Remove or qualify the KNApSAcK exact reference until its structure agrees
  description: The native xrefs entry knapsack:C00028345 asserts exact equivalence,
    but the inspected KNApSAcK InChI and SMILES have connectivity key block DHAIKQCMNDLVSH
    rather than OZPNLJQULOIOGU. Both KNApSAcK side chains are sec-butyl/isoleucine-type
    where the independently corroborated native and primary himastatin structures
    contain isobutyl/L-leucine side chains. Equal formula and matching labels do not
    establish molecular equivalence. Preserve the supported native graph and correct
    the maintained exact mapping; resolving all additional external stereochemical
    inconsistencies is not required to demonstrate this connectivity conflict.
  target_ids:
  - CHEBI:190009
