limitations:
- The 2011 adopted biosynthesis paper has no indexed abstract and its original/SI
  routes were unavailable; its title was retained as a lead only. Two 1998 synthesis
  reports, the 2001 retrospective and two P450 papers were read at complete abstract
  depth. The 2022 adopted Science citation is commentary, separately distinguished
  from the actual original synthesis paper.
- Both 1990 papers were read completely, with the decisive antibacterial table independently
  checked visually. The 1996 paper was read only in selected introductory structure
  pages; later revision reports and the 2022 main text prevent treating its obsolete
  assignment as definitive. Original raw spectra were not independently reprocessed.
- The 2022 original main text and Figures 1/4 were inspected, but supplementary experimental
  PDF routes failed or returned challenge HTML. Exact modern strain accessions, full
  MIC protocol and raw supplemental membrane images were not independently read, so
  no complete quantitative enrichment is proposed.
- The 1994 membrane-antagonism study was read at complete abstract depth only. Its
  proposed micellar and in-vivo explanations remain interpretations, not directly
  measured binding or verified in-vivo mechanisms.
- KNApSAcK also contains internally discordant stereochemical encodings. The review
  establishes the decisive connectivity mismatch without claiming to have reconstructed
  a complete corrected external structure. Exact common formula or CAS strings do
  not resolve that conflict.
- Patent inspection covered selected production/identity descriptions rather than
  every example, claim and original scanned page. Preclinical mouse antitumor results
  and producer culture records do not establish human efficacy or clinical approval.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Fetch manifests preserve actual URLs, UTC retrieval times, status, content lengths
  and SHA256 values. Files named .pdf that contain challenge HTML were not treated
  as retrieved supplements.
- The first optional authority-comparison helper attempt exited 1 because its ChemSpider
  JSON-LD extraction expected an exact script tag; after correcting that extraction,
  the same public response parsed successfully and the diagnostic exited 0. This was
  a helper parsing issue, not a native chemical failure.
- The InChI-imported amide/imidic-acid tautomer has different SMARTS matching behavior;
  the side-chain conclusion uses native/external SMILES branches and independently
  computed connectivity keys.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
