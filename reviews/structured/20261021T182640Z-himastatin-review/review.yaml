- evidence_id: knapsack
  kind: authority
  reference: https://www.knapsackfamily.com/knapsack_core/information.php?word=C00028345
  locator: Complete public record, displayed InChIKey, InChI and SMILES; independent
    chemical parsing and side-chain comparison.
  accessed_at: '2026-10-21T18:17:24Z'
  support: refutes
  summary: The page shares himastatin, CAS 126775-74-4 and C72H104N14O20, but its
    parsed InChI and SMILES both have connectivity key block DHAIKQCMNDLVSH rather
    than native OZPNLJQULOIOGU. In particular, its SMILES contains two sec-butyl/isoleucine-type
    side chains instead of the two isobutyl/leucine-type side chains in the native
    graph and primary structure. Its printed and parsed stereochemical keys also differ
    internally; the confirmed constitutional mismatch alone is sufficient to reject
    unqualified exact equivalence. This is not a reason to replace the corroborated
    native graph.
  snapshot_sha256: ed0723d77d49c5404664d2850a34e318360583f82023d5e6b89b98a7b723a442
- evidence_id: isolation1990
  kind: primary_source
  reference: PMID:2211362; DOI:10.7164/antibiotics.43.956
  locator: All five original pages 956-960 read; original page 959, Tables 4-6 also
    independently viewed as an image.
  accessed_at: '2026-10-21T18:17:50Z'
  support: supports
  summary: The original producer is C39108-P210-51, ATCC 53653, isolated from Indian
    soil and then classified as S. hygroscopicus. Fermentation and HPLC monitoring
    support actual production. Serial dilution in Difco nutrient broth gave Gram-positive
    MICs of 0.25-2 µg/mL, including 0.5 µg/mL for E. faecalis ATCC 29212, 1 µg/mL
    for S. aureus ATCC 29213 and 2 µg/mL for B. subtilis ATCC 6633. The table also
    lists E. coli ATCC 33176 at 2 µg/mL despite the prose generalization that tested
    Gram-negative organisms were inactive; other listed Gram-negative values exceed
    500 µg/mL. Mouse P388 and B16 experiments support preclinical antitumor activity,
    with dose-dependent toxicity, not clinical efficacy or approval.
  snapshot_sha256: fda3130d0f79ef80b01d5d0bd2b641814d551de834431feeb1ef2a658d11d7b8
- evidence_id: structure1990
  kind: primary_source
  reference: PMID:2211363; DOI:10.7164/antibiotics.43.961
  locator: All six original pages 961-966 read, including isolation, analytical characterization,
    hydrolysis and NMR interpretation.
  accessed_at: '2026-10-21T18:17:50Z'
  support: supports
  summary: Isolated material was reported above 95% purity by HPLC and proton NMR
    before crystallization. Formula and mass support the native composition; hydrolysis
    identifies D-valine, L-leucine and D-threonine. The leucine assignment independently
    supports the native side chains and conflicts with the KNApSAcK sec-butyl connectivity.
    The paper still considered alternative overall arrangements, so it is not treated
    as the final complete stereochemical assignment. Crystallization using aqueous
    nicotinamide does not establish a native nicotinamide salt.
  snapshot_sha256: cd6dbd1f480bf3d4b1028c11a752d0966a048cb22e523c4d5d19b0b8c8327c1a
- evidence_id: stereo-history
  kind: database
  reference: PMID:8626248; DOI:10.7164/antibiotics.49.299; PMID:29711127; DOI:10.1002/(SICI)1521-3773(19981116)37:21<2993::AID-ANIE2993>3.0.CO;2-I;
    PMID:29711142; DOI:10.1002/(SICI)1521-3773(19981116)37:21<2995::AID-ANIE2995>3.0.CO;2-6;
    PMID:11205026
  locator: Selected original 1996 pages 299-301 and complete indexed abstracts of
    the two 1998 synthesis/revision reports and 2001 synthesis retrospective; later
    full texts not obtained.
  accessed_at: '2026-10-21T18:17:24Z'
  support: context_only
  summary: The 1996 structure work established the dimeric framework but included
    an assignment subsequently revised. The 1998 reports describe synthesis of the
    initially proposed stereoisomer, revision from anti-cis to syn-cis in the cyclotryptophan
    unit, and confirmation by synthesis. The native cyclotryptophan alpha carbons
    are S and are consistent with the corrected structure in the independently read2022
    original. The historical 1996 assignment is not used to manufacture a native stereo
    error, and the 2001 retrospective is not misclassified as a newly inspected primary
    experiment.
  snapshot_sha256: acd72258f64a7319ca7490dc1c839cc7fad9d3fb9293da70eb5186b9297f32e8
- evidence_id: synthesis2022
  kind: primary_source
  reference: PMID:35201890; DOI:10.1126/science.abm6509; https://pmc.ncbi.nlm.nih.gov/articles/PMC9020136/
  locator: Complete original main text and captions; original Figures1 and 4 independently
    viewed; supplemental experimental PDF unavailable.
  accessed_at: '2026-10-21T18:17:50Z'
  support: supports
  summary: The original synthesis provides natural (-)-himastatin, its enantiomer
    and meso isomer separately, and reports agreement of natural-product spectral
    and rotation data. Figure 1 confirms the leucine side chains and corrected cyclotryptophan
    geometry. The crystallographic example in this paper is diketopiperazine (+)-7h,
    not a himastatin crystal. Figure 4C reports natural himastatin MICs of 1 µg/mL
    for B. subtilis,2 for MRSA,1 for MSSA,1 for each tested E. faecalis category and
    8 for the producer. Detailed strain accessions and assay protocols in the unavailable
    supplement were not independently checked; these values are contextual, not proposed
    as fully curated native measurements.
  snapshot_sha256: d08a24318e054d05c03287556eb2df2ff03916ba6b6849351bd85ab16ff74e23
- evidence_id: membrane2022
  kind: primary_source
  reference: PMID:35201890; DOI:10.1126/science.abm6509
  locator: Complete main-text membrane experiments and Figure 4; distinction between
    unmodified compound, fluorescent heterodimer and inactive fluorescent homodimer.
  accessed_at: '2026-10-21T18:18:34Z'
  support: supports
  summary: Unmodified himastatin caused FM4-64-labelled membrane thickening and SYTOX
    Green permeabilization in B. subtilis under the reported exposure. Envelope/septal
    fluorescence localization used a TAMRA-labelled heterodimer with a higher MIC
    than natural himastatin. Similar activities of natural, ent and meso forms support
    the authors membrane-perturbation interpretation but do not prove absence of every
    stereospecific interaction. No specific bacterial protein binding, chemically
    identified lipid target or producer resistance gene is established by these experiments.
    Proposed producer efflux/enzyme explanations remain speculation; raw supplemental
    images were not independently read.
  snapshot_sha256: 1498de33e0d715262b72a794825b85537d92ef38cc9d0e16b8856e73b325510d
- evidence_id: membrane1994
  kind: primary_source
  reference: PMID:7872760; DOI:10.1128/AAC.38.11.2633; https://pmc.ncbi.nlm.nih.gov/articles/PMC188254/
  locator: Complete original indexed abstract only; original scan availability identified
    but full ten-page study not independently read.
  accessed_at: '2026-10-21T18:17:51Z'
  support: supports
  summary: The abstract reports fatty-acid-salt antagonism of antibacterial activity
    and reduced cytotoxic activity in sodium palmitate. It interprets loss of apparent
    activity as possible micellar trapping and suggests membrane interactions. This
    is supportive mechanism context, not a measured direct lipid-binding constant,
