  locator: Complete available ChEBI and PubChem structure responses, independent CAS
    query, public ChemSpider identity/structure data, and native/authority parsing.
  accessed_at: '2026-10-21T18:23:40Z'
  support: supports
  summary: Seven encodings reproduce the same full key, formula, charge and assigned
    stereochemistry. The CAS lookup returns the same PubChem compound. Native SMILES
    and InChI are internally consistent and focused masses pass. InChI import selects
    an amide/imidic-acid mobile-H representation, so amide-specific side-chain SMARTS
    counts on that imported tautomer are not interpreted as residue absence. The SMILES
    branch diagnostic independently finds two leucine-type side chains.
