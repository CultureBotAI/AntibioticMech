findings:
- finding_id: F1
  issue_key: gramicidin-family-mapped-to-single-peptide-structure
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: The gramicidin family is emitted as one exact peptide
  description: 'The definition and exact ARO3000123 grounding explicitly denote a
    family containing distinct linear peptides, a mixture and cyclic S, while the
    chemical_structure and PubChem xref encode one linear peptide. Current ARO repeats
    this mismatch, so faithful import does not resolve it. The corpus explicitly excludes
    families and mixtures from individual compound records. Resolve the family source
    at its maintained owner, ordinarily through an exclusion decision unless a separately
    justified exact-compound identity is established. Do not simply rename this graph
    to natural gramicidin A: explicit residue mapping shows L-Val8, while the inspected
    natural-A figure shows D-Val8. Do not merge the distinct sibling records or transfer
    their assays to this graph.'
  target_ids:
