  locator: Ignored- and hidden-inclusive local search, complete current authority
    checks and bounded exact-key, gramicidin and L-Val8 primary-literature searches.
  accessed_at: '2026-10-21T17:47:28Z'
  support: context_only
  summary: Local searches included ignored files. The native target names a membrane
