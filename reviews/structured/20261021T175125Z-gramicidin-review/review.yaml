- evidence_id: native
  kind: record_content
  reference: data/antibiotics/antibacterial/gramicidin.yaml
  locator: Complete YAML, including both exact xrefs, source concept, structure, membrane
    target and all four history events.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: The MINTED, SEEDED record defines a family containing linear gramicidins
    A/B/C, the D mixture and cyclic S, yet encodes one neutral C99H140N20O17 peptide
    with key ZWCXYZRRTRDGQE-SORVKSEFSA-N. Its membrane target is explicitly MEMBRANE/ATTACKED_COMPONENT
    and DATABASE_ASSERTION_ONLY, with no stated organism, strain or assay. No quantitative
    activity, resistance, producer, clinical, dataset or causal-graph object is asserted.
- evidence_id: owners
  kind: record_content
  reference: 512-raw-rows.json; data/raw/aro_antibiotics.tsv:70; data/raw/aro_target_edges.tsv:74;
    data/raw/pubchem_structures.tsv:14; conf/aro_target_roles.tsv:3; conf/sources.yaml;
    scripts/extract_source_inventory.py; scripts/enrich_pubchem_structures.py; scripts/seed_from_sources.py
  locator: Complete exact maintained rows and applicable extraction, PubChem enrichment,
    mint, class and target emission logic.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: The ARO row supplies the family definition, PMID18745784 and PubChem16130140.
    Enrichment adopts that CID graph and the seeder emits one record. The membrane
    edge and its role mapping faithfully reproduce the source. The mint recomputes,
    and the four source events do not imply scientific review. This is a maintained
    source-resolution problem, not a hand-edited native discrepancy.
  snapshot_sha256: b7f80503cf48c025a5436d189540aa7b0f1de4542e78eadc150f320faa881239
- evidence_id: policy
  kind: record_content
  reference: docs/HARMONIZATION.md
  locator: The unit of the corpus is a structure; identity resolution and merge limits,
    structural class and class assignment sections.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: The corpus requires one chemical structure per record and explicitly excludes
    classes and mixtures as individual compounds. A supplied InChIKey does not independently
    prove that an upstream family denotes that exact structure. Source-level exclusion
    or exact identity resolution must precede reseeding; distinct congeners must not
    be collapsed merely because a family source carries one CID.
- evidence_id: aro
  kind: database
  reference: https://purl.obolibrary.org/obo/aro.obo; ARO:3000123; ARO:3009657; ARO:3000710;
    https://card.csu.mcmaster.ca/ontology/36262
  locator: Complete current family, class and target stanzas in the official OBO snapshot,
    plus current CARD family page.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: Current ARO explicitly defines gramicidin as the same family, with separate
    A/B/C/S/D children, and associates PubChem16130140 and PMID18745784. The broader
    class is nonribosomal peptide antibiotics. The membrane term explicitly targets
    the family concept, so the native database edge is accurately copied; it does
    not independently establish a direct experiment on the single native graph.
  snapshot_sha256: df37a7d69a742ef99ec05c31c6e691c8007746ff77143c94422a8f1557d2e571
- evidence_id: chemistry
  kind: authority
  reference: pubchem.compound:16130140; 512-authority-chemistry.json; 512-residue-map.json
  locator: Complete current PubChem property and synonym responses; independent native
    and authority SMILES/InChI parsing and explicit residue tracing.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: All four encodings agree on formula, charge, full key and fourteen assigned
    alpha-carbon centres. The graph is a linear N-formyl, C-ethanolamide pentadecapeptide
    with the Val-A composition, not a representation of all linear and cyclic family
    members. Explicit tracing gives L-Val at position 8. Current source names include
    broad and conflicting depositor labels, which cannot turn this graph into a family
    or independently prove natural-product identity. Source mass precision is internally
    acceptable in the focused diagnostic.
  snapshot_sha256: cda474ef9af638323875865a3f449295d027d720b34762024a9a7061fb94ff66
- evidence_id: adopted
  kind: database
  reference: PMID:18745784; PMC1634171; https://pmc.ncbi.nlm.nih.gov/articles/PMC1634171/
  locator: Complete indexed metadata and both original scanned pages 256–257 visually
    read; W. H. Manwaring, 1940, Dubos’ “Gramicidin.”
  accessed_at: '2026-10-21T17:43:48Z'
  support: context_only
  summary: The sole adopted reference resolves to an editorial, not a primary structure
    determination, and has no indexed abstract. It summarizes earlier work on soil-bacillus
    extracts, preliminary animal activity and bovine mastitis treatment. It does not
    establish the modern A/B/C/D/S composition, a fifteen-residue sequence, exact
    stereochemistry or the native membrane relation. Historical extract outcomes cannot
    be transferred to the single encoded graph. No DOI is supplied by the inspected
    metadata.
  snapshot_sha256: bc314cb238f9fd7a9bfbbaf5edee91c632c4d470cfc499b408eb3542f90f316d
- evidence_id: reference1967
  kind: primary_source
  reference: PMID:5299675; PMC2476309; https://pmc.ncbi.nlm.nih.gov/articles/PMC2476309/
  locator: Original WHO reference-standard study, independently viewed pages 447–449
    and 453–454, including Table1; other pages not independently assessed.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: The study explicitly distinguishes the complex A/B/C reference preparation
    from gramicidin S. Countercurrent distribution reports approximately 50% A, 7%
    B and 25% C by weight. Turbidimetric assays use Streptococcus faecalis strains
    with laboratory-specific conditions and compare preparation potency, not MICs
    of this exact graph. Composition affects assay comparability. Its historical phrase
    about very little gramicidin D is not automatically the modern D-mixture label.
    This primary material evidence independently refutes treating generic gramicidin
    as one chemically uniform constituent.
  snapshot_sha256: 6a74075bf2c6eb7a9a19b51f5f0d3be69ce16ae65da0ce6a3af9ea24d6237b12
- evidence_id: sequence2020
  kind: primary_source
  reference: DOI:10.1038/s41467-020-18711-2; PMC7531004
  locator: Original Figure1 independently viewed; no claim of full-paper review or
    transfer of its MIC data.
  accessed_at: '2026-10-21T17:47:28Z'
  support: supports
  summary: Figure1 depicts natural gramicidin A with D-Val at positions 6 and 8, L-Val
    at positions 1 and 7, the fifteen-residue sequence and its termini. The native
    graph instead has L-Val8. Thus automatic renaming of the family record to natural
    A is not justified by its formula or superficial sequence resemblance. This comparison
    does not identify the encoded epimer as an inactive compound or authorize replacing
    its stereochemistry.
  snapshot_sha256: deb462c5e900588ed3ad59ba9e1dfe955b7f3b4d8d5abf372678ad685c6ca5f3
