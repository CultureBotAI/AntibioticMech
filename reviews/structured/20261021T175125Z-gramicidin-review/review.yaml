    an independently verified exact-compound resolution that does not equate the family
    with an arbitrary representative. Preserve the upstream family as class/context
    where supported.
  - Do not choose a replacement graph solely from CID synonyms, formula or the current
    graph. Verify any exact linear congener and all stereocentres with primary evidence;
    keep cyclic S, other congeners and mixtures distinct.
  - After the authorized source decision, rerun inventory/enrichment/seeding as applicable,
    focused schema and strict validation, corpus reproduction and collision checks.
    Confirm that family-level membrane provenance and historical extract activity
    are not promoted to experiments on an exact peptide.
limitations:
- The entire native record and actual maintained rows were assessed. The sole adopted
  reference was read as both complete scanned editorial pages, not treated as a primary
  structure or mechanism study.
- The 1967 primary reference-standard study was independently inspected on pages 447–449
  and 453–454, including Table1. The remaining pages were not independently reviewed.
  Its component nomenclature is historical and cannot be assumed identical to modern
  mixture naming.
- Only Figure1 of the 2020 primary gramicidin A paper was independently assessed for
  sequence and stereochemical comparison. No quantitative activity or mechanism from
  that paper is transferred to the native graph.
- The exact experimental identity and antibacterial activity of the encoded L-Val8
  peptide remain unresolved. This is not proof of inactivity, a comprehensive literature
  absence claim or a proposed stereochemical correction.
- No new clinical, resistance, producer, quantitative activity or causal-graph claims
  were added. Optional missing fields are not findings.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
