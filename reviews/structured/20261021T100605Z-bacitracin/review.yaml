  acceptance_checks:
  - The variable mixture is not represented as one molecular formula/structure in
    the exact-compound corpus.
  - 'Do not simply strip zinc or substitute native A: independently verify complete
    connectivity, charge, metal stoichiometry and stereochemistry of any retained
    salt entity.'
  - Document and correct/suppress the upstream CID57402735 mapping; the thiazoline
    connectivity difference must not propagate.
  - Keep BahA zinc-bacitracin screening distinct from A-specific MS product characterization;
    no universal congener substrate claim.
  - Preserve valid curator-owned WP5060 process correspondence/history through an
    explicit reviewed migration or disposition, not silent regeneration loss.
  - Run source regeneration, identity/duplicate, target/resistance, pathway-link,
    schema, term, reference and history gates; retain SEEDED pending scientific sign-off.
limitations:
- The adopted1993 article was available as metadata/abstract plus scanned page links;
  direct PDF returned browser verification and alternative PDF403. Full producer/definition
  citation support was not claimed.
- BahA screening used zinc bacitracin, while structural characterization used bacitracin
  A. Preparation equivalence to the native graph and universal congener activity are
  not established.
- No Paenibacillus LC231 dataset was available in the structured adapter. E.coli gene-context
  hits do not establish drug response or efficacy.
- The curator pathway link was checked against its immutable committed index and current
  official WikiPathways page; this is process correspondence, not independent review
  of every pathway protein or reaction.
- A correct molecular representation of a variable mixture cannot be inferred from
  the generic name. Any independently retained zinc form requires separate complete-structure
  adjudication.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All26 captured input hashes rechecked unchanged. No native/source-table, status
  or history edits.
- Initial chemical helper assumed a ChEBI mint; actual ARO mint passes. This helper
  error is not a native defect.
- Optional blank fields are not findings. Existing curator-owned related_records must
  not be lost during later identity/source remediation.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
