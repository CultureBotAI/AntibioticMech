  support: supports
  summary: Current CID matches native two-component C66H101N17O16SZn, neutral total
    charge and key NKULICGUDKGGRL-FCHFGNCGSA-L. It contains an organic dianion plus
    Zn2+, not a representation of the variable multicomponent bacitracin mixture.
  snapshot_sha256: 8c222e64578a85a7163e518c1cb21af73db87d336fa0b50bb614f9a4091215a9
- evidence_id: chemistry
  kind: validation
  reference: Independent RDKit and actual ARO mint
  locator: Native SMILES/InChI
  accessed_at: '2026-10-21T09:54:20Z'
  support: supports
  summary: Both encodings parse and agree internally on formula, full key, two fragments,
    neutral total charge and masses. Twelve tetrahedral centres are specified and
    three remain unspecified. Actual ARO mint reproduces. Internal consistency does
    not establish exact source equivalence.
  snapshot_sha256: 240aeb49c230c7e9eff970b568bb27413b0c5aa312fa76da3410753bbf21bb29
- evidence_id: ring
  kind: validation
  reference: Independent salt-neutralized connectivity comparison
  locator: Native organic component versus independently supported bacitracin A
  accessed_at: '2026-10-21T09:55:13Z'
  support: refutes
  summary: After removing Zn and neutralizing the organic component, its connectivity
    key is MNJKVJAYSVAQLU, whereas natural A has CLKOFPXJLQSYAH. The native heterocyclic
    carbon bearing the peptide carbonyl neighbors sulfur and carbon; the primary-supported
    A counterpart neighbors nitrogen and carbon. Thus the graph also has a positional
    thiazoline connectivity difference, independent of salt, protonation or stereochemical
    omissions.
  snapshot_sha256: 6f2767b1d2651b3120344b0d5261c2e9a7bf0d8ab62dc44cc752292707807475
- evidence_id: mixture-primary
  kind: primary_source
  reference: https://doi.org/10.7164/antibiotics.48.233
  locator: PMID7730158; full primary isolation/structure/activity paper, Figures3/4
    and Tables3/5
  accessed_at: '2026-10-21T09:47:49Z'
  support: supports
  summary: Primary separation establishes bacitracin as multiple related congeners
    with different composition, substitution positions and activity. Its natural A-type
    thiazoline structure supplies the reference for the native graph comparison. One
    molecular formula, even with zinc, cannot encode the variable mixture.
  snapshot_sha256: 37a8ee478fcf7f842b7ee036c11b1babe6d8715f1c5fd699c2b15f44df89d5b1
- evidence_id: structure-primary
  kind: primary_source
  reference: https://doi.org/10.1073/pnas.1308268110
  locator: PMID23940351/PMC3761639; full primary Methods/Results and visually inspected
    Figure1
  accessed_at: '2026-10-21T09:41:37Z'
  support: partial
  summary: HPLC-purified A provides direct carrier-pyrophosphate recognition evidence.
    Crystal uses a C10 geranyl-pyrophosphate ligand, while separate liposome SPR assays
    use C55 undecaprenyl pyrophosphate. The natural chemical drawing confirms the
    thiazoline connectivity. These exact-A results contextualize the generic mixture
    mechanism but do not validate the native zinc graph or every congener.
  snapshot_sha256: 43279f525170ffc0cd06bc549e56f139be135503f6b8d8026a6ad4e035a929a5
- evidence_id: definition-citation
  kind: primary_source
  reference: https://doi.org/10.1128/jb.175.12.3784-3789.1993
  locator: PMID8389741/PMC204795; indexed abstract and citation metadata
  accessed_at: '2026-10-21T09:54:30Z'
  support: partial
  summary: The adopted citation resolves to E.coli bacA amplification/resistance experiments.
    The abstract proposed an isoprenol-kinase interpretation historically; it is not
    used to redefine current BacA activity or as direct support for every producer/mixture
    clause. Main article is scanned and PDF retrieval failed, so full definition-source
    support remains partial.
  snapshot_sha256: 8347bf0442c723076945f27987bcdc01b51ca8e791a505373c8f03e8e13c9663
- evidence_id: baha
  kind: primary_source
  reference: https://doi.org/10.1038/ncomms13803
  locator: PMID27929110/PMC5155152; full BahA Results, Figure2 caption, Methods Identification
    of BahA, cloning and structural characterization
  accessed_at: '2026-10-21T09:55:04Z'
  support: supports
  summary: Paenibacillus sp. LC231 BahA was identified through genomic-library inactivation
    screening with zinc bacitracin and K.rhizophila overlay; heterologous E.coli BL21(DE3)
    expression conferred resistance/inactivation. For structural characterization,
    LC231 cells were incubated specifically with bacitracin A; tandem MS identified
    Asn12-to-Asp12 amidohydrolysis. The study supports the resistance mechanism at
    those preparation/host scopes; it does not identify the native alternative zinc
    graph as substrate or establish all congeners equivalently.
  snapshot_sha256: 0116222a9edc851811478f62d4012742903034b7ac166ddfdf86ed388e2352dc
- evidence_id: adapter
