- finding_id: F1
  issue_key: bacitracin-mixture-mapped-to-zinc-wrong-ring-structure
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the bacitracin mixture mapped to a non-equivalent zinc molecular
    graph
  description: 'The explicit ARO/native mixture concept is assigned one zinc-containing
    PubChem structure. Salt removal does not recover natural A connectivity: the thiazoline
    carbonyl attachment has a different heteroatom adjacency. Three native centres
    are also unspecified. The record therefore lacks a valid exact-compound identity;
    it cannot be repaired by merely dropping zinc or renaming it bacitracin A.'
  target_ids:
