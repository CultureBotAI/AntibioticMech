limitations:
- The original 1963 and 1974 adopted papers were resolved bibliographically but no
  indexed abstract text or free full text was inspected. PubMed HTML requests returned
  challenge content; public indexed records supplied metadata. No commercial document
  delivery was used.
- PMID9578165 was read at complete original-abstract depth. Publisher full-text routes
  returned403/429 or failed, so numerical MIC tables, exact test material and epimer
  composition were not verified.
- US3007920 was read completely as original page images and text. It distinguishes
  epimers and salt/free-acid forms but supplies no measured mixture ratio or individual-epimer
  antibacterial comparison.
- Reaxys13779003 is source-attested but was not independently inspected through paid
  access. All other native chemical/drug xrefs with accessible graph encodings agree.
- The scope finding rests on explicit native and authoritative ChEBI mixture language
  plus the repository rule. An unspecified stereocentre or matching Standard InChIKey
  alone is not proof of a mixture, and no epimer ratio or stereochemical replacement
  is proposed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
