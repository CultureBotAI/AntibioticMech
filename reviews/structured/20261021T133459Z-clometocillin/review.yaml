findings:
- finding_id: F1
  issue_key: clometocillin-explicit-epimer-mixture-corpus-scope
  category: scope
  severity: major
  status: open
  certainty: confirmed
  title: Adjudicate the explicitly defined epimer mixture under the individual-structure
    rule
  description: 'The native definition and current ChEBI131732 explicitly describe
    clometocillin as a mixture of epimers at the methoxy-bearing carbon. The source
    graph consistently leaves that centre unspecified and is not a selected epimer.
    docs/HARMONIZATION.md and the identity checklist require one individual structure
    per record and provide maintained exclusions for mixture concepts. Resolve this
    scope conflict through a source-concept decision: exclude the mixture under the
    current rule, or document a separately justified corpus-policy/representation
    resolution before retaining it. Do not silently erase the mixture wording, assign
    one epimer arbitrarily, or transfer the named-drug activity to both epimers. No
    inference of equal proportions or lack of antibacterial activity is made.'
  target_ids:
  - CHEBI:131732
  field_paths:
  - definition
  - grounding_status
  - chemical_structure
  - source_concepts
  evidence_ids:
  - native
  - chebi-identity
  - unit-rule
  - patent
  - external-identity
  rule_id: 'docs/HARMONIZATION.md: The unit of the corpus is a structure; Mixtures
    and combination products; native-review-checklist: Identity'
  native_severity: major
  normalization_reason: Confirmed mismatch between the expressly described source
    concept and the required corpus unit. The imported graph is internally correct,
    so this is a scope-adjudication problem rather than a fabricated structural parse
    or stereochemical error.
  owner_paths:
  - repository: CultureBotAI/AntibioticMech
    path: curation/decisions.tsv
    role: Adjudicate retained or excluded source-concept scope
  - repository: CultureBotAI/AntibioticMech
    path: data/raw/chebi_antimicrobials.tsv
    role: Preserve authoritative mixture definition and source provenance
  - repository: CultureBotAI/AntibioticMech
