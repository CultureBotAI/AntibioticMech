summary: 'The native graph, formula, masses, source identifiers and independently
  inspected xrefs agree. Named clometocillin has original antibacterial evidence,
  with material and assay-depth limits. One major scope finding remains: the native
  and authoritative ChEBI definition explicitly describe an epimer mixture, whereas
  this corpus requires an individual structure. This is not a claim that an unspecified
  stereocentre alone proves a mixture, nor evidence that clometocillin lacks antibacterial
  activity.'
