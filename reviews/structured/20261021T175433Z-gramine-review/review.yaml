- evidence_id: bacterial
  kind: primary_source
  reference: PMID:24332729; DOI:10.1016/j.chemosphere.2013.11.029; PMID:19131120;
    DOI:10.1016/j.aquatox.2008.11.014
  locator: Complete indexed original abstracts, not full methods
  accessed_at: '2026-10-21T17:50:34Z'
  support: supports
  summary: Exact gramine inhibits the cyanobacterium Microcystis aeruginosa. The earlier
    study reports density-dependent three-day EC50 values0.5–2.1 mg/L, oxidative damage
    and antioxidant responses. These are growth/physiology results, not MICs or proof
    that one antioxidant enzyme is the direct binding target. Desmodesmus and Chattonella
    results are algal endpoints and are kept distinct from bacterial evidence.
  snapshot_sha256: e1b7036eaa66b756a44a710d15adebdcaccb99378f049238a97628a4645e187e
- evidence_id: ev71
  kind: primary_source
  reference: PMID:24979400; DOI:10.3390/molecules19078949
  locator: PMC6271245 XML; Results2.1 and entire Table1/footnotes; Discussion/Conclusion;
    Methods4.1–4.4 read
  accessed_at: '2026-10-21T17:50:34Z'
  support: supports
  summary: The parent gramine row has no EC50, with the dash defined as less than50%
    inhibition;18 synthetic derivatives show activity. Vero/RD assays use100 TCID50
    EV71,1.5h adsorption and48h incubation, with MTT cytoprotection/cytotoxicity.
    The original explicitly reports no observed parent anti-EV71 activity. Derivative4s
    viral-RNA/protein and apoptosis results must not be assigned to gramine.
  snapshot_sha256: b70bebf7e308ba7d353f354848ced8be448ed0566f8dc3d706f5614e962983e5
- evidence_id: influenza
  kind: primary_source
  reference: PMID:34452298; DOI:10.3390/v13081433
  locator: PMC8402863 selected Methods2.1/2.4 and Results3.1/3.2; figure captions,
    not raw images
  accessed_at: '2026-10-21T17:50:34Z'
  support: supports
  summary: Commercial gramine99.45% was screened alongside three other indoles. At
    the tested non-cytotoxic condition, gramine did not suppress viral replication
    in A549 or MDCK cells. The strong influenza and mouse results concern3-indoleacetonitrile,
    not gramine. This assay-specific negative result does not establish universal
    absence of antiviral activity.
  snapshot_sha256: 1d5d6d07ca746aea66f6b31c6eb81f3f610cf2189c6538a9831e79bc30a0ff7f
- evidence_id: tmv
  kind: primary_source
  reference: PMID:30730738; DOI:10.1021/acs.jafc.8b06859
  locator: Complete indexed original abstract and official ACS supplement S3 and S14–15;
    main results table inaccessible
  accessed_at: '2026-10-21T17:50:34Z'
  support: partial
  summary: The study synthesizes parent gramine1 and analogues2–35. Supporting information
    confirms the exact parent structure and N–H resonance and describes tobacco half-leaf,
    protection, inactivation and curative assays. The abstract highlights22,30,31
    and a tentative capsid-assembly mechanism. The parent-specific result table was
    not obtained, so neither parent potency nor that mechanism is adopted. The broad
    antiviral role remains unresolved rather than declared false from a different
    virus assay.
  snapshot_sha256: b41ba9e4ad0445fdf260ec8680a30442244ca2328f484ef532d24278741d4ea7
