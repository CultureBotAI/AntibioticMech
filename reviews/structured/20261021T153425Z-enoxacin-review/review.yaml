limitations:
- LINCS LSM-5848 returned 500 and Reaxys3628995 returned 403; these legacy exact mappings
  remain unverified. DrugBank direct 403 was resolved through inspected official public
  web text.
- All adopted bibliography original abstracts were read, but most subscription full
  texts and all 38 resistance-reference full texts were not obtained. The exact reading-depth
  ledger distinguishes metadata-only PMID15282231, selected full experiments, reviews
  and other-drug comparators. No exhaustive allele validation is claimed.
- Original 1993 and 1990 scans were read through their experimental Results/Discussion
  pages and key actual tables/figures; their final reference-only pages and every
  raw trace were not independently reprocessed. The2006 and 2009 full texts were read
  for the relevant Methods/Results/table scope, not every unrelated comparator.
- No salt/hydrate equivalence is inferred from patent acid-addition salts or labeled-tracer
  assays. No current clinical susceptibility breakpoint, clinical treatment recommendation
  or worldwide product-name exclusivity is established.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
