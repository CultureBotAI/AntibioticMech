summary: The exact neutral enoxacin graph, antibacterial eligibility, bounded gyrase
  mechanism, source qualifications and two historical FDA products are supported.
  The definition incorrectly places fluorine at position 5. Enroxil is an ambiguous
  cross-compound commercial alias requiring disambiguation, and Penetrex is a product
  brand rather than a chemical exact synonym. All 22 resistance assertions retain
  their explicit database evidence boundary; selected originals do not justify unqualified
  transfer of every taxon or allele result.
