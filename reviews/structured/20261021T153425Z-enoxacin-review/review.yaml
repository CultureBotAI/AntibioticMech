- evidence_id: gyrase-original
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC187778/?pdf=1
  locator: PMID8388200, DOI10.1128/aac.37.4.839; actual scanned pp 839–844, Methods,
    Tables 1/3, Figs 3–5
  accessed_at: '2026-10-21T15:12:54.804323Z'
  support: supports
  summary: Original Dainippon enoxacin and Amersham tritiated enoxacin experiments
    used purified reconstituted E. coli gyrase. Binding was appreciable to the gyrase–DNA
    complex, not enzyme or DNA alone. GyrA S83L and GyrB D426N/K447E complexes altered
    functional response. Table 3 enoxacin supercoiling ID50 values are enzyme endpoints,
    not MICs; some Table 1 MICs are attributed to earlier references. This supports
    bounded bacterial gyrase mechanism without asserting isolated-GyrA binding or
    an atomic binding site.
  snapshot_sha256: e905fa2c16cb72e8c8c681f4471250fe2be112dc37baf82e3d2356014ded4067
