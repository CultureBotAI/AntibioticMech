  snapshot_sha256: 3df81531cf1e57edf25a141da45f7d687ce917b3959c1ad1c65a709e955479a7
- evidence_id: mtb-original
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC1346799/?pdf=1
  locator: PMID16377674, DOI10.1128/aac.50.1.104-112.2006; Methods, Tables2/3, enzyme
    Results and Discussion
  accessed_at: '2026-10-21T15:17:44.805869Z'
  support: supports
  summary: Sigma enoxacin was tested using the 1% proportion method on 7H11 agar with
    10% OADC, with MIC defined as inhibition of more than 99% growth. Table 2 H37Rv
    enoxacin MIC 8 micrograms/mL contrasts with clinical A90V isolate64 and N510D
    isolate>64; other mutations show hypersusceptibility and background dependence.
    Purified recombinant gyrase experiments distinguish resistant from hypersusceptible
    mutations. Some comparator rows derive from prior literature; no clinical breakpoint
    or all-mutation resistance generalization is made. Table3 separates enoxacin supercoiling
    IC50 values (WT140, T80A200, A90G35 and double mutant10 micrograms/mL) from the
    resistant-mutant enzyme entries marked ND. Its cleavage panel does not include
    enoxacin. The clinical MIC associations therefore must not be expanded into unmeasured
    enoxacin enzyme results.
  snapshot_sha256: a3b9dbd9f062a6c84b7b1704f4fe88825c4db991922e7a55da5a6901ce02d690
