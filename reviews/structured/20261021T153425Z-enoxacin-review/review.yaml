  snapshot_sha256: 31177905c2b114ceda54bf129c12e80a5ad8bf2c0bbb23f00d48ac50b8aa77e9
- evidence_id: nora-original
  kind: primary_source
  reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC210814/?pdf=1
  locator: PMID2174864, DOI10.1128/jb.172.12.6942-6949.1990; actual scanned pp 6942–6948,
    Methods, Table 1 and Fig. 5
  accessed_at: '2026-10-21T15:12:54.805430Z'
  support: supports
  summary: norA cloned from S. aureus TK2566 increased enoxacin resistance in S. aureus
    and E. coli hosts. Original Table 1 gives SA113 enoxacin MIC 0.39 versus 25 micrograms/mL
    with pTUS20. Radiolabel uptake used10 micrograms/mL enoxacin at 37 °C; CCCP 0.1
    mM restored accumulation. This supports energy-dependent efflux at these hosts
    and constructs, not a generic resistance threshold or all strains.
  snapshot_sha256: 89241e2d2d81db7b2215196a081d08d811a720ced82434c09f2200a87676e13d
- evidence_id: nora-table
