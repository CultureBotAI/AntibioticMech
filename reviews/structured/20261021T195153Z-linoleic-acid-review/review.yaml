  support: supports
  summary: REVIEWED/EXACT CHEBI:17351 denotes neutral 9Z,12Z acid. The curator explicitly
    limits the membrane inference to S. aureus NCTC 8325, records qualitative activity
    without inventing an MIC, and marks the CARD relation as database evidence. No
    separate clinical, producer, dataset or causal-graph objects are present; definition
    claims are assessed separately.
  snapshot_sha256: 0e761219088288bc4a9cedfcf38b0c93cd34359f48b29e499c2231a7ce9de52b
- evidence_id: identity
  kind: validation
  reference: Current ChEBI, PubChem, ChEMBL and NIST structures
  locator: 606-authority-check.py;606-authority-chemistry.json; official fetch ledgers061-root-fetch1/2/3.json
    and606-fetch.json
  accessed_at: '2026-10-21T19:51:18Z'
  support: supports
  summary: Eleven independent encodings from native, ChEBI 17351, PubChem 5280450,
    ChEMBL 267476 and NIST agree on full InChIKey OYHQOLUKZRVURQ-HZJYTTRNSA-N, C18H32O2,
    charge 0 and both cis double bonds by reciprocal chirality-aware graph matching.
    NIST resolves CAS 60-33-3 and lists Linolic acid and Telfairic acid. Four encodings
    of the comparison conjugate base agree on the distinct charge -1 entity.
  snapshot_sha256: 2deb9039d2471914f47e6721ed8a0b00a29df674a317a605b19376f3e6e4fe9a
- evidence_id: alias
  kind: authority
  reference: CHEBI:30245; PubChem:5460332; ARO:3003959; CHEMBL267476
  locator: 606-linoleate-chebi.json,606-linoleate-pubchem.json,606-current-aro-blocks.json
    and606-chembl.json
  accessed_at: '2026-10-21T19:51:18Z'
  support: refutes
  summary: ChEBI and PubChem explicitly distinguish linoleate, C18H31O2/charge -1/key
    ending -M, from the native neutral acid/key ending -N. ARO repeats Linoleate as
    EXACT and ChEMBL lists it as OTHER for the acid; that provider naming ambiguity
    is retained. It does not justify chemical equivalence between the charged and
    neutral entities. Assay acid-base equilibration is a separate question.
  snapshot_sha256: 263c66f1801ae33c56225a70a5ca37303ec277111caf6de5fc0b834c60751c1e
- evidence_id: primary1979
  kind: primary_source
  reference: PMID:93615
  locator: DOI:10.1099/00221287-115-1-233; complete indexed and publisher abstract;606-adopted.json
    and606-browser-evidence.json
  accessed_at: '2026-10-21T19:51:18Z'
  support: supports
  summary: The original abstract associates linoleic-acid growth inhibition in S.
    aureus NCTC 8325 with increased permeability and a probable surfactant effect;
    PC-plasmid sensitization, lipid incorporation and glycerol-auxotroph results are
    qualified. This supports the native attacked-membrane component and qualitative
    activity without a protein-binding or universal bacterial mechanism claim. Detailed
    radiolabel methods and quantitative tables were not independently recovered.
  snapshot_sha256: 833ca5d79647b0ece07d33fc1e80a70e4a77eb0300e95714fe27edf20899d208
- evidence_id: publication
  kind: authority
  reference: https://www.microbiologyresearch.org/content/journal/micro/10.1099/00221287-115-1-233
  locator: Publisher publication/received metadata; Crossref published-print/issued
    and indexed journal date
  accessed_at: '2026-10-21T19:51:18Z'
  support: refutes
  summary: Publisher publication and online dates are1November 1979, with receipt
    15 January 1979. Crossref independently records 1979-11-01 and PubMed records
    November 1979. No inspected source supports native PRIMARY_LITERATURE source_version
    1979-08; the discrepancy concerns provenance, not the paper identity or supported
    membrane result.
  snapshot_sha256: f9c0efbdc48725d4a068a8bd5cffa6c14e577102c6f9e69dbbb7169276312215
- evidence_id: activity2000
  kind: primary_source
  reference: PMID:10925024
  locator: DOI:10.1016/S0367-326X(00)00150-7; complete indexed original abstract in606-adopted.json
  accessed_at: '2026-10-21T19:51:18Z'
  support: supports
  summary: Bioassay-guided isolation from Helichrysum pedunculatum identified linoleic
    acid active against the tested Gram-positive panel at MIC 0.01–1.0 mg/mL. The
    tested Gram-negative panel was inactive. The original full methods and per-strain
    table were unavailable, so this supports antibacterial scope without adding inferred
    strain-specific numerical rows or a universal Gram-negative exclusion.
  snapshot_sha256: 886e3d24d9211581e488a0b901c357b82476d36226791ec21ec805a2bf9a2c8f
- evidence_id: farAB
  kind: primary_source
  reference: PMID:10447892
  locator: DOI:10.1046/j.1365-2958.1999.01530.x; publisher full main Results/Discussion
    and Experimental procedures, Table 1 caption;606-browser-evidence.json
  accessed_at: '2026-10-21T19:51:18Z'
  support: supports
  summary: The original linoleic-acid susceptibility experiments use Sigma beta-cyclodextrin-encapsulated
    material. farB disruption sensitizes FA 19 and clinical AP 697/AP 1107 backgrounds;
    MtrE is required. The authors allow indirect MtrR regulation. These scoped experiments
    support the qualified native resistance association. Numerical Table 1 cells were
    not recovered, and no new MICs or direct regulator binding are asserted.
  snapshot_sha256: 833ca5d79647b0ece07d33fc1e80a70e4a77eb0300e95714fe27edf20899d208
- evidence_id: adapter
  kind: database
  reference: kg-microbe-sources iModulonDB datasets
  locator: 606-adapter-result.json;606-adapter-datasets.txt; dataset inventory executed
    before farAB web follow-up
  accessed_at: '2026-10-21T19:51:18Z'
  support: supports
  summary: The adapter inventory exited 0 after a sandbox DNS failure was retried
    with authorized network access. No covered Neisseria gonorrhoeae dataset matched
    the farAB claim; targeted search/summarize was not applicable. The absence is
    not negative experimental evidence. A membrane component is not a gene requiring
    a protein-example accession.
  snapshot_sha256: 269c7a3c7cc92e84228e051cbce078e8087b5006263de621585495c14d356eae
- evidence_id: sources
