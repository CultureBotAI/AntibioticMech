limitations:
- Original 1979 and 2000 full texts/PDFs were blocked by direct publisher access;
  the complete original abstracts were read. The 1979 radiolabel details and full
  quantitative tables were not independently reverified.
- The 1999 full main was inspected through browser access after direct HTTP 403. Numerical
  Table 1 cells were not recovered. Its material was beta-cyclodextrin-encapsulated
  linoleic acid, and its regulator interpretation allows indirect effects.
- Acid/base equilibration in biological media and colloquial provider naming do not
  establish exact neutral/anion identity; the alias finding does not refute antibacterial
  activity or require changing the neutral graph.
- The focused search returned 67 titles; the broader 1733-hit search returned only
  100 records and was not exhaustive. Six selected follow-up abstracts were read,
  without transferring conjugated-isomer, salt, nanoparticle, derivative or mixed-material
  effects.
- The iModulonDB inventory had no applicable gonococcal dataset; absence from that
  resource is not negative resistance evidence.
- The required shared full-QC gate retains the established platform SciPy import failure.
  Focused native checks and draft-contract success do not substitute for the separately
  recorded shared term/reference/history and full-corpus gates.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All thirteen original input hashes remain preserved within sixteen verified inputs.
  Native records, maintained source files, status and history are unchanged by this
  review.
- Standalone chemistry used the 019 interpreter against 061; native schema/strict,
  source ledger and contract used 061. The initial sandbox adapter DNS failure and
  one system-Python missing-PyYAML scratch helper failure were retried successfully
  and are preserved in the audit ledger.
- All assertions were assessed at their actual source tier. Root supplied initial
  authority/adopted-source snapshots and focused checks; this reviewer independently
  read the complete record, sources and original 1999 main and performed the authority
