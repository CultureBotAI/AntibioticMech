limitations:
- All adopted leads and current ARO cited abstracts were inspected, but most resistance
  primary full bodies and exact doxycycline assay tables were not. Honest database
  assertions are preserved; incomplete direct evidence is not a universal negative
  result.
- The original ribosome experiment used hyclate reagent at 50 micromolar and specified
  E. coli/C. burnetii preparations. It supports binding of the parent moiety, not
  intact anhydrous crystals, universal ancillary sites or causal differences in susceptibility.
- Clinical evidence mixes explicitly identified hyclate/monohydrate products and original
  abstracts without exact solid form. Low-dose periodontal benefit is not equated
  with bacterial killing, and COPD use is not generalized to benefit in every trial
  or exacerbation.
- Tautomer enumeration emitted a maximum-transform warning. The comparison nevertheless
  found explicit reciprocal mappings with stereo removal disabled and original atom-level
  parity preserved; it is not a claim to enumerate all possible tautomers.
- HMDB and DrugBank content remained blocked, MetaCyc required login, and Reaxys was
  not independently inspected. Access failure does not demonstrate a wrong identifier.
- Azudoxat, Doxitard and the exact Vibramycine spelling were not authoritatively resolved
  at the same level as the two confirmed brands. A search excerpt and a differently
  spelled product leaflet were not substituted as proof.
- Patent text inspections establish related synthetic-series and epimer context, not
  full verification of every scanned experimental example. The current native graph
  was independently checked against multiple explicit structures.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The native MIC and generated evidence are not edited. Optional enrichment with direct
  primary target evidence remains a separate curation action.
- Standalone chemistry used the batch019 interpreter against batch038; schema/strict
  and the source ledger used batch038.
- An initial scratch chemistry helper had a missing newline and produced SyntaxError;
  after correction the attempted all-exact comparison failed specifically on the monohydrate.
  Both preparatory logs remain preserved, and the final separated parent/hydrate comparison
  passed.
- The broad source-row capture contains resistance rows for other antibiotics sharing
  determinants; the executed ledger filters antibiotic_id ARO:0000069 and compares
  exactly the fifteen native doxycycline edges.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
