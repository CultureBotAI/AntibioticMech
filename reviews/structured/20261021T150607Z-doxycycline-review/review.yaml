- evidence_id: chemistry
  kind: authority
  reference: CHEBI:50845; UNII:334895S862; PubChem CID54671203; KEGG C06973/D07876;
    LMPK07000001; PDB CCD DXT
  locator: 373-authority-chemistry.json; official ChEBI, GSRS, PubChem, KEGG, LipidMaps
    and CCD snapshots
  accessed_at: '2026-10-21T15:05:37Z'
  support: supports
  summary: Twelve encodings, including the independently fetched CHEMBL1433 candidate,
    map to one neutral C22H24N2O8 doxycycline molecule with six configured centers.
    ChEBI and GSRS agree with native JBIWCJUYHHGXTC-AKNGSSGZSA-N. Different enol/protonation
    encodings were compared by explicit normalization that disables stereo removal,
    preserves atom-neighbor ordering and parity, and requires reciprocal chirality-aware
    matching. Formula and both masses agree. No epimer or salt correction is justified.
  snapshot_sha256: 724de611a8450420aa6729082d28ef2b86ec8c0df9dac63a20bc7910c1223b50
- evidence_id: chembl
  kind: authority
  reference: ChEMBL CHEMBL1200699 and CHEMBL1433
  locator: 373-chembl.json molecule_structures/molecule_hierarchy; 373-chembl-parent.json;
    explicit two-fragment comparison
  accessed_at: '2026-10-21T14:57:30.021737Z'
  support: refutes
  summary: Native xrefs[10] points to CHEMBL1200699, whose full graph contains doxycycline
    plus water and formula C22H26N2O9. Its largest organic fragment matches the parent,
    but its complete formula unit does not. ChEMBL identifies CHEMBL1433 as the parent/active
    molecule; that separately fetched graph matches the native parent with all six
    centers. The mismatch concerns exact cross-reference placement, not the native
    chemical graph.
  snapshot_sha256: c744a79c4b59b30787a0bf5bc8a2dafc6de168473106502752c53a1728e9b31a
- evidence_id: brands
  kind: authority
  reference: Slovak SUKL DEOXYMYKOIN 15/0179/85-CS; Austrian BASG Vibravenös 1-15051
  locator: 373-deoxymykoin.html and .doc sections1-3; 373-deoxymykoin-spc.txt; 373-vibravenos.pdf
    title and section6
  accessed_at: '2026-10-21T14:59:34.821939Z'
  support: refutes
  summary: DEOXYMYKOIN is a named 100-mg tablet product containing 115.4 mg doxycycline
    hyclate equivalent to 100 mg doxycycline. Vibravenös is a named 100-mg/5-mL ampoule
    product containing doxycycline as hyclate. Thus native Deoxymykoin and the ASCII
    rendering Vibravenos should be product-qualified BRAND_NAME aliases, not unqualified
    EXACT_SYNONYM values. Product identity is distinct from free-parent chemical identity.
  snapshot_sha256: 19d056c3370d5c246d686a2931910e1948c27adabfe3aa2be7f5d46d245cf857
- evidence_id: brands-basg
