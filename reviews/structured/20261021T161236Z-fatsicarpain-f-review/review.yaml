limitations:
- The complete adopted abstract and selected original supplement page were read; the
  2011 main article and correction body were not accessible.
- The 2013 parent activity table and relevant Results/Methods were inspected, but
  the assay protocol is deferred to the inaccessible original. No new numeric native
  assay is entered.
- The original supplement drawing is not a full raw-spectrum re-elucidation or independent
  absolute-hand determination. C/F themselves were not the compounds named in the
  abstract as crystallographically characterized.
- Reaxys underlying exact structure remains unverified. Search is bounded and does
  not prove global evidence absence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native record, maintained source or saved review was edited. Optional links and
  tags were checked for the exact compound.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
