limitations:
- Current ChEBI201898 is a two-star imported entry whose default InChI omits all stereochemistry
  and whose aromatic histidine SMILES fails parsing, despite a stereospecified submitted
  name. No opposite native stereoisomer is inferred from that underassignment.
- The optional chemistry helper exited 1 solely on the published PubChem average-mass
  difference. Its actual result remains recorded; schema/strict and the focused sequence/authority
  diagnostic exited 0. The initial authority diagnostic also stopped when its reporter
  did not handle the invalid ChEBI SMILES; the corrected diagnostic records that failure
  explicitly rather than repairing the source.
- The 1987 discovery, 1988 adopted and 1989 membrane papers were read completely as
  original scanned pages. The additional calcein-leakage, proteomic and transcriptomic
  studies were read at complete-abstract depth only; no detailed gene, assay or causal
  claim is transferred from them.
- The1989 experimental lyophilizate contained trifluoroacetic acid and water. It supports
  named-peptide membrane behavior but does not establish the bulk salt/purity of every
  preparation or equivalence of a conjugate or amidated analogue.
- Physiological antimicrobial defense is a supported biological interpretation with
  less direct experimental support in the inspected early papers than peptide identity
  and in-vitro activity. No therapeutic approval or clinical infection efficacy is
  established by these sources.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
