- evidence_id: discovery1987
  kind: primary_source
  reference: PMID:3299384; DOI:10.1073/pnas.84.15.5449; https://pmc.ncbi.nlm.nih.gov/articles/PMC298875/
  locator: All five original scanned pages read, including sequence Figure 3 and precursor
    Figure5; complete Methods, Results and Discussion inspected.
  accessed_at: '2026-10-21T20:13:43Z'
  support: supports
  summary: Purification from female Xenopus laevis ventral skin yielded two distinct
    23-residue peptides. Figure 3 gives the native magainin 1 sequence; partial cDNA
    independently contains magainin 1 and magainin 2 segments. Most numerical antibacterial,
    protozoal and hemolysis experiments are explicitly magainin 2; the magainin 1
    spectrum is described without displayed data. Those magainin 2 numerical results
    are not transferred to this record. The physiological host-defense interpretation
    is presented as a proposed function, not a controlled organismal infection experiment.
  snapshot_sha256: 206ce9eefcce10a569046b76637f9557932991d2482e72bf382883a1df6449fd
- evidence_id: adopted1988
  kind: primary_source
  reference: PMID:3277183; DOI:10.1073/pnas.85.3.910; https://pmc.ncbi.nlm.nih.gov/articles/PMC279666/
  locator: All four original scanned pages read. Tables 1–3 and Figures 1–3 directly
    inspected, with component numbering checked against text.
  accessed_at: '2026-10-21T20:13:43Z'
  support: supports
  summary: Magainin1 is component 5, with the full 23-residue sequence and free carboxyl
    terminus supported by carboxypeptidase analysis and synthetic/natural chromatographic
    comparison. Table 3 reports its strain-specific antibacterial growth-suppression
    ranges, including 1–7 microgram/mL for E.coli D31 and 7–35 for E.coli ATCC25922;
    several other strains exceed 100. The assay used about 10^5 CFU/mL in trypticase
    soy broth, 5 h at 37 C and OD600, with tested steps 1, 7, 35, 70 and 100 microgram/mL.
    These are reported inhibition intervals, not standardized contemporary clinical
    MIC breakpoints. S.cerevisiae X2180 was assessed 12 h at 30 C. Magainin2 protozoal
    images and truncation experiments are not magainin 1 evidence.
  snapshot_sha256: fe0d9ee9a2f8f7368a285ac54173a7bbc627f67efe345bf59bc2e6d2747e3989
- evidence_id: membrane1989
  kind: primary_source
  reference: PMID:2481510; DOI:10.1016/S0006-3495(89)82746-8; https://pmc.ncbi.nlm.nih.gov/articles/PMC1280599/
  locator: All five original scanned pages read, including exact sequence Figure1,
    Methods and conductance Figures 3–4.
  accessed_at: '2026-10-21T20:13:43Z'
  support: supports
  summary: Bachem magainin I was 98% pure by HPLC, with 75% peptide content in lyophilized
    trifluoroacetic-acid/water material. Artificial POPC/DOPE 7:3 bilayers under high
    applied voltages showed anion-selective conductance and distinct single-channel
    events. This directly supports a membrane-active physical mechanism for that preparation,
    but is not a bacterial protein-binding assay or proof that a particular pore model
    operates in every bacterium. The authors distinguish observations from proposed
    aggregation and insertion models.
