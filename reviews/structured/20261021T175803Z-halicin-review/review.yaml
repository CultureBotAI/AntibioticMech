  locator: Publisher correction reproduced on PDF page31, printed page475, read completely
    and visually checked. Corrected figure pages not comprehensively reviewed.
  accessed_at: '2026-10-21T17:50:20Z'
  support: supports
  summary: The correction sets FigureS3A halicin concentrations to 20 and 40 micrograms/mL,
    corrects H37Rv and nfsA spelling, updates prediction-rank/table details and credits
    an earlier unpublished PubChem tuberculosis screen. Its structure correction concerns
    another ZINC compound, not halicin. Visual inspection confirms microgram units
    despite PDF text extraction rendering them as mg. These corrections do not contradict
    the native broad antibacterial definition or the independent 2009 JNK value.
  snapshot_sha256: 1a5db1ac7d05e535cfa1db8243ec28e1ab4312f514b1b147949d2fa969b20df1
- evidence_id: hostcontexts
  kind: primary_source
  reference: PMID:25423094; DOI:10.1371/journal.pone.0113526; PMID:26491845; DOI:10.1016/j.redox.2015.09.040
  locator: Complete abstracts, plus selected original SU3327-focused Methods/Results/Discussion
    paragraphs; no claim of complete host-study review or independent raw-image analysis.
  accessed_at: '2026-10-21T17:48:32Z'
  support: context_only
  summary: The heart study examines 10 micromolar SU3327 in perfused rat hearts and
    discusses JNK/p38 signaling, mitochondrial respiratory changes and adverse recovery.
    The liver study uses SU3327 as a JNK-pathway intervention and associates reduced
    JNK activation with altered mitochondrial phosphorylation and liver injury. These
