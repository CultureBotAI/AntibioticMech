  accessed_at: '2026-10-21T17:48:17Z'
  support: supports
  summary: 19271755 is the 2009 JNK medicinal-chemistry study. 24838066 studies mechanically
    injured human astrocytes and JNK-inhibitor pretreatment, not bacteria. 25423094
    studies rat-heart ischemia/reperfusion and reports context-dependent adverse mitochondrial
    effects of SU3327; it is not a general protective-effect claim. 26491845 studies
    CCl4-exposed mouse liver, JNK activation and mitochondrial phosphoproteins. 32084340
    reports antibacterial discovery, assays and mouse infection models. None of the
    three host injury studies proves antibacterial JNK causality or a bacterial producer.
  snapshot_sha256: 8016b95ad207ae42a6d86c99eea6cab9559524d10df85ef68fe2176c3506f4d4
- evidence_id: jnk2009
  kind: primary_source
  reference: PMID:19271755; DOI:10.1021/jm801503n; https://pmc.ncbi.nlm.nih.gov/articles/PMC2667321/
  locator: Abstract, Introduction, complete Results/Discussion/Conclusion, Tables1–5,
    general methods, exact compound9 synthesis/characterization and all biological/docking
    methods read. Figures1–2 independently viewed. Unrelated analogue synthesis entries
    and supplemental raw data not comprehensively assessed.
  accessed_at: '2026-10-21T17:48:47Z'
  support: supports
  summary: 'Compound9 is the native halicin constitution. Table4 and Figure2A report
    IC50 0.7 micromolar in a JNK1-mediated ATF2 phosphorylation assay: JNK 35 ng/mL,
    ATF2 400 nM, ATP 200 micromolar, pH7.5, one hour at room temperature. The separate
    DELFIA pepJIP1-displacement IC50 is 239 nM, and the HeLa c-Jun phosphorylation
    EC50 is 6.23 micromolar. Neither is a dissociation constant. Figure1C/D is docking
    at the JIP site, not a halicin-bound crystal structure. The biochemical result
    supports the native numeric definition, with host kinase scope retained.'
  snapshot_sha256: 6796cdb8778ebe427c57b970b035499f6bc3a9f43a1de7b6d7300fd97061e3f5
- evidence_id: antibacterial2020
  kind: primary_source
  reference: PMID:32084340; DOI:10.1016/j.cell.2020.01.021; https://pmc.ncbi.nlm.nih.gov/articles/PMC8349178/
  locator: Complete original main text and STAR Methods read; Figures2 and4 independently
    viewed. Figure3/5 captions and results read, but their raw panels and supplemental
    datasets not independently reprocessed.
  accessed_at: '2026-10-21T17:48:47Z'
  support: supports
  summary: The study explicitly renames SU3327 as halicin and Figure2H matches the
    native graph. Figure2I and text report E.coli BW25113 MIC2 micrograms/mL, with
    LB growth assays at 37 degrees C, two-fold dilution, 100-microlitre wells and
    endpoint OD600 when controls reach stationary phase, generally 12–18 hours. Separate
    CFU assays show killing in LB and nutrient-free PBS. Mechanistic evidence combines
    pH-dependent potency, DiSC3(5) fluorescence, tetracycline antagonism, kanamycin
    potentiation and transcriptomic responses. It supports a proposed dissipation
    of the delta-pH component; iron binding is a suggested explanation, not directly
    demonstrated affinity. These are not host JNK assays. Failure to select resistance
    under the tested 30-day liquid/seven-day agar protocols is not proof resistance
    cannot occur. Mouse infection efficacy is not clinical approval.
  snapshot_sha256: f5edd8a3ac6a59eba4f19b22f0ea3966103ea7949405c713da236b315f709757
- evidence_id: correction
  kind: primary_source
