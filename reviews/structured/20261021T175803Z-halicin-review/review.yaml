limitations:
- The entire native record and maintained ChEBI row were assessed. All five adopted
  complete abstracts were read. The 2009 read scope includes Results/Discussion/Conclusion,
  all five tables and compound9 plus biological methods; unrelated analogue synthesis
  entries and supplemental raw data were not comprehensively reviewed.
- The 2020 main text and STAR Methods were read in full, with Figures2/4 visually
  inspected. Original quantitative supplemental tables and all raw figure panels were
  not independently reprocessed. The correction narrative on printed page475 was fully
  read and viewed; its remaining corrected figure pages were not comprehensively reviewed.
- The 2014 heart and 2015 liver studies were read at complete-abstract and selected
  SU3327-focused paragraph depth. The 2014 astrocyte paper was assessed at complete
  indexed abstract depth only. These papers are host context, not exact antibacterial
  mechanism proof.
- The underlying Reaxys1139980 record was not directly inspected. Current ChEBI reproduces
  that registration, and no positive mismatch was found. CAS and exact chemistry are
  independently corroborated.
- The 2025 mechanism paper was assessed at complete original abstract and public publisher-summary
  depth, without the full experimental article. The review does not claim exhaustive
  mechanism, resistance, toxicity or clinical coverage.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
