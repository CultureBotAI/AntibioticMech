summary: 'The exact halicin structure and seven synonyms agree with current chemical
  authorities and original compound-specific figures. Primary evidence supports antibacterial
  activity and the stated JNK inhibition value of 0.7 micromolar in a biochemical
  assay. These are separate biological contexts: the native definition does not assert
  that host JNK mediates bacterial killing. No corrective finding is established.
  Access to the underlying Reaxys registration and some original supplementary data
  remains limited. Scientific assessment retains the stated evidence limits; full
  verification is blocked by the shared native-library failure.'
