    records were not accessed.
  snapshot_sha256: aa8d77a2f4012da4b4eb96c1f6baa47d2b74590c1223e0c6b9dd1af58c98e1cd
- evidence_id: neutral-xrefs
  kind: authority
  reference: pdb-ccd:FMT; kegg.compound:C00058; knapsack:C00001182; bpdb:1749; hmdb:HMDB0000142
  locator: Official CCD atom/bond/charge and descriptor blocks; KEGG flat file/molfile;
    KNApSAcK and BPDB structure fields; HMDB web identity fields.
  accessed_at: '2026-10-21T16:39:19Z'
  support: supports
  summary: CCD FMT explicitly represents neutral FORMIC ACID, with charge 0 and the
    native InChI/key. KEGG C00058 is labelled Formate but its downloaded molfile also
    encodes neutral formic acid; the name alone does not establish an anion. KNApSAcK
    C00001182 and BPDB 1749 show the native key/CAS and matching neutral SMILES. The
    successfully inspected HMDB page showed OC=O, the native InChI/key, formula CH2O2
    and formal charge 0; its separate physiological-charge field was −1. Direct HMDB
    downloads and subsequent browser retries returned 403, so no downloaded HMDB molfile
    is claimed. These nine neutral encodings independently parse consistently.
  snapshot_sha256: 505ed34fad1766c5bf5d91b5b5cfc4e6cbc92ee2c17de381544e8e36e88e210f
- evidence_id: formate
  kind: authority
  reference: metacyc.compound:FORMATE; BioCyc SID:2712; https://pubchem.ncbi.nlm.nih.gov/rest/pug/substance/sourceid/BioCyc/FORMATE/JSON
  locator: Complete public BioCyc depositor substance, source identifier, source URL,
    submitted atoms/bonds/charge and independent reconstruction.
  accessed_at: '2026-10-21T16:35:56Z'
  support: refutes
  summary: The depositor identifies the source as BioCyc, source ID FORMATE, with
    a direct META/FORMATE URL. Its submitted graph has an explicit negative charge
    on the singly bonded oxygen and total charge −1. Reconstruction gives O=C[O−],
    CHO2−, InChI ending /p-1 and key BDAGIHXWWSANSR-UHFFFAOYSA-M, whereas the native
    acid ends -N. The substance separately associates CID283 and a neutral CID284
    parent entry; the parent association does not erase the charge in the submitted
    graph. The ordinary MetaCyc page was account-gated, so the conclusion rests on
    the official public depositor graph, not on an inferred meaning of the word formate.
  snapshot_sha256: f196fb46b438f68659992d6276cf7d051545f9822fa4624ee60fa575da718054
- evidence_id: xref-contract
  kind: record_content
  reference: src/antibioticmech/schema/antibioticmech.yaml:183; docs/HARMONIZATION.md
  locator: Exact xrefs versus drug_xrefs and document_xrefs semantics.
  accessed_at: '2026-10-21T16:39:19Z'
  support: supports
  summary: The native xrefs field asserts the same structure. Drug-level associations
    deliberately permit related salts/stereoisomers, and documents are topical rather
    than structural. Therefore the BioCyc anion conflict concerns the MetaCyc entry
    in xrefs, not the broader DrugBank or document fields.
- evidence_id: retired
  kind: authority
  reference: lipidmaps:LMFA01010040; https://www.lipidmaps.org/databases/lmsd/LMFA01010040
  locator: Official accession page and REST response.
  accessed_at: '2026-10-21T16:33:03Z'
  support: context_only
  summary: The official accession page explicitly states that LMFA01010040 has been
    retired; the REST endpoint returns an empty list. No replacement or historical
    structure is shown. Current ChEBI still imports this accession. This is a traceability
    question, not evidence that the former structure differed from formic acid, and
