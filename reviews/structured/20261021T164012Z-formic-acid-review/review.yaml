  snapshot_sha256: 3e9af9100d19a149e1131637126f9366632e004954ac432fa754768ba637360e
- evidence_id: grounding-documents
  kind: authority
  reference: CHEBI:25384; CHEBI:33282; drugbank:DB01942; patent:CN101481304; wikipedia.en:Formic_acid
  locator: Official structural-parent definition, current activity-role association,
    source registry provenance and inspected document landing content.
  accessed_at: '2026-10-21T16:31:39Z'
  support: supports
  summary: The monocarboxylic-acid parent describes a single carboxy group and fits
    the graph. The antibacterial role agrees with the direct feed experiment. DrugBank
    DB01942 is repeated in current ChEBI but its own page returned 403; it is a broad
    drug association, not exact structure proof. CN101481304A is a process patent
    for producing formic acid by methyl-formate hydrolysis; its title, abstract and
    process description concern the correct chemical topic. The Wikipedia document
    resolves to the formic-acid article. Neither document is used to establish antibacterial
    mechanism or exact equivalence.
  snapshot_sha256: 342f6e158d906689ac0ad191f2377556d04e221b83c9e43521fb4ceb1a4e2cc4
- evidence_id: feed-primary
  kind: primary_source
  reference: PMID:23597100; DOI:10.1186/1746-6148-9-81; https://pmc.ncbi.nlm.nih.gov/articles/PMC3646707/
  locator: 'Complete original main article: all Results/Discussion/Conclusions and
    Methods, including separate pure-acid and commercial-mixture trials. Figure captions
    were read; numerical plot data were not independently digitized.'
  accessed_at: '2026-10-21T16:35:56Z'
  support: supports
  summary: The study directly tests liquid formic acid separately from formic/propionic-acid
    and commercial acid/salt blends against feed-derived Salmonella enterica strains
    Typhimurium 98/1991, Senftenberg 252/1995, Infantis 167/2007 and Putten 297/2007.
    Trial 1 applies 1% formic acid to inoculated rapeseed meal, with untreated controls,
    three replicate samples and a repeated experiment at 20±2°C. Buffered recovery
    followed by TSA/pyruvate and XLD overlay enumerates surviving colonies. The reported
    formic-acid effect grows from about 0.5 log10 relative to control at 1 hour to
    about 1.5 log10 at 120 hours. Feed composition, strain, duration and temperature
    materially affect the results; the authors emphasize reduction rather than assured
    elimination. This supports antibacterial feed use without converting a feed decontamination
    experiment into a standard MIC or a universal efficacy claim.
  snapshot_sha256: 009aa8e0ff8dd245416a627f1017ae420dbcf5354fec2509f58947e7f4c3e5db
- evidence_id: feed-use
  kind: database
  reference: DOI:10.2903/j.efsa.2014.3827; https://www.efsa.europa.eu/en/efsajournal/pub/3827
  locator: Complete official 2014 scientific-opinion abstract inspected through the
    browser; full opinion XML retrieval returned 500.
  accessed_at: '2026-10-21T16:39:19Z'
  support: context_only
  summary: The EFSA opinion addresses formic acid as a preservative for feed and drinking
    water and as a silage additive, and recognizes inhibition of bacterial growth.
    It corroborates the use context, not a current regulatory approval claim or a
    quantified claim that feed use dominates all global uses.
- evidence_id: ant-venom
  kind: primary_source
  reference: PMID:37504670; DOI:10.3390/insects14070664; https://pmc.ncbi.nlm.nih.gov/articles/PMC10380308/
  locator: Original Introduction, complete Methods 2.1–2.2, Results/Tables 1–4 and
    relevant Discussion 4.2–4.3. Supplementary chromatograms were not inspected.
  accessed_at: '2026-10-21T16:33:03Z'
  support: supports
  summary: Camponotus japonicus venom-gland samples from specified female castes were
    analyzed by SPME-GC-MS with formic-acid standards, retention comparison and mass
    spectra. Table 3 identifies formic acid explicitly as CAS 64-18-6/CH2O2. Its reported
    percentages are relative chromatographic peak areas, not absolute weight percentages
    of venom. Hexane extraction obscures the volatile acid at the solvent peak, so
    its absence from that method is not evidence of biological absence. The study
    supports a formicine-ant venom-gland association; it neither measures bee venom
    nor establishes that all ant stings deliver this acid.
  snapshot_sha256: 5f76d0602c611c06b10412acfb77347b6db8cd5360225e5d119828b6353e089b
- evidence_id: bee-boundary
  kind: database
  reference: PMID:7103318; PMID:31939261; DOI:10.22092/ari.2018.122150.1219; 455-bee-literature.json
  locator: Complete indexed abstracts from a bounded formic-acid/bee/venom search.
  accessed_at: '2026-10-21T16:33:04Z'
  support: context_only
  summary: The 1982 corneal bee-sting case report repeats a formic-acid venom attribution
    but does not report an analytical venom-composition experiment. The melittin LC-MS
    paper uses formic acid in the mobile phase, which is not evidence that it is endogenous
    bee venom. The retrieved preprint on ant evolution does not resolve the bee claim.
    Thus the definition’s bee-specific occurrence remains unverified at the inspected
    primary depth; the search is not proof that bees cannot contain formic acid.
  snapshot_sha256: 1a513cf61360f65bc8c18a3a66d312f62ce1c616aefefb1269ee20ac7539105c
- evidence_id: toxicity-primary
  kind: primary_source
  reference: PMID:42524387; DOI:10.4103/ijoem.ijoem_281_25; https://pmc.ncbi.nlm.nih.gov/articles/PMC13411557/
  locator: Complete original clinical case-series main text, including all six cases,
    Discussion and Conclusion.
  accessed_at: '2026-10-21T16:33:03Z'
  support: supports
  summary: The series reports fatal concentrated-formic-acid exposures involving ingestion
    or occupational inhalation/dermal exposure, with corrosive injury and systemic
    toxicity; metabolic acidosis is described. It does not report measured ocular-injury
    outcomes. It therefore supports direct-acid poisoning context, while the adopted
