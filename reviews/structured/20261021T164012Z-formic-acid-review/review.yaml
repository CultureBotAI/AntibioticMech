  locator: Current complete ChEBI entry and molfile, NIST identity/synonyms, CAS-resolved
    PubChem properties and independent chemistry.
  accessed_at: '2026-10-21T16:31:39Z'
  support: supports
  summary: Native SMILES and InChI, current ChEBI molfile and CAS-resolved PubChem
    structure all yield the neutral native key, formula CH2O2, average mass 46.025
    and monoisotopic mass 46.00548. The labels and simple chemical-formula synonyms
