limitations:
- The current MetaCyc compound page required an account. The charge finding rests
  on the publicly accessible official BioCyc deposition for the exact FORMATE source
  ID, whose submitted graph was independently parsed; no authenticated page is claimed
  as inspected.
- The official LIPID MAPS record is retired and its historical structure/replacement
  was unavailable. Gmelin 1008 and Reaxys 1209246 were checked through current ChEBI
  registry metadata only; DrugBank DB01942 returned 403. HMDB identity fields were
  read in an initially successful browser result, but direct downloads and later browser
  retries returned 403.
- All ten adopted citations were reviewed at complete indexed-abstract depth, not
  full-paper depth. Their individual dispositions distinguish primary experiments
  from secondary discussion and solvent use. No exact human ocular dose, antimicrobial
  target or MIC was inferred from those abstracts.
- The primary feed study’s entire main article was read, including figure captions,
  but plotted values were not independently digitized and its two feed-composition
  supplements were not inspected. The reported reductions are feed-decontamination
  outcomes, not standardized MICs or guaranteed eradication.
- Ant-gland methods, tables and relevant discussion were inspected; supplementary
  chromatograms were not. The bounded bee search did not establish analytical evidence
  for endogenous formic acid in bee venom and does not prove biological absence.
- The human poisoning case series describes direct concentrated-acid toxicity but
  no measured ocular outcome. Adopted methanol/formate literature has separate metabolite,
  pH and experimental-system contexts. The EFSA source was read at full-abstract depth
  only; no current approval or global-use ranking is claimed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The definition’s bee occurrence and exposure context remain appropriate targets
  for later source qualification, without an unsupported assertion that the claim
  is definitively false.
- No paid source access, native curation or status promotion was used. Thirteen original
  input hashes are preserved, and optional activity/mechanism enrichment is not counted
  as a defect.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
