findings:
- finding_id: F1
  issue_key: formic-acid-metacyc-formate-charge-equivalence
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: The exact MetaCyc association maps a conjugate base to the neutral acid
  description: Native xrefs includes metacyc.compound:FORMATE as the same structure
    as neutral formic acid. The public BioCyc deposition identifies that exact source
    accession and supplies an anionic submitted graph, independently reconstructed
    as CHO2−, charge −1, key BDAGIHXWWSANSR-UHFFFAOYSA-M. The native graph is CH2O2,
    charge 0, key ending -N. Its related neutral parent association does not make
    the submitted anion identical. This finding concerns a bounded exact cross-reference,
    not the validity of the native chemical identity or antibacterial role.
  target_ids:
  - CHEBI:30751
