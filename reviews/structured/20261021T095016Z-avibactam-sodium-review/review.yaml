summary: The native avibactam monosodium salt agrees with current ChEBI, PubChem and
  the official combination-product label. Original studies distinguish prolonged BlaC
  inhibition from reversible TEM-1 inhibition and combination killing from inhibitor
  monotherapy. KEGG identifies the same named salt but its MOL stereochemistry is
  discordant; the verified native graph should be retained. Scientific assessment
  retains the stated evidence limits; full verification is blocked by the shared native-library
  failure.
