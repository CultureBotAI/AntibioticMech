- evidence_id: chemistry
  kind: validation
  reference: RDKit;PubChem CID:24944097
  locator: 126-chemistry.py;126-chemistry.json;126-pubchem.json
  accessed_at: '2026-10-21T09:23:24Z'
  support: supports
  summary: Native SMILES and InChI generate RTCIKUMODPANKX-JBUOLDKXSA-M, net charge
    zero, two components and two assigned carbon stereocenters. PubChem agrees. C7H10N3O6S.Na
    and C7H10N3NaO6S describe the same elemental composition; masses and ChEBI mint
    agree.
  snapshot_sha256: e6287a15ff0e120942d3afd326196e9dccf742762fc68ea3e2273af5a8e73c4a
- evidence_id: label
  kind: database
  reference: Official AVYCAZ prescribing information
  locator: https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=d9c2803f-dc9c-4b19-b4a3-8303bc8c15fd;
    sections 1,11,12.4;126-label.html
  accessed_at: '2026-10-21T09:23:24Z'
  support: supports
  summary: The current label identifies the 2S,5R monosodium salt with ceftazidime
    pentahydrate, supports the native complicated-UTI/pyelonephritis indication, and
    separates ceftazidime PBP action from avibactam inhibition of selected serine
    beta-lactamases. This product evidence is not avibactam-alone clinical efficacy.
  snapshot_sha256: 9fb73d4f0d77d0b062f80594cee86235fb3e58213ac16b15170b2f6da8c4b683
- evidence_id: patent
  kind: primary_source
  reference: patent:CA2716914
  locator: 126-patent.html; detailed description and Form I section
  accessed_at: '2026-10-21T09:23:24Z'
  support: supports
  summary: The adopted patent explicitly identifies NXL-104 as the monosodium salt
    and discusses crystalline, hydrated and anhydrous forms. It supports the salt
    synonym and document relationship; broad treatment claims are not controlled antimicrobial
    measurements. No particular polymorph or hydrate is assigned to the native formula.
  snapshot_sha256: 6205c855bcd897ce430f2523209efff2b69dabd09cfd3aa246cf8eecd6d9eeea
- evidence_id: blac
  kind: primary_source
  reference: PMID:22587688
  locator: DOI:10.1021/bi300508r; https://pmc.ncbi.nlm.nih.gov/articles/PMC3448018/;
    original Materials, inhibition/reactivation/MS/crystallographic methods and Results
  accessed_at: '2026-10-21T09:23:24Z'
  support: partial
  summary: NXL104 supplied by Anacor carbamylates BlaC Ser70, supported by nitrocefin
    kinetics, intact-protein MS and a 2.3-Angstrom complex structure. More than 98%
    inhibition persisted after 48 hours under the tested conditions. This slow-onset,
    unusually stable BlaC adduct is not proof that every beta-lactamase interaction
    is irreversible. The Methods names NXL104 without specifying the supplied salt.
- evidence_id: tem1
  kind: primary_source
  reference: PMID:22753474
  locator: DOI:10.1073/pnas.1205073109; https://pmc.ncbi.nlm.nih.gov/articles/PMC3406822/;
    Results on onset/recovery, NMR and Materials/Methods
  accessed_at: '2026-10-21T09:23:24Z'
  support: partial
  summary: Novexel avibactam in buffered purified-enzyme experiments shows reversible
    covalent TEM-1 inhibition; NMR/MS support regeneration of intact inhibitor. Recovery
    half-time is about 16 minutes in this experiment. Main-text reagent naming does
    not independently establish the original counterion; molecular mechanism may be
    discussed with this limitation rather than treating salt/free-acid formulations
    as identical solids.
- evidence_id: combo
  kind: primary_source
  reference: PMID:24217692
  locator: DOI:10.1128/AAC.01358-13; https://pmc.ncbi.nlm.nih.gov/articles/PMC3910785/;
    complete abstract, bacterial-strain/antimicrobial/media/model methods and Table
    1
  accessed_at: '2026-10-21T09:23:24Z'
  support: partial
  summary: Forest analytical avibactam lot L003145 was combined with ceftaroline.
    The 72-hour anaerobic model used four strains and a three-log bactericidal endpoint.
    Table 1 compares ceftaroline MIC with combination MIC at fixed avibactam concentration.
    Neither combination killing nor its MIC is an avibactam-monotherapy result; salt
    identity is not explicitly supplied in the inspected Methods.
- evidence_id: computation
  kind: primary_source
  reference: PMID:25050826
  locator: DOI:10.1021/bi500589x;126-core.json complete abstract
  accessed_at: '2026-10-21T09:23:24Z'
  support: context_only
  summary: This TEM-1 QM/MM and metadynamics investigation proposes atomistic routes.
    It is computational evidence, not a new direct-binding or microbial-killing experiment.
- evidence_id: leads
  kind: database
  reference: All three adopted ChEBI PMID leads
  locator: 126-core.json; PMIDs 22587688,24217692,25050826
  accessed_at: '2026-10-21T09:23:24Z'
  support: context_only
  summary: All three indexed records and available complete abstracts were read; each
    is separately scoped above. Supplementary PMID22753474 supplies primary reversible-inhibition
    context. Additional PMID23913691 abstract describes enzyme-dependent kinetics
    including KPC-2 fragmentation; it argues against uniform irreversible-inhibition
    wording.
  snapshot_sha256: bb565dc54e8532a63032ca86e3aada8256d48561fc8e49c8707837b7a6299aaa
- evidence_id: kegg
  kind: database
  reference: kegg.drug:D10340
  locator: 126-kegg.txt;126-kegg.mol;126-kegg-comparison.json
  accessed_at: '2026-10-21T09:23:24Z'
  support: partial
  summary: Name, CAS and formula resolve the intended sodium salt. However RDKit reads
    its MOL as RTCIKUMODPANKX-VVNPLDQHSA-M, with one unspecified center and an opposite
