  accessed_at: '2026-10-21T19:02:33Z'
  support: supports
  summary: Morikubo uses crystalline kanamycin monosulfate from Meiji Seika and expresses
    concentrations as free-base equivalents. Agar-streak and broth experiments demonstrate
    antibacterial activity with strain, pH and medium dependence. The paper itself
    cautions against generalizing one Proteus strain and discusses different pneumococcal
