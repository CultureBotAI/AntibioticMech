  support: supports
  summary: The original lifespan paper uses Sigma kanamycin sulfate at 50 micrograms/mL
    as a bacterial-food/pathogenicity comparator in C.elegans. It reports lifespan
    effects with kanamycin alone and valproic acid combinations, while preserving
