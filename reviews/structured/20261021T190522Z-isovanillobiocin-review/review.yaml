- evidence_id: activity2004aac
  kind: primary_source
  reference: PMID:15047534; DOI:10.1128/AAC.48.4.1307-1312.2004
  locator: Main introduction, Methods, Results/Discussion and exact Table 2 row 312
    inspected; unrelated compound rows not exhaustively audited.
  accessed_at: '2026-10-21T19:00:33Z'
  support: supports
  summary: For mapped 312, Table 2 reports gyrase inhibition as a ratio 0.47 relative
    to novobiocin, not a direct binding Kd. The corresponding MICs include S. aureus
    ATCC 29213 2 µg/mL, S. aureus42080 4 µg/mL and S. epidermidis CNS184 0.25 µg/mL.
    Broth microdilution used cation-adjusted Mueller-Hinton broth, overnight 35°C
    incubation and no more than 2% DMSO. The gyrase assay instead measured inhibition
    of E. coli DNA supercoiling with relaxed pBR322,ATP and intact enzyme. Antibacterial
