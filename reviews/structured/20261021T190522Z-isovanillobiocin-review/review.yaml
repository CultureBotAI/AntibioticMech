limitations:
- The sole adopted 2004 discovery article was read in full, including visually inspected
  Table 1 and Figures 2/3. Raw NMR data were not independently reprocessed. The paper
  has apparent typographical slips in the 2″/3″ discussion and a cloR reference in
  the closing discussion; its abstract, Methods and main results consistently identify
  the cloQ mutant. Exact congener mapping uses the actual Figure 2/table and surrounding
  experimental context.
- The primary stereochemical diagnostic transcribes a published Haworth projection
  and matches an independent assigned authority graph. It is not a new experimental
  absolute-configuration measurement or a physical molecular model. No native edits
  were made.
- The 2004 AAC follow-up was read for material mapping, Methods, exact 312 row and
  Results/Discussion. The 2008 follow-up was read for Methods, exact 312 data and
  relevant Results/Discussion; unrelated compound MIC rows were not individually audited.
  Its Table 1 appears to reverse the 2″/3″ column headings relative to the earlier
  primary structures and its own narrative. Stable compound codes and the original
  2004 structural table support the mapping, but that source inconsistency must remain
  explicit.
- GtoP direct retrieval required login, so no account-based access or complete current
  page was claimed. Indexed text was used only as a lead; official PubChem and independently
  read primary figures supply the structural evidence.
- Current ChEBI has an invalid displayed pyrrole SMILES but a valid matching unspecified
  InChI. The native PubChem-derived SMILES is valid and all three focused gates passed.
  The upstream ChEBI serialization issue is not reported as an invalid-native-SMILES
  blocker.
- The structured adapter identifies gyrB annotation and no module hit, not an isovanillobiocin
  experiment. The original sources do not establish a human clinical indication or
  exact isovanillobiocin-bound crystal structure. Optional native target, producer,
  MIC and causal-graph omissions are not separate findings.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
