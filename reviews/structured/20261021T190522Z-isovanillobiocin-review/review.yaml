- evidence_id: discovery-identity
  kind: primary_source
  reference: PMID:15152806; DOI:10.7164/antibiotics.57.205
  locator: Entire original five-page article; Table 1 and Figures 2/3 visually inspected
    at pp207–208.
  accessed_at: '2026-10-21T18:59:15Z'
  support: supports
  summary: The authors isolate 0.84 mg of compound 2 from a cloQ-defective S. roseochromogenes
    DS12.976 culture, separate from vanillobiocin 1 and declovanillobiocin 3. FAB-MS
    and proton NMR support a vanilloyl-containing aminocoumarin with the pyrrole ester
    at sugar 2″ rather than 3″. Figure 2 draws the defined noviose configuration.
    Its chlorine and 2″ ester distinguish it from the dechloro and 3″-ester siblings.
    The paper calls clorobiocin’s replaced group prenylated 4-hydroxybenzoate, not
    crenelated.
  snapshot_sha256: b9a15e77107aabb75c51748ca67a6a974de2882e2ffef9add1820d54f95dabce
- evidence_id: primary-map
  kind: primary_source
  reference: PMID:15152806 Figure 2; 567-primary-map.py; 567-primary-map.json
  locator: Original Haworth projection independently transcribed with its ring orientation
    and up/down substituent directions.
  accessed_at: '2026-10-21T19:03:22Z'
  support: supports
  summary: The mapped native atoms are anomeric C1″ 14, ester-bearing C2″ 9, hydroxyl
    C3″ 10 and methoxy C4″ 11. Figure 2 has aglycone up, ester down, hydroxyl down
    and methoxy up; the resulting assignments are S,R,R,R at those respective sites.
    The resulting full key AKYRQFMQZJFLAE-AUHTVUCRSA-N matches independent PubChem
    54713406. The diagnostic establishes the missing defined sugar configuration without
    claiming that the unassigned native graph is a racemate or that an opposite stereoisomer
    was experimentally tested.
  snapshot_sha256: 3c56c4c5fde0448626305f74d59b12ebafde366340ba6abd97d0929715bfdcca
- evidence_id: discovery-activity
  kind: primary_source
  reference: PMID:15152806 Methods and Figure 3
  locator: Original bioassay Methods and exact compound 2 result, including plate
    image and amount labels.
  accessed_at: '2026-10-21T19:03:22Z'
  support: supports
  summary: Isovanillobiocin was tested at 8, 16 and 32 nmol per 3 mm paper disk against
    B. subtilis ATCC 14893 in nutrient agar containing approximately 2×10^5 spores/mL,
    overnight at 37°C. Its relative activity was 3–6% of clorobiocin from inhibition-zone
    comparisons. This directly supports antibacterial activity for the isolated congener,
    but is not a broth MIC, a binding constant or proof of the activity of every stereoisomer.
    The parent clorobiocin target discussed in the introduction is not itself an isovanillobiocin
    enzyme assay.
  snapshot_sha256: acf0da33ceac4137609d8f898ae6c9b7c471b4dd44e2e231d90c77044b9fc906
