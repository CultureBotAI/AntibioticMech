summary: The original discovery paper supports isolated isovanillobiocin, its vanilloyl
  group, the 2″ pyrrole ester and antibacterial activity. The native graph correctly
  represents that connectivity but leaves all four sugar stereocentres unspecified,
  unlike the primary drawing. A primary-derived Haworth mapping agrees with the independently
  parsed stereospecific PubChem entry. The definition also inherits the chemically
  incorrect word crenelated in place of prenylated. These require source-owned correction;
  no opposite-enantiomer or mixture claim is made.
