  acceptance_checks:
  - Keep neutral finafloxacin, explicitly drawn HCl preparations and formulated XTORO
    distinct; document potency basis if a numeric assay is curated.
  - Retain assay medium/pH, exact strain or allele and MIC/MBC/intracellular/clinical
    endpoint; do not infer direct binding from susceptibility shifts.
