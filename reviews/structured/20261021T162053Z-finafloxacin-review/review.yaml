limitations:
- All ten adopted PMID leads were read at complete original abstract depth. The 2010
  A. baumannii and 2011 pH-spectrum originals were read for methods/relevant results
  and actual figures; the 2017 original was inspected through valid full XML for preparation
  and endpoint scope. Other adopted originals remain at abstract depth.
- Full routes for PMC3067158 and PMC3165282 returned challenge HTML or server errors.
  These failures do not establish absence of full text elsewhere, and uninspected
  methods were not inferred.
- Every numeric table cell and raw dataset was not independently reanalyzed. The 2017
  pathogen-model paper is used only for published material and endpoint boundaries;
  no experimental protocol or clinical recommendation is generated.
- The patent HTML was inspected for relevant definition, preferred salt and example
  scope; its 37-page scanned PDF was retrieved, with only one contextual page visually
  inspected. No uninspected patent structural figure or every formulation claim is
  asserted as verified.
- Reaxys 14830297 returned 403. CAS 209342-40-5 agrees with the official FDA label,
  but an independent CAS registry graph was not obtained.
- Current Drugs@FDA and GSRS are timestamped observations. They corroborate the stored
  product assertion without proving retail availability or making the historical GSRS
  record version erroneous.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native files, maintained owners and immutable reviews were not edited. Original
  hashes were retained and all expanded inputs rechecked. Optional links, tags and
  notes were checked specifically for finafloxacin.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
