  description: During separately authorized curation, preserve the failed absolute-assignment
    evidence in grounding_notes, record evidence and a concrete discussion. Require
    exact-D primary evidence before presenting the absolute R,R choice as established.
    If a machine-structure correction or relative-stereo representation becomes warranted,
    implement it through the maintained ChEBI input/extractor/seeder while retaining
    known relative orientation and E geometry. Do not infer a mixture, invert centers
