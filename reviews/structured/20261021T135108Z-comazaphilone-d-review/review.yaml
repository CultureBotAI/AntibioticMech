  issue_key: chebi-70013-relative-evidence-absolute-stereo-qualification
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: Relative evidence is serialized as an unqualified absolute enantiomer
  description: Native rel-(6R,7R) and the original unsuccessful absolute-assignment
    experiments do not select R,R over the opposite enantiomer, yet ordinary SMILES
    and Standard InChI encode R,R without explaining the limitation. Current ChEBI
    repeats the same representation. The exact database identity and constitution
    are supported; no inversion, racemate or mixture is demonstrated. Later inspected
    D sources do not resolve the assignment.
