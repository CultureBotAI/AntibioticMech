  acceptance_checks:
  - The record explicitly distinguishes its database-selected absolute serialization
    from the experimentally supported relative assignment.
  - Any later absolute resolution cites an exact-D experiment; otherwise the uncertainty
    survives reseeding through curator-owned fields.
