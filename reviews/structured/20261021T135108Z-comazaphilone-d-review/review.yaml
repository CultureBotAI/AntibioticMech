limitations:
- Original 2011 full main text and assay table remain unavailable; complete abstract
  and official SI are inspected. Numeric antibacterial MICs or SW1990 values from
  reviews were not adopted.
- The 2019 NA paper disagrees internally between prose and Table 2 for H1N1/H3N2 ordering.
  Detailed enzyme reagent/substrate/buffer conditions are not supplied in the inspected
  main text or its compound-1-spectra supplement. No viral replication assay, binding-site
  localization or bacterial mechanism is inferred.
- Later 2020/2025 main articles and supplements were not obtained. The 2026 full main
  article is available and was read; its new absolute calculations do not establish
  D. Bounded search is not proof that no later exact absolute evidence exists.
- Reaxys registry content remains independently unresolved. Matching official database
  graphs are not independent experimental proof of absolute configuration.
- PMC attachment URLs initially returned HTML challenge pages with HTTP 200. Successful
  Europe PMC supplementaryFiles retrieval then supplied verified 2019 DOCX and 2026
  PDF archives; initial challenge files remain distinct and were not mistaken for
  documents. The later spectra were inspected for exact-compound scope, not independently
  reinterpreted as absolute assignments.
- The inherited definition contains the spacing typo 6.Isolated; this does not change
  chemical identity and is not elevated into a separate material finding.
- Focused native checks do not substitute for required shared corpus gates or authorize
  REVIEWED status.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native and maintained source files and history remain unchanged.
- Chemistry used the batch 019 RDKit interpreter against batch 033 paths; native schema/strict
  checks used the batch 033 environment.
- All exact D conclusions are separate from C/E; original shared artifacts retain
  their original filenames and hashes.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
