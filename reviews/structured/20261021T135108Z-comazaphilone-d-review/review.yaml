- evidence_id: neuraminidase
  kind: primary_source
  reference: PMID:31448146; DOI:10.1080/12298093.2019.1616377
  locator: '321-2019.xml/.html: complete main text, Figure 1, Table 2 and kinetic
    paragraph; 321-2019-fig1.jpg visually inspected; verified 2019 DOCX contents inspected
    via Europe PMC archive'
  accessed_at: '2026-10-21T13:42:36.971413Z'
  support: supports
  summary: The original isolates D as compound 3 from Glaziella splendens fruiting
    bodies and identifies it by spectral comparison. Table 2 reports recombinant NA
    IC50 values of 41.8, 30.9 and 35.7 micromolar for H1N1, H3N2 and H5N1, respectively,
    with H3N2 noncompetitive Ki 35.3 micromolar. The prose/abstract reverses the first
    two endpoint ordering; preserve the conflict before quantitative adoption. This
    is enzyme inhibition, not a binding structure, viral replication assay, bacterial
    mechanism or clinical efficacy. The failed Mosher experiment in this later paper
    concerns new compound 1, not a new absolute assignment of D. The retrieved supplement
    contains spectra of compound 1 only; it does not supply an additional D absolute
    assignment or detailed enzyme assay protocol.
  snapshot_sha256: b6680ffc78dd40e9efcd2d0921618212b0b2c5ba40739d4f160bf43061f9a26a
- evidence_id: later2026
  kind: primary_source
  reference: PMID:42741989; DOI:10.1002/cbdv.71678
  locator: '321322-2026.xml: full main body, Results, isolation methods and references
    17/20; verified supporting PDF contents and figure labels inspected'
  accessed_at: '2026-10-21T13:42:54.410816Z'
  support: context_only
  summary: D is known compound 4, isolated from Talaromyces wortmannii MCCC 3A01136
    and identified through NMR/MS/optical-rotation comparison with the 2025 paper.
    Explicit ECD/DP4 absolute analysis concerns new compound 1. The highlighted protective
    ferroptosis results belong to E and C, not D. No new D absolute assignment or
    D antibacterial mechanism is adopted. The supplement identifies D NMR/MS as S15–S17
    and ECD calculations as compound 1 only.
  snapshot_sha256: 8e0d06f04b414a0e2269e3b3d766dd502c924411ffed17b7ce1f418e17a17810
- evidence_id: later-abstracts
