summary: Comazaphilone D is supported as the C-6 orsellinate azaphilone with an E
  side chain, antibacterial activity and reported tumor-cell cytotoxicity. Its source
  and machine encodings reconcile, but the relative stereochemical name and unsuccessful
  original absolute-assignment experiments require qualification beside the absolute
  R,R serialization. This is one major representation finding, not evidence of inversion
  or a mixture. Later recombinant viral neuraminidase inhibition is bounded separately
  from bacterial mechanism, with a table/prose endpoint conflict preserved.
