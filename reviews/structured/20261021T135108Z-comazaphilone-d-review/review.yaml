  accessed_at: '2026-10-21T13:42:37.443760Z'
  support: context_only
  summary: The 2025 paper combines three new talavaritones with seven known compounds;
    accessible preview identifies D as known compound 4. Its abstract does not establish
    an exact-D absolute reassignment. The 2020 comazaphilone G/H paper concerns host
    macrophage nitric-oxide inhibition; the abstract does not provide a verified D
