  locator: Reused 320-si.pdf contents and S4 Scheme S1, visually inspected D=4
  accessed_at: '2026-10-21T13:38:28.480893Z'
  support: supports
  summary: The original scheme identifies D as 4, with C-6 orsellinate ester, C-7
    hydroxyl/methyl and E C-10 double bond; its aromatic ring lacks the additional
    oxygenation of E. Relative wedge orientation is retained in the context of failed
    absolute assignment. No absolute conclusion is inferred solely from a drawn wedge.
