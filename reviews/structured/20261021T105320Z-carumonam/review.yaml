  support: supports
  summary: The paper compares hydrolysis of 0.2 mM substrate by specific penicillinases
    and cephalosporinases and tests defined enzyme-bearing strains/plasmids. Carumonam
    is relatively stable to the measured panel, with detectable hydrolysis for some
    enzymes. This does not imply immunity to every beta-lactamase or resistance mechanism.
    Enzymes that hydrolyze a drug are resistance/degradation actors, not antibacterial
    molecular targets.
