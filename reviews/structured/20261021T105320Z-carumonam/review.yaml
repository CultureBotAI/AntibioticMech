  support: supports
  summary: Competitive PBP binding was measured by inhibition of 14C-benzylpenicillin
    labeling, reported as I50 in µg/mL. Carumonam PBP3 I50 was 0.06 for E. coli NIHJ
    JC-2, 0.059 for K. pneumoniae No.13 and 0.031 for P. aeruginosa P9. Binding to
    S. aureus FDA 209P PBPs was much weaker. These are radioligand-displacement measurements
    in organism-derived PBP preparations, not purified-enzyme catalytic IC50 values
