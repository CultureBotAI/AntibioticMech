limitations:
- No native record edit or paid access was performed.
- HMDB was inspected through the public web representation, including displayed structural
  text; later direct HTML/XML attempts returned403. The saved MOL is a manual transcription
  of that displayed structure, not a direct downloaded HMDB SDF. Recheck a fresh authoritative
  destination structure when adjudicating the mapping.
- MetaCyc was independently inaccessible. Reaxys and CAS were checked as official
  ChEBI assertions, with CAS additionally corroborated by KEGG/KNApSAcK; no paid registry
  verification was used.
- All six adopted PMID abstracts were read. All seven pages of the1983 mechanism article
  were visually inspected as official PMC scanned images. A PMC PDF request returned
  HTML rather than a PDF and was not treated as inspected full-text PDF. The1981 activity
  study was read as primary abstract plus author-uploaded text, without complete quantitative
  extraction.
- The1981 and1983 text representations differ in the reported Erwinia ATCC accession;
  no cross-study strain equivalence or numeric pooling was assumed. The1983 bacterial
  vesicle strain is E.coli ML308-225.
- No comprehensive search for all later mechanism, biosynthesis or resistance evidence
  was performed. Additional primary evidence may refine optional annotations without
  changing the documented HMDB representation conflict.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
