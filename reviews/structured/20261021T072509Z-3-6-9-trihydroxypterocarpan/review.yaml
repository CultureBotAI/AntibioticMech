  kind: primary_source
  reference: PMID:16661917
  locator: DOI:10.1104/pp.68.2.358; Host-Pathogen Interactions XVIII; official PubMed/Europe
    PMC abstract, author-uploaded ResearchGate full-text text for identity, organisms,
    liquid-growth experiments and discussion.
  accessed_at: '2026-10-21T07:22:16Z'
  support: supports
  summary: The study identifies natural glycinol as the6aS,11aS compound using spectroscopic
    and optical evidence and tests bacterial/fungal growth. Bacterial observations
    include Erwinia carotovora, Escherichia coli and Bacillus subtilis. Inhibition
    and recovery depend on inoculum and concentration; the authors propose detoxification
    without identifying a resistance gene. These growth curves are not silently recast
    as standardized MIC values. Soybean elicitation is reported; a structured biosynthetic
    producer should retain that experimental context.
- evidence_id: mechanism
  kind: primary_source
  reference: PMID:16663042
  locator: DOI:10.1104/pp.72.2.557; PMC1066273; all seven scanned primary pages557–563
    visually inspected as027-mechanism-p557.png throughp563.png.
  accessed_at: '2026-10-21T07:22:16Z'
  support: supports
  summary: Glycinol delays macromolecular-label incorporation in E.carotovora and
    impairs respiration-linked and phosphotransferase-linked transport in E.coli ML308-225
    membrane vesicles. Preloaded alpha-methylglucose6-phosphate efflux supports altered
    membrane permeability. The authors favour a general physical membrane interaction
    over a specific transport or respiratory protein target. Incorporation inhibition
    is interpreted as secondary. Different phytoalexins are comparators, and proposed
    resistance difficulty is speculation, not demonstrated absence of resistance.
