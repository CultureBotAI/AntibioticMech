  title: HMDB displayed structure does not establish exact stereochemical equivalence
  description: The exact native S,S structure is linked through xrefs to HMDB0034105.
    The inspected HMDB page names exact glycinol in synonyms but displays a structure
    with two unassigned centres and a different stereochemical InChIKey. The same
    connectivity alone is insufficient for the native exact-structure field. This
    is an external-record inconsistency and unsupported exact mapping, not evidence
