  reference: PMID:30033524; DOI:10.1002/jmr.2755; https://pmc.ncbi.nlm.nih.gov/articles/PMC6774440/
  locator: Complete indexed abstract; original Introduction, Methods2.1–2.4, Table1,
    selected Results3.1, Results3.2–3.3 and Conclusions inspected, with particular
    attention to exact TFC material and cross-reactivity.
  accessed_at: '2026-10-21T17:55:46Z'
  support: supports
  summary: The exact 3-trifluoromethyl-4,4′-dichlorocarbanilide appears in Table1
    and Methods2.3 as a comparison hapten. Competitive ELISA gives relative cross-reactivity
    6.97% for T9, reused from prior work, and 15% for T10. These are ratios of IC50
    values, not antibacterial MICs or direct Kd values. The crystallized ligands are
    triclocarban, not halocarban. The paper is relevant compound context but does
    not establish its microbial killing mechanism.
  snapshot_sha256: f13d6bc09605015f1715f661b86d29244a811f9703229a7e8f0ced90c90186ed
- evidence_id: activity2018
  kind: primary_source
  reference: PMID:30400165; DOI:10.3390/molecules23112853; https://pmc.ncbi.nlm.nih.gov/articles/PMC6278391/
  locator: Original Abstract, Introduction, complete Results/Discussion, Tables1–2
    and footnotes, general chemical methods, biological Methods3.2–3.8 and Conclusions
    read. Unrelated analogue synthesis entries and raw supplemental spectra were not
    comprehensively read. Figure1 independently viewed.
  accessed_at: '2026-10-21T17:55:23Z'
  support: supports
  summary: Figure1 explicitly identifies cloflucarban as the CF3 parent and matches
    the native constitution. Table1 TFC gives 0.5 µg/mL against S. aureus ATCC12600,
    an unnamed MRSA clinical isolate and S. epidermidis ATCC1798. Its endpoint is
    a 50% reduction of growth OD550 over an 8 h assay, not conventional complete-inhibition
    MIC or a population MIC50. Methods use TSB, initial OD550 approximately 0.1, 37
    degrees C and 150 rpm. TFC is NA against S. mutans ATCC25175, defined as >100
    µg/mL, and >20 against E. faecalis ATCC19433; the paper reports no Gram-negative
    activity. Macrophage CC50 is 13.7 µg/mL. Membrane microscopy, biofilm and mutation
    experiments concern TCC and selected new analogues, not TFC, and cannot supply
    an exact halocarban mechanism. The general ≥95% purity statement concerns new
    compounds and does not independently establish the comparator purity.
  snapshot_sha256: e7f6d479806e60da5cc5da0cdca5153aeab5ac6f0e82d061032dbdf222ca0d2c
