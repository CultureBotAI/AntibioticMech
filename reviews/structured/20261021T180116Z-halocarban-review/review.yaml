limitations:
- The complete native record and maintained exact source row were reviewed. The adopted
  primary was read at the stated full-main sections, and the 2018 primary was read
  across main scientific and biological-method sections with Figure1 visually checked;
  unrelated analogue synthesis details and raw supplemental spectra were not fully
  audited.
- The 1975 formulation source was read only at complete abstract depth. Its outcome
  cannot be partitioned between halocarban and triclocarban. Present-day frequency
  of deodorant/soap use was not established.
- The 2018 comparator is explicitly identified and drawn, but a separate supplier/lot/purity
  declaration for TFC was not established in the inspected text. The source’s purity
  threshold applies to newly synthesized compounds.
- The 2022 newer ChEBI citation was read at abstract depth only. The 2024 host and
  analogue papers were inspected selectively for scope; no comprehensive mechanistic
  sign-off is claimed.
- Europe PMC XML for the adopted paper returned 500; ordinary PMC HTML supplied the
  inspected main text. Publisher image routes failed 403 before the article-linked
  PMC image succeeded. The Taiwan authority file route returned a removed-file HTML
  notice, not a usable policy PDF, and supports no regulatory claim.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
