  kind: primary_source
  reference: PMID:15724180; DOI:10.1039/b413523g
  locator: Complete original abstract in041-root-primary-abstracts.json
  accessed_at: '2026-10-21T15:31:59Z'
  support: supports
  summary: An iterative polyketide-synthase/peptide-synthetase hybrid assembles equisetin
    in Fusarium heterosporum, directly supporting the native producer species at abstract
    scope. RSC full text/PDF returned403. PMID28379186 separately concerns trichosetin
    in F.fujikuroi lacking eqxD; that different product is not equisetin production
