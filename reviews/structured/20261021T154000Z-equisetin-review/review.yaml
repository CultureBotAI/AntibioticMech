- evidence_id: patent
  kind: primary_source
  reference: https://patents.google.com/patent/US3959468A/en
  locator: Complete original Description, Example1, Table1 and Claims read
  accessed_at: '2026-10-21T15:31:59Z'
  support: supports
  summary: Chromatographically purified equisetin from Fusarium equiseti NRRL5537
    has formulaC22H31NO4 and bacterial growth activity. MICs were determined by twofold
    agar dilution in TGY, ethanol-solubilized antibiotic,37C for bacteria with24/48h
    observations and complete growth inhibition. Table1 reports strain-specific activity
    including B.subtilis and S.aureus, with exceptions among Gram-negative bacteria.
    This independently supports antibacterial eligibility; the early partial structural
    assignment is not proof of the final full stereostructure. Copper salt, degraded
    material, animal toxicity and isolated neutral antibiotic remain distinct.
  snapshot_sha256: dd3070f071053c790a73ea9ae13ef359bb058210547ee6c58b4f00d8e71270e4
- evidence_id: '1979'
  kind: primary_source
  reference: PMID:541270; DOI:10.7164/antibiotics.32.759
  locator: Entire three-page original report read as text
  accessed_at: '2026-10-21T15:31:59Z'
  support: context_only
  summary: The original paper identifies the N-methyl acyltetramic acid portion and
    elemental composition, with spectroscopic and chemical transformations. Its proposed
    hydrocarbon substructure still includes unresolved placement and an early ring
    interpretation; it cannot independently certify the modern full decalin stereochemical
    graph. Activity statements point to the1974 discovery report and are not new MIC
    experiments.
  snapshot_sha256: e6cbe94e604556c9266f1669ab2a3cc41a21845eca1baf389003709d3676caac
- evidence_id: integrase
  kind: primary_source
  reference: DOI:10.1016/S0040-4039(98)00269-X; PMID:10335400; DOI:10.1177/095632029901000202
  locator: Complete original1998 and1999 abstracts inspected on publisher/PubMed pages
  accessed_at: '2026-10-21T15:31:59Z'
  support: supports
  summary: The1998 study distinguishes Fusarium-derived equisetin from Phoma-derived
    phomasetin and reports recombinant integrase inhibition. The1999 original tests
    the HIV-1 integrase reactions and catalytic core and reports inhibition of integration
    by isolated preintegration complexes. These support an integrase-inhibition role
    at biochemical scope, without establishing clinical antiviral efficacy, a directly
    observed equisetin binding site or the antibacterial mechanism. Direct full-text
    retrieval returned403.
