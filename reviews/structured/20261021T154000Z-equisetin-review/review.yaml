limitations:
- Current ChEBI Z and PubChem/GSRS E exocyclic enol encodings do not match exactly.
  Tetramic tautomerism is relevant context but does not by itself prove exact equivalence;
  the inaccessible1989 full characterization and solution-state assignment remain
  a bounded follow-up.
- All ten adopted publication leads were read as complete abstracts; subscription
  full methods and raw spectra were not obtained. The1998/1999 integrase papers were
  also inspected at complete-abstract level only.
- The2020 main paper was read for relevant equisetin Methods/Results/Discussion and
  actual Fig1,Table1,Fig8. Every raw trace and supplement was not independently reprocessed.
  Its main methods explicitly describe pyrrolocin isolation but do not independently
  establish the exact equisetin batch/form in the inspected section; the E.faecalis
  accession mismatch must be resolved before reuse.
- The1979 full text and patent predate the complete modern stereochemical characterization.
  Neither is treated as independent proof of the native full graph. MetaCyc login,
  proprietary Reaxys and the unverified AGR lead remain explicit access limits.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native or source edits were made. Source-qualified antiviral activity and bacterial
  growth eligibility can both be true; no unsupported curation-status promotion is
  made.
- A later authorized structural reconciliation should compare the original1989 assignment
  and solution tautomer data with the specified native Z and authority E forms before
  deciding whether a representation correction is warranted.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
