- evidence_id: acc
  kind: primary_source
  reference: PMID:32470050; DOI:10.1371/journal.pone.0233485
  locator: 2020 full main XML Methods, Results and Discussion; actual Fig1, Table1
    and Fig8 viewed
  accessed_at: '2026-10-21T15:31:59Z'
  support: supports
  summary: The study distinguishes equisetin from pyrrolocin C and tests antibacterial
    growth, S.aureus metabolomics/fatty-acid rescue and purified E.coli ACC components.
    At100 micromolar equisetin inhibits biotin carboxylase by84.5%, while carboxyltransferase
    and coupling controls are not inhibited. This is single-concentration activity,
    not an IC50 or binding affinity; molecular interactions and S.aureus structural
    confirmation remain future work in the paper. Table1 usesIC90 and has a vancomycin-resistant
    E.faecalis accession inconsistent with Methods. The M.tuberculosis transcriptomics
    are pyrrolocin C, not equisetin. Fig1 depicts an internal-enol tautomer; Discussion
    acknowledges tetramic tautomerism without resolving native Z versus current-authority
    E solution populations.
  snapshot_sha256: 15017d6d5ce400a443eca194d5f86fe9c5199287a1b19bba0d7370417d18d843
