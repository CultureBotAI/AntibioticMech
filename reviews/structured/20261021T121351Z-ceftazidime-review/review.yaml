limitations:
- All 180 adopted PMID records were resolved, but only 173 supplied abstracts; seven
  were metadata-only. Most of the 258 imported assertions were assessed through adopted
  source structure and complete abstracts rather than full original experimental tables.
  This is not complete primary confirmation of all resistance edges. Newly added current
  ChEBI citations beyond the adopted ten compound leads were not exhaustively reviewed.
- TEM-59/TEM-89 conclusions are restricted to the named clinical isolates, E. coli
  transconjugants, expression backgrounds and purified-enzyme conditions. Equality
  to a control MIC and below-threshold kinetic values are not proof of universal absence.
  Original HTML table text and cell alignment were inspected; no independent visual
  PDF audit was performed.
- CTX-M-3 has positive later expression evidence despite an earlier purified-enzyme
  negative result. Other inhibitor-resistant TEM abstracts can require contextual
  reconciliation, but they were not all converted into findings or excluded by analogy.
- Full original AcrR and OmpK35 bodies were not successfully retrieved; their exact
  ceftazidime experiments remain unverified. PBP3 clinical and combination-treatment
  studies do not establish the independent effect of every allele. Omp38 and LamB
  studies retain their small-effect, heterologous or mixed-background qualifications.
- The 31 BioSample accessions were verified against the cited CDC pages, not independently
  inspected at NCBI. Source breakpoint versions and resistant categories were checked
  as reported; this review did not reclassify the isolates under a different current
  clinical standard.
- Current OLS ceftazidime SMILES omits oxime stereo while its InChI/key and the native
  graph agree. Reaxys was authority-link corroboration only. DrugBank returned 403;
  the Fortaz label search returned 404, while the TAZICEF official label was available.
  Neither access failure establishes that a drug or document does not exist.
- Several PMC HTML attempts returned challenge pages and several EuropePMC full-text
  XML requests returned 500. Successful alternate originals were used where noted;
  challenge/error responses are not evidence. Two local parser attempts failed because
  bs4 was absent, after which a standard-library parser succeeded without dependency
  changes.
- Focused schema/strict and supplemental chemistry/source diagnostics do not replace
  shared full-corpus QC, term, reference or history gates. The existing 019 chemistry
  interpreter was used against 026; no native record, saved review bundle or Git state
  was modified.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
