  support: supports
  summary: The original study examines soluble recombinant P. aeruginosa PBP3 lacking
    the N-terminal membrane anchor. Thermal stabilization accompanies ceftazidime
    exposure; crystallography after a 10 mM, 30-minute soak shows an opened beta-lactam
    acyl linkage to Ser294 at 2.6 angstrom resolution. The paper deposits that complex
    as 3OCN. This supports direct PBP3 interaction at exact construct scope, without
    equating every PBP with that protein or making the proposed Burkholderia structural
    extrapolation a direct experiment. The native family target may be enriched but
