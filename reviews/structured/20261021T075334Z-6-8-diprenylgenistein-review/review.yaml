  support: supports
  summary: Both native encodings yield UCHYSPNEUSDFQR-UHFFFAOYSA-N, C25H26O5, charge
    0, one fragment, mass 406.478 and exact mass 406.178023932, with no tetrahedral
    stereocentres. Prenyl double bonds have equivalent methyl substituents and do
