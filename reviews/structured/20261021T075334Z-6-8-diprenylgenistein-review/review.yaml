  acceptance_checks:
  - Map compound 5 in 2006, 16 in 2018, 50 in 2021, 3 in 2024 and 28 in 2025 explicitly
    to the native exact molecule. Do not transfer osajin, scandenone, wighteone or
    glycyrrhizol results.
  - Preserve organism/strain, assay medium, temperature, duration, inoculum, units,
    comparator and source-specific MIC/MBC definitions. Do not convert the 2018 >99%
    MBC criterion into a 99.9% definition or count the 2025 restatement of 2021 MIC/MBC
    as an independent assay.
  - Use the 2025 high-inoculum PPS experiment to qualify membrane-permeabilization
    claims; retain concentration and time. A nonsignificant viable-count reduction
    there does not refute broth MBC or prove universal lack of killing.
  - Keep porin entry, fluidity/depolarization, localization and QSAR hypotheses explicitly
    inferential; require direct evidence before naming a protein target or lethal
    causal chain.
  - For 2015 HPLC-F10-3, inspect original supplementary structure/NMR and resolve
    the saturated-skeleton paragraph before confident quantitative entry. Preserve
    the paper’s identity attribution and uncertainty instead of silently repairing
    the prose or rejecting all independent evidence.
  - Do not treat isolation as biosynthesis proof, crystal-violet biomass as viable-cell
    killing, or fibroblast MTT/product suggestions as clinical efficacy or safety.
  - Use the native validated writer/history, focused schema/strict, source reproduction
    and required QC; retain native scientific status until its sign-off criteria pass.
limitations:
- The 2006 original journal text was inspected through a public PDF browser extraction;
  direct download returned 403. No independent visual interpretation of its spectra
  is claimed.
- The 2018 Results/Discussion and Methods, 2021 exact activity table and susceptibility
  Methods, complete 2022 correction, 2024 Results/Discussion and relevant chemistry/MIC
  Methods, and 2025 Results/Discussion, Conclusion and Experimental Section were inspected.
  This does not claim complete independent reproduction of spectroscopy, modeling,
  supplementary data or microscopy.
- The 2024 structure Figure 1 was visually inspected. Its MIC Methods refer to earlier
  papers; no unstated detailed protocol is invented. The 2025 microscopy interpretation
  is based on authors’ text/caption and assay description rather than independent
  image quantification.
- The 2015 original PDF was read for chemistry, assays and interpretation; p83/Table
  3 were visually verified. Original supplementary spectra were not obtained in this
  pass, so the internally conflicting skeleton paragraph remains unresolved. No direct-target
  mechanism or clinical safety follows from its phenotypic assays.
- The original 1999 Derris isolation text and independent CAS/Reaxys registry entries
  were not inspected. Their authority/retrospective assertions remain distinct from
  direct experimental verification.
- The initial scratch helper used the wrong mint algorithm; the retained initial output
  is followed by the corrected maintained SHA256-based calculation. This was a helper
  error, not a native identity finding.
- Discovery was bounded and does not establish universal absence of other activity,
  mechanism or biosynthesis evidence. No native edits or paid research occurred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- An independent second reviewer verified the retained source/input hashes, visually
  confirmed the 2015 p83 contradiction and checked the 2024 compound boundary and
  2025 assay interpretation. No material defect in the review was found.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
