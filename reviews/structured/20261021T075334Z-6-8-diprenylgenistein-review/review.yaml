  locator: DOI:10.1159/000362676; original journal reproduction at https://www.adm.org.mx/backup/biblioteca/caries-research/2015/IN%20VITRO%20ANTIMICROBIAL11.pdf
    ; Methods and Results/Discussion; p83/Table 3 visually inspected
  accessed_at: '2026-10-21T07:52:20Z'
  support: partial
  summary: HPLC-F10-3 is named 6,8-diprenylgenistein and assigned C25H26O5 with matching
    HRMS. Reported MIC is 4 µg/mL for S. mutans UA159 and 1–4 across the listed mutans-streptococcal
    panel. MIC, time-kill, crystal-violet biomass, confocal architecture and fibroblast
    MTT are separate endpoints. However, the p83 structure paragraph also describes
