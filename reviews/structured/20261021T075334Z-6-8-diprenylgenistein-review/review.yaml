- evidence_id: adopted
  kind: primary_source
  reference: PMID:16441081
  locator: DOI:10.1021/np058069d; complete official abstract and original journal
    text pp 121–124 at https://scispace.com/pdf/antibacterial-compounds-from-glycyrrhiza-uralensis-5auosmk8yq.pdf
  accessed_at: '2026-10-21T07:52:20Z'
  support: supports
  summary: The exact compound is 5, identified by comparison with prior spectroscopy
    and isolated from authenticated Glycyrrhiza uralensis roots. It gives MIC 2 µg/mL
    against S. mutans ATCC 25175. The modified microdilution uses BHI, anaerobic 37°C
    and a 16–20 h visible-growth endpoint. The 1 µg/mL result belongs to glycyrrhizol
    A, not this compound. Plant extraction supports occurrence, not independent biosynthetic
    proof. Browser extraction of original journal text was inspected; direct PDF download
    returned 403.
  snapshot_sha256: 929356387933ccdf8c648900caf5e8d792ac784030ee6681e1c72ce9ffff4f1a
- evidence_id: primary2018
  kind: primary_source
  reference: PMID:29915354
  locator: DOI:10.1038/s41598-018-27545-4; full XML Results, Discussion and Materials/Methods;
    Table 1 compound 16
  accessed_at: '2026-10-21T07:52:20Z'
  support: supports
  summary: Exact purchased 6,8-diprenylgenistein has reported MIC/MBC 6.3/6.3 µg/mL
    for L. monocytogenes EGD-e. E. coli K12 has MIC >50 µg/mL without PAβN and MIC/MBC
    >50/>50 with 48 µM PAβN. TSB testing runs 24 h at 37°C with viability plating;
    this paper defines MBC as >99% inactivation, not a silently substituted 99.9%
    criterion. Proposed porin influx, membrane localization and fluidity effects are
    mechanistic hypotheses informed by SAR/QSAR, not direct protein-target measurements.
  snapshot_sha256: 8b04ea52205054e439f1ff7721f1c4e8b1117f39a4266cb8d6eabb374b305023
- evidence_id: primary2021
  kind: primary_source
  reference: PMID:34244528
  locator: DOI:10.1038/s41598-021-92964-9; Table 1 compound 50 and antibacterial susceptibility
    Methods
  accessed_at: '2026-10-21T07:52:20Z'
  support: supports
  summary: The exact compound has MIC 9 and MBC 16 µg/mL against MRSA 18HN, with paired
    molar values 23 and 38 µM. TSB, 37°C/24 h, an initial 3.8±0.4 log CFU/mL inoculum
    and viability confirmation are specified; definitions reference the 2018 assay.
    These are measured values, distinct from the paper’s QSAR predictions. The later
    2025 table cites these values rather than independently redetermining them.
  snapshot_sha256: 235b79b426431b377d1c4eab556abc06f7d9b8866db3bb76381a92917e6dc9fb
- evidence_id: correction2022
  kind: primary_source
  reference: PMID:35236919
  locator: DOI:10.1038/s41598-022-07664-9; complete correction XML
  accessed_at: '2026-10-21T07:52:20Z'
  support: context_only
  summary: The correction changes the sign of the E_vdw term in the four-descriptor
    QSAR equation in Table 2 from negative to positive. It does not report a change
    to compound 50 MIC/MBC in Table 1. The corrected model is still a prediction,
    not target-engagement evidence.
  snapshot_sha256: fbb9345bfd844b18c2f653ac4213fca51ef636ffceba2ec17ec0c4a4d1248fb2
- evidence_id: primary2024
  kind: primary_source
  reference: PMID:38893450
  locator: DOI:10.3390/molecules29112574; Results/Discussion, Table 3, Methods 3.2.7/3.2.21
    and Figure 1 visually inspected
  accessed_at: '2026-10-21T07:52:20Z'
  support: supports
  summary: Synthetic compound 3 has the exact native systematic name and formula,
    with supporting NMR/HRMS and a matching visual structure. MICs in µg/mL are 8
    for S. aureus ATCC 29213, 16 for E. faecalis ATCC 29212, 4 for MRSA ATCC 33591
    and >128 for E. coli ATCC 25922. Detailed MIC procedure is referred to earlier
    papers rather than fully restated. SEM membrane damage is measured for compound
    2, osajin, and cannot be transferred to compound 3.
  snapshot_sha256: 1ef6d60001f41956d47379ec8e5a711625433f1c27a2e0d30f4f25bb52d16615
- evidence_id: primary2025
  kind: primary_source
  reference: PMID:40827787
  locator: DOI:10.1021/acs.jnatprod.5c00540; Results/Discussion, Conclusion and Experimental
    Section; Figure 2 text/caption and Table 1 compound 28
  accessed_at: '2026-10-21T07:52:20Z'
  support: supports
  summary: 'Exact purchased compound 28 was tested in MRSA 18HN membrane assays. At
    50 µg/mL most cells remained unpermeabilized, and viable counts did not significantly
    decrease after 1 or 24 h under the high-inoculum PPS conditions. Its antimicrobial
    action therefore cannot primarily be assigned to permeabilization from these data.
    This does not establish universal non-permeabilization or absence of bactericidal
    activity: concentration-response measurements extend to 100 µg/mL and the cited
    broth MBC is 16 µg/mL under different conditions. Other membrane effects are proposals
    requiring further testing, and the paper identifies inoculum/time/assay differences
    as a possible explanation.'
  snapshot_sha256: b8d923e419e4ade70db9d9a4102da00a81a0a50e5bab26a578bfd746e3f84d4e
