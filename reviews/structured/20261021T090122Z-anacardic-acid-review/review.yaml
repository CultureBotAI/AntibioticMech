  support: supports
  summary: Reviewed SARS-CoV-2 P0DTD1 is the parent replicase polyprotein. Its nsp5/3C-like
    proteinase chain occupies residues 3264–3569. The accession is appropriate provenance,
    while the assayed domain should be explicit rather than implying whole-polyprotein
    inhibition.
  snapshot_sha256: 7366d4fea701dfccea0226cbe43850961d5192cad95d0e7644cc0c16dec7e642
- evidence_id: primary-assay
  kind: primary_source
  reference: PMID:32803196
  locator: DOI:10.1101/2020.07.17.207019;097-primary2020.xml Methods,Results,Table2,Figure5
    caption
  accessed_at: '2026-10-21T08:55:11Z'
  support: partial
  summary: Original preprint Table 2 gives anacardic acid IC50=11.04 µM, matching
    11040 nM. It explicitly groups this compound among partial fluorescence quenchers.
    Cell CPE EC50=3.98 µM and cytotoxicity CC50=14.13 µM are distinct endpoints. The
    native assay description reproduces source text but omits this compound-specific
    limitation.
  snapshot_sha256: 7a86fc82d8e42311e98b8d441a861dcb581e13ab25f186d1c89df67a2adf723e
- evidence_id: published-assay
  kind: primary_source
  reference: PMID:33062953
  locator: DOI:10.1021/acsptsci.0c00108;097-primary2020-published.xml Results,Table2,Methods
  accessed_at: '2026-10-21T08:55:11Z'
  support: partial
  summary: Published version retains the same values and interference category. The
    enzyme construct is recombinant MBP-tagged SARS-CoV-2 3CLpro. Keep this study-specific
    caveat even if other experiments independently support protease inhibition.
  snapshot_sha256: 08d1b86f2fc7c03ce46fb9d19c6c72f14d63ddfcf4bdc07d184947e094d207a9
- evidence_id: later2021
  kind: primary_source
  reference: DOI:10.1186/s13578-021-00564-x
  locator: 097-primary2021.html Results and Methods;097-primary2021-fig2.png
  accessed_at: '2026-10-21T08:55:11Z'
  support: partial
  summary: Inspected Figure 2c shows saturated anacardic acid separately from unsaturated
    ginkgolic acid. The paper measures anacardic acid protease and cellular effects,
    but detailed irreversibility kinetics and docking focus on ginkgolic acid. Its
    broader covalent conclusion must not be converted into direct covalent proof for
    anacardic acid.
  snapshot_sha256: f587634edef25c0af2a17fca48024fdcff34048a87f580878c839688adafd298
- evidence_id: later2022
  kind: primary_source
  reference: PMID:35590420
  locator: DOI:10.1186/s13578-022-00806-6;097-primary2022.xml entire letter and Figure1
    caption
  accessed_at: '2026-10-21T08:55:11Z'
  support: partial
  summary: A later paper reports anacardic acid inhibition in FP/FRET assays, no detected
    covalent mass adduct, reversible mixed-type kinetics and weak SPR binding with
    KD 6.21 mM. It explicitly disagrees with the prior covalent interpretation. The
    letter does not provide a reagent catalog/structural certificate; exact-form transfer
