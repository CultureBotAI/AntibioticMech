limitations:
- All ten adopted ChEBI abstracts were inspected; most full articles were not. The
  native BindingDB preprint and relevant published version sections were read. EuropePMC
  PMID query returned zero, but PubMed and original PMC full text resolved the citation.
- HMDB and FooDB returned HTTP403; LINCS returned HTTP500. An initial BindingDB search
  URL returned HTTP404, while the exact monomer page successfully verified source
  identity and native assay identifiers.
- Exact-congener antibacterial numerical evidence remains bounded:1993/1996 full methods
  were inaccessible; a guessed 2003 DOI failed and was excluded, then verified DOI10.1021/jf034674f
  publisher abstract was inspected.
- The2022 short paper lacks an exact reagent catalog/structural certificate. Its binding/inhibition
  claims are described with that limitation; later evidence does not erase the original
  measurement caveat.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
