    any separately authorized curation.
limitations:
- Nine adopted sources had inspectable abstracts; PMID 21252841 had metadata and a
  public publisher introduction only. Full trial methods were not retrieved; a free
  CANVAS PDF route failed. No paywalled content was purchased.
- Clinical trials describe the fosamil regimen, while the current official label supplies
  exact monoacetate monohydrate and dose-basis mapping. Historical trial batch composition
  is not independently established from their abstracts.
- The generic supplemental helper does not normalize component formulas and returned
  exit 1; its output is preserved alongside a passing independent elemental-equivalence
  comparison.
- No direct isolated-monohydrate antibacterial binding experiment is inferred from
  active-ceftaroline pharmacology or physical Y-site compatibility.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All 20 expanded input hashes unchanged; no native/source/status/history edits.
- Native validation used batch 025 environment; standalone RDKit 2026.03.5 chemistry
  used existing batch 019 interpreter against batch 025 cwd.
- Free public primary and official sources only. No new finding was created from optional
  absent fields or a helper representation limitation.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
