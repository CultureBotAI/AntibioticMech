summary: No confirmed native defect. Both molecular encodings, current KEGG and CAS-resolved
  PubChem structures agree on the 6R,7R, Z-oxime monoacetate monohydrate. The component
  formula and summed Hill formula have identical elemental counts. Official Teflaro
  documentation supports the exact material, conversion to ceftaroline and adult skin-infection
  use. Clinical prodrug doses and active-ceftaroline antibacterial effects remain
  distinct from the mass and direct target activity of the isolated hydrate. Scientific
  assessment retains the stated evidence limits; full verification is blocked by the
  shared native-library failure.
