  acceptance_checks:
  - Keep monoacetate monohydrate, anhydrous fosamil dose basis, active ceftaroline
    and L-arginine-containing product distinct.
  - Use original trial full methods before transferring detailed patient/isolate outcomes;
    do not count pooled FOCUS safety as a third independent trial.
