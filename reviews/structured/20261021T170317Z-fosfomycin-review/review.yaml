  reference: pubchem.compound:73491; https://pubchem.ncbi.nlm.nih.gov/compound/73491;
    pubchem.compound:446987
  locator: Complete current official PUG properties and synonym lists for the native
    CID and separately retrieved neutral candidate; both SMILES and InChI parsed.
  accessed_at: '2026-10-21T16:54:01Z'
  support: refutes
  summary: Native exact CID 73491 is fosfomycin disodium, C3H5Na2O4P, three components
    and key QZIQJIKUVJMTDG-JSTPYPERSA-L. It contains two sodium counterions and a
    dianionic phosphonate. CID 446987 instead reproduces the native one-component
    neutral C3H7O4P and full key. This is a salt/charge-form mismatch, not a stereochemical
    inversion, mass-rounding issue or ambiguous label. The erroneous exact mapping
    is present in maintained ARO row 18 and the current ARO term; the MIBiG 938 entry
