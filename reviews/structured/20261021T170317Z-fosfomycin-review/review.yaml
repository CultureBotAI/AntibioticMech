  summary: The authors studied 96 clinical MRSA isolates using agar dilution with
    25 mg/L G6P and their cited 2012 EUCAST criteria. They report associations between
    particular glpT/uhpT variants and resistance, including susceptible variants and
    clonal structure. This is not an isogenic complementation study proving every
    variant causes resistance. The sole resistant isolate with the reported MurA truncation
