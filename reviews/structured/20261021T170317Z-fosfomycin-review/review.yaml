limitations:
- 'The full 1996 MurA paper was not obtained: publisher full-text/PDF routes returned
  HTTP 403. Its complete indexed primary abstract explicitly supports the native qualitative
  binding details, and PDB/UniProt independently corroborate deposition identity and
  resolution. Crystallization salt, electron-density maps and binding kinetics were
  not independently reconstructed.'
- All 48 ARO assertions were inspected individually against the maintained rows and
  current exact terms/relations. Their entire primary bibliographies were not re-reviewed.
  The exact msr(I) edge remains functionally unresolved; the native database qualification
  is preserved.
- All ten ChEBI adopted leads and five ARO leads were dispositioned. PMID 3464490
  has no available indexed abstract, and PMID 8075064 explicitly provides a truncated
  250-word abstract. Other older leads are generally abstract-depth except the named
  full/selected original sources. No whole-cell numerical result is transferred across
  salt, medium, combination or strain boundaries.
- The S. fradiae 2006 producer paper was inspected at complete abstract depth; the
  P. syringae 2012 full main article was read, but supplemental datasets and raw spectra
  were not independently reprocessed. Archived MIBiG v4 exact entries match the retained
  entry versions; failed current repository/API URLs are not evidence those BGCs are
  absent.
- Reaxys was not independently accessible through free sources. CAS was cross-checked
  through official public chemical resources rather than a paid registry. KNApSAcK’s
  displayed key discrepancy remains a source-quality limit, while both published forward
  encodings match native identity.
- The FomA full article was available, but only the abstract, Introduction and selected
  binding/catalytic Results/Discussion were used; no claim of complete experimental
  reanalysis is made. MRSA supplemental isolate tables were not independently read,
  and the main study is treated as association evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
