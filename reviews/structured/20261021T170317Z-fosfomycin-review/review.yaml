  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Classify seven uptake determinants separately from MurA target alteration
  description: E. coli glpT, uhpT, uhpA, ptsI and cyaA and S. aureus glpT/uhpT are
    typed ANTIBIOTIC_TARGET_ALTERATION. Their exact ARO definitions describe impaired
    import or transporter regulation, and the original E. coli experiments establish
    that distinction. The source extractor faithfully follows ARO:0001001, but the
    resulting normalized category misstates the mechanism. The correction must preserve
    strain/variant and database-evidence limits; the MRSA association study is not
    proof that every transporter mutation is causal.
