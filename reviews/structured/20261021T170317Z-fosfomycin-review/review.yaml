  support: refutes
  summary: The study selected E. coli NU14 mutants on fosfomycin-containing LA with
    or without glucose-6-phosphate and examined clinical isolates separately. Sequencing,
    carbohydrate-use phenotypes and cyclic-AMP rescue distinguish glpT/uhpT/uhpA defects
    from ptsI/cyaA regulatory defects. The mechanism is impaired entry of fosfomycin,
    not alteration of its MurA target. E-test measurements contain G6P and differ
    from LA measurements without it; laboratory and clinical mutation distributions
    also differ. Several isolates remain unexplained, and clinical missense changes
    could not be assigned effects without susceptible parents. These limits preclude
    treating every variant or species as equivalent.
