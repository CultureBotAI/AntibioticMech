  reference: CHEBI:28915; chembl:CHEMBL1757; kegg.compound:C06454; pdb-ccd:FCN; cas:23155-02-4
  locator: Current complete ChEBI and ChEMBL entries, KEGG entry/molfile and CCD descriptors;
    independent forward parsing of native and authority SMILES/InChI/molfile.
  accessed_at: '2026-10-21T17:02:37Z'
  support: supports
  summary: ChEBI, ChEMBL, KEGG and both stereochemical CCD encodings agree with the
    native neutral acid and its two specified stereocentres. Formula, formal charge,
    average mass 138.059 and monoisotopic mass 138.008195334 agree with native rounding.
    CAS 23155-02-4 is associated with that acid by ChEBI, KEGG and the independently
    retrieved neutral PubChem entry. Native systematic names distinguish the phosphorus-attached
    1R centre and the methyl-bearing 2S centre, equivalent to oxirane numbering 2R,3S.
