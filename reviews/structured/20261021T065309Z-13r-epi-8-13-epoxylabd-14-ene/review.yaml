limitations:
- The2004 fungal isolation full text and2013 activity full text/PDF were inspected.
  Most other leads were abstract-only;2002 and2019 complete papers were inaccessible.
  Exact epimer assignment and detailed methods remain prerequisites for activity curation.
- PMID17236091 yielded no substantive source text. The2015 biosynthesis primary full
  text was not reliably accessible; verified UniProt content is context only.
- KNApSAcK and MetaCyc destinations were inaccessible and Reaxys was not independently
  checked. Official ChEBI xref assertions were verified.
- Bounded searches do not prove absence of mechanism, resistance or other evidence.
  No paid research or native record modification was performed.
- Authoritative just qc failed during collection because the pinned SciPy 1.15.3 native
  library has an invalid Mach-O section on this platform; identical pinned version
  also failed under Python 3.10. No dependency versions were changed. Full closed-schema,
  reproduction and corpus-integrity gates passed independently; these do not replace
  full QC.
