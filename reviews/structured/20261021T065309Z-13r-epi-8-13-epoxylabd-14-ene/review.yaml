- evidence_id: epimer-mixtures
  kind: primary_source
  reference: PMID:12443786
  locator: https://pubmed.ncbi.nlm.nih.gov/12443786/ — complete abstract, DOI10.1016/S0960-894X(02)00792-8
  accessed_at: '2026-10-21T06:49:41Z'
  support: supports
  summary: The study distinguishes C13 epimers using GC-MS with NMR support, isolates
    pure ent-13-epi-manoyl oxide and mixtures, and reports antibacterial comparisons
    among mixtures with different epimeric composition. It does not supply sufficient
    abstract-level assay detail to assign a mixture MIC to this exact stereoisomer.
    Publisher full-text access returned403.
- evidence_id: plant-origin
  kind: primary_source
  reference: PMID:11301869
  locator: https://pubmed.ncbi.nlm.nih.gov/11301869/ — abstract, DOI10.1055/s-2001-11497
  accessed_at: '2026-10-21T06:49:41Z'
  support: supports
  summary: The abstract explicitly reports isolation and spectroscopic identification
    of ent-13-epi-manoyl oxide from Cistus monspeliensis leaf hexane extract. Its
    reported biological testing concerns leukemic-cell growth inhibition, not an antibacterial
    molecular target. Full paper was not inspected.
- evidence_id: fungal-origin
  kind: primary_source
  reference: DOI:10.1271/bbb.68.2418
  locator: https://www.jstage.jst.go.jp/article/bbb/68/11/68_11_2418/_pdf — pp2418–2420,
    Figure1, Table1 and isolation paragraph p2420; PMID15564689 verified
  accessed_at: '2026-10-21T06:49:41Z'
  support: supports
  summary: The full source describes culture and isolation of compound1, (-)-ent-13-epi-manoyl
    oxide, from Phaeosphaeria sp.L487 mycelial material, with optical rotation and
    NMR comparison. It also reports GC-MS detection in Gibberella fujikuroi IFO30336.
    These are compound/producer observations, separate from phaeoside glycoside evidence
    and proposed biosynthetic steps. No antibacterial mechanism experiment is reported.
- evidence_id: salvia-activity
  kind: primary_source
  reference: DOI:10.22037/ijpr.2013.1297
  locator: https://brieflands.com/journals/ijpr/articles/125699.pdf — pp396–398, extraction/identification,
    Figure1 and Table1 with footnotes
  accessed_at: '2026-10-21T06:49:41Z'
  support: supports
  summary: Full publisher text and PDF images inspected. The authors name purified
    ent-13-epi-manoyloxide from Salvia sharifii aerial material and provide NMR/mass
    data. Table1 assigns agar-dilution MICs of256 µg/mL to E.coli PTCC1533, P.aeruginosa
    PTCC1310, S.typhi PTCC1609 and K.varians PTCC1484, and128 µg/mL to B.pumilus PTCC1319
    and L.monocytogenes PTCC1298. Disc diffusion is separate. The paper provides a
    short method referring to earlier protocols and no antimicrobial target experiment.
    Exact structural assignment, culture-method details and taxon labels require careful
    verification during extraction.
- evidence_id: borrelia-lead
  kind: primary_source
  reference: PMID:31474477
  locator: https://pubmed.ncbi.nlm.nih.gov/31474477/ — Methods and Results abstract;
    DOI10.1016/j.phymed.2019.152977
  accessed_at: '2026-10-21T06:49:41Z'
  support: context_only
  summary: The abstract reports isolated epi-manoyloxide D activity against Borrelia
    burgdorferi sensu stricto and distinguishes it from the resin and other constituents.
    The abbreviated epimer name alone does not establish all stereocentres for this
    record; full structural and assay tables were inaccessible. Neither the in-vitro
    comparison with amoxicillin nor the authors therapeutic speculation establishes
    clinical use or mechanism.
- evidence_id: derivatives
  kind: primary_source
  reference: PMID:7765688
  locator: https://pubmed.ncbi.nlm.nih.gov/7765688/ — abstract; DOI10.1016/S0031-9422(00)90350-9
  accessed_at: '2026-10-21T06:49:41Z'
  support: context_only
  summary: The experiments concern keto/hydroxy/unsaturated manoyl-oxide derivatives
    and microbial transformations. Reported antileishmanial and adenylate-cyclase
    effects cannot be assigned to the unmodified target structure. Curvularia transformation
    in this paper does not establish natural production of the target.
- evidence_id: biosynthetic-context
  kind: database
  reference: https://www.uniprot.org/uniprotkb/H6VLG5/entry
  locator: Reviewed KSL2 entry Function and catalytic activity; primary leadPMID26077765,
    DOI10.1104/pp.15.00695
  accessed_at: '2026-10-21T06:49:41Z'
  support: context_only
  summary: The entry identifies a plant enzyme producing ent-13-epi-manoyl oxide.
    It supplies a biosynthesis lead, not an antimicrobial drug target. Initial PMC
    source metadata loaded but subsequent section access returned a challenge, and
    the author-repository PDF failed. The primary full experimental source is therefore
    not used to establish additional producer or target claims.
- evidence_id: unread-lead
  kind: database
  reference: PMID:17236091
  locator: https://doi.org/10.1055/s-2006-959584 — publisher search metadata; PubMed
    and EuropePMC retrieval attempts
  accessed_at: '2026-10-21T06:49:41Z'
  support: context_only
  summary: The adopted lead points to the1994 natural-metabolites/resin paper. Direct
