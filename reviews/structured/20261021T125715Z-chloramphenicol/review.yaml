  accessed_at: '2026-10-21T12:46:31.694946Z'
  support: supports
  summary: E. coli MRE600 70S crystals were soaked overnight with 100 micromolar Sigma
    chloramphenicol diluted from an ethanol stock. The approximately 3.3-3.4 A structures
    place the drug at the bacterial PTC A-site cleft. Figure 5 shows nitrobenzene
    stacking with C2452 and the distinct orientation from D. radiodurans. The authors
    observed no corresponding density at the H. marismortui site in these crystals.
    This supports the existing qualified E. coli target and mode-of-action notes,
    not a universal claim that other sites never bind.
