    text
  accessed_at: '2026-10-21T12:50:44.179420Z'
  support: refutes
  summary: Clinical E. coli E17/E19/M1 mutant SoxR alleles increased chloramphenicol
    gradient-plate growth when introduced into TN402, whereas E3/I237 alleles did
    not show the same constitutive effect. Figure 3 measures millimeters of growth
    along a 0-30 microgram/mL gradient, not an MIC. Complementary reporter and multicopy
    wild-type suppression experiments support a regulatory contribution; the mechanism
    is SoxS-dependent efflux/permeability regulation, not alteration of chloramphenicol-bound
    23S rRNA. Effects remain allele/background dependent.
