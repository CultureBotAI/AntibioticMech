- finding_id: F2
  issue_key: chebi-17698-soxrs-target-alteration-enum
  category: representation
  severity: major
  status: open
  certainty: confirmed
  title: SoxR and SoxS regulation is mislabeled as antibiotic target alteration
  description: Native resistance entries 52 and 54 inherit ANTIBIOTIC_TARGET_ALTERATION
    from raw rows classified through ARO:0001001. Current term definitions and original
    SoxR mutant/reconstruction work, plus the SoxS Ala12Ser allelic-exchange abstract,
    support regulation of efflux/permeability rather than alteration of the chloramphenicol-binding
    ribosomal target. A regulator mutation is not itself a drug-target mutation. Preserve
    the source resistance association and exact allele/background scope while correcting
    the biochemical category through the maintained source mapping.
  target_ids:
  - CHEBI:17698
  field_paths:
