findings:
- finding_id: F1
  issue_key: chebi-17698-bacterial-ptc-archaeal-citation-scope
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: The bacterial PTC binding edge is supported by an archaeal exit-tunnel experiment
  description: Graph edge 0 cites only PMID:12860128 and describes a bacterial chloramphenicol-bound
    PTC state. The original study actually visualizes H. marismortui chloramphenicol
    in an exit-tunnel crevice at 20 mM, explicitly distinct from the bacterial active-site
    pose discussed from earlier work. This is a source/taxon/site mismatch, not a
    denial of the well-supported bacterial PTC mechanism. Related edge 1 and edge
    3 notes should preserve the same distinction and reconcile their older competitive
    phrasing with the adopted 2022 context-specific interpretation.
  target_ids:
  - CHEBI:17698
