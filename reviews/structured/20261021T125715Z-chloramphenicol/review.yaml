limitations:
- The 87 imported ARO associations are verified for source-row fidelity, identifier
  resolution and definition-level scope; this is not an exhaustive primary experimental
  validation of all determinant alleles.
- The 1947 discovery paper remained metadata-only. Several ChEBI-only leads were inspected
  through complete original abstracts; the 2015 SoxS primary full PDF returned 403.
  Exact reading depths and all 17 dispositions are recorded, and no unavailable numerical
  assay detail is inferred.
- HMDB, DrugBank, LINCS, MetaCyc and proprietary Beilstein content could not be independently
  checked in full. ChemSpider and DrugCentral were checked at identifying-page depth;
  structural agreement is established independently for the other listed molecular
  resources.
- BioSample SAMN15040081 retains >=32 mg/L while the cited CDC 0782 page reports >32
  microgram/mL; native CDC provenance and censoring are retained without merging those
  source representations.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
