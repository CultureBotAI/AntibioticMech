  support: refutes
  summary: The actual study used H. marismortui large-subunit crystals and Sigma chloramphenicol
    at 20 mM in DMSO-containing stabilization buffer. Figure 5b and the chloramphenicol
    Results place the drug in the exit-tunnel hydrophobic crevice near G2099/A2100,
    explicitly distinct from the D. radiodurans active-site position discussed from
    prior work. The authors discuss possible relevance of both sites and more complex
    kinetics. This source does not itself solve a bacterial chloramphenicol-PTC complex,
