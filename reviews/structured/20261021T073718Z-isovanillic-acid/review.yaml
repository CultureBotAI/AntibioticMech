limitations:
- HMDB direct page/alias access was unavailable; indexed content was treated as a
  lead. Reaxys was corroborated through ChEBI, with no independent paid-registry access.
- The three adopted primary articles were inspected as full abstracts only. The additional2007
  paper was read in full from university-hosted scanned pages, and the2021 journal
  PDF was read with its structure figure visually checked.
- The2021 paper does not provide a strain accession and has inconsistent characterization
  text; its exact drawing and stated assignment were retained without claiming independent
  experimental identity reanalysis. No claim that it establishes a specific target
  is made.
- The literature search was bounded. It does not establish universal absence of mechanism,
  biosynthesis, resistance or further quantitative evidence.
- No native record edits or paid research occurred. This review does not promote native
  scientific status.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
