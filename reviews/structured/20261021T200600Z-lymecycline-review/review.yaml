limitations:
- Only free sources were used. Reaxys was not inspected through paid access and DrugBank
  returned 403. Current exact Reaxys chemistry remains unverified.
- The 1984 and 1964 original studies were read in all five scanned pages each. Their
  distinct formulations, analytical methods, dose equivalents and patient populations
  prevent universal absorption or pure-parent potency conclusions.
- The 1982 analytical study was read at complete-abstract depth only. Its full selectivity/stability
  controls were not audited. The 1991 adopted IgE paper was abstract-only; the 2014
  adopted letter has no indexed abstract and remained inaccessible beyond metadata.
- The 2015 M. marinum case main text and captions were read, but photographs were
  not independently evaluated. No isolate MIC or controlled efficacy experiment is
  supplied.
- The 2022 antiplasmodial main text and tables were read in full and Figure 1 was
  viewed. The PMC supplementary download returned an HTML preparation page, and the
  attempted publisher path returned 404; the supplier/stock details in Supplementary
  Table 1 remain uninspected. No intact-drug stability measurement over the six-day
  assay was verified.
- The 2022 impurity article was available only in indexed original introduction/abstract
  and section snippets. The 2023 author-linked paper was read in its introduction
  and relevant references only. Their raw spectra, impurity assignments and whole
  experimental sections were not audited.
- The official PAR was read in relevant scientific, quality and clinical sections,
  with its p7 structure viewed. Product-label composition, indications and pharmacology
  were checked, not a comprehensive current regulatory-history audit.
- The bounded search inspected the first 100 of 150 broad lymecycline results plus
  focused abstracts. It did not exhaust historical literature or prove absence of
  clinical antiprotozoal use or any active intestinal transport route.
- The S. aureus structured adapter failed on a null regulator field; the E. coli module
  was retrieved and summarized but supplies no compound-specific mechanistic proof.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All thirteen initial hashes remain unchanged. Retrieval manifests retain real URLs,
  UTC timestamps, status codes and hashes, including unsuccessful or non-document
  responses.
- The two attempted ChEBI structure downloads returned SVG/JSON rather than molfiles;
  only verified structure strings and actual KEGG/DrugCentral molfiles enter the chemistry
  comparison.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
