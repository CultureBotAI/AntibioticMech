- evidence_id: smpc
  kind: authority
  reference: https://www.medicines.org.uk/emc/product/101121/smpc; https://www.medicines.org.uk/emc/product/926/smpc
  locator: 'Both official manufacturer SmPCs: composition, indications and complete
    pharmacodynamic/pharmacokinetic sections inspected.'
  accessed_at: '2026-10-21T19:57:02Z'
  support: supports
  summary: The products contain lymecycline and have antibacterial indications. The
    labels describe the tetracycline-class 30S protein-synthesis mechanism and distinguish
    antibacterial from other acne effects. They state more ready absorption but do
    not identify a unique transporter. Their class-level resistance/breakpoint summaries
    are not exact new lymecycline MIC observations or direct parent-binding measurements.
  snapshot_sha256: e4c7d084af98dca9ae9798872200050b9d22daa0294ec975c7f91002b9435866
- evidence_id: primary1964
  kind: primary_source
  reference: PMID:14214184; DOI:10.1136/bmj.2.5423.1491; PMC1817106
  locator: All five original scanned pages 1491–1495, including Tables I–X and both
    figures, read.
  accessed_at: '2026-10-21T19:58:04Z'
  support: supports
  summary: Carlo Erba lymecycline powder was standardized as 0.6056 g tetracycline
    base per gram. Tube-dilution Table I found similar antibacterial profiles to tetracycline
    hydrochloride across the tested panel, but values are expressed as tetracycline-HCl
    equivalents, not pure-parent mass. The clinical comparison included 58 lymecycline
    and 44 tetracycline patients with generally satisfactory responses, alongside
    prophylaxis and heterogeneous indications. Volunteer microbiological bioassays
    could not distinguish intact lymecycline from released tetracycline; patient comparisons
    and dose conventions had explicit limitations. This supports antibacterial use
    without assigning historical equivalents as native-compound MICs.
  snapshot_sha256: 6770dd8de52db159280992d1d080dd6a8f109ce727acdde94d662ac70a8d3cc3
- evidence_id: primary1984
  kind: primary_source
  reference: PMID:6487493; DOI:10.1111/j.1365-2125.1984.tb02500.x; PMC1463615
  locator: All five original scanned pages 529–533, including Methods, Tables 1/2,
    Figures 1/2 and Discussion, read.
  accessed_at: '2026-10-21T19:56:13Z'
  support: refutes
  summary: Twelve healthy volunteers received equal tetracycline-base-equivalent doses
    in a double-blind crossover. The HPLC study reported tetracycline, with no detectable
    intact lymecycline in plasma/urine, and interpreted gastrointestinal conversion
    before absorption. Relative exposure was 80% after a single dose and 70% after
    repeated doses versus tetracycline hydrochloride in this preparation. These measurements
    and the authors’ conversion interpretation conflict with an unqualified unique
    intact-drug transport story; they do not directly identify a transporter or prove
    that no intact molecule can ever cross the intestine.
  snapshot_sha256: 9efbd1853638ab3641991e1cf9849216999d4a810c0b41e55342ff2fe5259895
- evidence_id: primary1982
  kind: primary_source
  reference: PMID:7153285; DOI:10.1016/S0378-4347(00)84178-X
  locator: Complete indexed original abstract read; publisher full-text route returned
    403.
  accessed_at: '2026-10-21T19:57:02Z'
  support: context_only
  summary: The original analytical study reports only tetracycline and no trace of
    lymecycline in plasma/urine after dosing, interpreting complete presystemic degradation.
    The full assay validation and stability controls were not inspected, so the abstract
    alone is not treated as a universal exclusion of intact transport.
  snapshot_sha256: d7c6c4802e87fed870ff28f8931f46faf8171fb8f13605523745d920a14303c1
- evidence_id: impurity-context
  kind: database
  reference: DOI:10.1016/j.jpba.2022.114993; DOI:10.1016/j.ejps.2023.106519
  locator: 2022 indexed original introduction/abstract and selected section snippets;
    2023 author-linked full-text introduction and exact cited reference read in browser.
  accessed_at: '2026-10-21T20:00:18Z'
  support: context_only
  summary: Both impurity studies repeat the 5000-fold solubility and active-transport
    statements as background. The 2023 statement cites Acharya and Kurosu’s 2023 medicinal-chemistry
    textbook, not an original transport experiment. Their inspected experimental scope
    concerns impurity identity and degradation. This corroborates that the wording
    exists in recent literature while leaving the claimed transport mechanism and
    comparison conditions unresolved.
  snapshot_sha256: c10e8d852a4296ee79980cbcd9f8f4406f2eccfea679a63b00121933aadcdac6
- evidence_id: adopted2015
  kind: primary_source
  reference: PMID:25672310; DOI:10.1590/abd1806-4841.20153090; PMC4323709
  locator: Entire original main text and figure captions read; clinical photographs
    not independently re-evaluated.
  accessed_at: '2026-10-21T19:55:42Z'
  support: supports
  summary: The single case had aquarium-associated lesions and a photochromic culture
    identified as M. marinum. Lymecycline 150 mg/day was followed by improvement after
    10 days and clinical resolution at the later review. There was no controlled comparison,
    isolate MIC or molecular mechanism experiment. The paper proposes further investigation;
    it does not establish universal mycobacterial efficacy.
