findings:
- finding_id: F1
  issue_key: lymecycline-intestinal-transport-unqualified-source-conflict
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Qualify the categorical intestinal-transport account
  description: The definition presents unique active intestinal transport as settled.
    The original human HPLC study reports only tetracycline after lymecycline dosing
    and interprets gastrointestinal conversion before absorption, which the MHRA assessment
    also states. Recent impurity-paper introductions repeat active transport as background,
    so the conflict must be preserved rather than resolved by repetition. Qualify
    the wording to distinguish the administered conjugate, measured tetracycline and
    unresolved transport mechanism; do not claim that the study directly disproved
    every possible intact-drug transport route.
  target_ids:
