summary: No confirmed native defect. Exact free-acid structure, three stereocentres,
  source isolation and antibacterial/antimalarial roles are supported. Original compound
  1 inhibits E. faecium at 16 µM and P. falciparum 3D7 at 41 µM, with limited activity
  in other tested organisms. Reaxys and full bacterial procedure/strain mapping remain
  bounded follow-ups; no molecular mechanism is inferred. Later producer-name reassignment
  remains qualified pending exact-voucher resolution. Scientific assessment retains
  the stated evidence limits; full verification is blocked by the shared native-library
  failure.
