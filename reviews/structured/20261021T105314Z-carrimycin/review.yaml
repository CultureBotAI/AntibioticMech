limitations:
- Component II mapping is based on native connectivity and the inspected primary substituent
  drawing, not independent reanalysis of every stereocentre or all raw spectral data.
- The 2012 component-analysis and 2017 antibacterial studies were inspected as primary
  abstracts; full component tables and detailed assay protocols were not independently
  read. The cited 2023 case and 2009/2025 production papers were read in full.
- No exact isolated-ISP-II antibacterial mechanism or regulatory status was established;
  mixture-level activity does not resolve those claims.
- Several direct PMC pages returned verification screens; successful Europe PMC XML
  and alternate public PMC pages were used, and failed response artifacts are retained
  separately.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
