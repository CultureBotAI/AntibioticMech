findings:
- finding_id: F1
  issue_key: carrimycin-mixture-concept-single-congener
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: Resolve the carrimycin mixture before assigning one constituent structure
  description: Carrimycin/bitespiramycin is a documented mixture of isovalerylspiramycins
    I–III and other acylated spiramycins. The native record attaches that preparation-level
    name, source concept and cited case report to one C50H84N2O16 PubChem graph with
    ISP II connectivity. Current ChEMBL is structureless. This is not a permissible
    exact-equivalence relationship in a corpus whose record unit is one chemical structure.
  target_ids:
  - antibioticmech:aro-340d45af79
