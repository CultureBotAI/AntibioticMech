  support: supports
  summary: Both encodings give the same neutral single-fragment C50H84N2O16 structure
    with 19 assigned tetrahedral centres and two specified olefins. Average mass 969.22
    rounds to the native 969.2; exact mass 968.582084608 agrees. The ARO-derived mint
    is correct.
  snapshot_sha256: d04b648c5ea090e0e6001643dd94cd3b7bc6342fae85c0ba4a315ebac7af47d9
- evidence_id: cited-case
  kind: primary_source
  reference: https://doi.org/10.2147/IDR.S407076
  locator: PMID 37113529 / PMC10126721; full Introduction, case treatment and Discussion
    via Europe PMC XML
  accessed_at: '2026-10-21T10:45:44Z'
  support: refutes
  summary: The native cited paper explicitly describes carrimycin as isovalerylspiramycins
    I–III plus other 4-double-prime-acylspiramycins. Its patient received meropenem
    plus carrimycin before carrimycin alone, following several other antibiotics.
    Clinical improvement does not identify the active constituent or establish a pure-congener
    MIC or mechanism. The paper discusses possible mechanisms and states that the
    mechanism for MDR K. pneumoniae remains unclear.
  snapshot_sha256: 6b6acd551749765aeb0a4b2f474e1ac359e67834013f35df6833b27cc70de034
- evidence_id: component-analysis
  kind: primary_source
  reference: https://doi.org/10.1016/j.jpba.2012.03.013
  locator: PMID 22482901 abstract; companion component-production abstracts
  accessed_at: '2026-10-21T10:44:57Z'
  support: refutes
  summary: The inspected primary analytical abstract characterizes bitespiramycin
    as a group of 4-double-prime-acylated spiramycins and reports 38 components in
    commercial samples. PMID 20490499 separately describes the I/II/III mixture and
    engineering a strain producing component I. These are direct evidence against
    treating the preparation name as one exact graph, although complete analytical
    tables were not inspected.
  snapshot_sha256: cb3427eff6bfd41e47fafb21b8eac49ac13e7d0ec5b2286088e6eaa356b71ba1
- evidence_id: producer
  kind: primary_source
  reference: https://doi.org/10.1186/s12866-025-04120-2
  locator: PMC12326811; Introduction, Methods, Results and Figure 3 HPLC profiles
  accessed_at: '2026-10-21T10:45:14Z'
  support: refutes
  summary: Full primary production study identifies carrimycin/bitespiramycin and
    reports nine main HPLC components, including isovalerylspiramycins I, II and III
    as peaks 6, 8 and 9. S. spiramyceticus 54-IA and engineered mutants produce the
    multicomponent material. This supports the producer statement at preparation scope,
    not unique production of only the native graph.
  snapshot_sha256: 6c08839ec774544bf83fe46aea0b2c01cb3d00bbaae69d56fbde44e692d3b47c
- evidence_id: congener-drawing
  kind: primary_source
  reference: https://cdn.ncbi.nlm.nih.gov/pmc/blobs/04c6/12326811/e5c3b73c33ac/12866_2025_4120_Fig1_HTML.jpg
  locator: 2025 Figure 1A, ISP I/II/III substituent key; inspected image
  accessed_at: '2026-10-21T10:45:44Z'
  support: refutes
  summary: The drawing specifies ISP I R=H, ISP II R=COCH3 and ISP III R=COCH2CH3
    at the macrocycle oxygen, all with the 4-double-prime isovaleryl group. The native
    O-acetyl graph matches component II connectivity. This mapping does not independently
    redetermine every absolute stereocentre.
  snapshot_sha256: 5b096f832675bdf88cc14b734d70c6975e1e3508ddca3d64538f289165f03a93
- evidence_id: atom-map
  kind: validation
