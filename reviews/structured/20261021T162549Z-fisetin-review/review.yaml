- evidence_id: primary
  kind: primary_source
  reference: PMID:41543238; DOI:10.1128/spectrum.02374-25; https://pmc.ncbi.nlm.nih.gov/articles/PMC12955415/
  locator: Complete adopted main article, including all Results, Discussion, Methods,
    Tables 1–4, figure captions, ethics/data statements and supplement description.
  accessed_at: '2026-10-21T16:14:02Z'
  support: supports
  summary: The paper tests purchased flavonoid standards rather than freshly isolating
    the assay material from Terminalia. Table 4 identifies fisetin A10388 from Adooq
    Bioscience, formula C15H10O6 and stated purity greater than 98%. Table 1 reports
    250 µg/mL against E. coli ATCC25922, K. pneumoniae ATCC31488, ESBL K. pneumoniae
    ATCC700603 and MRSA ATCC43300; it reports no inhibition at the maximum tested
    concentration for the hospital ESBL E. coli strain or S. aureus ATCC25923. Thus
    the native qualitative activity sentence is supported without implying universal
    activity against resistant bacteria. Materials use Mueller-Hinton medium, water/DMSO
    stocks and twofold dilution from 250 µg/mL. The main text delegates detailed MIC
    protocol to an earlier reference; no additional inoculum, endpoint or incubation
    duration is invented.
  snapshot_sha256: e3f3cc81fbcbb83c68396688f660b3a652176996c9ebeaf5463d2691a3163d6c
- evidence_id: primary-boundaries
  kind: primary_source
  reference: PMID:41543238; DOI:10.1128/spectrum.02374-25
  locator: Complete original efflux, combination, toxicity and limitation sections.
  accessed_at: '2026-10-21T16:14:02Z'
  support: supports
  summary: Only orientin and isoorientin proceed to antibiotic-combination and ethidium-bromide
    accumulation/efflux experiments; those experiments do not establish a fisetin
    efflux mechanism. Fisetin is among compounds called toxic in the Artemia assay,
    and no human safety or clinical efficacy conclusion is supported. Source table
    references and replicate descriptions contain internal inconsistencies, and its
    TI presentation is not used as a validated safety metric. These source limits
    do not contradict the narrow native antibacterial assertion. No producer biosynthesis
    is inferred from historical occurrence in plant extracts.
  snapshot_sha256: e3f3cc81fbcbb83c68396688f660b3a652176996c9ebeaf5463d2691a3163d6c
