limitations:
- HMDB0041883 returned 403 through direct and web access; it remains independently
  attested by ChEBI/PubChem, but its own chemical graph was not inspected. Paid registries
  were not used.
- The 2004 original main prose was read completely, but every large susceptibility-table
  cell and image was not independently reviewed. The 2005 original abstract, introduction,
  methods and early results were read; subsequent publisher fetches returned 403/timeouts,
  so complete later tables are not claimed read.
- The 2008 PBP paper was read completely as main text and Table 1, including the morphology
  caption; the microscopy image and underlying binding traces were not independently
  reprocessed. Its bulk hydrate state is unspecified.
- VCC-1 main prose and Tables 1–2 were read; genomic/sequence figures and raw data
  were not reprocessed. CAM-1 was read at complete-abstract depth and PAM-1 at publisher-extract
  depth; neither is treated as an inspected complete doripenem-specific functional
  dataset. The native assertions retain their database qualification.
- CDC pages establish exact isolate MICs and quoted interpretation provenance. CLSI
  standards were not independently purchased or reinterpreted, and no particular resistance
  determinant is inferred as the cause of these isolate measurements.
- FDA label review covered the identity, relevant activity/indication and microbiology
  sections plus the exact structure image, not a full clinical-safety audit. The two
  regulatory notices were read at exact applicable scope. Other generic approvals
  and other jurisdictions were not exhaustively inventoried; no compound-wide unavailability
  conclusion is made.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native status promotion is implied. Optional claim-level primary PBP evidence
  may be curated separately with assay and species scope, but its absence is not an
  additional finding.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
