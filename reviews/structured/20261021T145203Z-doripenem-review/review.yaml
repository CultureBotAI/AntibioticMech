  support: supports
  summary: 'This study tests 815 selected US clinical isolates collected during 1999–2003
    using NCCLS broth microdilution. It supports broad, phenotype-dependent antibacterial
    activity. The actual study panel is not a Pseudomonas comparison: its antipseudomonal
    statement cites other reports. The paper does not establish an unrestricted ranking
    against every beta-lactam or all later isolate populations. It also does not supply
    the direct PBP competition experiment used in the later follow-up.'
  snapshot_sha256: e24c1687592c38a3b23a7fa0caacc5df5eb554723d03d50ae6c189c3b30c2f8d
- evidence_id: adopted2005
  kind: primary_source
  reference: PMID:16307551; DOI:10.1111/j.1469-0691.2005.01271.x; https://onlinelibrary.wiley.com/doi/full/10.1111/j.1469-0691.2005.01271.x
  locator: Complete indexed abstract and publisher-rendered introduction, methods
    and early results read; later full tables not completely retrieved.
  accessed_at: '2026-10-21T14:43:39Z'
  support: supports
  summary: The 2003 surveillance project tested 16,008 isolates. Its 829 P. aeruginosa
    isolates and contemporary comparator panel support the historical doripenem/meropenem
    ranking. Methods describe reference broth microdilution and manufacturer-provided
    standard powder. This is a bounded in-vitro comparison, not a timeless claim about
    every beta-lactam or clinical efficacy.
  snapshot_sha256: 7c1d026c5ef8354b4c4f173cb2cf1b7781e3d2ae7d2d733870edec611ed96a7b
- evidence_id: pbp2008
  kind: primary_source
  reference: PMID:18250190; DOI:10.1128/AAC.01529-07; PMC2292531
  locator: Entire original main article and complete Table 1 read, including methods
    and morphology figure caption; image itself not independently assessed.
  accessed_at: '2026-10-21T14:45:01Z'
  support: supports
  summary: Membrane preparations from E. coli MC4100 and P. aeruginosa PAO1/ATCC 27853
    were tested by Bocillin FL competition. Doripenem preferentially inhibited labeling
    of essential PBP2 in E. coli and PBP2/PBP3 in P. aeruginosa, supporting the general
    PBP target. These IC50 values are competition endpoints, not equilibrium Kd measurements
    or whole-cell MICs. Separate broth MICs and morphology experiments were reported;
    their association does not isolate every contribution to killing. Exact bulk hydrate
    status is not specified. Optional claim-level primary enrichment can preserve
