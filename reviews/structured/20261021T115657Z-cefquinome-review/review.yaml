  - Use an inspected exact-use source for the mastitis clause, retaining cattle, susceptible-organism
    and sulfate-product context. Keep PMID 37280708 only for its porcine microbiome/resistome
    claim.
  - Implement through maintained ARO input/extraction and seeder source-selection
    ownership with required provenance; the existing aro_definition_overrides setting
