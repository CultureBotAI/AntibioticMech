  locator: 247-PMC10242799.xml; complete Introduction/Methods and scoped Results/Discussion
  accessed_at: '2026-10-21T11:48:10Z'
  support: partial
  summary: 'The adopted original study concerns 17 healthy seven-week-old pigs: six
    received Ceffect cefquinome, six ceftiofur and five saline. It measured fecal
    16S/shotgun composition and resistance-gene abundances before/end of treatment
    and 7/21 days later. It did not test coliform mastitis treatment or clinical cure.
    Introductory pig-use context and discussion of other cattle studies do not establish
    the native mastitis-use clause.'
  snapshot_sha256: 005f9acbf94ccb4135fb28b70cd042d6edb41c37d3f5278e8fe59166d1ff0b22
- evidence_id: resistome-boundary
  kind: primary_source
  reference: PMID:37280708
  locator: Methods, Results Table 1, resistome profiles and final Discussion
  accessed_at: '2026-10-21T11:48:10Z'
  support: context_only
  summary: The study reports differential abundance under an FDR threshold of 0.10,
    with six ARG signals after cefquinome and no significant global resistome difference
    from control at later sampling. These are DNA-abundance associations, not direct
    enzyme-substrate experiments, gene expression or individual-isolate MICs. The
    authors expressly request functional follow-up. No cefquinome resistance edge
    is inferred from CfxA6 or co-selected genes.
  snapshot_sha256: 005f9acbf94ccb4135fb28b70cd042d6edb41c37d3f5278e8fe59166d1ff0b22
- evidence_id: official-product
  kind: authority
  reference: https://www.vmd.defra.gov.uk/productinformationdatabase/files/SPC_Documents/SPC_85021.PDF
  locator: March 2021 SPC, sections 1–4.2, printed pp.1–2
  accessed_at: '2026-10-21T11:48:10Z'
  support: supports
  summary: Cobactan injection contains 25 mg cefquinome-equivalent per mL as 29.64
    mg cefquinome sulfate. The official indications include acute E. coli mastitis
    with systemic involvement in cattle and specified susceptible-organism infections.
    This directly supports qualified veterinary use of the sulfate formulation; it
    does not make the neutral zwitterion a product or transfer dose mass between forms.
  snapshot_sha256: 7f7e1aa2aa7b27fdf1c9f4c19a8a3d38738aa663460a494f32cbe08cf884bd80
- evidence_id: bovine-primary
  kind: primary_source
  reference: PMID:9058274; DOI:10.3168/jds.S0022-0302(97)75941-1
  locator: 247-additional-core.json, complete original abstract
  accessed_at: '2026-10-21T11:48:10Z'
  support: partial
  summary: The original study randomized 47 early-lactation Israeli Holstein cows
    with experimentally induced E. coli mastitis to four cefquinome/comparator regimens.
    Cefquinome groups improved bacteriological cure; parenteral-containing groups
    improved clinical recovery. This is direct primary support for a bounded mastitis-treatment
    claim. Full reagent/formulation and trial methods were not inspected; no quantitative
    native observation is imported.
  snapshot_sha256: fbbf75ac5d258f6a34d23be448ca8fdaf28c1f8ab484c3a14c90a2169354596f
- evidence_id: mouse-primary
  kind: primary_source
  reference: PMID:28824576; DOI:10.3389/fmicb.2017.01445
  locator: 247-PMC5539083.xml, Introduction, complete Methods and Results including
    tables/captions
  accessed_at: '2026-10-21T11:48:10Z'
  support: partial
  summary: Original mouse mastitis research used bovine milk isolate E. coli 8, reported
    MIC 0.25 micrograms/mL and examined bacterial-load responses and gland PK. Each
    gland was treated as a sample, with paired glands from each mouse; animal and
    gland denominators must remain distinct. Exact reagent salt is not specified in
    inspected methods. Figure 3 caption says mg/gland while Methods/Results use micrograms/gland,
    so dose extraction needs source resolution. This study supports the limited model,
    not an unqualified bovine regimen or exact neutral-form assay.
  snapshot_sha256: c81a6052a3756d4b6218fae6e53e68e8d6877da5db9ecc0edd1a591b61995de6
- evidence_id: original-activity
  kind: primary_source
  reference: PMID:2014969; DOI:10.1128/AAC.35.1.14
  locator: 247-page14.png through 247-page19.png; all six original printed pages;
    Tables 1–3 and Figure 2
  accessed_at: '2026-10-21T11:48:10Z'
  support: supports
  summary: Original HR111V paper depicts cefquinome zwitterion and identifies Hoechst
    synthesis without a separately specified bulk salt. Aerobic agar dilution used
    Mueller-Hinton agar, about 5×10^4 CFU/spot, 24 h at 37 C, with organism-specific
    exceptions. Table 2 reports E. coli (40 isolates) MIC90 0.391 micrograms/mL and
    P. aeruginosa (100) MIC90 25; these are historical panel summaries. Figure 2 uses
    125I-ampicillin competition against E. coli K-12 PBPs; preferential PBP3 labeling
    competition at low concentrations and PBP1A/B at higher concentrations is not
    direct radiolabeled-cefquinome binding or a Kd measurement. Form-specific quantitative
    transfer would require material and concentration-basis confirmation.
  snapshot_sha256: dd0af3926ba764b8425d292e4e3ce8eb7f3d8c98bcf01ec6febf8d87a9aff7c5
- evidence_id: additional-activity
  kind: primary_source
  reference: PMID:1611848; DOI:10.1016/0732-8893(92)90019-P
  locator: 247-additional-core.json, complete original abstract
  accessed_at: '2026-10-21T11:48:10Z'
  support: partial
  summary: A separate original comparative study reports bounded in-vitro spectrum
    and hydrolysis by TEM-3, TEM-5 and TEM-9 despite stability to several other enzymes.
    This limits universal resistance prose from the earlier study; native does not
    assert universal beta-lactamase stability. Full methods were not inspected.
  snapshot_sha256: fbbf75ac5d258f6a34d23be448ca8fdaf28c1f8ab484c3a14c90a2169354596f
