limitations:
- The original bovine trial and 1992 comparison were inspected at complete abstract
  depth only. The 2017 mouse study was read through Methods/Results, not all supplementary
  or cited protocols.
- The adopted 2023 source was inspected for its actual experiment and source scope;
  genomic abundance is not functional protein or MIC evidence. No claim of causal
  resistance from the six ARG signals is made.
- Official product evidence is the dated March 2021 sulfate SPC, not an assertion
  of current marketing status. Original 1991 activity/competition paper does not specify
  the bulk salt or dose-equivalent calculation.
- Supplemental RDKit used the existing 019 interpreter against 025; native schema/strict
  used 025 own frozen environment. Full shared QC results are integrated before final
  save. No native/status/history edits or paid research occurred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The source-authority molecular graph is not automatically the bulk experimental
  material. Salt, hydration, strain, assay and concentration basis remain explicit.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
