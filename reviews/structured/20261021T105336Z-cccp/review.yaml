  acceptance_checks:
  - Inspect the 2021 mBio methods and relevant figure data for the exact selected
    observation. Preserve NCM3722 versus EK07 strain and medium differences; use the
    actual growth or membrane-potential endpoint rather than relabeling it MIC or
    bacterial death.
  - Attach protonophore/PMF evidence at the narrow mechanism claim. Do not infer direct
    TolC binding, membrane lysis, bacterial ROS causality or bacterial p62/Nrf2/RPL5
    targets.
  - Keep CCCP pretreatment/persistence, colistin or PAAG combination outcomes and
    mitochondrial host-cell effects in separate qualified statements. Do not transfer
    PAAG membrane-permeability or killing measurements to CCCP.
  - If quantitative activity or a causal graph is added, retain dose, exposure, medium,
    strain, endpoint and source limitations; inspect supplemental material needed
    for the selected claim first. No producer or microbial resistance mechanism should
    be added from the current host or cyanobacterial context papers.
  - Use write_validated_antibiotic and record_curation_event for separately authorized
    curation of the actual native record, retain source provenance, and satisfy focused
    and applicable shared gates before any status promotion.
limitations:
- All 13 original input hashes were checked unchanged. The entire native record, exact
  maintained source row and relevant role-mapping/extraction/seeding code were inspected.
- All ten adopted abstracts and identifier pairs were read. One is a secondary review
  and is classified as context. Several full primary papers were unavailable or outside
  the bounded follow-up; their experimental details are not claimed verified.
- The 2021 mBio main text and the 2018 PAAG main text were inspected, including relevant
  methods, tables and captions. Their underlying supplemental files and figure images
  were not independently audited. Numerical activity additions should be checked against
  those original data before curation.
- Additional downloaded PMC5937758, PMC6620853 and PMC8440630 files are not treated
  as fully read or as evidence for new claims beyond explicitly inspected abstracts;
  download does not constitute review.
- LINCS LSM-2341 remains source-attested but independently unresolved after public
  resolver and portal access failures. Beilstein was checked through inspected source
  attestations rather than a subscription registry.
- The mitochondrial-response structured adapter catalog was consulted before web research;
  no covered exact host dataset applied. This does not imply absence of the biological
  response.
- This is a partial scientific review because full-paper details for some adopted
  claims and the LINCS entry remain unresolved. No native scientific status promotion
  follows from the passing deterministic checks.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
