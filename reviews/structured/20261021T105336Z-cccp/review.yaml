- evidence_id: pmf2021
  kind: primary_source
  reference: PMID:34253054; DOI:10.1128/mBio.00676-21; PMC8406135
  locator: Complete main text, Methods, Results and figure/supplementary captions;
    underlying supplementary files not independently inspected.
  accessed_at: '2026-10-21T10:49:36Z'
  support: supports
  summary: Exact CCCP experiments show reduced population growth and heterogeneous
    growth arrest with PMF dissipation in E. coli K-12 NCM3722 in MOPS minimal medium
    at 37 °C. Single-cell growth, transport/potential indicators and a TolC deletion
    compare efflux-dependent responses. Flagellar-motor experiments use a separate
    K-12 MG1655-derived EK07 strain and MM9 conditions. These support protonophore
    action and condition-dependent growth effects, not universal MICs, membrane lysis
    or direct binding to an efflux protein. Washout recovery and nongrowing cells
    must not be relabeled bactericidal endpoints.
  snapshot_sha256: cdf871475f69072efa59f83508195b275113691f929c75ee46f91fc73b1e4292
- evidence_id: paag2018
  kind: primary_source
  reference: PMID:30123191; DOI:10.3389/fmicb.2018.01724; PMC6085434
  locator: Main text including Methods, Results and Discussion; Table 1 and figure
    captions.
  accessed_at: '2026-10-21T10:49:36Z'
  support: supports
  summary: CCCP pretreatment of P. aeruginosa, named PA01 by the paper, uses 200 µg/mL
    for 3 h followed by washing to generate persister-like cells. Their survival and
    response to subsequent antibiotics are the experimental context. Killing, permeability
    and depolarization results attributed to PAAG or colistin cannot be transferred
    to CCCP alone. This paper does not supply a standalone CCCP MIC or a genetically
    encoded CCCP resistance mechanism.
  snapshot_sha256: 9923344017a6cbca94de304b723a65cb6827fc3a03cc87d1ca78fa141dfca626
- evidence_id: colistin2015
  kind: primary_source
  reference: PMID:25557480; DOI:10.1007/s12275-015-4498-5
  locator: Entire adopted abstract and bibliographic metadata only.
  accessed_at: '2026-10-21T10:49:36Z'
  support: partial
  summary: CCCP at 25 µM lowers colistin MICs and modifies time-kill behavior in A.
    baumannii combinations. The abstract distinguishes the effect from CCCP toxicity
    alone and does not find increased expression of selected efflux genes. A proposed
    metabolic explanation and combination endpoints do not prove direct efflux-pump
    binding or standalone CCCP bactericidal potency. Full methods and tables were
    not inspected.
