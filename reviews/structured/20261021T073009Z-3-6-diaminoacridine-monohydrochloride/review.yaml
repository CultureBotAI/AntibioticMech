limitations:
- Direct registry detail was unavailable. CAS 952-23-8 is independently corroborated
  by official IARC identity; Reaxys 4023620 remains an inspected ChEBI assertion.
- The 2022 paper explicitly names the hydrochloride but supplies no catalog/CAS or
  analytical reagent characterization. Its full text supports spectroscopy in a synthetic-DNA
  system, not organism-level antibacterial mechanism or potency.
- The adopted IARC source was inspected as its official historical summary and publication
  metadata, not the full volume. The 2009 yeast primary abstract was inspected, but
  full Methods and compound-specific results were unavailable.
- The sensor paper contains conflicting proflavine and methylacridinium reagent names
  and was excluded from exact-form evidence. Bounded searches do not prove absence
  of other exact-compound studies.
- No paid research, native edit or saved review bundle occurred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
