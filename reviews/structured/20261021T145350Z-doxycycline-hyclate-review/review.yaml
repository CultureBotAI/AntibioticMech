  accessed_at: '2026-10-21T14:51:46Z'
  support: supports
  summary: The record is the hydrochloride hemiethanolate hemihydrate of doxycycline.
    It has no native molecular-target, resistance, MIC, producer or causal-graph objects.
    The clinical rows share a verified template but every application/product, sponsor,
    date, marketing status and reference was read; exact reconstruction preserves
    all fields and order.
- evidence_id: chemistry
  kind: authority
  reference: CHEBI:34730; UNII:19XTS3T51U; PubChem54729367/54686183; KEGG D02129
  locator: 371-chebi.json/.mol;371-gsrs.json;371-pubchem.json;371-kegg.txt/.mol;371-authority-chemistry.json
  accessed_at: '2026-10-21T14:51:46Z'
  support: supports
  summary: 'The six-component formula unit contains two doxycycline units, two hydrochloride
    equivalents, one ethanol and one water: hemiethanolate hemihydrate per doxycycline
    hydrochloride. Nine encodings retain twelve configured centers and converge after
    explicit proton-transfer and per-fragment tautomer normalization with stereo removal
    disabled. Aggregate C46H58Cl2N4O18, zero total charge and masses agree. Native/current
    ChEBI/GSRS use HALQELOKLVRWRI-VDBOFHIQSA-N; the two selected PubChem encodings
    use a different enol pattern, not a demonstrated epimer. Other name-search hits
    with different composition are excluded from exact-form equivalence.'
  snapshot_sha256: fbf4aa92c56f46945ea9050ec802f70b72a351195cb663039627efa9dde78b2c
- evidence_id: terms
  kind: authority
  reference: CHEBI:35505 and CHEBI:36047
  locator: 371-parent.json hydrate definition;371-role.json antibacterial-drug definition;371-chebi.json
  accessed_at: '2026-10-21T14:46:38.914047Z'
  support: supports
  summary: The native parent is hydrate and the role is antibacterial drug. Both resolve
    and fit the explicitly water-containing formulation and supported antibacterial
    use. The full hyclate graph, rather than the parent label alone, preserves its
    additional hydrochloride and ethanol components.
  snapshot_sha256: bde2e2cf963cf7866398a4510246bd6c0e63d37f4e2c62fb7593b90570dfdb09
- evidence_id: aliases
  kind: authority
  reference: ChEBI aliases; California OEHHA exact CAS24390-14-5 page
  locator: 371-chebi.json synonyms; https://oehha.ca.gov/chemicals/doxycycline-hyclate,
    browser-opened synonym section
  accessed_at: '2026-10-21T14:46:38.121787Z'
  support: supports
  summary: Current ChEBI retains all three names. The official OEHHA page independently
    recognizes the abbreviated 6-deoxy-5-hydroxytetracycline hydrochloride hemihydrate
    alias under the exact hyclate CAS. That conventional short alias is not used to
    erase ethanol from the explicit structure or to assert a separate ethanol-free
    material. The shell OEHHA response was a challenge page; the synonym section was
    inspected through browser retrieval, not from that local HTML.
  snapshot_sha256: 23219960b7e2708195afd52dc67a023eadc3c91da8f8a2633efd92ead6be46c7
- evidence_id: ribosome
  kind: primary_source
  reference: PMID:42225615; DOI:10.1038/s41467-026-73421-5; PMC13392368
  locator: '371-ribosome.xml main Results, Discussion and complete Methods: ribosome
    isolation/grid preparation, canonical 30S binding, 50S modes and MIC subsection'
  accessed_at: '2026-10-21T14:47:42.147458Z'
  support: supports
  summary: Purified E. coli BL21(DE3) and C. burnetii NMII ribosomes were incubated
    with 50 micromolar doxycycline hyclate, Merck D9891. Cryo-EM resolves the canonical
    small-subunit site plus distinct large-subunit binding modes. These are structural
    observations using the exact named reagent and support the broad protein-synthesis
    mechanism. The authors explicitly decline direct causation between structural
    occupancy and comparative whole-cell MICs. High-concentration purified-ribosome
    occupancy is not universal clinical site occupancy, and no new numeric native
    MIC or exclusive subunit claim is adopted.
  snapshot_sha256: 73ad805876ddf07b6760a519cafdf4071dfceac327840d0de48039d7f0443404
- evidence_id: label
  kind: authority
  reference: DailyMed doxycycline hyclate SPL ccf9708a-ed3b-4786-b3a6-e96125b2f9d5;
    UK SmPC 13082
  locator: 371-hyclate-label.xml description, mechanism and indications;371-uk-smpc.html
    sections 2, 4.1 and 5.1
  accessed_at: '2026-10-21T14:47:42.148519Z'
  support: supports
  summary: Both products explicitly contain doxycycline hyclate with strengths expressed
    as doxycycline. The US description gives the two-parent/ethanol/water formula
    unit; its mechanism and indication sections support antibacterial protein-synthesis
    inhibition and specified urethral/endocervical infections. The UK exact-hyclate
    SmPC also supports chronic-bronchitis use. Susceptibility, pathogen and product
    scope remain relevant; the definition is not a universal treatment recommendation.
  snapshot_sha256: 8708b1fdcaf26fd8a02a6380dce0b24db41b755956eb257992a57477b70ca0a3
- evidence_id: periodontal
  kind: authority
  reference: FDA NDA050783 Periostat official historical label
  locator: 371-periostat-fda.pdf p1 description, clinical pharmacology, clinical study
    and indication;371-periostat-fda-flow.txt
  accessed_at: '2026-10-21T14:47:42.148679Z'
  support: supports
  summary: The exact hyclate formulation and 1025.89 formula-unit mass agree. A randomized
    nine-month study compared low-dose doxycycline hyclate plus scaling/root planing
    with placebo plus the same procedure in 190 adults. The indication is adjunctive
    periodontal treatment. The label distinguishes collagenase-related effects and
    states that this regimen is below antimicrobial concentrations, with no observed
    plaque bacterial-count effect. Thus periodontal use must not automatically inherit
    an antimicrobial mechanism from higher-dose hyclate products. The native definition
    lists uses without claiming that every use shares one causal mechanism.
  snapshot_sha256: 1392536c5844811f64bef87cb45c08a366ea552064f43490a25b94a21ec34d3a
- evidence_id: clinical-originals
  kind: primary_source
  reference: PMID:3548981 and PMID:377038
  locator: 371-primary-core.json complete original abstracts
  accessed_at: '2026-10-21T14:47:42.148286Z'
  support: supports
  summary: The urethritis/cervicitis study explicitly tested doxycycline hyclate in
    50 patients with Chlamydia trachomatis infection, reporting separately pathogen
    eradication and symptom response. The chronic-bronchitis comparison tests doxycycline
    but its abstract does not identify the exact salt or solvation state; it supplies
    clinical context only. Neither abstract is used to assign universal efficacy or
    a detailed mechanistic endpoint.
  snapshot_sha256: a84c7df23a5ed1dcf686188bc0e3dfdc60fdd39809da32fd225e2f490a2cb104
- evidence_id: copd-boundary
  kind: primary_source
  reference: PMID:19875685 and PMID:28483402
  locator: 371-copd-core.json complete original trial abstracts
  accessed_at: '2026-10-21T14:50:11.595238Z'
  support: context_only
  summary: The inpatient COPD trial separates short-term endpoints favoring doxycycline
    from a nonsignificant day 30 primary clinical-success comparison. The outpatient
    trial found no prolongation of time to the next exacerbation when doxycycline
    was added to prednisolone. These context- and endpoint-specific results prevent
    interpreting historical use as universal benefit. Their abstracts do not establish
    exact hyclate-versus-monohydrate material comparisons.
  snapshot_sha256: d7f5d1e7c8e858a7df061acf92e1fd4dd60bad35f7de3d54da6788f6fe932b89
