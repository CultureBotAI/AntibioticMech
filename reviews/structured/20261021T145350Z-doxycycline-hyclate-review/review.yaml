limitations:
- The exact hyclate is a salt/solvate formula unit; doses in official products are
  commonly expressed as doxycycline equivalents. The doubled formula and 1025.886
  mass are not evidence of a covalent doxycycline dimer or an incorrect stoichiometry.
- The primary 2026 cryo-EM study uses 50 micromolar hyclate with purified ribosomes
  and explicitly limits causal interpretation of comparative MICs. No general claim
  that its observed 50S modes dominate every organism or clinical exposure is inferred.
- The clinical trial abstracts do not all specify exact solid form. Their COPD outcomes
  depend on population, concomitant corticosteroids and endpoint. Low-dose Periostat
  has an adjunctive host/periodontal context distinct from higher-dose antimicrobial
  products.
- Six current sponsor labels differ from the frozen source. The initial supplemental
  equality assertion failed and is preserved; the subsequent full comparison found
  the stated sponsor differences without an ingredient, approval-date or marketing-status
  mismatch for the 174 native rows. The current query also returns entries beyond
  the frozen native set; no claim of comprehensive current-product coverage is made.
- The abbreviated conventional synonym does not spell out ethanol; explicit structure,
  full chemical name and label formula remain the authoritative solvation description.
- DrugBank was blocked and Reaxys is licensed; their full contents were not verified.
  A failed MHRA link and challenge-only shell response are distinguished from the
  successful FDA label and browser OEHHA reads.
- Native focused checks passed; shared corpus-gate outcomes are integrated separately.
  Native records and maintained inputs were not edited.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- 'No adopted ChEBI PMID lead was omitted: both the frozen row and current exact record
  have no citation entries. The new primary papers and official labels are independently
  located evidence.'
- A structured target/causal enrichment could use the exact-reagent ribosome source
  with its organism and assay qualifiers, but absence of optional native target objects
  is not treated as a defect.
- Standalone chemical mapping used the batch 019 interpreter against batch 038. Native
  schema/strict and source-ledger checks used batch 038.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
