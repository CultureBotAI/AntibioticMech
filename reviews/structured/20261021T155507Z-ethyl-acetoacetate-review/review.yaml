limitations:
- Nine adopted abstracts were available and read; PMID30890485 has no abstract. The2018
  publisher routes returned403, so only its full abstract supports the bounded activity
  statement. All six additional current abstracts were read.
- The2021 main paper was read at the stated Results/Methods scope and actual Table3
  was viewed; a complete supplementary audit or safety evaluation was not performed.
  Its antimicrobial concentration units conflict with preparation units and are physically
  problematic as printed. No corrected unit is guessed.
- FooDB and HMDB returned403, MetaCyc returned a login page, Reaxys was not independently
  accessible, and Wikipedia routes returned429. Exact graph agreement for other linked
  authorities does not certify those unread records.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
