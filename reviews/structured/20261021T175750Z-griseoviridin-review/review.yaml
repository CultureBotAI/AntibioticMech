    comparison. Table1 single-agent MICs are 1.56 µg/mL for M.avium JCM15430 and M.intracellulare
    JCM6384, >100 for M.smegmatis M341, and 6.25 for M.bovis BCG Pasteur. The liquid
    assay used supplemented 7H9,37°C120h followed by MTT; MIC was 90% growth inhibition.
    These exact preparation/strain endpoints are distinct from complete growth inhibition
    and clinical susceptibility.
