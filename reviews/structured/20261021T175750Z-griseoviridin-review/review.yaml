findings:
- finding_id: F1
  issue_key: griseoviridin-native-zz-versus-natural-ee
  category: identity
  severity: blocker
  status: open
  certainty: confirmed
  title: The native structure has the wrong conjugated-diene geometry
  description: 'Native SMILES/InChI and CID6441064 specify Z at both diene bonds (zero-based
    native atoms 9=10 and 11=12). Original 2019 natural-isolate Fig1 and 2024 synthetic
    griseoviridin Fig1/Scheme1 show E/E. The tetrahedral centres need not be inverted:
    changing only those bonds in scratch gives key UXWOXTQWVMFRSE-JCSRQJCQSA-N, exactly
    matching current candidate CID11225326. The named natural-product identity cannot
    be repaired by internal validation or by retaining a faithfully copied wrong fallback.'
  target_ids:
  - antibioticmech:aro-4a4590abba
