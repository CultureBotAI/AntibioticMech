summary: The stored PubChem-derived graph has a Z/Z diene, whereas independently inspected
  natural-isolation and total-synthesis primary figures show E/E griseoviridin. This
  is a blocker identity failure despite internally coherent chemistry. Current CHEBI:199588
  also differs at one alcohol stereocentre and is not a safe replacement. The 26 resistance
  associations and the ribosomal target retain honest database qualification; the
  review does not promote broad CARD bibliography into exact-compound evidence.
