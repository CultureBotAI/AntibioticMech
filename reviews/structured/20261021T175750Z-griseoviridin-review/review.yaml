limitations:
- Required shared full-corpus gates are incorporated separately by root before finalization;
  actual focused gates are recorded here.
- The 1976 original crystallographic/constitution papers (PMID1254852 and1033191)
  and 2000 total-synthesis paper were read only at metadata depth; publisher full
  text was not retrieved. The 2019 and 2024 main papers and actual structure figures
  independently establish the diene conflict. Linked supplementary PDFs returned access
  challenges/403 responses, so individual NMR spectra and full original absolute-configuration
  proofs were not reanalyzed.
- The 2024 main contains an apparent quinupristin/dalfopristin group-label swap in
  its background paragraph. That unrelated prose was not used to classify native griseoviridin;
  primary structure, synthesis and isolated-product passages are the basis here.
- All48 current ontology citation leads were disposed individually:47 original abstracts
  plus the definition review metadata; selected 2012 Clb Methods/Results were additionally
  inspected. This is not full-text experimental adjudication of every resistance edge.
  The1975 exact-GV mechanism source remains abstract-depth.
- Several EPMC fullTextXML routes returned 500, while PMC/ACS/MDPI endpoints returned
  403 or HTTP200 challenge HTML. Fetch manifests preserve those failures; later successful
  main/figure retrievals are separately hashed. The failed generic Figshare route
  and mistyped initial Clb publisher DOI were not treated as evidence.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- The original 13 input hashes and all 29 expanded input hashes were rechecked before
  draft creation. All source/figure snapshots used for findings have explicit hashes
  and actual access timestamps.
- No native record, maintained source, history, progress file, saved review bundle
  or Git state was edited. Root retains final bundle saving and publication.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
