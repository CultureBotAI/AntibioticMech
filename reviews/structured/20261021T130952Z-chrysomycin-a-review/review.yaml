  locator: 'Original PMC10403215 XML: Introduction, Results, Discussion, Methods and
    all main figure captions; Figure1 visually inspected'
  accessed_at: '2026-10-21T13:08:46Z'
  support: supports
  summary: The paper classifies ChryA as a gilvocarcin C-arylglycoside and tests fermentation-purified
    material (at least96%). S.aureus MIC, persister CFU, biofilm and murine intradermal
    infection experiments support activity. GlmU/DapD enzyme inhibition, binding and
    genetic experiments support a multitarget interpretation. It supplies no GyrB
    experiment. Mouse dosing was into wounds; this is not clinical efficacy. Crystal-violet
    biomass and viable counts are distinct endpoints.
  snapshot_sha256: 4680e0d6c23726eed08acd570ff6ddb081577e3a95a4dd1f9ac60911e7d0cf17
- evidence_id: primary-boundaries
  kind: primary_source
  reference: PMID:37540745
  locator: Original assay Methods and mechanistic Discussion
  accessed_at: '2026-10-21T13:08:46Z'
  support: context_only
  summary: Purified-enzyme inhibition, MST affinity, genetic rescue and whole-cell
    killing are separate observations. The authors reserve confirmation for additional
    putative targets and discuss ROS/DNA damage cautiously. Biofilm exposure reporting
    differs between Results and Methods; exact quantitative adoption needs reconciliation.
    Supplementary captions and TablesS1-S4 were read; Figure1 pixels were inspected.
    Other figure pixels and raw assay data were not audited.
