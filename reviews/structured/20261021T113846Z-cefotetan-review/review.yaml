limitations:
- The core identity is supported, but exact full-key normalization remains unresolved.
  ChEBI/ChEMBL and coordinate-bearing KEGG representations retain a /b12-6- layer
  absent from current PubChem and SMILES-generated InChI. Drawing-coordinate sensitivity
  was reproduced with RDKit 2026.03.5 and InChI 1.07.3. No independent isolated-isomer
  assignment or mandated source correction was established; do not infer an E/Z substitution
  solely from the keys.
- The native CfxA edge is current database evidence, not a primary claim. All nine
  pages of its cited original paper were read; its cefoxitin experiments cannot establish
  cefotetan-specific activity or absence. Any promotion to primary evidence needs
  an exact CfxA allele, cefotetan reagent and demonstrated assay. The additional crude-extract
  paper is untyped and cannot supply that attribution.
- Seven of nine adopted MED records have complete abstracts and were read; two parent
  reviews are metadata-only. ACC-1 and ACC-4 original full text and all CfxA scanned
  pages were inspected. The additional direct PBP study and untyped Bacteroides hydrolysis
  study were read at complete-abstract depth; the attempted PBP PDF returned 403.
- CAS was corroborated through chemical authorities rather than direct registry access.
  DrugBank access returned 403 but its mapping is corroborated through ChEBI and DrugCentral.
  The LINCS resolver returned 500; Reaxys was not independently resolved. Patent family
  text and relevant claims were inspected without assigning every example, and Wikipedia
  was kept as a contextual document.
- No quantitative observation was imported from a drug formulation, radiolabeled reagent,
  broad patent family or untyped enzyme extract. If a curator adds PBP or resistance
  measurements, verify exact tested form, organism/strain, expression construct and
  assay conditions, preserve database provenance, and use the native writer plus curation
  history.
- Chemistry used the existing 019 interpreter against the 024 checkout because the
  native environment lacks RDKit. Successful focused checks do not replace required
  shared corpus checks.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
