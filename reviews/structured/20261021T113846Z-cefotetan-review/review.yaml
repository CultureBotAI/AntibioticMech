evidence:
- evidence_id: record
  kind: record_content
  reference: data/antibiotics/antibacterial/cefotetan.yaml
  locator: Entire YAML, all seven synonyms and four history events
  accessed_at: '2026-10-21T11:29:24Z'
  support: supports
  summary: The native exact neutral cefotetan record contains two resistance mechanisms,
    ACC-1 and CfxA, each explicitly identified as a CARD/ARO database assertion. It
    has no populated primary molecular target, mode, producer, MIC or causal graph.
    The history contains source seeding events, not scientific sign-off.
- evidence_id: chemistry
  kind: validation
  reference: CHEBI:3499; PubChem:53025; CHEMBL474579; KEGG:C06886; KEGG:D00260
  locator: 235-chemistry.py/.json; 235-pubchem.json; 235-chembl.json; both KEGG molfile
    snapshots
  accessed_at: '2026-10-21T11:29:24Z'
  support: partial
  summary: RDKit 2026.03.5 with InChI 1.07.3 confirms C17H17N7O8S4, charge 0, average
    mass 575.632 and exact mass 575.0021445, with 6R/7S cephem centers. Native and
    ChEMBL SMILES generate SRZNHPXWXCNNDU-RHBCBLIFSA-N, agreeing with current PubChem.
    Stored ChEBI/ChEMBL InChI and both KEGG drawings generate SRZNHPXWXCNNDU-IXOPCIAXSA-N,
    whose extra layer is /b12-6-. Removing only coordinates from either KEGG molecule
    yields the former key without changing canonical isomeric SMILES or mutual chiral
    graph matching. This demonstrates representation sensitivity; it does not prove
    a different isolated geometric isomer or justify automatic removal of PubChem.
  snapshot_sha256: 30e59ed1336da577b9b8764b0149b96c4dad453fe1f84eaa49de45b12f4dd532
- evidence_id: grounding
  kind: authority
  reference: CHEBI:3499; CHEBI:55429; ARO:3004004; ARO:0000032; CHEBI:33281; CHEBI:36047
  locator: 235-ols.json; 235-parent.json; 235-aro-stanzas.txt; exact owner-row snapshots
  accessed_at: '2026-10-21T11:29:24Z'
  support: supports
  summary: Current ChEBI resolves the compound and cephamycin parent, and the ARO
    compound/class entries resolve. The native 7-alpha-methoxy core fits the cephamycin
    subgroup within the broader cephalosporin class. The source roles and original
    compound-specific activity support antibacterial classification. The definition
    says resistance to a wide range of beta-lactamases, not all enzymes; the inspected
    exceptions do not contradict that qualified wording.
  snapshot_sha256: f66da504ab3ecb8024988b2587e2ea19eac8a839e2ef9ce3083fa51b97e1ecf5
- evidence_id: xref-context
  kind: authority
  reference: cas:69712-56-7; drugbank:DB01330; drugcentral:547; kegg.drug:D00260
  locator: 235-drugcentral.html; 235-kegg.txt; 235-ols.json; 235-fetch-results.json
  accessed_at: '2026-10-21T11:29:24Z'
  support: partial
  summary: DrugCentral 547 resolves to cefotetan with neutral formula and drug/formulation
    context, including disodium terminology. KEGG D00260 represents the free-acid
    graph and is appropriately contextual as a drug record. DrugBank DB01330 and CAS
    are corroborated by inspected authorities rather than independent registry validation;
    direct DrugBank returned 403. LINCS LSM-5961 resolver access returned 500, and
    Reaxys 5697364 was not independently resolved. These access limits are not evidence
    of incorrect mappings.
  snapshot_sha256: ccf580aa2ee15688c6a8174c319925b7553b2b7c8d69324c0dd2411db9a88e6a
- evidence_id: adopted-leads
  kind: database
  reference: Nine adopted or parent MED records
  locator: 235-core.json; 235-lead-dispositions.json
  accessed_at: '2026-10-21T11:29:24Z'
  support: context_only
  summary: All nine resolve. Seven complete abstracts were inspected, covering ACC
    variants, cefotetan activity/pharmacokinetics, CfxA, beta-lactam allergy and ESBL
    context. Reviews PMID15673804 and PMID6810737 have metadata only. Review citations
    are not treated as direct assays.
  snapshot_sha256: 627313cc23cfc15ba38c2c629867d32811f516fec1452c71e2071f09e98c3866
- evidence_id: acc1
  kind: primary_source
  reference: PMID:10428914; DOI:10.1128/AAC.43.8.1924
  locator: 235-acc1.html and text; original methods, Results and Tables 2-3
  accessed_at: '2026-10-21T11:29:24Z'
  support: supports
  summary: The original ACC-1 study reports cefotetan inactivation in a pI 7.7 gel-overlay
    bioassay. Table 2 gives cefotetan MIC 2 micrograms/mL in the cloned E. coli MV1190
    transformant versus 0.06 in its host; the transconjugant is 1 versus 0.13 in its
    recipient and also contains TEM-1. Table 3 steady-state cefotetan hydrolysis is
    below the reported threshold (Vmax <0.001 nmol/min/microgram protein), so those
    kinetics alone are not positive quantitative hydrolysis. The independent overlay
    evidence and cloned-host MIC change support a bounded inactivation association,
    not universal clinical resistance.
  snapshot_sha256: 179e3809181341d46a461ef98f6981edcd093eb84f0ece576e15667cd01ba257
- evidence_id: acc4
  kind: primary_source
  reference: PMID:17664321; DOI:10.1128/AAC.00389-07
  locator: 235-acc4.html; Table 2 and original methods/results
  accessed_at: '2026-10-21T11:29:24Z'
  support: supports
  summary: The ACC-4/ACC-1 comparison reports cefotetan MIC 1 microgram/mL for both
    alleles in both tested vectors in E. coli MC4100 delta-ampC versus 0.5 in vector
    controls. Cefotetan is absent from the kinetic table. The paper therefore does
    not establish superior cefotetan hydrolysis by ACC-4 or a large allele-specific
    cefotetan effect.
  snapshot_sha256: e0df957cc8c7ce565666648d3c1c8238fa6ff3e6f91bf8145e4ad0a620d275f5
- evidence_id: cfxa
  kind: primary_source
  reference: PMID:8517690; DOI:10.1128/AAC.37.5.1028
  locator: 235-cfxa1028.png through 235-cfxa1034.png, 235-cfxa1035-full.png and 235-cfxa1036.png;
    all original pages read, especially Table 1 on printed p.1030 and Table 2 on printed
    p.1031
  accessed_at: '2026-10-21T11:29:24Z'
  support: partial
  summary: The original CfxA cloning, insertional inactivation and biochemical study
    establishes cefoxitin resistance in the tested Bacteroides system. Table 1 compares
    cefoxitin and ampicillin MICs; Table 2 and the hydrolysis experiments do not test
    cefotetan. These experiments do not directly support a cefotetan-specific CfxA
    claim. They also do not prove absence of cefotetan activity. The native edge remains
    explicitly database evidence.
  snapshot_sha256: 2d18f3088dd0c19303d7b9b57b860cb11c7c45c270d1bc0248c27b70cc7c866a
- evidence_id: cfxa-owner
  kind: database
  reference: ARO:3003001; https://card.mcmaster.ca/ontology/39435
  locator: 235-card.html and 235-aro_resistance_edges.json
  accessed_at: '2026-10-21T11:29:24Z'
  support: partial
  summary: The current CARD CfxA entry still asserts cefotetan resistance and cites
    PMID8517690. The maintained adopted edge reproduces this assertion. Its provenance
    is accurate, while exact primary cefotetan support remains unresolved; neither
    genus-wide hydrolysis nor cefoxitin experiments should be promoted to exact CfxA-cefotetan
    primary evidence.
  snapshot_sha256: 65cf5fa49a3198c2337e40ede0a78b6fd392b53f887c44de9e73599496f4850a
- evidence_id: additional-mechanism
  kind: primary_source
  reference: PMID:6573313; DOI:10.1093/jac/11.suppl_a.169; PMID:3497146
  locator: 235-additional-core.json; complete original abstracts
  accessed_at: '2026-10-21T11:29:24Z'
  support: partial
  summary: PMID6573313 directly studies radiolabeled cefotetan binding to bacterial
    membrane PBPs and benzylpenicillin competition, reporting greatest affinity for
    PBP3 and none for PBP2 in most tested Gram-negative organisms. Its permeability
    explanation is an assumption, not direct measurement. The full PDF request returned
    403, so exact strains, formulation and protocol were not independently verified.
    PMID3497146 reports cefotetan degradation by crude extracts from eight Bacteroides
    fragilis-group strains; enzymes are not identified as CfxA in the abstract. That
    result cannot repair the exact CfxA attribution.
  snapshot_sha256: 8c87796e823fe89e1dcab2f424f3adf34c24ecacad49470ca93b32c3ff842b09
- evidence_id: documents
  kind: primary_source
  reference: patent:DE2824559; patent:US4263432
  locator: 235-patent-de.html; 235-patent-us.html, titles, family and relevant claims
  accessed_at: '2026-10-21T11:29:24Z'
  support: context_only
  summary: Both patent records resolve to the same family of 7-alpha-methoxy, 7-beta-dithietane-carboxamido
