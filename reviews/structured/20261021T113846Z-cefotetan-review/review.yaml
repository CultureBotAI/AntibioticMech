summary: The neutral cefotetan core graph, formula, masses and configured cephem centers
  are coherent. Its stored InChI/key differ from the SMILES-derived key; the same
  KEGG graph reproduces either key depending only on retention of drawing coordinates,
  so this is not established as a different compound. ACC-1 has direct cefotetan-specific
  inactivation evidence, while the original CfxA paper establishes cefoxitin activity
  and does not validate its cefotetan-specific database edge. The native record labels
  both resistance entries as database assertions. All nine adopted MED leads resolve,
  with seven complete abstracts read; relevant original ACC and CfxA papers were inspected.
  No confirmed required correction was established, and no native record was changed.
  Scientific assessment retains the stated evidence limits; full verification is blocked
  by the shared native-library failure.
