  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Mulberrin is a distinct constitutional isomer, not an exact synonym
  description: Native synonyms[3] asserts mulberrin as EXACT_SYNONYM. Primary side-by-side
    structures and official PubChem molecular records distinguish mulberrin 3,8-prenyl
    substitution from the native cudraflavone C 3,6-prenyl structure. The source ChEBI
    record repeats the incorrect alias. This can misroute compound-specific evidence
    while the primary identifier and chemical graph themselves remain correct.
  target_ids:
  - CHEBI:68023
