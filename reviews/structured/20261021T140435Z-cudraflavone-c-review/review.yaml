summary: Cudraflavone C is the 3,6-diprenyl tetrahydroxyflavone, supported by seven
  concordant molecular encodings and primary antibacterial/cytotoxic evidence. The
  exact synonym mulberrin is a different 3,8-diprenyl constitutional isomer, confirmed
  by primary side-by-side structures and official PubChem graphs. One major identity-equivalence
  finding requires a source-specific synonym exclusion; the native main structure
  should be retained. Assay endpoints and the partly verified Morus nigra source assertion
  remain bounded.
