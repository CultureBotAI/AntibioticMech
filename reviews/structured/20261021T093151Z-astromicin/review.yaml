limitations:
- Reaxys3570275 was not independently accessed. Current public ChEBI, PubChem, ChEMBL
  and KEGG agree on exact identity. DrugCentral and Wikipedia are context links, not
  independent primary support.
- Five adopted biosynthesis papers, older resistance leads and clinical studies were
  inspected at indexed abstract level. Key fusion, rmtF, AAC(3)-Ic/Id and related
  nomenclature papers were read in relevant full-text sections. Full scanned1984 translation
  experiments were not extracted; no exact binding-site conclusion is claimed.
- AAC(3)-Id explicitly did not test astromicin, AAC(3)-Ic Table1 omits it, and reviewed
  AAC(3)-Ia abstracts do not establish an exact-drug endpoint. These database claims
  require further primary adjudication; absence of testing is not a second refutation.
- The clinical definition is supported as historical use with sulfate preparation;
  present regulatory approval and current indication status were not established.
  No dosing or therapeutic recommendation is made.
- Searches were bounded to free official resources, cited references and targeted
  follow-up. Exact salt purity and fortimicin preparation details in every older experiment
  were not reanalysed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All25 captured input hashes rechecked unchanged. Native record, scientific status
  and history were not edited.
- Initial chemistry-helper mint comparison was corrected only in scratch to account
  for both ARO and ChEBI sources; no native mint defect exists.
- No optional missing field is counted as a finding. RmtF resistance is supported
  by the cloned pAT861 primary narrative despite fortimicin data being unshown; it
  must not be discarded through broad substrate-family assumptions.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
