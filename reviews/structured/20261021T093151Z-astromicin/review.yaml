findings:
- finding_id: F1
  issue_key: astromicin-aro-3002600-fusion-resistance-conflicts-primary
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Fused acetyltransferase resistance edge conflicts with its cited experiment
  description: Native resistance_mechanisms[4] asserts astromicin resistance from
    ARO3002600. The sole current ARO citation PMID11850242 reports that the AAC(3)-Ib/AAC(6′)-Ib
    fusion did not confer fortimicin resistance in E.coli JM109, whereas separated
    AAC(3)-Ib did. Table4 and the accompanying100µg disk experiment distinguish these
    constructs. Accurate attribution as a database assertion preserves provenance
    but does not resolve this substantive phenotype conflict.
  target_ids:
  - CHEBI:37923
  field_paths:
  - resistance_mechanisms[4]
  evidence_ids:
  - native
  - owners
  - aro
  - fusion
  - aacIb
  rule_id: native-review-checklist:Resistance mechanisms
  native_severity: major unsupported resistance assertion
  normalization_reason: An explicit resistance assertion conflicts with the experiment
    cited by its ontology source. The finding is limited to this exact fused determinant
    and drug; it does not invalidate other fusion activities or separated AAC(3)-Ib
    resistance.
