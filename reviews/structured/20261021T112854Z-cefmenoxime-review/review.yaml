    synonym_exclusions; seeder lines 1531-1540
  accessed_at: '2026-10-21T11:22:04Z'
  support: refutes
  summary: The adopted ChEBI row contains the complete E name as SYNONYM, which the
    seeder maps to EXACT_SYNONYM. Current ChEBI still includes it, so re-extraction
