limitations:
- Twelve of 14 adopted/parent complete abstracts were read; two parent reviews are
  metadata-only. The additional synthesis paper was inspected in full relevant main
  text, tables and exact experimental entries; the additional alternative-synthesis
  PMID6271717 has metadata only. The current extra ChEBI lead PMID8193431 was read
  at complete-abstract depth and concerns historical pharmacoeconomics.
- The PBP and beta-lactamase PMC requests returned browser-challenge HTML, not original
  full articles. OA utility requests returned 404; the ASM PBP PDF request returned
  403. The complete original abstracts were inspected. These access limits do not
  undermine the independently confirmed synonym finding but bound any future assay-level
  enrichment.
- The synthetic comparison uses sodium salts and separately prepares a hemihydrochloride.
  No quantitative MIC was transferred to a native free-acid observation. The stereochemical
  comparison is valid at the shared compound-moiety level, while formulation, hydration
  and assay concentration remain separate.
- CAS and DrugBank were corroborated through inspected authorities; Reaxys was not
  independently resolved. Patent family text was checked for document scope, not exhaustively
  assigned example by example. Wikipedia is a document/discovery source and itself
  carries the conflicting E name.
- A future curator may add primary PBP evidence after full assay/form verification
  via the validated native writer and a curation event. That optional enrichment is
  separate from the required exact-synonym correction and does not authorize native
  REVIEWED status.
- The 023 native environment lacks RDKit; chemistry used the existing 019 interpreter.
  A first scratch chemistry script failed to parse and was corrected before the successful
  run. Focused checks do not replace required shared corpus gates.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All 16 captured repository input hashes and the separately recorded external ARO
  cache hash remain unchanged. No native record, saved bundle or Git state was modified.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
