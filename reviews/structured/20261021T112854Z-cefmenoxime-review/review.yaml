  support: supports
  summary: Native SMILES and InChI yield HJJDBAOLQAWBMH-YCRCPZNHSA-N, C16H17N9O5S3,
    charge 0, matching masses, 6R/7R centers and a Z oxime. Current ChEBI InChI/key,
    PubChem and ChEMBL agree. Reversing only the oxime geometry gives E and a different
    complete key, HJJDBAOLQAWBMH-DKQCJYJNSA-N, with unchanged formula. The E name
    is therefore a false exact synonym, not merely an alternative spelling.
