    gates before sign-off.
limitations:
- The 2014 paper inconsistently reports afzelin MIC as 31 in prose and≥31 in Table
  3, and does not specify a strain accession in the inspected methods. Its SAR explanation
  misplaces the quercitrin hydroxyl. These are source limits, not additional native
  defects.
- All ten adopted and six additional current ChEBI PMID abstracts were read. The 2014
  full XML and relevant 2026 primary Methods/Results were inspected; no exhaustive
  mechanism absence is claimed.
- Current Reaxys1359648 was not independently resolved through its proprietary record.
  CAS482-39-3 is corroborated by ChEBI,KEGG,KNApSAcK and PDB-related identifiers,
  not independently verified against the CAS registry. Wikipedia resolves as a document
  and is not primary scientific evidence.
- The MDPI 2014 PDF fetch failed HTTP403; the EuropePMC full XML succeeded and supplied
  the inspected primary article.
- Required shared gates are coordinated separately; native status remains SEEDED and
  no scientific sign-off is claimed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Only scratch artifacts were written; all 13 captured input hashes were rechecked
  unchanged.
- The first supplemental source-check assertion failed because current OLS renders
  Greek alpha as the word alpha. After that typography-only normalization the check
  exited 0; no semantic synonym correction was invented.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
