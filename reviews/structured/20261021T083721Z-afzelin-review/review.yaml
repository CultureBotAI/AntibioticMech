  - Cite PMID24642906 and preserve P.aeruginosa, broth/temperature/exposure, missing
    strain information and narrative 31 versus table ≥31µg/mL. Do not silently encode
    an unqualified exact MIC.
  - Do not import the erroneous C3/C-ring SAR explanation as a mechanism; distinguish
    the true quercitrin B-ring 3′-OH difference and retain mechanistic uncertainty.
  - Do not transfer silver-nanoparticle, mixed-extract, host-response or docking observations
    to free-afzelin target claims. Treat the 2026 tentative C4 identity and IC50 endpoints
    separately from MIC evidence.
  - Plant isolation may support evidence/discussion; require explicit biosynthesis
    support before adding producer_organisms. Preserve engineered-host scope if independently
    curating the biotransformation lead.
