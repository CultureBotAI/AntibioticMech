limitations:
- All ten adopted leads were resolved. Nine historical items had no indexed abstract
  and remain metadata/title-level after the bounded free-source attempts; no historical
  dose, mechanism or efficacy estimate was reconstructed.
- The 2008 main and actual bacterial Figure 1 were inspected; Figure 2 was read through
  caption/prose only. The formulation contains hydrocortisone, aloe and multiple vehicle
  ingredients and lacks a matched vehicle-only control.
- The 2018 full scientific main, structure Figure 1 and Table 1 were inspected. The
  2020 original was read selectively for Methods, MIC/MBC Tables 1/2, microbiota Table
  5 and Discussion, plus actual Figure 1. Other figures and SI were not independently
  audited; source discrepancies remain explicit.
- All four 1994 scanned pages and both tables were inspected. Its dixenic protozoal
  culture does not prove clinical effectiveness or a precise molecular target, even
  though parallel supporting-bacteria tests help bound interpretation.
- CAS 401, DrugBank 403, legacy LINCS 500 and unavailable independent Reaxys content
  remain unresolved. The small HMS archive is not an exhaustive registry. Historical
  brand names were checked as typed source assertions, not as current product claims.
- The CDC source was successfully read through web.run; raw curl access was403. The
  preserved JSON is explicitly a reviewer paraphrase and locator capture, not a claimed
  original HTML snapshot.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
