  issue_key: iodoquinol-definition-unqualified-amebiasis-treatment-preference
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Qualify the definition’s broad treatment-preference statement
  description: The imported definition calls iodoquinol the drug of choice for asymptomatic
    or moderate amoebiasis without the luminal-treatment boundary. Current CDC guidance
    for symptomatic E. histolytica illness places iodoquinol among intraluminal agents
    following a nitroimidazole. Replace or qualify the broad ranking with a precise
    luminal-use statement, retaining the chemical definition and antiprotozoal role.
    This is a bounded wording correction, not a denial of activity or a new clinical-product
    claim.
