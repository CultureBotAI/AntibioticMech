  accessed_at: '2026-10-21T19:26:27.319538Z'
  support: supports
  summary: Novartis material was tested against 50 C. difficile and630 other intestinal
    isolates. Anaerobes used supplemented brucella agar at about 10^5 CFU/spot, 44
    h/36 °C; aerobes used CAMHB broth at about 5×10^5 CFU/mL, 20 h/35 °C, with blood
    supplementation for specified genera. C. difficile range 0.125–0.5 and MIC90 0.25
