  locator: Complete main, Methods, Tables 1–2 and figure captions
  accessed_at: '2026-10-21T19:26:27.027487Z'
  support: supports
  summary: Male Golden Syrian hamsters were pretreated with clindamycin10 mg/kg and
    infected with about 10^6 vegetative C. difficile ATCC43255 cells. Oral LFF571
    began24 h later, once daily for five days. Across seven serial experiments,5 mg/kg
    LFF571 gave44/54 survivors at the day21 endpoint, compared with 28/56 at 20 mg/kg
