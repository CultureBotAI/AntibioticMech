- evidence_id: adopted-resistance
  kind: primary_source
  reference: PMID:22644023
  locator: Selection method, complete Table 3 and sequence discussion
  accessed_at: '2026-10-21T19:26:27.017758Z'
  support: supports
  summary: High-density cultures were selected on brucella agar containing 0.5–1 µg/mL
    LFF571 for 48–72 h anaerobically at 37 °C. Selected NB95002/NB95013/NB95026 derivatives
    carried tufB G782A/G260E, with both tufA and tufB altered in NB95013-JAL0759.
    Agar-dilution LFF571 MICs increased from 0.25–0.5 to >128 µg/mL. No corresponding
