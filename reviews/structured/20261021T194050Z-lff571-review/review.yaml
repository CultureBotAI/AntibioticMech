- The sole adopted original was fully read through its short-report text and Tables
  1–3, and actual structure Figure 1 was viewed. Raw assay data and sequence chromatograms
  were not reprocessed.
- The additional hamster original was fully read through Methods, Results, Tables
  1–2 and captions; statistical models were not independently refitted. The spectrum
  study was read for full Methods, overview Table 1 and LFF571-specific discussion,
  not every comparator entry in its extensive Table 2.
- The discovery main returned403. Its complete abstract and official SI general methods
  plus exact compound 4 preparation S21–S22 were inspected; actual S21 was viewed.
  Other analog preparations, full spectra and co-crystal compound mapping were not
  exhaustively assessed.
- The 2011 direct-binding conference abstract cited by the adopted original was not
  independently recovered. Native already records PRIMARY_EVIDENCE_NEEDED for the
  database target, so this is retained as an access/evidence-depth limit rather than
  a new unsupported-claim finding.
- Clinical-trial, pharmacokinetic and toxin-production papers were screened at abstract
  level only; no new clinical efficacy, safety or toxin-mechanism claim is based on
  them. The structured adapter lacks C. difficile coverage, and its E. coli gene hits
  provide no resistance proof.
