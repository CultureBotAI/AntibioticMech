limitations:
- 'The complete 2005 JMB paper was not obtained: the publisher route returned 403
  and the author repository supplied the complete abstract only. Official PDB records
  independently establish nucleotide/metal content and polymer identity. Exact primary
  experimental strain provenance is not inferred from a reference sequence alone.'
- HMDB returned 403, MetaCyc compound and XML routes returned login HTML, and the
  actual VSDB resolver was unavailable in the bounded public attempt. Beilstein/Reaxys
  were not inspected through paid records. DrugBank direct fetching returned 403 but
  its public page was successfully read through the web tool.
- The KNApSAcK entry internally disagrees among its matching InChI, double-bond-unspecified
  SMILES and displayed key. This is retained as source quality uncertainty rather
  than automatic native identity correction.
- All twelve adopted leads were dispositioned. Three have no indexed abstract, including
  the original 1962 discovery report; its apparent PDF download was HTML challenge
  content, not a read PDF. The 1977 producer and other specified sources remain abstract-depth.
- The 2009 main text and Figures1/5 were inspected; supplementary methods and raw
  diffraction were not reprocessed. The authors allow alternative fusidic acid orientations
  at 3.6 angstrom resolution. The 2012 FusB/C main text was inspected in the specified
  Methods/Results/Discussion scope; its supplementary material was not read.
- The 2007 FusC/D paper was inspected in functional Methods, Table1, relevant Results
  and clinical-screening context, not every original source underlying its delegated
