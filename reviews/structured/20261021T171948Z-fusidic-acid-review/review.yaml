summary: 'The exact fusidic acid structure, antibacterial role, broad EF-G mechanism
  and qualified database resistance assertions are supported. Three bounded corrections
  remain: the sterol-ester parent requires C3 esterification absent from this C16
  acetate, Fucidin is a product name typed as an exact chemical synonym, and the 2005
  mutant structures contain GDP and magnesium despite being described as ligand-free.
  Primary mechanism, resistance and producer evidence was assessed with explicit material
  and access limits. Focused schema, strict and chemistry checks pass.'
