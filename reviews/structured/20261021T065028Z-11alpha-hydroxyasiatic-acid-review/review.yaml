limitations:
- The primary paper was inspected through an author-deposited full text on ResearchGate
  after the publisher returned403; its text layer renders some Greek alpha glyphs
  as R. Compound mapping was cross-checked against the abstract and official systematic
  name.
- Reaxys itself was not accessed; its cross-reference is corroborated by ChEBI. Direct
  CHEBI:25872 access failed, with official compound relations and GO external-term
  view used instead.
- Bounded literature search does not prove biological inactivity or that no independent
  evidence exists. Exclusion is a conditional proposed curation step, not an action
  taken.
- Authoritative just qc failed during collection because the pinned SciPy 1.15.3 native
  library has an invalid Mach-O section on this platform; identical pinned version
  also failed under Python 3.10. No dependency versions were changed. Full closed-schema,
  reproduction and corpus-integrity gates passed independently; these do not replace
  full QC.
notes:
- No record, maintained input, generated product or history event was modified.
- Bundle completion is partial because full repository QC is not available on this
