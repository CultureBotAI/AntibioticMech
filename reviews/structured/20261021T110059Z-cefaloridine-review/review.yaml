  Original CblA experiments support compound-specific inactivation, and a primary
  transpeptidase study supplies bounded target evidence for possible enrichment. The
  OmpC note should preserve combined OmpF/OmpC-loss context: the original single ompC
  mutant retained wild-type cefaloridine susceptibility. The CDA-1 edge has independent
  cefaloridine susceptibility support; purified kinetic measurements in that paper
  use cephalothin and must not be transferred. Scientific assessment retains the stated
  evidence limits; full verification is blocked by the shared native-library failure.'
