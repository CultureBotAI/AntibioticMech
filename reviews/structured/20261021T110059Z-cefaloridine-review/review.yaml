    207-kegg.mol
  accessed_at: '2026-10-21T10:56:55Z'
  support: supports
  summary: SMILES/InChI/fullkey CZTQZXZIADLWOZ-CRAIPNDOSA-N, formula C19H17N3O4S2,
    masses and two configured R centers agree. The graph has pyridinium+ and carboxylate-
    with net 0. Current ChEBI, PubChem, ChEMBL and KEGG compound graphs agree; no
    salt or additional proton is imposed.
  snapshot_sha256: 9ca96580b093f12357b9b00bb30526648ef8f4f3d255a4aa21fc922b4e8c75c2
- evidence_id: grounding
  kind: authority
  reference: CHEBI:3537; ARO:3004129; ARO:0000032
  locator: 207-chebi.html; 207-aro-stanzas.txt; 207-kegg.txt; 207-drugcentral.html
  accessed_at: '2026-10-21T10:56:55Z'
  support: partial
  summary: Current ChEBI reproduces cephalosporin, semisynthetic derivative and beta-lactam
    antibiotic allergen parents, plus antimicrobial agent and antibacterial drug roles.
    KEGG C11754/D01075 and DrugCentral 573 resolve cefaloridine; drug and document
    mappings are separately placed. CAS 50-59-9 is corroborated by authorities; Reaxys
    4166301 was not directly accessed.
  snapshot_sha256: 3c2ce22f83d79c1d6043e53754f0bb38b052d15b725c3c153b220adfd3a75b1b
- evidence_id: cbla
  kind: primary_source
  reference: PMID:7985999
  locator: DOI:10.1128/aac.38.8.1711; 207-cbla-1711 through 1714 original scans/OCR,
    Table 1 visual on p1712
  accessed_at: '2026-10-21T10:56:55Z'
  support: supports
  summary: The gene cloned from B. uniformis WAL-7088 was used to complement a cblA-inactivated
    BU1001 derivative. Table 1 agar-dilution cephaloridine MICs are 64 micrograms/mL
    for BU1001, 2 for the insertion mutant, 8 for empty-vector mutant and 64 for complemented
    mutant. Cell-extract spectrophotometry directly measures cephaloridine degradation.
    Thus exact inactivation/phenotype support exists; WAL-7088 also contains CfxA
    and is not the same strain as the knockout comparison.
  snapshot_sha256: d90b73c023ce3b42e736d0fe482b013aaff3b08efd5813e45bc32fb64cf6cc04
- evidence_id: ompc
  kind: primary_source
  reference: PMID:6760806
  locator: DOI:10.1128/aac.22.6.942; 207-ompc original scans pp 942–947, Table 3 p945
    and p946 visually checked
  accessed_at: '2026-10-21T10:56:55Z'
  support: partial
  summary: In E. coli K-12, the single ompC::Tn5 mutant B1478 and parent pop1010 each
    show 2 micrograms/mL cefaloridine, whereas combined ompF1466 ompC::Tn5 mutant
    B1467 shows 64. The endpoint is 99% CFU inhibition on Mueller-Hinton agar at 37
    C, not a modern standardized MIC. Original text explicitly distinguishes single-porin
    from combined-loss phenotypes. The imported reduced-permeability route is sound,
    but its note should preserve this genetic context rather than imply normal OmpC
    or isolated OmpC loss universally causes resistance.
  snapshot_sha256: c873e025b14dd953e87f28429fa16ee5a0909fccce00b2a6d4fdf3057a31f0c9
- evidence_id: cda
  kind: primary_source
  reference: PMID:25136020
  locator: DOI:10.1128/aac.03237-14; 207-cda.html original main text and Tables1–2
  accessed_at: '2026-10-21T10:56:55Z'
  support: supports
  summary: 'Table 1 includes Cefaloridine: E. coli TOP10(pCDA-1) has MIC >256 micrograms/mL
    versus 1 in TOP10; porin-deficient HB4 is 256 even without the plasmid. Thus the
    recombinant comparison directly supports cefaloridine resistance while distinguishing
    enzyme and permeability contexts. Table 2 purified kinetics use cephalothin, not
    cefaloridine, so its numerical hydrolysis parameters must not be transferred.'
  snapshot_sha256: b7bd4dfa5f8bd2dec1b70dee503f9e9a05d454eddcd310cb3b1bf7b86faf8d21
- evidence_id: binding
  kind: primary_source
  reference: PMID:4464853
  locator: DOI:10.1042/bj1430241; 207-pbp-core.json complete abstract; original scans
    pp241, 242, 247, 248; binding experiment p247 visually checked
  accessed_at: '2026-10-21T10:56:55Z'
  support: supports
  summary: Glaxo cephaloridine reacts approximately 1:1 with the isolated exocellular
    Streptomyces R39 DD-carboxypeptidase-transpeptidase, inactivating the enzyme and
    opening the drug beta-lactam ring. Complex dissociation/reactivation depends on
    defined buffer and temperature. This supports a bounded enzyme-target example
    for optional enrichment, not a claim about every bacterial PBP or clinical killing.
  snapshot_sha256: fcf585c23f0b162b22797618e9b6159796b495992e82841fd2096e8fdea60dcf
- evidence_id: adopted-leads
  kind: database
  reference: All 18 adopted/parent PMID records
  locator: 207-core.json; 207-lead-dispositions.json
  accessed_at: '2026-10-21T10:56:55Z'
  support: context_only
  summary: All 18 MED records resolve. Eleven have complete abstracts that were read;
    seven are metadata-only. ChEBI allergy leads 12569987/2083978/29017833 concern
    host IgE or reviews, not antimicrobial target proof. 1965 PMID 5175748 directly
    compares staphylococcal cephaloridine/cephalothin destruction; 2907014 is a historical
    urinary-isolate resistance survey. 17426813 studies tetracycline adaptation and
    23034325 is a porin/efflux review. Parent cephalosporin references are reviews.
    An unrelated non-MED result sharing external ID 724127 was excluded.
  snapshot_sha256: 70f66d03da6cb71f07282113280b802920accf53a1782bf361731d89ad893821
