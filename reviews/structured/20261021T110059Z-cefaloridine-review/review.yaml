limitations:
- 'Seven of 18 adopted/parent MED references have no indexed abstract: 14226120, 4868829,
  5325246, 5740219, 724127, 15673804, 6810737. Eleven complete abstracts were read;
  original CblA/OmpC scans and CDA-1 full HTML supply deeper support for selected
  claims.'
- CDA-1 PMID 25136020 full HTML was obtained after Europe PMC XML failed 500. Table
  1 supports exact cefaloridine susceptibility effects, but the purified kinetic Table
  2 uses cephalothin. These distinct assay scopes are retained.
- PMC PDF links for CblA/OmpC returned download-preparation HTML. Original publicly
  served page scans were retrieved and read, including visual verification of relevant
  tables; this is not a failed full-text conclusion. OCR was used for navigation and
  was checked against the source images for quantitative claims.
- The additional 1974 target paper was inspected as complete abstract plus original
  pp 241, 242, 247, 248, not every page. Publisher PDF request failed 403. The bounded
  isolated-enzyme experiment is distinct from species-wide antibacterial susceptibility
  or a resistance beta-lactamase mechanism.
- Reaxys was not directly accessed. CAS mapping is corroborated by public authorities
  rather than a direct registry record. Historical source nomenclature and clinical
  susceptibility thresholds were not updated or reinterpreted.
- No exhaustive clinical, resistance, taxonomic or immunological survey was undertaken.
  021 native checks passed; supplemental chemistry used 019 RDKit environment. No
  native scientific status promotion is implied.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
