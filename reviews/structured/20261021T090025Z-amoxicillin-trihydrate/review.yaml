limitations:
- Beilstein7507120 registry content was not independently inspected; its identifier
  remains a current ChEBI assertion. DrugBank public identity text was inspected despite
  direct download403.
- The2025 primary paper names the trihydrate but does not identify supplier/catalog/purity
  and has dose-per-plate versus concentration and replicate-count inconsistencies.
  Its PBP interaction is computational; no direct target conclusion or unqualified
  quantitative observation is imported.
- Free primary discovery was bounded; absence of additional exact-preparation mechanism
  evidence from this search is not a claim that no such literature exists.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All22 input hashes rechecked unchanged; native content and curation status were
  not edited. Initial helper formula-only mismatch retained alongside corrected aggregate/component
  equivalence.
- Curator follow-up may adjudicate the2025 free-drug comparator as a diffusion endpoint,resolve
  dosing/replicate context and avoid converting zones into MIC or assigning nanoparticle
  enhancement to the isolated hydrate.
- Clinical doses expressed as amoxicillin supplied as trihydrate are not the mass
  of all hydrate components. FDA application-level product approval evidence is distinct
  from GSRS ingredient identity and from formulation-specific efficacy.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
