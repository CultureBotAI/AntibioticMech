limitations:
- Direct DrugBank access returned403 and the proprietary Reaxys structure was not
  independently inspected; current ChEBI corroborates their associations. DrugBank
  remains a drug-context reference.
- The six frozen ChEBI literature leads and ARO/native PMIDs were all resolved and
  read at abstract depth; only the exact 2007 crystal study received additional original
  Methods/Results inspection. Current ChEBI additional unadopted bibliography was
  not exhaustively reviewed.
- The 2007 full-text cache routes failed or returned a challenge; the author-uploaded
  original was inspected in the browser, while the local snapshots retain its abstract
  and official deposit.
- Original isolation assays concern characterized sodium-salt material and named test
  strains. No neutral free-acid quantitative observation, clinical approval or universal
  spectrum is inferred.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Standalone chemistry used the batch019 interpreter against batch048; native checks,
  ledger and contract used batch048.
- No native/source bytes or scientific status were changed. The missing optional fields
  are not treated as defects.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
