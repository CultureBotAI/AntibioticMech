findings:
- finding_id: F1
  issue_key: fosmidomycin-protein-example-quaternary-complex-wording
  category: evidence
  severity: minor
  status: open
  certainty: confirmed
  title: Protein example misnames the cited quaternary crystal complex
  description: molecular_targets[1].protein_examples[0].role describes the PMID17554164
    experiment as a ternary complex with NADPH and fosmidomycin. The original explicitly
    reports DXR with Mg2+, NADPH and fosmidomycin as a quaternary complex and distinguishes
    it from an earlier ternary structure. The native mode and target experimental
    context already use the correct terminology. This is a bounded wording/provenance
    inconsistency, not an incorrect protein identity or unsupported direct-binding
    relation.
  target_ids:
  - CHEBI:443725
  field_paths:
  - molecular_targets[1].protein_examples[0].role
  evidence_ids:
