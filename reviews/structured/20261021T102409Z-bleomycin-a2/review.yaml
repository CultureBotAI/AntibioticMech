limitations:
- The2005 adopted review and1995 RNA study were verified at metadata/abstract scope;
  the2017 producer article was available as an abstract but full article/SI retrieval
  did not provide usable content.
- MIBiG live guessed repository endpoints returned404; the official adopted archive
  and current NCBI taxonomy were inspected instead. Archive member is v2; no conclusion
  that the entry is absent.
- Beilstein4379083 and Gmelin1667354 were checked through inherited/current ChEBI
  mapping, not independently behind proprietary services.
- BRP(MBL) primary MICs used commercial bleomycin; exact A2 susceptibility and direct
  protein binding were not established by those experiments. Structured substring
  hits are not the clinical gene.
- KNApSAcK and CCD representation conflicts require source adjudication; native InChI
  stereochemistry and charge are independently supported.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All27 captured source hashes rechecked unchanged; no native/status/history edits.
- Initial chemistry helper compared ChEBI mint with the first ARO source. Actual per-source
  mints both pass; that helper assumption is not a record defect.
- No optional empty-field or alias-only findings. MIBiG archive SHA256 d02a387c7d62f8e54d7bcdc03984301e513ce56c1782ecbc9ce957a76039444f.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
