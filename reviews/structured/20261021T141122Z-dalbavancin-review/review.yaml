limitations:
- The2014 main paper and complete SI text/captions were read; Figure1 and SI TableS1/methods
  were visually inspected. Raw calorimetry, chromatography, MS and all spectral image
  panels were not independently reprocessed.
- The2012 paper was inspected for material Methods and dalbavancin structural Results/captions;
  full SI and raw diffraction were not independently analyzed, and congener composition
  was not established from the inspected material passage.
- Other adopted original studies were read at complete indexed-abstract depth; the
  approval-news item has no abstract. Product trial results were not reclassified
  as pure-B0 measurements.
- CAS171500-79-1 usage differs between the mixture registry and structural databases;
  the review does not claim independent access to the proprietary CAS registry. Reaxys
  was not independently resolved.
- A shared exploratory chemistry script exited1 because of the PubChem mismatch; a
  separate record-specific comparison reproduced that failure. Native schema/strict
  and internal graph checks passed. No failure is silently discarded.
- All review findings concern retained source assertions; optional clinical-status
  absence alone is not a defect, and no current prescribing recommendation is made.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native record, inventory, source configuration, schema, dependency or generator
  was edited. All original input hashes were preserved; actual target-mapping ownership
  was appended before inspection.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
