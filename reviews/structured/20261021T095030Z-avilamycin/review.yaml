  - Document the source entity,congener composition and exact structural identifiers;
    preserve generic mixture and individual-congener provenance separately.
  - Resolve native InChI56? versus A56+ explicitly, without assuming an unspecified
    centre means a racemate or inventing a complete assignment for59?.
  - Before importing PMID27330110 target evidence, adjudicate native C61H88Cl2O32
    versus deposited6UQ C61H90Cl2O32 and any reagent/model discrepancy; preserve actual
    ribosome evidence without claiming it is false.
