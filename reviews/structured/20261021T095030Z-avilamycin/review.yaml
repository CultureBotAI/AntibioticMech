findings:
- finding_id: F1
  issue_key: avilamycin-generic-mixture-congener-scope-unresolved
  category: identity
  severity: major
  status: open
  certainty: confirmed
  title: Resolve generic avilamycin scope before treating its source as one exact
    compound
  description: The record combines a generic avilamycin source/definition with CID71674,
    a partially specified A-connectivity structure. Authoritative product documentation
    defines avilamycin as a congener mixture and explicitly assigns the stored formula/mass
    to component A. The corpus already contains the more stereospecific A record.
    Moreover, the cited mechanism model uses chemically different6UQ and does not
    quantify the reagent congener composition. Retain these differences and adjudicate
    which exact entity the source should represent; name,formula or connectivity agreement
    cannot justify a merge or evidence transfer.
  target_ids:
  - antibioticmech:aro-e3f7a82f17
