    focused validators,exact identity/duplicate checks,reference/history and corpus
    gates; retain native SEEDED until all scientific sign-off criteria pass.
limitations:
- The exact composition/purity of the avilamycin reagent supplied for the2016 cryo-EM/smFRET
  study was not established in inspected main/SI text. The deposited6UQ/native mismatch
  may involve reagent or model annotation and was not resolved by raw-map re-refinement.
- Neither native CID71674 nor current ChEBI/PubChem A entries specify every potential
  stereocentre. This review establishes their explicit one-centre granularity difference
  but does not independently assign the remaining centre or identify a new stereoisomer.
- FDA-hosted sponsor composition data describe Kavault preparation,not every material
  called avilamycin. Current VFD listing confirms product-use context without establishing
  exact molecular-congener approval or current marketing availability.
- The Borrelia source is specific to evernimicin. Lack of an avilamycin experiment
  there is not evidence of universal Gram-negative inactivity. No exhaustive avilamycin
  spectrum or resistance audit was attempted for an unresolved exact entity.
- Free primary retrieval initially encountered browser-check,XML500,403 and429 responses;
  the alternate public PMC HTML supplied complete main/SI text. No failed endpoint
  was interpreted as absent literature.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
