- All 20 expanded hashes unchanged; no native/source/status/history edits.
- Native checks used batch 026 environment. RDKit 2026.03.5 standalone checks used
  existing batch 019 interpreter against batch 026 cwd.
- Official label was previously retrieved during the adjacent hydrate review; its
  original access timestamp and snapshot hash are retained. Free public sources only.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
