limitations:
- The exact anhydrous acetate was verified structurally; an independently administered
  anhydrous-acetate clinical formulation was not established. Official label identifies
  monohydrate product material and anhydrous-fosamil dose basis.
- Adopted 2008 original Methods/Results were inspected, but its active-ceftaroline
  experiments do not test this prodrug acetate. Additional synthesis and activation
  sources were inspected at abstract level only.
- Independent proprietary Reaxys content was not inspected; current ChEBI retention
  is contextual support for that mapping.
- Generic chemistry helper exit 1 reflects component-formula text comparison only;
  the original result is retained alongside a passing elemental-equivalence check.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
