summary: No confirmed native defect. Native structure and current CAS identity agree
  on anhydrous 1:1 ceftaroline fosamil/acetic acid composition, 6R,7R and Z oxime.
  The sole adopted primary paper explicitly assays active ceftaroline, not fosamil
  acetate, and cannot support direct acetate MICs. Official clinical material is the
  monoacetate monohydrate; the native clinical-use prose is supported at the prodrug-moiety
  level, while an independently administered anhydrous preparation is not established.
  Scientific assessment retains the stated evidence limits; full verification is blocked
  by the shared native-library failure.
