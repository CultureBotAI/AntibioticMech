limitations:
- 'Primary antibacterial support for the parent remains unresolved: the label excludes
  clinical bacterial effect/use, current ChEBI asserts antibacterial, and the accessible2020
  repurposing abstract emphasizes derivatives. Full2020 original was blocked by publisher/repository
  access.'
- LINCS LSM-5259, MetaCyc CPD-17786 and Reaxys95226 exact mappings were not independently
  resolved; DrugBank full record access was blocked. The limited HMS archive does
  not establish global LINCS absence.
- KNApSAcK displays a discordant legacy-looking InChIKey although its actual standard
  InChI and SMILES match the native configured graph; this external metadata issue
  was not classified as a native wrong-xref defect.
- Historical brand-name products were not individually verified. Curling factor has
  both original metabolite-name and later secondary trade-name evidence; Amudane exact
  name type remains unresolved.
- The1939 original was read visually on pages240 and248 only; the1947 source was publisher
  abstract/preview. The2005 entire main/table/captions were read without independent
  figure-image inspection. The2020 fungal paper was read at the selected-main depth
  stated in evidence, not its complete supplement.
- All six frozen adopted leads were assessed, but three have only review/metadata
  access as specified. Additional current ChEBI discovery citations were not all pursued.
  Supplementary fungal mechanistic originals were abstract-only.
- The record has no populated bacterial protein/pathway assertion, so the structured
  bacterial adapter condition was not triggered. No fungal or mammalian finding was
  converted to a bacterial target.
- Required shared corpus gates and the known platform SciPy QC failure are handled
  by the coordinating finalizer; focused record checks do not substitute for that
  failed full gate.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
