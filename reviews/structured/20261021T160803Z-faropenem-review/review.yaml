  accessed_at: '2026-10-21T15:55:50.228887Z'
  support: partial
  summary: This original directly tests faropenem hydrolysis by KPC-2, VIM-2 and L1
    with additional solution studies on other beta-lactamases. Table 1 measures turnover
    at 306 nm using 10 nM enzyme; VIM-2 is a substrate-hydrolyzing enzyme in these
    experiments. It is not VIM-63, and enzyme kinetics are not MICs. Structural intermediates
    and solution products differ, so a bound hydrolysis product is not automatically
    an inhibitory endpoint. The paper explicitly distinguishes penems from carbapenems
    and cephalosporins.
