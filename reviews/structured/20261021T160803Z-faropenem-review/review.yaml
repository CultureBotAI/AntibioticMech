- finding_id: F1
  issue_key: faropenem-partial-stereo-exact-xrefs-to-defined-child
  category: grounding
  severity: major
  status: open
  certainty: confirmed
  title: Chemical xrefs collapse partial and fully specified faropenem structures
  description: The target/current CHEBI:51788 leaves the hydroxyethyl C1 and penem
    C6 stereocentres unspecified. PubChem CID 65894 and CHEMBL556262 specify R and
    S respectively and match the separately retained CHEBI:51257 child. These accessions
    cannot be unqualified same-structure xrefs for the partial graph. Adjudicate the
    intended exact target/source join while preserving the separate child; do not
    infer a racemate or blindly replace the native graph.
