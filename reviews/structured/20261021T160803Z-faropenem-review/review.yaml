limitations:
- The sole adopted PMID was inspected at complete original abstract depth. Both attempted
  OUP full-text routes returned HTTP 403; isolated preparation, salt and detailed
  methods remain unresolved.
- The VIM-63 paper was read for original Methods, Table 1 and relevant results. It
  tests nine named other drugs, not faropenem. The bounded exact-term search is not
  exhaustive proof of absence.
- The 2021 faropenem study was inspected for the original reaction scheme, Table 1
  and selected crystallographic/NMR results. Its supplementary methods could not be
  retrieved as a valid DOCX; no uninspected reagent specification or kinetic condition
  is invented.
- The 2009 pneumococcal paper was read for its original abstract, strain/method paragraphs,
  Table 1 and binding discussion. Every Table 3 numeric cell, allele sequence and
  underlying binding image was not independently reanalyzed. No quantitative observation
  is imported.
- Related CHEBI:51257 and CHEBI:51795 files were consulted only for identifier/structural-key
  comparison after capturing hashes. They have not received whole-record reviews in
  this task.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- Native files, maintained sources and immutable reviews were not edited. All original
  hashes were retained and expanded inputs rechecked. Exact chemical xrefs are distinguished
  from drug-level associations; this record has no drug_xrefs. Optional links/tags/notes
  were checked against faropenem.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
