findings:
- finding_id: F1
  issue_key: chebi-2637-eis-drug-inactivation-misclassified-target-alteration
  category: evidence
  severity: major
  status: open
  certainty: confirmed
  title: Eis drug acetylation is classified as target alteration
  description: resistance_mechanisms[101] assigns ANTIBIOTIC_TARGET_ALTERATION to
    ARO3009333. The source extractor faithfully inherits CARD generic variant ancestry,
    but purified Eis acetylates amikacin and clinical C-14T/LoF results depend on
    functional Eis. This is antibiotic modification/inactivation, not modification
    of the16S-rRNA target. Preserve the amikacin resistance association and its variant/assay
    qualification; do not infer every eis mutation causes resistance or erase the
    edge because earlier studies used different thresholds.
  target_ids:
  - CHEBI:2637
  field_paths:
  - resistance_mechanisms[101].mechanism_type
  evidence_ids:
