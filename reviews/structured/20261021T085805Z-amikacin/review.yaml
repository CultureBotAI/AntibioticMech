  acceptance_checks:
  - Represent Eis-mediated amikacin acetylation as ANTIBIOTIC_INACTIVATION, with explicit
    primary support and retained upstream target-alteration provenance; do not globally
    reinterpret all mutant nodes.
  - Keep ARO3009333 resistance association, C-14T/promoter scope, functional-enzyme/LoF
    qualification and method-dependent low-level AMK phenotype explicit.
  - Existing card_evidence_reviews supports note qualification only; make any enum
    correction reproducible in its actual maintained owner rather than applying a
    non-reproducible native patch.
  - Retain all294 activity observations,102 resistance entries and exact membership
    identity/counts; no change to clinical or primary evidence status solely from
    a database assertion.
  - Run focused schema/strict, documented membership audit, source provenance/reproduction
    and required corpus QC after authorized curation.
limitations:
- The dedicated membership audit checked complete normalized inventories and attached
  collections; upstream release Parquet and generated publication pages were not independently
  re-audited. Zenodo record was readable, but direct API/schema-file routes returned403.
- All102 resistance entries were verified against current ARO definitions/edges; primary
  follow-up focused on the disputed Eis classification and ribosomal mechanisms, not
  independent reconstruction of every allele experiment.
- HMDB returned403, LINCS500, MetaCyc exposed no usable identity content, and Reaxys/DE2234315
  exact document text was not independently inspected; these remain current ChEBI
  cross-reference assertions.
- The2023 mechanism paper uses sulfate reagent and has an apparent catalog-number
  ordering discrepancy; quantitative observations need preparation adjudication before
  free-base/salt transfer.
- CDC BioSample identifiers were verified on the authoritative isolate pages; the16
  sequencing records and every CRyPTIC sample accession were not individually re-fetched.
  No causal genotype link is inferred from these accession matches.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- All captured input hashes rechecked unchanged; native records were not edited. Both
  original helper output and corrected source-by-source mint comparison remain in
  scratch.
- Future primary target enrichment can cite the inspected2023 h44 study while preserving
  RNA-complex target, species-specific B5 binding and lack of demonstrated inhibitory
  function at the secondary P-site.
- CRyPTIC assay text sometimes renders source method_cc=WHO as critical concentration
  WHO mg/L; this is a nonnumeric source token, not a measured concentration, and should
  be clarified if that display text is revised. No numeric MIC was invented from it.
- Earlier eis studies reporting no AMK resistance and later C-14T low-level AMK findings
  are retained with their original methods rather than treated as a universal contradiction.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
