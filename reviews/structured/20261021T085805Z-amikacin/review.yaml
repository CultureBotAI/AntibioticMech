  locator: DOI10.1073/pnas.1105379108; Results:Unique Multiacetylation; Methods
  accessed_at: '2026-10-21T08:52:46Z'
  support: supports
  summary: Full main text reports purified H37Rv Eis Rv2416c acetylating amikacin
    and other aminoglycosides, measured by UV/visible coupled assay and mass spectrometry.
    This demonstrates drug modification; it does not demonstrate alteration of the
    ribosomal target. Crystal structure used CoA/acetylated hygromycin, not an amikacin-bound
    ribosome or an amikacin-specific cocrystal.
  snapshot_sha256: 83641f8fdf86c8995df8883f0d2242f19e882de44a0aca08e377d1f6a0b49334
