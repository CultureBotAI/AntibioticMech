- evidence_id: ribosome
  kind: primary_source
  reference: PMID:37537169
  locator: DOI10.1038/s41467-023-40416-5; full main text Results/Methods
  accessed_at: '2026-10-21T08:45:03Z'
  support: partial
  summary: The2023 X-ray/cryo-EM and kinetic study supports functional amikacin binding
    at16S-rRNA h44, impairing translocation, termination and recycling. Secondary50S
    P-site binding was observed without established inhibitory function; B5 binding
    was species-specific. Native NUCLEIC_ACID/direct-binding target is scientifically
    consistent but remains honestly database-sourced PRIMARY_EVIDENCE_NEEDED. Sulfate
    reagent and apparently reversed catalog ordering require explicit active-moiety/preparation
    scope for future quantitative curation.
  snapshot_sha256: 2c55435981b62655cd27bc57798382a2731efc815ba1edfa4094a782df311ea5
- evidence_id: eis-biochemistry
  kind: primary_source
