  support: supports
  summary: The authors isolated licoricone from G. uralensis root, assigned its isoflavone
    skeleton and substituents by spectroscopy and chemistry, and resolved the remaining
    constitution by X-ray analysis of the monobromoacetate VIII. The parent itself
    is structure I, not the brominated derivative. The final original wording uses
    2′,7-dihydroxy/4′,6′-dimethoxy/5′-prenyl numbering; reversing the pendant-ring
    direction maps 2′↔6′ and 3′↔5′ to native without changing connectivity. The actual
    structure I agrees with native.
  snapshot_sha256: 39764168b2a17f0303fb5cfe27daa81e4116980add07b1c2df9be3e3bb99e6a5
