  accessed_at: '2026-10-21T19:41:22.501291Z'
  support: context_only
  summary: Isolation from the sodium-carbonate-soluble methanolic extract gave a reported
    0.004% yield. Parent NMR and mass spectrum support C22H22O6, two methoxy groups,
    two hydroxyls and one dimethylallyl group. Crystal work used the monobromoacetate,
    with 2664 observed reflections and final reported R 0.11. This is chemical identity
    evidence, not an antibacterial assay, and raw diffraction data were not re-refined.
  snapshot_sha256: 39764168b2a17f0303fb5cfe27daa81e4116980add07b1c2df9be3e3bb99e6a5
