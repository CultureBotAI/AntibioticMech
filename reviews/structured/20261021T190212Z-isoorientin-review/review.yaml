limitations:
- The sole adopted paper’s complete scientific main, Tables1–4 and actual Figures1/3/5
  were inspected. Orientin-only Figures2/4 were not used as isoorientin evidence.
  Supplement Fig.S1o and TablesS1–S24 remain inaccessible through the attempted publisher
  route.
- Current supplier catalog identity and actual structure were inspected, but the exact
  experimental lot certificate and raw chemical characterization were unavailable.
  The paper used purchased material; a Terminalia producer claim is not established
  by this assay.
- Original MIC conditions refer partly to an earlier protocol. Final inoculum, assay
  incubation and inconsistent replicate descriptions were not independently resolved,
  so no fully populated activity observation is proposed. The exact Table1 ESBL versus
  susceptible K.pneumoniae distinction overrides loose source prose for future import.
- Efflux experiments are cellular fluorescence measurements with acknowledged optical-interference
  limitations. No purified target, genetic pump assignment, direct binding or human
  safety conclusion is established.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
