  support: supports
  summary: K was isolated as 0.5 mg from 3 L MS agar with 2 mM NaBr after 20 days.
    HRMS gave C30H27BrCl2O8, [M+H]+ observed 665.0334; the original assignment placed
    Br at C16 from 1H comparison with congener 10 and small downfield H26/H27 shifts.
    K-specific 13C/2D NMR or a K crystal is not reported in this SI. Producer S. formicae
    KY5 was grown on soya-flour mannitol agar at 30°C; I/J used extraction and repeated
    chromatographic purification from the standard MS culture. MICs used 1 mL LB without
    NaCl in 24-well plates, starting OD600 0.08–0.15, 40 µL stock in water or methanol,
    static 30°C overnight and absence of observable growth. VRE was E. faecium B16.06226;
    MRSA was an unnamed hospital patient isolate validated by the source-described
    test; B. subtilis laboratory strain identifier is not given. Exact antibiotic
    susceptibility cannot be generalized to the species.
