  accessed_at: '2026-10-21T16:29:46Z'
  support: context_only
  summary: The 2026 crystal series directly examines G,H,I,J,R,S and revises I while
    confirming J. K is not among those crystals; its two-methoxy E-ring does not carry
    the single-methoxy ambiguity corrected in I. The family stereochemical inference
    is relevant context but is not a K-specific absolute-configuration measurement.
