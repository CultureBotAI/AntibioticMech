limitations:
- The complete original abstract and selected official supporting-information pages
  were inspected; the original main-paper assay table and strain-level protocols remained
  inaccessible. No quantitative MIC objects are proposed from generalized activity
  wording.
- The spectral contents and compound 9 proton/HRESIMS pages were inspected. Carbon
  NMR and IR were identified in the contents, not independently reinterpreted; a complete
  de novo structure determination and experimental absolute configuration were not
  performed.
- Six chemical encodings agree on the full configured graph. The paper’s highlighted
  Snatzke experiment is for compound 7, not ethyl lansiolate compound 9.
- Independent Reaxys registry details remain unavailable despite the current ChEBI
  mapping.
- The original abstract identifies twig isolation. It does not by itself establish
  a plant biosynthetic pathway, natural concentration, clinical efficacy or a bacterial
  protein target.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
  do not replace full QC.
notes:
- No native gene, protein, pathway or molecular-target assertion triggers a structured
  iModulonDB lookup, and no protein-specific follow-up was undertaken.
- Standalone chemistry used the batch 019 interpreter against batch 042; native schema/strict
  checks and the source ledger used batch 042.
- No native record or scientific curation status was changed.
- Bundle completion is partial because full repository QC is unavailable on this runtime;
  the selected record was read and assessed in full. A saved review does not promote
  native scientific status.
