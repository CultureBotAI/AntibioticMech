summary: The native neutral cefonicid structure and checked chemical identifiers agree.
  One ChEBI-derived exact synonym places the mandelamido substituent at 6-beta instead
  of the supported 7-beta position. This bounded name error requires a reproducible
  correction. Original E. coli PBP experiments support optional target enrichment
  with competition, reagent-form and morphological-inference limits.
