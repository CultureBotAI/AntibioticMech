- evidence_id: pbp
  kind: primary_source
  reference: PMID:6376452; DOI:10.7164/antibiotics.37.572
  locator: Complete original pp572–576; Table 1 and Figure 2 page visually inspected.
  accessed_at: '2026-10-21T11:32:57Z'
  support: supports
  summary: E. coli K-12 KN126 membranes were tested by competition with benzyl-14C-penicillin
    and gel densitometry. Table 1 I50 values in micrograms/mL are PBP1a <0.25, 1b
    10, 2 90, 3 0.7, 4 26 and 5/6 >256. Direct radiolabeled cefonicid gel-slice scintillation
    corroborates binding to 1a/3; low specific activity limited fluorogram detection.
    Agar MIC was 0.4 micrograms/mL on Trypticase soy agar with a Steers replicator.
    These competition endpoints are not equilibrium Kd. Filamentation at/sub-MIC suggests
    a PBP3 inhibitory role, but does not isolate the full causal killing pathway.
    Radiolabeled material was supplied by SK&F; the bulk salt form is not specified.
