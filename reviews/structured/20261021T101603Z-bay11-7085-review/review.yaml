limitations:
- All ten adopted abstracts and2021 original Methods/Results were inspected. Original1997
  host paper is abstract-only; no exact selective host-binding audit was completed.
- The2023 TrxR manuscript was inspected selectively for exact parent screening and
  MIC/Methods, not every hybrid experiment or supplement. Its concentration/volume
  inconsistency limits quantitative target reuse.
- The2021 supplementary strain/resistance materials and raw images were not independently
  audited. The read does not establish universal resistance, clinical safety or efficacy.
- LINCS certificate failure and registry crosswalk-only validation remain explicit;
  no exhaustive drug-identity or clinical census was performed.
- Authoritative just qc failed during collection because pinned SciPy 1.15.3 has an
  invalid Mach-O section on this platform; the same version also failed under Python
  3.10 and in the fresh batch-002 environment. No dependency versions were changed.
  The supplementary test suite, closed-schema, reproduction and corpus-integrity checks
