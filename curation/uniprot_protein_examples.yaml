      Causal graph nodes are 23S rRNA (RNA_ELEMENT) and 50S subunit
      (CELLULAR_STRUCTURE), and PRIMARY_LITERATURE target is 50S ribosomal
      peptidyl-transferase center / nascent-peptide exit tunnel (RNA_ELEMENT).
