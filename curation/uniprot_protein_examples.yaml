schema_version: 1
task: uniprot_protein_examples_curation
curation_action: CURATED_UNIPROT_PROTEIN_EXAMPLES
retrieved_on: '2026-10-17'
scope_note: >-
  Curated UniProtKB ProteinExample entries for GENE_OR_PROTEIN causal-graph nodes
  and source: PRIMARY_LITERATURE protein/complex/viral molecular_targets where an
  exact experimental or explicitly scoped reference-strain UniProt accession,
  gene symbol, NCBI Taxon ID, and entry status are verified. Seeded CARD_ARO and
  BINDINGDB molecular_targets are never modified here; non-protein targets and
  records with unresolved strain/paralog/genotype ambiguity or frozen checkpoint
  pins are recorded in held_targets.

records:
  - identifier: CHEBI:100241
    label: ciprofloxacin
    path: data/antibiotics/antibacterial/ciprofloxacin.yaml
    changes: >-
      Added curated E. coli K-12 reference-strain UniProtKB protein examples for
      DNA gyrase (GyrA P0AES4, GyrB P0AES6) and topoisomerase IV (ParC P0AFI2,
      ParE P20083) on the ciprofloxacin_topoisomerase_poisoning causal graph nodes.
    causal_node_examples:
      - graph_id: ciprofloxacin_topoisomerase_poisoning
        node_id: dna_gyrase
        node_label: bacterial DNA gyrase
        protein_examples:
          - uniprot_id: UniProtKB:P0AES4
            protein_label: DNA gyrase subunit A
            gene_symbol: gyrA
            taxon_id: NCBITaxon:83333
            taxon_label: Escherichia coli (strain K12)
            entry_status: REVIEWED
            retrieved_on: '2026-10-17'
            role: >-
              Catalytic DNA cleavage-religation subunit A of the heterotetrameric
              A2B2 DNA gyrase complex stabilized as a ternary cleavage complex by
              ciprofloxacin in E. coli (PMID:9159526); K-12 reference proteome
              context.
          - uniprot_id: UniProtKB:P0AES6
            protein_label: DNA gyrase subunit B
            gene_symbol: gyrB
            taxon_id: NCBITaxon:83333
            taxon_label: Escherichia coli (strain K12)
            entry_status: REVIEWED
            retrieved_on: '2026-10-17'
            role: >-
              ATPase subunit B of the heterotetrameric A2B2 DNA gyrase complex
              targeted by ciprofloxacin in E. coli (PMID:9159526); K-12 reference
              proteome context.
      - graph_id: ciprofloxacin_topoisomerase_poisoning
        node_id: topoisomerase_iv
        node_label: bacterial topoisomerase IV
        protein_examples:
          - uniprot_id: UniProtKB:P0AFI2
            protein_label: DNA topoisomerase 4 subunit A
            gene_symbol: parC
            taxon_id: NCBITaxon:83333
            taxon_label: Escherichia coli (strain K12)
            entry_status: REVIEWED
            retrieved_on: '2026-10-17'
            role: >-
              Catalytic DNA breakage-reunion subunit ParC of the heterotetrameric
              ParC2ParE2 topoisomerase IV secondary fluoroquinolone target in
              E. coli (PMID:9159526); K-12 reference proteome context.
          - uniprot_id: UniProtKB:P20083
            protein_label: DNA topoisomerase 4 subunit B
            gene_symbol: parE
            taxon_id: NCBITaxon:83333
            taxon_label: Escherichia coli (strain K12)
            entry_status: REVIEWED
            retrieved_on: '2026-10-17'
            role: >-
              ATPase subunit ParE of the heterotetrameric ParC2ParE2 topoisomerase
